    explain: |
      Axios کلاینت HTTP است: از طرف برنامه به API‌ها درخواست می‌فرستد و چون هر درخواست یک Promise برمی‌گرداند، با `async/await` هم کار می‌کند. Express **سرور** را می‌سازد (طرف مقابل درخواست)، Socket.io برای ارتباط بلادرنگ دوطرفه است و Day.js برای کار با تاریخ.
  - level: medium
    stem: کدام جفت «پکیج ← کاربرد» **نادرست** است؟
    options:
