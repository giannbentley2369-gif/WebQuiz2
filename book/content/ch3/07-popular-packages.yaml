    explain: |
      Lodash مجموعه‌ی **توابع کمکی** برای آرایه‌ها، شیءها و… است («utility functions for arrays, objects, and more»). ارتباط دوطرفه‌ی بلادرنگ توصیف Socket.io است. سه جفت دیگر دقیقاً با متن اسلایدهای ۱۳ و ۱۴ می‌خوانند.
