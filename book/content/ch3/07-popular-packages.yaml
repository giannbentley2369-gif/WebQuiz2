    answer: 2
    explain: |
      اسلاید ۱۴: «Chalk: style and colorize terminal output»؛ مثلاً `chalk.green("Success!")`. Three.js برای گرافیک سه‌بعدی در مرورگر است، React برای رابط کاربری صفحه‌ی وب و Electron برای برنامه‌ی دسکتاپ؛ هیچ‌کدام برای رنگ‌آمیزی متن ترمینال نیستند.
  - level: medium
    stem: یک برنامه‌ی **چت** می‌سازیم که در آن پیام هر کاربر باید **همان لحظه** و بدون refresh برای بقیه نمایش داده شود و سرور هم بتواند خودش پیام را به کاربران بفرستد. کدام پکیج از اسلاید ۱۳ برای این کار ساخته شده است؟
    options:
      - 'Axios'
      - 'Lodash'
      - 'Day.js'
      - 'Socket.io'
    answer: 4
    explain: |
      اسلاید ۱۳: «Socket.io: real-time bidirectional communication for web apps». «بلادرنگ» یعنی پیام‌ها لحظه‌ای می‌رسند و «دوطرفه» یعنی سرور هم می‌تواند بدون درخواست کلاینت پیام بفرستد. Axios هم با شبکه کار می‌کند، ولی مدلش درخواست و پاسخ است و همیشه کلاینت شروع‌کننده است. Lodash و Day.js اصلاً کار شبکه‌ای نمی‌کنند.
  - level: medium
    stem: می‌خواهیم با همان HTML و CSS و JavaScript یک برنامه‌ی **دسکتاپ** بسازیم که روی Windows، macOS و Linux اجرا شود. کدام پکیج مناسب است؟
    options:
      - 'Electron'
      - 'React'
      - 'Three.js'
      - 'Express'
    answer: 1
    explain: |
      اسلاید ۱۴: «Electron: build cross-platform desktop apps with web technologies». Electron موتور Chromium و Node.js را ترکیب می‌کند (VS Code و Slack با آن ساخته شده‌اند). React فقط رابط کاربری صفحه‌ی وب را می‌سازد و به‌تنهایی برنامه‌ی دسکتاپ تولید نمی‌کند. Three.js برای سه‌بعدی در مرورگر و Express برای سرور است.
  - level: medium
    stem: '«**promise-based HTTP client for API requests**» توصیف کدام پکیج در اسلاید ۱۳ است؟'
    options:
      - 'Express'
      - 'Socket.io'
