      - 'Lodash ← ارتباط دوطرفه‌ی بلادرنگ برای برنامه‌های وب'
      - 'React ← ساختن رابط کاربری تعاملی با کامپوننت‌ها'
      - 'Moment.js / Day.js ← کار با تاریخ و زمان'
