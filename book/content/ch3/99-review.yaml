id: ch3-review
review: true
title: "آزمون جامع فصل سوم"
intro: |
  این آزمون **۲۴ پرسش ترکیبی** دارد؛ هر پرسش دو یا چند درس این فصل (Node.js، npm، bundling و TypeScript) را با هم درگیر می‌کند و بیشترشان سطح «سخت» دارند. پیشنهاد می‌کنیم مثل یک آزمون واقعی، حدود **۴۰ دقیقه** وقت بگذاری و بدون نگاه کردن به درسنامه‌ها جواب بدهی؛ بعد پاسخ تشریحی هر پرسش را با دقت بخوان، به‌خصوص پرسش‌هایی را که اشتباه زدی.
questions:
  - level: hard
    stem: |
      خروجی کد زیر در Node.js کدام است؟
    check: output
    code: |
      async function main() {
        console.log("A");
        setTimeout(() => console.log("T"), 0);
        const text = await Promise.resolve("data");
        console.log("B " + text);
        await new Promise((resolve) => setTimeout(resolve, 10));
        console.log("C");
      }
      main();
      console.log("D");
    options:
      - out: ["A", "B data", "C", "D", "T"]
      - out: ["A", "D", "T", "B data", "C"]
      - out: ["A", "D", "B data", "T", "C"]
      - out: ["A", "B data", "D", "T", "C"]
    answer: 3
    explain: |
      Node.js کد JavaScript را در **یک thread** اجرا می‌کند و `await` این thread را مسدود (block) نمی‌کند؛ فقط ادامه‌ی تابع `async` را به بعد موکول می‌کند. پس اول `A` چاپ می‌شود، `main` در اولین `await` متوقف می‌شود و کنترل به کد بیرونی برمی‌گردد که `D` را چاپ می‌کند. ادامه‌ی تابع بعد از `await` روی یک Promise حل‌شده یک **microtask** است و پیش از callback تایمر (حتی تایمر `0`) اجرا می‌شود؛ پس `B data` و بعد `T` می‌آید و در آخر، پس از ۱۰ میلی‌ثانیه، `C`. گزینه‌های ۱ و ۴ فکر کرده‌اند `await` برنامه را نگه می‌دارد یا همگام ادامه می‌دهد، و گزینه‌ی ۲ تایمر صفر را از ادامه‌ی `await` جلوتر دانسته است.

  - level: medium
    stem: |
      در شبکه‌ی ما registry اصلی npm در دسترس نیست و آدرس یک mirror به شکل `https://mirror.example.ir/npm/` داریم. می‌خواهیم `socket.io` را برای **اجرای سرور** و `jest` را برای **نوشتن تست** نصب کنیم، طوری که هر کدام در بخش درست `package.json` ثبت شود. کدام دنباله‌ی دستورها درست است؟
    options:
      - '`npm config set registry https://mirror.example.ir/npm/`، سپس `npm install socket.io` و `npm install -D jest`'
      - '`npm config get registry https://mirror.example.ir/npm/`، سپس `npm install socket.io jest`'
      - '`npm config set registry https://mirror.example.ir/npm/`، سپس `npm install -D socket.io jest`'
      - '`npm config set registry https://mirror.example.ir/npm/`، سپس `npm install -g socket.io` و `npm install -D jest`'
    answer: 1
    explain: |
      `npm config set registry <url>` آدرس registry را (در فایل `.npmrc` کاربر) عوض می‌کند تا دانلودها از mirror انجام شوند. `socket.io` هنگام **اجرای** سرور لازم است و باید با `npm install` در `dependencies` ثبت شود، ولی `jest` فقط در زمان توسعه برای اجرای تست‌ها لازم است و جایش `devDependencies` است (`-D`). گزینه‌ی ۲ با `config get` فقط آدرس فعلی را می‌خواند و چیزی را عوض نمی‌کند و هر دو پکیج را هم در `dependencies` می‌گذارد؛ گزینه‌ی ۳ `socket.io` را اشتباهاً وابستگی زمان توسعه کرده است؛ گزینه‌ی ۴ آن را با `-g` سراسری نصب می‌کند که نه در `package.json` ثبت می‌شود و نه در `node_modules` پروژه قرار می‌گیرد.

  - level: medium
    stem: |
      پروژه‌ی زیر را تازه از git گرفته‌ایم. پوشه‌های `node_modules` و `dist` در git نیستند، در `tsconfig.json` تنظیم `"outDir": "dist"` آمده و هیچ پکیجی به‌صورت سراسری (global) نصب نیست. کدام دنباله‌ی دستورها سرور را **با موفقیت** اجرا می‌کند؟
    lang: json
    code: |
      {
        "scripts": {
          "build": "tsc",
          "start": "node dist/server.js"
        },
        "dependencies": { "express": "^4.19.2" },
        "devDependencies": { "typescript": "^5.4.5" }
      }
    manual: npm commands cannot run in the automatic checker; the answer follows documented npm behaviour (scripts get node_modules/.bin on PATH, an interactive shell does not; tsc only writes dist when build runs).
    options:
      - '`npm run build`، سپس `npm start`'
      - '`npm install`، سپس `tsc` و بعد `npm start`'
      - '`npm install`، سپس `npm start`'
      - '`npm install`، سپس `npm run build` و بعد `npm start`'
    answer: 4
    explain: |
      در مخزن نه `node_modules` هست و نه پوشه‌ی خروجی `dist`. اول باید `npm install` همه‌ی وابستگی‌ها (از جمله `typescript` که در `devDependencies` است) را نصب کند، بعد `npm run build` با اجرای `tsc` فایل‌های JavaScript را در `dist` بسازد و در آخر `npm start` سرور را اجرا کند. گزینه‌ی ۱ بدون نصب، `tsc` را پیدا نمی‌کند. در گزینه‌ی ۲ تایپ مستقیم `tsc` در ترمینال کار نمی‌کند، چون فقط اسکریپت‌های npm (و `npx`) پوشه‌ی `node_modules/.bin` را در مسیر جست‌وجو می‌گذارند. در گزینه‌ی ۳ مرحله‌ی build جا افتاده و فایل `dist/server.js` اصلاً وجود ندارد.

  - level: medium
    stem: |
      با `package.json` زیر، پس از `npm install` دستور `npm start` را اجرا می‌کنیم. دستورهای واقعی به چه ترتیبی اجرا می‌شوند؟
    lang: json
    code: |
      {
        "scripts": {
          "prebuild": "echo cleaning",
          "build": "tsc",
          "prestart": "npm run build",
          "start": "node dist/app.js"
        },
        "devDependencies": { "typescript": "^5.4.5" }
      }
    manual: npm scripts cannot run in the automatic checker; verified with npm in a scratch project (tsc and node replaced by echo), npm start ran echo cleaning, then the build command, then the start command.
    options:
      - 'فقط `node dist/app.js`؛ اسکریپت‌های `pre` فقط با `npm run` اجرا می‌شوند، نه با `npm start`.'
      - '`tsc` و سپس `node dist/app.js`؛ `prebuild` اجرا نمی‌شود، چون `build` را اسکریپت دیگری صدا زده است، نه کاربر.'
      - '`node dist/app.js`، سپس `echo cleaning` و در آخر `tsc`.'
      - '`echo cleaning`، سپس `tsc` و در آخر `node dist/app.js`.'
    answer: 4
    explain: |
      npm برای **هر** اسکریپت، از جمله `start`، اول `pre<name>` را اجرا می‌کند. پس `npm start` ابتدا `prestart` یعنی `npm run build` را اجرا می‌کند؛ این خودش یک `npm run` کامل است و اول `prebuild` (`echo cleaning`) و بعد `build` (`tsc`) را اجرا می‌کند. پس از پایان `prestart`، نوبت خودِ `start` یعنی `node dist/app.js` است. گزینه‌ی ۱ فکر کرده hookها با `npm start` کار نمی‌کنند، گزینه‌ی ۲ فکر کرده `npm run` تودرتو hookهای خودش را اجرا نمی‌کند و گزینه‌ی ۳ «pre» را «بعد» فهمیده است.

  - level: hard
    stem: |
      سه فایل زیر در یک پوشه هستند. با اجرای `node app.js` چه چیزی چاپ می‌شود؟
    check: output
    files:
      package.json: |
        { "type": "module" }
      math.js: |
        export default function square(x) {
          return x * x;
        }
        export const name = "math";
      app.js: |
        import sq, { name } from "./math.js";
        import * as M from "./math.js";
        console.log(sq(3), name);
        console.log(typeof M.default, M.name === name, M.square);
    entry: app.js
    options:
      - out: ["9 math", "undefined true function"]
      - out: ["9 math", "function true undefined"]
      - out: ["!! SyntaxError"]
      - out: ["9 math", "function true function"]
    answer: 2
    explain: |
      فیلد `"type": "module"` در `package.json` باعث می‌شود Node.js همه‌ی فایل‌های `.js` این پوشه را ES Module بداند؛ پس `import` خطای SyntaxError نمی‌دهد (رد گزینه‌ی ۳) و خط اول `9 math` است. در `import * as M` همه‌ی exportها در یک شیء جمع می‌شوند و export پیش‌فرض با کلید **`default`** در آن قرار می‌گیرد، نه با نام داخلی تابع؛ پس `typeof M.default` برابر `function` است، `M.name === name` درست است و `M.square` برابر `undefined` است. گزینه‌های ۱ و ۴ فکر کرده‌اند نام داخلی تابع (`square`) هم export شده است.

  - level: hard
    stem: |
      یک پروژه‌ی front-end با TypeScript نوشته شده و با Webpack به یک فایل `bundle.js` تبدیل (bundle و minify) می‌شود. در این پروژه کلاس `Account` یک property به اسم `balance` با `private` دارد. کدام عبارت **نادرست** است؟
    options:
      - 'چون `balance` در TypeScript با `private` تعریف شده، در `bundle.js` نهایی هم پنهان است و کاربر از کنسول مرورگر نمی‌تواند آن را روی یک شیء `Account` ببیند.'
      - '`typescript` و `webpack` را معمولاً با `npm install -D` نصب می‌کنیم، چون فقط هنگام ساختن (build) لازم‌اند و کدی که در مرورگر اجرا می‌شود به آن‌ها نیازی ندارد.'
      - 'interfaceهای پروژه هیچ کدی در `bundle.js` تولید نمی‌کنند، چون tsc نوع‌ها را هنگام کامپایل کاملاً حذف می‌کند.'
      - 'tree-shaking تابع‌هایی را که از یک ES Module، export شده‌اند ولی هیچ جای برنامه استفاده نشده‌اند، در زمان ساختن (build) حذف می‌کند، نه در زمان اجرا در مرورگر.'
    answer: 1
    explain: |
      `private` فقط یک بررسی **زمان کامپایل** است؛ tsc آن را حذف می‌کند و در `bundle.js` نهایی `balance` یک property معمولی است که هر کسی در کنسول مرورگر می‌تواند ببیند و حتی تغییر دهد؛ minify کردن هم این را پنهان نمی‌کند (برای پنهان‌سازی واقعی باید از فیلد `#balance` خودِ JavaScript استفاده کرد). سه عبارت دیگر درست‌اند: ابزارهای ساخت مثل `typescript` و `webpack` وابستگی زمان توسعه‌اند، interfaceها پس از کامپایل هیچ اثری ندارند، و tree-shaking با تحلیل ایستای `import`/`export`ها در زمان build انجام می‌شود.

  - level: hard
    stem: |
      این سه فایل را اول با tsc کامپایل می‌کنیم و بعد خروجی JavaScript را با یک bundler که ES Moduleها را tree-shake و minify می‌کند (مثل Rollup) در یک فایل bundle می‌کنیم؛ نقطه‌ی شروع `app.ts` است. کدام عبارت درباره‌ی bundle نهایی **درست** است؟
    files:
      types.ts: |
        export interface User {
          name: string;
          age: number;
        }
      utils.ts: |
        import { User } from "./types.js";
        export function formatUser(u: User): string {
          return `${u.name} (${u.age})`;
        }
        export function parseUser(text: string): User {
          const parts = text.split(",");
          return { name: parts[0], age: Number(parts[1]) };
        }
      app.ts: |
        import { formatUser } from "./utils.js";
        import { User } from "./types.js";
        const u: User = { name: "Sara", age: 21 };
        console.log(formatUser(u));
    manual: Bundling cannot run in the automatic checker; tsc elides interfaces and type-only imports (types.ts compiles to an empty module), and Rollup/esbuild tree-shaking keeps only the used export formatUser.
    options:
      - '`formatUser` و `parseUser` هر دو در bundle می‌مانند، چون هر دو با `export` بیرون داده شده‌اند.'
      - '`formatUser` می‌ماند، `parseUser` حذف می‌شود و از `User` هیچ اثری نیست، چون interface همان هنگام کامپایل حذف شده است.'
      - '`parseUser` حذف می‌شود، ولی `User` به‌صورت یک شیء خالی در bundle می‌ماند، چون `app.ts` آن را import کرده است.'
      - 'هیچ چیزی حذف نمی‌شود، چون tree-shaking فقط روی کد JavaScript کار می‌کند و این فایل‌ها TypeScript هستند.'
    answer: 2
    explain: |
      tsc هنگام کامپایل، interface `User` و هر `import`ی را که فقط برای نوع استفاده شده کاملاً حذف می‌کند؛ پس از `User` هیچ کدی به bundler نمی‌رسد (رد گزینه‌ی ۳). bundler با تحلیل ایستای `import`/`export`ها می‌بیند که فقط `formatUser` استفاده شده و `parseUser` را با tree-shaking حذف می‌کند؛ `export` بودن به‌تنهایی دلیل ماندن نیست (رد گزینه‌ی ۱). bundler روی **خروجی JavaScript** کار می‌کند که همان `import`/`export` استاندارد را دارد، پس tree-shaking کاملاً ممکن است (رد گزینه‌ی ۴).

  - level: hard
    stem: |
      کد TypeScript زیر بدون خطا کامپایل می‌شود. خروجی اجرای آن چیست؟
    check: ts-output
    code: |
      interface Product {
        title: string;
        price: number;
      }
      const raw = '{"title":"Pen","price":"20"}';
      const p: Product = JSON.parse(raw);
      const total = p.price + 5;
      console.log(total);
      console.log(typeof p.price, p.price * 2);
    options:
      - out: ["25", "number 40"]
      - out: ["!! TypeError"]
      - out: ["25", "string 40"]
      - out: ["205", "string 40"]
    answer: 4
    explain: |
      annotationها و interfaceها در زمان اجرا وجود ندارند و `JSON.parse` نوع `any` برمی‌گرداند؛ پس tsc به `p: Product` اعتماد می‌کند و هیچ تبدیلی هم انجام نمی‌شود. در واقعیت `p.price` رشته‌ی `"20"` است: `"20" + 5` الحاق رشته‌ای است و `"205"` می‌شود، `typeof p.price` برابر `string` است و `"20" * 2` با تبدیل ضمنی به عدد `40` می‌شود. گزینه‌های ۱ و ۳ فکر کرده‌اند TypeScript مقدار را به عدد تبدیل می‌کند و گزینه‌ی ۲ فکر کرده نوع‌ها در زمان اجرا بررسی می‌شوند و خطا می‌دهند.

  - level: hard
    stem: |
      با تابع زیر، کدام گزینه **خطای کامپایل** دارد؟
    check: option-tsc
    code: |
      function parse(json: string): unknown {
        return JSON.parse(json);
      }
    prelude: |
      function parse(json: string): unknown {
        return JSON.parse(json);
      }
    options:
      - code: |
          const v = parse("5");
          if (typeof v === "number") console.log(v + 1);
      - code: |
          const v: any = parse("[1, 2]");
          console.log(v.length);
      - code: |
          const v = parse("[1, 2]");
          console.log(v.length);
      - code: |
          const v = parse('"hi"');
          if (typeof v === "string") console.log(v.toUpperCase());
    answer: 3
    explain: |
      مقدار `unknown` را تا وقتی نوعش را باریک (narrow) نکرده‌ایم نمی‌توان استفاده کرد؛ پس `v.length` در گزینه‌ی ۳ خطای TS18046 دارد. در گزینه‌های ۱ و ۴، شرط `typeof` نوع را به `number` یا `string` باریک کرده است. در گزینه‌ی ۲، مقدار `unknown` به متغیری از نوع `any` داده شده که مجاز است و از آن به بعد tsc هیچ بررسی‌ای روی `v` انجام نمی‌دهد. تفاوت مهم همین است: `any` بررسی را خاموش می‌کند، ولی `unknown` تا قبل از بررسی نوع اجازه‌ی هیچ استفاده‌ای نمی‌دهد.

  - level: medium
    stem: |
      کدام بدنه را می‌توان در جای خالی نوشت تا تابع زیر **بدون خطا** کامپایل شود؟
    check: option-tsc
    want: ok
    code: |
      function len(x: string | string[] | number): number {
        ______
      }
    options:
      - text: '`return x.length;`'
        code: |
          function len(x: string | string[] | number): number {
            return x.length;
          }
      - text: '`if (typeof x === "number") return x; return x.length;`'
        code: |
          function len(x: string | string[] | number): number {
            if (typeof x === "number") return x;
            return x.length;
          }
      - text: '`if (typeof x === "string") return x.length; return x.length;`'
        code: |
          function len(x: string | string[] | number): number {
            if (typeof x === "string") return x.length;
            return x.length;
          }
      - text: '`if (typeof x !== "number") return x.length;`'
        code: |
          function len(x: string | string[] | number): number {
            if (typeof x !== "number") return x.length;
          }
    answer: 2
    explain: |
      در union `string | string[] | number` فقط `string` و `string[]` ویژگی `length` دارند. گزینه‌ی ۲ اول حالت `number` را با `typeof` جدا و برمی‌گرداند؛ پس در خط بعد نوع `x` به `string | string[]` باریک شده و `x.length` مجاز است. گزینه‌ی ۱ روی کل union سراغ `length` رفته که برای `number` وجود ندارد؛ در گزینه‌ی ۳ بعد از جدا کردن `string` هنوز `number` در نوع باقی است؛ در گزینه‌ی ۴ وقتی `x` عدد باشد تابع به انتها می‌رسد و چیزی برنمی‌گرداند، در حالی که نوع خروجی `number` است (خطای TS2366).

  - level: hard
    stem: |
      خروجی کد زیر پس از کامپایل و اجرا چیست؟
    check: ts-output
    code: |
      function fmt(value: number | string, ...tags: string[]): string {
        const base = typeof value === "number" ? value.toFixed(1) : value.toUpperCase();
        return tags.length > 0 ? `${base} [${tags.join("|")}]` : base;
      }
      function show(label: string, sep = ": ", value?: number | string): void {
        console.log(label + sep + (value || "none"));
      }
      console.log(fmt(3));
      console.log(fmt("ok", "a", "b"));
      show("x", undefined, 0);
      show("y", "-");
    options:
      - out: ["3.0", "OK [a|b]", "xundefined0", "y-none"]
      - out: ["3.0", "OK [a|b]", "x: 0", "y-none"]
      - out: ["3.0 []", "OK [a|b]", "x: none", "y-none"]
      - out: ["3.0", "OK [a|b]", "x: none", "y-none"]
    answer: 4
    explain: |
