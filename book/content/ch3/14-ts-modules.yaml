  - level: medium
    stem: |
      با اجرای `node main.mjs` چه چیزی چاپ می‌شود؟
    check: output
    files:
      math.mjs: |
        export const PI = 3.14;
        export function add(a, b) {
          return a + b;
        }
        const secret = 42;
        export function useSecret() {
          return secret;
        }
      main.mjs: |
        import * as MathUtils from "./math.mjs";
        import { add as sum } from "./math.mjs";
        console.log(MathUtils.PI, sum(4, 5));
        console.log(MathUtils.useSecret(), MathUtils.secret);
    entry: main.mjs
    options:
      - out: ["3.14 9", "42 42"]
      - out: ["3.14 9", "!! ReferenceError"]
      - out: ["undefined 9", "42 undefined"]
      - out: ["3.14 9", "42 undefined"]
    answer: 4
    explain: |
      `MathUtils` شیئی است که فقط exportهای `math.mjs` را دارد: `MathUtils.PI` برابر `3.14` است و `sum` همان `add` با اسم جدید است (`9`). `useSecret()` چون داخل همان فایل تعریف شده به `secret` دسترسی دارد و `42` برمی‌گرداند، ولی `secret` export نشده و در `MathUtils` نیست؛ خواندن property ناموجود از یک شیء `undefined` می‌دهد، نه `ReferenceError` (گزینه‌ی ۲). گزینه‌ی ۱ فکر کرده چیزهای export‌نشده هم دیده می‌شوند.
  - level: medium
    stem: |
      کدام گزینه درباره‌ی CommonJS و ES Modules در Node.js **درست** است؟
    options:
      - '`require` و `module.exports` مربوط به سیستم ES Modules هستند.'
      - 'با نوشتن `"type": "module"` در `package.json` (یا استفاده از پسوند `.mjs`)، فایل‌ها به‌صورت ES Module اجرا می‌شوند.'
      - 'پسوند `.cjs` یعنی فایل حتماً به‌صورت ES Module اجرا می‌شود.'
      - 'در یک ES Module می‌توان بدون هیچ تنظیمی از `require` استفاده کرد.'
    answer: 2
    explain: |
      در Node.js فایل `.mjs` همیشه ESM است و فایل `.js` وقتی ESM است که `package.json` فیلد `"type": "module"` داشته باشد. `require`/`module.exports` مال **CommonJS** هستند (گزینه‌ی ۱ غلط) و `.cjs` دقیقاً یعنی «این فایل CommonJS است» (گزینه‌ی ۳ غلط). در یک ES Module تابع `require` اصلاً تعریف نشده و صدا زدنش `ReferenceError` می‌دهد (گزینه‌ی ۴ غلط).
  - level: medium
    stem: |
      با اجرای `node main.cjs` چه چیزی چاپ می‌شود؟
    check: output
    files:
      math.cjs: |
        function add(a, b) {
          return a + b;
        }
        const PI = 3.14;
        const secret = 42;
        module.exports = { add, PI };
      main.cjs: |
        const { add, PI } = require("./math.cjs");
        const math = require("./math.cjs");
        console.log(add(2, 3), math.PI, math.secret);
    entry: main.cjs
    options:
      - out: "5 3.14 undefined"
      - out: "5 3.14 42"
      - out: "23 3.14 undefined"
      - out: ["!! ReferenceError"]
    answer: 1
    explain: |
      در CommonJS هر چیزی که در `module.exports` بگذاری صادر می‌شود و `require` همان شیء را برمی‌گرداند. `add(2, 3)` عدد `5` است (هر دو عدد هستند، پس الحاق رشته‌ای رخ نمی‌دهد)، `math.PI` برابر `3.14` است و `secret` چون در `module.exports` نیست، روی شیء وجود ندارد و `undefined` می‌دهد. CommonJS هم مثل ESM به هر فایل scope خصوصی می‌دهد، و در فایل `.cjs` تابع `require` کاملاً تعریف‌شده است (گزینه‌ی ۴ غلط).
