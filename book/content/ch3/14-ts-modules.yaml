    explain: |
      `main.mjs` یک ES Module است و در ESM تابع `require` (که مال CommonJS است) وجود ندارد؛ پس خط ۲ خطای `ReferenceError: require is not defined in ES module scope` می‌دهد. import خط ۱ کاملاً درست است و خط ۳ اصلاً به اجرا نمی‌رسد. در ESM باید نوشت `import fs from "fs";`.
  - level: medium
    stem: |
      کدام خط کد زیر خطای کامپایل دارد؟
    check: tsc-line
