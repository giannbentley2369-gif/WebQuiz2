    answer: 4
    explain: |
      `import * as M` فقط exportها را در شیء `M` جمع می‌کند. `secret` export نشده، پس `M.secret` در خط ۵ خطای **TS2339** (`Property 'secret' does not exist on type 'typeof import(...)'`) می‌دهد. `M.useSecret()` در خط ۴ مجاز است، چون خودِ تابع export شده و داخل فایل خودش به `secret` دسترسی دارد. تعریف `secret` در `math.ts` هم خطا نیست؛ فقط خصوصی است.
  - level: hard
    stem: |
      در مرورگر، صفحه‌ی زیر سه تگ `<script>` معمولی (غیر ماژول) دارد. در کنسول چه چیزی چاپ می‌شود؟
    check: dom-output
    html: |
      <script>
        let counter = 1;
        console.log("first", counter);
      </script>
      <script>
        let counter = 2;
        console.log("second", counter);
      </script>
      <script>
        console.log("third", counter);
      </script>
    options:
      - out: ["first 1", "second 2", "third 2"]
      - out: ["first 1", "!! SyntaxError", "third 1"]
      - out: ["first 1", "second 2", "!! ReferenceError"]
      - out: ["first 1", "!! SyntaxError"]
    answer: 2
    explain: |
      اسکریپت‌های معمولی ماژول نیستند و همه یک scope سراسری مشترک دارند. اسکریپت دوم دوباره `let counter` تعریف می‌کند و **کل آن اسکریپت** با `SyntaxError: Identifier 'counter' has already been declared` اجرا نمی‌شود. خطای یک اسکریپت بقیه را متوقف نمی‌کند (گزینه‌ی ۴ غلط)، و اسکریپت سوم `counter` سراسری اسکریپت اول را می‌بیند: `third 1`. گزینه‌های ۱ و ۳ فرض کرده‌اند هر اسکریپت scope خصوصی دارد، که فقط برای ماژول‌ها (مثلاً `<script type="module">`) درست است.
