    files:
      a.ts: |
        let counter = 1;
      b.ts: |
        let counter = 2;
    manual: "سامانه‌ی بررسی خودکار به هر فایل TypeScript بدون import/export یک `export {}` اضافه می‌کند و با `--module nodenext` (که هر فایل را ماژول حساب می‌کند) کامپایل می‌کند؛ پس این حالت قابل بررسی خودکار نیست. با `tsc --strict --target es2022 --module esnext a.ts b.ts` (TypeScript 7.0.2) به‌صورت دستی بررسی شد: خطای TS2451 در هر دو فایل؛ با افزودن `export {};` خطا از بین رفت."
    options:
      - 'هیچ خطایی رخ نمی‌دهد، چون هر فایل scope خصوصی خودش را دارد.'
      - 'خطایی در کامپایل رخ نمی‌دهد و فقط هنگام اجرا `ReferenceError` می‌گیریم.'
      - 'خطای TS2451 (تعریف دوباره‌ی متغیر `counter`) گزارش می‌شود، چون فایل‌های بدون import/export «script» هستند و scope مشترک دارند.'
      - 'خطایی رخ نمی‌دهد و مقدار `counter` در فایل دوم، بی‌صدا مقدار فایل اول را عوض می‌کند.'
    answer: 3
    explain: |
      طبق اسلاید ۲۳ «ماژول فایلی است که import یا export دارد»؛ این دو فایل هیچ‌کدام را ندارند، پس **script** هستند و متغیرهای سطح بالایشان در یک scope مشترک قرار می‌گیرند. دو `let` با یک اسم در یک scope مجاز نیست و `tsc` روی هر دو فایل خطای **TS2451** (`Cannot redeclare block-scoped variable 'counter'`) می‌دهد. scope خصوصی (گزینه‌ی ۱) فقط وقتی برقرار است که فایل‌ها ماژول باشند، مثلاً با افزودن `export {};`. گزینه‌های ۲ و ۴ هم غلط‌اند چون خطا همان موقع کامپایل گرفته می‌شود و `let` اجازه‌ی تعریف دوباره نمی‌دهد.
