      `readonly` روی **ویژگی** `url` است؛ پس تغییر `c.url` حتی وقتی `c` با `let` تعریف شده خطای TS2540 دارد (گزینه‌ی ۳). در گزینه‌ی ۱ ویژگی غیر readonly تغییر کرده که مجاز است، حتی با `const`. در گزینه‌ی ۲ کل متغیر `let` به یک شیء کاملاً جدید اشاره داده شده؛ این انتساب دوباره‌ی متغیر است، نه تغییر ویژگی readonly. گزینه‌ی ۴ هم فقط مقدار را می‌خواند.

