    prelude: &greeter |
      interface Greeter {
        greet(name: string): string;
      }
    code: *greeter
    options:
      - code: 'const g: Greeter = { greet: (n) => "Hi " + n };'
      - code: 'const g: Greeter = { greet(n: string) { return "Hi " + n; } };'
      - code: 'const g: Greeter = { greet: () => "Hi" };'
      - code: 'const g: Greeter = { greet: (n: string) => n.length };'
    answer: 4
    explain: |
      متد `greet` طبق interface باید رشته برگرداند، اما در گزینه‌ی ۴ عدد (`n.length`) برمی‌گرداند؛ پس خطای TS2322 دارد. در گزینه‌ی ۱ نوع `n` از روی interface فهمیده می‌شود و لازم نیست نوشته شود. گزینه‌ی ۲ همان امضا را صریح نوشته است. گزینه‌ی ۳ هم مجاز است: تابعی که پارامتر کمتری می‌گیرد (و آن را نادیده می‌گیرد) جای تابعی با پارامتر بیشتر می‌نشیند، چون فقط خروجی رشته‌ای لازم است.

  - level: medium
    stem: کدام گزینه درباره‌ی `type` و `interface` **نادرست** است؟
    options:
      - هر دو می‌توانند شکل یک شیء را توصیف کنند.
      - با `type` می‌شود به یک union نام داد؛ مثل `type ID = number | string;`.
      - با interface هم می‌شود مستقیماً یک union از نوع‌های ساده مثل `number | string` تعریف کرد.
      - یک interface می‌تواند با `extends` از interface دیگری گسترش پیدا کند.
    answer: 3
    explain: |
      interface فقط برای توصیف شکل شیء (و متدهایش) است و نمی‌شود با آن به `number | string` نام داد؛ برای این کار باید از `type` استفاده کرد. پس گزینه‌ی ۳ نادرست است. گزینه‌ی ۱ درست است (`type Point = { x: number; y: number }` هم شکل شیء است)، گزینه‌ی ۲ مثال درست type alias است و گزینه‌ی ۴ همان بولت آخر اسلاید ۱۹.

  - level: hard
    stem: کدام گزینه **بدون خطا** کامپایل می‌شود؟
    check: option-tsc
    want: ok
    options:
      - code: 'type A = { x: number }; type A = { y: number };'
      - code: 'type C = { x: number }; const c: C = { x: 1, y: 2 };'
      - code: 'interface D { x: number } const d: D = { y: 2 };'
      - code: 'interface B { x: number } interface B { y: number } const b: B = { x: 1, y: 2 };'
    answer: 4
    explain: |
      دو interface هم‌نام با هم **ادغام** می‌شوند (declaration merging)، پس `B` هم `x` دارد و هم `y` و گزینه‌ی ۴ بی‌خطاست. اما type alias را نمی‌شود دو بار تعریف کرد و گزینه‌ی ۱ خطای `Duplicate identifier 'A'` دارد. در گزینه‌ی ۲ بررسی ویژگی اضافه برای type alias هم انجام می‌شود (`y` در `C` نیست). در گزینه‌ی ۳ هم ویژگی اجباری `x` جا افتاده و `y` اضافه است.

  - level: easy
    stem: در جای خالی کد زیر کدام گزینه قرار گیرد تا کد **بدون خطا** کامپایل شود؟
    check: option-tsc
    want: ok
    code: |
      interface Product {
        title: string;
        price______ number;
      }
      const p: Product = { title: "Book" };
    options:
      - text: '`:`'
        code: |
          interface Product {
            title: string;
            price: number;
          }
          const p: Product = { title: "Book" };
      - text: '`?:`'
        code: |
          interface Product {
            title: string;
            price?: number;
          }
          const p: Product = { title: "Book" };
      - text: '`!:`'
        code: |
          interface Product {
            title: string;
            price!: number;
          }
          const p: Product = { title: "Book" };
      - text: '`=`'
        code: |
          interface Product {
            title: string;
            price = number;
          }
          const p: Product = { title: "Book" };
    answer: 2
    explain: |
      شیء `p` ویژگی `price` را ندارد، پس `price` باید **اختیاری** باشد: `price?: number;`. با `:` ساده، `price` اجباری است و خطای TS2741 (جا افتادن ویژگی) رخ می‌دهد. `!:` و `=` در interface اصلاً نوشتن مجازی نیستند و خطای نحوی (syntax error) دارند؛ interface فقط نوع را می‌گوید و مقدار پیش‌فرض نمی‌گیرد.
