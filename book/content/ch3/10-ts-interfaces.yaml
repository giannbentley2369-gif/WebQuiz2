  - level: easy
    stem: کدام گزینه درباره‌ی کلمه‌های `extends` و `implements` درست است؟
    options:
      - کلاس با `extends` یک interface را پیاده‌سازی می‌کند و interface با `implements` از interface دیگر گسترش می‌یابد.
      - interface با `extends` از interface دیگر گسترش می‌یابد و کلاس با `implements` قرارداد یک interface را پیاده‌سازی می‌کند.
      - این دو کلمه دقیقاً یک معنی دارند و می‌شود هر کدام را به‌جای دیگری نوشت.
      - '`implements` فقط در JavaScript وجود دارد و `extends` فقط در TypeScript.'
    answer: 2
    explain: |
      طبق اسلاید ۱۹، interface را می‌شود extend کرد (`interface Admin extends User`) و کلاس‌ها interface را implement می‌کنند (`class Customer implements User`). گزینه‌ی ۱ برعکس است؛ اگر کلاسی بخواهد interface را extend کند، tsc می‌گوید: `Cannot extend an interface 'User'. Did you mean 'implements'?`. پس این دو کلمه جایگزین هم نیستند (گزینه‌ی ۳). گزینه‌ی ۴ هم غلط است: `extends` برای ارث‌بری کلاس‌ها در خود JavaScript هم هست، اما `implements` فقط در TypeScript وجود دارد.

