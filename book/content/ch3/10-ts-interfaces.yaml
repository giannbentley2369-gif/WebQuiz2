  - level: medium
    stem: |
      فایلی که فقط شامل interface اسلاید ۱۹ (یعنی `interface User { id: number; name: string; email?: string; }`) است با tsc کامپایل می‌شود. در فایل JavaScript خروجی چه می‌بینیم؟
    options:
      - یک کلاس به نام `User` با یک constructor
      - یک شیء به نام `User` که نوع هر ویژگی را نگه می‌دارد
      - تابعی که نوع شیءها را در زمان اجرا بررسی می‌کند
      - هیچ اثری از interface؛ فقط خطی مثل `"use strict";`
    answer: 4
    explain: |
      interfaceها فقط برای کامپایلرند و در خروجی کاملاً پاک می‌شوند (type erasure)؛ خروجی کامپایل فایل اسلاید فقط `"use strict";` است. TypeScript نه کلاسی می‌سازد (گزینه‌ی ۱)، نه شیئی برای نگه داشتن نوع‌ها (گزینه‌ی ۲) و نه کدی برای بررسی در زمان اجرا (گزینه‌ی ۳).

  - level: hard
    stem: کد TypeScript زیر بدون خطا کامپایل می‌شود. خروجی اجرای آن چیست؟
    check: ts-output
    code: |
      interface User {
        id: number;
        name: string;
      }
      const data = { id: 1, name: "Ali", age: 30 };
      const u: User = data;
      console.log(u);
    options:
      - out: "{ id: 1, name: 'Ali' }"
      - out: "User { id: 1, name: 'Ali' }"
      - out: "{ id: 1, name: 'Ali', age: 30 }"
      - out: "!! TypeError"
    answer: 3
    explain: |
      نسبت دادن `data` به `User` مجاز است، چون `data` یک متغیر است (نه object literal مستقیم) و ویژگی‌های لازم را دارد. اما نوع‌ها در زمان اجرا وجود ندارند و چیزی را از شیء حذف نمی‌کنند؛ `u` و `data` به یک شیء اشاره می‌کنند که هنوز `age` را دارد. گزینه‌ی ۱ فکر کرده interface ویژگی‌های اضافه را پاک می‌کند. گزینه‌ی ۲ فکر کرده interface مثل کلاس نامی روی شیء می‌گذارد. گزینه‌ی ۴ هم غلط است، چون هیچ بررسی‌ای در زمان اجرا انجام نمی‌شود.

  - level: hard
    stem: با فرض interface زیر، کدام گزینه خطای کامپایل دارد؟
