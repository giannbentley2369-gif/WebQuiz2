id: ch3-ts-functions
title: "توابع در TypeScript"
slides: "NodeJS & TS، اسلاید ۲۰"
lesson: |
  تابع‌ها قلب هر برنامه‌اند. در JavaScript هر تابعی را می‌شد با هر تعداد آرگومان و با هر نوعی صدا زد و اشتباه‌ها فقط در زمان اجرا معلوم می‌شد. اسلاید ۲۰ نشان می‌دهد TypeScript چطور به تابع‌ها نوع اضافه می‌کند. در این درس هم حالت strict را فرض می‌کنیم.

  ::: analogy
  یک تابع را مثل **دستگاه آب‌میوه‌گیری** تصور کن: روی دهانه‌ی ورودی نوشته «فقط پرتقال» و روی خروجی نوشته «آب پرتقال». TypeScript نگهبانی است که نمی‌گذارد کسی سنگ در دستگاه بیندازد و به کسی که منتظر آب پرتقال است، چیز دیگری تحویل بدهد.
  :::

  ### ۱. پارامترهای نوع‌دار و نوع خروجی
  بولت اول اسلاید: تابع‌ها **typed parameters** (پارامترهای نوع‌دار) و **return type** (نوع مقدار برگشتی) دارند تا ایمن باشند. نوع هر پارامتر بعد از نامش و نوع خروجی بعد از پرانتز بسته نوشته می‌شود:

  ```ts
  function add(a: number, b: number): number {
    return a + b;
  }
  console.log(add(2, 3)); // 5
  ```

  حالا tsc هر فراخوانی را بررسی می‌کند:

  ```ts
  function add(a: number, b: number): number {
    return a + b;
  }
  add("2", 3);  // Error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.
  add(1);       // Error TS2554: Expected 2 arguments, but got 1.
  add(1, 2, 3); // Error TS2554: Expected 2 arguments, but got 3.
  ```

  برخلاف JavaScript (که آرگومانِ جاافتاده را `undefined` می‌کرد و آرگومان اضافه را نادیده می‌گرفت)، در TypeScript **تعداد آرگومان‌ها** هم بررسی می‌شود.

  بدنه‌ی تابع هم باید با نوع خروجی جور باشد:

  ```ts
  function label(n: number): string {
    return n; // Error TS2322: Type 'number' is not assignable to type 'string'.
  }
  function sign(x: number): string { // Error TS2366: Function lacks ending return statement and return type does not include 'undefined'.
    if (x > 0) return "positive";
    if (x < 0) return "negative";
  }
  ```

  در `sign` اگر `x` صفر باشد، تابع به هیچ `return`ی نمی‌رسد و `undefined` برمی‌گرداند؛ tsc همین را تشخیص می‌دهد و خطا را روی سطر تعریف تابع (جایی که نوع خروجی نوشته شده) گزارش می‌کند.

  #### نوع void
  اگر تابع هیچ مقداری برنمی‌گرداند، نوع خروجی‌اش **`void`** («هیچ مقداری») است:

  ```ts
  function logIt(msg: string): void {
    console.log("LOG: " + msg);
  }
  const result = logIt("hi"); // prints: LOG: hi
  console.log(result);        // undefined
  ```

  در زمان اجرا، تابعی که `return` ندارد `undefined` برمی‌گرداند. برگرداندن یک مقدار از تابع `void` هم خطاست؛ مثلاً `return 5;` در چنین تابعی خطای `Type 'number' is not assignable to type 'void'` دارد.

  #### استنتاج نوع خروجی (return type inference)
  اگر نوع خروجی را ننویسی، TypeScript آن را از روی `return`ها **استنتاج** می‌کند:

  ```ts
  function multiply(a: number, b: number) { // inferred return type: number
    return a * b;
  }
  const n: number = multiply(2, 3); // OK
  const s: string = multiply(2, 3); // Error TS2322: Type 'number' is not assignable to type 'string'.
  ```

  اما نوع **پارامترها** را نمی‌تواند حدس بزند. در حالت strict، پارامتر بی‌نوع خطا دارد، چون به‌طور ضمنی `any` می‌شد (به این قاعده noImplicitAny می‌گویند):

  ```ts
  function half(n) { // Error TS7006: Parameter 'n' implicitly has an 'any' type.
    return n / 2;
  }
  ```

  ### ۲. مثال اسلاید ۲۰: تابع createUser
  کد خود اسلاید (فایل `weee.ts`):

  ```ts title=weee.ts
  function createUser(
    name: string,
    age: number,
    ...hobbies: string[]
  ): { name: string; age: number; hobbies: string[] } {
    return {
      name,
      age,
      hobbies,
    };
  }

  const user = createUser("Alice", 30, "Reading", "Cycling");
  console.log(user);
  ```

  خروجی:

  ```text
  { name: 'Alice', age: 30, hobbies: [ 'Reading', 'Cycling' ] }
  ```

  خط به خط:
  - `name: string` و `age: number` دو پارامتر اجباری‌اند.
  - `...hobbies: string[]` یک **rest parameter** است (توضیح کامل در بخش ۵): همه‌ی آرگومان‌های بعدی را در یک آرایه‌ی رشته‌ای جمع می‌کند. اینجا `"Reading"` و `"Cycling"` در `hobbies` قرار می‌گیرند.
  - `): { name: string; age: number; hobbies: string[] }` نوع خروجی است: شیئی با سه ویژگی. این نوع همان‌جا (inline) نوشته شده و اعضایش با `;` از هم جدا شده‌اند؛ به‌جایش می‌شد یک interface هم تعریف کرد.
  - `return { name, age, hobbies, };` از **shorthand property** (خلاصه‌نویسی ویژگی) استفاده می‌کند: `name` یعنی `name: name`. ویرگول آخر (trailing comma) هم مجاز است.

  JavaScriptی که tsc از این فایل می‌سازد، همان کد بدون نوع‌هاست:

  ```js title=weee.js
  "use strict";
  function createUser(name, age, ...hobbies) {
      return {
          name,
          age,
          hobbies,
      };
  }
  const user = createUser("Alice", 30, "Reading", "Cycling");
  console.log(user);
  ```

  چند فراخوانی دیگر از همین تابع:

  | فراخوانی | نتیجه |
  |---|---|
  | `createUser("Bob", 25)` | `{ name: 'Bob', age: 25, hobbies: [] }`؛ بدون آرگومان اضافه، `hobbies` آرایه‌ی **خالی** است |
  | `createUser("Ali")` | خطای TS2555: `Expected at least 2 arguments, but got 1.` |
  | `createUser("Ali", "20")` | خطای TS2345: `"20"` رشته است، نه عدد |
  | `createUser("Ali", 20, "Chess", 5)` | خطای TS2345: هر آرگومانِ rest باید رشته باشد |

  به کلمه‌ی `at least` (دست‌کم) در پیام دقت کن: چون rest parameter هر تعدادی آرگومان می‌پذیرد، tsc فقط حداقل تعداد را می‌گوید.

  ### ۳. پارامتر اختیاری (optional parameter)
  بولت دوم اسلاید: تابع‌ها می‌توانند پارامتر **اختیاری** و **پیش‌فرض** داشته باشند. پارامتر اختیاری با `?` بعد از نامش مشخص می‌شود و اگر فرستاده نشود، مقدارش `undefined` است؛ پس نوعش داخل تابع `string | undefined` است:

  ```ts
  function greet(person: string, greeting?: string): string {
    if (greeting === undefined) {
      return `Hello, ${person}`;
    }
    return `${greeting}, ${person}`;
  }
  console.log(greet("Ali"));          // Hello, Ali
  console.log(greet("Ali", "Salam")); // Salam, Ali
  ```

  - `greet()` خطا دارد: `Expected 1-2 arguments, but got 0.` (یعنی «یک تا دو آرگومان»).
  - استفاده‌ی مستقیم از پارامتر اختیاری بدون بررسی (مثلاً `greeting.toUpperCase()`) خطای `'greeting' is possibly 'undefined'` دارد.
  - **پارامتر اختیاری باید بعد از پارامترهای اجباری بیاید:**

  ```ts
  function wrongOrder(a?: number, b: number) {} // Error TS1016: A required parameter cannot follow an optional parameter.
  ```

  ### ۴. پارامتر پیش‌فرض (default parameter)
  به پارامتر می‌شود یک **مقدار پیش‌فرض** داد. اگر آرگومان فرستاده نشود (یا `undefined` فرستاده شود)، همان مقدار به کار می‌رود:

  ```ts
  function greet2(person: string, greeting = "Hi"): string {
    return `${greeting}, ${person}`;
  }
  console.log(greet2("Ali"));            // Hi, Ali
  console.log(greet2("Ali", "Salam"));   // Salam, Ali
  console.log(greet2("Ali", undefined)); // Hi, Ali  (undefined triggers the default)
  console.log(greet2("Ali", ""));        // , Ali    (an empty string is a real value)
  ```

  - پارامتر پیش‌فرض خودبه‌خود **اختیاری** است و نوعش از روی مقدار پیش‌فرض استنتاج می‌شود؛ پس `greet2("Ali", 5)` خطا دارد، چون `5` رشته نیست.
  - یک پارامتر نمی‌تواند هم `?` داشته باشد و هم مقدار پیش‌فرض: `b?: number = 5` خطای `Parameter cannot have question mark and initializer` دارد.
  - برخلاف `?` که در خروجی پاک می‌شود، مقدار پیش‌فرض یک امکان خودِ JavaScript است و در خروجی می‌ماند: `function greet2(person, greeting = "Hi")`.

  ::: info بیشتر بدانیم
  اگر پارامتر پیش‌فرض **قبل از** یک پارامتر اجباری بیاید، دیگر اختیاری حساب نمی‌شود و برای استفاده از مقدار پیش‌فرض باید صریحاً `undefined` بفرستی:

  ```ts
  function f(a = 1, b: number): number {
    return a + b;
  }
  f(undefined, 5); // OK: returns 6
  f(5);            // Error TS2554: Expected 2 arguments, but got 1.
  ```
  :::

  ### ۵. پارامتر rest (rest parameter)
  بولت سوم اسلاید: **rest parameter** (پارامترِ «بقیه») برای تابع‌هایی است که **تعداد آرگومان‌هایشان متغیر است** (variable-length arguments). سه نقطه‌ی `...` قبل از نام پارامتر یعنی «همه‌ی آرگومان‌های باقی‌مانده را در یک آرایه جمع کن»:

  ```ts
  function sum(...nums: number[]): number {
    return nums.reduce((total, n) => total + n, 0);
  }
  console.log(sum());            // 0  (nums is an empty array)
  console.log(sum(1, 2, 3));     // 6
  console.log(sum(...[10, 20])); // 30 (spread an array into the arguments)
  ```

  قاعده‌ها:
  - نوع rest parameter باید **آرایه** باشد (`number[]`)؛ نوشتن `...nums: number` خطای `A rest parameter must be of an array type` دارد.
  - rest parameter باید **آخرین** پارامتر باشد و هر تابع فقط یکی از آن می‌تواند داشته باشد:

  ```ts
  function badRest(...hobbies: string[], name: string) {} // Error TS1014: A rest parameter must be last in a parameter list.
  ```

  - اگر هیچ آرگومان اضافه‌ای فرستاده نشود، مقدار rest parameter آرایه‌ی **خالی** `[]` است، نه `undefined`.
  - `...` در **تعریف** تابع یعنی rest (جمع کردن آرگومان‌ها در آرایه)، اما `...` در **فراخوانی** (مثل `sum(...[10, 20])`) یعنی spread (پخش کردن آرایه به آرگومان‌های جدا).

  ### ۶. arrow function و استنتاج نوع
  بولت آخر اسلاید: **arrow function**ها (تابع‌های پیکانی) نحو کوتاه‌تری دارند و از **type inference** (استنتاج نوع) خوب استفاده می‌کنند:

  ```ts
  const add = (a: number, b: number) => a + b; // return type inferred: number
  const square = (n: number): number => n * n; // explicit return type
  console.log(add(2, 3), square(4));           // 5 16
  ```

  ```ts
  const add = (a: number, b: number) => a + b;
  const s: string = add(1, 2); // Error TS2322: Type 'number' is not assignable to type 'string'.
  ```

  **contextual typing** (نوع‌دهی از روی زمینه): وقتی یک arrow function را جایی می‌دهی که نوعش معلوم است (مثلاً به `map`)، لازم نیست نوع پارامترش را بنویسی و خطای implicit any هم نمی‌گیری:

  ```ts
  const nums = [1, 2, 3];
  const doubled = nums.map((n) => n * 2); // n is inferred as number
  console.log(doubled);                   // [ 2, 4, 6 ]
  ```

  دقت کن: arrow function با بدنه‌ی `{ … }` باید `return` صریح داشته باشد؛ وگرنه چیزی برنمی‌گرداند:

  ```ts
  const triple = (x: number): number => { // Error TS2355: A function whose declared type is neither 'undefined', 'void', nor 'any' must return a value.
    x * 3;
  };
  ```

  #### نوع تابع (function type)
  می‌شود نوع یک متغیر را «تابع» تعیین کرد. نحوش شبیه arrow function است: `(پارامترها) => نوع خروجی`.

  ```ts
  let op: (a: number, b: number) => number;
  op = (x, y) => x * y;  // OK: x and y get the type number from the context
  op = (x, y) => x > y;  // Error TS2322: Type 'boolean' is not assignable to type 'number'.
  op = (x: string) => 1; // Error TS2322: the parameter type does not match
  op = (x) => x;         // OK: using fewer parameters is allowed
  ```

  ### ۷. جمع‌بندی خطاهای رایج تابع‌ها

  | موقعیت | پیام tsc |
  |---|---|
  | نوع آرگومان اشتباه | `Argument of type 'string' is not assignable to parameter of type 'number'.` |
  | تعداد آرگومان اشتباه | `Expected 2 arguments, but got 1.` یا `Expected 1-2 arguments, but got 0.` |
  | آرگومان کم در تابعی که rest دارد | `Expected at least 2 arguments, but got 1.` |
  | پارامتر اجباری بعد از اختیاری | `A required parameter cannot follow an optional parameter.` |
  | rest parameter در وسط پارامترها | `A rest parameter must be last in a parameter list.` |
  | برگرداندن مقدار با نوع اشتباه | `Type 'number' is not assignable to type 'string'.` |
  | بعضی مسیرها `return` ندارند | `Function lacks ending return statement and return type does not include 'undefined'.` |
  | پارامتر بی‌نوع (در strict) | `Parameter 'n' implicitly has an 'any' type.` |

  ::: tip
  - نوع پارامترها را همیشه بنویس؛ نوع خروجی را TypeScript معمولاً خودش درست استنتاج می‌کند، ولی نوشتنش کد را خواناتر و امن‌تر می‌کند.
  - ترتیب درست پارامترها: اول اجباری‌ها، بعد اختیاری‌ها یا پیش‌فرض‌ها و در آخر rest parameter.
  :::

  ::: trap
  - فقط `undefined` (یا نفرستادن آرگومان) مقدار پیش‌فرض را فعال می‌کند؛ رشته‌ی خالی یا `0` مقدار واقعی‌اند و جایگزین نمی‌شوند.
  - rest parameter بدون آرگومان اضافه آرایه‌ی خالی `[]` است، نه `undefined`.
  - `createUser("Ali")` پیام «at least» می‌دهد (به خاطر rest)، اما `add(1)` پیام `Expected 2 arguments` را.
  - arrow function با بدنه‌ی `{ }` و بدون `return`، چیزی برنمی‌گرداند.
  - در حالت strict، پارامتر بی‌نوع خطای implicit any دارد؛ مگر در callbackهایی مثل `map` که نوعشان از زمینه معلوم است.
  :::

  ::: summary
  در TypeScript نوع پارامترها و نوع خروجی تابع نوشته می‌شود و tsc نوع و **تعداد** آرگومان‌ها را بررسی می‌کند. پارامتر اختیاری (`?`) و پیش‌فرض (`= value`) باید بعد از پارامترهای اجباری بیایند و فقط `undefined` مقدار پیش‌فرض را فعال می‌کند. rest parameter (`...name: T[]`) آرگومان‌های متغیر را در یک آرایه جمع می‌کند، باید آخرین پارامتر باشد و بدون آرگومان اضافه `[]` است. arrow functionها نوع خروجی (و در callbackها نوع پارامترها) را استنتاج می‌کنند و تابعی که چیزی برنمی‌گرداند نوع خروجی `void` دارد.
  :::
questions:
  - level: easy
    stem: با فرض تابع زیر، کدام فراخوانی خطای کامپایل دارد؟
    check: option-tsc
    prelude: &add |
      function add(a: number, b: number): number {
        return a + b;
      }
    code: *add
    options:
      - code: 'add(2, 3);'
      - code: 'add("2", 3);'
      - code: 'add(2.5, -1);'
      - code: 'add(0, 0);'
    answer: 2
    explain: |
      پارامتر `a` از نوع `number` است و `"2"` رشته است؛ پس خطای TS2345 می‌گیرد: `Argument of type 'string' is not assignable to parameter of type 'number'`. در JavaScript همین فراخوانی بی‌صدا `"23"` برمی‌گرداند. عدد اعشاری و منفی (گزینه‌ی ۳) و صفر (گزینه‌ی ۴) همه `number` معتبرند.

  - level: easy
    stem: خروجی کد اسلاید ۲۰ (کد زیر) پس از کامپایل و اجرا چیست؟
    check: ts-output
    code: |
      function createUser(
        name: string,
        age: number,
        ...hobbies: string[]
      ): { name: string; age: number; hobbies: string[] } {
        return {
          name,
          age,
          hobbies,
        };
      }

      const user = createUser("Alice", 30, "Reading", "Cycling");
      console.log(user);
    options:
      - out: "{ name: 'Alice', age: 30, hobbies: [ 'Reading', 'Cycling' ] }"
      - out: "{ name: 'Alice', age: 30, hobbies: 'Reading' }"
      - out: "{ name: 'Alice', age: 30, hobbies: [ 'Reading' ] }"
      - out: "[ 'Alice', 30, 'Reading', 'Cycling' ]"
    answer: 1
    explain: |
      دو آرگومان اول به `name` و `age` می‌رسند و rest parameter یعنی `...hobbies` **همه‌ی** آرگومان‌های باقی‌مانده را در یک آرایه جمع می‌کند: `["Reading", "Cycling"]`. شیء برگشتی با shorthand property ساخته شده (`name` یعنی `name: name`). گزینه‌های ۲ و ۳ فکر کرده‌اند rest فقط یک آرگومان می‌گیرد. گزینه‌ی ۴ هم خروجی را آرایه گرفته، در حالی که تابع یک شیء برمی‌گرداند.

  - level: medium
    stem: خروجی کد زیر پس از کامپایل و اجرا چیست؟
    check: ts-output
    code: |
      function createUser(
        name: string,
        age: number,
        ...hobbies: string[]
      ): { name: string; age: number; hobbies: string[] } {
        return { name, age, hobbies };
      }
      const u = createUser("Bob", 25);
      console.log(u.hobbies, u.hobbies.length);
    options:
      - out: "[ undefined ] 1"
      - out: "!! TypeError"
      - out: "[] 0"
      - out: "[ '' ] 1"
    answer: 3
    explain: |
      وقتی هیچ آرگومانی برای rest parameter فرستاده نشود، مقدار آن یک آرایه‌ی **خالی** است، نه `undefined`؛ پس `[]` و طول `0` چاپ می‌شود. اگر `hobbies` برابر `undefined` بود، خواندن `length` آن TypeError می‌داد (گزینه‌ی ۲)، ولی این‌طور نیست. گزینه‌های ۱ و ۴ هم فکر کرده‌اند یک خانه‌ی خالی یا `undefined` در آرایه قرار می‌گیرد.

  - level: medium
    stem: tsc در کدام خط کد زیر خطا گزارش می‌کند؟
    check: tsc-line
    code: |
      function createUser(
        name: string,
        age: number,
        ...hobbies: string[]
      ): { name: string; age: number; hobbies: string[] } {
        return { name, age, hobbies };
      }
      createUser("Ali", 20);
      createUser("Sara", 22, "Chess");
