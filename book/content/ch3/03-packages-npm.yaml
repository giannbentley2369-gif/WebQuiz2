id: ch3-npm-intro
title: "پکیج‌های خارجی و npm"
slides: "NodeJS & TS، اسلایدهای ۸ و ۹"
lesson: |
  فرض کن می‌خواهی یک خانه‌ی اسباب‌بازی بسازی. می‌توانی تک‌تک آجرها را خودت از پلاستیک بتراشی، یا یک جعبه **LEGO** بخری و قطعه‌های آماده را کنار هم بگذاری. برنامه‌نویسی امروز بیشتر شبیه حالت دوم است: به‌جای اینکه هر قابلیتی را از صفر بنویسیم (به قول معروف «چرخ را از نو اختراع کنیم»)، از کدهای آماده‌ای استفاده می‌کنیم که دیگران نوشته و منتشر کرده‌اند. این درس درباره‌ی همین قطعه‌های آماده (**پکیج**) و ابزاری است که آن‌ها را مدیریت می‌کند (**npm**).

  ### چند تعریف پایه
  - **package** (پکیج یا بسته): یک پوشه کد آماده و قابل استفاده‌ی دوباره که یک فایل `package.json` دارد و خودش را در آن معرفی می‌کند (اسم، نسخه و…). پکیج‌ها معمولاً در مخزن npm منتشر می‌شوند تا هر کسی بتواند نصبشان کند.
  - **library** (کتابخانه): مجموعه‌ای از توابع آماده برای یک کار مشخص، مثل کار با تاریخ یا فرستادن درخواست HTTP. بیشتر کتابخانه‌های JavaScript به شکل پکیج npm منتشر می‌شوند.
  - **module** در برابر package: یک ماژول معمولاً **یک فایل** است؛ یک پکیج می‌تواند **چندین** ماژول (فایل) داشته باشد.
  - **dependency** (وابستگی): پکیجی که پروژه برای کار کردن به آن نیاز دارد.
    - **direct dependency** (وابستگی مستقیم): پکیجی که خودت نصب کرده‌ای و اسمش در `package.json` پروژه‌ات آمده است.
    - **transitive dependency** (وابستگی غیرمستقیم): پکیجی که یکی از وابستگی‌های تو به آن نیاز دارد. npm آن را خودکار نصب می‌کند، ولی در `package.json` تو نوشته **نمی‌شود**.

  یک مثال واقعی: پکیج کوچک `is-odd` (بررسی فرد بودن یک عدد) خودش از پکیج `is-number` استفاده می‌کند. در یک پروژه‌ی تازه فقط `is-odd` را نصب می‌کنیم:

  ```bash
  npm install is-odd
  # added 2 packages in 311ms
  npm ls --all
  # my-app@1.0.0
  # └─┬ is-odd@3.0.1
  #   └── is-number@6.0.0
  ```

  ما یک پکیج خواستیم، ولی **دو** پکیج نصب شد. در `package.json` فقط `is-odd` آمده است، ولی در پوشه‌ی `node_modules` هر دو پکیج هستند. این درخت وابستگی‌ها در پروژه‌های واقعی می‌تواند صدها شاخه داشته باشد؛ همان کوله‌پشتی ۱۲ گیگابایتی میم اسلاید ۷!

  ### پکیج‌های خارجی (اسلاید ۸)
  اسلاید ۸ داستان پکیج‌های خارجی (external packages: کدی که دیگران نوشته‌اند و ما در پروژه‌مان استفاده می‌کنیم) را در پنج جمله می‌گوید:

  ۱. **Open-source community began sharing reusable JS libraries.** جامعه‌ی **open-source** (متن‌باز: نرم‌افزاری که کدش عمومی است و هر کسی می‌تواند از آن استفاده کند و بهترش کند) شروع کرد به اشتراک گذاشتن کتابخانه‌های **قابل استفاده‌ی دوباره** (reusable).

  ۲. **Developers could import external code instead of reinventing features.** برنامه‌نویس‌ها به‌جای نوشتن دوباره‌ی قابلیت‌های تکراری (مثل قالب‌بندی تاریخ)، کد آماده را **import** (وارد) می‌کنند.

  ۳. **Enabled rapid development through modular building blocks.** با کنار هم گذاشتن **قطعه‌های ماژولار** (modular building blocks)، برنامه خیلی **سریع‌تر** ساخته می‌شود؛ درست مثل LEGO.

  ۴. **Popular libraries shaped best practices and common patterns.** کتابخانه‌های محبوب روی **بهترین شیوه‌ها** (best practices) و الگوهای رایج اثر گذاشتند. مثلاً کار با Promise سال‌ها قبل از اینکه رسماً وارد زبان شود، در کتابخانه‌ها رایج شد؛ یا الگوی «کامپوننت» را React همه‌گیر کرد.

  ۵. **Also raised issues of trust, maintenance, and dependency overload.** این راحتی هزینه هم داشت:
     - **trust** (اعتماد): کد یک غریبه را وارد پروژه‌ات می‌کنی؛ از کجا مطمئنی کار مخربی نمی‌کند؟
     - **maintenance** (نگه‌داری): اگر نویسنده‌ی پکیج آن را رها کند، باگ‌ها و مشکلات امنیتی‌اش دیگر درست نمی‌شوند.
     - **dependency overload** (بار اضافه‌ی وابستگی‌ها): وابستگی‌های زیاد یعنی `node_modules` حجیم، نصب کُند و نقاط آسیب‌پذیر بیشتر.

  | مزیت‌ها (اسلاید ۸) | دردسرها (اسلاید ۸) |
  |---|---|
  | استفاده‌ی دوباره از کد (reusable) | اعتماد (trust) |
  | اختراع نکردن دوباره‌ی چرخ | نگه‌داری (maintenance) |
  | توسعه‌ی سریع با قطعه‌های ماژولار | بار اضافه‌ی وابستگی‌ها (dependency overload) |
  | شکل گرفتن بهترین شیوه‌ها و الگوها | |

  ::: info ماجرای left-pad
  در سال ۲۰۱۶ نویسنده‌ی پکیج کوچکی به نام `left-pad` (حدود ۱۱ خط کد برای اضافه کردن فاصله به ابتدای یک رشته) آن را از npm حذف کرد. چون هزاران پروژه به‌طور مستقیم یا غیرمستقیم به آن وابسته بودند، ساختِ (build) خیلی از آن‌ها، از جمله ابزارهای معروف، ناگهان خراب شد. این ماجرا نمونه‌ی واقعی «dependency overload» و خطر وابستگی‌های غیرمستقیم است.
  :::

  ### npm (اسلاید ۹)
  **npm** مخفف **N**ode **P**ackage **M**anager (مدیر بسته‌ی Node) است و همراه Node.js نصب می‌شود. npm در واقع سه بخش دارد:
  - **registry** (مخزن): یک پایگاه داده‌ی آنلاین عظیم از پکیج‌ها که آدرس پیش‌فرضش `https://registry.npmjs.org/` است.
  - **CLI** (رابط خط فرمان): همان دستور `npm` در ترمینال که با آن پکیج نصب و حذف می‌کنیم.
  - **وب‌سایت** `npmjs.com`: برای جست‌وجو و خواندن مستندات پکیج‌ها.

  اسلاید ۹ پنج نکته درباره‌ی npm می‌گوید:

  ۱. **Introduced a central registry to manage and distribute packages.** یک **مخزن مرکزی** (central registry) برای مدیریت و توزیع پکیج‌ها ساخت؛ همه پکیج‌ها را در یک جا منتشر می‌کنند و از همان‌جا دانلود می‌کنند.

  ۲. **Made installing and updating dependencies effortless.** نصب و به‌روزرسانی وابستگی‌ها را **بی‌زحمت** کرد: یک دستور `npm install` به‌جای دانلود دستی فایل‌ها.

  ۳. **Standardized project setup with package.json.** ساختار پروژه را با فایل `package.json` **استاندارد** کرد؛ هر پروژه‌ی Node.js یک شناسنامه‌ی یکسان دارد.

  ۴. **Fueled explosive growth of the JavaScript ecosystem.** باعث رشد **انفجاری** اکوسیستم JavaScript شد؛ امروز میلیون‌ها پکیج در npm هست.

  ۵. **Later faced challenges with security, size, and version chaos.** بعدها با چالش‌های **امنیت** (پکیج‌های مخرب یا آسیب‌پذیر)، **حجم** (`node_modules` غول‌آسا) و **آشفتگی نسخه‌ها** (version chaos: ناسازگاری نسخه‌های مختلف یک پکیج با هم) روبه‌رو شد.

  ### سه چیز مهم در هر پروژه
  #### ۱. `package.json`: شناسنامه‌ی پروژه
  اسم و نسخه‌ی پروژه، اسکریپت‌ها و فهرست وابستگی‌های مستقیم در این فایل است (جزئیاتش را در درس «اسکریپت‌های npm و فایل package.json» می‌خوانیم):

  ```json title=package.json
  {
    "name": "my-app",
    "version": "1.0.0",
    "dependencies": {
      "express": "^5.3.0"
    },
    "devDependencies": {
      "jest": "^30.5.2"
    }
  }
  ```

  #### ۲. `package-lock.json`: قفلِ نسخه‌های دقیق
  در `package.json` معمولاً یک **بازه** از نسخه‌ها نوشته می‌شود (مثل `^3.0.1`). ولی `package-lock.json` نسخه‌ی **دقیقِ** همه‌ی پکیج‌های نصب‌شده را ثبت می‌کند، حتی وابستگی‌های غیرمستقیم، به‌اضافه‌ی آدرس دانلود (`resolved`) و یک کد بررسی سلامت فایل (`integrity`). npm این فایل را خودکار می‌سازد و به‌روز نگه می‌دارد. این تکه از lock فایل همان مثال بالاست:

  ```json title=package-lock.json
  "node_modules/is-odd": {
    "version": "3.0.1",
    "resolved": "https://registry.npmjs.org/is-odd/-/is-odd-3.0.1.tgz",
    "dependencies": { "is-number": "^6.0.0" }
  }
  ```

  نتیجه: هر کسی که پروژه را بگیرد و `npm install` بزند، **دقیقاً همان نسخه‌ها** را می‌گیرد و جمله‌ی معروف «روی سیستم من کار می‌کرد!» کمتر شنیده می‌شود.

  #### ۳. پوشه‌ی `node_modules`
  کدِ واقعی همه‌ی پکیج‌های نصب‌شده (مستقیم و غیرمستقیم) اینجاست. این پوشه معمولاً خیلی بزرگ است و چون همیشه می‌شود آن را با `npm install` از روی دو فایل بالا **دوباره ساخت**، در git ثبت (commit) نمی‌شود و اسمش را در فایل `.gitignore` می‌نویسند.

  | | در git ثبت شود؟ | چه کسی می‌سازدش؟ |
  |---|---|---|
  | `package.json` | بله | ما (و npm هنگام نصب و حذف پکیج) |
  | `package-lock.json` | بله | npm، خودکار |
  | `node_modules/` | **خیر** | npm، هنگام `npm install` |

  ### نسخه‌بندی معنایی (Semantic Versioning)
  نسخه‌ی پکیج‌های npm سه عدد دارد: **MAJOR.MINOR.PATCH**؛ مثلاً `4.17.21`. به این قرارداد **SemVer** (Semantic Versioning: نسخه‌بندی معنایی) می‌گویند، چون هر عدد معنی دارد:

  | بخش | کی زیاد می‌شود؟ | مثال از `4.17.21` |
  |---|---|---|
  | **PATCH** (وصله) | فقط رفع باگ، بدون تغییر در نحوه‌ی استفاده | `4.17.22` |
  | **MINOR** (جزئی) | قابلیت جدید که با کدهای قبلی **سازگار** است | `4.18.0` (PATCH صفر می‌شود) |
  | **MAJOR** (اصلی) | **تغییر ناسازگار** (breaking change): ممکن است کد قبلی تو را خراب کند | `5.0.0` (بقیه صفر می‌شوند) |

  در `package.json` می‌شود به‌جای یک نسخه‌ی ثابت، یک **بازه** نوشت:

  | نوشته در `package.json` | یعنی | مجاز | غیرمجاز |
  |---|---|---|---|
  | `"1.2.3"` | دقیقاً همین نسخه | `1.2.3` | `1.2.4` |
  | `"~1.2.3"` | فقط PATCH جدیدتر: از `1.2.3` تا قبل از `1.3.0` | `1.2.9` | `1.3.0` |
  | `"^1.2.3"` | MINOR و PATCH جدیدتر: از `1.2.3` تا قبل از `2.0.0` | `1.9.0` | `2.0.0` |
  | `"^0.2.3"` | برای نسخه‌های `0.x` محتاط‌تر: از `0.2.3` تا قبل از `0.3.0` | `0.2.9` | `0.3.0` |
  | `"*"` | هر نسخه‌ای | `9.9.9` | — |

  وقتی `npm install <package>` می‌زنی، npm به‌طور پیش‌فرض آخرین نسخه را نصب می‌کند و آن را با علامت `^` در `package.json` ذخیره می‌کند (مثلاً `"is-number": "^7.0.0"`). اگر بعداً پروژه را بدون lock فایل نصب کنی، npm **جدیدترین نسخه‌ای که در بازه جا می‌شود** را برمی‌دارد.

  ### dependencies در برابر devDependencies
  - **dependencies**: پکیج‌هایی که برنامه **هنگام اجرا** لازم دارد؛ مثل `express` (سرور)، `axios` (درخواست HTTP) یا `react` (رابط کاربری).
  - **devDependencies**: پکیج‌هایی که فقط **هنگام توسعه** لازم‌اند و برنامه‌ی در حال اجرا به آن‌ها نیاز ندارد؛ مثل `jest` (تست)، `webpack` (bundler)، `typescript` (کامپایلر TypeScript). با `npm install -D <package>` نصب می‌شوند.

  روی سرور اصلی (محیط production) می‌شود با `npm install --omit=dev` فقط dependencies را نصب کرد تا حجم کمتر شود.

  ### خطرهای زنجیره‌ی تأمین (supply chain)
  **supply chain** (زنجیره‌ی تأمین نرم‌افزار) یعنی همه‌ی کدهایی که از بیرون وارد پروژه‌ات می‌شود، به‌اضافه‌ی آدم‌ها و ابزارهایی که آن کد را می‌سازند و منتشر می‌کنند. چند خطر رایج:

  - **typosquatting** (سوءاستفاده از اشتباه تایپی): کسی پکیج مخربی با اسمی شبیه یک پکیج معروف منتشر می‌کند (مثلاً `expresss` به‌جای `express`) و منتظر اشتباه تایپی تو می‌ماند.
  - **حساب نفوذشده**: اگر حساب کاربری نویسنده‌ی یک پکیج محبوب هک شود، نسخه‌ی جدید و مخربی منتشر می‌شود و با یک `npm update` وارد هزاران پروژه می‌شود.
  - **اسکریپت‌های نصب**: بعضی پکیج‌ها هنگام نصب، خودکار کد اجرا می‌کنند.
  - **پکیج رهاشده**: پکیجی که دیگر نگه‌داری نمی‌شود و آسیب‌پذیری‌هایش درست نمی‌شود.

  راه‌های کم کردن خطر: قبل از نصب، اسم، محبوبیت و فعال بودن پکیج را بررسی کن؛ وابستگی‌ها را کم نگه دار؛ `package-lock.json` را commit کن؛ و با `npm audit` آسیب‌پذیری‌های شناخته‌شده را پیدا کن.

  ::: tip
  `package.json` و `package-lock.json` را در git ثبت کن، ولی `node_modules` را نه. هم‌تیمی تو بعد از گرفتن پروژه فقط یک `npm install` می‌زند و دقیقاً همان نسخه‌ها را می‌گیرد.
  :::

  ::: trap
  - علامت `^` اجازه‌ی رفتن به MAJOR بعدی را **نمی‌دهد**: `^1.2.3` شامل `2.0.0` نیست. علامت `~` از این هم سخت‌گیرتر است و فقط PATCH را باز می‌گذارد: `~1.2.3` شامل `1.3.0` نیست.
  - در نسخه‌های `0.x` علامت `^` مثل `~` رفتار می‌کند: `^0.2.3` شامل `0.3.0` نیست.
  :::

  ::: trap
  وابستگی غیرمستقیم در `package.json` تو نوشته **نمی‌شود**، ولی در `node_modules` و `package-lock.json` حضور دارد. پس «هر پکیجی که در `node_modules` هست، در `package.json` هم آمده» غلط است.
  :::

  ::: summary
  - پکیج = کد آماده‌ی قابل استفاده‌ی دوباره؛ وابستگی‌ها مستقیم یا غیرمستقیم‌اند.
  - اسلاید ۸: اشتراک کتابخانه‌های متن‌باز، اختراع نکردن دوباره‌ی چرخ، توسعه‌ی سریع با قطعه‌های ماژولار، شکل گرفتن بهترین شیوه‌ها؛ و در مقابل: اعتماد، نگه‌داری، بار اضافه‌ی وابستگی‌ها.
  - اسلاید ۹: npm (Node Package Manager) = مخزن مرکزی، نصب و به‌روزرسانی آسان، استاندارد شدن با `package.json`، رشد انفجاری؛ و بعدها چالش امنیت، حجم و آشفتگی نسخه‌ها.
  - `package-lock.json` نسخه‌های دقیق را قفل می‌کند؛ `node_modules` ساختنی است و commit نمی‌شود.
  - SemVer: MAJOR.MINOR.PATCH؛ `^` تا قبل از MAJOR بعدی، `~` تا قبل از MINOR بعدی.
  :::
