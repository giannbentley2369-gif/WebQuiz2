    answer: 2
    explain: |
      عنوان اسلاید ۹: «NPM (Node Package Manager)»؛ یعنی «مدیر بسته‌ی Node». کار npm مدیریت پکیج‌هاست: نصب، به‌روزرسانی، حذف و انتشار. بقیه‌ی گزینه‌ها اسم‌های ساختگی هستند.
  - level: easy
    stem: طبق اسلاید ۸، کدام مورد از **مزیت‌های** استفاده از پکیج‌های خارجی **نیست**؟
    options:
      - 'استفاده از کد آماده‌ی دیگران به‌جای اختراع دوباره‌ی همان قابلیت‌ها'
      - 'توسعه‌ی سریع‌تر با کنار هم گذاشتن قطعه‌های ماژولار (modular building blocks)'
      - 'شکل گرفتن بهترین شیوه‌ها و الگوهای رایج به کمک کتابخانه‌های محبوب'
      - 'تضمین اینکه پروژه هیچ مشکل امنیتی و نگه‌داری نخواهد داشت'
    answer: 4
    explain: |
      اسلاید ۸ دقیقاً برعکسِ گزینه‌ی ۴ را می‌گوید: «Also raised issues of trust, maintenance, and dependency overload». پکیج‌های خارجی مشکلات اعتماد و نگه‌داری را **ایجاد** می‌کنند، نه اینکه از بین ببرند. گزینه‌های ۱، ۲ و ۳ سه مورد از مزیت‌های همین اسلاید هستند.
  - level: easy
    stem: کدِ پکیج‌هایی که با `npm install` دانلود می‌شوند، در کجای پروژه قرار می‌گیرد؟
    options:
      - 'پوشه‌ی `node_modules`'
      - 'فایل `package.json`'
      - 'فایل `package-lock.json`'
      - 'فایل `.npmrc`'
    answer: 1
    explain: |
      npm کد واقعی پکیج‌ها (و وابستگی‌های آن‌ها) را در پوشه‌ی `node_modules` می‌گذارد. در `package.json` فقط **اسم و بازه‌ی نسخه‌ی** وابستگی‌های مستقیم نوشته می‌شود و `package-lock.json` نسخه‌های دقیق را ثبت می‌کند، ولی هیچ‌کدام کد پکیج را نگه نمی‌دارند. `.npmrc` هم فایل تنظیمات npm است (مثلاً آدرس registry).
  - level: medium
    stem: نقش فایل `package-lock.json` چیست؟
    options:
      - 'فهرست اسکریپت‌های پروژه را نگه می‌دارد.'
      - 'یک نسخه‌ی پشتیبان از `package.json` است که فقط برای بازیابی استفاده می‌شود.'
      - 'نسخه‌ی دقیق همه‌ی پکیج‌های نصب‌شده (حتی وابستگی‌های غیرمستقیم) و محل دانلودشان را ثبت می‌کند تا نصب در همه‌ی سیستم‌ها یکسان باشد.'
      - 'پروژه را قفل می‌کند تا دیگر نتوان پکیج جدیدی نصب کرد.'
    answer: 3
    explain: |
      `package.json` معمولاً بازه‌ای مثل `^3.0.1` دارد، ولی `package-lock.json` نسخه‌ی دقیق نصب‌شده (مثلاً `3.0.1`)، آدرس `resolved` و `integrity` هر پکیج را ثبت می‌کند. پس هر کسی با `npm install` دقیقاً همان درخت وابستگی را می‌گیرد. اسکریپت‌ها در `package.json` هستند (رد گزینه‌ی ۱)، lock فایل کپی `package.json` نیست (رد گزینه‌ی ۲) و «lock» به معنی قفل کردن نسخه‌هاست، نه ممنوع کردن نصب (رد گزینه‌ی ۴).
  - level: medium
    stem: 'در `package.json` نوشته شده `"lodash": "^4.17.20"`. npm هنگام نصب، مجاز به نصب کدام نسخه است؟'
    options:
      - '`5.0.0`'
      - '`4.16.0`'
      - '`4.17.19`'
      - '`4.18.1`'
    answer: 4
    explain: |
      `^4.17.20` یعنی «از `4.17.20` به بالا، ولی کمتر از `5.0.0`»؛ پس MINOR و PATCH جدیدتر مجازند و `4.18.1` در بازه است. `5.0.0` یک MAJOR جدید (و احتمالاً ناسازگار) است و `^` اجازه‌اش را نمی‌دهد. `4.16.0` و `4.17.19` هم از حداقل بازه (`4.17.20`) قدیمی‌ترند.
  - level: medium
    stem: 'بازه‌ی `"~2.3.1"` در `package.json` شامل کدام نسخه می‌شود؟'
    options:
      - '`2.3.9`'
      - '`2.4.0`'
      - '`3.0.0`'
      - '`2.3.0`'
    answer: 1
    explain: |
      علامت `~` فقط PATCH جدیدتر را مجاز می‌کند: `~2.3.1` یعنی از `2.3.1` تا قبل از `2.4.0`. پس `2.3.9` مجاز است. `2.4.0` یک MINOR جدید است و `3.0.0` یک MAJOR جدید، که هیچ‌کدام در بازه نیستند. `2.3.0` هم از حداقل بازه (`2.3.1`) قدیمی‌تر است.
  - level: hard
    stem: 'بازه‌ی `"^0.4.2"` در `package.json` شامل کدام نسخه می‌شود؟'
    options:
      - '`0.4.9`'
      - '`0.5.0`'
      - '`1.0.0`'
      - '`0.4.1`'
    answer: 1
    explain: |
      دام اصلی همین‌جاست: برای نسخه‌های `0.x`، علامت `^` محتاط‌تر است و MINOR را تغییرِ احتمالاً ناسازگار حساب می‌کند. پس `^0.4.2` یعنی از `0.4.2` تا قبل از `0.5.0` و `0.4.9` مجاز است. کسی که قاعده‌ی معمول `^` را به کار ببرد (تا قبل از `1.0.0`)، به اشتباه `0.5.0` را انتخاب می‌کند. `1.0.0` قطعاً بیرون از بازه است و `0.4.1` از حداقل بازه پایین‌تر است.
  - level: medium
    stem: نسخه‌ی یک کتابخانه از `3.4.2` به `4.0.0` رسیده است. طبق نسخه‌بندی معنایی (SemVer) این یعنی چه؟
    options:
      - 'فقط یک باگ رفع شده و هیچ تغییر دیگری نیست.'
      - 'تغییر ناسازگار (breaking change) رخ داده و ممکن است کدی که با نسخه‌ی قبلی نوشته شده، خراب شود.'
      - 'قابلیت جدیدی اضافه شده که کاملاً با نسخه‌ی قبل سازگار است.'
      - 'عددهای نسخه معنای خاصی ندارند و تصادفی زیاد می‌شوند.'
    answer: 2
    explain: |
      در قالب MAJOR.MINOR.PATCH، افزایش MAJOR (اولین عدد) یعنی تغییر **ناسازگار**؛ برای همین `^3.4.2` هیچ‌وقت خودکار به `4.0.0` نمی‌رود. رفع باگ فقط PATCH را زیاد می‌کند (مثلاً `3.4.3`، رد گزینه‌ی ۱) و قابلیت جدید سازگار فقط MINOR را (مثلاً `3.5.0`، رد گزینه‌ی ۳). در SemVer هر عدد معنای مشخصی دارد (رد گزینه‌ی ۴).
  - level: medium
    stem: 'یک کتابخانه در نسخه‌ی `2.5.3` است. نویسنده فقط یک باگ را رفع کرده و هیچ قابلیت جدیدی اضافه نکرده است. طبق SemVer، نسخه‌ی بعدی کدام است؟'
    options:
      - '`2.6.0`'
      - '`3.0.0`'
      - '`2.5.4`'
      - '`2.5.3.1`'
    answer: 3
    explain: |
      رفع باگ بدون تغییر در نحوه‌ی استفاده یعنی افزایش PATCH (سومین عدد): `2.5.4`. `2.6.0` برای قابلیت جدید سازگار است و `3.0.0` برای تغییر ناسازگار. SemVer فقط سه عدد اصلی دارد و قالبی مثل `2.5.3.1` جزو آن نیست.
  - level: hard
    stem: در یک پروژه‌ی تازه فقط دستور `npm install is-odd` را اجرا کرده‌ایم. پکیج `is-odd` برای کار کردن به پکیج `is-number` نیاز دارد. کدام گزینه درست است؟
    options:
      - 'npm خطا می‌دهد و می‌خواهد اول `is-number` را دستی نصب کنیم.'
      - '`is-number` هم در `node_modules` نصب می‌شود و هم خودکار در بخش `dependencies` فایل `package.json` ما نوشته می‌شود.'
      - '`is-number` نصب نمی‌شود و `is-odd` هر بار هنگام اجرا آن را از اینترنت دانلود می‌کند.'
      - '`is-number` به‌عنوان وابستگی غیرمستقیم (transitive) خودکار در `node_modules` نصب می‌شود، ولی در `dependencies` فایل `package.json` ما نوشته نمی‌شود.'
    answer: 4
    explain: |
      npm وابستگی‌های یک پکیج را خودکار پیدا و نصب می‌کند؛ با این دستور خروجی «added 2 packages» است و هر دو پکیج در `node_modules` قرار می‌گیرند (رد گزینه‌های ۱ و ۳). ولی در `package.json` ما فقط وابستگی **مستقیم**، یعنی `is-odd`، نوشته می‌شود (رد گزینه‌ی ۲). جای ثبت `is-number` در `package-lock.json` است.
  - level: medium
    stem: در یک پروژه‌ی سرور Node.js، کدام پکیج معمولاً در **devDependencies** (و نه dependencies) قرار می‌گیرد؟
    options:
      - '`express`؛ فریم‌ورکی که سرور با آن ساخته شده است'
      - '`typescript`؛ کامپایلری که کد TypeScript را پیش از اجرا به JavaScript تبدیل می‌کند'
      - '`axios`؛ کلاینت HTTP که سرور با آن به API‌های دیگر درخواست می‌فرستد'
      - '`socket.io`؛ برای ارتباط بلادرنگ سرور با کاربران'
    answer: 2
    explain: |
      devDependencies فقط هنگام **توسعه** لازم‌اند. کامپایلر TypeScript کارش را قبل از اجرا تمام می‌کند و برنامه‌ی در حال اجرا (که JavaScript کامپایل‌شده است) به آن نیازی ندارد؛ پس با `npm install -D typescript` نصب می‌شود. `express`، `axios` و `socket.io` همگی هنگام **اجرای** سرور استفاده می‌شوند و باید در dependencies باشند.
  - level: hard
    stem: کدام عبارت **نادرست** است؟
    options:
      - 'پوشه‌ی `node_modules` باید حتماً در git ثبت (commit) شود، وگرنه هم‌تیمی‌ها نمی‌توانند پروژه را اجرا کنند.'
      - 'پوشه‌ی `node_modules` را همیشه می‌توان با `npm install` از روی `package.json` و `package-lock.json` دوباره ساخت.'
      - 'فایل `package-lock.json` باید در git ثبت شود تا همه دقیقاً همان نسخه‌ها را نصب کنند.'
      - 'پوشه‌ی `node_modules` علاوه بر وابستگی‌های مستقیم، وابستگی‌های غیرمستقیم را هم در خود دارد.'
    answer: 1
    explain: |
      `node_modules` حجیم است و چون با `npm install` از روی `package.json` و `package-lock.json` دوباره ساخته می‌شود، در git ثبت **نمی‌شود** (اسمش در `.gitignore` می‌آید). هم‌تیمی‌ها بعد از گرفتن پروژه فقط `npm install` می‌زنند. گزینه‌های ۲، ۳ و ۴ هر سه درست‌اند.
  - level: medium
    stem: طبق اسلاید ۹، npm بعدها با کدام چالش‌ها روبه‌رو شد؟
    options:
      - 'نبودِ یک مخزن مرکزی برای پکیج‌ها'
      - 'کُندی موتور V8 و پشتیبانی نکردن از async/await'
      - 'امنیت، حجم و آشفتگی نسخه‌ها (version chaos)'
      - 'اینکه فقط روی سیستم‌عامل Linux کار می‌کرد'
    answer: 3
    explain: |
      جمله‌ی آخر اسلاید ۹: «Later faced challenges with security, size, and version chaos». گزینه‌ی ۱ برعکس است؛ خود npm مخزن مرکزی را آورد («Introduced a central registry»). V8 و async/await ربطی به چالش‌های npm ندارند و npm مثل Node.js روی همه‌ی سیستم‌عامل‌ها کار می‌کند.
  - level: hard
    stem: برنامه‌نویسی می‌خواست `express` را نصب کند، ولی اشتباهی تایپ کرد `npm install expresss` (با سه s). اگر کسی پکیجی با همین اسم اشتباه منتشر کرده باشد، چه خطری وجود دارد؟
    options:
      - 'هیچ خطری ندارد؛ npm اسم اشتباه را خودکار به نزدیک‌ترین پکیج معروف یعنی `express` اصلاح می‌کند.'
      - 'ممکن است پکیج دیگری که شاید کد مخرب دارد نصب شود؛ به این ترفند typosquatting می‌گویند و یکی از خطرهای زنجیره‌ی تأمین است.'
      - 'npm فقط پکیج‌هایی را نصب می‌کند که از قبل در `package.json` نوشته شده‌اند، پس این دستور اصلاً اجرا نمی‌شود.'
      - 'خطری ندارد، چون npm قبل از انتشار هر پکیج کد آن را کامل از نظر امنیتی بررسی می‌کند.'
    answer: 2
    explain: |
      npm دقیقاً همان اسمی را نصب می‌کند که تایپ کرده‌ای و آن را اصلاح نمی‌کند (رد گزینه‌ی ۱). مهاجم‌ها با منتشر کردن پکیج‌هایی با اسم‌های شبیه پکیج‌های معروف (typosquatting) از همین اشتباه‌ها سوءاستفاده می‌کنند. `npm install <name>` برای اضافه کردن پکیج **جدید** است و لازم نیست اسمش از قبل در `package.json` باشد (رد گزینه‌ی ۳). کد پکیج‌ها پیش از انتشار بررسی امنیتی کامل نمی‌شود و همین یکی از چالش‌های امنیتی است که اسلاید ۹ می‌گوید (رد گزینه‌ی ۴).
  - level: easy
    stem: |
      جای خالی را کامل کن:

      «npm برای مدیریت و توزیع پکیج‌ها یک ……… مرکزی معرفی کرد.»
    options:
      - 'کامپایلر (compiler)'
      - 'مرورگر (browser)'
      - 'bundler'
      - 'مخزن (registry)'
    answer: 4
    explain: |
      اسلاید ۹: «Introduced a **central registry** to manage and distribute packages». registry همان مخزن آنلاینی است که پکیج‌ها در آن منتشر و از آن دانلود می‌شوند (پیش‌فرض: `https://registry.npmjs.org/`). npm نه کامپایلر است، نه مرورگر؛ bundler هم ابزار جداگانه‌ای (مثل Webpack) برای یکی کردن فایل‌ها است.
  - level: hard
    stem: 'در `package.json` نوشته شده `"chalk": "^4.1.0"` و هنوز `package-lock.json` نداریم. در مخزن npm نسخه‌های `4.1.0`، `4.1.2`، `4.2.0` و `5.0.0` از این پکیج هست و آخرین نسخه‌ی منتشرشده (latest) هم `5.0.0` است. با `npm install` کدام نسخه نصب می‌شود؟'
    options:
      - '`4.1.0`'
      - '`4.1.2`'
      - '`4.2.0`'
      - '`5.0.0`'
    answer: 3
    explain: |
      بازه‌ی `^4.1.0` یعنی «از `4.1.0` تا قبل از `5.0.0`». نسخه‌های `4.1.0`، `4.1.2` و `4.2.0` در این بازه‌اند و npm **جدیدترین نسخه‌ی داخل بازه** را انتخاب می‌کند، یعنی `4.2.0`. نسخه‌ی latest یعنی `5.0.0` یک MAJOR جدید است و بیرون از بازه قرار دارد، پس نصب نمی‌شود. `4.1.0` فقط حداقلِ بازه است و `4.1.2` هم جدیدترینِ داخل بازه نیست.
  - level: easy
    stem: کدام فایل «شناسنامه»ی یک پروژه‌ی Node.js است و نام، نسخه، اسکریپت‌ها و فهرست وابستگی‌های مستقیم پروژه در آن نوشته می‌شود؟
    options:
      - '`package.json`'
      - '`package-lock.json`'
      - '`node_modules`'
      - '`.npmrc`'
    answer: 1
    explain: |
      اسلاید ۹ می‌گوید npm ساختار پروژه را با `package.json` استاندارد کرد؛ اسکریپت‌ها و وابستگی‌ها در این فایل تعریف می‌شوند. `package-lock.json` نسخه‌های دقیق نصب‌شده را ثبت می‌کند و اسکریپتی ندارد. `node_modules` پوشه‌ی کد پکیج‌هاست و `.npmrc` تنظیمات خود npm را نگه می‌دارد.
  - level: medium
    stem: '«نویسنده‌ی پکیجی که پروژه‌ات به آن وابسته است، کار روی آن را رها کرده و دیگر باگ‌ها و مشکلات امنیتی‌اش را رفع نمی‌کند.» این موقعیت نمونه‌ای از کدام دردسرِ اسلاید ۸ است؟'
    options:
      - 'trust (اعتماد)'
      - 'maintenance (نگه‌داری)'
      - 'dependency overload (بار اضافه‌ی وابستگی‌ها)'
      - 'rapid development (توسعه‌ی سریع)'
    answer: 2
    explain: |
      اسلاید ۸ سه دردسر می‌شمارد: trust، maintenance و dependency overload. پکیج رهاشده‌ای که دیگر به‌روز نمی‌شود، مشکل **نگه‌داری** است. trust درباره‌ی اطمینان از سالم و غیرمخرب بودن کد است و dependency overload درباره‌ی زیاد بودن تعداد وابستگی‌ها. rapid development هم اصلاً دردسر نیست، بلکه یکی از مزیت‌های همین اسلاید است.
