id: ch3-ts-generics
title: "Generics در TypeScript"
slides: "NodeJS & TS، اسلاید ۲۲"
lesson: |
  ### یک تشبیه: جعبه‌ی برچسب‌دار

  ::: analogy
  فرض کن یک کارخانه‌ی جعبه‌سازی داری. نمی‌خواهی برای کتاب، کفش و لیوان سه خط تولید جدا بسازی؛ یک **جعبه‌ی عمومی** می‌سازی و روی هر جعبه یک **برچسب** می‌زنی: «جعبه‌ی کتاب» یا «جعبه‌ی کفش». وقتی برچسب «کتاب» خورد، فقط کتاب داخلش می‌رود و وقتی بازش کنی مطمئنی کتاب بیرون می‌آید. **Generics** همین است: یک کد عمومی که با یک «برچسب نوع» برای هر نوع داده‌ای کار می‌کند، بدون این‌که TypeScript نوع را گم کند.
  :::

  پارامتر معمولی تابع، جای خالی برای یک **مقدار** است. **generic** (عام) یعنی تابع، کلاس یا interface یک جای خالی هم برای **نوع** داشته باشد که هنگام استفاده پر می‌شود.

  ### مشکل: یا تکرار کد، یا گم شدن نوع

  فرض کن تابعی می‌خواهیم که هر چه بگیرد، همان را برگرداند. بدون generics دو راه بد داریم:

  ```ts
  // Way 1: one copy per type (code duplication)
  function identityNumber(value: number): number {
    return value;
  }
  function identityString(value: string): string {
    return value;
  }

  // Way 2: any (type information is lost)
  function identityAny(value: any): any {
    return value;
  }
  const y = identityAny("hi");  // y: any
  console.log(y.length);        // 2
  console.log(y.toFixed(2));    // compiles, but crashes at runtime: TypeError: y.toFixed is not a function
  ```

  راه اول برای هر نوع یک نسخه‌ی تکراری می‌خواهد. راه دوم از **`any`** (نوعی که یعنی «هر چیزی» و بررسی نوع را خاموش می‌کند) استفاده می‌کند: TypeScript دیگر نمی‌داند `y` رشته است، پس خطای `y.toFixed` را نمی‌گیرد و برنامه در زمان اجرا می‌ترکد.

  ### راه‌حل: تابع generic (کد اسلاید ۲۲)

  ```ts title=weee.ts
  function identity<T>(value: T): T
  {
    return value;
  }

  let num = identity<number>(42);
  let str = identity<string>("Hello");
  ```

  - `<T>` یک **type parameter** (پارامتر نوع) است: جای خالی برای یک نوع. اسمش دلخواه است؛ رسم است از `T` (اول کلمه‌ی Type) استفاده شود.
  - `(value: T): T` یعنی «ورودی از نوع `T` است و خروجی **همان** نوع `T`». نوع خروجی به نوع ورودی **وصل** است.
  - در `identity<number>(42)`، عبارت `<number>` یک **type argument** (آرگومان نوع) است: این‌جا `T` برابر `number` می‌شود، پس `num` از نوع `number` است. به همین ترتیب `str` از نوع `string` است.
  - کد اسلاید هیچ `console.log`ی ندارد، پس **خروجی ندارد**. اگر `console.log(num, str, typeof num, typeof str);` را اضافه کنیم، `42 Hello number string` چاپ می‌شود.

  | فراخوانی | `T` چه می‌شود؟ | نوع نتیجه |
  |---|---|---|
  | `identity<number>(42)` | `number` | `number` |
  | `identity<string>("Hello")` | `string` | `string` |
  | `identity<boolean>(true)` | `boolean` | `boolean` |

  generics فقط برای بررسی در زمان کامپایل هستند؛ در JavaScript خروجی اثری از آن‌ها نمی‌ماند:

  ```js
  function identity(value) {
      return value;
  }
  let num = identity(42);
  let str = identity("Hello");
  ```

  چهار نکته‌ی اسلاید ۲۲ حالا معنا پیدا می‌کنند:

  1. generics امکان ساختن کامپوننت‌ها و تابع‌های **قابل استفاده‌ی دوباره (reusable)** و **type-safe** (ایمن از نظر نوع) را می‌دهند: یک `identity` برای همه‌ی نوع‌ها.
  2. روی **تابع‌ها، کلاس‌ها و interfaceها** به کار می‌روند (پایین‌تر هر سه را می‌بینیم).
  3. **انعطاف** می‌دهند و در عین حال **ایمنی نوع** را حفظ می‌کنند.
  4. با کار کردن روی هر نوع داده، **جلوی تکرار کد** را می‌گیرند **بدون این‌که بررسی نوع از دست برود** (برخلاف `any`).

  بررسی نوع کاملاً برقرار است:

  ```ts
  function identity<T>(value: T): T {
    return value;
  }
  let num = identity<number>(42);
  let str = identity<string>("Hello");
  let wrong = identity<number>("Hello"); // Error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.
  num = str;                             // Error TS2322: Type 'string' is not assignable to type 'number'.
  ```

  ### استنتاج نوع (type inference): لازم نیست همیشه `<number>` بنویسی

  اگر آرگومان نوع را ننویسی، TypeScript آن را از روی آرگومان‌های تابع **استنتاج** (حدس دقیق) می‌کند. یک ظرافت مهم: نتیجه به `let` و `const` بستگی دارد.

  ```ts
  function identity<T>(value: T): T {
    return value;
  }
  let a = identity(42);         // a: number
  const b = identity(42);       // b: 42 (a literal type)
  let c = identity("Hello");    // c: string
  const d = identity("Hello");  // d: "Hello"
  a = 100;                      // OK: a is a number
  let e: 42 = b;                // OK: b is exactly 42
  let f: 42 = a;                // Error TS2322: Type 'number' is not assignable to type '42'.
  ```

  چرا؟ متغیر `let` بعداً می‌تواند عوض شود، پس TypeScript نوع را **گسترده** (`number`) در نظر می‌گیرد. اما `const` هرگز عوض نمی‌شود، پس TypeScript همان **نوع دقیق (literal type)** `42` را نگه می‌دارد (مثل `const PI = 3.14` که نوعش `3.14` است).

  آرگومان نوع را وقتی صریح بنویس که نوعی **گسترده‌تر** از حدس TypeScript بخواهی:

  ```ts
  function identity<T>(value: T): T {
    return value;
  }
  let g = identity<number | string>(5); // g: string | number
  g = "five";                           // OK
  ```

  ### چرا generic بهتر از `any` است؟

  | | `any` | generic `<T>` |
  |---|---|---|
  | نوع خروجی | `any` (اطلاعات نوع گم می‌شود) | همان نوع ورودی |
  | اشتباهی مثل `toFixed` روی رشته | در **زمان اجرا** (`TypeError`) | در **زمان کامپایل** |
  | پیشنهاد خودکار (autocomplete) ویرایشگر | ندارد | دارد |

  ```ts
  function identity<T>(value: T): T {
    return value;
  }
  const x = identity("hi");
  x.toUpperCase();  // OK: x is a string
  x.toFixed(2);     // Error TS2551: Property 'toFixed' does not exist on type '"hi"'.
  ```

  ### آرایه‌ها: `Array<T>`

  همین حالا هم بدون این‌که بدانی از generics استفاده می‌کردی: `number[]` همان `Array<number>` است.

  ```ts
  let nums: Array<number> = [1, 2, 3];   // same as number[]
  nums.push(4);                          // OK
  nums.push("5");                        // Error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.

  function firstItem<T>(items: T[]): T | undefined {
    return items[0];
  }
  const h = firstItem([10, 20]);    // h: number | undefined
  const i = firstItem(["x", "y"]);  // i: string | undefined
  ```

  (`Promise` فصل اول هم generic است: `Promise<string>` یعنی Promiseی که در پایان یک `string` می‌دهد.)

  ### interface generic: `Box<T>`

  ```ts
  interface Box<T> {
    value: T;
  }
  const b1: Box<string> = { value: "hi" };
  const b2: Box<number[]> = { value: [1, 2] };
  const b3: Box<number> = { value: "hi" };  // Error TS2322: Type 'string' is not assignable to type 'number'.
  const b4: Box = { value: 1 };             // Error TS2314: Generic type 'Box<T>' requires 1 type argument(s).
  ```

  ### چند پارامتر نوع: `<K, V>`

  می‌توان بیش از یک پارامتر نوع داشت؛ رسم است برای کلید (Key) از `K` و برای مقدار (Value) از `V` استفاده شود:

  ```ts
  interface Pair<K, V> {
    key: K;
    value: V;
  }
  const p1: Pair<string, number> = { key: "age", value: 30 };    // OK
  const p2: Pair<string, number> = { key: "age", value: "30" };  // Error TS2322: Type 'string' is not assignable to type 'number'.

  function makePair<K, V>(key: K, value: V): Pair<K, V> {
    return { key, value };
  }
  const p3 = makePair("id", 7);                    // Pair<string, number>
  const p4 = makePair<string, number>("id", "7");  // Error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.
  ```

  ### کلاس generic: `Stack<T>`

  **Stack** (پشته) مثل یک دسته بشقاب است: آخرین بشقابی که می‌گذاری، اولین بشقابی است که برمی‌داری (LIFO: Last In, First Out). یک بار کلاس را می‌نویسیم و برای هر نوعی استفاده می‌کنیم:

  ```ts
  class Stack<T> {
    private items: T[] = [];
    push(item: T): void {
      this.items.push(item);
    }
    pop(): T | undefined {
      return this.items.pop();
    }
    size(): number {
      return this.items.length;
    }
  }
  const s = new Stack<string>();
  s.push("a");
  s.push("b");
  s.push("c");
  console.log(s.pop(), s.size());  // c 2
  const n = new Stack<number>();
  console.log(n.pop(), n.size());  // undefined 0
  n.push(1);                        // OK
  n.push("2");                      // Error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.
  ```

  `pop` نوع `T | undefined` برمی‌گرداند، چون پشته ممکن است خالی باشد (`pop` آرایه‌ی خالی `undefined` می‌دهد).

  ### قید (constraint) با `extends`

  داخل یک تابع generic، TypeScript هیچ چیزی درباره‌ی `T` نمی‌داند (ممکن است عدد باشد، ممکن است رشته). پس اجازه نمی‌دهد به property خاصی دست بزنی:

  ```ts
  function size<T>(x: T): number {
    return x.length;  // Error TS2339: Property 'length' does not exist on type 'T'.
  }
  ```

  راه‌حل، **قید** گذاشتن روی `T` است: `T extends { length: number }` یعنی «`T` هر نوعی می‌تواند باشد، **به شرط این‌که** یک `length` عددی داشته باشد».

  ```ts
  function logLength<T extends { length: number }>(x: T): T {
    console.log(x.length);
    return x;
  }
  logLength("hello");        // 5
  logLength([1, 2, 3]);      // 3
  logLength({ length: 7 });  // 7
  logLength(42);             // Error TS2345: Argument of type 'number' is not assignable to parameter of type '{ length: number; }'.
  ```

  چون خروجی `T` است، `logLength("hello")` همچنان یک `string` برمی‌گرداند و می‌توانی روی نتیجه `toUpperCase()` را صدا بزنی.

  ### «You remember generic from Java, right?»

  زیر کد اسلاید ۲۲ نوشته «generic را از Java یادت هست، نه؟». ایده دقیقاً همان است:

  | | Java | TypeScript |
  |---|---|---|
  | نوشتن | `List<Integer>`، `class Box<T>` | `Array<number>`، `class Box<T>` |
  | استنتاج آرگومان نوع | محدودتر (مثلاً `<>` در `new ArrayList<>()`) | قوی؛ معمولاً لازم نیست بنویسی |
  | نوع‌های پایه | `List<int>` مجاز نیست (باید `Integer` نوشت) | `Array<number>` مجاز است |
  | در زمان اجرا | type erasure (اطلاعات generic پاک می‌شود) | کاملاً پاک می‌شود؛ در JS خروجی هیچ اثری نیست |

  ::: tip نکته: اسم پارامتر نوع و شکل‌های دیگر
  - اسم پارامتر نوع دلخواه است: `T` (Type)، `K` (Key)، `V` (Value)، `E` (Element) یا حتی اسم توصیفی مثل `TItem`.
  - arrow function هم می‌تواند generic باشد: `const identity2 = <T>(value: T): T => value;` (در فایل `.ts` معمولی).
  - generic روی تابع، کلاس و interface یک شکل دارد: `<...>` بعد از اسم.
  :::

  ::: trap دام تستی: generic مقدار را تبدیل نمی‌کند
  `identity<number>("5")` رشته‌ی `"5"` را به عدد `5` تبدیل **نمی‌کند**؛ فقط یک خطای کامپایل (TS2345) است. generics فقط بررسی نوع در زمان کامپایل‌اند و در زمان اجرا وجود ندارند؛ پس `typeof T` یا هر بررسی دیگری روی `T` در زمان اجرا ممکن نیست.
  :::

  ::: trap دام تستی: `let` یا `const`؟ و معنای `extends`
  - `let a = identity(42)` نوع `number` می‌گیرد، ولی `const b = identity(42)` نوع دقیق `42`.
  - `extends` در `<T extends { length: number }>` به معنی **قید** است («باید این شکل را داشته باشد»)، نه وراثت کلاس.
  :::

  ::: summary
  - generic = جای خالی برای **نوع**: `function identity<T>(value: T): T`.
  - `<number>` در `identity<number>(42)` آرگومان نوع است؛ اگر ننویسی، استنتاج می‌شود (`let` → `number`، `const` → `42`).
  - آرگومان ناسازگار با آرگومان نوع صریح → TS2345. generic اطلاعات نوع را حفظ می‌کند، `any` نه.
  - روی تابع (`identity<T>`)، interface (`Box<T>`، `Pair<K, V>`) و کلاس (`Stack<T>`) به کار می‌رود؛ `Array<T>` همان `T[]` است.
  - قید: `<T extends { length: number }>`؛ بدون قید، `x.length` خطای TS2339 دارد.
  - در JavaScript خروجی هیچ اثری از generics نمی‌ماند.
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۲۲، مهم‌ترین فایده‌ی generics چیست؟
    options:
      - 'نوشتن کدی که برای انواع مختلف داده دوباره قابل استفاده است، **بدون** از دست رفتن بررسی نوع'
      - 'سریع‌تر شدن اجرای برنامه در زمان اجرا'
      - 'خاموش کردن بررسی نوع برای انعطاف بیشتر، درست مثل `any`'
      - 'تبدیل خودکار مقدارها به نوع `T` در زمان اجرا'
    answer: 1
    explain: |
      اسلاید ۲۲ می‌گوید generics کامپوننت‌ها و تابع‌های **reusable** و **type-safe** می‌سازند و جلوی تکرار کد را می‌گیرند «بدون از دست رفتن بررسی نوع». generics فقط در زمان کامپایل وجود دارند و هیچ اثری روی سرعت اجرا یا تبدیل مقدارها ندارند (گزینه‌های ۲ و ۴). گزینه‌ی ۳ دقیقاً برعکس است: `any` بررسی نوع را خاموش می‌کند ولی generic آن را حفظ می‌کند.
  - level: easy
    stem: |
      در تعریف `function identity<T>(value: T): T`، `T` چیست؟
    options:
      - 'اسم کلاسی که باید از قبل جایی تعریف شده باشد.'
      - 'اسم دیگری برای همان پارامتر `value`.'
      - 'یک **پارامتر نوع** (type parameter)؛ جای خالی برای نوعی که هنگام فراخوانی مشخص می‌شود.'
      - 'کلیدواژه‌ای هم‌معنی `any` که بررسی نوع را خاموش می‌کند.'
    answer: 3
    explain: |
      `T` یک type parameter است: همان‌طور که `value` جای خالی برای مقدار است، `T` جای خالی برای **نوع** است و با `identity<number>(42)` (یا با استنتاج) پر می‌شود. `T` لازم نیست جایی تعریف شده باشد (گزینه‌ی ۱)، با `value` فرق دارد چون یکی نوع است و دیگری مقدار (گزینه‌ی ۲)، و برخلاف `any` نوع را حفظ می‌کند (گزینه‌ی ۴).
  - level: easy
    stem: |
      خروجی کد زیر (کد اسلاید ۲۲ به همراه یک `console.log`) چیست؟
    check: ts-output
    code: |
      function identity<T>(value: T): T
      {
        return value;
      }

      let num = identity<number>(42);
      let str = identity<string>("Hello");
      console.log(num, str, typeof num, typeof str);
    options:
      - out: "42 Hello T T"
      - out: "42 Hello number string"
      - out: "42 Hello object object"
      - out: "42 Hello any any"
    answer: 2
    explain: |
      `identity` همان مقدار را برمی‌گرداند، پس `num` عدد `42` و `str` رشته‌ی `"Hello"` است و `typeof` نوع واقعی زمان اجرا را می‌دهد: `number` و `string`. `T` و `any` فقط در زمان کامپایل وجود دارند و در JavaScript خروجی پاک شده‌اند، پس `typeof` هرگز `T` یا `any` برنمی‌گرداند (گزینه‌های ۱ و ۴). `object` هم فقط برای اشیاء (و `null`) است، نه عدد و رشته (گزینه‌ی ۳).
  - level: easy
    stem: |
      طبق اسلاید ۲۲، generics را روی چه چیزهایی می‌توان به کار برد؟
    options:
      - 'فقط روی تابع‌ها'
      - 'فقط روی کلاس‌ها (مثل Java)'
      - 'فقط روی interfaceها'
      - 'روی تابع‌ها، کلاس‌ها و interfaceها'
    answer: 4
    explain: |
      اسلاید ۲۲ صریحاً می‌گوید generics «can be applied to functions, classes, and interfaces»: مثل `function identity<T>`، `class Stack<T>` و `interface Box<T>`. هر سه گزینه‌ی دیگر با کلمه‌ی «فقط» یکی از این سه را کنار گذاشته‌اند؛ حتی در Java هم generic مخصوص کلاس‌ها نیست.
  - level: easy
    stem: |
      کدام خط کد زیر خطای کامپایل دارد؟
    check: tsc-line
    code: |
      function identity<T>(value: T): T {
        return value;
      }
      let num = identity<number>(42);
      let str = identity<string>("Hello");
      let wrong = identity<number>("Hello");
      let auto = identity(true);
    options:
      - line: 4
      - line: 5
      - line: 6
      - line: 7
    answer: 3
    explain: |
      در خط ۶ آرگومان نوع صریحاً `number` است، پس پارامتر `value` باید `number` باشد؛ دادن `"Hello"` خطای **TS2345** (`Argument of type 'string' is not assignable to parameter of type 'number'`) می‌دهد. خطوط ۴ و ۵ مقدار درست را با آرگومان نوع درست داده‌اند و در خط ۷ آرگومان نوع نوشته نشده و از روی `true` استنتاج می‌شود، پس هیچ‌کدام خطا ندارند.
  - level: easy
    stem: |
      می‌خواهیم `names` آرایه‌ای از رشته‌ها باشد (معادل `string[]`) و کد بدون خطا کامپایل شود. در جای خالی کدام گزینه قرار می‌گیرد؟
    check: option-tsc
    want: ok
    code: |
      let names: ____ = ["Ali", "Sara"];
    options:
      - text: '`Array[string]`'
        code: 'let names: Array[string] = ["Ali", "Sara"];'
      - text: '`Array<string>`'
        code: 'let names: Array<string> = ["Ali", "Sara"];'
      - text: '`Array(string)`'
