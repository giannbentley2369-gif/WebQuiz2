id: ch3-ts-intro
title: "مشکلات تایپ در JavaScript و معرفی TypeScript"
slides: "NodeJS & TS، اسلایدهای ۱۵ تا ۱۷"
lesson: |
  تا اینجای کتاب با خودِ JavaScript کار کردیم. در این درس می‌بینیم JavaScript در موضوع **type** (نوع داده؛ مثل عدد، رشته یا boolean) چه ضعف‌هایی دارد و چرا Microsoft زبانی به نام **TypeScript** ساخت. اسلاید ۱۵ فقط صفحه‌ی عنوانِ بخش TypeScript است و درس اصلی از اسلاید ۱۶ شروع می‌شود. این همان هدف سومی است که اسلاید ۲ برای این جلسه گفته بود: حل مشکلات قدیمی تایپ در JavaScript.

  ::: analogy
  فرض کن در یک انبار، روی هیچ جعبه‌ای برچسب نیست. هر چیزی را می‌شود در هر جعبه‌ای گذاشت و تا جعبه را باز نکنی (یعنی تا برنامه اجرا نشود) نمی‌فهمی داخلش چیست. JavaScript شبیه همین انبار است. TypeScript روی جعبه‌ها **برچسب** می‌زند و قبل از ارسال بار، یک بازرس همه‌ی برچسب‌ها را چک می‌کند.
  :::

  ### ۱. دو مفهوم پایه: زمان اجرا و زمان کامپایل
  - **runtime** (زمان اجرا): لحظه‌ای که برنامه واقعاً اجرا می‌شود؛ مثلاً وقتی مرورگر یا Node.js کد را خط به خط اجرا می‌کند.
  - **compile time** (زمان کامپایل): مرحله‌ای **قبل از اجرا** که یک ابزار به نام **compiler** (کامپایلر؛ برنامه‌ای که کد را می‌خواند، بررسی می‌کند و به شکل دیگری تبدیل می‌کند) روی کد کار می‌کند. خطایی که در این مرحله پیدا شود، هیچ‌وقت به دست کاربر نمی‌رسد.

  بر همین اساس زبان‌ها از نظر نوع‌دهی دو دسته‌اند:

  | | **dynamic typing** (نوع‌دهی پویا) | **static typing** (نوع‌دهی ایستا) |
  |---|---|---|
  | نوع به چه چیزی تعلق دارد؟ | به **مقدار**؛ یک متغیر هر بار می‌تواند مقداری با نوع دیگر بگیرد | به **متغیر**؛ نوع متغیر از قبل معلوم و ثابت است |
  | خطای نوع کی پیدا می‌شود؟ | در زمان اجرا (runtime) | در زمان کامپایل، قبل از اجرا |
  | نمونه | JavaScript | TypeScript، Java، C# |

  ### ۲. مشکلات تایپ در JavaScript (اسلاید ۱۶)
  اسلاید ۱۶ پنج مشکل را نام می‌برد. بیا هر کدام را با مثال ببینیم.

  #### مشکل ۱: نوع‌دهی پویا (dynamically typed)
  در JavaScript نوعِ یک متغیر ثابت نیست و **در زمان اجرا می‌تواند عوض شود**:

  ```js
  let x = 5;             // x holds a number
  console.log(typeof x); // number
  x = "hello";           // now a string: no complaint
  x = true;              // now a boolean
  console.log(typeof x); // boolean
  ```

  این آزادی در برنامه‌ی کوچک راحت است، اما در برنامه‌ی بزرگ نمی‌دانی یک متغیر در لحظه‌ی استفاده چه نوعی دارد.

  #### مشکل ۲: تبدیل نوع خودکار (type coercion)
  وقتی دو مقدار با نوع متفاوت با هم ترکیب می‌شوند، JavaScript بی‌صدا یکی را به نوع دیگر تبدیل می‌کند (جزئیات کامل این قاعده‌ها را در فصل اول دیدیم). مثال خود اسلاید: `"5" + 2 → "52"`؛ علامت `→` یعنی «حاصلش می‌شود».

  ```js
  console.log("5" + 2); // 52 (a string: "5" + "2")
  console.log("5" - 2); // 3  (a number: "5" becomes 5)

  function add(a, b) {
    return a + b;
  }
  console.log(add(2, 3));   // 5
  console.log(add("2", 3)); // 23  <- a hidden bug, but no error!
  ```

  مثلاً مقداری که از یک فیلد فرم HTML خوانده می‌شود همیشه رشته است؛ اگر آن را به این تابع بدهی، به‌جای جمع، دو مقدار به هم چسبانده می‌شوند و هیچ خطایی هم نمی‌بینی.

  #### مشکل ۳: باگ‌های پنهان نوع در کدهای بزرگ
  در پروژه‌ای با صدها فایل و چند برنامه‌نویس، هیچ‌چیز تضمین نمی‌کند که یک تابع با داده‌ی درست صدا زده شود. حتی یک غلط املایی ساده خطا نمی‌دهد؛ فقط `undefined` برمی‌گرداند و باگ جای دیگری از برنامه خودش را نشان می‌دهد. به همین دلیل نگه‌داری (maintain) کدهای بزرگ JavaScript سخت است:

  ```js
  const user = { name: "Ali" };
  console.log(user.nmae); // undefined (a typo, but no error)
  ```

  #### مشکل ۴: نبودن بررسی‌های زمان کامپایل (compile-time checks)
  JavaScript قبل از اجرا کد را از نظر نوع بررسی نمی‌کند؛ پس بسیاری از خطاها **فقط وقتی همان خط اجرا شود** پیدا می‌شوند:

  ```js
  function shout(msg) {
    return msg.toUppercase(); // typo: the real method is toUpperCase
  }
  console.log("app started");
  console.log(shout("hi"));   // TypeError: msg.toUppercase is not a function
  ```

  خط `app started` بی‌مشکل چاپ می‌شود و برنامه تازه در خط آخر از کار می‌افتد. اگر `shout` فقط در یک حالت نادر صدا زده شود، این باگ ممکن است ماه‌ها پنهان بماند و یک روز برای کاربر واقعی رخ دهد.

  #### مشکل ۵: رفتار ناسازگار در موتورها و نسخه‌های مختلف
  کد JavaScript روی موتورهای مختلف (مثلاً V8 در Chrome و Node.js، SpiderMonkey در Firefox و JavaScriptCore در Safari) و نسخه‌های مختلفِ آن‌ها اجرا می‌شود. قابلیتی که در نسخه‌ی جدید هست ممکن است در مرورگر قدیمی نباشد و گاهی حتی رفتار یک تابع فرق کرده است؛ مثلاً در مرورگرهای خیلی قدیمی `parseInt("08")` به‌جای ۸ عدد ۰ را برمی‌گرداند. این تفاوت‌ها باگ‌های ظریفی می‌سازند که فقط روی بعضی سیستم‌ها دیده می‌شوند.

  ### ۳. معرفی TypeScript (اسلاید ۱۷)
  - **سازنده و سال:** شرکت Microsoft در سال ۲۰۱۲ آن را معرفی کرد.
  - **طراح:** طراحی آن را **Anders Hejlsberg** رهبری کرد؛ کسی که معمار اصلی (lead architect) زبان‌های **C#** و **Delphi** هم هست.
  - **هدف:** اضافه کردن **static typing** (نوع‌دهی ایستا) و **tooling** (ابزارهای کمکی برنامه‌نویسی) به JavaScript برای پروژه‌های بزرگ.
  - **superset تدریجی و اختیاری** (gradual, optional superset): TypeScript یک «ابرمجموعه»ی JavaScript است و می‌شود آن را کم‌کم وارد یک پروژه کرد.
  - **محبوبیت:** خیلی زود در نرم‌افزارهای سازمانی (enterprise) و وب‌اپلیکیشن‌های پیچیده محبوب شد؛ برای نمونه ویرایشگر VS Code و فریم‌ورک Angular با TypeScript نوشته شده‌اند.
  - **مسیر اجرا:** TypeScript می‌نویسی ← به JavaScript تبدیل می‌شود ← هر جایی که JavaScript اجرا شود (مرورگر، Node.js و …) اجرا می‌شود.

  #### superset یعنی چه؟
  یعنی هر کد JavaScript از نظر **syntax** (نحو؛ قواعد نوشتن کد) یک کد TypeScript هم هست. TypeScript چیزی از JavaScript کم نمی‌کند، فقط **نوع‌ها** را به آن اضافه می‌کند: TypeScript = JavaScript + types. نوع با یک **type annotation** (برچسب نوع؛ دونقطه و نام نوع بعد از اسم متغیر) نوشته می‌شود:

  ```ts
  let age: number = 25; // ": number" is a type annotation
  age = 26;             // OK
  age = "twenty";       // Error TS2322: Type 'string' is not assignable to type 'number'.
  ```

  اما «نحوِ معتبر داشتن» با «بی‌خطا بودن» فرق دارد. کد زیر هیچ نوعی ندارد و یک JavaScript کاملاً درست است که در Node.js بدون خطا اجرا می‌شود؛ با این حال tsc برایش خطا گزارش می‌کند، چون از روی مقدار اولیه فهمیده `count` عدد است:

  ```ts
  let count = 0;     // plain JavaScript: no types written
  count = count + 1; // OK
  count = "zero";    // Error TS2322: Type 'string' is not assignable to type 'number'.
  ```

  پس **هر کد JavaScript نحوِ معتبر TypeScript را دارد، ولی ممکن است tsc در آن خطای نوع پیدا کند.**

  #### تدریجی و اختیاری یعنی چه؟
  - **اختیاری (optional):** نوشتن نوع اجباری نیست؛ هر جا ننویسی، TypeScript نوع را از روی مقدار تشخیص می‌دهد (به این کار type inference می‌گویند و در درس بعد کامل می‌آید).
  - **تدریجی (gradual):** لازم نیست کل پروژه را یک‌جا بازنویسی کنی؛ می‌توانی فایل‌ها را یکی‌یکی از `.js` به `.ts` تغییر نام بدهی و کم‌کم نوع اضافه کنی.

  #### tooling یعنی چه؟
  چون ویرایشگر (مثلاً VS Code) نوع هر متغیر را می‌داند، می‌تواند:
  - هنگام تایپ، متدها و ویژگی‌های درست را پیشنهاد بدهد (autocomplete)؛
  - خطاها را همان لحظه زیر کد خط قرمز بکشد، قبل از اینکه برنامه را اجرا کنی؛
  - نام یک متغیر یا تابع را در کل پروژه با خیال راحت عوض کند (rename / refactor) و با یک کلیک به محل تعریف هر چیز برود (go to definition).

  ### ۴. کامپایلر tsc: از TypeScript تا JavaScript
  مرورگرها TypeScript را نمی‌فهمند. ابزاری به نام **tsc** (TypeScript Compiler) فایل `.ts` را بررسی می‌کند و به فایل `.js` تبدیل می‌کند:

  ```ts title=app.ts
  let age: number = 25;
  function greet(name: string): string {
    return "Hello, " + name;
  }
  console.log(greet("Ali"), age);
  ```

  ```bash
  npm install -D typescript   # install the compiler in the project
  npx tsc app.ts              # check app.ts and create app.js
  node app.js                 # prints: Hello, Ali 25
  ```

  ```js title=app.js
  "use strict";
  let age = 25;
  function greet(name) {
      return "Hello, " + name;
  }
  console.log(greet("Ali"), age);
  ```

  در خروجی **هیچ اثری از نوع‌ها نیست**؛ به این کار **type erasure** (پاک شدن نوع‌ها) می‌گویند. نوع‌ها فقط برای کامپایلر و ویرایشگرند: هیچ بررسی‌ای در زمان اجرا به کد اضافه نمی‌شود و برنامه نه سریع‌تر می‌شود و نه کندتر. (خط `"use strict";` را خود tsc در حالت strict اضافه می‌کند.)

  #### خواندن پیام خطای tsc
  اگر در فایل خطای نوع باشد، tsc چیزی شبیه این چاپ می‌کند:

  ```text
  app.ts(2,1): error TS2322: Type 'string' is not assignable to type 'number'.
  ```

  یعنی در فایل `app.ts`، خط ۲، ستون ۱، خطایی با کد `TS2322` هست: «نوع string را نمی‌شود به نوع number نسبت داد». لازم نیست کد خطاها را حفظ کنی؛ در درس‌های بعد فقط برای آشنایی کنار مثال‌ها می‌آیند.

  #### فایل tsconfig.json و حالت strict
  در یک پروژه‌ی واقعی، تنظیمات کامپایلر در فایلی به نام `tsconfig.json` نوشته می‌شود. دستور `npx tsc --init` این فایل را با تنظیمات پیشنهادی می‌سازد که یکی از آن‌ها `"strict": true` است. بعد از آن کافی است فقط `npx tsc` (بدون نام فایل) را اجرا کنی تا همه‌ی فایل‌های پروژه طبق همین تنظیمات کامپایل شوند. بخشی از این فایل:

  ```json title=tsconfig.json
  {
    "compilerOptions": {
      "target": "esnext",
      "strict": true
    }
  }
  ```

  حالت **strict** (سخت‌گیرانه) چند بررسی مهم را با هم روشن می‌کند؛ مثلاً اجازه نمی‌دهد پارامتر یک تابع بدون نوع بماند یا `null` در متغیری از نوع `number` قرار بگیرد. **در این کتاب همه‌جا فرض می‌کنیم strict روشن است** (همان پیش‌فرض `tsc --init`) و همه‌ی مثال‌ها و تست‌ها با همین فرض بررسی شده‌اند.

  ### ۵. TypeScript چطور مشکلات اسلاید ۱۶ را حل می‌کند؟

  | مشکل در JavaScript | پاسخ TypeScript |
  |---|---|
  | متغیر در زمان اجرا نوع عوض می‌کند | نوع متغیر ثابت می‌ماند؛ `count = "zero"` خطای کامپایل دارد |
  | تبدیل نوع خودکار و نتایج عجیب | عملیات مشکوک مثل `"5" - 2`، `true + true` و `null + 1` گزارش می‌شوند |
  | باگ‌های پنهان در کدهای بزرگ | غلط‌های املایی و فراخوانی‌های اشتباه قبل از اجرا پیدا می‌شوند؛ نوع‌ها مثل مستندات عمل می‌کنند |
  | خطاها فقط در زمان اجرا دیده می‌شوند | tsc و ویرایشگر خطا را قبل از اجرا نشان می‌دهند |
  | تفاوت موتورها و نسخه‌ها | با تنظیم `target` خروجی برای نسخه‌ی موردنظر JavaScript ساخته می‌شود |

  ```ts
  const a = "5" + 2;     // OK: type string (concatenation is allowed)
  const b = "5" - 2;     // Error TS2362: The left-hand side of an arithmetic operation must be of type 'any', 'number', 'bigint' or an enum type.
  const c = true + true; // Error TS2365: Operator '+' cannot be applied to types 'boolean' and 'boolean'.
  const d = null + 1;    // Error TS18050: The value 'null' cannot be used here.
  ```

  و همان باگ تابع `shout` این بار **قبل از اجرا** پیدا می‌شود، حتی اگر `shout` هیچ‌وقت صدا زده نشود:

  ```ts
  function shout(msg: string): string {
    return msg.toUppercase(); // Error TS2551: Property 'toUppercase' does not exist on type 'string'. Did you mean 'toUpperCase'?
  }
  ```

  ::: tip
  نوع‌ها فقط برای کامپایلر و ویرایشگرند. بعد از کامپایل هیچ اثری از آن‌ها در JavaScript نمی‌ماند؛ پس TypeScript نه برنامه را سریع‌تر می‌کند و نه در زمان اجرا نوع‌ها را چک می‌کند. تمام کمکش **قبل از اجرا** است.
  :::

  ::: trap
  - `"5" + 2` در TypeScript **خطا نیست**! چون چسباندن رشته کار مجازی است، tsc آن را قبول می‌کند و نوع حاصل را `string` می‌داند. اما `"5" - 2` خطای کامپایل دارد.
  - superset یعنی هر کد JavaScript نحوِ معتبر TypeScript را دارد؛ **نه** اینکه حتماً بدون خطای نوع کامپایل شود.
  - tsc به‌طور پیش‌فرض حتی وقتی خطای نوع پیدا کند، باز هم فایل `.js` را می‌سازد و فقط خطا را گزارش می‌کند.
  :::

  ::: info بیشتر بدانیم
  - اگر بخواهی در صورت وجود خطا هیچ فایل `.js` ساخته نشود، گزینه‌ی `noEmitOnError` را در `tsconfig.json` روشن کن.
  - با گزینه‌ی `target` تعیین می‌کنی خروجی برای کدام نسخه‌ی JavaScript ساخته شود؛ مثلاً با `"target": "es2015"` عملگر جدید `??` به یک عبارت شرطی معمولی تبدیل می‌شود تا موتورهای قدیمی‌تر هم آن را بفهمند.
  - نسخه‌های جدید Node.js (مثلاً Node.js 24) فایل `.ts` را مستقیم هم اجرا می‌کنند (`node app.ts`)، اما فقط نوع‌ها را پاک می‌کنند و **هیچ بررسی نوعی انجام نمی‌دهند**؛ برای بررسی نوع همچنان tsc لازم است.
  :::

  ::: summary
  JavaScript نوع‌دهی پویا دارد، تبدیل نوع خودکار انجام می‌دهد و خطاهای نوع را فقط در زمان اجرا نشان می‌دهد. TypeScript (Microsoft، سال ۲۰۱۲، با طراحی Anders Hejlsberg) یک superset تدریجی و اختیاری از JavaScript است که static typing و tooling را اضافه می‌کند. کد TypeScript با tsc بررسی و به JavaScript ساده تبدیل می‌شود، نوع‌ها در خروجی پاک می‌شوند و نتیجه هر جا که JavaScript اجرا شود، اجرا می‌شود.
  :::
questions:
  - level: easy
    stem: TypeScript در چه سالی و توسط کدام شرکت معرفی شد؟
    options:
      - "Google، سال ۲۰۰۹"
      - "Facebook، سال ۲۰۱۲"
      - "Microsoft، سال ۲۰۱۲"
      - "Mozilla، سال ۲۰۱۵"
    answer: 3
    explain: |
      طبق اسلاید ۱۷، TypeScript را Microsoft در سال ۲۰۱۲ معرفی کرد. گزینه‌ی ۲ سال درست را با شرکت نادرست ترکیب کرده است. Google سازنده‌ی موتور V8 است و Mozilla سازنده‌ی Firefox؛ هیچ‌کدام TypeScript را نساخته‌اند.

  - level: easy
    stem: |
      در جای خالی کدام گزینه قرار می‌گیرد؟
      «طراحی TypeScript را Anders Hejlsberg رهبری کرد؛ کسی که معمار اصلی زبان‌های ...... است.»
    options:
      - "Java و Kotlin"
      - "C# و Delphi"
      - "Python و Ruby"
      - "C و C++"
    answer: 2
    explain: |
      اسلاید ۱۷ می‌گوید: Anders Hejlsberg, lead architect of C# and Delphi. زبان‌های گزینه‌های دیگر را افراد دیگری طراحی کرده‌اند و در اسلاید هم نیامده‌اند.

  - level: easy
    stem: جمله‌ی «JavaScript یک زبان **dynamically typed** است» یعنی چه؟
    options:
      - نوع متغیرها قبل از اجرا توسط کامپایلر بررسی می‌شود.
      - در JavaScript مقدارها اصلاً نوع ندارند.
      - نوع یک متغیر فقط با توابع تبدیل مثل `Number()` قابل تغییر است.
      - نوع به مقدار تعلق دارد و یک متغیر می‌تواند در زمان اجرا مقدارهایی با نوع‌های مختلف بگیرد.
    answer: 4
    explain: |
      در نوع‌دهی پویا نوع مال **مقدار** است، نه متغیر؛ پس `let x = 5; x = "hi";` در JavaScript کاملاً مجاز است و نوع `x` در زمان اجرا عوض می‌شود. گزینه‌ی ۱ تعریف static typing است. گزینه‌ی ۲ غلط است چون مقدارها نوع دارند (`typeof` همین را نشان می‌دهد). گزینه‌ی ۳ هم غلط است چون با یک انتساب ساده نوع متغیر عوض می‌شود و به تابع تبدیل نیازی نیست.

  - level: easy
    stem: در JavaScript حاصل `"5" + 2` و `"5" - 2` به ترتیب کدام است؟ (دو حاصل در قالب یک آرایه نوشته شده‌اند.)
    check: value
    expr: '["5" + 2, "5" - 2]'
    options: ['`["52", 3]`', '`[7, 3]`', '`["52", "3"]`', '`["7", 3]`']
    answer: 1
    explain: |
      اگر یک طرف `+` رشته باشد، طرف دیگر هم رشته می‌شود و دو رشته به هم می‌چسبند: `"5" + 2` یعنی `"52"` (مثال اسلاید ۱۶). عملگر `-` فقط معنای ریاضی دارد، پس `"5"` به عدد ۵ تبدیل می‌شود و حاصل **عدد** `3` است، نه رشته‌ی `"3"` (گزینه‌ی ۳). گزینه‌های ۲ و ۴ فرض کرده‌اند `+` جمع ریاضی انجام می‌دهد.

  - level: easy
    stem: «TypeScript یک **superset** (ابرمجموعه) از JavaScript است.» منظور از این جمله کدام است؟
    options:
      - هر کد JavaScript از نظر نحو (syntax) یک کد TypeScript هم هست و TypeScript نوع‌ها را به آن اضافه می‌کند.
      - TypeScript زبانی کاملاً جدا با نحو متفاوت است که باید آن را از صفر یاد گرفت.
      - هر کد TypeScript بدون هیچ تغییری مستقیماً در مرورگر اجرا می‌شود.
      - TypeScript بخش کوچکی از JavaScript است که قسمت‌های خطرناک آن حذف شده است.
    answer: 1
    explain: |
      superset یعنی TypeScript همه‌ی JavaScript را در بر دارد و فقط نوع‌ها را اضافه می‌کند (TypeScript = JavaScript + types). گزینه‌ی ۲ برعکس این است. گزینه‌ی ۳ غلط است چون مرورگر TypeScript را نمی‌فهمد و کد باید اول با tsc به JavaScript تبدیل شود. گزینه‌ی ۴ تعریف subset (زیرمجموعه) است، نه superset.

  - level: easy
    stem: دستور `npx tsc --init` چه کاری انجام می‌دهد؟
    options:
      - TypeScript را روی سیستم نصب می‌کند.
      - همه‌ی فایل‌های `.ts` پروژه را اجرا می‌کند.
      - 'فایل `tsconfig.json` را با تنظیمات پیشنهادی (از جمله `"strict": true`) می‌سازد.'
      - فایل `package.json` پروژه را می‌سازد.
    answer: 3
    explain: |
      `tsc --init` فایل تنظیمات کامپایلر یعنی `tsconfig.json` را می‌سازد و در آن `"strict": true` را هم قرار می‌دهد. نصب TypeScript با `npm install -D typescript` انجام می‌شود (گزینه‌ی ۱). tsc اصلاً برنامه را اجرا نمی‌کند، فقط بررسی و ترجمه می‌کند (گزینه‌ی ۲). `package.json` را `npm init` می‌سازد (گزینه‌ی ۴).

  - level: medium
    stem: خروجی کد JavaScript زیر در Node.js کدام است؟
    check: output
    code: |
      let data = 10;
      console.log(typeof data);
      data = "ten";
      console.log(typeof data);
      data = data + 5;
      console.log(data);
    options:
      - out: ["number", "number", "15"]
      - out: ["number", "string", "ten5"]
      - out: ["number", "!! TypeError"]
      - out: ["number", "string", "NaN"]
    answer: 2
    explain: |
      JavaScript نوع‌دهی پویا دارد: `data` اول عدد است و بعد از انتساب `"ten"` رشته می‌شود، بدون هیچ خطایی. سپس `"ten" + 5` چون یک طرف رشته است، به رشته‌ی `"ten5"` تبدیل می‌شود. گزینه‌ی ۳ رفتار TypeScript را با JavaScript قاطی کرده است (تازه TypeScript هم خطا را در زمان کامپایل می‌دهد، نه با TypeError). گزینه‌ی ۴ فکر کرده `+` جمع عددی انجام می‌دهد.

  - level: medium
    stem: کدام خط از کد JavaScript زیر باعث خطا می‌شود؟
    check: error-line
    errorName: TypeError
    code: |
      const user = { name: "Ali" };
      console.log(user.nmae);
      console.log(user.name.toUppercase());
      console.log("done");
    options:
      - { line: 2 }
      - { line: 3 }
      - { line: 4 }
      - { line: 0 }
    answer: 2
    explain: |
      خط ۲ یک غلط املایی دارد (`nmae`)، اما JavaScript فقط `undefined` چاپ می‌کند و خطایی نمی‌دهد؛ این همان «باگ پنهان» اسلاید ۱۶ است. در خط ۳، `toUppercase` وجود ندارد (درستش `toUpperCase` است)، پس `undefined` صدا زده می‌شود و در زمان اجرا `TypeError` رخ می‌دهد. خط ۴ دیگر اجرا نمی‌شود. در TypeScript هر دو غلط (خطوط ۲ و ۳) قبل از اجرا گزارش می‌شدند.

  - level: hard
    stem: خروجی کد JavaScript زیر در Node.js چیست؟
    check: output
    code: |
      function shout(msg) {
        return msg.toUppercase();
      }
      console.log("start");
      if (Math.random() > 2) {
        console.log(shout("hi"));
      }
      console.log("end");
    options:
      - out: ["start", "!! TypeError"]
      - out: ["!! SyntaxError"]
      - out: ["start", "end"]
      - out: ["start", "HI", "end"]
    answer: 3
    explain: |
      `Math.random()` همیشه عددی بین ۰ و ۱ است، پس شرط `> 2` هیچ‌وقت درست نمی‌شود و `shout` اصلاً اجرا نمی‌شود. چون JavaScript قبل از اجرا کد را بررسی نمی‌کند، غلط املایی `toUppercase` هیچ اثری نمی‌گذارد و فقط `start` و `end` چاپ می‌شوند. این یعنی باگ پنهان می‌ماند تا روزی که آن شاخه اجرا شود (گزینه‌ی ۱ فقط در آن حالت درست بود). اشتباه در نام متد خطای نحوی (SyntaxError) نیست و گزینه‌ی ۴ هم هم غلط املایی و هم شرط را نادیده گرفته است.

  - level: medium
    stem: کد TypeScript زیر را با tsc بررسی می‌کنیم. کدام خط خطای کامپایل دارد؟
    check: tsc-line
    code: |
      function shout(msg: string): string {
        return msg.toUppercase();
      }
      console.log("start");
      if (Math.random() > 2) {
        console.log(shout("hi"));
      }
      console.log("end");
    options:
      - { line: 2 }
      - { line: 5 }
      - { line: 6 }
      - { line: 0 }
    answer: 1
    explain: |
      tsc کل کد را **بدون اجرا** بررسی می‌کند؛ پس مهم نیست `shout` هیچ‌وقت صدا زده نشود. چون نوع `msg` رشته است، tsc می‌داند رشته متدی به نام `toUppercase` ندارد و در خط ۲ خطا می‌دهد (پیامش حتی پیشنهاد می‌کند: Did you mean 'toUpperCase'?). خط ۵ یک مقایسه‌ی عددی معمولی است و خط ۶ هم یک رشته را به تابعی می‌دهد که رشته می‌خواهد. گزینه‌ی ۴ طرز فکر JavaScript است که خطا را فقط در زمان اجرا می‌بیند.

  - level: hard
    stem: در TypeScript (حالت strict) کدام دستور **بدون خطا** کامپایل می‌شود؟
    check: option-tsc
    want: ok
    options:
      - code: 'const b = "5" - 2;'
      - code: 'const c = true + true;'
      - code: 'const d = null + 1;'
      - code: 'const a = "5" + 2;'
    answer: 4
    explain: |
      چسباندن رشته با `+` کار مجاز و رایجی است، پس tsc عبارت `"5" + 2` را قبول می‌کند و نوع `a` را `string` می‌داند؛ یعنی TypeScript جلوی همین مثال اسلاید ۱۶ را **نمی‌گیرد**. اما تفریق رشته (`"5" - 2`) خطای TS2362 دارد، جمع دو boolean خطای TS2365 و استفاده از `null` در محاسبه خطای TS18050؛ هر سه در JavaScript بی‌صدا یک عدد می‌ساختند.

  - level: medium
    stem: هر چهار کد زیر در JavaScript بدون خطا اجرا می‌شوند. tsc برای کدام‌یک خطای نوع گزارش می‌کند؟
    check: option-tsc
    options:
      - code: 'let n = 5; n = n + 1;'
      - code: 'let s = "a"; s = s + 1;'
      - code: 'const list = [1, 2]; list.push(3);'
      - code: 'let flag = true; flag = "yes";'
    answer: 4
    explain: |
      tsc از مقدار اولیه نوع `flag` را `boolean` تشخیص می‌دهد و نسبت دادن رشته‌ی `"yes"` به آن خطای TS2322 دارد. این نمونه‌ی همان نکته است که هر کد JavaScript نحوِ معتبر TypeScript دارد ولی ممکن است خطای نوع داشته باشد. در گزینه‌ی ۱ حاصل `n + 1` عدد است. در گزینه‌ی ۲ حاصل `s + 1` رشته است و در متغیر رشته‌ای قرار می‌گیرد. در گزینه‌ی ۳ هم `const` فقط انتساب دوباره را منع می‌کند و `push` کردن عدد به آرایه‌ی عددی مجاز است.

  - level: medium
    stem: کدام گزینه درباره‌ی «تدریجی و اختیاری» (gradual, optional) بودن TypeScript **نادرست** است؟
    options:
      - برای استفاده از TypeScript باید کل پروژه یک‌جا بازنویسی شود و هیچ فایل JavaScript نباید باقی بماند.
      - می‌توان یک پروژه‌ی JavaScript را فایل به فایل به TypeScript تبدیل کرد.
      - نوشتن type annotation اجباری نیست و TypeScript نوع بسیاری از متغیرها را خودش تشخیص می‌دهد.
      - کد TypeScript در نهایت به JavaScript تبدیل می‌شود و هر جا JavaScript اجرا شود، اجرا می‌شود.
    answer: 1
    explain: |
      «تدریجی» دقیقاً یعنی لازم نیست همه‌چیز یک‌جا عوض شود؛ می‌شود فایل‌ها را کم‌کم از `.js` به `.ts` برد و فایل‌های JavaScript و TypeScript مدتی کنار هم باشند. گزینه‌ی ۲ معنای «تدریجی» است، گزینه‌ی ۳ معنای «اختیاری» (به کمک type inference) و گزینه‌ی ۴ همان بولت آخر اسلاید ۱۷.

  - level: medium
    stem: TypeScript برای اضافه کردن static typing و **tooling** به JavaScript ساخته شد. کدام مورد از مزایای این tooling **نیست**؟
    options:
      - پیشنهاد خودکار متدها و ویژگی‌ها هنگام تایپ (autocomplete)
      - اجرای سریع‌تر برنامه در مرورگر به خاطر دانستن نوع‌ها
      - نمایش خطا در ویرایشگر، پیش از اجرای برنامه
      - تغییر نام امن یک تابع در همه‌ی فایل‌های پروژه
    answer: 2
    explain: |
      نوع‌ها در کامپایل پاک می‌شوند (type erasure) و مرورگر همان JavaScript معمولی را اجرا می‌کند؛ پس TypeScript سرعت اجرا را بیشتر نمی‌کند. سه گزینه‌ی دیگر دقیقاً کارهایی‌اند که ویرایشگر به لطف شناختن نوع‌ها انجام می‌دهد: autocomplete، نشان دادن خطا قبل از اجرا و rename امن.

  - level: medium
    stem: کدام گزینه جزو «مشکلات تایپ در JavaScript» که در اسلاید ۱۶ آمده **نیست**؟
    options:
      - متغیرها می‌توانند در زمان اجرا نوع عوض کنند.
      - تبدیل نوع خودکار نتایج غیرمنتظره می‌دهد؛ مثل `"5" + 2`.
      - نبودن بررسی‌های زمان کامپایل باعث می‌شود بسیاری از خطاها فقط هنگام اجرا دیده شوند.
      - اجرای تک‌نخی (single-threaded) باعث می‌شود محاسبات سنگین، اجرای برنامه را متوقف کنند.
    answer: 4
    explain: |
      تک‌نخی بودن یک محدودیت اجرایی JavaScript است که در اسلاید ۳ (Limitations of JavaScript) آمده و ربطی به نوع داده ندارد. سه گزینه‌ی دیگر از بولت‌های اسلاید ۱۶‌اند: نوع‌دهی پویا، type coercion و نبودن compile-time checks. دو مشکل دیگر آن اسلاید هم باگ‌های پنهان در کدهای بزرگ و رفتار ناسازگار در موتورها و نسخه‌های مختلف است.

  - level: hard
    stem: فایل `app.ts` یک خطای نوع دارد. در پوشه‌ی پروژه فایل `tsconfig.json` نیست و هیچ تنظیم خاصی (مثل `noEmitOnError`) هم فعال نشده است. با اجرای `npx tsc app.ts` چه اتفاقی می‌افتد؟
    options:
      - خطا گزارش می‌شود، اما فایل `app.js` باز هم ساخته می‌شود.
      - خطا گزارش می‌شود و فایل `app.js` ساخته نمی‌شود.
      - هیچ خطایی گزارش نمی‌شود؛ خطا فقط هنگام اجرای `app.js` دیده می‌شود.
      - tsc خطا را خودش اصلاح می‌کند و `app.js` درست را می‌سازد.
    answer: 1
    explain: |
      tsc به‌طور پیش‌فرض خطا را گزارش می‌کند ولی خروجی JavaScript را **باز هم** می‌سازد؛ چون نوع‌ها فقط پاک می‌شوند و کد باقی‌مانده قابل اجراست. گزینه‌ی ۲ فقط وقتی درست است که `noEmitOnError` روشن باشد. گزینه‌ی ۳ غلط است چون کار اصلی tsc گزارش خطا قبل از اجراست. tsc هم هیچ‌وقت کد را خودش اصلاح نمی‌کند (گزینه‌ی ۴).

  - level: medium
    stem: کدام گزینه درباره‌ی رابطه‌ی TypeScript و زمان اجرا **درست** است؟
    options:
      - نوع‌هایی که در TypeScript می‌نویسیم در فایل JavaScript خروجی باقی می‌مانند و مرورگر آن‌ها را بررسی می‌کند.
      - tsc نوع‌ها را پاک می‌کند و هیچ بررسی‌ای به کد خروجی اضافه نمی‌کند؛ پس در زمان اجرا چیزی جلوی مقدار نادرست را نمی‌گیرد.
      - چون موتور JavaScript نوع‌ها را از قبل می‌داند، برنامه‌ی TypeScript همیشه سریع‌تر اجرا می‌شود.
      - مرورگرها فایل `.ts` را مستقیماً و بدون هیچ تبدیلی اجرا می‌کنند.
    answer: 2
    explain: |
      در کامپایل، همه‌ی type annotationها پاک می‌شوند (type erasure) و خروجی JavaScript ساده است؛ اگر داده‌ی نادرست از جایی که tsc بررسی نکرده (مثلاً یک مقدار `any` یا داده‌ی یک سرور) برسد، در زمان اجرا چیزی جلویش را نمی‌گیرد. گزینه‌ی ۱ غلط است چون نوع‌ها در خروجی نمی‌مانند. گزینه‌ی ۳ غلط است چون موتور همان JavaScript معمولی را اجرا می‌کند. گزینه‌ی ۴ غلط است چون مرورگر TypeScript را نمی‌فهمد و کد باید اول به JavaScript تبدیل شود.

  - level: hard
    stem: |
      کد TypeScript زیر بدون خطا کامپایل می‌شود (نوع `any` یعنی «هر نوعی؛ بررسی نکن»). خروجی اجرای آن چیست؟
    check: ts-output
    code: |
      function double(n: number): number {
        return n * 2;
      }
      const input: any = "21";
      console.log(double(input));
    options:
      - out: "2121"
      - out: "!! TypeError"
      - out: "42"
      - out: "NaN"
    answer: 3
    explain: |
      چون `input` از نوع `any` است، tsc اجازه می‌دهد آن را به پارامتر `number` بدهیم. در خروجی JavaScript هم نوع‌ها پاک شده‌اند و هیچ بررسی‌ای در زمان اجرا نیست؛ پس رشته‌ی `"21"` واقعاً وارد تابع می‌شود و `"21" * 2` با تبدیل نوع خودکار `42` می‌شود. TypeScript کد بررسی نوع به خروجی اضافه نمی‌کند، پس TypeError رخ نمی‌دهد (گزینه‌ی ۲). عملگر `*` رشته نمی‌چسباند (گزینه‌ی ۱) و `"21"` یک عدد معتبر است، پس حاصل NaN نیست (گزینه‌ی ۴).
