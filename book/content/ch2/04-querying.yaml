id: ch2-querying
title: "پیدا کردن عناصر (Querying the DOM)"
slides: "JS in HTML، اسلایدهای ۱۶ و ۱۷"
lesson: |
  قبل از اینکه بتوانیم متن یک عنصر را عوض کنیم یا به آن listener بدهیم، باید آن را **پیدا کنیم**. اسلاید ۱۶
  می‌گوید: «با JavaScript عنصرهای صفحه را پیدا کن» و پنج متد اصلی را معرفی می‌کند. به این کار
  **querying** (پرس‌وجو، یعنی جست‌وجوی عنصر در درخت DOM) می‌گویند.

  ::: analogy
  فرض کن در یک مدرسه دنبال دانش‌آموزها می‌گردی:
  - با **شماره‌ی دانش‌آموزی** که برای هر نفر یکتاست، دقیقاً یک نفر پیدا می‌کنی: `getElementById`.
  - با **نام کلاس** («همه‌ی دانش‌آموزان کلاس دهم ب») یک فهرست می‌گیری: `getElementsByClassName`.
  - با **نقش** («همه‌ی معلم‌ها») هم یک فهرست می‌گیری: `getElementsByTagName`.
  - با یک **توصیف دقیق و انعطاف‌پذیر** («اولین دانش‌آموزِ کلاس دهم ب که عینک دارد»):
    `querySelector` و `querySelectorAll` با CSS selector.
  :::

  ### پنج متد اسلاید ۱۶ در یک نگاه

  | متد | ورودی | خروجی | اگر چیزی پیدا نشود |
  |---|---|---|---|
  | `getElementById("id")` | نام id، **بدون** `#` | **یک** عنصر | `null` |
  | `getElementsByClassName("class")` | نام کلاس، **بدون** `.` | **همه**: یک HTMLCollection زنده | مجموعه‌ی خالی (`length` برابر `0`) |
  | `getElementsByTagName("tag")` | نام تگ، مثل `"p"` | **همه**: یک HTMLCollection زنده | مجموعه‌ی خالی |
  | `querySelector("selector")` | یک **CSS selector** | **اولین** عنصر منطبق | `null` |
  | `querySelectorAll("selector")` | یک **CSS selector** | **همه**: یک NodeList ایستا | NodeList خالی |

  به نام‌ها دقت کن: `getElementById` مفرد است (Element، چون id یکتاست) ولی `getElementsByClassName` و
  `getElementsByTagName` جمع‌اند (Elements). همه‌ی نام‌ها camelCase هستند؛ مثلاً `getElementByID` (با D
  بزرگ) وجود ندارد و صدا زدنش `TypeError` می‌دهد.

  ### ۱) `getElementById`

  - ورودی، **خودِ نام id** است، بدون `#`.
  - خروجی یک عنصر است، یا `null` اگر عنصری با آن id نباشد.
  - id باید در صفحه **یکتا** باشد؛ اگر به‌اشتباه تکراری باشد، این متد اولین عنصر را برمی‌گرداند.
  - این متد فقط روی `document` وجود دارد، نه روی عنصرها.

  ```js
  const title = document.getElementById("title"); // <h1 id="title">
  console.log(document.getElementById("#title")); // null   (no # here!)
  console.log(document.getElementById("nope"));   // null
  ```

  ### ۲) `getElementsByClassName` و `getElementsByTagName`

  این دو متد یک **HTMLCollection** برمی‌گردانند: مجموعه‌ای **شبه‌آرایه (array-like)** که با اندیس (`[0]`) یا
  `.item(1)` به اعضایش می‌رسی و `.length` دارد، ولی **آرایه نیست** و متدهایی مثل `forEach` و `map` را
  ندارد.

  ```html
  <button class="btn primary">A</button>
  <button class="btn">B</button>
  <script>
    const buttons = document.getElementsByClassName("btn");
    console.log(buttons.length, buttons[0].textContent, buttons.item(1).textContent); // 2 A B
    console.log(document.getElementsByClassName("btn primary").length);             // 1
    console.log(Array.from(buttons).map((b) => b.textContent));                       // ["A", "B"]
    for (const b of buttons) console.log(b.textContent);                              // A, then B
    buttons.forEach((b) => console.log(b)); // TypeError: buttons.forEach is not a function
  </script>
  ```

  - نام کلاس را **بدون نقطه** می‌نویسیم. عنصری با `class="btn primary"` هم کلاس `btn` را دارد و پیدا
    می‌شود.
  - اگر چند کلاس با فاصله بدهی (`"btn primary"`)، فقط عنصرهایی پیدا می‌شوند که **همه‌ی** آن کلاس‌ها را
    داشته باشند؛ ترتیب کلاس‌ها مهم نیست.
  - این متدها هیچ‌وقت `null` برنمی‌گردانند؛ اگر چیزی پیدا نشود، مجموعه‌ای خالی با `length` برابر `0` می‌دهند.
  - برای استفاده از متدهای آرایه، مجموعه را با `Array.from(...)` یا `[...collection]` به آرایه تبدیل کن؛
    حلقه‌ی `for...of` هم مستقیم روی HTMLCollection کار می‌کند.
  - `getElementsByTagName("*")` همه‌ی عنصرها را برمی‌گرداند.

  ### ۳) `querySelector` و `querySelectorAll` با CSS selector

  این دو متد یک **CSS selector** (همان الگوهایی که در CSS برای انتخاب عنصر می‌نویسی) می‌گیرند و برای همین
  از همه انعطاف‌پذیرترند:

  | selector | معنی | مثال |
  |---|---|---|
  | `#id` | عنصری با این id | `#title` |
  | `.class` | عنصرهایی با این کلاس | `.btn` |
  | `tag` | عنصرهایی با این تگ | `button` |
  | `tag.class` | تگ مشخص با کلاس مشخص | `a.nav-link` |
  | `.a.b` (بدون فاصله) | عنصری که **هر دو** کلاس را دارد | `.btn.primary` |
  | `[attr]` | عنصرهایی که این attribute را دارند | `[href]` |
  | `[attr='value']` | attribute با مقدار مشخص | `input[type='text']` |
  | `A B` (با فاصله) | Bهایی که **هر جایی داخل** A هستند (نواده) | `div p` |
  | `A > B` | Bهایی که **فرزند مستقیم** A هستند | `div > p` |
  | `A, B` | گروه: هر عنصری که A **یا** B باشد | `h1, .note` |

  - `querySelector` **اولین** عنصر منطبق را به ترتیب سند (از بالا به پایین) برمی‌گرداند، یا `null`.
  - `querySelectorAll` **همه‌ی** عنصرهای منطبق را در یک **NodeList** برمی‌گرداند. NodeList هم شبه‌آرایه است،
    ولی برخلاف HTMLCollection متد `forEach` **دارد** (هنوز `map` و `filter` ندارد).
  - نتیجه‌ها همیشه به **ترتیب سند** هستند، نه به ترتیب نوشتن selectorها در یک گروه.

  ```html
  <h1 id="title">Shop</h1>
  <div id="menu">
    <a class="nav-link" href="#home">Home</a>
    <a class="nav-link active" href="#shop">Shop</a>
    <a class="btn" href="#buy">Buy</a>
  </div>
  <p class="note">First</p>
  <input type="checkbox" id="agree">
  <input type="text" id="user">
  <script>
    console.log(document.querySelector("#title").textContent);         // "Shop"
    console.log(document.querySelector(".nav-link").textContent);      // "Home" (only the first)
    console.log(document.querySelectorAll("a.nav-link").length);       // 2
    console.log(document.querySelectorAll(".nav-link.active").length); // 1
    console.log(document.querySelector("input[type='text']").id);      // "user" (the checkbox is skipped)
    console.log(document.querySelectorAll("#menu > a").length);        // 3
    console.log(document.querySelectorAll("h1, .note").length);        // 2
    console.log(document.querySelector(".nope"));                      // null
  </script>
  ```

  ::: tip `#` بگذارم یا نه؟
  متدهای `getElement...` **نام خالی** می‌گیرند (`getElementById("title")`، `getElementsByClassName("btn")`)،
  ولی `querySelector` و `querySelectorAll` **CSS selector** می‌گیرند و علامت لازم را می‌خواهند
  (`querySelector("#title")`، `querySelector(".btn")`). `querySelector("title")` دنبال **تگ** `<title>`
  می‌گردد، نه عنصری با id برابر `title`.
  :::

  ### فعالیت کلاسی اسلاید ۱۷: هر خط چه می‌کند؟

  ```js title=sample.js
  const title = document.getElementById("title");
  const buttons = document.getElementsByClassName("btn");
  const paragraphs = document.getElementsByTagName("p");
  const firstInput = document.querySelector("input[type='text']");
  const allLinks = document.querySelectorAll("a.nav-link");
  ```

  | خط | چه می‌کند | نتیجه |
  |---|---|---|
  | ۱ | عنصری که id آن `title` است (نام بدون `#`) | یک عنصر، یا `null` |
  | ۲ | همه‌ی عنصرهایی که کلاس `btn` دارند، حتی اگر کلاس دیگری هم داشته باشند (`class="btn primary"`) | HTMLCollection زنده |
  | ۳ | همه‌ی تگ‌های `<p>` صفحه | HTMLCollection زنده |
  | ۴ | **اولین** `<input>`ی که attribute `type` آن `text` است (attribute selector)؛ چک‌باکس‌ها و inputهای دیگر رد می‌شوند | یک عنصر، یا `null` |
  | ۵ | همه‌ی `<a>`هایی که کلاس `nav-link` دارند (selector از نوع `tag.class`) | NodeList ایستا |

  در خط ۴، رشته با `"` باز شده و مقدار attribute داخلش با `'` آمده (`"input[type='text']"`) تا دو نوع
  کوتیشن قاطی نشوند. نتیجه‌ها هم با `const` نگه داشته شده‌اند. اگر این کد را روی صفحه‌ی آزمایشی زیر اجرا
  کنیم:

  ```html
  <h1 id="title">Welcome</h1>
  <button class="btn primary">A</button>
  <button class="btn">B</button>
  <p>First paragraph</p>
  <p>Second paragraph</p>
  <input type="checkbox" id="remember">
  <input type="text" id="username">
  <a class="nav-link" href="#home">Home</a>
  <a class="nav-link" href="#about">About</a>
  <a href="#help">Help</a>
  ```

  نتیجه این است: `title` همان `<h1>` است، `buttons.length` برابر `2`، `paragraphs.length` برابر `2`،
  `firstInput.id` برابر `"username"` (چک‌باکس رد شد) و `allLinks.length` برابر `2` (لینک Help کلاس
  `nav-link` ندارد).

  ### مجموعه‌ی زنده (live) در برابر ایستا (static)

  HTMLCollectionی که `getElementsBy...` برمی‌گرداند **زنده (live)** است: اگر بعداً DOM تغییر کند، خودش
  به‌روز می‌شود. ولی NodeList `querySelectorAll` **ایستا (static)** است: یک عکس فوری (snapshot) از لحظه‌ی
  جست‌وجو.

  ```html
  <ul id="list"><li class="item">a</li><li class="item">b</li></ul>
  <script>
    const live = document.getElementsByClassName("item"); // HTMLCollection (live)
    const fixed = document.querySelectorAll(".item");     // NodeList (static)

    const li = document.createElement("li");              // a new <li> (see the lesson on adding elements)
    li.className = "item";
    document.getElementById("list").appendChild(li);

    console.log(live.length, fixed.length);               // 3 2
  </script>
  ```

  همین زنده بودن یک دام معروف دارد: اگر در حلقه‌ای روی مجموعه‌ی زنده، کلاسی را که با آن جست‌وجو کرده‌ای
  حذف کنی، عنصرها از زیر دستت از مجموعه بیرون می‌روند و حلقه بعضی‌ها را جا می‌اندازد:

  ```js
  // 4 paragraphs: <p class="red">1</p> ... <p class="red">4</p>
  const reds = document.getElementsByClassName("red");
  for (let i = 0; i < reds.length; i++) {
    reds[i].classList.remove("red"); // the element leaves the live collection immediately!
  }
  console.log(document.getElementsByClassName("red").length); // 2  (items 2 and 4 were skipped)
  ```

  راه‌حل: روی یک کپی ثابت حلقه بزن (`for (const p of Array.from(reds))`) یا از `querySelectorAll` استفاده کن
  که ایستاست.

  ### جست‌وجو داخل یک عنصر

  `querySelector`، `querySelectorAll`، `getElementsByClassName` و `getElementsByTagName` روی هر **عنصری**
  هم صدا زده می‌شوند و آن وقت فقط **داخل همان عنصر** (بین نوادگانش) می‌گردند. ولی `getElementById` فقط روی
  `document` وجود دارد:

  ```html
  <p class="note">First</p>
  <div class="box">
    <p>Inside box</p>
    <section><p class="note">Deep</p></section>
  </div>
  <script>
    const box = document.querySelector(".box");
    console.log(box.querySelector("p").textContent);   // "Inside box" (first <p> INSIDE .box)
    console.log(box.querySelectorAll(".note").length); // 1  (document-wide it would be 2)
    console.log(typeof box.getElementById);            // "undefined" -> calling it throws TypeError
  </script>
  ```

  ### idی که با رقم شروع می‌شود (`id="2223"` در اسلاید ۱۰)

  در CSS، شناسه‌ها (id و نام کلاس داخل selector) نمی‌توانند با رقم شروع شوند. برای همین
  `document.querySelector("#2223")` یک selector **نامعتبر** است و خطای `SyntaxError` (با پیامی شبیه
  `'#2223' is not a valid selector`) می‌دهد. ولی `getElementById` اصلاً CSS نمی‌فهمد و فقط id را مقایسه
  می‌کند:

  ```js
  document.getElementById("2223");            // works: <h3 id="2223">
  document.querySelector('[id="2223"]');      // works: attribute selector
  document.querySelector("#" + CSS.escape("2223")); // works: escaped selector
  document.querySelector("#2223");            // SyntaxError: not a valid selector
  ```

  ::: trap
  - `getElementById("#title")` همیشه `null` می‌دهد (چون `#` جزو نام id نیست) و استفاده از آن نتیجه
    (`.textContent`) خطای `TypeError` می‌دهد.
  - HTMLCollection متد `forEach` ندارد (`TypeError`)، ولی NodeList دارد. هیچ‌کدام `map` ندارند.
  - متدهای جمع (`getElementsBy...` و `querySelectorAll`) وقتی چیزی پیدا نکنند `null` نمی‌دهند، مجموعه‌ی خالی
    می‌دهند؛ متدهای مفرد (`getElementById` و `querySelector`) `null` می‌دهند.
  - `querySelector` فقط **اولین** مورد را برمی‌گرداند؛ برای همه، `querySelectorAll` لازم است.
  - `"div p"` (با فاصله: همه‌ی نوادگان) با `"div > p"` (فقط فرزند مستقیم) و `".a.b"` (هر دو کلاس) با
    `".a .b"` (عنصر `.b` داخل `.a`) فرق دارد.
  :::

  ::: summary
  - یکی با id: `getElementById("id")` (بدون `#`، عنصر یا `null`).
  - همه با کلاس یا تگ: `getElementsByClassName` / `getElementsByTagName` (HTMLCollection زنده، بدون `forEach`).
  - با CSS selector: `querySelector` (اولین مورد یا `null`) و `querySelectorAll` (NodeList ایستا با `forEach`).
  - جست‌وجو داخل یک عنصر: `el.querySelector(...)`؛ `getElementById` فقط روی `document`.
  - id با رقم اول: `querySelector("#2223")` خطای `SyntaxError` می‌دهد ولی `getElementById("2223")` کار می‌کند.
  :::
questions:
  - level: easy
    stem: '`document.getElementById("main")` چه چیزی برمی‌گرداند؟'
    options:
      - 'یک HTMLCollection از عنصرهایی که id آن‌ها `main` است'
      - 'یک NodeList'
      - 'یک عنصر، یا `null` اگر عنصری با این id نباشد'
      - 'آرایه‌ای از عنصرها'
    answer: 3
    explain: |
      طبق اسلاید ۱۶، `getElementById` «finds one element by its ID»؛ چون id باید یکتا باشد، خروجی یک عنصر است
      (نام متد هم مفرد است: Element). اگر عنصری پیدا نشود `null` برمی‌گرداند. HTMLCollection خروجی
      `getElementsBy...` است (گزینه‌ی ۱) و NodeList خروجی `querySelectorAll` (گزینه‌ی ۲)؛ هیچ‌کدام از این
      متدها آرایه‌ی واقعی برنمی‌گردانند (گزینه‌ی ۴).
  - level: easy
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <h1 id="title">Shop</h1>
    code: |
      console.log(document.getElementById("#title"));
      console.log(document.querySelector("#title").textContent);
    options:
      - out: ["Shop", "Shop"]
      - out: ["null", "Shop"]
      - out: ["null", "null"]
      - out: ["!! SyntaxError"]
    answer: 2
    explain: |
      `getElementById` نام خالی id را می‌گیرد و `#` را جزو نام حساب می‌کند؛ عنصری با id برابر `#title` نداریم،
      پس `null` چاپ می‌شود (رد گزینه‌ی ۱). `querySelector` یک CSS selector می‌گیرد و `#title` یعنی «عنصر با
      id برابر title»، پس متن `Shop` چاپ می‌شود (رد گزینه‌ی ۳). `getElementById` هرگز به‌خاطر رشته‌ی
      ورودی‌اش خطای نحوی نمی‌دهد (رد گزینه‌ی ۴).
  - level: easy
    stem: کدام متد عنصر را با یک **CSS selector** پیدا می‌کند؟
    options:
      - '`getElementById`'
      - '`getElementsByClassName`'
      - '`getElementsByTagName`'
      - '`querySelector`'
    answer: 4
    explain: |
      طبق اسلاید ۱۶، `querySelector` اولین تطابق را «using CSS selectors» پیدا می‌کند (و `querySelectorAll`
      همه‌ی تطابق‌ها را). سه متد دیگر فقط یک **نام** ساده می‌گیرند: نام id، نام کلاس یا نام تگ؛ به همین دلیل
      `getElementById("#x")` یا `getElementsByClassName(".x")` چیزی پیدا نمی‌کنند.
  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <p class="note">First</p>
      <div class="box">
        <p>Inside box</p>
        <section><p class="note">Deep</p></section>
      </div>
    code: |
      console.log(
        document.querySelectorAll("div p").length,
        document.querySelectorAll("div > p").length,
        document.getElementsByTagName("p").length
      );
    options:
      - out: "2 1 3"
      - out: "2 2 3"
      - out: "1 1 3"
      - out: "3 1 3"
    answer: 1
    explain: |
      `div p` (با فاصله) یعنی هر `<p>`ی که **هر جایی داخل** یک `div` باشد: `Inside box` و `Deep`، پس `2`
      (پاراگراف `First` بیرون `div` است؛ رد گزینه‌ی ۴). `div > p` فقط **فرزند مستقیم** را می‌گیرد؛ `Deep`
      داخل `<section>` است و فرزند مستقیم `div` نیست، پس `1` (رد گزینه‌ی ۲). `getElementsByTagName("p")`
      همه‌ی `<p>`های صفحه را می‌شمارد: `3`. گزینه‌ی ۳ فرق «نواده» و «فرزند مستقیم» را نمی‌داند.
  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <div class="card big">1</div>
      <div class="big card">2</div>
      <div class="card">3</div>
    code: |
      console.log(
        document.getElementsByClassName("card big").length,
        document.querySelectorAll(".card.big").length,
        document.querySelectorAll(".card .big").length
      );
    options:
      - out: "1 1 0"
      - out: "2 2 0"
      - out: "2 2 2"
      - out: "3 2 0"
    answer: 2
    explain: |
      `getElementsByClassName("card big")` عنصرهایی را می‌دهد که **هر دو** کلاس را داشته باشند و ترتیب نوشتن
      کلاس‌ها مهم نیست؛ پس `div`های ۱ و ۲ (`2`؛ رد گزینه‌ی ۱ که فکر کرده ترتیب مهم است، و گزینه‌ی ۴ که فکر
      کرده یکی از کلاس‌ها کافی است). `.card.big` (بدون فاصله) هم همین معنا را دارد: `2`. اما `.card .big` (با
      فاصله) یعنی «عنصر `.big` **داخل** یک `.card`» که اینجا وجود ندارد: `0` (رد گزینه‌ی ۳).
  - level: medium
