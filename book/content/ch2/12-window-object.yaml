id: ch2-window
title: "شیء window: پنجره‌ی مرورگر"
slides: "JS in HTML، اسلایدهای ۳۶ و ۳۷"
lesson: |
  تا این‌جا بیشتر با `document` (خودِ صفحه) کار کردیم. اما `document` داخل شیء بزرگ‌تری زندگی می‌کند: **`window`**، یعنی پنجره (یا تب) مرورگری که صفحه در آن باز شده است. در نمودار اسلاید ۱۲ دیدیم که `window` در بالاترین سطح است و `document` فقط یکی از فرزندان آن است.

  ::: analogy
  `window` را یک آپارتمان در نظر بگیر و `document` را اتاق نشیمنش که مبلمان (محتوای صفحه) در آن است. آپارتمان اتاق‌ها و وسایل دیگری هم دارد: پلاک آدرس روی در (`location`)، راهرویی که اتاق‌های قبلاً دیده‌شده را به یاد دارد (`history`)، شناسنامه‌ی ساختمان (`navigator`)، اطلاعات پنجره‌ی بزرگ رو به خیابان (`screen`)، کمد (`localStorage`) و ساعت زنگ‌دار (تایمرها).
  :::

  ```text
  window
  ├── document ── anchors, links, images, scripts, forms ── elements, ...
  ├── event
  ├── frames
  ├── location
  ├── history
  ├── navigator ── plugins, mimeTypes
  └── screen
  ```

  اسلاید ۳۶ درباره‌ی `window` می‌گوید:

  - پنجره‌ی مرورگری را نشان می‌دهد که صفحه‌ی وب در آن است.
  - همه‌ی اشیا، توابع و متغیرهای **سراسری** (global) JavaScript به آن تعلق دارند.
  - متدهایی مثل `alert()`، `confirm()` و `prompt()` دارد.
  - به `location`، `history`، `navigator` و موارد دیگر دسترسی می‌دهد.
  - تایمرهای `setTimeout()` و `setInterval()` را فراهم می‌کند.
  - propertyهای `innerWidth`، `innerHeight`، `scrollX` و `scrollY` را دارد.

  ### ۱) `window` همان شیء سراسری است

  در مرورگر، `window` شیء سراسری (global object) است؛ یعنی هر چیزی که «همه‌جا در دسترس است» در واقع property آن است:

  ```js
  var a = 1;            // global var           -> becomes window.a
  function greet() {}   // global function      -> becomes window.greet
  let b = 2;            // global let           -> NOT a window property
  const c = 3;          // global const         -> NOT a window property
  class Car {}          // global class         -> NOT a window property
  console.log(window.a, window.b, window.c, typeof window.greet);  // 1 undefined undefined "function"
  ```

  - `var` و اعلان تابع (function declaration) در سطح بالای یک اسکریپت، property شیء `window` می‌شوند.
  - `let`، `const` و `class` هم سراسری‌اند (از همه‌جا قابل استفاده‌اند) ولی در جای جداگانه‌ای نگه داشته می‌شوند و property `window` **نمی‌شوند**.
  - همه‌ی چیزهای آماده‌ی مرورگر روی `window` هستند: `window.document`، `window.console`، `window.alert`، `window.setTimeout`، `window.localStorage` و… . به همین دلیل نوشتن `window.` **اختیاری** است: `alert("Hi")` همان `window.alert("Hi")` است و `alert === window.alert` برابر `true`.
  - در سطح بالای یک اسکریپت معمولی `this === window` است؛ و در حالت غیر strict، تابعی که به‌تنهایی صدا زده شود (`show()`) هم `this` را برابر `window` می‌بیند (یادآوری `this` از فصل اول).
  - `globalThis` نام استاندارد شیء سراسری در **هر** محیطی است: در مرورگر همان `window` و در Node.js شیء `global`. در Node.js اصلاً `window` وجود ندارد (`ReferenceError: window is not defined`) و `var` سطح بالای یک فایل هم property شیء سراسری نمی‌شود.

  ### ۲) پنجره‌های گفت‌وگو: `alert`، `confirm` و `prompt`

  ```js
  alert("Saved!");                              // message + OK          -> undefined
  const sure = confirm("Delete this item?");    // OK / Cancel           -> true / false
  const name = prompt("Your name?", "Guest");   // text box + OK/Cancel  -> string or null
  ```

  | تابع | کاربر چه می‌بیند؟ | مقدار برگشتی |
  |---|---|---|
  | `alert(msg)` | پیام + دکمه‌ی OK | `undefined` |
  | `confirm(msg)` | پیام + OK و Cancel | OK ← `true`، Cancel ← `false` |
  | `prompt(msg, default)` | پیام + کادر متن (با مقدار پیش‌فرض اختیاری) + OK و Cancel | متن تایپ‌شده به‌صورت **رشته** (حتی اگر عدد تایپ شود؛ کادر خالی ← `""`)، و با Cancel ← `null` |

  هر سه پنجره **مودال و مسدودکننده** (modal و blocking) هستند: تا کاربر جواب ندهد، صفحه قفل است و اجرای JavaScript **در همان خط منتظر می‌ماند**؛ حتی callbackهای تایمرها و رویدادها هم تا بعد از تمام شدن کد فعلی صبر می‌کنند. ظاهرشان را هم نمی‌شود با CSS تغییر داد؛ برای همین سایت‌های امروزی معمولاً پنجره‌های دلخواه با HTML و CSS می‌سازند، ولی این سه برای یادگیری و آزمایش خیلی راحت‌اند.

  ```js
  const input = prompt("How old are you?");
  if (input === null) {
    console.log("User cancelled");
  } else {
    const age = Number(input);   // "20" -> 20
    console.log("Next year you will be " + (age + 1));
  }
  ```

  ### ۳) `location`: آدرس صفحه

  `window.location` شیئی است که **آدرس (URL) صفحه‌ی فعلی** را نگه می‌دارد؛ نه موقعیت جغرافیایی کاربر (آن کارِ `navigator.geolocation` است). برای آدرس `https://shop.example.com:8080/products/list.html?page=2#reviews`:

  | property | مقدار |
  |---|---|
  | `href` | کل آدرس |
  | `protocol` | `"https:"` |
  | `host` | `"shop.example.com:8080"` (نام میزبان + پورت) |
  | `hostname` | `"shop.example.com"` |
  | `port` | `"8080"` |
  | `pathname` | `"/products/list.html"` |
  | `search` | `"?page=2"` (رشته‌ی پرس‌وجو، query string) |
  | `hash` | `"#reviews"` |
  | `origin` | `"https://shop.example.com:8080"` |

  `location` فقط خواندنی نیست:

  ```js
  location.href = "https://example.com";   // navigate to a new page (adds a history entry)
  location.assign("https://example.com");  // the same as above
  location.replace("https://example.com"); // navigate WITHOUT a history entry (Back will not return here)
  location.reload();                       // reload the current page
  ```

  ### ۴) `history`، `navigator` و `screen`

  - **`history`** (تاریخچه‌ی همین تب): `history.back()` مثل دکمه‌ی Back مرورگر، `history.forward()` مثل دکمه‌ی Forward، `history.go(-2)` دو صفحه به عقب و `history.go(1)` یک صفحه به جلو؛ `history.length` تعداد صفحه‌های تاریخچه‌ی این تب است. برای حفظ حریم خصوصی، آدرس صفحه‌های تاریخچه را **نمی‌شود خواند**.
  - **`navigator`** (اطلاعات مرورگر): `navigator.userAgent` (رشته‌ای که مرورگر و سیستم‌عامل را معرفی می‌کند)، `navigator.language` (زبان مرورگر، مثلاً `"fa-IR"` یا `"en-US"`)، `navigator.onLine` (آیا به اینترنت وصل است؟) و امکاناتی مثل `navigator.geolocation` و `navigator.clipboard`. `plugins` و `mimeTypes` نمودار اسلاید ۱۲ هم زیرمجموعه‌ی همین شیء‌اند.
  - **`screen`** (اطلاعات **مانیتور** کاربر): `screen.width`، `screen.height` و `screen.availWidth`. این‌ها اندازه‌ی کل صفحه‌نمایش است، نه اندازه‌ی پنجره‌ی مرورگر.

  ### ۵) تایمرها: `setTimeout` و `setInterval`

  ```js
  const id = setTimeout(() => {
    console.log("runs once, after about 2 seconds");
  }, 2000);
  clearTimeout(id);   // cancel it before it runs

  let count = 0;
  const timer = setInterval(() => {
    count++;
    console.log("tick", count);
    if (count === 3) clearInterval(timer);   // stop after 3 ticks
  }, 1000);
  ```

  - `setTimeout(fn, ms)` تابع را **یک بار**، دست‌کم `ms` میلی‌ثانیه بعد اجرا می‌کند و یک **شناسه** (id؛ در مرورگر یک عدد) برمی‌گرداند. `clearTimeout(id)` آن را قبل از اجرا لغو می‌کند.
  - `setInterval(fn, ms)` تابع را هر `ms` میلی‌ثانیه **تکرار** می‌کند تا با `clearInterval(id)` متوقف شود.
  - callback تایمر فقط **بعد از تمام شدن کد همگامِ فعلی** اجرا می‌شود (event loop در فصل اول)؛ پس تأخیر `0` هم یعنی «بعداً»، نه «فوراً».
  - خودِ تابع را بده، نه نتیجه‌ی صدا زدنش را: `setTimeout(sayHi, 1000)` درست است؛ `setTimeout(sayHi(), 1000)` تابع را **همین الان** اجرا می‌کند و نتیجه‌اش (`undefined`) را به `setTimeout` می‌دهد.

  ### ۶) اندازه و اسکرول: `innerWidth`، `innerHeight`، `scrollX` و `scrollY`

  - `innerWidth` و `innerHeight`: عرض و ارتفاع **viewport** (ناحیه‌ای از پنجره‌ی مرورگر که صفحه در آن دیده می‌شود، شامل نوار اسکرول) بر حسب پیکسل. با تغییر اندازه‌ی پنجره عوض می‌شوند.
  - `outerWidth` و `outerHeight`: اندازه‌ی **کل** پنجره‌ی مرورگر همراه با نوار ابزار و حاشیه‌ها. `screen.width` هم اندازه‌ی مانیتور است.
  - `scrollX` و `scrollY`: صفحه چند پیکسل به‌ترتیب به **راست** و به **پایین** اسکرول شده است (بالای صفحه `scrollY` برابر `0` است).

  ```js
  const backToTop = document.getElementById("backToTop");
  window.addEventListener("scroll", () => {
    backToTop.hidden = window.scrollY < 300;   // show the button only after scrolling down
  });
  ```

  ### ۷) صفحه‌ی واکنش‌گرا (responsive) با `window`

  ```js
  function applyLayout() {
    if (window.innerWidth < 600) {
      document.body.classList.add("mobile");
    } else {
      document.body.classList.remove("mobile");
    }
  }
  applyLayout();                                   // once when the page loads
  window.addEventListener("resize", applyLayout);  // and every time the window size changes
  ```

  رویداد `resize` روی `window` هر بار که اندازه‌ی پنجره تغییر کند رخ می‌دهد. البته برای تغییرات **فقط ظاهری**، ابزار معمول CSS media query است (قاعده‌ای در CSS که فقط در اندازه‌های مشخصی از صفحه اعمال می‌شود، مثل `@media (max-width: 600px) { … }`) و JavaScript برای تغییر **رفتار** به کار می‌رود (مثلاً جمع کردن منو یا نمایش تعداد کمتری آیتم). `window.matchMedia("(max-width: 600px)").matches` همان شرط media query را در JavaScript بررسی می‌کند.

  ### فعالیت کلاسی اسلاید ۳۷

  **۱. `alert` چه می‌کند و چه فرقی با `prompt` و `confirm` دارد؟** هر سه متد `window` هستند و پنجره‌ای مسدودکننده باز می‌کنند. `alert` فقط پیام و دکمه‌ی OK نشان می‌دهد و `undefined` برمی‌گرداند. `confirm` دکمه‌های OK و Cancel دارد و `true` یا `false` برمی‌گرداند. `prompt` یک کادر متن هم دارد و متن تایپ‌شده را به‌صورت رشته، یا با Cancel مقدار `null` را برمی‌گرداند.

  **۲. `location` چه چیزی را نشان می‌دهد؟** آدرس (URL) صفحه‌ی فعلی را، با بخش‌هایش (`href`، `protocol`، `host`، `hostname`، `port`، `pathname`، `search`، `hash`) و متدهایی برای رفتن به آدرس دیگر یا بارگذاری دوباره (`assign`، `replace`، `reload`). مقداردهی `location.href` کاربر را به صفحه‌ی جدید می‌برد.

  **۳. چطور با `window` صفحه را واکنش‌گرا کنیم؟** `window.innerWidth` و `innerHeight` را بخوانیم، به رویداد `resize` روی `window` گوش بدهیم و بر اساس اندازه کلاس‌ها یا استایل‌ها را عوض کنیم یا عنصرهایی را نشان دهیم یا پنهان کنیم (مثل کد بالا). برای رفتارهای وابسته به اسکرول هم `scrollX` و `scrollY` به کار می‌آیند.

  **۴. آیا `window` به‌جز `document` فرزندان دیگری دارد؟** **بله.** طبق نمودار اسلاید ۱۲: `event`، `frames`، `location`، `history`، `navigator` (با `plugins` و `mimeTypes`) و `screen`. علاوه بر این‌ها `localStorage`، `sessionStorage`، `console`، توابع تایمر و هر متغیر `var` یا تابع سراسری هم روی `window` هستند.

  ::: tip
  - هر چیز سراسری در مرورگر property `window` است، پس `window.` را می‌توانی ننویسی: `alert === window.alert`.
  - `confirm` بولی برمی‌گرداند و `prompt` رشته یا `null`؛ خروجی `prompt` را قبل از محاسبه با `Number()` تبدیل کن و `null` را جدا بررسی کن.
  - `location` = آدرس صفحه؛ `history` = عقب و جلو؛ `navigator` = اطلاعات مرورگر؛ `screen` = مانیتور؛ `innerWidth` = viewport.
  - هر `setInterval` را با `clearInterval` و شناسه‌ی خودش متوقف کن.
  :::

  ::: trap
  - `let`، `const` و `class` سراسری property `window` نمی‌شوند: `window.b` برای `let b = 2` برابر `undefined` است.
  - `prompt("Age?") + 1` با ورودی ۲۰ می‌شود `"201"`؛ و اگر کاربر Cancel بزند، `Number(null)` برابر `0` است، نه `NaN`.
  - `alert` مقدار `undefined` برمی‌گرداند، نه `true`.
  - `location` موقعیت جغرافیایی نیست؛ آدرس صفحه است.
  - `innerWidth` اندازه‌ی viewport است، نه مانیتور (`screen.width`) و نه کل پنجره (`outerWidth`).
  - `setTimeout(sayHi(), 1000)` تابع را فوراً اجرا می‌کند؛ و حتی `setTimeout(fn, 0)` بعد از کد همگام اجرا می‌شود.
  - در Node.js شیء `window` وجود ندارد؛ نام مشترک شیء سراسری `globalThis` است.
  :::

  ::: summary
  `window` = پنجره‌ی مرورگر + شیء سراسری. فرزندانش: `document`، `location` (آدرس)، `history` (عقب و جلو)، `navigator` (مرورگر)، `screen` (مانیتور)، `localStorage` و… . پنجره‌های گفت‌وگو: `alert` ← `undefined`، `confirm` ← بولی، `prompt` ← رشته یا `null` (همه مسدودکننده). تایمرها: `setTimeout`/`clearTimeout` و `setInterval`/`clearInterval`. اندازه‌ها: `innerWidth`/`innerHeight` (viewport)، `scrollX`/`scrollY` (اسکرول) و رویداد `resize` برای صفحه‌ی واکنش‌گرا.
  :::
questions:
  - level: easy
    stem: طبق اسلاید ۳۶، شیء `window` چه چیزی را نشان می‌دهد؟
    options:
      - پنجره (یا تب) مرورگر که صفحه در آن باز است؛ همه‌ی متغیرها، توابع و اشیای سراسری JavaScript به آن تعلق دارند.
      - فقط محتوای HTML صفحه؛ دقیقاً همان چیزی که `document` نشان می‌دهد.
      - پنجره‌های سیستم‌عامل (مثلاً همه‌ی پنجره‌های باز روی دسکتاپ) را مدیریت می‌کند.
      - فقط عنصر `<body>` صفحه را نشان می‌دهد.
    answer: 1
    explain: |
      `window` بالاترین شیء مرورگر است: پنجره‌ای که صفحه در آن باز شده و در عین حال شیء سراسری JavaScript. گزینه‌ی ۲ تعریف `document` است که فقط یکی از فرزندان `window` است، گزینه‌ی ۳ اشتباه است چون JavaScript صفحه به پنجره‌های سیستم‌عامل دسترسی ندارد و گزینه‌ی ۴ همان `document.body` است.

  - level: easy
    stem: طبق فعالیت کلاسی اسلاید ۳۷، آیا `window` به‌جز `document` فرزندان (اشیای زیرمجموعه‌ی) دیگری هم دارد؟
    options:
      - خیر؛ `document` تنها فرزند `window` است.
      - فقط `frames` (برای iframeها).
      - بله؛ مثلاً `location`، `history`، `navigator` و `screen` (و همچنین `localStorage`، `console` و توابع تایمر).
      - فقط در Node.js فرزند دیگری دارد.
    answer: 3
    explain: |
      طبق نمودار اسلاید ۱۲، `window` علاوه بر `document` فرزندانی مثل `event`، `frames`، `location`، `history`، `navigator` و `screen` دارد؛ `localStorage`، `sessionStorage`، `console`، تایمرها و همه‌ی متغیرها و توابع سراسری هم روی آن هستند. پس گزینه‌های ۱ و ۲ ناقص و غلط‌اند و گزینه‌ی ۴ هم غلط است، چون در Node.js اصلاً شیء `window` وجود ندارد.

  - level: medium
    stem: خروجی کد زیر در مرورگر کدام است؟
    check: dom-output
    code: |
      var a = 1;
      let b = 2;
      const c = 3;
      function d() {}
      console.log(window.a, window.b, window.c, typeof window.d);
    options:
      - out: "1 2 3 function"
      - out: "1 undefined undefined function"
      - out: "undefined undefined undefined undefined"
      - out: "1 2 undefined function"
    answer: 2
    explain: |
      در سطح بالای یک اسکریپت مرورگر، `var` و اعلان تابع property شیء `window` می‌شوند؛ پس `window.a` برابر ۱ و `typeof window.d` برابر `"function"` است. `let` و `const` هم سراسری‌اند ولی property `window` نمی‌شوند و خواندنشان از `window` مقدار `undefined` می‌دهد. گزینه‌ی ۱ همه را property دانسته، گزینه‌ی ۳ هیچ‌کدام را (این تقریباً رفتار Node.js است) و گزینه‌ی ۴ بین `let` و `const` فرق گذاشته است.

  - level: easy
    stem: خروجی کد زیر در مرورگر کدام است؟
    check: dom-output
    code: |
      console.log(alert === window.alert, window.document === document, globalThis === window);
    options:
      - out: "false true true"
      - out: "true false true"
      - out: "true true false"
      - out: "true true true"
    answer: 4
    explain: |
      `alert` و `document` در واقع propertyهای شیء سراسری `window` هستند، پس با یا بدون پیشوند `window.` به همان چیز اشاره می‌کنیم. `globalThis` نام استاندارد شیء سراسری است که در مرورگر همان `window` است. هر گزینه‌ای که یکی از این سه را `false` بداند، اختیاری بودن پیشوند `window.` یا معنای `globalThis` را اشتباه فهمیده است.

  - level: hard
    stem: 'خروجی کد زیر **در مرورگر** (یک اسکریپت معمولی، بدون `"use strict"`) کدام است؟'
    check: dom-output
    code: |
      var color = "red";
      function show() {
        console.log(this.color);
      }
      show();
      console.log(this === window);
    options:
      - out: ["red", "true"]
      - out: ["undefined", "true"]
      - out: ["undefined", "false"]
      - out: ["red", "false"]
    answer: 1
    explain: |
      `var color` در مرورگر به `window.color` تبدیل می‌شود. `show()` به‌تنهایی و در حالت غیر strict صدا زده شده، پس `this` داخل آن `window` است و `this.color` همان `"red"` است. در سطح بالای اسکریپت هم `this === window` است. گزینه‌ی ۳ دقیقاً خروجی همین کد در Node.js است (آن‌جا `var` property شیء سراسری نمی‌شود و `this` سطح بالا `module.exports` است)؛ گزینه‌های ۲ و ۴ هم هر کدام فقط نیمی از رفتار مرورگر را درست گفته‌اند.

  - level: medium
