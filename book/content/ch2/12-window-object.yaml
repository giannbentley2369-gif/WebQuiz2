    answer: 3
    explain: |
      `applyLayout()` یک بار هنگام بارگذاری اجرا می‌شود (عرض ۱۲۰۰، پس کلاس `mobile` نیست) و بعد با هر رویداد `resize` دوباره اجرا می‌شود: در عرض ۵۰۰ کلاس اضافه و در عرض ۸۰۰ دوباره حذف می‌شود. گزینه‌ی ۱ فراموش کرده listener `resize` تابع را دوباره اجرا می‌کند، گزینه‌ی ۲ جهت شرط `<` را برعکس فهمیده و گزینه‌ی ۴ شاخه‌ی `else` (حذف کلاس) را نادیده گرفته است.
