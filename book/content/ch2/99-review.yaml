  - level: hard
    stem: کدام عبارت **درست** است؟
    options:
      - 'اجرای `el.innerHTML = el.innerHTML` هیچ اثری ندارد و listenerهایی که با `addEventListener` روی فرزندان `el` ثبت شده‌اند حفظ می‌شوند.'
      - 'در listenerی که با یک تابع معمولی (`function`) ثبت شده، `this` همان `event.currentTarget` است؛ یعنی عنصری که listener روی آن ثبت شده، نه لزوماً عنصری که کلیک شده.'
      - '`el.classList.toggle("on")` چیزی برنمی‌گرداند (`undefined`) و فقط کلاس را اضافه یا حذف می‌کند.'
      - '`el.style.color` رنگی را که در فایل CSS (مثلاً با یک selector کلاس) برای عنصر تعیین شده برمی‌گرداند.'
    answer: 2
    explain: |
      در listenerی که با `function` معمولی ثبت شده، مرورگر `this` را برابر عنصری قرار می‌دهد که listener روی آن
      ثبت شده، یعنی `event.currentTarget`؛ در event delegation این عنصر والد است، در حالی که `event.target`
      فرزندی است که واقعاً کلیک شده (گزینه‌ی ۲ درست است). گزینه‌ی ۱ نادرست است: مقداردهی به `innerHTML` همه‌ی
      فرزندان را از نو می‌سازد، حتی اگر رشته همان قبلی باشد، و listenerهای فرزندان قدیمی از بین می‌روند. گزینه‌ی
      ۳ نادرست است: `toggle` مقدار بولی برمی‌گرداند (`true` اگر کلاس اضافه شد و `false` اگر حذف شد). گزینه‌ی ۴
      نادرست است: `el.style` فقط استایل درون‌خطی (attribute `style`) را نشان می‌دهد و برای استایل نهاییِ حاصل از
      CSS باید از `getComputedStyle` استفاده کرد.
