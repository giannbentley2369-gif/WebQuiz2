  - level: hard
    stem: |
      HTML صفحه این است:

      ```html
      <ul id="tasks">
        <li class="done">A</li>
        <li class="done">B</li>
        <li>C</li>
        <li class="done">D</li>
      </ul>
      ```

      می‌خواهیم همه‌ی `<li>`هایی که کلاس `done` دارند حذف شوند و فقط `C` در لیست بماند. با کدام گزینه در جای
      خالی، کد زیر درست کار می‌کند؟

      ```js
      const done = ________;
      for (let i = 0; i < done.length; i++) {
        done[i].remove();
      }
      ```
    check: dom-output
    showHtml: false
    showCode: false
    html: |
      <ul id="tasks">
        <li class="done">A</li>
        <li class="done">B</li>
        <li>C</li>
        <li class="done">D</li>
      </ul>
    code: |
      // Hidden verification: run the loop with each option on a fresh list.
      const list = document.getElementById("tasks");
      const start = list.innerHTML;
      const pick = [
        () => document.querySelectorAll(".done"),
        () => document.getElementsByClassName("done"),
        () => document.querySelector(".done"),
        () => document.getElementsByTagName("li"),
      ];
      pick.forEach((get, k) => {
        list.innerHTML = start;
        const done = get();
        for (let i = 0; i < done.length; i++) {
          done[i].remove();
        }
        if (Array.from(list.children, (li) => li.textContent).join() === "C") console.log(k + 1);
      });
    options:
      - text: '`document.querySelectorAll(".done")`'
        out: "1"
      - text: '`document.getElementsByClassName("done")`'
        out: "2"
      - text: '`document.querySelector(".done")`'
        out: "3"
      - text: '`document.getElementsByTagName("li")`'
        out: "4"
    answer: 1
    explain: |
      `querySelectorAll` یک NodeList **ایستا** می‌دهد که سه عنصر `A`، `B` و `D` را از اول تا آخر حلقه ثابت نگه
      می‌دارد؛ حذف هر کدام روی خود لیست اثری ندارد و هر سه حذف می‌شوند.

      `getElementsByClassName` زنده است: بعد از حذف `A`، عنصر `B` به اندیس ۰ می‌آید و حلقه با `i = 1` از رویش
      رد می‌شود و `D` را حذف می‌کند؛ پس `B` می‌ماند (رد گزینه‌ی ۲). `querySelector` فقط یک عنصر برمی‌گرداند که
      property به نام `length` ندارد (`undefined`)؛ شرط `0 < undefined` نادرست است و هیچ چیزی حذف نمی‌شود (رد
      گزینه‌ی ۳). `getElementsByTagName("li")` هم زنده است و هم آیتم‌های بدون `done` را شامل می‌شود؛ در نتیجه
      `C` به‌اشتباه حذف می‌شود و `B` و `D` می‌مانند (رد گزینه‌ی ۴).

