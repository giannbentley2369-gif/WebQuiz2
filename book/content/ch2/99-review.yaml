      - '`setTimeout(fn, 0)` تابع `fn` را بلافاصله، قبل از اجرای خط بعدیِ همان اسکریپت، اجرا می‌کند.'
      - 'داده‌ی `sessionStorage` با بارگذاری دوباره‌ی (reload) همان تب باقی می‌ماند، ولی با بستن تب پاک می‌شود.'
