      `e.preventDefault()` رفتار پیش‌فرض رویداد `submit`، یعنی ارسال فرم و بارگذاری دوباره‌ی صفحه، را لغو
      می‌کند؛ `stopPropagation` فقط جلوی bubbling را می‌گیرد و صفحه باز هم reload می‌شود (رد گزینه‌ی ۲).
      `localStorage` فقط رشته نگه می‌دارد، پس آرایه باید با `JSON.stringify` به رشته‌ی JSON (مثلاً `'["Read"]'`)
      تبدیل شود تا `JSON.parse` بعداً همان آرایه را بسازد. `todos.toString()` رشته‌ای مثل `"Read"` می‌سازد که
      JSON معتبر نیست و `JSON.parse` روی آن `SyntaxError` می‌دهد (رد گزینه‌ی ۳)؛ `JSON.parse(todos)` هم کار
      برعکس را انجام می‌دهد و همان موقع ذخیره با `SyntaxError` متوقف می‌شود (رد گزینه‌ی ۴).

