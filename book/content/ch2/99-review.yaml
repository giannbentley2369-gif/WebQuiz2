id: ch2-review
review: true
title: "آزمون جامع فصل دوم"
intro: |
  این آزمون ۲۴ تست **ترکیبی** دارد؛ هر تست دو یا چند درس از این فصل را با هم درگیر می‌کند (مثلاً event
  delegation همراه با ساختن عنصر، یا ارسال فرم همراه با localStorage و JSON). پیشنهاد می‌کنیم مثل جلسه‌ی
  آزمون واقعی و بدون نگاه کردن به درسنامه‌ها، هر ۲۴ تست را در حدود **۴۰ دقیقه** حل کنی و بعد پاسخ‌هایت را
  با کلید و پاسخ تشریحی مقایسه کنی. برای هر تستی که اشتباه زدی، درس‌هایی را که در آن تست ترکیب شده‌اند
  دوباره مرور کن.

  یادآوری: در گزینه‌ها سطر «Uncaught …» یعنی یک خطای مهارنشده در Console چاپ شده است.
questions:
  - level: hard
    stem: |
      صفحه‌ی زیر در مرورگر باز می‌شود و بعد از کامل شدن بارگذاری، کاربر یک بار روی دکمه‌ی Save کلیک
      می‌کند. خروجی کامل Console کدام است؟
    check: dom-output
    html: |
      <!DOCTYPE html>
      <html>
      <head>
        <script>
          console.log("head:", document.getElementById("save"));
          document.addEventListener("DOMContentLoaded", () => {
            console.log("ready:", document.getElementById("save").textContent);
          });
          document.getElementById("save").addEventListener("click", () => {
            console.log("saved");
          });
          console.log("head end");
        </script>
      </head>
      <body>
        <button id="save">Save</button>
        <script>
          console.log("body script");
        </script>
      </body>
      </html>
    events:
      - { type: click, target: "#save" }
    options:
      - out: ["head: null", "!! TypeError"]
      - out: ["head: null", "!! TypeError", "ready: Save", "body script"]
      - out: ["head: null", "!! TypeError", "body script", "ready: Save", "saved"]
      - out: ["head: null", "!! TypeError", "body script", "ready: Save"]
    answer: 4
    explain: |
      اسکریپت معمولیِ داخل `<head>` قبل از parse شدن `<body>` اجرا می‌شود، پس `getElementById("save")`
      مقدار `null` می‌دهد و `head: null` چاپ می‌شود. ثبت listener برای `DOMContentLoaded` روی `document`
      مشکلی ندارد، ولی خط بعد `addEventListener` را روی `null` صدا می‌زند و `TypeError` رخ می‌دهد؛ بقیه‌ی
      **همین** اسکریپت (`head end`) اجرا نمی‌شود، اما مرورگر parse صفحه را ادامه می‌دهد و اسکریپت انتهای
      body مستقل اجرا می‌شود (`body script`). بعد از پایان parse رویداد `DOMContentLoaded` رخ می‌دهد و حالا
      دکمه وجود دارد (`ready: Save`). کلیک کاربر چیزی چاپ نمی‌کند، چون listener کلیک هرگز ثبت نشد.

      گزینه‌ی ۱ فکر کرده خطای یک اسکریپت کل صفحه را متوقف می‌کند، گزینه‌ی ۲ ترتیب را برعکس گرفته
      (`DOMContentLoaded` بعد از اجرای همه‌ی اسکریپت‌های معمولی رخ می‌دهد) و گزینه‌ی ۳ فرض کرده listener
      کلیک با وجود خطا ثبت شده است.

  - level: hard
    stem: خروجی کد زیر کدام است؟ (به فاصله‌ها و خط‌های جدیدِ داخل HTML دقت کن.)
    check: dom-output
    html: |
      <ul id="list">
        <li>A</li>
      </ul>
    code: |
      const list = document.getElementById("list");
      const li = document.createElement("li");
      li.textContent = "B";
      list.insertBefore(li, list.lastChild);
      console.log(list.lastChild.nodeName, list.lastElementChild.textContent);
      console.log(list.children.length, list.childNodes.length);
    options:
      - out: ["#text B", "2 4"]
      - out: ["LI A", "2 2"]
      - out: ["LI B", "2 4"]
      - out: ["#text A", "2 4"]
    answer: 1
    explain: |
      فاصله و خط جدیدِ بین تگ‌ها هم گره‌ی متنی (text node) می‌سازد؛ پس `<ul>` در ابتدا سه گره‌ی فرزند دارد:
      متن فاصله، `<li>A</li>` و یک متن فاصله‌ی دیگر. `list.lastChild` همان گره‌ی متنی آخر است و
      `insertBefore(li, list.lastChild)` عنصر `B` را **قبل از آن متن**، یعنی بعد از `A`، می‌گذارد. در نتیجه
      `lastChild` هنوز `#text` است، آخرین **عنصر** `B` است، `children` فقط عنصرها را می‌شمارد (۲) و
      `childNodes` همه‌ی گره‌ها را (۴).

      گزینه‌ی ۲ گره‌های متنی را نادیده گرفته (در آن صورت `B` قبل از `A` می‌رفت)، گزینه‌ی ۳ تصور کرده
      `insertBefore` مثل `appendChild` به انتهای لیست اضافه می‌کند و گزینه‌ی ۴ فکر کرده `B` قبل از `A`
      قرار گرفته است.

  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <p class="x">1</p>
      <p class="x">2</p>
      <p class="x">3</p>
      <p class="x">4</p>
    code: |
      const live = document.getElementsByClassName("x");
      const fixed = document.querySelectorAll(".x");
      for (let i = 0; i < live.length; i++) {
        live[i].classList.remove("x");
      }
      console.log(live.length, fixed.length, live[0].textContent);
    options:
      - out: "4 4 1"
      - out: "2 2 2"
      - out: "2 4 2"
      - out: ["!! TypeError"]
    answer: 3
    explain: |
      `getElementsByClassName` یک HTMLCollection **زنده** می‌دهد و `querySelectorAll` یک NodeList **ایستا**
      (عکسِ لحظه‌ای). وقتی کلاس `x` از یک پاراگراف حذف می‌شود، آن پاراگراف فوراً از `live` بیرون می‌رود و
      بقیه یک خانه جلو می‌آیند: در دور اول (`i = 0`) پاراگراف `1` حذف می‌شود و `live` می‌شود `[2, 3, 4]`؛ در
      دور دوم (`i = 1`) پاراگراف `3` حذف می‌شود و `live` می‌شود `[2, 4]`؛ حالا `i = 2` است و شرط `2 < 2`
      نادرست است. پس `live.length` برابر ۲، `fixed.length` همان ۴ و `live[0]` پاراگراف `2` است.

      گزینه‌ی ۱ هر دو لیست را ایستا فرض کرده، گزینه‌ی ۲ `querySelectorAll` را هم زنده دانسته و گزینه‌ی ۴ فکر
      کرده حلقه کلاس همه را حذف می‌کند (در آن صورت `live[0]` برابر `undefined` می‌شد و خواندن `textContent`
      خطا می‌داد).

  - level: hard
    stem: کد زیر اجرا می‌شود و سپس کاربر روی آیتم `A` در صفحه کلیک می‌کند. خروجی کامل Console کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li>A</li><li>B</li></ul>
    code: |
      const list = document.getElementById("list");
      const items = list.getElementsByTagName("li");
      const first = items[0];
      first.addEventListener("click", () => console.log("A clicked"));
      list.innerHTML += "<li>C</li>";
      console.log(items.length, items[0] === first, first.isConnected);
    events:
      - { type: click, target: "#list li" }
    options:
      - out: ["3 true true", "A clicked"]
      - out: ["3 false false"]
      - out: ["2 false false"]
      - out: ["3 false false", "A clicked"]
    answer: 2
    explain: |
      `list.innerHTML += "<li>C</li>"` یعنی `list.innerHTML = list.innerHTML + "<li>C</li>"`: محتوای لیست به
      رشته تبدیل، پاک و **از نو** ساخته می‌شود. پس سه `<li>` کاملاً تازه داریم و `first` (عنصر قدیمی `A`)
      دیگر در صفحه نیست (`isConnected` برابر `false`). `items` زنده است، پس طولش ۳ می‌شود و `items[0]` عنصر
      **جدید** `A` است، نه `first`. listener فقط روی عنصر قدیمی ثبت شده بود، پس کلیک روی `A` جدید چیزی چاپ
      نمی‌کند.

      گزینه‌ی ۱ تصور کرده `+=` فقط یک آیتم اضافه می‌کند و بقیه دست‌نخورده می‌مانند، گزینه‌ی ۳ مجموعه‌ی
      `getElementsByTagName` را ایستا فرض کرده و گزینه‌ی ۴ فکر کرده listenerها هم همراه HTML کپی می‌شوند.
      برای اضافه کردن آیتم بدون از دست دادن listenerها از `createElement` و `append` استفاده کن.

  - level: hard
    stem: |
      HTML صفحه این است:

      ```html
      <ul id="menu"><li class="item">Home</li><li class="item">Blog</li></ul>
      ```

      کد زیر در انتهای صفحه اجرا می‌شود. **اولین** خطا در کدام خط رخ می‌دهد؟

      ```js lines
      const items = document.querySelectorAll(".item");
      items.forEach((li) => li.classList.add("ready"));
      const ready = document.getElementsByClassName("ready");
      console.log(ready.length);
      ready.forEach((li) => li.remove());
      items.classList.remove("item");
      ```
    check: dom-output
    showHtml: false
    showCode: false
    html: |
      <ul id="menu"><li class="item">Home</li><li class="item">Blog</li></ul>
    code: |
      const items = document.querySelectorAll(".item"); console.log("~1");
      items.forEach((li) => li.classList.add("ready")); console.log("~2");
      const ready = document.getElementsByClassName("ready"); console.log("~3");
      console.log(ready.length); console.log("~4");
      ready.forEach((li) => li.remove()); console.log("~5");
      items.classList.remove("item"); console.log("~6");
    options:
      - text: 'خط ۲'
        out: ["~1", "!! TypeError"]
      - text: 'خط ۵'
        out: ["~1", "~2", "~3", "2", "~4", "!! TypeError"]
      - text: 'خط ۶'
        out: ["~1", "~2", "~3", "2", "~4", "~5", "!! TypeError"]
      - text: 'هیچ خطایی رخ نمی‌دهد.'
        out: ["~1", "~2", "~3", "2", "~4", "~5", "~6"]
    answer: 2
    explain: |
      خط ۱ یک NodeList ایستا می‌دهد که متد `forEach` دارد، پس خط ۲ بدون مشکل به هر دو آیتم کلاس `ready`
      می‌دهد (رد گزینه‌ی ۱). خط ۳ یک HTMLCollection زنده برمی‌گرداند و خط ۴ عدد ۲ را چاپ می‌کند. اما
      HTMLCollection متد `forEach` **ندارد**؛ `ready.forEach` برابر `undefined` است و صدا زدن آن در خط ۵ خطای
      `TypeError: ready.forEach is not a function` می‌دهد و اجرا همان‌جا متوقف می‌شود. خط ۶ هم خطا دارد
      (NodeList property به نام `classList` ندارد)، ولی اجرا هرگز به آن نمی‌رسد (رد گزینه‌ی ۳). گزینه‌ی ۴ هم
      HTMLCollection را مثل آرایه فرض کرده است. راه درست: `Array.from(ready).forEach(...)` یا استفاده از
      `querySelectorAll`.

  - level: hard
    stem: کد زیر **در مرورگر** (اسکریپت معمولی، بدون `"use strict"`) اجرا می‌شود و کاربر یک بار روی دکمه کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <button id="btn">Go</button>
    code: |
      var label = "global";
      const btn = document.getElementById("btn");
      btn.label = "button";
      btn.addEventListener("click", function () {
        console.log(this.label);
      });
      btn.addEventListener("click", () => {
        console.log(this.label);
      });
      btn.onclick = function () {
        console.log(this === btn);
      };
    events:
      - { type: click, target: "#btn" }
    options:
      - out: ["button", "button", "true"]
      - out: ["button", "undefined", "true"]
      - out: ["true", "button", "global"]
      - out: ["button", "global", "true"]
    answer: 4
    explain: |
      handlerها به ترتیب ثبت اجرا می‌شوند. در تابع معمولی (`function`)، `this` همان عنصری است که listener روی
      آن ثبت شده (`btn`)، پس `this.label` برابر `"button"` است. تابع arrow، `this` مخصوص خودش را ندارد و آن را
      از محیط بیرونی، یعنی سطح بالای اسکریپت، می‌گیرد که در مرورگر `window` است؛ و چون `label` با `var` در
      سطح بالا تعریف شده، `window.label` برابر `"global"` است. handler سوم (`onclick`) بعد از آن دو ثبت شده و
      `this` آن هم `btn` است، پس `true` چاپ می‌کند.

      گزینه‌ی ۱ فکر کرده arrow هم `this` را از عنصر می‌گیرد، گزینه‌ی ۲ فراموش کرده `var` سراسری property شیء
      `window` می‌شود و گزینه‌ی ۳ تصور کرده `onclick` همیشه قبل از listenerهای `addEventListener` اجرا می‌شود.

  - level: hard
    stem: کاربر روی دکمه‌ی Go کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <div id="outer">
        <div id="inner">
          <button id="btn">Go</button>
        </div>
      </div>
    code: |
      const outer = document.getElementById("outer");
      const inner = document.getElementById("inner");
      const btn = document.getElementById("btn");
      document.addEventListener("click", () => console.log("document"));
      outer.addEventListener("click", () => console.log("outer capture"), true);
      outer.addEventListener("click", () => console.log("outer bubble"));
      inner.addEventListener("click", (e) => {
        console.log("inner");
        e.stopPropagation();
      });
      btn.addEventListener("click", () => console.log("btn"));
    events:
      - { type: click, target: "#btn" }
    options:
      - out: ["outer capture", "btn", "inner"]
      - out: ["btn", "inner"]
      - out: ["document", "outer capture", "btn", "inner"]
      - out: ["outer capture", "btn", "inner", "document"]
    answer: 1
    explain: |
      رویداد سه مرحله دارد: capturing (از `document` به سمت پایین)، رسیدن به target و bubbling (به سمت بالا).
      listenerی که روی `outer` با آرگومان سوم `true` ثبت شده در مرحله‌ی capturing اجرا می‌شود، پس اول
      `outer capture` چاپ می‌شود؛ بعد خود دکمه (`btn`) و در مسیر بالا رفتن `inner`. چون `inner` متد
      `stopPropagation()` را صدا می‌زند، رویداد دیگر به listener مرحله‌ی bubbling روی `outer` و به `document`
      نمی‌رسد.

      گزینه‌ی ۲ مرحله‌ی capturing را نادیده گرفته، گزینه‌ی ۳ فکر کرده listener روی `document` چون بالاترین
      است اول اجرا می‌شود (در حالی که بدون `true` و در مرحله‌ی bubbling ثبت شده) و گزینه‌ی ۴ تصور کرده
      `stopPropagation` جلوی رسیدن رویداد به `document` را نمی‌گیرد.

  - level: hard
    stem: کاربر ابتدا روی دکمه‌ی Add و سپس روی آیتمی که تازه به لیست اضافه شده کلیک می‌کند. خروجی کامل Console کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li>A</li></ul>
      <button id="add">Add</button>
    code: |
      const list = document.getElementById("list");
      list.addEventListener("click", function (e) {
        console.log(e.target.textContent, this.tagName);
      });
      document.getElementById("add").addEventListener("click", () => {
        const li = document.createElement("li");
        li.textContent = "B" + list.children.length;
        list.appendChild(li);
      });
    events:
      - { type: click, target: "#add" }
      - { type: click, target: "#list li:last-child" }
    options:
      - out: ["B2 UL"]
      - out: ["B1 LI"]
      - out: ["B1 UL"]
      - out: ""
    answer: 3
    explain: |
      با کلیک روی Add یک `<li>` تازه ساخته می‌شود. در لحظه‌ی ساختن متن، لیست هنوز فقط یک فرزند دارد، پس متن
      `B1` است و **بعد از آن** `appendChild` انجام می‌شود. کلیک روی آیتم جدید bubble می‌کند و به listener روی
      `<ul>` می‌رسد (event delegation؛ آیتم‌هایی که بعداً ساخته می‌شوند به listener جداگانه نیاز ندارند). در
      این listener که تابع معمولی است، `e.target` همان `<li>` کلیک‌شده است ولی `this` برابر
      `e.currentTarget`، یعنی `<ul>`، است. دکمه‌ی Add هم داخل `<ul>` نیست، پس کلیک اول listener لیست را اجرا
      نمی‌کند.

      گزینه‌ی ۱ طول لیست را بعد از افزودن حساب کرده، گزینه‌ی ۲ `this` را با `e.target` یکی گرفته و گزینه‌ی ۴
      فکر کرده عنصرهایی که بعداً ساخته می‌شوند به listener والد نمی‌رسند.

  - level: medium
    stem: |
      HTML صفحه این است:

      ```html
      <ul id="list">
        <li>Milk <button class="del"><i>x</i></button></li>
        <li>Bread <button class="del"><i>x</i></button></li>
      </ul>
      ```

      می‌خواهیم با کلیک روی دکمه‌ی حذف هر آیتم (چه روی خودِ دکمه و چه روی `<i>` داخل آن) همان آیتم حذف
      شود و کلیک روی متن آیتم (مثلاً روی کلمه‌ی Milk) هیچ کاری نکند. در جای خالی چه باید نوشت؟

      ```js
      const list = document.getElementById("list");
      list.addEventListener("click", (e) => {
        const btn = ________;
        if (!btn) return;
        btn.closest("li").remove();
      });
      ```
    check: dom-output
    showHtml: false
    showCode: false
    html: |
      <ul id="list">
        <li>Milk <button class="del"><i>x</i></button></li>
        <li>Bread <button class="del"><i>x</i></button></li>
      </ul>
    code: |
      // Hidden verification: try each option on a fresh copy of the list.
      const template = document.getElementById("list");
      const handlers = [
        (e) => { const btn = this.querySelector(".del"); if (!btn) return; btn.closest("li").remove(); },
        (e) => { const btn = e.target.matches(".del"); if (!btn) return; btn.closest("li").remove(); },
        (e) => { const btn = e.currentTarget.closest(".del"); if (!btn) return; btn.closest("li").remove(); },
        (e) => { const btn = e.target.closest(".del"); if (!btn) return; btn.closest("li").remove(); },
      ];
      handlers.forEach((handler, i) => {
        const list = template.cloneNode(true);
        document.body.append(list);
        let crashed = false;
        list.addEventListener("click", (e) => {
          try { handler(e); } catch (err) { crashed = true; }
        });
        list.querySelector("li").click();
        if (list.children.length !== 2) crashed = true;
        list.querySelector("li:nth-child(2) i").click();
        list.querySelector("li .del").click();
        if (!crashed && list.children.length === 0) console.log(i + 1);
        list.remove();
      });
    options:
      - text: '`this.querySelector(".del")`'
        out: "1"
      - text: '`e.target.matches(".del")`'
        out: "2"
      - text: '`e.currentTarget.closest(".del")`'
        out: "3"
      - text: '`e.target.closest(".del")`'
        out: "4"
    answer: 4
    explain: |
      وقتی کاربر روی `<i>` کلیک می‌کند، `e.target` همان `<i>` است. `closest(".del")` از **خودِ عنصر** شروع
      می‌کند و به سمت اجداد بالا می‌رود؛ پس چه کلیک روی دکمه باشد و چه روی `<i>` داخل آن، دکمه را پیدا می‌کند و
      برای کلیک روی متن آیتم (`<li>`) مقدار `null` می‌دهد که با `return` نادیده گرفته می‌شود.

      گزینه‌ی ۱ از `this` داخل یک تابع arrow استفاده کرده که برابر `window` است و `window.querySelector` وجود
