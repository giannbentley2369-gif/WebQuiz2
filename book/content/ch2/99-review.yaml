      `setTimeout(fn, 0)` تابع را فقط **زمان‌بندی** می‌کند؛ `fn` وقتی اجرا می‌شود که کد همگامِ در حال اجرا تمام
      شده باشد، پس همیشه بعد از خط‌های بعدیِ همان اسکریپت اجرا می‌شود و گزینه‌ی ۳ نادرست است. گزینه‌ی ۱ درست
      است: اسکریپت معمولی در `<head>` قبل از parse شدن `<body>` اجرا می‌شود و دکمه هنوز وجود ندارد. گزینه‌ی ۲
      درست است: `var` سراسری property شیء `window` می‌شود ولی `let` و `const` نه. گزینه‌ی ۴ هم درست است:
