      می‌شود (رد گزینه‌های ۲ و ۴). نوشتن در `document.title` خودِ عنصر `<title>` را به‌روز می‌کند؛ بنابراین
      `textContent` آن هم `Cart (2)` می‌شود (رد گزینه‌ی ۳). سایت‌ها از همین ترفند برای نشان دادن تعداد پیام یا
