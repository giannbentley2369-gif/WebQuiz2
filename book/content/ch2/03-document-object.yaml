  - level: easy
    stem: کدام عبارت درباره‌ی شیء `document` نادرست است؟
    options:
      - 'نقطه‌ی ورود (entry point) برای دسترسی به درخت DOM است.'
      - 'متدهایی مثل `getElementById` و `querySelector` برای پیدا کردن عنصرها دارد.'
      - 'با آن می‌توان گره‌ها را ساخت، حذف یا به‌روزرسانی کرد.'
      - 'بالاترین شیء مرورگر است و `window` یکی از propertyهای آن است.'
    answer: 4
    explain: |
      رابطه برعکس است: طبق اسلاید ۱۲، `window` بالاترین شیء است و `document` یکی از فرزندان (propertyهای)
      آن؛ یعنی `window.document` درست است، نه `document.window`. سه گزینه‌ی دیگر عیناً بندهای اسلاید ۱۳
      هستند: نقطه‌ی ورود به DOM، متدهای پیدا کردن عنصر، و امکان ساختن، حذف و به‌روزرسانی گره‌ها.
  - level: hard
    stem: خروجی Console برای صفحه‌ی زیر کدام است؟
    check: dom-output
    html: |
      <h1 id="a">A</h1>
      <script>
        const a = document.getElementById("a");
        const b = document.getElementById("b");
        console.log(a !== null, b !== null);
      </script>
      <h2 id="b">B</h2>
    code: |
