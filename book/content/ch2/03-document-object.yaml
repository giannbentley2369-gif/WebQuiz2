    explain: |
      اسکریپت وسط صفحه وقتی اجرا می‌شود که `<h1>` ساخته شده ولی مرورگر هنوز به `<h2>` نرسیده؛ پس `a` پیدا
      می‌شود و `b` نه (`true false`؛ رد گزینه‌های ۲ و ۳). اسکریپت دوم در انتهای `<body>` است و آن موقع `<h2>`
      هم ساخته شده، پس متنش `B` چاپ می‌شود و خطایی رخ نمی‌دهد (رد گزینه‌ی ۴). هر اسکریپت فقط عنصرهای بالای
      خودش را می‌بیند.
  - level: medium
    stem: کدام عبارت درباره‌ی رویدادهای `DOMContentLoaded` و `load` درست است؟
    options:
      - '`load` زودتر از `DOMContentLoaded` رخ می‌دهد، چون فقط منتظر HTML است.'
      - '`DOMContentLoaded` وقتی رخ می‌دهد که HTML کامل parse شده و درخت DOM آماده است؛ `load` علاوه بر آن منتظر بارگیری منابعی مثل تصاویر و stylesheetها هم می‌ماند.'
      - 'هر دو دقیقاً هم‌زمان رخ می‌دهند و فقط نامشان فرق دارد.'
      - '`DOMContentLoaded` قبل از اجرای هر اسکریپتی در صفحه رخ می‌دهد.'
    answer: 2
    explain: |
      `DOMContentLoaded` روی `document` به محض کامل شدن درخت DOM رخ می‌دهد و منتظر تصاویر نمی‌ماند؛ `load`
      روی `window` تا بارگیری همه‌ی منابع صبر می‌کند، پس همیشه دیرتر است (رد گزینه‌های ۱ و ۳). اسکریپت‌های
      معمولی صفحه هنگام parse اجرا می‌شوند، یعنی **قبل** از `DOMContentLoaded`، نه بعد از آن (رد گزینه‌ی ۴).
  - level: hard
    stem: |
      کاربر بعد از بارگذاری صفحه‌ی زیر روی دکمه‌ی Change Text کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <!DOCTYPE html>
      <html>
      <head>
        <script>
          const heading = document.getElementById("title");
          document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("btn").addEventListener("click", () => {
              heading.textContent = "Changed";
              console.log("changed");
            });
          });
        </script>
      </head>
      <body>
        <h1 id="title">Hello World</h1>
        <button id="btn">Change Text</button>
      </body>
      </html>
    events:
      - { type: click, target: "#btn" }
    options:
      - out: "changed"
      - out: ""
      - out: ["null", "changed"]
      - out: "!! TypeError"
    answer: 4
    explain: |
      دکمه داخل `DOMContentLoaded` جست‌وجو شده و پیدا می‌شود، پس listener ثبت می‌شود و کلیک بی‌اثر نیست (رد
      گزینه‌ی ۲). اما `heading` **بیرون** از `DOMContentLoaded` و زمانی جست‌وجو شده که `<h1>` هنوز ساخته نشده
      بود؛ پس مقدارش برای همیشه `null` مانده است. با کلیک، `heading.textContent = ...` روی `null` اجرا می‌شود
      و `TypeError` می‌دهد، پس `changed` چاپ نمی‌شود (رد گزینه‌های ۱ و ۳).
  - level: medium
    stem: |
      کدام تگ، یک فایل JavaScript **خارجی** را در `<head>` طوری بارگذاری می‌کند که اجرای آن تا پایان parse
      شدن کل HTML عقب بیفتد؟
    options:
      - '`<script defer>console.log("hi")</script>`'
      - '`<script src="app.js"></script>`'
      - '`<script src="app.js" delay></script>`'
      - '`<script src="app.js" defer></script>`'
    answer: 4
    explain: |
      ویژگی `defer` روی اسکریپت خارجی (دارای `src`) باعث می‌شود فایل هم‌زمان با parse دانلود شود ولی بعد از
      پایان parse (و قبل از `DOMContentLoaded`) اجرا شود. روی اسکریپت درون‌خطی، `defer` نادیده گرفته می‌شود
      (رد گزینه‌ی ۱). `<script src>` معمولی parse را متوقف می‌کند و همان لحظه اجرا می‌شود (رد گزینه‌ی ۲)، و
      ویژگی‌ای به نام `delay` در HTML وجود ندارد (رد گزینه‌ی ۳).
