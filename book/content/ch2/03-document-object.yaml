      `className` مقدار attribute `class` را بدون نقطه (رد گزینه‌ی ۱). property کلاس در DOM `className` نام
      دارد و وجود دارد، پس `undefined` نمی‌دهد (رد گزینه‌ی ۲). `textContent` فقط متن را می‌دهد، نه کد HTML عنصر
