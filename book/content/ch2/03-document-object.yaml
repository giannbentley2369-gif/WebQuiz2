    manual: "Asks how the browser DevTools console displays a DOM node; jsdom and Node print nodes differently. The logged value is the HTMLHeadingElement itself (checked separately in jsdom)."
    html: |
      <!DOCTYPE html>
      <html>
        <body>
          <h1 id="title">Hello World</h1>

          <script>
            const heading = document.getElementById("title");
            console.log(heading)
            </script>
        </body>
      </html>
    options:
      - 'خودِ عنصر `<h1 id="title">`، به‌صورت یک گره‌ی قابل باز شدن'
      - 'رشته‌ی `"Hello World"`'
      - '`null`، چون `heading` هنوز ساخته نشده است'
      - 'یک خطای نحوی (SyntaxError)، چون بعد از `console.log(heading)` سمی‌کالن نیامده است'
    answer: 1
    explain: |
      همان‌طور که اسلاید ۱۵ نشان می‌دهد، **خودِ عنصر** چاپ می‌شود (`▶ <h1 id="title">` همراه با لینک
      `doc.html:8:15`)، چون خودِ عنصر را به `console.log` داده‌ایم؛ برای دیدن متن باید `heading.textContent` را
      چاپ کرد (رد گزینه‌ی ۲). اسکریپت بعد از `<h1>` قرار دارد، پس عنصر از قبل در درخت هست و `null` نمی‌گیریم
      (رد گزینه‌ی ۳). نبودن `;` هم خطا نیست، چون JavaScript سمی‌کالن را خودکار درج می‌کند (رد گزینه‌ی ۴).
  - level: hard
    stem: خروجی Console برای صفحه‌ی زیر کدام است؟
    check: dom-output
    html: |
      <!DOCTYPE html>
      <html>
      <head>
        <script>
          const heading = document.getElementById("title");
          console.log(heading);
          heading.textContent = "Changed";
          console.log("done");
        </script>
      </head>
      <body>
        <h1 id="title">Hello World</h1>
      </body>
      </html>
    options:
      - out: ["[object HTMLHeadingElement]", "done"]
      - out: ["undefined", "done"]
      - out: ["null", "!! TypeError"]
      - out: ["!! ReferenceError"]
    answer: 3
    explain: |
      اسکریپت داخل `<head>` است و وقتی اجرا می‌شود، مرورگر هنوز به `<h1>` نرسیده؛ پس `getElementById` چیزی
      پیدا نمی‌کند و `null` برمی‌گرداند (نه `undefined`؛ رد گزینه‌ی ۲). خط بعد می‌خواهد روی `null` property
      بنویسد و `TypeError` می‌دهد، پس `done` هرگز چاپ نمی‌شود. گزینه‌ی ۱ فرض کرده عنصر پیدا می‌شود، و
      `ReferenceError` هم نیست چون متغیر `heading` تعریف شده است، فقط مقدارش `null` است (رد گزینه‌ی ۴).
  - level: hard
    stem: ترتیب خروجی‌های Console برای صفحه‌ی زیر کدام است؟
    check: dom-output
    html: |
      <!DOCTYPE html>
      <html>
      <head>
        <script>
          console.log("head", document.getElementById("title"));
          document.addEventListener("DOMContentLoaded", () => {
            console.log("DOMContentLoaded", document.getElementById("title").textContent);
          });
          window.addEventListener("load", () => console.log("load"));
        </script>
      </head>
      <body>
        <h1 id="title">Hello World</h1>
        <script>
          console.log("end of body", document.getElementById("title").tagName);
        </script>
      </body>
      </html>
    options:
      - out: ["head null", "DOMContentLoaded Hello World", "end of body H1", "load"]
      - out: ["head null", "end of body H1", "DOMContentLoaded Hello World", "load"]
      - out: ["head H1", "end of body H1", "DOMContentLoaded Hello World", "load"]
      - out: ["head null", "end of body H1", "load", "DOMContentLoaded Hello World"]
    answer: 2
    explain: |
      اسکریپت `<head>` قبل از ساخته شدن `<h1>` اجرا می‌شود، پس `null` می‌بیند (رد گزینه‌ی ۳). اسکریپت انتهای
      `<body>` هنگام parse اجرا می‌شود، یعنی قبل از اینکه parse کل سند تمام شود؛ پس پیش از `DOMContentLoaded`
      می‌آید (رد گزینه‌ی ۱). `DOMContentLoaded` به محض آماده شدن درخت DOM رخ می‌دهد، ولی `load` منتظر همه‌ی
      منابع می‌ماند و همیشه بعد از آن است (رد گزینه‌ی ۴).
  - level: medium
    stem: |
      یک اسکریپت درون‌خطی (بدون `src`) داخل `<head>` قرار دارد و با `getElementById` دنبال عنصری در `<body>`
      می‌گردد، ولی `null` می‌گیرد. کدام تغییر به‌تنهایی مشکل را حل می‌کند؟
    options:
      - 'اضافه کردن ویژگی `defer` به همان تگ `<script>` درون‌خطی'
      - 'تبدیل `const` به `var` در تعریف متغیر'
      - 'قرار دادن کد داخل `document.addEventListener("DOMContentLoaded", () => { ... })`'
      - 'نوشتن `getElementById("#title")` به‌جای `getElementById("title")`'
    answer: 3
    explain: |
      مشکل، زمان اجراست: کد قبل از ساخته شدن `<body>` اجرا می‌شود. `DOMContentLoaded` اجرای کد را تا آماده
      شدن کامل درخت DOM عقب می‌اندازد، پس عنصر پیدا می‌شود. `defer` فقط روی اسکریپت‌های خارجی (با `src`)
      اثر دارد و روی اسکریپت درون‌خطی نادیده گرفته می‌شود (رد گزینه‌ی ۱). نوع تعریف متغیر ربطی به وجود
      عنصر ندارد (رد گزینه‌ی ۲)، و `getElementById` نام id را **بدون** `#` می‌گیرد؛ با `#` حتماً `null`
      برمی‌گرداند (رد گزینه‌ی ۴).
  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
