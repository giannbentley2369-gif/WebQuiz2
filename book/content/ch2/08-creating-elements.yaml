    stem: صفحه‌ی زیر همان کد اسلاید ۲۴ است. کاربر **سه بار** روی دکمه کلیک می‌کند. خروجی کدام است؟
    check: dom-output
    html: |
      <h1 id="title">Hello World</h1>
      <button>CLICK ME!</button>
    code: |
      const btn = document.querySelector('button');
      btn.addEventListener('click', () => {
          const div = document.createElement("div");
          div.innerText = "Hello DOM!";
          div.setAttribute("class", "box");
          document.body.appendChild(div);
      });
    events:
      - { type: click, target: "button", times: 3 }
    after: |
      console.log(document.querySelectorAll(".box").length, document.body.lastElementChild.tagName);
    eventsNote: 'بعد از سه کلیک، این دستور در کنسول اجرا می‌شود: `console.log(document.querySelectorAll(".box").length, document.body.lastElementChild.tagName);`'
    options:
      - out: "1 DIV"
      - out: "3 DIV"
      - out: "3 SCRIPT"
      - out: "0 SCRIPT"
    answer: 2
    explain: |
      `createElement` داخل listener است، پس هر کلیک یک div **جدید** با کلاس `box` می‌سازد؛ بعد از سه کلیک سه `.box` داریم. `appendChild` هر div را آخرین فرزند body می‌کند، یعنی بعد از تگ `<script>`؛ پس آخرین عنصرِ body یک `DIV` است. گزینه‌ی ۱ فکر کرده فقط یک div ساخته می‌شود، گزینه‌ی ۳ تصور کرده div قبل از script قرار می‌گیرد و گزینه‌ی ۴ اثر کلیک‌ها را نادیده گرفته است.

  - level: hard
    stem: کاربر **سه بار** روی دکمه کلیک می‌کند. خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <button>Add</button>
    code: |
      const btn = document.querySelector("button");
      const div = document.createElement("div");
      div.textContent = "Hello DOM!";
      btn.addEventListener("click", () => {
        document.body.appendChild(div);
        console.log(document.querySelectorAll("div").length);
      });
    events:
      - { type: click, target: "button", times: 3 }
    options:
      - out: ["1", "2", "3"]
      - out: ["0", "1", "2"]
      - out: ["1", "1", "1"]
      - out: ["1", "!! TypeError"]
    answer: 3
    explain: |
      این‌بار `createElement` **بیرون** از listener و فقط یک بار اجرا شده است؛ پس در کل یک div وجود دارد. کلیک اول آن را به body اضافه می‌کند و کلیک‌های بعدی همان div را دوباره append می‌کنند که فقط آن را به انتهای body **جابه‌جا** می‌کند؛ تعداد divها همیشه ۱ می‌ماند. گزینه‌ی ۱ اشتباه رایج است (فکر کردن به کپی شدن)، گزینه‌ی ۲ ترتیب اجرا را غلط فهمیده و گزینه‌ی ۴ تصور کرده append دوباره‌ی یک گره خطاست.

  - level: hard
    stem: 'کاربر این کارها را به ترتیب انجام می‌دهد: در کادر متن `Read` را تایپ می‌کند و Add را می‌زند؛ دوباره Add را می‌زند (کادر خالی است)؛ `Write` را تایپ می‌کند و Add را می‌زند. خروجی کدام است؟'
    check: dom-output
    html: |
      <input id="task">
      <button id="add">Add</button>
      <ul id="list"></ul>
    code: |
      const input = document.getElementById("task");
      const list = document.getElementById("list");
      document.getElementById("add").addEventListener("click", () => {
        if (input.value.trim() === "") return;
        const li = document.createElement("li");
        li.textContent = input.value;
        list.prepend(li);
        input.value = "";
      });
    events:
      - { type: input, target: "#task", value: "Read" }
      - { type: click, target: "#add" }
      - { type: click, target: "#add" }
      - { type: input, target: "#task", value: "Write" }
      - { type: click, target: "#add" }
    after: |
      console.log(list.children.length, list.firstElementChild.textContent);
    eventsNote: 'در پایان این دستور اجرا می‌شود: `console.log(list.children.length, list.firstElementChild.textContent);`'
    options:
      - out: "3 Write"
      - out: "3 Read"
      - out: "2 Read"
      - out: "2 Write"
    answer: 4
    explain: |
      بعد از اولین Add، `Read` اضافه و کادر خالی می‌شود. کلیک دوم به شرط `trim() === ""` می‌خورد و `return` می‌کند، پس آیتم خالی ساخته نمی‌شود. کلیک سوم `Write` را با `prepend` به **ابتدای** لیست می‌برد؛ پس ۲ آیتم داریم و اولی `Write` است. گزینه‌های ۱ و ۲ کلیک با کادر خالی را هم شمرده‌اند و گزینه‌های ۲ و ۳ `prepend` را با افزودن به انتها اشتباه گرفته‌اند.

  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <ul id="menu"></ul>
    code: |
      const data = ["HTML", "CSS", "JS"];
      const ul = document.getElementById("menu");
      data.forEach((item, i) => {
        const li = document.createElement("li");
        li.textContent = i + 1 + ". " + item;
        ul.appendChild(li);
      });
      console.log(ul.children.length, ul.lastElementChild.textContent);
    options:
      - out: "3 21. JS"
      - out: "3 3. JS"
      - out: "1 3. JS"
      - out: "3 2. JS"
    answer: 2
    explain: |
      `forEach` برای هر عضو یک `<li>` تازه می‌سازد و به انتهای لیست اضافه می‌کند؛ پس ۳ فرزند داریم. در آخرین دور `i` برابر ۲ است و عبارت از چپ به راست حساب می‌شود: `2 + 1` برابر عدد `3` و بعد `"3. JS"`. گزینه‌ی ۱ فکر کرده `+` از همان ابتدا رشته می‌چسباند، گزینه‌ی ۳ تصور کرده هر `appendChild` قبلی‌ها را پاک می‌کند و گزینه‌ی ۴ اندیسِ صفرمبنا را بدون `+ 1` در نظر گرفته است.

  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <ul></ul>
    code: |
      const fruits = ["Apple", "Banana"];
      const ul = document.querySelector("ul");
      ul.innerHTML = fruits.map((f) => "<li>" + f + "</li>");
      console.log(ul.children.length, ul.textContent);
    options:
      - out: "2 Apple,Banana"
      - out: "2 AppleBanana"
      - out: "1 Apple,Banana"
      - out: "0 <li>Apple</li>,<li>Banana</li>"
    answer: 1
    explain: |
      `map` یک **آرایه** برمی‌گرداند و `innerHTML` آن را به رشته تبدیل می‌کند؛ تبدیل آرایه به رشته عضوها را با **کاما** به هم می‌چسباند: `"<li>Apple</li>,<li>Banana</li>"`. مرورگر این را تفسیر می‌کند: دو `<li>` واقعی و یک گره‌ی متنیِ `","` بینشان؛ پس ۲ فرزند عنصری داریم و متن کل `Apple,Banana` است. گزینه‌ی ۲ کاما را فراموش کرده (این نتیجه با `join("")` به دست می‌آید)، گزینه‌ی ۳ کل رشته را یک عنصر دانسته و گزینه‌ی ۴ فکر کرده `innerHTML` تگ‌ها را تفسیر نمی‌کند.
