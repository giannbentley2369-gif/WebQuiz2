  - level: easy
    stem: بلافاصله بعد از اجرای `const li = document.createElement("li");` کدام گزینه درست است؟
    options:
      - یک `<li>` به انتهای `<body>` اضافه می‌شود و روی صفحه دیده می‌شود.
      - اولین `<li>` موجود در صفحه پیدا و در `li` ذخیره می‌شود.
      - یک عنصر `<li>` تازه در حافظه ساخته می‌شود که تا به درخت DOM اضافه نشود روی صفحه نمی‌آید.
      - یک `<li>` خالی به‌عنوان آخرین فرزندِ اولین `<ul>` صفحه قرار می‌گیرد.
    answer: 3
    explain: |
      `createElement` فقط یک عنصر **جدید** در حافظه می‌سازد؛ این عنصر پدر ندارد و تا وقتی با متدی مثل `appendChild` یا `append` به درخت اضافه نشود دیده نمی‌شود. گزینه‌های ۱ و ۴ فرض کرده‌اند افزودن خودکار انجام می‌شود که درست نیست، و گزینه‌ی ۲ کارِ `querySelector("li")` را توصیف می‌کند (پیدا کردن، نه ساختن).

  - level: easy
    stem: خروجی کد زیر در مرورگر کدام است؟
    check: dom-output
    html: |
      <p>Old paragraph</p>
    code: |
      const p = document.createElement("p");
      p.textContent = "New paragraph";
      console.log(p.isConnected, document.querySelectorAll("p").length);
    options:
      - out: "true 2"
      - out: "false 1"
      - out: "false 2"
      - out: "true 1"
    answer: 2
    explain: |
      پاراگراف جدید ساخته و متن‌دار شده ولی به صفحه اضافه نشده است؛ پس `isConnected` برابر `false` است و `querySelectorAll("p")` فقط همان یک `<p>` قدیمی صفحه را پیدا می‌کند. گزینه‌های ۱ و ۳ فرض کرده‌اند `createElement` یا مقداردهی `textContent` عنصر را خودکار وارد صفحه می‌کند؛ گزینه‌ی ۴ هم با شمارش درست، `isConnected` را اشتباه گفته است.

  - level: medium
    stem: کدام دستور هنگام اجرا در مرورگر **خطا** می‌دهد؟
    options:
      - '`document.createElement("section")`'
      - '`document.createElement("<div>")`'
      - '`document.body.append("Hi", "!")`'
      - '`document.body.insertBefore(document.createElement("p"), null)`'
    answer: 2
    explain: |
      ورودی `createElement` فقط نام تگ است؛ علامت‌های `<` و `>` در نام تگ مجاز نیستند و مرورگر خطای `InvalidCharacterError` می‌دهد. گزینه‌ی ۱ یک `<section>` می‌سازد، گزینه‌ی ۳ دو گره‌ی متنی به انتهای body اضافه می‌کند (`append` رشته قبول می‌کند) و در گزینه‌ی ۴ مرجعِ `null` یعنی افزودن به انتها، که کاملاً مجاز است.

  - level: easy
