  - level: medium
    stem: 'می‌خواهیم هر کلیک روی دکمه، حالت تاریک صفحه را **روشن یا خاموش** کند (اگر کلاس `dark` هست برداشته شود و اگر نیست اضافه شود). در جای خالی `document.body.classList.______("dark");` کدام گزینه قرار می‌گیرد؟'
    options:
      - '`add`'
      - '`contains`'
      - '`toggle`'
      - '`replace`'
    answer: 3
    explain: |
      `toggle` دقیقاً همین کار را می‌کند: اگر کلاس نباشد اضافه و اگر باشد حذف می‌کند، و وضعیت جدید را هم برمی‌گرداند. `add` فقط اضافه می‌کند (کلیک دوم حالت تاریک را خاموش نمی‌کند)، `contains` فقط بررسی می‌کند و چیزی را تغییر نمی‌دهد و `replace` دو آرگومان (کلاس قدیم و جدید) می‌گیرد و یک کلاس را با دیگری عوض می‌کند.

  - level: hard
    stem: کدام جمله **نادرست** است؟
    options:
      - '`el.classList.contains("x")` اگر کلاس `x` وجود نداشته باشد، آن را اضافه می‌کند.'
      - '`el.className = "x"` همه‌ی کلاس‌های قبلی را با `x` جایگزین می‌کند.'
      - '`el.classList.add("x")` کلاس‌های قبلی را نگه می‌دارد.'
      - '`el.classList.toggle("x")` اگر `x` وجود داشته باشد آن را حذف می‌کند و `false` برمی‌گرداند.'
    answer: 1
    explain: |
      `contains` فقط **بررسی** می‌کند و `true` یا `false` برمی‌گرداند؛ هیچ تغییری در کلاس‌ها نمی‌دهد. پس گزینه‌ی ۱ نادرست و پاسخ است. گزینه‌ی ۲ درست است، چون `className` کل رشته‌ی کلاس را جایگزین می‌کند؛ گزینه‌ی ۳ هم درست است و گزینه‌ی ۴ همان رفتار واقعی `toggle` است (وضعیت جدید، یعنی «نیست»، را برمی‌گرداند).

  - level: easy
    stem: طبق اسلاید ۳۱ کلاس‌ها برای «استایل پویا و تغییر وضعیت» به کار می‌روند. کدام گزینه بهترین دلیل برای اضافه و حذف کردن **کلاس‌های CSS** به‌جای نوشتن چندین `el.style.…` در JavaScript است؟
    options:
      - تغییر `style` از طریق JavaScript در مرورگرهای جدید کار نمی‌کند.
      - '`classList` تنها راه تغییر رنگ یک عنصر است.'
      - با کلاس‌ها، صفحه بدون CSS هم ظاهر درستی خواهد داشت.
      - ظاهر در CSS تعریف می‌شود و JavaScript فقط وضعیت را عوض می‌کند؛ برگرداندن آن ساده است و یک کلاس را می‌شود روی عنصرهای زیادی به کار برد.
    answer: 4
    explain: |
      با کلاس‌ها، «ظاهر» (CSS) از «رفتار» (JavaScript) جدا می‌ماند؛ همان تفکیک سه‌لایه‌ی اسلاید ۳. برگرداندن وضعیت با یک `remove` یا `toggle` انجام می‌شود و تغییر ظاهر فقط در یک جای CSS لازم است. گزینه‌ی ۱ غلط است چون `el.style` کاملاً کار می‌کند، گزینه‌ی ۲ هم غلط است (با `style.color` هم می‌شود رنگ را عوض کرد) و گزینه‌ی ۳ برعکس است: کلاس بدون تعریف در CSS هیچ اثری ندارد.
