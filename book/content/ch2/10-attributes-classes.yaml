id: ch2-attributes
title: "ویژگی‌ها (Attributes) و کلاس‌ها: setAttribute و classList"
slides: "JS in HTML، اسلایدهای ۳۱ تا ۳۴"
lesson: |
  عنوان اسلاید ۳۱ این است: «Modifying… Everything!»؛ یعنی با JavaScript تقریباً **همه‌چیزِ** یک عنصر را می‌شود عوض کرد. در این درس سراغ attributeها (ویژگی‌ها؛ همان جفت‌های `name="value"` که داخل تگ HTML می‌نویسیم) و مهم‌ترینشان، یعنی `class`، می‌رویم:

  ```html
  <img src="cat.png" alt="A cat" width="300">
  <a href="/about" target="_blank">About</a>
  <input type="text" value="Ali" disabled>
  ```

  ::: analogy
  هر عنصر را مثل یک جعبه با چند **برچسب** در نظر بگیر: «src: cat.png»، «width: 300». `setAttribute` برچسب می‌چسباند (یا برچسب قبلی را عوض می‌کند)، `getAttribute` برچسب را می‌خواند و `removeAttribute` آن را می‌کَنَد. برچسب `class` هم یک برچسب ویژه است که فهرستی از کلمه‌ها را نگه می‌دارد و ابزار مخصوص خودش، `classList`، را دارد.
  :::

  ### چهار متد کار با attributeها

  ```js
  const link = document.querySelector("a");
  link.setAttribute("href", "https://sharif.edu");  // add or change
  console.log(link.getAttribute("href"));           // "https://sharif.edu"
  link.removeAttribute("target");                   // delete it
  console.log(link.hasAttribute("target"));         // false
  console.log(link.getAttribute("title"));          // null -> no such attribute
  ```

  | متد | کار | خروجی |
  |---|---|---|
  | `setAttribute(name, value)` | اگر attribute نباشد **اضافه** می‌کند و اگر باشد مقدارش را **عوض** می‌کند | `undefined` |
  | `getAttribute(name)` | مقدار را **می‌خواند** | همیشه **رشته**، یا `null` اگر وجود نداشته باشد |
  | `removeAttribute(name)` | attribute را **حذف** می‌کند؛ اگر نباشد خطایی نمی‌دهد | `undefined` |
  | `hasAttribute(name)` | **وجود** attribute را بررسی می‌کند | `true` یا `false` |

  مقداری که به `setAttribute` می‌دهی همیشه **به رشته تبدیل** می‌شود: `setAttribute("title", 42)` مقدار `"42"` را ذخیره می‌کند و `setAttribute("title", null)` مقدار رشته‌ی `"null"` را؛ یعنی `null` دادن، attribute را **حذف نمی‌کند**.

  #### attributeهای بولی (Boolean attributes)

  attributeهایی مثل `disabled`، `checked`، `hidden`، `required` و `readonly` فقط با **حضورشان** کار می‌کنند و مقدارشان مهم نیست. پس:

  ```js
  btn.setAttribute("disabled", "false");  // STILL disabled! the attribute exists
  console.log(btn.disabled);              // true
  btn.removeAttribute("disabled");        // now it is enabled
  btn.disabled = false;                   // same thing, using the property
  ```

  ### attribute یا property؟

  مرورگر برای بیشترِ attributeهای استاندارد یک **property** (خاصیت) هم‌نام روی شیء عنصر می‌سازد: `img.src`، `a.href`، `el.id`، `input.value` و… . اما این دو همیشه یکی نیستند:

  | موضوع | `getAttribute(...)` | property |
  |---|---|---|
  | نوع مقدار | همیشه رشته (یا `null`) | نوع واقعی: `img.width` عدد `300`، `btn.disabled` بولی |
  | آدرس‌ها (`src`، `href`) | همان متنی که نوشته شده: `"dambooldor2.png"` | آدرس کامل و مطلق: `"file:///…/dom/dambooldor2.png"` |
  | `value` در `<input>` | مقدار **اولیه** (نوشته‌شده در HTML) | مقدار **فعلی** (چیزی که کاربر تایپ کرده) |
  | نام | `class`، `for` | `className`، `htmlFor` |

  ```html
  <input id="name" value="guest">
  ```

  ```js
  const input = document.getElementById("name");
  // ...the user types "Sara" into the box...
  console.log(input.value);                  // "Sara"  (current value)
  console.log(input.getAttribute("value"));  // "guest" (initial value from HTML)
  ```

  attributeهای ساختگی (غیراستاندارد) مثل `<div foo="1">` property نمی‌سازند (`div.foo` برابر `undefined` است)؛ برای آن‌ها یا `getAttribute` به کار ببر یا از `data-*` استفاده کن.

  #### attributeهای `data-*` و `dataset`

  برای چسباندن داده‌ی دلخواه به یک عنصر، استاندارد این است که نام attribute با `data-` شروع شود. JavaScript همه را در شیء `dataset` می‌بیند و نامِ خط‌تیره‌دار را به camelCase (چسباندن کلمه‌ها و بزرگ کردن حرف اول هر کلمه‌ی بعدی) تبدیل می‌کند:

  ```html
  <li id="item" data-product-id="42" data-price="9.5">Pen</li>
  ```

  ```js
  const item = document.getElementById("item");
  console.log(item.dataset.productId);   // "42"  (a string!)
  console.log(item.dataset.price);       // "9.5"
  item.dataset.inStock = "yes";          // adds data-in-stock="yes" to the tag
  ```

  ### `classList`: ابزار مخصوص کلاس‌ها

  ```js
  const box = document.querySelector(".card");   // <div class="card">
  box.classList.add("active");             // class="card active"
  box.classList.add("big", "shadow");      // several at once: "card active big shadow"
  box.classList.remove("shadow");          // "card active big" (no error if missing)
  box.classList.toggle("dark");            // added -> returns true
  box.classList.toggle("dark");            // removed -> returns false
  box.classList.contains("active");        // true
  box.classList.replace("big", "small");   // "card active small"
  console.log(box.classList.length);       // 3
  ```

  - `add` کلاس تکراری اضافه نمی‌کند و می‌تواند چند کلاس را یک‌جا بگیرد.
  - `remove` هم چندتایی کار می‌کند و اگر کلاس وجود نداشته باشد خطا نمی‌دهد.
  - `toggle(name)` اگر کلاس نباشد اضافه می‌کند و اگر باشد حذف؛ **خروجی‌اش وضعیت جدید است**: `true` یعنی «الان هست» و `false` یعنی «الان نیست».
  - `toggle(name, force)`: با `force` برابر `true` فقط اضافه می‌کند و با `false` فقط حذف. مثلاً `el.classList.toggle("hidden", !isVisible)` کلاس را دقیقاً مطابق یک شرط تنظیم می‌کند.
  - `contains(name)` فقط بررسی می‌کند و چیزی را تغییر نمی‌دهد.
  - نام کلاس را **بدون نقطه** بنویس: `add("active")`. نقطه مال انتخابگرهای CSS است؛ `add(".active")` کلاسی به نام عجیبِ `.active` می‌سازد!
  - هر آرگومان فقط **یک** کلاس است: `add("btn primary")` خطای `InvalidCharacterError` می‌دهد؛ درستش `add("btn", "primary")` است.

  #### `className`، `classList` و `setAttribute("class", …)`

  | | نوع | نوشتن با آن |
  |---|---|---|
  | `el.className` | یک رشته مثل `"card active"` | **همه‌ی** کلاس‌ها را جایگزین می‌کند |
  | `el.setAttribute("class", …)` | — | **همه‌ی** کلاس‌ها را جایگزین می‌کند |
  | `el.classList` | شیئی فهرست‌مانند (DOMTokenList) با متدهای بالا | فقط همان کلاس را اضافه/حذف می‌کند |

  ```js
  // <p class="note big">
  p.setAttribute("class", "red");   // class="red"  (note and big are gone!)
  p.classList.add("bold");          // class="red bold"
  p.className += " small";          // class="red bold small" (do not forget the space)
  ```

  ### استایل پویا و تغییر وضعیت با کلاس‌ها

  آخرین نکته‌ی اسلاید ۳۱ می‌گوید این ابزارها برای **استایل پویا** و **تغییر وضعیت** (state) به کار می‌روند. به‌جای این‌که در JavaScript ده‌ها استایل درون‌خطی (inline style؛ مثل `el.style.color = "red"`) بنویسی، ظاهر را در CSS به شکل کلاس تعریف کن و در JavaScript فقط کلاس را اضافه یا حذف کن:

  ```css
  .dark   { background: #222; color: #eee; }
  .hidden { display: none; }
  .error  { border: 2px solid red; }
  ```

  ```js
  themeBtn.addEventListener("click", () => {
    const isDark = document.body.classList.toggle("dark");  // state: dark on or off
    themeBtn.textContent = isDark ? "Light mode" : "Dark mode";
  });
  ```

  این کار سه لایه‌ی صفحه (ساختار با HTML، ظاهر با CSS، رفتار با JavaScript؛ یادآوری اسلاید ۳) را از هم جدا نگه می‌دارد، برگرداندنش با یک `remove` یا `toggle` ساده است و یک کلاس را می‌شود روی عنصرهای زیادی به کار برد. کلاس‌ها **وضعیت** را هم نشان می‌دهند: تب `active`، منوی `open`، آیتم `selected`، فیلد `error`؛ و `contains` می‌گوید الان در کدام وضعیت هستیم.

  ### مثال اسلایدهای ۳۲ تا ۳۴: Change Image

  ```html lines title=doc.html
  <!DOCTYPE html>
  <html>
  <body>
      <img src="dambooldor.png" id="dambooldor" width="300" height="300">
      <button>clickme</button>
      <script>
          const btn = document.querySelector('button');
          btn.addEventListener('click', () => {
              const img = document.getElementById("dambooldor");
              img.setAttribute("src", "dambooldor2.png");
          });
      </script>
  </body>
  </html>
  ```

  - **خط ۴:** تصویری ۳۰۰ در ۳۰۰ با `src="dambooldor.png"` و `id="dambooldor"` (شوخیِ اسلاید با نام «دامبلدور»).
  - **خطوط ۷ و ۸:** دکمه را پیدا می‌کنیم و listener کلیک را وصل می‌کنیم.
  - **خط ۹:** تصویر را با `id` پیدا می‌کنیم.
  - **خط ۱۰:** مقدار attribute `src` را عوض می‌کنیم؛ مرورگر بلافاصله تصویر جدید را بار می‌کند و نشان می‌دهد.

  **قبل از کلیک (اسلاید ۳۳):** تصویر اول (دامبلدور با رنگ‌های قرمز) و دکمه‌ی «clickme» درست کنار آن، چون `<img>` و `<button>` هر دو عنصرهای inline (عنصرهایی که در یک خط کنار هم می‌نشینند) هستند.
  **بعد از کلیک (اسلاید ۳۴):** تصویر دیگری (`dambooldor2.png`، با رنگ‌های آبی‌سبز) به‌جایش آمده؛ اندازه همچنان ۳۰۰ در ۳۰۰ است، چون به attributeهای `width` و `height` دست نزدیم، و دکمه هم سر جایش است.

  چند نکته درباره‌ی همین مثال:

  - `img.src = "dambooldor2.png";` (کار با property) همین اثر را دارد.
  - بعد از کلیک، `img.getAttribute("src")` برابر `"dambooldor2.png"` است ولی `img.src` آدرس کامل را می‌دهد: `file:///home/mani/Projects/University/web-ta/sampleprojects/dom/dambooldor2.png`.
  - کلیک دوم همان مقدار را دوباره می‌نویسد؛ نه تغییری دیده می‌شود و نه خطایی رخ می‌دهد.

  برای اینکه هر کلیک تصویر را **بین دو حالت** عوض کند، باید با `getAttribute` (نه `img.src`) مقایسه کنیم:

  ```js
  btn.addEventListener("click", () => {
    const img = document.getElementById("dambooldor");
    const next = img.getAttribute("src") === "dambooldor.png" ? "dambooldor2.png" : "dambooldor.png";
    img.setAttribute("src", next);
  });
  ```

  ::: tip
  - `setAttribute` هم اضافه می‌کند هم تغییر می‌دهد؛ `getAttribute` همیشه رشته یا `null` برمی‌گرداند؛ `removeAttribute` روی attributeِ ناموجود خطا نمی‌دهد.
  - برای کلاس‌ها `classList` را ترجیح بده: `add`، `remove` و `toggle` فقط همان کلاس را دست می‌زنند و بقیه را نگه می‌دارند.
  - `toggle` وضعیت جدید را برمی‌گرداند؛ پس `const isDark = body.classList.toggle("dark")` هم وضعیت را عوض می‌کند و هم می‌گوید الان در چه وضعیتی هستیم.
  - ظاهر را در CSS تعریف کن و در JavaScript فقط کلاس را عوض کن.
  :::

  ::: trap
  - `getAttribute` برای attributeِ ناموجود `null` برمی‌گرداند، نه `undefined` و نه رشته‌ی خالی.
  - `getAttribute("width")` رشته‌ی `"300"` است ولی `img.width` عدد `300`؛ مقدار `dataset` هم همیشه رشته است (`"42" + 1` می‌شود `"421"`).
  - `img.src` و `a.href` آدرس **کامل** را برمی‌گردانند؛ مقایسه‌ی `img.src === "a.png"` تقریباً هیچ‌وقت درست نیست.
  - `setAttribute("disabled", "false")` دکمه را غیرفعال **می‌کند**؛ برای فعال کردن `removeAttribute("disabled")` لازم است.
  - `setAttribute("class", …)` و `className = …` همه‌ی کلاس‌های قبلی را پاک می‌کنند.
  - `classList.add(".active")` کلاسی با نقطه می‌سازد و `classList.add("a b")` خطای `InvalidCharacterError` می‌دهد.
  - بعد از تایپ کاربر، `input.value` و `input.getAttribute("value")` با هم فرق دارند.
  :::

  ::: summary
  attributeها: `setAttribute` (افزودن/تغییر)، `getAttribute` (خواندن؛ رشته یا `null`)، `removeAttribute` (حذف)، `hasAttribute` (وجود). property همان مقدار را با نوع واقعی و وضعیت فعلی نشان می‌دهد (`img.src` مطلق، `input.value` فعلی). کلاس‌ها: `classList.add/remove/toggle/contains/replace`؛ `className` و `setAttribute("class")` همه را جایگزین می‌کنند. استایل پویا = تعریف کلاس در CSS + عوض کردن کلاس در JavaScript.
  :::
questions:
  - level: easy
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <img id="pic" src="cat.png">
    code: |
      const pic = document.getElementById("pic");
      console.log(pic.getAttribute("alt"));
    options:
      - out: "undefined"
      - out: "null"
      - out: "false"
      - out: "!! TypeError"
    answer: 2
    explain: |
      `getAttribute` برای attributeی که روی عنصر وجود ندارد مقدار `null` برمی‌گرداند (و در غیر این صورت همیشه یک رشته). گزینه‌ی ۱ رفتار خواندن یک property ناموجود از شیء را با `getAttribute` اشتباه گرفته، گزینه‌ی ۳ خروجی `hasAttribute` را حدس زده و گزینه‌ی ۴ اشتباه است چون نبودن attribute خطا نیست.

  - level: easy
    stem: کدام دستور attribute `title` را به‌طور **کامل** از عنصر `el` حذف می‌کند؟
    options:
      - '`el.setAttribute("title", null)`'
      - '`el.setAttribute("title", "")`'
      - '`el.removeAttribute("title")`'
      - '`el.classList.remove("title")`'
    answer: 3
    explain: |
      فقط `removeAttribute` خودِ attribute را حذف می‌کند (بعد از آن `hasAttribute("title")` برابر `false` است). گزینه‌ی ۱ مقدار را رشته‌ی `"null"` می‌کند و گزینه‌ی ۲ آن را خالی می‌کند، ولی در هر دو attribute هنوز وجود دارد. گزینه‌ی ۴ با attributeها کاری ندارد و فقط کلاسی به نام `title` را (اگر باشد) از فهرست کلاس‌ها برمی‌دارد.

  - level: easy
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <a id="link" href="/home">Home</a>
    code: |
      const link = document.getElementById("link");
      link.setAttribute("href", "/about");
      link.setAttribute("target", "_blank");
      console.log(link.getAttribute("href"), link.getAttribute("target"), link.attributes.length);
    options:
      - out: "/home _blank 3"
      - out: "/about _blank 2"
      - out: "/about null 3"
      - out: "/about _blank 3"
    answer: 4
    explain: |
      `setAttribute` اگر attribute وجود داشته باشد مقدارش را **عوض** می‌کند (`href` از `/home` به `/about`) و اگر نباشد آن را **اضافه** می‌کند (`target`). حالا لینک سه attribute دارد: `id`، `href` و `target`. گزینه‌ی ۱ فکر کرده مقدار قبلی عوض نمی‌شود، گزینه‌ی ۲ `id` را نشمرده و گزینه‌ی ۳ تصور کرده `setAttribute` فقط attributeهای موجود را تغییر می‌دهد.

  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <div id="box">Box</div>
    code: |
      const box = document.getElementById("box");
      box.removeAttribute("title");
      console.log(box.hasAttribute("title"), box.hasAttribute("id"));
    options:
      - out: "!! NotFoundError"
      - out: "false true"
      - out: "true true"
      - out: "undefined true"
    answer: 2
    explain: |
      حذف attributeی که وجود ندارد **خطا نمی‌دهد** و فقط کاری انجام نمی‌شود. `hasAttribute` همیشه یک مقدار بولی برمی‌گرداند: `title` نیست (`false`) و `id` هست (`true`). گزینه‌ی ۱ رفتار سخت‌گیرانه‌ی `removeChild` را به `removeAttribute` نسبت داده، گزینه‌ی ۳ وجود `title` را فرض کرده و گزینه‌ی ۴ فکر کرده `hasAttribute` مقدار `undefined` برمی‌گرداند.

  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <img src="a.png" width="300">
    code: |
      const img = document.querySelector("img");
      console.log(typeof img.getAttribute("width"), typeof img.width);
    options:
      - out: "string number"
      - out: "number number"
      - out: "string string"
      - out: "number string"
    answer: 1
    explain: |
      `getAttribute` همیشه رشته (یا `null`) برمی‌گرداند، پس `"300"` از نوع `string` است. اما property متناظر، `img.width`، مقدار را با نوع واقعی‌اش یعنی عدد `300` می‌دهد. گزینه‌های ۲ و ۴ فکر کرده‌اند `getAttribute` عدد برمی‌گرداند و گزینه‌ی ۳ property را هم رشته دانسته است.

  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <button id="send">Send</button>
    code: |
      const send = document.getElementById("send");
      send.setAttribute("disabled", "false");
      console.log(send.disabled);
      send.removeAttribute("disabled");
      console.log(send.disabled);
    options:
      - out: ["false", "false"]
      - out: ["false", "true"]
      - out: ["true", "false"]
      - out: ["true", "true"]
    answer: 3
    explain: |
      `disabled` یک attribute بولی است و فقط **حضورش** مهم است؛ مقدار `"false"` هم حضور حساب می‌شود، پس دکمه غیرفعال است و `true` چاپ می‌شود. با `removeAttribute` attribute حذف و دکمه فعال می‌شود (`false`). گزینه‌ی ۱ اشتباه رایج است (خیال کرده رشته‌ی `"false"` یعنی فعال)، گزینه‌ی ۲ کاملاً برعکس است و گزینه‌ی ۴ اثر `removeAttribute` را نادیده گرفته است.

  - level: easy
    stem: در مثال «Change Image» (اسلاید ۳۲) بعد از کلیک روی دکمه‌ی «clickme»، طبق اسلاید ۳۴ چه تغییری روی صفحه دیده می‌شود؟
    options:
      - تصویر و دکمه هر دو حذف می‌شوند و تصویر جدیدی جای آن‌ها می‌آید.
      - فقط تصویر عوض می‌شود؛ اندازه‌ی ۳۰۰ در ۳۰۰ و دکمه بدون تغییر می‌مانند.
      - تصویر عوض می‌شود ولی اندازه‌اش به اندازه‌ی واقعی فایل جدید برمی‌گردد.
      - تصویر جدید زیر تصویر قبلی اضافه می‌شود.
    answer: 2
    explain: |
