  - level: hard
    stem: 'صفحه از آدرس `https://quiz.example/` باز شده و کاربر **سه بار** روی دکمه کلیک می‌کند. خروجی کدام است؟'
    check: dom-output
    html: |
      <img id="pic" src="day.png">
      <button id="switch">Switch</button>
    code: |
      const pic = document.getElementById("pic");
      document.getElementById("switch").addEventListener("click", () => {
        if (pic.src === "day.png") {
          pic.src = "night.png";
        } else {
          pic.src = "day.png";
        }
        console.log(pic.getAttribute("src"));
      });
    events:
      - { type: click, target: "#switch", times: 3 }
    options:
      - out: ["night.png", "day.png", "night.png"]
      - out: ["night.png", "night.png", "night.png"]
      - out: ["day.png", "night.png", "day.png"]
      - out: ["day.png", "day.png", "day.png"]
    answer: 4
    explain: |
      `pic.src` آدرس کامل (`https://quiz.example/day.png`) را برمی‌گرداند، پس شرط `pic.src === "day.png"` **هیچ‌وقت** برقرار نیست و هر بار شاخه‌ی `else` اجرا می‌شود که `src` را دوباره `day.png` می‌کند. نتیجه این است که تصویر هرگز عوض نمی‌شود. گزینه‌ی ۱ همان رفتاری است که برنامه‌نویس می‌خواست (با `pic.getAttribute("src") === "day.png"` به دست می‌آید)؛ گزینه‌های ۲ و ۳ هم شرط را دست‌کم یک بار درست فرض کرده‌اند.

