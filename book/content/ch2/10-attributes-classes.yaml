    code: |
      const body = document.body;
      console.log(body.classList.toggle("dark"));
      console.log(body.classList.toggle("dark"));
      console.log(body.classList.toggle("dark", true));
      console.log(body.className);
    options:
      - out: ["undefined", "undefined", "undefined", "dark"]
      - out: ["true", "false", "true", "dark"]
      - out: ["false", "true", "false", "dark"]
