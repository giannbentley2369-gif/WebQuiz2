  - level: easy
    stem: 'دستور `old.replaceWith(fresh)` معادل کدام دستور است؟'
    options:
      - '`old.parentNode.replaceChild(old, fresh)`'
      - '`fresh.parentNode.replaceChild(old, fresh)`'
      - '`old.removeChild(fresh)`'
      - '`old.parentNode.replaceChild(fresh, old)`'
    answer: 4
    explain: |
      `replaceWith` روی **عنصر قدیمی** صدا زده می‌شود و آن را با گره‌ی جدید عوض می‌کند. در نسخه‌ی قدیمی باید روی پدرِ `old` صدا بزنیم و اول جدید، بعد قدیمی را بدهیم: `old.parentNode.replaceChild(fresh, old)`. گزینه‌ی ۱ ترتیب آرگومان‌ها را برعکس کرده، گزینه‌ی ۲ هم پدر و هم ترتیب را اشتباه گرفته و گزینه‌ی ۳ اصلاً جایگزین نمی‌کند (و چون `fresh` فرزند `old` نیست، خطا هم می‌دهد).

  - level: easy
    stem: در مثال «Title Goes Away!» (اسلاید ۲۸)، طبق تصویر اسلاید ۳۰ بعد از **اولین** کلیک روی دکمه چه چیزی روی صفحه دیده می‌شود؟
    options:
      - عنوان «Hello World» و دکمه، بدون تغییر
      - فقط دکمه‌ی «CLICK ME!»
      - فقط عنوان «Hello World»
      - یک صفحه‌ی کاملاً خالی
    answer: 2
    explain: |
      listener عنصر `#title` (یعنی `<h1>`) را پیدا و حذف می‌کند؛ دکمه دست نمی‌خورد و چون جای عنوان خالی شده، بالای صفحه قرار می‌گیرد. گزینه‌ی ۱ اثر `remove()` را نادیده گرفته، گزینه‌ی ۳ عنصر حذف‌شده را اشتباه گرفته و گزینه‌ی ۴ تصور کرده کل body حذف می‌شود.

  - level: medium
    stem: صفحه‌ی زیر همان کد اسلاید ۲۸ است. کاربر **دو بار** روی دکمه کلیک می‌کند. خروجی کنسول کدام است؟
    check: dom-output
    html: |
      <h1 id="title">Hello World</h1>
      <button>CLICK ME!</button>
    code: |
      const btn = document.querySelector('button');
      btn.addEventListener('click', () => {
          const element = document.getElementById("title");
          element.remove();
      });
    events:
      - { type: click, target: "button", times: 2 }
    after: |
      console.log(document.querySelectorAll("h1").length, document.querySelectorAll("button").length);
    eventsNote: 'بعد از دو کلیک این دستور اجرا می‌شود: `console.log(document.querySelectorAll("h1").length, document.querySelectorAll("button").length);`'
    options:
      - out: ["0 1"]
      - out: ["!! TypeError", "0 0"]
      - out: ["!! TypeError", "0 1"]
      - out: ["0 0"]
    answer: 3
    explain: |
      کلیک اول عنوان را حذف می‌کند و خروجی ندارد. در کلیک دوم `getElementById("title")` مقدار `null` برمی‌گرداند و `null.remove()` خطای `TypeError: Cannot read properties of null (reading 'remove')` می‌دهد. این خطا فقط همان اجرای listener را متوقف می‌کند؛ دکمه سر جایش است، پس در پایان ۰ عنوان و ۱ دکمه داریم. گزینه‌های ۱ و ۴ خطای کلیک دوم را ندیده‌اند و گزینه‌های ۲ و ۴ فکر کرده‌اند دکمه هم حذف می‌شود.

  - level: medium
    stem: در مثال اسلاید ۲۸، برای این‌که کلیک‌های دوم به بعد **هیچ خطایی** ندهند، خط `element.remove();` را با کدام گزینه عوض کنیم؟
    options:
      - '`element?.remove();`'
      - '`element.remove(true);`'
      - '`document.removeChild(element);`'
      - '`element.innerHTML = "";`'
    answer: 1
    explain: |
      با optional chaining (`?.`)، وقتی `element` برابر `null` است متد صدا زده نمی‌شود و خطایی رخ نمی‌دهد؛ در کلیک اول هم عنوان مثل قبل حذف می‌شود. در گزینه‌ی ۲ آرگومان اضافه هیچ اثری ندارد و `null.remove` باز هم `TypeError` می‌دهد. در گزینه‌ی ۳ عنوان فرزند مستقیم `document` نیست (فرزند body است)، پس همان کلیک اول `NotFoundError` می‌دهد. گزینه‌ی ۴ عنوان را حذف نمی‌کند (فقط خالی‌اش می‌کند) و روی `null` هم خطا می‌دهد.

  - level: hard
    stem: اجرای کدام خط از کد زیر باعث خطا می‌شود؟
    check: dom-output
    lines: true
    html: |
      <ul id="list"><li>1</li><li>2</li></ul>
    code: |
      const list = document.querySelector("#list");
      const first = list.firstElementChild;
      first.remove();
      console.log("A");
      first.remove();
      console.log("B");
      list.removeChild(first);
