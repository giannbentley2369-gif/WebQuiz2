id: ch2-remove
title: "حذف و جایگزینی عناصر"
slides: "JS in HTML، اسلایدهای ۲۷ تا ۳۰"
lesson: |
  در درس قبل عنصر ساختیم و به صفحه اضافه کردیم. حالا نوبت برعکسش است: **برداشتن** عنصر از صفحه یا **عوض کردن** آن با عنصری دیگر. بستن یک اعلان (notification)، حذف یک کار از لیست کارها (todo list) و پاک کردن پیام خطا بعد از اصلاح فرم همه از همین جنس‌اند.

  ::: analogy
  درخت DOM را مثل یک قفسه‌ی کتاب در نظر بگیر. وقتی کتابی را از قفسه برمی‌داری، کتاب **نابود نمی‌شود**؛ فقط دیگر در قفسه نیست و اگر هنوز در دستت باشد (یعنی در یک متغیر نگهش داشته باشی) می‌توانی دوباره سر جایش یا جای دیگری بگذاری. حذف عنصر از DOM هم دقیقاً همین است.
  :::

  ### سه ابزار اصلی (اسلاید ۲۷)

  اسلاید ۲۷ می‌گوید:

  - با `.remove()` عنصر را **مستقیم** حذف کن؛
  - یا `.removeChild()` را روی **عنصر پدر** صدا بزن؛
  - `replaceChild()` یک عنصر را با عنصر دیگری **عوض** می‌کند؛
  - **همیشه اول عنصر را پیدا کن** (query کن)، بعد حذفش کن؛
  - برای رابط‌های پویا مثل لیست کارها و اعلان‌ها کاربرد دارد؛
  - با رویدادها ترکیبش کن تا کاربر با کلیک چیزی را حذف کند.

  #### `remove()`: عنصر خودش را حذف می‌کند

  ```js
  const note = document.getElementById("note");
  note.remove();   // the element removes itself, together with all its children
  ```

  - به پدر احتیاجی ندارد و آرگومان هم نمی‌گیرد.
  - عنصر را **همراه با همه‌ی فرزندانش** (کل زیردرخت) از صفحه برمی‌دارد.
  - مقدار برگشتی‌اش `undefined` است.
  - اگر عنصر از قبل در صفحه نباشد (مثلاً قبلاً حذف شده یا هیچ‌وقت اضافه نشده)، **هیچ اتفاقی نمی‌افتد** و خطایی هم رخ نمی‌دهد.

  #### `removeChild()`: پدر فرزندش را بیرون می‌کند

  ```js
  const list = document.getElementById("list");
  const first = list.firstElementChild;
  const removed = list.removeChild(first);
  console.log(removed === first);    // true  -> it returns the removed node
  console.log(removed.isConnected);  // false -> no longer in the page
  ```

  - روی **پدر** صدا زده می‌شود و فرزند را به‌عنوان آرگومان می‌گیرد.
  - **گره‌ی حذف‌شده را برمی‌گرداند.**
  - آرگومان باید **فرزند مستقیم** همان پدر باشد؛ وگرنه خطای `NotFoundError` رخ می‌دهد (مثلاً اگر قبلاً حذف شده باشد یا نوه باشد نه فرزند).
  - روش قدیمی‌تر است؛ الگوی معروف `el.parentNode.removeChild(el)` همان کار `el.remove()` را می‌کند.

  #### `replaceChild()`: عوض کردن یک فرزند با گره‌ای دیگر

  ```js
  parent.replaceChild(newChild, oldChild);
  ```

  - روی **پدر** صدا زده می‌شود.
  - ترتیب آرگومان‌ها مثل `insertBefore` است: **اول جدید، بعد قدیمی**.
  - **گره‌ی قدیمی** (همان که بیرون رفت) را برمی‌گرداند.
  - اگر `oldChild` فرزند این پدر نباشد، خطای `NotFoundError` می‌گیری.
  - اگر `newChild` از قبل جای دیگری در صفحه باشد، به جای جدید **منتقل** می‌شود (کپی نمی‌شود).

  ```html
  <ul id="list"><li>A</li><li id="b">B</li><li>C</li></ul>
  ```

  ```js
  const list = document.getElementById("list");
  const fresh = document.createElement("li");
  fresh.textContent = "X";
  const old = list.replaceChild(fresh, document.getElementById("b"));
  console.log(list.textContent);  // "AXC"
  console.log(old.textContent);   // "B"  -> the replaced node is returned
  ```

  نسخه‌ی مدرن‌تر `oldEl.replaceWith(newEl)` است که روی **خودِ عنصر قدیمی** صدا زده می‌شود و `undefined` برمی‌گرداند؛ یعنی `old.replaceWith(fresh)` همان `old.parentNode.replaceChild(fresh, old)` است.

  | متد | روی چه چیزی صدا زده می‌شود؟ | مقدار برگشتی | اگر گره فرزندِ مورد انتظار نباشد |
  |---|---|---|---|
  | `el.remove()` | خود عنصر | `undefined` | خطا نمی‌دهد؛ کاری نمی‌کند |
  | `parent.removeChild(child)` | پدر | گره‌ی حذف‌شده | `NotFoundError` |
  | `parent.replaceChild(newC, oldC)` | پدر | گره‌ی قدیمی | `NotFoundError` |
  | `oldEl.replaceWith(newEl)` | عنصر قدیمی | `undefined` | — |

  ### اول پیدا کن، بعد حذف کن!

  `getElementById` و `querySelector` اگر چیزی پیدا نکنند `null` برمی‌گردانند. صدا زدن متد روی `null` خطاست:

  ```js
  document.getElementById("nope").remove();
  // Uncaught TypeError: Cannot read properties of null (reading 'remove')
  ```

  پس قبل از حذف مطمئن شو عنصر پیدا شده:

  ```js
  const el = document.getElementById("nope");
  if (el) el.remove();   // classic guard
  el?.remove();          // optional chaining: does nothing when el is null
  ```

  `?.` (optional chaining؛ «اگر سمت چپ `null` یا `undefined` بود، ادامه نده») در این حالت بدون خطا `undefined` برمی‌گرداند.

  ### مثال اسلایدهای ۲۸ تا ۳۰: Title Goes Away!

  ```html lines title=doc.html
  <!DOCTYPE html>
  <html>
  <body>
      <h1 id="title">Hello World</h1>
      <button>CLICK ME!</button>
      <script>
          const btn = document.querySelector('button');
          btn.addEventListener('click', () => {
              const element = document.getElementById("title");
              element.remove();
          });
      </script>
  </body>
  </html>
  ```

  - **خط ۷:** دکمه را پیدا می‌کنیم.
  - **خط ۸:** listener کلیک را وصل می‌کنیم.
  - **خط ۹:** در **هر** کلیک، عنوانی با `id="title"` را جست‌وجو می‌کنیم (همان «اول پیدا کن»).
  - **خط ۱۰:** عنوان را حذف می‌کنیم.

  **قبل از کلیک (اسلاید ۲۹):** عنوان بزرگ «Hello World» و زیرش دکمه‌ی «CLICK ME!».
  **بعد از کلیک (اسلاید ۳۰):** عنوان ناپدید شده و فقط دکمه مانده که حالا بالای صفحه قرار گرفته (چون جای خالیِ عنوان هم از بین رفته است).

  **کلیک دوم چه می‌شود؟** این‌بار `getElementById("title")` چیزی پیدا نمی‌کند و `null` برمی‌گرداند؛ پس `element.remove()` در کنسول خطای `TypeError: Cannot read properties of null (reading 'remove')` می‌دهد. ظاهر صفحه تغییری نمی‌کند و دکمه هم سر جایش است؛ خطا فقط همان اجرای listener را متوقف می‌کند و با هر کلیک بعدی دوباره تکرار می‌شود. راه‌های رفع:

  - `element?.remove();` یا `if (element) element.remove();`
  - غیرفعال کردن دکمه بعد از کلیک اول: `btn.disabled = true;`
  - اجرای listener فقط یک بار: `btn.addEventListener('click', handler, { once: true });` (گزینه‌ی `once` باعث می‌شود listener بعد از اولین اجرا خودبه‌خود حذف شود.)

  ### حذف‌شده یعنی نابودشده؟ نه!

  ```js
  const msg = document.getElementById("msg");
  msg.remove();                  // gone from the page...
  console.log(msg.textContent);  // ...but still alive in the variable
  document.body.append(msg);     // put it back (an "undo" feature)
  ```

  بعد از `remove()` متغیر `msg` **`null` نمی‌شود**؛ همان شیء با همه‌ی متن، attributeها و فرزندانش در حافظه است و فقط به صفحه وصل نیست (`isConnected` برابر `false`). هر وقت هیچ متغیری دیگر به آن اشاره نکند، garbage collector (بخش خودکار پاک‌سازی حافظه‌ی JavaScript) آن را پاک می‌کند.

  ### خالی کردن یک عنصر (حذف همه‌ی فرزندان)

  ```js
  list.innerHTML = "";            // 1) simplest
  list.textContent = "";          // 2) also removes every child
  list.replaceChildren();         // 3) modern: no arguments = no children
  while (list.firstChild) {       // 4) classic loop
    list.removeChild(list.firstChild);
  }
  ```

  در هر چهار روش خودِ `list` سر جایش می‌ماند و فقط **محتوایش** خالی می‌شود؛ اما `list.remove()` خودِ لیست را از صفحه برمی‌دارد. در روش ۴ دقت کن که `firstChild` گره‌های متنیِ فاصله و خط جدید بین تگ‌ها را هم شامل می‌شود؛ حلقه آن‌قدر ادامه می‌دهد تا هیچ فرزندی (از هر نوع) نماند.

  ### دام حلقه روی مجموعه‌ی زنده

  `getElementsByClassName` یک HTMLCollection **زنده** (live؛ با هر تغییر DOM خودش به‌روز می‌شود) برمی‌گرداند. حذف در یک حلقه‌ی معمولی روی آن **نصف عنصرها را جا می‌اندازد**:

  ```js
  const items = document.getElementsByClassName("item"); // live collection of 4 items
  for (let i = 0; i < items.length; i++) {
    items[i].remove();   // BUG: after each removal the collection shrinks and shifts
  }
  // only items 1 and 3 are removed; 2 and 4 stay
  ```

  بعد از حذف `items[0]`، عنصر دوم به خانه‌ی ۰ می‌لغزد ولی `i` به ۱ رفته است؛ پس از رویش می‌پرد. راه درست:

  ```js
  document.querySelectorAll(".item").forEach((el) => el.remove()); // static NodeList
  // or
  while (items.length > 0) items[0].remove();
  ```

  ### کاربردها: لیست کارها و اعلان‌ها (ترکیب با رویداد)

  **دکمه‌ی حذف برای هر کار** با event delegation (یک listener روی پدر برای همه‌ی فرزندان، که در درس رویدادها دیدیم):

  ```html
  <ul id="todos">
    <li>Read slides <button class="del">x</button></li>
    <li>Do homework <button class="del">x</button></li>
  </ul>
  ```

  ```js
  document.getElementById("todos").addEventListener("click", (e) => {
    if (e.target.classList.contains("del")) {
      e.target.parentElement.remove();   // remove the <li> that holds this button
    }
  });
  ```

  `e.target` خودِ دکمه است؛ اگر `e.target.remove()` بنویسیم فقط دکمه حذف می‌شود و متن کار می‌ماند. برای همین سراغ پدرش (`parentElement`) یا نزدیک‌ترین `<li>` با `e.target.closest("li")` می‌رویم.

  **اعلانی که خودش بعد از ۳ ثانیه بسته می‌شود:**

  ```js
  function showToast(text) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = text;
    document.body.append(toast);
    setTimeout(() => toast.remove(), 3000);   // auto-dismiss after 3 seconds
  }
  showToast("Saved!");
  ```

  **پنهان کردن با حذف کردن فرق دارد:** `el.style.display = "none"` یا `el.hidden = true` فقط عنصر را **نامرئی** می‌کنند؛ عنصر هنوز در DOM است و `querySelector` پیدایش می‌کند. `remove()` واقعاً آن را از درخت بیرون می‌برد.

  ::: tip
  - `el.remove()` ساده‌ترین راه است: نه پدر می‌خواهد نه آرگومان، و روی عنصرِ از قبل حذف‌شده هم خطا نمی‌دهد.
  - `removeChild` و `replaceChild` روی **پدر** صدا زده می‌شوند و هر دو گره‌ای را که بیرون رفته **برمی‌گردانند**.
  - `replaceChild(جدید, قدیمی)`؛ ترتیبش مثل `insertBefore(جدید, مرجع)` است: «اول جدید».
  - گره‌ی حذف‌شده در متغیرت زنده می‌ماند و می‌شود دوباره اضافه‌اش کرد.
  :::

  ::: trap
  - در مثال «Title Goes Away!»، کلیک دوم خطای `TypeError` (خواندن `remove` از `null`) می‌دهد، چون عنوان دیگر وجود ندارد.
  - `removeChild` روی گره‌ای که فرزند مستقیم آن پدر نیست (یا قبلاً حذف شده) خطای `NotFoundError` می‌دهد، ولی `remove()` در همین وضعیت بی‌صدا هیچ کاری نمی‌کند.
  - جابه‌جا نوشتن آرگومان‌ها در `replaceChild(old, fresh)` معمولاً به `NotFoundError` می‌رسد، چون `fresh` فرزند آن پدر نیست.
  - حذف در حلقه‌ی `for` روی HTMLCollection زنده فقط نصف عنصرها را حذف می‌کند.
  - حذف پدر یعنی حذف کل زیردرختش؛ فرزندان جداگانه در صفحه نمی‌مانند.
  :::

  ::: summary
  حذف: `el.remove()` (ساده) یا `parent.removeChild(child)` (برمی‌گرداند، سخت‌گیر). جایگزینی: `parent.replaceChild(newC, oldC)` یا `oldC.replaceWith(newC)`. خالی کردن: `innerHTML = ""`، `textContent = ""`، `replaceChildren()` یا حلقه‌ی `while (firstChild)`. قبل از حذف، عنصر را پیدا کن و `null` بودنش را بررسی کن.
  :::
questions:
  - level: easy
    stem: کدام متد عنصر را **بدون نیاز به دسترسی به پدرش** و بدون هیچ آرگومانی از صفحه حذف می‌کند؟
    options:
      - '`el.removeChild()`'
      - '`el.remove()`'
      - '`el.replaceChild()`'
      - '`delete el`'
    answer: 2
    explain: |
      `el.remove()` روی خودِ عنصر صدا زده می‌شود و آن را با همه‌ی فرزندانش از DOM برمی‌دارد. `removeChild` و `replaceChild` روی **پدر** صدا زده می‌شوند و آرگومان لازم دارند. `delete` فقط برای حذف property از یک شیء است و روی یک متغیر هیچ اثری روی DOM ندارد.

  - level: easy
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li id="a">A</li><li>B</li></ul>
    code: |
      const list = document.getElementById("list");
      const a = document.getElementById("a");
      const removed = list.removeChild(a);
      console.log(removed === a, list.children.length, removed.textContent);
    options:
      - out: "true 1 A"
      - out: "!! TypeError"
      - out: "true 1"
      - out: "false 1 AB"
    answer: 1
    explain: |
      `removeChild` همان گره‌ای را که حذف کرده **برمی‌گرداند**؛ پس `removed === a` برقرار است. لیست یک فرزند کمتر دارد (۱) و گره‌ی حذف‌شده هنوز متنش (`A`) را دارد، چون حذف از DOM آن را نابود نمی‌کند. گزینه‌ی ۲ فرض کرده مقدار برگشتی `undefined` است، گزینه‌ی ۳ فکر کرده محتوای گره پاک می‌شود و گزینه‌ی ۴ تصور کرده پدر برگردانده می‌شود.

  - level: easy
    stem: 'در جای خالی `parent.replaceChild(______)` برای این‌که `oldChild` با `newChild` عوض شود، کدام گزینه قرار می‌گیرد؟'
    options:
      - '`oldChild, newChild`'
      - '`parent, newChild`'
      - '`newChild, oldChild`'
      - '`newChild`'
    answer: 3
    explain: |
      امضای درست `parent.replaceChild(newChild, oldChild)` است: **اول جدید، بعد قدیمی** (درست مثل `insertBefore(جدید, مرجع)`). گزینه‌ی ۱ ترتیب را برعکس کرده که معمولاً به `NotFoundError` می‌رسد، گزینه‌ی ۲ پدر را بی‌دلیل آرگومان کرده و گزینه‌ی ۴ مشخص نکرده کدام فرزند باید عوض شود (این شکلِ تک‌آرگومانی مال `oldChild.replaceWith(newChild)` است).

  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li id="a">A</li></ul>
      <p id="note">N</p>
    code: |
      const list = document.getElementById("list");
      const note = document.getElementById("note");
      list.removeChild(document.getElementById("a"));
      console.log(list.children.length);
      list.removeChild(note);
      console.log("done");
    options:
      - out: ["0", "done"]
      - out: ["!! NotFoundError"]
      - out: ["0", "!! TypeError"]
      - out: ["0", "!! NotFoundError"]
    answer: 4
    explain: |
      حذف `#a` درست است، چون فرزند مستقیم لیست است؛ پس `0` چاپ می‌شود. اما `#note` فرزند `list` نیست (هم‌سطح آن است) و `removeChild` در این حالت خطای `NotFoundError` می‌دهد؛ پس `done` چاپ نمی‌شود. گزینه‌ی ۱ فرض کرده `removeChild` هر عنصری را حذف می‌کند، گزینه‌ی ۲ خطا را به خط اول نسبت داده و گزینه‌ی ۳ نوع خطا را اشتباه گفته است (`note` پیدا شده و `null` نیست).

  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li>A</li><li id="b">B</li><li>C</li></ul>
    code: |
      const list = document.getElementById("list");
      const old = document.getElementById("b");
      const fresh = document.createElement("li");
      fresh.textContent = "X";
      const r = list.replaceChild(fresh, old);
      console.log(list.textContent, r.textContent);
    options:
      - out: "AXC X"
      - out: "AXC B"
      - out: "ABC X"
      - out: "AXBC B"
    answer: 2
    explain: |
      `replaceChild(fresh, old)` عنصر B را برمی‌دارد و X را **در همان جای** آن می‌گذارد؛ پس متن لیست `AXC` است. مقدار برگشتی **گره‌ی قدیمی** است، یعنی B. گزینه‌ی ۱ فکر کرده گره‌ی جدید برگردانده می‌شود، گزینه‌ی ۳ جای آرگومان‌ها را برعکس فهمیده و گزینه‌ی ۴ تصور کرده X فقط قبل از B درج می‌شود و B می‌ماند.

  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li>A</li><li>B</li></ul>
    code: |
      const list = document.getElementById("list");
      const old = list.querySelector("li");
      const fresh = document.createElement("li");
      fresh.textContent = "NEW";
      list.replaceChild(old, fresh);
      console.log(list.textContent);
    options:
      - out: "NEWB"
      - out: "AB"
      - out: "!! NotFoundError"
      - out: "!! TypeError"
    answer: 3
    explain: |
      آرگومان‌ها جابه‌جا نوشته شده‌اند: `replaceChild(old, fresh)` یعنی «`fresh` را با `old` عوض کن». اما `fresh` اصلاً فرزند `list` نیست، پس مرورگر خطای `NotFoundError` می‌دهد و `console.log` اجرا نمی‌شود. گزینه‌ی ۱ نتیجه‌ی نسخه‌ی درست (`replaceChild(fresh, old)`) است، گزینه‌ی ۲ فرض کرده خطا بی‌صدا نادیده گرفته می‌شود و گزینه‌ی ۴ نوع خطا را اشتباه گفته است (هر دو آرگومان گره‌اند و هیچ‌کدام `null` نیست).

  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li id="a">A</li><li id="b">B</li><li id="c">C</li></ul>
    code: |
      const list = document.getElementById("list");
      const a = document.getElementById("a");
      const c = document.getElementById("c");
      list.replaceChild(a, c);
