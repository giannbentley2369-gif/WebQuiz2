id: ch2-prereq
title: "مرور پیش‌نیازها: سه لایه‌ی وب، شیء، this و async"
slides: "JS in HTML، اسلایدهای ۳ تا ۶"
lesson: |
  این درس، مرور چند پیش‌نیاز است که اسلایدهای ۳ تا ۶ پیش از شروع بحث DOM یادآوری می‌کنند. عنوان این
  جلسه «**Structure Meets Behaviour!**» است، یعنی «ساختار به رفتار می‌رسد»: قرار است JavaScript (لایه‌ی
  رفتار) را به HTML (لایه‌ی ساختار) وصل کنیم. طبق اسلاید ۲، این جلسه سه هدف دارد:

  1. بفهمیم **DOM** چیست (از درس بعد کامل می‌بینیم).
  2. راهی پیدا کنیم که صفحه‌هایمان **تعاملی (interactive)** شوند، یعنی به کارهای کاربر واکنش نشان دهند.
  3. بفهمیم **برنامه‌نویسی ناهمگام (async)** در وب به چه کاری می‌آید.

  ### ۱) سه لایه‌ی یک وب‌سایت (اسلاید ۳)

  ::: analogy
  یک خانه را تصور کن. **اسکلت و دیوارها** مشخص می‌کنند خانه چند اتاق دارد و هر چیز کجاست. **رنگ و
  دکوراسیون** مشخص می‌کنند خانه چه شکلی دیده شود. **سیم‌کشی برق و کلیدها** مشخص می‌کنند وقتی کلیدی را
  می‌زنی چه اتفاقی بیفتد. یک صفحه‌ی وب هم دقیقاً همین سه لایه را دارد.
  :::

  | لایه | سؤالی که جواب می‌دهد (اسلاید ۳) | فناوری | مثال |
  |---|---|---|---|
  | Structure (ساختار) | What the **content** is: محتوا چیست؟ | HTML | یک عنوان `<h1>` و یک دکمه‌ی `<button>` |
  | Style (ظاهر) | How it **looks**: چه شکلی است؟ | CSS | رنگ، اندازه‌ی فونت، فاصله‌ها و چیدمان |
  | Behaviour (رفتار) | How it **reacts**: چه واکنشی نشان می‌دهد؟ | JavaScript | با کلیک روی دکمه، متن عنوان عوض شود |

  اسلاید ۳ نام فناوری‌ها را ننوشته، ولی تناظر استاندارد (از جلسه‌های قبل) همین است: ساختار = HTML،
  ظاهر = CSS، رفتار = JavaScript. مثال کوچک زیر هر سه لایه را با هم دارد:

  ```html
  <!DOCTYPE html>
  <html>
    <head>
      <!-- Style layer: CSS -->
      <style>
        h1 { color: navy; }
      </style>
    </head>
    <body>
      <!-- Structure layer: HTML -->
      <h1 id="title">Hello World</h1>
      <button id="btn">CLICK ME!</button>

      <!-- Behaviour layer: JavaScript -->
      <script>
        document.getElementById("btn").addEventListener("click", () => {
          document.getElementById("title").textContent = "Goodbye World";
        });
      </script>
    </body>
  </html>
  ```

  بدون JavaScript، صفحه فقط چیزی را **نمایش** می‌دهد؛ با JavaScript صفحه **واکنش** نشان می‌دهد (اینجا با
  کلیک، متن عنوان به `Goodbye World` تغییر می‌کند). البته لایه‌ی رفتار می‌تواند روی دو لایه‌ی دیگر هم اثر
  بگذارد؛ مثلاً در اسلاید ۱۹ با `title.style.color = 'red'` رنگ متن را از داخل JavaScript عوض می‌کنیم.

  ### ۲) اشیاء (Objects) — اسلاید ۴

  **شیء (object)** مجموعه‌ای از داده‌ها و رفتارهای مرتبط است که کنار هم بسته‌بندی شده‌اند. شیء از
  **جفت‌های کلید–مقدار (key-value pairs)** ساخته می‌شود:

  - اگر مقدارِ یک کلید **داده** باشد، به آن **property** (ویژگی) می‌گوییم.
  - اگر مقدارِ یک کلید **تابع** باشد، به آن **method** (متد، یعنی تابعی که متعلق به شیء است) می‌گوییم.

  ```js
  const student = {
    name: "Ali",            // property (data)
    age: 20,                // property (data)
    greet() {               // method (function)
      return "Hi, I am " + this.name;
    },
  };

  console.log(student.name);    // "Ali"
  console.log(student.greet()); // "Hi, I am Ali"
  ```

  **JSON** (مخفف JavaScript Object Notation، یعنی «نشانه‌گذاری شیء JavaScript») یک قالب **متنی** رایج
  برای **ذخیره و به اشتراک گذاشتن** داده‌های شیء است؛ مثلاً برای فرستادن داده به سرور یا ذخیره در
  حافظه‌ی مرورگر. دو تابع اصلی آن:

  ```js
  const text = JSON.stringify(student); // object -> JSON string
  console.log(text);                    // {"name":"Ali","age":20}   (the method is gone!)

  const copy = JSON.parse('{"name":"Sara","age":21}'); // JSON string -> object
  console.log(copy.age + 1);            // 22   (age is a real number again)
  ```

  در JSON کلیدها حتماً داخل `"` هستند و **تابع‌ها ذخیره نمی‌شوند**؛ JSON فقط داده نگه می‌دارد، نه رفتار.

  #### «در JavaScript تقریباً همه‌چیز شیء است»

  در اسلاید ۴ میم معروف دو فضانورد آمده: اولی به زمینی که رویش لوگوی JavaScript است نگاه می‌کند و
  می‌گوید «Wait it's all OBJECTS» (صبر کن، همه‌اش شیء است؟) و دومی پشت سرش می‌گوید «Always has been»
  (همیشه همین بوده). زیر آن نوشته: «از نظر فنی، در JavaScript **تقریباً** همه‌چیز شیء است». آرایه‌ها،
  تابع‌ها، تاریخ‌ها و (همان‌طور که در این فصل می‌بینیم) **همه‌ی عنصرهای صفحه** شیء هستند:

  ```js
  console.log(typeof []);             // "object"
  console.log(typeof function () {}); // "function"  (functions are special objects)
  console.log(typeof null);           // "object"    (a famous historical bug!)
  ```

  پس چرا «تقریباً»؟ چون مقدارهای **primitive** (مقدار اولیه: `string`، `number`، `boolean`، `null`،
  `undefined`، `bigint` و `symbol`) شیء **نیستند**. با این حال می‌توانی روی یک رشته property بخوانی یا
  متد صدا بزنی:

  ```js
  console.log("abc".length);   // 3
  console.log((5).toFixed(1)); // "5.0"
  ```

  راز ماجرا **شیء پوششی (wrapper object)** است: وقتی روی یک primitive نقطه می‌گذاری، JavaScript برای یک
  لحظه یک شیء موقت (`String`، `Number` یا `Boolean`) دور آن می‌سازد، property یا متد را از آن می‌خواند و
  بلافاصله آن شیء موقت را دور می‌اندازد. به همین دلیل نمی‌توانی روی یک primitive چیزی ذخیره کنی:

  ```js
  const s = "abc";
  s.extra = 42;          // goes to a temporary wrapper (strict mode: TypeError)
  console.log(s.extra);  // undefined
  console.log(typeof s); // "string"  -> still a primitive
  ```

  ارتباط با این فصل: مرورگر هر تگ HTML را به یک **شیء** تبدیل می‌کند که property دارد (مثل `id` و
  `textContent`) و method دارد (مثل `addEventListener`). پس هرچه درباره‌ی اشیاء بلدی، اینجا به کارت
  می‌آید.

  ### ۳) کلمه‌ی کلیدی `this` (اسلاید ۵)

  قوانین اسلاید ۵ درباره‌ی `this`:

  1. `this` به شیئی اشاره می‌کند که تابع را **صدا زده** است.
  2. در متدِ یک شیء، `this` خودِ همان شیء است.
  3. در کلاس‌ها، `this` همان **نمونه‌ی (instance)** ساخته‌شده با `new` است.
  4. در arrow function، `this` از **scope (محدوده‌ی) بیرونی** به ارث می‌رسد؛ arrow function `this`
     مخصوص به خودش را ندارد.
  5. مقدار `this` به **نحوه‌ی صدا زدن** تابع بستگی دارد، نه به جایی که تابع تعریف شده است.

  | نحوه‌ی فراخوانی | مقدار `this` |
  |---|---|
  | `obj.method()` | `obj` (شیءِ قبل از نقطه) |
  | `new Person()` و متدهای کلاس | نمونه‌ی ساخته‌شده |
  | arrow function | همان `this` بیرونِ arrow function |
  | فراخوانی ساده‌ی `f()` | حالت عادی (sloppy): شیء سراسری (`window` در مرورگر، `globalThis` در Node.js)؛ حالت strict و بدنه‌ی کلاس‌ها: `undefined` |
  | listener با `function` معمولی | همان عنصری که listener روی آن ثبت شده است |

  ```js
  const obj = {
    name: "obj",
    regular() {
      return this.name;
    },
  };
  const other = { name: "other", regular: obj.regular }; // the same function!
  const f = obj.regular;                                 // detached from obj

  console.log(obj.regular());   // "obj"
  console.log(other.regular()); // "other"  -> depends on the caller
  console.log(f());             // Node.js: undefined | browser: "" (see the trap box)
  ```

  arrow functionی که مستقیماً به‌عنوان property در یک object literal نوشته شود، `this` را از **بیرونِ** آن
  شیء می‌گیرد؛ ولی arrow functionی که **داخل یک متد** نوشته شود، `this` همان متد را به ارث می‌برد که
  معمولاً همان چیزی است که می‌خواهیم:

  ```js
  const counter = {
    count: 10,
    regular() { return this.count; },
    arrow: () => this.count,   // `this` comes from OUTSIDE the object literal
  };
  console.log(counter.regular()); // 10
  console.log(counter.arrow());   // undefined

  class Timer {
    constructor(label) {
      this.label = label;            // `this` = the new instance
    }
    report() {
      const show = () => this.label; // arrow: inherits report's `this`
      return show();
    }
  }
  console.log(new Timer("T1").report()); // "T1"
  ```

  #### `this` در صفحه‌ی وب: داخل event listener

  در درس «رویدادها (Events) و addEventListener» می‌بینیم که با `addEventListener` به مرورگر می‌گوییم «هر وقت روی این عنصر کلیک شد، این
  تابع را اجرا کن». اینجا هم قانون «نحوه‌ی فراخوانی» برقرار است: مرورگر listener معمولی (`function`) را
  طوری صدا می‌زند که `this` همان **عنصری** باشد که listener روی آن ثبت شده (یعنی `event.currentTarget`).
  ولی arrow function `this` خودش را ندارد و `this` بیرونی را برمی‌دارد؛ در سطح بالای یک اسکریپت
  مرورگر، آن `this` همان `window` است.

  ```html
  <button id="a">First</button>
  <button id="b">Second</button>
  <script>
    document.getElementById("a").addEventListener("click", function (event) {
      console.log(this.id, this === event.currentTarget); // a true
    });
    document.getElementById("b").addEventListener("click", (event) => {
      console.log(this === window, event.currentTarget.id); // true b
    });
  </script>
  ```

  ::: tip
  اگر داخل listener به خودِ عنصر نیاز داری، مطمئن‌ترین راه `event.currentTarget` است؛ هم در `function`
  معمولی جواب می‌دهد و هم در arrow function.
  :::

  ::: trap دام تستی: `this.name` در مرورگر و Node.js
  در کد بالا `f()` (متدی که از شیء جدا شده) در **Node.js** مقدار `undefined` می‌دهد، ولی در **مرورگر**
  رشته‌ی خالی `""`! چون در فراخوانی ساده (حالت sloppy)، `this` همان `window` است و `window` از قبل یک
  property به نام `name` دارد که مقدار پیش‌فرضش `""` است. پس در تست‌ها همیشه دقت کن کد در کدام محیط
  اجرا می‌شود.
  :::

  ::: trap
  arrow functionی که مستقیماً به‌عنوان property در object literal نوشته شود، `this` را **شیء** نمی‌گیرد.
  برای متدهایی که به `this` نیاز دارند از نحو `method() { }` یا `function` استفاده کن.
  :::

  ### ۴) یادآوری JavaScript ناهمگام (اسلاید ۶)

  #### چرا async در وب این‌قدر مهم است؟

  JavaScript در مرورگر روی یک **thread اصلی** (رشته‌ی اجرای اصلی) اجرا می‌شود و همین thread کارهای دیگری
  مثل رسم صفحه و پاسخ به کلیک و تایپ کاربر را هم انجام می‌دهد. اگر یک کد همگام (synchronous) چند ثانیه
  منتظر بماند، در تمام این مدت صفحه **یخ می‌زند**: دکمه‌ها کار نمی‌کنند و حتی اسکرول هم گیر می‌کند. در وب
  سه نوع کارِ «منتظرماندنی» زیاد داریم:

  - **زمان‌سنج‌ها (timers)**: مثل `setTimeout` و `setInterval` (در درس «شیء window: پنجره‌ی مرورگر» می‌بینیم).
  - **رویدادهای کاربر**: معلوم نیست کاربر کی کلیک می‌کند؛ پس تابعی می‌دهیم که «هر وقت کلیک شد» اجرا شود.
  - **درخواست‌های شبکه**: گرفتن داده از سرور ممکن است از چند صدم ثانیه تا چند ثانیه طول بکشد.

  راه‌حل این است که کار زمان‌بر را شروع کنیم، تابعی برای «بعداً» ثبت کنیم و فوراً به کار خودمان ادامه
  دهیم تا صفحه پاسخ‌گو بماند. این همان هدف سوم جلسه است: «Understand async programming usages in web».

  #### سه سبک: callback، Promise و async/await

  **۱. Callback** (تابع برگشتی): تابعی را به تابع دیگر می‌دهیم تا **بعداً** اجرا شود. خطاها را باید
  **دستی** بررسی کنیم؛ معمولاً اولین پارامتر callback خطاست (`err`):

  ```js
  function loadData(ok, callback) {
    setTimeout(() => {
      if (ok) callback(null, "data");
      else callback(new Error("failed"));
    }, 10);
  }

  loadData(false, (err, data) => {
    if (err) {                                   // manual error handling
      console.log("callback error:", err.message);
      return;
    }
    console.log("callback data:", data);
  });
  // callback error: failed
  ```

  وقتی چند کار ناهمگام باید پشت سر هم انجام شوند، callbackها تو در تو می‌شوند و کد به شکل یک هرمِ کج
  درمی‌آید که خواندن و مدیریت خطایش سخت است. به این وضعیت **callback hell** («جهنم callbackها»)
  می‌گویند:

  ```js
  // Illustration only: getUser, getOrders and getDetails are imaginary functions.
  getUser(1, (err, user) => {
    getOrders(user, (err, orders) => {
      getDetails(orders[0], (err, details) => {
        console.log(details); // deeper and deeper...
      });
    });
  });
  ```

  **۲. Promise** (وعده): شیئی که نماینده‌ی یک **مقدار آینده** است و یکی از سه **حالت (state)** را دارد:
  `pending` (در انتظار)، `fulfilled` (انجام‌شده) یا `rejected` (ردشده). نتیجه را با `.then()` و خطا را با
  `.catch()` می‌گیریم؛ زنجیره‌ی `.then()`ها کد را از حالت تو در تو بیرون می‌آورد:

  ```js
  function fetchUser(ok) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        if (ok) resolve("user loaded");
        else reject(new Error("network down"));
      }, 30);
    });
  }

  fetchUser(true)
    .then((value) => console.log("then:", value))    // then: user loaded
    .catch((err) => console.log("catch:", err.message));
  ```

  **۳. async/await**: بر پایه‌ی همان Promiseهاست، ولی نحو (syntax) تمیزتری دارد و کد را **شبیه کد همگام**
  نشان می‌دهد. `await` فقط اجرای **همان تابع async** را تا آماده شدن نتیجه متوقف می‌کند، نه کل برنامه را.
  خطاها با `try...catch` گرفته می‌شوند:

  ```js
  async function main() {
    try {
      console.log(await fetchUser(true));  // user loaded
      console.log(await fetchUser(false)); // rejects -> jumps to catch
      console.log("after");                // never runs
    } catch (err) {
      console.log("caught:", err.message); // caught: network down
    }
  }
  main();
  ```

  | سبک | ایده | مدیریت خطا (اسلاید ۶) | ویژگی |
  |---|---|---|---|
  | Callback | تابعی را برای اجرا در آینده می‌دهیم | دستی (مثلاً بررسی `err`) | تو در تو شدن: callback hell |
  | Promise | نماینده‌ی یک مقدار آینده با چند حالت | `.catch()` | زنجیره با `.then()` / `.catch()` |
  | async/await | نحو ساده‌تر روی Promise | `try...catch` | ظاهر همگام و خوانایی بیشتر |

  #### ترتیب اجرا (یادآوری فصل اول)

  ابتدا همه‌ی کد همگام اجرا می‌شود، بعد **microtask**ها (کارهای کوچکِ فوری، مثل callback `.then` و ادامه‌ی
  تابع بعد از `await`) و بعد **macrotask**ها (مثل callback `setTimeout`، حتی با تأخیر `0`). جزئیات event
  loop در فصل اول آمده است:

  ```js
  async function load() {
    console.log("load start");
    const data = await Promise.resolve("data ready");
    console.log(data);
  }
  console.log("script start");
  setTimeout(() => console.log("timeout"), 0);
  load();
  console.log("script end");
  // script start -> load start -> script end -> data ready -> timeout
  ```

  راستی، listenerهای رویداد هم نوعی callback هستند: در `btn.addEventListener("click", handler)` تابع
  `handler` «بعداً»، یعنی هر وقت کاربر کلیک کرد، اجرا می‌شود.

  ::: tip
  بدنه‌ی تابع async تا رسیدن به اولین `await` **همگام** اجرا می‌شود؛ برای همین در مثال بالا `load start`
  قبل از `script end` چاپ شد.
  :::

  ::: trap
  - `setTimeout(fn, 0)` یعنی «حداقل بعد از ۰ میلی‌ثانیه، **هر وقت نوبتش شد**»، نه «همین الان». callbackهای
    Promise (microtask) همیشه زودتر از آن اجرا می‌شوند.
  - `JSON.stringify` متدها را حذف می‌کند، و `typeof null` برابر `"object"` است، با اینکه `null` شیء نیست.
  :::

  ::: summary
  - ساختار = HTML (محتوا چیست)، ظاهر = CSS (چه شکلی است)، رفتار = JavaScript (چه واکنشی نشان می‌دهد).
  - شیء = جفت‌های کلید–مقدار؛ داده = property و تابع = method؛ JSON قالب متنی برای ذخیره و تبادل داده است.
  - primitiveها شیء نیستند، ولی با wrapper object موقت property و متد دارند (`"abc".length`).
  - `this` به نحوه‌ی فراخوانی بستگی دارد؛ arrow function، `this` بیرونی را به ارث می‌برد؛ در listener
    معمولی، `this` همان عنصر است.
  - callback (خطای دستی)، Promise (`.catch()`)، async/await (`try...catch`)؛ ترتیب: همگام، microtask، macrotask.
  :::
