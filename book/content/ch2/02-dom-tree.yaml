      `G` و `H` هم پایین‌ترین گره‌ها و بدون فرزند هستند. گزینه‌ی ۱ فقط ردیف آخر را دیده و `C` و `D` را جا
      انداخته است. `E` و `F` هر کدام یک فرزند دارند (رد گزینه‌ی ۲)، و `A` ریشه است و `B` دو فرزند دارد (رد
      گزینه‌ی ۴).
