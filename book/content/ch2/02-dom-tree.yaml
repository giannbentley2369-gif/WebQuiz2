id: ch2-dom-tree
title: "زبان‌های نشانه‌گذاری و درخت DOM"
slides: "JS in HTML، اسلایدهای ۷ تا ۱۱"
lesson: |
  تا اینجا HTML را فقط به چشم «متنی پر از تگ» دیده‌ایم. اما مرورگر وقتی صفحه را باز می‌کند، این متن را
  به یک **درخت از اشیاء** تبدیل می‌کند که JavaScript می‌تواند آن را بخواند و تغییر دهد. این درخت همان
  **DOM** است و پایه‌ی کل این فصل.

  ### زبان نشانه‌گذاری (Markup language) چیست؟ (اسلاید ۷)

  **زبان نشانه‌گذاری (markup language)** زبانی است که با **تگ‌ها (tags)** یا نشانه‌ها، **ساختار** یک سند
  را توصیف می‌کند: کدام بخش عنوان است، کدام بخش پاراگراف است و چه چیزی داخل چه چیزی قرار دارد. اسلاید ۷
  سه نمونه نام می‌برد: HTML، XML و Markdown.

  ```html
  <!-- HTML: the structure of a web page -->
  <h1>Shop</h1>
  <p>Welcome to <b>our</b> shop!</p>
  ```

  ```xml title=XML
  <!-- XML: the structure of any data, with our own tag names -->
  <student>
    <name>Ali</name>
    <age>20</age>
  </student>
  ```

  ```text title=Markdown
  # Shop
  Welcome to **our** shop!
  ```

  (Markdown به‌جای تگ‌های `<...>` از نشانه‌هایی مثل `#` برای عنوان و `**` برای متن پررنگ استفاده می‌کند،
  ولی کارش همان است: توصیف ساختار.) زبان نشانه‌گذاری، زبان برنامه‌نویسی **نیست**؛ شرط، حلقه و محاسبه
  ندارد و فقط می‌گوید هر بخش «چیست». منطق و رفتار کار JavaScript است.

  #### سند، یک درخت سلسله‌مراتبی است

  چون تگ‌ها **تو در تو (nested)** نوشته می‌شوند، سند به شکل یک **درخت سلسله‌مراتبی (hierarchical tree)**
  درمی‌آید: هر تگی که داخل تگ دیگری باشد **فرزند (child)** آن است و تگ بیرونی **والد (parent)** آن. به
  گفته‌ی اسلاید ۷، رابطه‌ی والد و فرزند نشان می‌دهد محتوا چطور تو در تو شده است، و همین مدل درختی
  **پایه‌ی DOM** است.

  ::: analogy
  شجره‌نامه‌ی یک خانواده یا ساختار پوشه‌های کامپیوترت را در نظر بگیر: داخل پوشه‌ی `Documents` پوشه‌ی
  `University` است و داخل آن چند فایل. هر پوشه (به‌جز پوشه‌ی ریشه) دقیقاً یک والد دارد و ممکن است چند
  فرزند داشته باشد. درخت یک سند HTML هم دقیقاً همین‌طور است.
  :::

  نمودار اسلاید ۷ یک درخت عمومی است (A به B و C و D فلش دارد، B به E و F، و E و F هر کدام یک فرزند دارند):

  ```text
          A
       /  |  \
      B   C   D
     / \
    E   F
    |   |
    G   H
  ```

  | واژه | معنی | در نمودار بالا |
  |---|---|---|
  | ریشه (root) | تنها گره‌ای که والد ندارد | `A` |
  | والد (parent) | گره‌ی بلافاصله بالای یک گره | والدِ `E` گره‌ی `B` است |
  | فرزند (child) | گره‌ی بلافاصله پایین یک گره | فرزندان `A`: `B`، `C` و `D` |
  | هم‌نیا (sibling) | گره‌هایی که والد مشترک دارند | `B`، `C` و `D`؛ همچنین `E` و `F` |
  | جد (ancestor) | والد، والدِ والد و ... تا ریشه | اجداد `G`: `E`، `B` و `A` |
  | نواده (descendant) | فرزند، فرزندِ فرزند و ... | نوادگان `B`: `E`، `F`، `G` و `H` |
  | برگ (leaf) | گره‌ای که هیچ فرزندی ندارد | `C`، `D`، `G` و `H` |

  ### از نشانه‌گذاری تا DOM (اسلاید ۸)

  مرورگر متن HTML را **parse** می‌کند (یعنی می‌خواند و تجزیه می‌کند) و از آن یک **درخت از گره‌ها
  (nodes)** می‌سازد. قوانین اسلاید ۸:

  - هر **تگ** به یک **گره‌ی عنصر (element node)** در درخت تبدیل می‌شود.
  - **متنِ داخل تگ‌ها** به **گره‌ی متنی (text node)** تبدیل می‌شود.
  - **attributeها** (ویژگی‌های داخل تگ، مثل `href` و `id`) به **propertyهای گره** تبدیل می‌شوند؛ یعنی به
    خودِ عنصر چسبیده‌اند و **فرزند آن نیستند**.
  - همین درخت DOM است که JavaScript می‌تواند به آن دسترسی پیدا کند و تغییرش دهد.

  برای HTML زیر:

  ```html
  <html>
    <head>
      <title>My title</title>
    </head>
    <body>
      <a href="#">My link</a>
      <h1>My header</h1>
    </body>
  </html>
  ```

  نمودار W3Schools در اسلاید ۸ این درخت را نشان می‌دهد (اینجا به شکل متنی بازکشیده شده است):

  ```text
  Document
  `-- Root element: <html>
      |-- Element: <head>
      |   `-- Element: <title>
      |       `-- Text: "My title"
      `-- Element: <body>
          |-- Element: <a>   ---- Attribute: "href"
          |   `-- Text: "My link"
          `-- Element: <h1>
              `-- Text: "My header"
  ```

  دقت کن که در نمودار، جعبه‌ی `Attribute: "href"` **کنار** `<a>` و با یک خط افقی به آن وصل شده، نه زیر
  آن؛ چون attribute فرزند نیست، ویژگیِ خودِ عنصر است. جمله‌ی کنار نمودار هم همین را می‌گوید: «ببین درخت DOM
  عنصرها را چطور مرتب می‌کند».

  ### DOM چیست؟ (اسلاید ۹)

  **DOM** مخفف **Document Object Model** (مدل شیءِ سند) است. هر کلمه‌اش معنایی دارد:

  - **Document**: سند، یعنی همان صفحه‌ی وب.
  - **Object**: هر بخش صفحه (هر عنصر، متن و ...) به یک **شیء** JavaScript تبدیل می‌شود که property و method
    دارد.
  - **Model**: این اشیاء با هم یک **مدل** (نمایش ساختاریافته) از صفحه می‌سازند که شکلش درخت است.

  طبق اسلاید ۹، DOM:

  - یک **نمایش درختی (tree-based representation)** از صفحه‌ی وب است؛
  - **ساختار HTML را به JavaScript وصل می‌کند**؛
  - به برنامه‌ها اجازه می‌دهد عنصرها را **بخوانند، تغییر دهند، اضافه یا حذف کنند**؛
  - مثل یک **پل** بین محتوا و تعامل‌پذیری (interactivity) عمل می‌کند.

  نمودار Milne Publishing در اسلاید ۹ همان ایده را با رنگ‌بندی نشان می‌دهد. این بار `<h1>` قبل از `<a>`
  آمده و ریشه با حروف کوچک `document` نوشته شده، درست مثل نام شیء در JavaScript:

  ```text
  document
  `-- Root element: <html>
      |-- Element: <head>
      |   `-- Element: <title>
      |       `-- Text: "My title"
      `-- Element: <body>
          |-- Element: <h1>
          |   `-- Text: "A heading"
          `-- Element: <a>   ---- Attribute: href
              `-- Text: "Link text"
  ```

  ::: note DOM همان فایل HTML نیست
  فایل `.html` فقط **دستور ساخت** است. مرورگر از روی آن، درخت DOM را **در حافظه** می‌سازد. وقتی JavaScript
  عنصری را تغییر می‌دهد، فقط DOM (همان درختِ داخل حافظه) عوض می‌شود و فایل روی دیسک یا سرور دست نمی‌خورد؛
  با refresh صفحه همه‌چیز از روی فایل اصلی دوباره ساخته می‌شود. در DevTools، زبانه‌ی Elements (یا
  Inspector) همین DOM زنده را نشان می‌دهد.
  :::

  ### فعالیت کلاسی اسلاید ۱۰: درخت DOM این HTML را رسم کن

  کد اسلاید ۱۰ (فایل `sample.html`) دقیقاً این است:

  ```html lines
  <html>
      <head>
          <title>sample page here :)</sample>
          <link rel="stylesheet" href="./style.css">
      </head>
      <body>
          <h1>SAMPLE PAGE!</h1>
          <div class="sampleclass">
              <p>sample paragraph in sample class in sample page!</p>
              <h3 id="2223">wait wha-?</h3>
          </div>
      </body>
  </html>
  ```

  **پاسخ مورد انتظار** (با فرض اینکه خط ۳ با `</title>` بسته شده باشد؛ گره‌های متنیِ فقط‌فاصله را نشان
  نداده‌ایم و attributeها داخل `{ }` کنار عنصرشان آمده‌اند، چون فرزند نیستند):

  ```text
  #document
  `-- html
      |-- head
      |   |-- title
      |   |   `-- #text "sample page here :)"
      |   `-- link   {rel="stylesheet", href="./style.css"}
      `-- body
          |-- h1
          |   `-- #text "SAMPLE PAGE!"
          `-- div   {class="sampleclass"}
              |-- p
              |   `-- #text "sample paragraph in sample class in sample page!"
              `-- h3   {id="2223"}
                  `-- #text "wait wha-?"
  ```

  چند نکته درباره‌ی این درخت:

  - `head` و `body` هم‌نیا هستند و هر دو فرزند `html`اند؛ `p` و `h3` هم‌نیا و فرزند `div`اند؛ `div` والد
    `p` و جدِ متن `"wait wha-?"` است.
  - `link` فرزندی ندارد (تگ خالی است) و `rel` و `href` ویژگی‌های آن هستند.
  - در درخت واقعی، بین تگ‌ها گره‌های متنی‌ای هم هست که فقط شامل «خط جدید و فاصله» (whitespace) است. مثلاً
    `head` در واقع ۵ گره‌ی فرزند دارد: فاصله، `title`، فاصله، `link`، فاصله.

  ::: warning دامِ تایپیِ اسلاید: `</sample>` به‌جای `</title>`
  روی اسلاید، `<title>` با `</sample>` بسته شده که تگی بی‌معنی است. تگ `<title>` در HTML حالت خاصی دارد:
  parser همه‌ی محتوای آن را تا رسیدن به یک `</title>` واقعی **متن خام** حساب می‌کند و تگ‌های داخلش را
  تشخیص نمی‌دهد. چون در این فایل هیچ `</title>`ی وجود ندارد، **کل باقی فایل** (از `</sample>` تا `</html>`)
  به متن عنوان تبدیل می‌شود و `<body>` **خالی** می‌ماند: صفحه سفید دیده می‌شود و یک عنوان خیلی طولانی در
  زبانه‌ی مرورگر می‌نشیند. نکته‌ی مهم‌تر: **parser هیچ‌وقت به‌خاطر HTML نادرست خطا (exception) نمی‌دهد**؛
  همیشه سعی می‌کند سند را «تعمیر» کند، حتی اگر نتیجه آن چیزی نباشد که انتظار داشتی.
  :::

  دو نکته‌ی دیگر درباره‌ی این فایل: اول اینکه `<!DOCTYPE html>` ندارد، پس مرورگر صفحه را در «حالت
  سازگاری» (quirks mode) نشان می‌دهد؛ همیشه سند را با `<!DOCTYPE html>` شروع کن. دوم اینکه id عنصر `h3`
  با رقم شروع شده (`2223`)؛ در درس «پیدا کردن عناصر» می‌بینیم این موضوع برای `querySelector` دردسر می‌سازد.

  ### ساختار DOM (اسلاید ۱۱)

  خلاصه‌ی اسلاید ۱۱:

  - **ریشه‌ی درخت (root node)، `document` است.**
  - **عنصرها (elements)**: همان تگ‌ها، مثل `<div>` و `<p>`.
  - **attributeها**: propertyهای عنصر، مثل `id` و `class`.
  - **متن**: گره‌های متنی (text nodes).
  - همه در یک درخت سلسله‌مراتبی به هم وصل‌اند.

  دقت کن: `document` **گره‌ی ریشه** است، ولی **عنصر ریشه (root element)** تگ `<html>` است که فرزند
  `document` است و در JavaScript با `document.documentElement` به آن می‌رسیم.

  #### سلسله‌مراتب کلاس‌ها (نمودار StackOverflow در اسلاید ۱۱)

  هر گره در DOM نمونه‌ای از یک **کلاس** است و این کلاس‌ها از هم ارث می‌برند. نمودار اسلاید ۱۱ (از چپ به
  راست کشیده شده) را اینجا از بالا به پایین می‌بینی؛ `EventTarget` در نمودار اسلاید نیست ولی بالای همه قرار
  دارد:

  ```text
  EventTarget                  (not on the slide: the top of every chain)
  `-- Node
      |-- Document
      |   `-- HTMLDocument
      |-- CharacterData
      |   |-- Text
      |   `-- Comment
      |-- Element
      |   `-- HTMLElement
      |       |-- HTMLHeadElement
      |       |-- HTMLBodyElement
      |       |-- HTMLTitleElement
      |       |-- HTMLParagraphElement
      |       |-- HTMLInputElement
      |       |-- HTMLTableElement
      |       `-- ... etc.  (many more element types)
      `-- Attr
  ```

  رابطه‌ی ارث‌بری یعنی رابطه‌ی «**هست یک**»: یک `<p>` یک `HTMLParagraphElement` است، پس یک `HTMLElement`،
  یک `Element`، یک `Node` (و یک `EventTarget`) هم هست و همه‌ی propertyها و متدهای آن‌ها را دارد: از
  `Node` چیزهایی مثل `parentNode` و `childNodes`، از `Element` چیزهایی مثل `id` و `children`، از
  `HTMLElement` چیزهایی مثل `style`، و از `EventTarget` متد `addEventListener`. به همین دلیل روی هر گره‌ای
  می‌توان listener گذاشت.

  ```html
  <p id="p">Hi<!-- note --></p>
  <script>
    const p = document.getElementById("p");
    console.log(p instanceof HTMLParagraphElement, p instanceof Element, p instanceof Node); // true true true
    console.log(p.firstChild instanceof Text, p.firstChild instanceof CharacterData);       // true true
    console.log(p.firstChild instanceof Element);                                           // false
    console.log(p.lastChild instanceof Comment, document instanceof HTMLDocument);          // true true
  </script>
  ```

  - `Text` و `Comment` (گره‌ی توضیح `<!-- ... -->`) هر دو زیرکلاس `CharacterData` هستند، **نه** `Element`.
  - `Attr` (کلاس attributeها) مستقیماً از `Node` ارث می‌برد، ولی در `childNodes` هیچ عنصری ظاهر نمی‌شود.
  - `document` نمونه‌ای از `HTMLDocument` است که از `Document` و آن هم از `Node` ارث می‌برد.

  ### پیمایش درخت با JavaScript (پیش‌زمینه‌ی لازم)

  هر گره دو property شناسایی دارد: `nodeType` (یک عدد) و `nodeName` (یک رشته):

  | گره | `nodeType` | `nodeName` |
  |---|---|---|
  | عنصر (مثلاً `<p>`) | `1` | نام تگ با حروف بزرگ، مثلاً `"P"` |
  | attribute | `2` | نام attribute، مثلاً `"href"` |
  | متن | `3` | `"#text"` |
  | comment | `8` | `"#comment"` |
  | `document` | `9` | `"#document"` |

  برای حرکت در درخت این propertyها را داریم:

  | property | چه برمی‌گرداند | گره‌های متنی و comment را هم حساب می‌کند؟ |
  |---|---|---|
  | `parentNode` | گره‌ی والد | — |
  | `childNodes` | **همه‌ی** گره‌های فرزند | بله |
  | `children` | فقط **عنصرهای** فرزند | خیر |
  | `firstChild` / `lastChild` | اولین / آخرین گره‌ی فرزند | بله |
  | `firstElementChild` / `lastElementChild` | اولین / آخرین عنصر فرزند | خیر |
  | `nextSibling` / `previousSibling` | گره‌ی هم‌نیای بعدی / قبلی | بله |
  | `nextElementSibling` / `previousElementSibling` | عنصر هم‌نیای بعدی / قبلی | خیر |

  مهم‌ترین دام اینجاست: **خط جدید و فاصله‌هایی که برای مرتب نوشتن HTML می‌گذاریم، گره‌ی متنی می‌سازند.**

  ```html
  <ul id="list">
    <li>A</li>
    <li>B</li>
  </ul>
  <script>
    const ul = document.getElementById("list");
    console.log(ul.childNodes.length, ul.children.length);              // 5 2
    console.log(ul.firstChild.nodeName, ul.firstElementChild.nodeName); // #text LI
    console.log(ul.parentNode.nodeName);                                // BODY
    console.log(ul.children[1].previousElementSibling.textContent);     // A
  </script>
  ```

  چرا ۵؟ چون فرزندان `ul` این‌ها هستند: متنِ فاصله، `li`، متنِ فاصله، `li`، متنِ فاصله. اگر همین لیست را
  در یک خط و بدون فاصله بنویسیم (`<ul><li>A</li><li>B</li></ul>`)، `childNodes.length` هم `2` می‌شود.

  ::: tip
  اگر فقط با تگ‌ها کار داری، از نسخه‌های «Element» استفاده کن: `children`، `firstElementChild`،
  `nextElementSibling`. نسخه‌های بدون Element (`childNodes`، `firstChild`، `nextSibling`) گره‌های متنی،
  حتی فاصله‌ها، و commentها را هم می‌شمارند.
  :::

  ::: trap
  - attributeها فرزند نیستند: برای `<a href="#">Link</a>` مقدار `a.childNodes.length` برابر `1` است (فقط
    گره‌ی متنی)، نه `2`.
  - گره‌ی ریشه `document` است ولی عنصر ریشه `<html>` (`document.documentElement`)؛ `document` خودش عنصر
    نیست (`nodeType` آن `9` است، نه `1`).
  - `nodeName` عنصرها با حروف بزرگ است (`"LI"`)، و `nodeName` گره‌ی متنی `"#text"` است، نه `"text"`.
  - `Text` زیرکلاس `CharacterData` است، نه `Element`؛ پس `instanceof Element` برای گره‌ی متنی `false` است.
  :::

  ::: summary
  - زبان نشانه‌گذاری (HTML، XML، Markdown) ساختار را با تگ یا نشانه توصیف می‌کند؛ سند یک درخت است.
  - تگ ← گره‌ی عنصر، متن ← گره‌ی متنی، attribute ← property عنصر (فرزند نیست).
  - DOM = Document Object Model: نمایش درختیِ صفحه در حافظه، پل بین HTML و JavaScript.
  - ریشه `document` است؛ کلاس‌ها: Node ← Document/CharacterData/Element/Attr و Element ← HTMLElement ← HTMLParagraphElement و ...
  - `children` فقط عنصرها، `childNodes` همه‌ی گره‌ها (از جمله فاصله‌ها).
  :::
questions:
  - level: easy
    stem: کدام گزینه یک زبان نشانه‌گذاری (markup language) نیست؟
    options:
      - 'HTML'
      - 'XML'
      - 'Markdown'
      - 'JavaScript'
    answer: 4
    explain: |
      اسلاید ۷ HTML، XML و Markdown را نمونه‌های زبان نشانه‌گذاری می‌آورد؛ این زبان‌ها فقط ساختار سند را با تگ
      یا نشانه توصیف می‌کنند. JavaScript یک زبان **برنامه‌نویسی** است که شرط، حلقه و منطق دارد و لایه‌ی رفتار
      صفحه را می‌سازد. Markdown با اینکه به‌جای `<...>` از نشانه‌هایی مثل `#` استفاده می‌کند، باز هم زبان
      نشانه‌گذاری است.
  - level: easy
    stem: DOM مخفف چیست؟
    options:
