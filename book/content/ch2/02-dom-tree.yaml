    answer: 2
    explain: |
      طبق اسلاید ۹، DOM مخفف **Document Object Model** است: «Document» یعنی صفحه‌ی وب، «Object» یعنی هر بخش
      صفحه به یک شیء تبدیل می‌شود و «Model» یعنی این اشیاء با هم یک مدل درختی از صفحه می‌سازند. بقیه‌ی
      گزینه‌ها ساختگی‌اند؛ DOM نه درباره‌ی «Data» است، نه یک زبان نشانه‌گذاری (Markup) و نه یک «Method».
