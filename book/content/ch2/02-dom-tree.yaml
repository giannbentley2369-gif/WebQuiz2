    stem: |
      در نمودار W3Schools (اسلاید ۸)، والدِ گره‌ی متنی `"My title"` کدام است؟
    options:
      - 'عنصر `<title>`'
      - 'عنصر `<head>`'
      - 'عنصر `<html>`'
      - '`Document`'
    answer: 1
    explain: |
      متن داخل هر تگ، گره‌ی متنیِ **فرزندِ همان تگ** می‌شود؛ پس والد `"My title"` عنصر `<title>` است. `<head>`
      والدِ `<title>` و در نتیجه **جدِ** این متن است، نه والدش (رد گزینه‌ی ۲). `<html>` و `Document` هم اجداد
      بالاتر هستند.
  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <div id="box"><!-- note --><span>A</span>text</div>
    code: |
      const box = document.getElementById("box");
      console.log(box.childNodes.length, box.children.length, box.firstChild.nodeType);
    options:
      - out: "2 1 8"
      - out: "3 1 3"
      - out: "3 1 8"
      - out: "1 1 1"
    answer: 3
    explain: |
      comment (`<!-- note -->`) هم یک گره در DOM است (از نوع `Comment` با `nodeType` برابر `8`). پس فرزندان
      `div` سه گره‌اند: comment، عنصر `span` و گره‌ی متنی `"text"`؛ یعنی `childNodes.length` برابر `3` و
      `children.length` برابر `1`. اولین فرزند همان comment است با `nodeType` برابر `8`. گزینه‌ی ۱ comment را
      گره ندانسته ولی نوعش را درست گفته، گزینه‌ی ۲ comment را متن (`3`) فرض کرده، و گزینه‌ی ۴ فقط عنصرها را
      دیده است.
  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <h1 id="head">A heading</h1><a id="link" href="#">Link text</a>
    code: |
      const h1 = document.getElementById("head");
      const a = document.getElementById("link");
      console.log(a.parentNode.tagName, a.previousElementSibling.id, h1.nextElementSibling.getAttribute("href"));
    options:
      - out: "BODY head #"
      - out: "H1 head #"
      - out: "BODY link #"
      - out: "BODY head null"
    answer: 1
    explain: |
      این همان درخت نمودار Milne در اسلاید ۹ است: `<h1>` و `<a>` هم‌نیا هستند و والد هر دو `body` است (رد
      گزینه‌ی ۲ که فکر کرده `<a>` فرزند `<h1>` است). عنصر هم‌نیای قبلی `<a>` همان `h1` با id برابر `head` است
      (رد گزینه‌ی ۳)، و عنصر هم‌نیای بعدی `h1` همان `<a>` است که `href` آن `"#"` است، نه `null` (رد گزینه‌ی ۴).
