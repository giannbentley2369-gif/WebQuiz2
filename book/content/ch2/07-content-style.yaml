id: ch2-content-style
title: "تغییر متن، HTML و استایل عناصر"
slides: "JS in HTML، اسلایدهای ۱۹ تا ۲۲"
lesson: |
  حالا که می‌توانیم عنصرها را پیدا کنیم و به رویدادها واکنش نشان دهیم، وقت آن است که **صفحه را تغییر دهیم**.
  اسلاید ۲۲ (Manipulating The DOM، یعنی دستکاری DOM) این توانایی‌ها را خلاصه می‌کند:

  - DOM صفحه را به شکل **درختی از اشیاء** نمایش می‌دهد.
  - JavaScript می‌تواند **متن، HTML و استایل** را به‌صورت پویا (dynamic، یعنی هنگام اجرا و بدون reload صفحه)
    تغییر دهد. (موضوع همین درس)
  - می‌توان عنصرها را در لحظه **ساخت، درج و حذف** کرد. (درس‌های «ساختن و افزودن عناصر جدید» و «حذف و جایگزینی عناصر»)
  - attributeهایی مثل `id`، `class` و `src` را به‌راحتی می‌توان تغییر داد. (اینجا مختصر، و کامل در درس
    «ویژگی‌ها (Attributes) و کلاس‌ها»)
  - متدهایی مثل `getElementById` و `querySelector` به پیدا کردن عنصرها کمک می‌کنند. (درس «پیدا کردن عناصر»)
  - دستکاری DOM همان چیزی است که صفحه‌های وب را **تعاملی و پویا** می‌کند.

  ### تغییر متن و HTML: `textContent`، `innerText` و `innerHTML`

  | property | هنگام خواندن | هنگام نوشتن |
  |---|---|---|
  | `textContent` | همه‌ی متن عنصر و نوادگانش، بدون تگ‌ها (حتی متن‌های مخفی) | متن ساده؛ تگ‌ها **تفسیر نمی‌شوند** و عیناً به‌صورت متن نمایش داده می‌شوند |
  | `innerText` | متنی که **واقعاً روی صفحه دیده می‌شود** (به CSS بستگی دارد و متن مخفی را حساب نمی‌کند) | متن ساده، مثل `textContent` |
  | `innerHTML` | کد HTML **داخل** عنصر، به‌صورت رشته | رشته به‌عنوان HTML **تفسیر (parse)** می‌شود و عنصرهای واقعی ساخته می‌شوند |
  | `outerHTML` | کد HTML **خودِ عنصر** همراه با تگ خودش | (در این درس فقط برای خواندن و دیدن نتیجه از آن استفاده می‌کنیم) |

  خواندن:

  ```html
  <p id="p">Hello <b>big</b> world</p>
  <script>
    const p = document.getElementById("p");
    console.log(p.textContent); // "Hello big world"
    console.log(p.innerHTML);   // "Hello <b>big</b> world"
    console.log(p.outerHTML);   // "<p id="p">Hello <b>big</b> world</p>"
  </script>
  ```

  نوشتن:

  ```html
  <div id="a"></div>
  <div id="b"></div>
  <script>
    document.getElementById("a").innerHTML = "<b>Hi</b> there";   // a bold "Hi", then " there"
    document.getElementById("b").textContent = "<b>Hi</b> there"; // the tags are shown as text
    console.log(document.getElementById("a").children.length);     // 1  (a real <b> element)
    console.log(document.getElementById("b").children.length);     // 0  (just text)
    console.log(document.getElementById("b").innerHTML);           // "&lt;b&gt;Hi&lt;/b&gt; there"
  </script>
  ```

  در `div` دوم، کاربر دقیقاً نوشته‌ی `<b>Hi</b> there` را روی صفحه می‌بیند؛ مرورگر برای اینکه این علامت‌ها تگ
  حساب نشوند، آن‌ها را در کد HTML به شکل `&lt;` و `&gt;` نگه می‌دارد.

  **نوشتن، همه‌چیز را جایگزین می‌کند.** هر سه property هنگام نوشتن، کل محتوای قبلی عنصر (از جمله عنصرهای
  فرزند) را پاک می‌کنند: اگر `card` یک `<h2>` و یک `<p>` داشته باشد، بعد از `card.textContent = "Empty"`
  فقط یک گره‌ی متنی در آن می‌ماند. هر مقداری هم که بدهی به رشته تبدیل می‌شود: `s.textContent = 5 + 5` متن
  `"10"` را می‌نویسد.

  #### `innerText` چه فرقی با `textContent` دارد؟

  ```html
  <p id="p">Hi<span style="display: none"> secret</span></p>
  <script>
    const p = document.getElementById("p");
    console.log(p.textContent); // "Hi secret"  (hidden text is included)
    console.log(p.innerText);   // "Hi"         (only what is visible on the page)
  </script>
  ```

  `innerText` به چیدمان و CSS صفحه وابسته است (برای همین کمی کندتر است)، ولی `textContent` فقط درخت DOM را
  می‌خواند. برای **نوشتن** یک متن ساده (مثل `div.innerText = "Hello DOM!"` در مثال اسلاید ۲۴) هر دو تقریباً
  یکسان کار می‌کنند.

  ### دام `innerHTML +=` (پیش‌زمینه)

  `a += b` یعنی `a = a + b`. پس `box.innerHTML += "<p>New</p>"` اول کل HTML داخل `box` را به رشته تبدیل
  می‌کند، رشته‌ی جدید را به آن می‌چسباند و بعد **همه‌چیز را از نو parse می‌کند**. نتیجه: عنصرهای قبلی نابود
  و نسخه‌های تازه‌ای جایشان ساخته می‌شوند؛ listenerهای آن‌ها و متغیرهایی که به آن‌ها اشاره می‌کردند از دست
  می‌روند (متنی هم که کاربر در کادرها تایپ کرده بود پاک می‌شود).

  ```html
  <div id="box"><button id="btn">Click</button></div>
  <script>
    const btn = document.getElementById("btn");
    btn.addEventListener("click", () => console.log("clicked"));
    document.getElementById("box").innerHTML += "<p>New</p>";
    console.log(document.getElementById("btn") === btn); // false: a brand-new button
    // clicking the button now prints nothing: the new button has no listener
  </script>
  ```

  راه بهتر برای اضافه کردن: ساختن عنصر با `createElement` و اضافه کردنش با `append` (درس «ساختن و افزودن عناصر جدید»)، یا
  `insertAdjacentHTML("beforeend", "<p>New</p>")` که چیزهای قبلی را دست نمی‌زند.

  ### امنیت: `innerHTML` و حمله‌ی XSS

  اگر رشته‌ای که به `innerHTML` می‌دهی از **کاربر** آمده باشد (از یک کادر ورودی یا از آدرس صفحه)، مهاجم
  می‌تواند به‌جای متن، کد HTML و JavaScript بفرستد تا در صفحه‌ی کاربران دیگر اجرا شود. به این حمله **XSS**
  (Cross-Site Scripting، یعنی اجرای اسکریپت مهاجم در صفحه‌ی سایت دیگر) می‌گویند. تگ `<script>`ی که با
  `innerHTML` درج شود اجرا نمی‌شود، ولی ترفندهای دیگر کار می‌کنند؛ مثلاً یک `<img>` با آدرس خراب که کد
  `onerror` آن هنگام شکست بارگذاری تصویر اجرا می‌شود:

  ```js
  const comment = '<img src="x" onerror="alert(\'hacked\')">'; // typed by an attacker
  box.innerHTML = comment;   // DANGEROUS: in a real browser the onerror code runs
  box.textContent = comment; // safe: shown as plain text
  ```

  قانون ساده: **متنی که از کاربر می‌آید را با `textContent` در صفحه بگذار**، نه با `innerHTML`.

  ### تغییر استایل: `element.style`

  در مثال اسلاید ۱۹ دیدیم `title.style.color = 'red'` رنگ عنوان را قرمز می‌کند. قواعد:

  - `element.style.property = "value"` یک **استایل inline** می‌سازد، یعنی attribute `style` خودِ عنصر را
    تغییر می‌دهد.
  - نام propertyهای CSS که خط تیره دارند، در JavaScript **camelCase** می‌شوند: `background-color` می‌شود
    `backgroundColor` و `font-size` می‌شود `fontSize`. (راه دیگر: `el.style["background-color"]`.)
  - مقدارها **رشته** هستند و برای اندازه‌ها **واحد** لازم است: `"20px"`، `"1.5rem"`. مقدار نامعتبر (مثلاً
    عدد `20` بدون واحد برای `fontSize`) بی‌صدا نادیده گرفته می‌شود.
  - `el.style.color = ""` آن استایل inline را حذف می‌کند.
  - خواندن `el.style.color` **فقط استایل inline** را می‌بیند، نه قاعده‌هایی که در `<style>` یا فایل CSS
    نوشته شده‌اند. برای دیدن استایل نهایی که واقعاً اعمال شده، از `getComputedStyle(el)` استفاده کن.

  ```html
  <style>
    #p { color: green; }
  </style>
  <p id="p">Hi</p>
  <script>
    const p = document.getElementById("p");
    console.log(p.style.color);             // ""  (the CSS rule is not inline)
    console.log(getComputedStyle(p).color); // "rgb(0, 128, 0)"
    p.style.backgroundColor = "yellow";
    p.style.fontSize = "20px";
    console.log(p.getAttribute("style"));   // "background-color: yellow; font-size: 20px;"
  </script>
  ```

  دقت کن که `p.style.background-color = "red"` (با خط تیره) از نظر JavaScript یعنی `p.style.background`
  منهای `color`، که سمت چپ انتساب نمی‌تواند باشد؛ این یک **خطای نحوی (SyntaxError)** است و چون خطاهای نحوی
  پیش از اجرا پیدا می‌شوند، **هیچ خطی از آن اسکریپت** اجرا نمی‌شود. برای تغییرهای زیاد در ظاهر، بهتر است یک
  کلاس CSS را اضافه یا حذف کنی (با `classList`، در درس «ویژگی‌ها (Attributes) و کلاس‌ها»).

  ### `className` و تغییر `id`، `class` و `src` (اسلاید ۲۲)

  - `el.className` کل attribute `class` را به‌صورت یک رشته برمی‌گرداند، مثلاً `"note big"`. مقداردهی به
    آن **همه‌ی** کلاس‌های قبلی را جایگزین می‌کند و برای اضافه کردن باید با یک فاصله چسباند:
    `el.className += " bold"`. چون `class` در JavaScript کلمه‌ی رزروشده است (برای تعریف کلاس)، نام این
    property در DOM `className` انتخاب شده است.
  - `el.id = "..."` و `img.src = "..."` هم attributeها را مستقیماً عوض می‌کنند.

  ```html
  <img id="pic" src="a.png" class="thumb">
  <script>
    const pic = document.getElementById("pic");
    pic.id = "photo";
    pic.className = "big";
    pic.src = "b.png";
    console.log(pic.outerHTML);                          // <img id="photo" src="b.png" class="big">
    console.log(document.getElementById("pic") === null); // true: the old id is gone
  </script>
  ```

  ### مثال Button Action، از نگاه این درس

  دو خطِ داخل listener در اسلاید ۱۹ دقیقاً همین ابزارها هستند:

  ```js
  const title = document.querySelector('#title');
  title.textContent = 'Goodbye World'; // change the text
  title.style.color = 'red';           // change the style (inline)
  ```

  بعد از کلیک، عنوان در DOM به این شکل درمی‌آید و مرورگر آن را فوراً با متن جدید و به رنگ قرمز نشان می‌دهد
  (اسلاید ۲۱):

  ```html
  <h1 id="title" style="color: red;">Goodbye World</h1>
  ```

  ::: tip
  - برای گذاشتن **متن** (به‌خصوص متنی که از کاربر آمده) از `textContent` استفاده کن؛ `innerHTML` را فقط وقتی
    به کار ببر که واقعاً می‌خواهی HTML مطمئنی را درج کنی.
  - برای خواندن استایل نهایی یک عنصر، `getComputedStyle(el)` و برای نوشتن استایل، `el.style.prop` (camelCase،
    مقدار رشته‌ای با واحد).
  :::

  ::: trap
  - `textContent = "<b>Hi</b>"` تگ‌ها را **متن** می‌کند، ولی `innerHTML = "<b>Hi</b>"` یک عنصر `<b>` واقعی
    می‌سازد.
  - `innerHTML +=` کل محتوا را از نو می‌سازد: listenerها و ارجاع‌های قبلی از بین می‌روند.
  - `el.style.color` رنگی را که در فایل CSS تعیین شده نشان نمی‌دهد و `""` برمی‌گرداند.
  - `el.style.fontSize = 20` (بدون واحد) نادیده گرفته می‌شود؛ `"20px"` درست است.
  - `el.style.background-color = ...` خطای نحوی است؛ `backgroundColor` درست است.
  - `className = "x"` همه‌ی کلاس‌های قبلی را پاک می‌کند.
  :::

  ::: summary
  - `textContent` (متن خام، شامل متن مخفی)، `innerText` (متن قابل دیدن)، `innerHTML` (HTML تفسیرشده).
  - نوشتن در این propertyها کل محتوای قبلی را جایگزین می‌کند؛ `innerHTML +=` همه‌چیز را از نو می‌سازد.
  - ورودی کاربر را با `innerHTML` درج نکن (خطر XSS)؛ از `textContent` استفاده کن.
  - `el.style.camelCase = "value"` استایل inline می‌سازد؛ خواندن استایل نهایی با `getComputedStyle`.
  - `className` رشته‌ی کلاس‌هاست و مقداردهی‌اش همه را جایگزین می‌کند؛ `id` و `src` هم مستقیم قابل تغییرند.
  :::
questions:
  - level: easy
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <div id="a"></div>
      <div id="b"></div>
    code: |
      const a = document.getElementById("a");
      const b = document.getElementById("b");
      a.innerHTML = "<b>Hi</b> there";
      b.textContent = "<b>Hi</b> there";
      console.log(a.children.length, b.children.length);
    options:
      - out: "1 1"
      - out: "0 0"
      - out: "1 0"
      - out: "0 1"
    answer: 3
    explain: |
      `innerHTML` رشته را به‌عنوان HTML تفسیر می‌کند و یک عنصر `<b>` واقعی داخل `a` می‌سازد، پس `a` یک فرزندِ
      عنصری دارد. `textContent` رشته را متن ساده حساب می‌کند و تگ‌ها را عیناً به‌صورت متن نشان می‌دهد؛ پس `b`
      فقط یک گره‌ی متنی دارد و `children.length` آن `0` است. گزینه‌ی ۱ فکر کرده هر دو property یکسان‌اند،
      گزینه‌ی ۲ فکر کرده هیچ‌کدام عنصر نمی‌سازد، و گزینه‌ی ۴ جای این دو را عوض کرده است.
  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <p id="p">Hello <b>big</b> world</p>
    code: |
      const p = document.getElementById("p");
      console.log(p.textContent);
      console.log(p.innerHTML);
    options:
      - out: ["Hello <b>big</b> world", "Hello big world"]
      - out: ["Hello big world", "Hello <b>big</b> world"]
      - out: ["Hello big world", "Hello big world"]
      - out: ["Hello", "Hello <b>big</b> world"]
    answer: 2
    explain: |
      `textContent` متن همه‌ی گره‌های داخل عنصر را، بدون تگ‌ها، پشت هم می‌گذارد: `Hello big world` (متن داخل
      `<b>` هم حساب می‌شود؛ رد گزینه‌ی ۴). `innerHTML` کد HTML داخل عنصر را همراه با تگ‌ها برمی‌گرداند:
      `Hello <b>big</b> world` (رد گزینه‌ی ۳). گزینه‌ی ۱ جای این دو property را عوض کرده است.
  - level: easy
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <div id="card"><h2>Title</h2><p>Body</p></div>
    code: |
      const card = document.getElementById("card");
      card.textContent = "Empty";
      console.log(card.children.length, card.childNodes.length, card.innerHTML);
    options:
      - out: "0 1 Empty"
      - out: "2 3 Empty"
      - out: "2 1 Empty"
      - out: "0 1 <h2>Title</h2><p>Body</p>Empty"
    answer: 1
    explain: |
      نوشتن در `textContent` **کل** محتوای قبلی عنصر، از جمله عنصرهای `<h2>` و `<p>`، را پاک می‌کند و فقط یک
      گره‌ی متنی با مقدار `Empty` باقی می‌گذارد؛ پس هیچ فرزندِ عنصری نمی‌ماند (`0`)، یک گره‌ی فرزند وجود دارد
      (`1`) و `innerHTML` همان `Empty` است. گزینه‌های ۲ و ۳ فکر کرده‌اند عنصرهای قبلی می‌مانند، و گزینه‌ی ۴ فکر
      کرده متن جدید به انتهای محتوای قبلی اضافه می‌شود.
  - level: hard
    stem: کد زیر اجرا می‌شود و سپس کاربر روی دکمه‌ی Click کلیک می‌کند. خروجی کامل Console کدام است؟
    check: dom-output
    html: |
      <div id="box"><button id="btn">Click</button></div>
    code: |
      const btn = document.getElementById("btn");
      btn.addEventListener("click", () => console.log("clicked"));
      const box = document.getElementById("box");
      box.innerHTML += "<p>New</p>";
      console.log(document.getElementById("btn") === btn);
    events:
      - { type: click, target: "#btn" }
    options:
      - out: ["true", "clicked"]
      - out: ["false", "clicked"]
      - out: "false"
      - out: "true"
    answer: 3
    explain: |
      `box.innerHTML += ...` یعنی `box.innerHTML = box.innerHTML + ...`: کل HTML داخل `box` به رشته تبدیل و
      دوباره parse می‌شود؛ دکمه‌ی قدیمی نابود و یک دکمه‌ی **تازه** با همان id ساخته می‌شود. پس `getElementById`
      دکمه‌ی جدید را برمی‌گرداند که با `btn` قدیمی یکی نیست: `false` (رد گزینه‌های ۱ و ۴). listener روی دکمه‌ی
      قدیمی ثبت شده بود و دکمه‌ی جدید هیچ listenerی ندارد؛ پس کلیک کاربر چیزی چاپ نمی‌کند (رد گزینه‌ی ۲).
  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <div id="b"></div>
    code: |
      const b = document.getElementById("b");
      b.textContent = "<b>Hi</b>";
      console.log(b.textContent, "|", b.innerHTML);
    options:
      - out: "Hi | <b>Hi</b>"
      - out: "<b>Hi</b> | &lt;b&gt;Hi&lt;/b&gt;"
      - out: "<b>Hi</b> | <b>Hi</b>"
      - out: "Hi | Hi"
    answer: 2
    explain: |
      با `textContent` رشته عیناً به متن تبدیل می‌شود، پس خواندن دوباره‌ی `textContent` همان `<b>Hi</b>` را
      می‌دهد (رد گزینه‌های ۱ و ۴ که فکر کرده‌اند تگ‌ها تفسیر شده‌اند). اما در **کد HTML** این متن، علامت‌های
      `<` و `>` باید به شکل `&lt;` و `&gt;` نوشته شوند تا تگ حساب نشوند؛ پس `innerHTML` مقدار
      `&lt;b&gt;Hi&lt;/b&gt;` را برمی‌گرداند (رد گزینه‌ی ۳ که فکر کرده یک عنصر `<b>` ساخته شده است).
  - level: easy
    stem: چرا نباید متنی را که کاربر وارد کرده است مستقیماً با `innerHTML` در صفحه قرار داد؟
    options:
      - 'چون `innerHTML` رشته را به‌عنوان HTML تفسیر می‌کند و مهاجم می‌تواند کدی (مثلاً از طریق `onerror` یک تصویر) را در صفحه اجرا کند؛ برای متن کاربر از `textContent` استفاده می‌کنیم.'
