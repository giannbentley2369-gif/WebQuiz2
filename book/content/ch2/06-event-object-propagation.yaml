      (رفتن به لینک، ارسال فرم، تیک خوردن) لغو می‌کند و رویداد همچنان bubble می‌کند؛ `stopPropagation()` فقط
      حرکت رویداد به عنصرهای بعدی را متوقف می‌کند و رفتار پیش‌فرض همچنان انجام می‌شود. گزینه‌ی ۲ جای این دو را
      عوض کرده، گزینه‌ی ۳ تفاوتشان را نادیده گرفته، و حذف listener کار `removeEventListener` است (رد گزینه‌ی ۴).
  - level: medium
    stem: |
      کاربر ابتدا روی دکمه‌ی Add کلیک می‌کند، سپس روی آیتم تازه‌ی `C`، و در آخر روی فضای خالی خودِ لیست (روی
      `<ul>` و نه روی هیچ `<li>`ی). خروجی Console کدام است؟
    check: dom-output
    html: |
      <ul id="list"><li>A</li><li>B</li></ul>
      <button id="add">Add</button>
    code: |
      const list = document.getElementById("list");
      list.addEventListener("click", (e) => {
        if (e.target.matches("li")) console.log("clicked", e.target.textContent, e.currentTarget.id);
      });
      document.getElementById("add").addEventListener("click", () => {
        const li = document.createElement("li");
        li.textContent = "C";
        list.append(li);
      });
    events:
      - { type: click, target: "#add" }
      - { type: click, target: "#list li:last-child" }
      - { type: click, target: "#list" }
    options:
      - out: ""
      - out: "clicked C list"
      - out: ["clicked C list", "clicked undefined list"]
      - out: "clicked C C"
    answer: 2
    explain: |
      این event delegation است: listener روی `<ul>` ثبت شده و کلیک روی هر `<li>`، حتی `<li>`ی که بعداً اضافه شده،
      با bubbling به آن می‌رسد؛ پس کلیک روی `C` چاپ می‌شود (رد گزینه‌ی ۱). در کلیک روی خودِ `<ul>`، مقدار
      `e.target` همان `ul` است و `matches("li")` برابر `false`، پس چیزی چاپ نمی‌شود (رد گزینه‌ی ۳).
      `currentTarget` عنصر صاحب listener یعنی `list` است، نه `li` (رد گزینه‌ی ۴).
