      می‌ماند (رد گزینه‌ی ۲). نتیجه: برای لغو رفتار پیش‌فرض همیشه از `preventDefault()` استفاده کن.
  - level: medium
    stem: کاربر روی دکمه‌ی Send (داخل فرم) کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <form id="f"><input id="u" value="ali"><button id="send">Send</button></form>
    code: |
      document.getElementById("f").addEventListener("submit", (e) => {
        e.preventDefault();
        console.log("submit on", e.target.id);
      });
      document.getElementById("send").addEventListener("click", (e) => {
        console.log("click on", e.target.id);
      });
    events:
      - { type: click, target: "#send" }
    options:
      - out: "click on send"
      - out: ["submit on f", "click on send"]
      - out: ["click on send", "submit on send"]
      - out: ["click on send", "submit on f"]
    answer: 4
    explain: |
      `<button>` داخل فرم به‌طور پیش‌فرض دکمه‌ی ارسال است؛ رفتار پیش‌فرضِ کلیک روی آن، ایجاد رویداد `submit`
      روی **فرم** است. پس اول listener `click` دکمه اجرا می‌شود و بعد از آن رویداد `submit` رخ می‌دهد (رد
      گزینه‌های ۱ و ۲). هدف (target) رویداد `submit` خودِ فرم با id برابر `f` است، نه دکمه (رد گزینه‌ی ۳). به
      همین دلیل listener ارسال را روی `submit` فرم می‌گذاریم، نه روی `click` دکمه.
  - level: easy
    stem: |
      در event delegation، listener روی یک `<ul>` ثبت شده و کاربر روی یکی از `<li>`های آن کلیک می‌کند.
      `event.target` و `event.currentTarget` به ترتیب کدام‌اند؟
    options:
      - '`<li>` کلیک‌شده — `<ul>`'
      - '`<ul>` — `<li>` کلیک‌شده'
      - 'هر دو `<ul>`'
      - 'هر دو `<li>` کلیک‌شده'
    answer: 1
    explain: |
      `target` عنصری است که کلیک واقعاً روی آن رخ داده (همان `<li>`) و `currentTarget` عنصری است که listener
      در حال اجرا روی آن ثبت شده (همان `<ul>`). گزینه‌ی ۲ این دو را برعکس گرفته است. این دو فقط وقتی یکی‌اند
      که کاربر مستقیماً روی خودِ عنصرِ صاحب listener کلیک کند، که اینجا چنین نیست (رد گزینه‌های ۳ و ۴).
