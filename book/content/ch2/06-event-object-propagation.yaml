  - level: medium
    stem: کدام گزینه از مزایای event delegation نیست؟
    options:
      - 'به‌جای ده‌ها listener فقط یک listener لازم است.'
      - 'برای عنصرهایی هم که بعداً به والد اضافه می‌شوند، بدون ثبت listener جدید کار می‌کند.'
      - 'باعث می‌شود رویداد دیگر bubble نکند و به `document` نرسد.'
      - 'کد ساده‌تر می‌شود و حافظه‌ی کمتری مصرف می‌شود.'
