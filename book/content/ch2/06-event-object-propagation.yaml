    explain: |
      delegation دقیقاً **به** bubbling وابسته است: کلیک روی فرزند باید بالا برود تا به listener والد برسد، و
      بعد هم مثل همیشه به `document` و `window` ادامه می‌دهد. delegation هیچ‌وقت جلوی bubbling را نمی‌گیرد؛ این
      کار `stopPropagation()` است. سه گزینه‌ی دیگر مزایای واقعی آن هستند: یک listener به‌جای چند listener،
      پشتیبانی خودکار از عنصرهای جدید، و کد ساده‌تر با مصرف حافظه‌ی کمتر.
