      - '`preventDefault()` جلوی bubbling را می‌گیرد و `stopPropagation()` رفتار پیش‌فرض را لغو می‌کند.'
      - 'هر دو دقیقاً یک کار را انجام می‌دهند و فقط نامشان فرق دارد.'
