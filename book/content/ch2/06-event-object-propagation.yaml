id: ch2-event-flow
title: "شیء event، انتشار رویداد (Bubbling) و Delegation"
slides: "JS in HTML، پیش‌زمینه‌ی لازم برای اسلایدهای ۱۸ تا ۲۱ و ۳۵"
lesson: |
  در درس قبل listener ثبت کردیم. حالا دو سؤال مهم: مرورگر چه اطلاعاتی به listener می‌دهد؟ و وقتی روی یک
  عنصرِ تو در تو کلیک می‌شود، listenerهای والدها هم اجرا می‌شوند یا نه، و به چه ترتیبی؟ این درس پیش‌زمینه‌ای
  است که برای فهم واقعی رویدادهای اسلاید ۱۸ و جمله‌ی «Prevent page reload on submit with
  `event.preventDefault()`» در اسلاید ۳۵ لازم داری.

  ### شیء رویداد (event object)

  هر بار رویدادی رخ می‌دهد، مرورگر یک **شیء رویداد (event object)** می‌سازد و آن را به‌عنوان **اولین
  آرگومان** به همه‌ی listenerها می‌دهد. معمولاً اسمش را `event` یا `e` می‌گذاریم.

  | property یا متد | معنی |
  |---|---|
  | `event.type` | نام رویداد: `"click"`، `"input"`، `"submit"` و ... |
  | `event.target` | عنصری که رویداد **در اصل** روی آن رخ داده (درونی‌ترین عنصری که کلیک شده) |
  | `event.currentTarget` | عنصری که listener **در حال اجرا** روی آن ثبت شده است |
  | `event.key` | در رویدادهای صفحه‌کلید: کلید فشرده‌شده (`"Enter"`، `"a"` و ...) |
  | `event.preventDefault()` | لغو **رفتار پیش‌فرض** مرورگر (پایین‌تر) |
  | `event.defaultPrevented` | اگر `preventDefault()` صدا زده شده باشد `true` است |
  | `event.stopPropagation()` | جلوگیری از رسیدن رویداد به عنصرهای بعدی (پایین‌تر) |

  ```html
  <div id="outer"><span id="inner">Hi</span></div>
  <script>
    document.getElementById("outer").addEventListener("click", function (e) {
      console.log(e.type, e.target.id, e.currentTarget.id, this.id); // click inner outer outer
    });
  </script>
  ```

  کاربر روی `span` کلیک کرده، پس `target` همان `inner` است؛ ولی listener روی `outer` ثبت شده، پس
  `currentTarget` و `this` (در `function` معمولی) برابر `outer` هستند. در arrow function، `this` همان
  `this` بیرونی است (در سطح بالای اسکریپت: `window`)؛ برای همین `event.currentTarget` مطمئن‌ترین راه رسیدن به
  عنصرِ صاحب listener است.

  ### انتشار رویداد: bubbling و capturing

  ::: analogy حباب در آب
  حبابی که ته لیوان آب ساخته می‌شود، به سمت بالا حرکت می‌کند تا به سطح برسد. رویدادها هم همین‌طورند: کلیک
  روی درونی‌ترین عنصر رخ می‌دهد و بعد مثل حباب **بالا می‌رود (bubble)**: به والد، والدِ والد و ... تا
  `document` و `window`. هر کدام از این اجداد که برای آن رویداد listener داشته باشد، listenerش اجرا می‌شود.
  :::

  مسیر کامل یک رویداد سه **مرحله (phase)** دارد:

  1. **capturing** (گرفتن): از `window` به سمت پایین، از اجداد عبور می‌کند تا به والدِ هدف برسد.
  2. **target**: روی خودِ عنصر هدف.
  3. **bubbling** (حباب‌وار): از والدِ هدف دوباره به سمت بالا تا `window`.

  ```text
      (1) capturing                (3) bubbling
      window                       window
        |                            ^
      document                     document
        |                            ^
      <div id="outer">             <div id="outer">
        |                            ^
        +---->  <button id="btn">  --+
                (2) target: the click happens here
  ```

  `addEventListener` به‌طور پیش‌فرض listener را برای مرحله‌ی **bubbling** ثبت می‌کند. اگر آرگومان سوم
  `true` یا `{ capture: true }` باشد، listener در مرحله‌ی **capturing** اجرا می‌شود.

  ```html
  <div id="outer">
    <p id="mid"><button id="btn">Go</button></p>
  </div>
  <script>
    for (const id of ["outer", "mid", "btn"]) {
      document.getElementById(id).addEventListener("click", (e) => {
        console.log(id, "| target:", e.target.id, "| currentTarget:", e.currentTarget.id);
      });
    }
    document.addEventListener("click", () => console.log("document"));
    window.addEventListener("click", () => console.log("window"));
  </script>
  ```

  با کلیک روی دکمه:

  ```text
  btn | target: btn | currentTarget: btn
  mid | target: btn | currentTarget: mid
  outer | target: btn | currentTarget: outer
  document
  window
  ```

  `target` در همه‌ی سطرها `btn` است (کلیک واقعاً روی دکمه رخ داده)، ولی `currentTarget` در هر مرحله عنصری است
  که listener آن لحظه رویش ثبت شده. با capture:

  ```html
  <div id="outer"><button id="btn">Go</button></div>
  <script>
    const outer = document.getElementById("outer");
    const btn = document.getElementById("btn");
    outer.addEventListener("click", () => console.log("outer bubble"));
    outer.addEventListener("click", () => console.log("outer capture"), true);
    btn.addEventListener("click", () => console.log("btn capture"), { capture: true });
    btn.addEventListener("click", () => console.log("btn bubble"));
  </script>
  <!-- click on btn -> outer capture, btn capture, btn bubble, outer bubble -->
  ```

  ::: info بیشتر بدانیم
  بیشتر رویدادهای پرکاربرد (`click`، `input`، `change`، `submit`، `keydown`) bubble می‌کنند، ولی چند رویداد
  مثل `focus` و `blur` (فعال و غیرفعال شدن یک کادر) bubble نمی‌کنند.
  :::

  ### `stopPropagation()`: «بقیه نشنوند!»

  ```html
  <div id="outer"><button id="btn">Delete</button></div>
  <script>
    const btn = document.getElementById("btn");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();          // the ancestors will not hear this click
      console.log("btn 1");
    });
    btn.addEventListener("click", () => console.log("btn 2")); // still runs: same element
    document.getElementById("outer").addEventListener("click", () => console.log("outer"));
  </script>
  <!-- click on btn -> btn 1, btn 2   ("outer" is never printed) -->
  ```

  `stopPropagation()` جلوی رفتن رویداد به عنصرهای **بعدی** را می‌گیرد، ولی listenerهای دیگرِ **همان عنصر**
  هنوز اجرا می‌شوند. (متد `stopImmediatePropagation()` آن‌ها را هم متوقف می‌کند.) کاربرد معمول: دکمه‌ی «حذف»
  داخل یک کارت که خودِ کارت هم با کلیک باز می‌شود. زیاده‌روی نکن؛ کدهای دیگری ممکن است به رسیدن رویداد به
  اجداد نیاز داشته باشند.

  ### `preventDefault()`: لغو رفتار پیش‌فرض مرورگر

  بعضی رویدادها یک **رفتار پیش‌فرض (default action)** دارند که مرورگر بعد از اجرای listenerها انجام می‌دهد:

  | رویداد روی عنصر | رفتار پیش‌فرض |
  |---|---|
  | `click` روی لینک `<a href="...">` | رفتن به آدرس لینک |
  | `submit` روی `<form>` | فرستادن فرم و بارگذاری دوباره‌ی صفحه (یا رفتن به آدرس دیگر) |
  | `click` روی چک‌باکس | تیک خوردن یا برداشتن تیک |
  | `keydown` در کادر متنی | تایپ شدن حرف |

  `event.preventDefault()` این رفتار را لغو می‌کند و بعد از آن `event.defaultPrevented` برابر `true` است.
  مهم‌ترین کاربرد همان است که اسلاید ۳۵ می‌گوید: **جلوگیری از reload صفحه هنگام submit فرم**، تا بتوانیم
  داده‌ها را با JavaScript بررسی کنیم و نتیجه را در همان صفحه نشان دهیم:

  ```html
  <form id="signup">
    <input id="username" value="ali">
    <button>Sign up</button>
  </form>
  <p id="msg"></p>
  <script>
    document.getElementById("signup").addEventListener("submit", (e) => {
      e.preventDefault(); // stay on this page: no reload
      const name = document.getElementById("username").value;
      document.getElementById("msg").textContent = "Welcome, " + name;
    });
  </script>
  ```

  بدون `preventDefault()`، صفحه بلافاصله دوباره بارگذاری می‌شود و پیام `Welcome, ali` همان لحظه پاک می‌شود.
  (جزئیات کار با فرم‌ها، مثل خواندن `.value` و `.checked`، در درس «کار با فرم‌ها (Forms)» آمده است.) به همین ترتیب:

  - با `preventDefault()` در listener کلیکِ یک لینک، مرورگر به آدرس لینک نمی‌رود.
  - در listener کلیکِ یک چک‌باکس، مرورگر **اول** تیک را عوض می‌کند (پس داخل listener، `checked` مقدار
    جدید را نشان می‌دهد) و اگر `preventDefault()` صدا زده شود، **بعد از** listener آن را به حالت قبل برمی‌گرداند.

  | | `preventDefault()` | `stopPropagation()` |
  |---|---|---|
  | کارش | لغو رفتار پیش‌فرض مرورگر (رفتن به لینک، ارسال فرم، تیک خوردن) | توقف حرکت رویداد به عنصرهای بعدی |
  | آیا والدها رویداد را می‌شنوند؟ | **بله** | خیر |
  | آیا رفتار پیش‌فرض انجام می‌شود؟ | خیر | **بله** |

  ::: note نماد خروجی در تست‌های این درس
  در بعضی تست‌ها، بعد از هر رویداد سطری مثل `[default prevented]` یا `[default runs]` در گزینه‌ها آمده است.
  این سطر را کد چاپ نمی‌کند؛ نشان می‌دهد که آیا رفتار پیش‌فرض مرورگر برای آن رویداد لغو شد (`prevented`) یا
  انجام می‌شود (`runs`).
  :::

  ### Event delegation (واگذاری رویداد)

  فرض کن یک لیست ۱۰۰ آیتمی داری، یا آیتم‌ها بعداً با JavaScript اضافه می‌شوند. به‌جای اینکه به هر آیتم یک
  listener بدهی، **یک listener روی والد مشترک** می‌گذاری و چون کلیک‌ها bubble می‌کنند، همه به والد می‌رسند؛
  بعد با `event.target` می‌فهمی روی کدام فرزند کلیک شده است. به این الگو **event delegation** می‌گویند.

  ```html
  <ul id="todo">
    <li>Buy milk</li>
    <li>Read chapter 2</li>
  </ul>
  <button id="add">Add</button>
  <script>
    const todo = document.getElementById("todo");
    todo.addEventListener("click", (e) => {
      if (e.target.matches("li")) {            // was an <li> clicked?
        console.log("done:", e.target.textContent);
      }
    });
    document.getElementById("add").addEventListener("click", () => {
      const li = document.createElement("li");
      li.textContent = "New task";
      todo.append(li);                         // no new listener needed!
    });
  </script>
  ```

  کلیک روی `Buy milk` چاپ می‌کند `done: Buy milk`، و بعد از زدن Add، کلیک روی آیتم تازه هم چاپ می‌کند
  `done: New task`، بدون اینکه برای آن listener جدیدی ثبت کرده باشیم.

  - `element.matches(selector)`: آیا این عنصر با selector جور است؟ (`true` یا `false`)
  - `element.closest(selector)`: نزدیک‌ترین عنصر جور با selector، از **خودِ عنصر** شروع می‌کند و به سمت
    اجداد بالا می‌رود؛ اگر چیزی پیدا نشود `null` می‌دهد.

  اگر داخل `<li>` عنصرهای دیگری باشد، `target` ممکن است همان عنصر داخلی باشد؛ آن وقت `matches("li")` برابر
  `false` می‌شود و باید از `closest` استفاده کنی:

  ```html
  <ul id="cart">
    <li><b>Milk</b> (2) <button class="remove">x</button></li>
    <li><b>Bread</b> (1) <button class="remove">x</button></li>
  </ul>
  <script>
    document.getElementById("cart").addEventListener("click", (e) => {
      const removeBtn = e.target.closest(".remove");
      if (!removeBtn) return;               // the click was not on a remove button
      const item = removeBtn.closest("li");
      console.log("removing", item.querySelector("b").textContent);
      item.remove();                        // see the lesson on removing elements
    });
  </script>
  ```

  در delegation، `event.target` فرزندی است که کلیک شده و `event.currentTarget` همان والدی است که listener روی
  آن ثبت شده. مزایا: listenerهای کمتر (حافظه‌ی کمتر)، کار کردن برای عنصرهایی که بعداً اضافه می‌شوند، و کد
  ساده‌تر.

  ::: tip
  - برای رسیدن به عنصرِ صاحب listener از `event.currentTarget` استفاده کن و برای عنصری که واقعاً کلیک شده از
    `event.target`.
  - در delegation، `closest(...)` معمولاً از `matches(...)` امن‌تر است، چون کلیک روی عنصرهای داخلی را هم
    درست تشخیص می‌دهد.
  :::

  ::: trap
  - `preventDefault()` جلوی bubbling را نمی‌گیرد و `stopPropagation()` رفتار پیش‌فرض را لغو نمی‌کند؛ دو کار
    کاملاً جدا هستند.
  - `stopPropagation()` listenerهای دیگرِ **همان عنصر** را متوقف نمی‌کند.
  - listener بدون آرگومان سوم در مرحله‌ی bubbling اجرا می‌شود، پس listener فرزند **قبل** از listener والد
    اجرا می‌شود؛ ولی listenerهای capture روی اجداد از همه زودترند.
  - `return false` در listener `addEventListener` هیچ اثری ندارد؛ فقط در handlerهای `onclick` (attribute یا
    property) رفتار پیش‌فرض را لغو می‌کند. همیشه از `preventDefault()` استفاده کن.
  - کلیک روی دکمه‌ی داخل فرم، علاوه بر `click` روی دکمه، رویداد `submit` را هم روی فرم ایجاد می‌کند.
  :::

  ::: summary
  - شیء event: `type`، `target` (عنصر اصلی)، `currentTarget` (صاحب listener)، `key`، `defaultPrevented`.
  - مسیر رویداد: capturing (پایین رفتن) ← target ← bubbling (بالا رفتن تا `window`)؛ پیش‌فرض `addEventListener`
    مرحله‌ی bubbling است و با `true` یا `{ capture: true }` مرحله‌ی capturing.
  - `stopPropagation()` حرکت رویداد را متوقف می‌کند؛ `preventDefault()` رفتار پیش‌فرض (لینک، submit و reload، تیک) را لغو می‌کند.
  - delegation: یک listener روی والد + `e.target.matches(...)` یا `closest(...)`؛ برای عنصرهای بعدی هم کار می‌کند.
  :::
questions:
  - level: easy
    stem: مرورگر هنگام اجرای یک event listener، چه چیزی را به‌عنوان اولین آرگومان به آن می‌دهد؟
    options:
      - 'خودِ عنصری که listener روی آن ثبت شده است'
      - 'شیء رویداد (event object) که اطلاعاتی مثل `type` و `target` دارد'
      - 'رشته‌ای با نام رویداد، مثلاً `"click"`'
      - 'هیچ چیز؛ پارامتر اول همیشه `undefined` است'
    answer: 2
    explain: |
      مرورگر برای هر رویداد یک شیء event می‌سازد و آن را به‌عنوان اولین آرگومان به listener می‌دهد؛ از طریق آن
      به `type` (نام رویداد، که فقط یکی از propertyهای شیء است؛ رد گزینه‌ی ۳)، `target`، `currentTarget` و
      متدهایی مثل `preventDefault()` دسترسی داریم. خودِ عنصر از طریق `event.currentTarget` (یا `this` در
      `function` معمولی) در دسترس است، ولی آرگومان اول نیست (رد گزینه‌ی ۱).
  - level: easy
    stem: در مرحله‌ی bubbling، رویداد به کدام سمت حرکت می‌کند؟
    options:
      - 'از `window` به سمت پایین، تا عنصر هدف'
      - 'فقط روی خودِ عنصر هدف می‌ماند و به هیچ عنصر دیگری نمی‌رسد'
      - 'از عنصر هدف به سمت والدها و اجداد، تا `document` و `window`'
      - 'از عنصر هدف به سمت فرزندانش'
    answer: 3
    explain: |
      bubbling یعنی بالا رفتن مثل حباب: رویداد اول روی هدف رخ می‌دهد و بعد به والد، والدِ والد و ... تا
      `document` و `window` می‌رسد. حرکت از `window` به سمت پایین، مرحله‌ی **capturing** است که قبل از رسیدن به
      هدف انجام می‌شود (رد گزینه‌ی ۱). رویدادهای رایجی مثل `click` روی خودِ هدف نمی‌مانند (رد گزینه‌ی ۲)، و
      هیچ مرحله‌ای به سمت فرزندانِ هدف نمی‌رود (رد گزینه‌ی ۴).
  - level: hard
    stem: کاربر روی دکمه کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <div id="outer"><p id="mid"><button id="btn">Go</button></p></div>
    code: |
      for (const id of ["outer", "mid", "btn"]) {
        document.getElementById(id).addEventListener("click", (e) => {
          console.log(id, e.target.id, e.currentTarget.id);
        });
      }
      document.addEventListener("click", () => console.log("document"));
      window.addEventListener("click", () => console.log("window"));
    events:
      - { type: click, target: "#btn" }
    options:
      - out: ["window", "document", "outer btn outer", "mid btn mid", "btn btn btn"]
      - out: ["btn btn btn", "mid btn mid", "outer btn outer", "document", "window"]
      - out: ["btn btn btn", "mid mid mid", "outer outer outer", "document", "window"]
      - out: "btn btn btn"
    answer: 2
    explain: |
      listenerها بدون آرگومان سوم در مرحله‌ی bubbling اجرا می‌شوند: اول خودِ دکمه، بعد `mid`، `outer`،
      `document` و در آخر `window` (رد گزینه‌ی ۱ که ترتیب capturing را فرض کرده، و گزینه‌ی ۴ که bubbling را
      نادیده گرفته). `e.target` در همه‌ی مراحل همان دکمه (`btn`) است، چون کلیک روی آن رخ داده؛ فقط
      `currentTarget` در هر مرحله برابر عنصرِ صاحب listener است (رد گزینه‌ی ۳).
  - level: hard
    stem: کاربر روی دکمه کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <div id="outer"><button id="btn">Go</button></div>
    code: |
      const outer = document.getElementById("outer");
      const btn = document.getElementById("btn");
      outer.addEventListener("click", () => console.log("outer bubble"));
      outer.addEventListener("click", () => console.log("outer capture"), true);
      btn.addEventListener("click", () => console.log("btn capture"), { capture: true });
      btn.addEventListener("click", () => console.log("btn bubble"));
    events:
      - { type: click, target: "#btn" }
    options:
      - out: ["btn capture", "btn bubble", "outer bubble", "outer capture"]
      - out: ["outer bubble", "outer capture", "btn capture", "btn bubble"]
      - out: ["btn bubble", "outer bubble", "outer capture", "btn capture"]
      - out: ["outer capture", "btn capture", "btn bubble", "outer bubble"]
    answer: 4
    explain: |
      اول مرحله‌ی capturing از بالا به پایین اجرا می‌شود، پس listener capture روی `outer` از همه زودتر است
      (رد گزینه‌های ۱ و ۳). بعد نوبت خودِ هدف است: listenerهای دکمه (اینجا اول capture و بعد bubble). در آخر
