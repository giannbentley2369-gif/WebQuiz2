    events:
      - { type: submit, target: "#search", reportDefault: true }
    eventsNote: 'سطر `[default runs]` یعنی رفتار پیش‌فرض (ارسال و reload) لغو نشده و `[default prevented]` یعنی لغو شده است.'
    options:
      - out: ["searching for js", "[default prevented]"]
      - out: ["searching for js", "[default runs]"]
      - out: ["[default prevented]"]
      - out: ["searching for undefined", "[default prevented]"]
    answer: 1
    explain: |
      `form.elements.q` کنترلی است که `name="q"` دارد و مقدارش `"js"` است. چون `preventDefault()` صدا زده شده، رفتار پیش‌فرض لغو می‌شود و صفحه reload نمی‌شود. گزینه‌ی ۲ اثر `preventDefault()` را ندیده، گزینه‌ی ۳ فکر کرده listener اجرا نمی‌شود و گزینه‌ی ۴ تصور کرده `form.elements` کنترل‌ها را با `name` پیدا نمی‌کند.

  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <form id="signup">
        <input id="username" value="   ">
        <p id="msg"></p>
        <button>Sign up</button>
      </form>
    code: |
      const form = document.getElementById("signup");
      const msg = document.getElementById("msg");
      function show(text) {
        msg.textContent = text;
        console.log(text);
      }
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        if (username === "") {
          show("Username is required");
          return;
        }
        if (username.length < 3) {
          show("Too short");
          return;
        }
        show("Welcome, " + username + "!");
      });
    events:
      - { type: submit, target: "#signup" }
      - { type: input, target: "#username", value: " al " }
      - { type: submit, target: "#signup" }
      - { type: input, target: "#username", value: "  sara " }
      - { type: submit, target: "#signup" }
    eventsNote: 'کاربر سه بار فرم را ارسال می‌کند: بار اول با همان مقدار اولیه (سه فاصله)، بار دوم بعد از نوشتن `" al "` و بار سوم بعد از نوشتن `"  sara "` در کادر (نقل‌قول‌ها فقط برای نشان دادن فاصله‌ها هستند).'
    options:
      - out: ["Username is required", "Welcome, al!", "Welcome, sara!"]
      - out: ["Username is required", "Username is required", "Welcome, sara!"]
      - out: ["Username is required", "Too short", "Welcome, sara!"]
      - out: ["Too short", "Too short", "Welcome, sara!"]
    answer: 3
    explain: |
      `trim()` فاصله‌های اول و آخر را حذف می‌کند. بار اول سه فاصله به رشته‌ی خالی تبدیل می‌شود: `Username is required`. بار دوم `" al "` به `"al"` با طول ۲ تبدیل می‌شود: `Too short`. بار سوم `"sara"` می‌ماند و پیام خوش‌آمد چاپ می‌شود. گزینه‌ی ۱ طول را قبل از `trim` حساب کرده، گزینه‌ی ۲ فکر کرده `" al "` خالی حساب می‌شود و گزینه‌ی ۴ رشته‌ی فقط-فاصله را «کوتاه» دانسته، نه خالی.

  - level: hard
    stem: کاربر `Tehran` را در کادر تایپ می‌کند و سپس فرم را ارسال می‌کند. خروجی کدام است؟
    check: dom-output
    html: |
      <form id="f">
        <input id="city">
        <button>Save</button>
      </form>
    code: |
      const city = document.getElementById("city").value;
      document.getElementById("f").addEventListener("submit", (e) => {
        e.preventDefault();
        console.log("City: " + city);
      });
    events:
      - { type: input, target: "#city", value: "Tehran" }
      - { type: submit, target: "#f" }
    options:
      - out: "City: undefined"
      - out: "City: null"
      - out: "City: Tehran"
      - out: "City:"
    answer: 4
    explain: |
      مقدار کادر فقط **یک بار** و هنگام بارگذاری صفحه خوانده و در `city` ذخیره شده است؛ آن موقع کادر خالی بود، پس `city` رشته‌ی خالی `""` است و تایپ بعدی کاربر آن را عوض نمی‌کند. خروجی `"City: "` است (با یک فاصله‌ی نامرئی در انتها). گزینه‌ی ۳ نتیجه‌ی کد درست است، یعنی وقتی `.value` داخل listener خوانده شود؛ گزینه‌های ۱ و ۲ فکر کرده‌اند مقدار کادر خالی `undefined` یا `null` است، در حالی که رشته‌ی خالی است.

  - level: medium
    stem: کاربر ابتدا `Hello` و سپس، با ادامه‌ی تایپ، `Hello world!` را در کادر می‌نویسد. در پایان کد `console.log(left.textContent, left.className);` اجرا می‌شود. خروجی آن کدام است؟
    check: dom-output
    html: |
      <textarea id="tweet"></textarea>
      <span id="left">10</span>
    code: |
      const tweet = document.getElementById("tweet");
      const left = document.getElementById("left");
      tweet.addEventListener("input", () => {
        const remaining = 10 - tweet.value.length;
        left.textContent = remaining;
        left.classList.toggle("over", remaining < 0);
      });
    events:
      - { type: input, target: "#tweet", value: "Hello" }
      - { type: input, target: "#tweet", value: "Hello world!" }
    after: |
      console.log(left.textContent, left.className);
    options:
      - out: "-2 over"
      - out: "5"
      - out: "-2"
      - out: "12 over"
    answer: 1
    explain: |
      listener با هر تغییر اجرا می‌شود و آخرین بار طول متن ۱۲ است؛ پس `10 - 12` برابر `-2` نوشته می‌شود. چون `remaining < 0` درست است، `toggle` با آرگومان دوم `true` کلاس `over` را **اضافه** می‌کند. گزینه‌ی ۲ فقط اثر اولین تایپ را دیده، گزینه‌ی ۳ نقش `force` در `toggle` را نادیده گرفته و گزینه‌ی ۴ طول متن را به‌جای «باقی‌مانده» نوشته است.

  - level: medium
    stem: کاربر یک بار تیک checkbox را می‌زند و بعد دوباره آن را برمی‌دارد. خروجی کدام است؟
    check: dom-output
    html: |
      <form>
        <input type="checkbox" id="terms">
        <button id="send" disabled>Send</button>
      </form>
    code: |
      const terms = document.getElementById("terms");
      const send = document.getElementById("send");
      terms.addEventListener("change", () => {
        send.disabled = !terms.checked;
        console.log(send.disabled);
      });
    events:
      - { type: change, target: "#terms", checked: true }
      - { type: change, target: "#terms", checked: false }
    options:
      - out: ["true", "false"]
      - out: ["false", "true"]
      - out: ["false", "false"]
      - out: ["on", "off"]
    answer: 2
    explain: |
      در checkbox رویداد `change` بلافاصله بعد از هر تیک زدن یا برداشتن رخ می‌دهد. بار اول `checked` برابر `true` است، پس `disabled = !true = false` (دکمه فعال می‌شود)؛ بار دوم `checked` برابر `false` است و دکمه دوباره غیرفعال می‌شود (`true`). گزینه‌ی ۱ علامت `!` را نادیده گرفته، گزینه‌ی ۳ فکر کرده دکمه بعد از فعال شدن فعال می‌ماند و گزینه‌ی ۴ مقدار `value` را با وضعیت اشتباه گرفته است.

  - level: medium
    stem: خروجی کد زیر در Node.js کدام است؟
    check: output
    code: |
      function validateEmail(value) {
        const email = value.trim();
        if (email === "") return "Email is required";
        if (!email.includes("@") || !email.includes(".")) return "Invalid email";
        return "OK";
      }
      console.log(validateEmail("   "));
      console.log(validateEmail("ali@mail"));
      console.log(validateEmail(" ali@mail.com "));
    options:
      - out: ["Invalid email", "Invalid email", "OK"]
      - out: ["Email is required", "OK", "OK"]
      - out: ["Email is required", "Invalid email", "OK"]
      - out: ["Email is required", "Invalid email", "Invalid email"]
    answer: 3
    explain: |
      رشته‌ی اول بعد از `trim()` خالی است. رشته‌ی دوم `@` دارد ولی نقطه ندارد؛ چون شرط با `||` نوشته شده، نبودنِ **یکی** از این دو برای «نامعتبر» بودن کافی است. رشته‌ی سوم بعد از حذف فاصله‌های اطراف، هر دو را دارد و `OK` است. گزینه‌ی ۱ `trim` را نادیده گرفته، گزینه‌ی ۲ فکر کرده داشتن `@` کافی است و گزینه‌ی ۴ فاصله‌های اطراف رشته‌ی سوم را مشکل‌ساز دانسته است.

  - level: hard
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    html: |
      <form id="f">
        <input id="nameInput" value="guest">
      </form>
    code: |
      const form = document.getElementById("f");
      const nameInput = document.getElementById("nameInput");
      nameInput.value = "Sara";
      form.reset();
      console.log(nameInput.value === "" ? "(empty)" : nameInput.value);
    options:
      - out: "(empty)"
      - out: "Sara"
      - out: "undefined"
      - out: "guest"
    answer: 4
    explain: |
      `form.reset()` هر کنترل را به **مقدار اولیه**‌اش برمی‌گرداند و مقدار اولیه همان attribute `value` در HTML (`"guest"`) است؛ پس نتیجه لزوماً کادر خالی نیست. گزینه‌ی ۱ فکر کرده `reset` همه‌چیز را خالی می‌کند، گزینه‌ی ۲ تصور کرده `reset` روی مقدارهای تغییرکرده با JavaScript اثری ندارد و گزینه‌ی ۳ هم بی‌پایه است، چون `.value` همیشه یک رشته است.

  - level: medium
    stem: کدام جمله درباره‌ی فرم‌ها **نادرست** است؟
    options:
      - '`.value` یک `<input type="number">` همیشه رشته است.'
      - رویداد `submit` روی خودِ عنصر `<form>` رخ می‌دهد.
      - رویداد `input` هنگام تایپ، با هر تغییر محتوای کادر رخ می‌دهد.
      - اعتبارسنجی با JavaScript در مرورگر برای امنیت کافی است و لازم نیست سرور داده را دوباره بررسی کند.
    answer: 4
    explain: |
      اعتبارسنجی سمت کاربر فقط برای **راحتی کاربر** است؛ هر کسی می‌تواند JavaScript صفحه را خاموش کند یا داده را مستقیم برای سرور بفرستد، پس سرور همیشه باید دوباره بررسی کند. بنابراین گزینه‌ی ۴ نادرست است. سه جمله‌ی دیگر رفتار واقعی مرورگر را توصیف می‌کنند.

  - level: easy
    stem: 'کاربر در کادر `ageInput` عدد ۲۰ را وارد کرده است. در جای خالی `const next = ______(ageInput.value) + 1;` کدام گزینه قرار گیرد تا `next` برابر **عدد** ۲۱ شود؟'
    check: claims
    setup: |
      const ageInput = { value: "20" };
    options:
      - text: '`Number`'
        expr: Number(ageInput.value) + 1
        equals: "21"
      - text: '`String`'
        expr: String(ageInput.value) + 1
        equals: "21"
      - text: '`Boolean`'
        expr: Boolean(ageInput.value) + 1
        equals: "21"
      - text: '`typeof`'
        expr: typeof(ageInput.value) + 1
        equals: "21"
    answer: 1
    explain: |
      `.value` رشته‌ی `"20"` است و `Number("20")` آن را به عدد ۲۰ تبدیل می‌کند؛ بعد `20 + 1` برابر ۲۱ می‌شود. با `String` همان رشته می‌ماند و نتیجه `"201"` است، `Boolean("20")` برابر `true` است و `true + 1` می‌شود ۲، و `typeof` رشته‌ی `"string"` را می‌دهد که با ۱ به `"string1"` تبدیل می‌شود.
