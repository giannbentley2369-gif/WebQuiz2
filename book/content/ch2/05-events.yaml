    options:
      - '`click`: وقتی کاربر روی عنصر کلیک می‌کند'
      - '`input`: هر بار که مقدار یک کادر ورودی تغییر می‌کند'
      - '`submit`: وقتی یک فرم ارسال می‌شود'
