    explain: |
      دکمه‌ی `save` وجود دارد، پس خط ۲ بدون مشکل listener ثبت می‌کند (رد گزینه‌ی ۱). عنصری با id برابر `cancel`
      نیست؛ `getElementById` در این حالت خطا نمی‌دهد و فقط `null` برمی‌گرداند (رد گزینه‌ی ۲)، و چاپ `null` هم
      مشکلی ندارد و `cancel is null` نمایش داده می‌شود (رد گزینه‌ی ۳). در خط ۵ متد `addEventListener` روی `null`
      صدا زده می‌شود و خطای `TypeError` رخ می‌دهد؛ پس `ready` هرگز چاپ نمی‌شود. (listener `save` که در خط ۲
      ثبت شده، همچنان با کلیک کار می‌کند.)
