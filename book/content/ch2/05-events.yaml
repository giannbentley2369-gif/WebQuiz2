    answer: 1
    explain: |
      `input` با **هر** تغییر مقدار رخ می‌دهد، یعنی یک بار بعد از `A` و یک بار بعد از `Al` (رد گزینه‌ی ۳). در
      کادر متنی، `change` فقط وقتی رخ می‌دهد که کاربر کارش را تمام کند و از کادر بیرون برود، پس فقط یک بار و در
