      شاخه‌ی `else` اجرا می‌شود؛ برای کلید دوم برابر `"Enter"` است و `submit search` چاپ می‌شود. ترتیب خروجی
      همان ترتیب فشردن کلیدهاست (رد گزینه‌ی ۱)، شرط برای Enter درست است (رد گزینه‌ی ۲)، و کلید `a` هم
