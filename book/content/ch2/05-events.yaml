      `load` وقتی رخ می‌دهد که صفحه (یا یک منبع مثل تصویر) کاملاً بارگذاری شده باشد؛ رویداد فشردن کلید
      `keydown` است. سه جفت دیگر درست‌اند و همه از رویدادهای رایج اسلاید ۱۸ هستند: `click` برای کلیک، `input`
      برای تغییر مقدار کادر ورودی و `submit` برای ارسال فرم.
  - level: hard
    stem: |
      کد مثال Button Action (اسلاید ۱۹) روی صفحه‌ی زیر اجرا می‌شود که یک دکمه‌ی اضافی دارد. کاربر روی دکمه‌ی
      **CLICK ME!** کلیک می‌کند و بعد در Console متن و رنگ inline عنوان را چاپ می‌کنیم. خروجی کدام است؟
    check: dom-output
    html: |
      <h1 id="title">Hello World</h1>
      <button id="reset">Reset</button>
      <button id="go">CLICK ME!</button>
    code: |
      const btn = document.querySelector('button');

      btn.addEventListener('click', () => {
        const title = document.querySelector('#title');
        title.textContent = 'Goodbye World';
        title.style.color = 'red';
      });
    events:
      - { type: click, target: "#go" }
    after: |
      const t = document.querySelector("#title");
      console.log(t.textContent, JSON.stringify(t.style.color));
    options:
      - out: 'Goodbye World "red"'
      - out: 'Hello World ""'
      - out: 'Goodbye World ""'
      - out: "!! TypeError"
    answer: 2
    explain: |
      `querySelector('button')` فقط **اولین** `<button>` صفحه را برمی‌گرداند که اینجا دکمه‌ی Reset است؛ پس
      listener روی Reset ثبت شده و کلیک روی CLICK ME! هیچ کاری نمی‌کند. متن عنوان همان `Hello World` می‌ماند و
      رنگ inline آن خالی است (رد گزینه‌های ۱ و ۳). خطایی هم رخ نمی‌دهد، چون عنصرها وجود دارند (رد گزینه‌ی ۴).
      برای انتخاب دکمه‌ی درست باید از `querySelector('#go')` استفاده می‌کردیم.
  - level: medium
    stem: |
      نسخه‌ی زیر همان مثال Button Action است که یک شمارنده هم دارد. کاربر **سه بار** روی دکمه کلیک می‌کند و
      سپس در Console دستور `console.log(clicks, document.querySelector("#title").textContent)` را اجرا
      می‌کنیم. خروجی کدام است؟
    check: dom-output
    html: |
      <h1 id="title">Hello World</h1>
      <button>CLICK ME!</button>
    code: |
      const btn = document.querySelector('button');
      let clicks = 0;
      btn.addEventListener('click', () => {
        clicks++;
        const title = document.querySelector('#title');
        title.textContent = 'Goodbye World';
        title.style.color = 'red';
      });
    events:
      - { type: click, target: "button", times: 3 }
    after: |
      console.log(clicks, document.querySelector("#title").textContent);
    options:
      - out: "3 Goodbye World"
      - out: "1 Goodbye World"
      - out: "3 Goodbye WorldGoodbye WorldGoodbye World"
      - out: "0 Hello World"
    answer: 1
    explain: |
      listener با **هر** کلیک اجرا می‌شود، پس `clicks` سه بار زیاد می‌شود و `3` است (رد گزینه‌ی ۲ که فکر کرده
      listener یک بار مصرف است). `textContent = ...` متن را **جایگزین** می‌کند، نه اینکه به آن اضافه کند؛ پس
      متن نهایی یک بار `Goodbye World` است (رد گزینه‌ی ۳). گزینه‌ی ۴ فرض کرده کلیک‌ها اثری نداشته‌اند.
  - level: easy
    stem: کدام عبارت درباره‌ی رویدادها (اسلاید ۱۸) نادرست است؟
    options:
      - 'رویدادها به صفحه‌ی وب اجازه می‌دهند به کارهای کاربر واکنش نشان دهد.'
      - 'handlerها را می‌توان هم با attributeهای HTML و هم با JavaScript تنظیم کرد.'
      - 'با `addEventListener` برای یک نوع رویداد روی یک عنصر فقط یک handler می‌توان ثبت کرد.'
      - 'رویدادها تجربه‌ی کاربری تعاملی و پویا را ممکن می‌کنند.'
    answer: 3
    explain: |
      اسلاید ۱۸ صریحاً می‌گوید «Multiple handlers can be added to the same event»؛ با `addEventListener` هر
      تعداد listener می‌توان ثبت کرد و همه به ترتیب ثبت اجرا می‌شوند. محدودیت «فقط یک handler» مربوط به
      `onclick` (attribute یا property) است. سه گزینه‌ی دیگر عیناً بندهای همان اسلاید هستند.
  - level: medium
    stem: برای اینکه `removeEventListener` یک listener را واقعاً حذف کند، کدام شرط لازم است؟
    options:
      - 'همان نوع رویداد و **همان مرجع تابع** (همان شیء تابع) که به `addEventListener` داده شده بود'
      - 'فقط نوع رویداد کافی است و همه‌ی listenerهای آن نوع حذف می‌شوند'
      - 'تابعی با همان بدنه (همان متن کد)، حتی اگر شیء تابع جدیدی باشد'
      - 'listener حتماً باید arrow function باشد'
    answer: 1
    explain: |
      مرورگر listener را با مقایسه‌ی **مرجع** پیدا می‌کند: نوع رویداد باید یکی باشد و تابع باید دقیقاً همان
      شیء باشد (و اگر capture تنظیم شده، همان تنظیم). دو تابع هم‌متن، دو شیء متفاوت‌اند (رد گزینه‌ی ۳)؛ برای
      همین listener ناشناس قابل حذف نیست. `removeEventListener` بدون تابع چیزی حذف نمی‌کند (رد گزینه‌ی ۲)،
      و نوع تابع (arrow یا معمولی) هم اهمیتی ندارد (رد گزینه‌ی ۴).
  - level: easy
    stem: رویداد `load` روی `window` چه زمانی رخ می‌دهد؟
    options:
      - 'بلافاصله بعد از اجرای اولین تگ `<script>`'
      - 'هر بار که کاربر روی صفحه کلیک کند'
      - 'قبل از اینکه مرورگر شروع به parse کردن HTML کند'
      - 'وقتی کل صفحه همراه همه‌ی منابعش (مثل تصاویر و فایل‌های CSS) کامل بارگذاری شده باشد'
    answer: 4
    explain: |
      `load` روی `window` آخرین رویداد بارگذاری است و منتظر همه‌ی منابع می‌ماند؛ حتی بعد از `DOMContentLoaded`
      رخ می‌دهد. اسکریپت‌های صفحه قبل از آن اجرا می‌شوند (رد گزینه‌ی ۱)، با کلیک ربطی ندارد (رد گزینه‌ی ۲)، و
      قبل از parse هم نمی‌تواند باشد، چون اسکریپتی که listener را ثبت می‌کند خودش بخشی از HTML است (رد
      گزینه‌ی ۳).
  - level: hard
    stem: کاربر یک بار روی دکمه کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <button id="btn">Go</button>
    code: |
      function greet(name) {
        console.log(typeof name, name instanceof Event ? "an event object" : name);
      }
      const btn = document.getElementById("btn");
      btn.addEventListener("click", () => greet("Sara"));
      btn.addEventListener("click", greet);
    events:
      - { type: click, target: "#btn" }
    options:
      - out: ["string Sara", "undefined undefined"]
      - out: ["string Sara", "string Sara"]
      - out: ["string Sara", "object an event object"]
      - out: ["string Sara", "!! TypeError"]
    answer: 3
    explain: |
      listener اول یک arrow function است که خودش `greet("Sara")` را صدا می‌زند، پس `name` رشته‌ی `"Sara"` است:
      `string Sara`. در listener دوم، خودِ `greet` ثبت شده و مرورگر هنگام کلیک آن را با **شیء رویداد** به‌عنوان
      اولین آرگومان صدا می‌زند؛ پس `name` یک شیء است (`typeof` برابر `"object"`) که نمونه‌ای از `Event` است.
      مرورگر حتماً آرگومان می‌فرستد، پس `undefined` نیست (رد گزینه‌ی ۱)، `"Sara"` هم به خاطر سپرده نمی‌شود (رد
      گزینه‌ی ۲)، و هیچ عملی در این کد روی شیء رویداد خطا نمی‌دهد (رد گزینه‌ی ۴). اگر `greet` می‌نوشت
      `"Hello " + name`، برای کلیک دوم چیزی مثل `Hello [object PointerEvent]` چاپ می‌شد.
  - level: medium
    stem: کاربر **سه بار** روی دکمه کلیک می‌کند. خروجی Console کدام است؟
    check: dom-output
    html: |
      <button id="btn">Go</button>
    code: |
      const btn = document.getElementById("btn");
      function handler() {
        console.log("clicked");
        btn.removeEventListener("click", handler);
      }
      btn.addEventListener("click", handler);
    events:
      - { type: click, target: "#btn", times: 3 }
    options:
      - out: ["clicked", "clicked", "clicked"]
      - out: "clicked"
      - out: ""
      - out: ["clicked", "!! TypeError"]
    answer: 2
    explain: |
      با کلیک اول، `handler` اجرا می‌شود، `clicked` را چاپ می‌کند و بعد **خودش** را با همان مرجع حذف می‌کند؛
      پس کلیک‌های دوم و سوم هیچ listenerی ندارند (رد گزینه‌ی ۱). حذف بعد از چاپ انجام شده، پس خروجی خالی
      نیست (رد گزینه‌ی ۳)، و حذف یک listener از داخل خودش کاملاً مجاز است (رد گزینه‌ی ۴). این رفتار معادل
      `{ once: true }` است.
  - level: easy
    stem: کدام عبارت درباره‌ی `btn.onclick = fn` درست است؟
    options:
      - 'فقط یک handler نگه می‌دارد و مقداردهی دوباره، handler قبلی را جایگزین می‌کند.'
      - 'مثل `addEventListener` همه‌ی handlerهای مقداردهی‌شده را پشت سر هم اجرا می‌کند.'
      - 'فقط داخل کد HTML قابل استفاده است.'
      - 'نام رویداد را باید بدون on نوشت، یعنی `btn.click = fn`.'
    answer: 1
    explain: |
      `onclick` یک property معمولی است و مثل هر property دیگری فقط یک مقدار دارد؛ مقداردهی دوم، اولی را پاک
      می‌کند (رد گزینه‌ی ۲). این property در JavaScript استفاده می‌شود و نسخه‌ی HTML آن attribute `onclick` است
      (رد گزینه‌ی ۳). «بدون on» قاعده‌ی `addEventListener` است؛ `btn.click` یک متد دیگر است (کلیک
      برنامه‌نویسی‌شده روی دکمه) و مقداردهی آن handler ثبت نمی‌کند (رد گزینه‌ی ۴).
  - level: hard
    stem: |
      صفحه بارگذاری می‌شود و سپس کاربر یک بار روی دکمه کلیک می‌کند. خروجی کامل Console کدام است؟
    check: dom-output
    html: |
      <button id="save" onclick="console.log(this.id)">Save</button>
    code: |
      const btn = document.getElementById("save");
      console.log(typeof btn.onclick, btn.getAttribute("onclick"));
      btn.addEventListener("click", () => console.log("listener"));
    events:
      - { type: click, target: "#save" }
    options:
      - out: ["string console.log(this.id)", "save", "listener"]
      - out: ["function console.log(this.id)", "undefined", "listener"]
      - out: ["function console.log(this.id)", "listener", "save"]
      - out: ["function console.log(this.id)", "save", "listener"]
    answer: 4
    explain: |
      مرورگر رشته‌ی attribute را به یک **تابع** تبدیل می‌کند و در property `onclick` می‌گذارد، پس `typeof`
      آن `"function"` است، در حالی که `getAttribute` همان متن خام را برمی‌گرداند (رد گزینه‌ی ۱). داخل handler
      attribute، `this` همان دکمه است و `save` چاپ می‌شود (رد گزینه‌ی ۲). این handler از هنگام parse شدن HTML
      ثبت شده، یعنی قبل از `addEventListener`، پس قبل از `listener` اجرا می‌شود (رد گزینه‌ی ۳).
  - level: medium
    stem: |
      صفحه فقط یک دکمه دارد:

      ```html
      <button id="save">Save</button>
      ```

      کد زیر در انتهای صفحه اجرا می‌شود. اجرای آن در کدام خط با خطا متوقف می‌شود؟

