  - level: medium
    stem: صفحه برای اولین بار باز شده (localStorage خالی است) و کاربر **سه بار** روی دکمه کلیک می‌کند. خروجی کدام است؟
    check: dom-output
    html: |
      <button id="toggle">Theme</button>
    code: |
      const saved = localStorage.getItem("theme");
      if (saved === "dark") document.body.classList.add("dark");

      document.getElementById("toggle").addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        console.log(localStorage.getItem("theme"));
      });
    events:
      - { type: click, target: "#toggle", times: 3 }
    options:
      - out: ["dark", "dark", "dark"]
      - out: ["true", "false", "true"]
      - out: ["light", "dark", "light"]
      - out: ["dark", "light", "dark"]
    answer: 4
    explain: |
      در ابتدا کلید `theme` وجود ندارد، پس کلاس `dark` اضافه نمی‌شود. هر کلیک کلاس را با `toggle` عوض می‌کند و وضعیت جدید (`true` یا `false`) را برمی‌گرداند؛ کد آن را به رشته‌ی `"dark"` یا `"light"` تبدیل و ذخیره می‌کند: تیره، روشن، تیره. گزینه‌ی ۱ فکر کرده `toggle` همیشه اضافه می‌کند، گزینه‌ی ۲ مقدار بولی را مستقیم ذخیره‌شده فرض کرده (ولی کد رشته‌ی `"dark"` یا `"light"` ذخیره می‌کند) و گزینه‌ی ۳ وضعیت شروع را تیره فرض کرده است.
