id: ch2-storage
title: "ذخیره‌سازی در مرورگر: localStorage و sessionStorage"
slides: "JS in HTML، اسلایدهای ۳۸ تا ۴۰"
lesson: |
  وقتی صفحه را reload (بارگذاری دوباره) می‌کنی، همه‌ی متغیرهای JavaScript از نو ساخته می‌شوند و صفحه همه‌چیز را «فراموش» می‌کند. اما خیلی وقت‌ها می‌خواهیم چیزی **بماند**: تم تیره‌ای که کاربر انتخاب کرده، زبان سایت، سبد خرید یا مرحله‌ای از فرم که کاربر در آن بود. مرورگر برای این کار دو شیء آماده دارد: **`localStorage`** و **`sessionStorage`**. هر دو property شیء `window` هستند (پس `window.localStorage` همان `localStorage` است) و به آن‌ها Web Storage (حافظه‌ی وب) می‌گویند.

  ::: analogy
  `localStorage` مثل کمد شخصی‌ات در یک باشگاه است: وسایلت تا وقتی خودت خالی‌اش نکنی می‌ماند، حتی اگر به خانه بروی و هفته‌ی بعد برگردی؛ و هر باشگاه (هر سایت) کمدهای خودش را دارد. `sessionStorage` مثل سینی روی میز رستوران است: تا پشت همان میز (همان تب) نشسته‌ای در دسترس است، ولی وقتی بلند شوی (تب را ببندی) جمعش می‌کنند؛ و میز کناری (تب دیگر) سینی جداگانه‌ی خودش را دارد.
  :::

  ### آنچه اسلایدهای ۳۸ و ۳۹ می‌گویند

  | ویژگی | `localStorage` (اسلاید ۳۸) | `sessionStorage` (اسلاید ۳۹) |
  |---|---|---|
  | هدف | ذخیره‌ی **ماندگار** (persistent) داده در مرورگر | ذخیره‌ی داده **فقط برای تب فعلی** |
  | شکل داده | جفت‌های کلید-مقدار با `setItem()` و `getItem()` | همان |
  | عمر داده | بعد از بستن تب و حتی بستن مرورگر **می‌ماند** | با بستن تب یا پنجره **پاک می‌شود** |
  | حجم | معمولاً حدود ۵ تا ۱۰ مگابایت برای هر سایت | معمولاً همان حدود ۵ تا ۱۰ مگابایت |
  | امنیت | سیاست same-origin: داده‌ی هر دامنه جداست | همان |
  | محدودیت‌ها | فقط رشته، همگام (synchronous)، **برای اطلاعات حساس امن نیست** | فقط رشته، همگام، برای اطلاعات حساس نیست |

  ### متدها (برای هر دو یکسان است)

  ```js
  localStorage.setItem("theme", "dark");   // save: add a new key or overwrite it
  localStorage.getItem("theme");           // "dark"
  localStorage.getItem("lang");            // null -> there is no such key
  localStorage.removeItem("theme");        // delete one key (no error if it is missing)
  localStorage.clear();                    // delete ALL keys of this site (localStorage only)
  localStorage.length;                     // how many keys are saved
  localStorage.key(0);                     // the NAME of the key at index 0 (or null)
  ```

  | عضو | کار | خروجی |
  |---|---|---|
  | `setItem(key, value)` | ذخیره (یا بازنویسی) | `undefined` |
  | `getItem(key)` | خواندن | رشته، یا `null` اگر کلید نباشد |
  | `removeItem(key)` | حذف یک کلید | `undefined` |
  | `clear()` | حذف همه‌ی کلیدهای همان حافظه | `undefined` |
  | `key(i)` | نامِ کلیدِ شماره‌ی `i` | رشته یا `null` |
  | `length` | تعداد کلیدها | عدد |

  `localStorage` و `sessionStorage` دو انبار **جدا** هستند: `localStorage.clear()` به sessionStorage دست نمی‌زند و `sessionStorage.setItem("step", "2")` در localStorage دیده نمی‌شود. نوشتن به شکل property (`localStorage.theme = "dark"`) هم کار می‌کند، ولی بهتر است همیشه از `setItem` و `getItem` استفاده کنی تا با نام متدها (مثل `length` و `key`) قاطی نشود.

  ### فقط رشته!

  هر مقداری که به `setItem` بدهی **قبل از ذخیره به رشته تبدیل می‌شود** و `getItem` همیشه رشته (یا `null`) برمی‌گرداند:

  ```js
  localStorage.setItem("count", 5);
  console.log(localStorage.getItem("count") + 1);    // "51" -> string concatenation

  localStorage.setItem("darkMode", false);
  if (localStorage.getItem("darkMode")) {
    console.log("runs!");   // "false" is a non-empty string, so it is truthy
  }

  localStorage.setItem("user", { name: "Ali" });
  console.log(localStorage.getItem("user"));         // "[object Object]" -> the data is lost

  localStorage.setItem("nums", [1, 2, 3]);
  console.log(localStorage.getItem("nums"));         // "1,2,3"
  ```

  | چیزی که ذخیره می‌کنی | چیزی که برمی‌گردد |
  |---|---|
  | `5` | `"5"` |
  | `false` | `"false"` (یک رشته‌ی غیرخالی، پس truthy؛ یعنی در شرط «درست» حساب می‌شود) |
  | `null` | `"null"` |
  | `{ name: "Ali" }` | `"[object Object]"` |
  | `[1, 2, 3]` | `"1,2,3"` |

  #### الگوی درست: JSON

  برای شیء و آرایه، همان‌طور که در درس JSON فصل اول دیدیم، قبل از ذخیره `JSON.stringify` و بعد از خواندن `JSON.parse` می‌کنیم:

  ```js
  const user = { name: "Ali", age: 20 };
  localStorage.setItem("user", JSON.stringify(user));      // '{"name":"Ali","age":20}'
  const saved = JSON.parse(localStorage.getItem("user"));  // a real object again
  console.log(saved.age + 1);                              // 21 -> age is a number again
  ```

  وقتی معلوم نیست کلید وجود دارد یا نه:

  ```js
  const cart = JSON.parse(localStorage.getItem("cart")) || [];  // JSON.parse(null) is null -> []
  ```

  برای عدد از `Number()` و برای بولی از مقایسه با رشته استفاده کن:

  ```js
  const visits = Number(localStorage.getItem("visits")) + 1;   // Number(null) is 0
  localStorage.setItem("visits", visits);
  console.log("You have visited this page " + visits + " times");

  const isDark = localStorage.getItem("darkMode") === "true";  // compare with the string
  ```

  ### همگام (synchronous)

  `setItem` و `getItem` همگام‌اند: کارشان قبل از رفتن به خط بعد تمام می‌شود و برای خواندن مقدار، نه `await` لازم است نه callback. اما چون روی رشته‌ی اصلی (main thread) اجرا می‌شوند، ذخیره‌ی داده‌ی خیلی بزرگ می‌تواند صفحه را لحظه‌ای کُند کند؛ داده را کوچک نگه دار.

  ### سیاست same-origin

  **origin** (مبدأ) یعنی ترکیب **پروتکل + میزبان (دامنه) + پورت**. هر origin انبار localStorage و sessionStorage **جداگانه**‌ی خودش را دارد و هیچ سایتی نمی‌تواند داده‌ی سایت دیگر را بخواند. مسیر (path) صفحه مهم نیست:

  | دو آدرس | origin یکسان؟ |
  |---|---|
  | `https://site.com/a.html` و `https://site.com/blog/b.html` | **بله**؛ فقط مسیر فرق دارد |
  | `http://site.com` و `https://site.com` | خیر؛ پروتکل فرق دارد |
  | `https://site.com` و `https://shop.site.com` | خیر؛ میزبان فرق دارد |
  | `https://site.com` و `https://site.com:8080` | خیر؛ پورت فرق دارد |

  ### عمر داده و تب‌ها

  | موقعیت | `localStorage` | `sessionStorage` |
  |---|---|---|
  | reload در همان تب | می‌ماند | **می‌ماند** |
  | بستن تب یا پنجره | می‌ماند | پاک می‌شود |
  | بستن کل مرورگر و باز کردن فردا | می‌ماند | پاک شده است |
  | باز کردن همان سایت در تب جدید (با تایپ آدرس) | **مشترک** است؛ همان داده دیده می‌شود | تب جدید sessionStorage **خالیِ خودش** را دارد |
  | تا کی؟ | تا وقتی کد یا خودِ کاربر (پاک کردن داده‌های مرورگر) حذفش کند؛ تاریخ انقضا ندارد | تا وقتی آن تب باز است |

  ### امنیت: جای اطلاعات حساس نیست

  - داده‌ها **رمزنگاری نمی‌شوند** و هر کسی که به مرورگر دسترسی دارد می‌تواند آن‌ها را در DevTools (ابزار توسعه‌دهنده‌ی مرورگر، بخش Application یا Storage) ببیند یا تغییر دهد.
  - **هر** کد JavaScriptی که در صفحه اجرا شود می‌تواند همه‌ی داده‌ها را بخواند؛ از جمله کدی که مهاجم با حمله‌ی XSS (Cross-Site Scripting؛ تزریق اسکریپت مخرب به صفحه‌ی یک سایت) وارد صفحه کرده است.
  - پس رمز عبور، شماره‌ی کارت بانکی و اطلاعات محرمانه را آن‌جا نگذار و به مقدارهایش (مثلاً `isAdmin: true`) برای تصمیم‌های امنیتی اعتماد نکن.

  ### نمونه‌ی کاربردی ۱: به خاطر سپردن تم تیره (localStorage)

  ```js
  const btn = document.getElementById("toggle");
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");   // restore the saved choice when the page loads
  }
  btn.addEventListener("click", () => {
    const isDark = document.body.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });
  ```

  ### نمونه‌ی کاربردی ۲: فرم چندمرحله‌ای (sessionStorage)

  ```js
  // remember the progress of this tab only
  sessionStorage.setItem("signup-step", "2");
  sessionStorage.setItem("signup-name", "Sara");

  // after a reload in the same tab, continue where the user left off
  const step = sessionStorage.getItem("signup-step") || "1";
  console.log("Show step " + step);   // "Show step 2"
  ```

  ### فعالیت کلاسی اسلاید ۴۰

  **۱. تفاوت اصلی localStorage و sessionStorage چیست؟** **عمر و دامنه‌ی داده.** داده‌ی localStorage تاریخ انقضا ندارد، بعد از بستن تب و مرورگر هم می‌ماند و بین همه‌ی تب‌های همان origin مشترک است. داده‌ی sessionStorage فقط مال همان یک تب است و با بستن تب یا پنجره پاک می‌شود. بقیه‌ی ویژگی‌ها مشترک‌اند: API یکسان، سیاست same-origin، فقط رشته، همگام، حدود ۵ تا ۱۰ مگابایت و نامناسب برای داده‌ی حساس.

  **۲. یک مثال برای localStorage:** به خاطر سپردن تم تیره یا روشن، زبان انتخابی کاربر، سبد خرید یا لیست کارهایی که باید تا بازدید بعدی بماند، یا گزینه‌ی «این راهنما را دوباره نشان نده».

  **۳. یک مثال برای sessionStorage:** پیشرفت یک فرم چندمرحله‌ای در همان تب، فیلترها و جست‌وجوی موقتی که با بستن تب باید پاک شود، پیام خوش‌آمدی که در هر بازدید فقط یک بار نمایش داده شود، یا وضعیتی که هر تب باید جدا داشته باشد.

  ::: tip
  - `setItem` و `getItem`، و برای حذف `removeItem` و `clear`؛ کلید ناموجود ← `null`.
  - شیء و آرایه را با `JSON.stringify` ذخیره و با `JSON.parse` بخوان؛ برای مقدار شاید ناموجود: `JSON.parse(localStorage.getItem("key")) || []`.
  - ماندگار و مشترک بین تب‌ها ← `localStorage`؛ موقت و مخصوص یک تب ← `sessionStorage`.
  :::

  ::: trap
  - `setItem("count", 5)` ← `getItem("count") + 1` می‌شود `"51"`.
  - `setItem("flag", false)` ← `"false"` که در `if` **درست** (truthy) حساب می‌شود.
  - ذخیره‌ی مستقیم شیء ← `"[object Object]"` و داده از دست می‌رود.
  - `getItem` برای کلید ناموجود `null` برمی‌گرداند، نه `undefined`.
  - sessionStorage با reload پاک **نمی‌شود**؛ با بستن تب پاک می‌شود.
  - localStorage تاریخ انقضا ندارد؛ خودبه‌خود (مثلاً بعد از ۲۴ ساعت) پاک نمی‌شود.
  - `http://` و `https://` یک سایت، یا دو پورت متفاوت، origin جدا و انبار جدا دارند.
  - رمز عبور و اطلاعات حساس را هرگز در Web Storage نگذار (XSS می‌تواند همه را بخواند).
  :::

  ::: summary
  دو انبار کلید-مقدار در `window`، با API یکسان (`setItem`، `getItem`، `removeItem`، `clear`، `key`، `length`)، فقط رشته، همگام، حدود ۵ تا ۱۰ مگابایت، جدا برای هر origin و ناامن برای داده‌ی حساس. فرق اصلی: `localStorage` ماندگار و مشترک بین تب‌ها؛ `sessionStorage` فقط برای همان تب و تا بسته شدن آن.
  :::
questions:
  - level: easy
    stem: طبق فعالیت کلاسی اسلاید ۴۰، تفاوت **اصلی** `localStorage` و `sessionStorage` چیست؟
    options:
      - '`localStorage` فقط عدد ذخیره می‌کند ولی `sessionStorage` فقط رشته.'
      - داده‌ی `localStorage` بعد از بستن تب و حتی مرورگر می‌ماند و بین تب‌های همان origin مشترک است، ولی داده‌ی `sessionStorage` فقط مال همان تب است و با بستن تب پاک می‌شود.
      - '`localStorage` ناهمگام (asynchronous) است ولی `sessionStorage` همگام.'
      - '`sessionStorage` از سیاست same-origin پیروی نمی‌کند ولی `localStorage` می‌کند.'
    answer: 2
    explain: |
      فرق اصلی در **عمر و دامنه‌ی** داده است: localStorage ماندگار و بین تب‌های یک origin مشترک است و sessionStorage مخصوص یک تب و تا بسته شدن آن. بقیه‌ی ویژگی‌ها یکسان‌اند: هر دو فقط رشته ذخیره می‌کنند (گزینه‌ی ۱ غلط)، هر دو همگام‌اند (گزینه‌ی ۳ غلط) و هر دو از سیاست same-origin پیروی می‌کنند (گزینه‌ی ۴ غلط).

  - level: easy
    stem: کاربری در یک سایت مقدار `theme` را هم در `localStorage` و هم در `sessionStorage` ذخیره می‌کند. سپس **کل مرورگر را می‌بندد** و فردا دوباره همان سایت را باز می‌کند. کدام مقدار هنوز وجود دارد؟
    options:
      - فقط مقدار `localStorage`
      - فقط مقدار `sessionStorage`
      - هر دو
      - هیچ‌کدام
    answer: 1
    explain: |
      طبق اسلاید ۳۸ داده‌ی localStorage بعد از بستن تب و مرورگر هم می‌ماند (تاریخ انقضا ندارد)، ولی طبق اسلاید ۳۹ داده‌ی sessionStorage با بستن تب یا پنجره پاک می‌شود. پس فقط مقدار localStorage باقی است. گزینه‌ی ۲ نقش دو حافظه را برعکس کرده و گزینه‌های ۳ و ۴ تفاوت عمر آن‌ها را نادیده گرفته‌اند.

  - level: medium
    stem: کاربر در یک تب مقداری را در `sessionStorage` ذخیره می‌کند و سپس صفحه را در **همان تب** reload (بارگذاری دوباره) می‌کند. آن مقدار چه می‌شود؟
    options:
      - پاک می‌شود، چون `sessionStorage` فقط تا reload بعدی دوام دارد.
      - به `localStorage` منتقل می‌شود.
      - باقی می‌ماند، چون تب هنوز بسته نشده است.
      - فقط در صورتی می‌ماند که با `JSON.stringify` ذخیره شده باشد.
    answer: 3
    explain: |
      عمر sessionStorage به **تب** بسته است، نه به یک بار بارگذاری صفحه؛ تا تب باز است داده با reload هم می‌ماند و فقط بستن تب یا پنجره آن را پاک می‌کند. گزینه‌ی ۱ اشتباه رایج است، گزینه‌ی ۲ بی‌پایه است (دو انبار کاملاً جدا هستند) و گزینه‌ی ۴ غلط است چون `JSON.stringify` فقط شکل رشته را تعیین می‌کند و ربطی به عمر داده ندارد.

  - level: hard
    stem: 'کاربر سایت `https://shop.example.com` را در تب A باز کرده و این دو دستور را اجرا می‌کند: `localStorage.setItem("y", "1")` و `sessionStorage.setItem("x", "1")`. سپس یک تب **جدید** (B) باز می‌کند و همان آدرس را **تایپ** می‌کند. در تب B کدام مقدار قابل خواندن است؟'
    options:
      - هم `x` و هم `y`
      - هیچ‌کدام
      - فقط `x`
      - فقط `y`
    answer: 4
    explain: |
      localStorage بین **همه‌ی تب‌ها و پنجره‌های** یک origin مشترک است، پس `y` در تب B هم دیده می‌شود. sessionStorage علاوه بر origin به **تب** هم وابسته است و تب B که جداگانه باز شده sessionStorage خالیِ خودش را دارد؛ پس `x` آن‌جا نیست. گزینه‌ی ۱ sessionStorage را مشترک دانسته، گزینه‌ی ۲ localStorage را هم مخصوص تب فرض کرده و گزینه‌ی ۳ نقش دو حافظه را برعکس کرده است.

  - level: easy
    stem: خروجی کد زیر کدام است؟ (فرض کن localStorage این سایت در ابتدا خالی است.)
    check: dom-output
    code: |
      localStorage.setItem("theme", "dark");
      console.log(localStorage.getItem("theme"));
      console.log(localStorage.getItem("lang"));
    options:
      - out: ["dark", "undefined"]
      - out: ["dark", "null"]
      - out: ["theme", "null"]
      - out: ["dark", "false"]
    answer: 2
    explain: |
      `getItem` مقدار ذخیره‌شده (`"dark"`) را برمی‌گرداند و برای کلیدی که وجود ندارد مقدار **`null`** می‌دهد. گزینه‌ی ۱ اشتباه رایج است (`undefined` مال خواندن property ناموجود از یک شیء معمولی است)، گزینه‌ی ۳ نام کلید را با مقدار اشتباه گرفته و گزینه‌ی ۴ فکر کرده کلید ناموجود `false` برمی‌گرداند.

  - level: easy
    stem: خروجی کد زیر کدام است؟ (هر دو حافظه در ابتدا خالی‌اند.)
    check: dom-output
    code: |
      sessionStorage.setItem("step", "2");
      console.log(sessionStorage.getItem("step"), localStorage.getItem("step"));
    options:
      - out: "2 2"
      - out: "null 2"
      - out: "2 null"
      - out: "2 undefined"
    answer: 3
    explain: |
      localStorage و sessionStorage دو انبار **جدا** هستند؛ ذخیره در یکی، در دیگری دیده نمی‌شود. پس sessionStorage مقدار `"2"` را دارد و localStorage برای این کلید `null` برمی‌گرداند. گزینه‌ی ۱ دو حافظه را یکی دانسته، گزینه‌ی ۲ نقششان را برعکس کرده و گزینه‌ی ۴ فراموش کرده کلید ناموجود `null` می‌دهد.

  - level: medium
    stem: خروجی کد زیر کدام است؟
    check: dom-output
    code: |
      localStorage.setItem("x", "1");
      console.log(localStorage.getItem("x"));
      console.log(localStorage.setItem("y", "2"));
    options:
      - out: ["1", "undefined"]
      - out: ["null", "undefined"]
      - out: ["1", "true"]
      - out: ["1", "y"]
    answer: 1
    explain: |
