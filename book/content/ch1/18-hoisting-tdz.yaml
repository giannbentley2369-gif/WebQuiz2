      - 'همه‌ی متغیرها را با `var` تعریف کنیم تا هیچ‌وقت `ReferenceError` نگیریم.'
      - 'همه‌ی تعریف‌ها را عمداً پایین فایل بنویسیم، چون به هر حال hoist می‌شوند.'
      - 'قبل از خواندن هر متغیر، آن را با `typeof` بررسی کنیم؛ چون `typeof` هیچ‌وقت خطا نمی‌دهد.'
    answer: 1
    explain: |
      تعریف همه‌چیز با `const`/`let` در بالای scope و پیش از استفاده باعث می‌شود ترتیب نوشتن کد با ترتیب واقعی اجرا یکی باشد، و اگر جایی اشتباهاً زودتر از متغیری استفاده کنی، خطای واضح `ReferenceError` بگیری. گزینه‌ی ۲ خطا را حذف نمی‌کند، بلکه آن را به یک `undefined` بی‌صدا و باگ پنهان تبدیل می‌کند (همان مشکل `var` در اسلاید ۲۷). گزینه‌ی ۳ ترتیب کد را گیج‌کننده‌تر می‌کند و برای `let`، `const` و `class` خطا می‌دهد. گزینه‌ی ۴ غلط است، چون `typeof` روی متغیری که در TDZ است خطا می‌دهد.
