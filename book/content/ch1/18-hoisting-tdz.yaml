      خط ۱ یک `var` را قبل از تعریف می‌خواند: `undefined` و بدون خطا. خط ۲ یک function declaration را صدا می‌زند که کامل hoist شده است و `b` چاپ می‌شود. خط ۳ متغیر `c` را می‌خواند که با `let` در خط ۸ تعریف شده و هنوز در TDZ است: `ReferenceError`. پس اولین (و تنها) خطا روی خط ۳ است.

  - level: easy
    stem: |
      اسلاید ۳۸ هشدار می‌دهد که hoisting اگر بد استفاده شود، ترتیب کد را گیج‌کننده می‌کند. کدام عادت بیشترین کمک را برای پرهیز از این مشکل می‌کند؟
    options:
