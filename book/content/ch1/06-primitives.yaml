      رشته‌ها primitive و **تغییرناپذیر** هستند؛ `word[0] = "b"` نمی‌تواند حرفی از رشته را عوض کند و در حالت عادی بی‌صدا نادیده گرفته می‌شود (در حالت strict خطای `TypeError` می‌دهد). پس اول `cat` چاپ می‌شود. اما `word = "bat"` خود متغیر `let` را به رشته‌ی **جدیدی** وصل می‌کند که مجاز است. گزینه‌ی ۲ رشته را قابل‌تغییر فرض کرده و گزینه‌ی ۴ انتساب دوباره را هم ممنوع پنداشته است.

  - level: hard
    stem: |
      کدام گزینه درباره‌ی نوع `number` درست است؟
    check: claims
    options:
      - text: 'برای اعداد اعشاری نوع جداگانه‌ای وجود دارد و `typeof 5.5` برابر `"float"` است.'
        expr: 'typeof 5.5'
        equals: '"float"'
      - text: '`5` و `5.0` دو مقدار از دو نوع متفاوت‌اند و `5 === 5.0` برابر `false` است.'
        expr: '5 === 5.0'
        equals: 'false'
      - text: 'نوشتن عددی بزرگ‌تر از `Number.MAX_SAFE_INTEGER` بدون پسوند `n`، خطای `RangeError` می‌دهد.'
        expr: '(() => { try { return eval("9007199254740993"); } catch (e) { return e.name; } })()'
        equals: '"RangeError"'
      - text: 'اعداد صحیح و اعشاری هر دو از یک نوع `number` هستند؛ `typeof 5` و `typeof 5.5` هر دو `"number"` است.'
        expr: 'typeof 5 === "number" && typeof 5.5 === "number"'
        equals: 'true'
    answer: 4
    explain: |
      اسلاید ۱۶: `number` شامل اعداد صحیح **و** اعشاری است؛ JavaScript نوع جداگانه‌ی `int` یا `float` ندارد و `5 === 5.0` برابر `true` است (رد گزینه‌های ۱ و ۲). نوشتن عدد بزرگ‌تر از حد امن خطا نمی‌دهد، فقط **دقتش از دست می‌رود** (`9007199254740993` به `9007199254740992` گرد می‌شود)؛ برای همین گزینه‌ی ۳ غلط است و برای دقت باید از BigInt استفاده کرد.
