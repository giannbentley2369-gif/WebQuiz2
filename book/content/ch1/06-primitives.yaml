id: ch1-primitives
title: "انواع داده: Primitiveها و Objectها"
slides: "Introduction to JS، اسلایدهای ۱۵ تا ۱۷"
lesson: |
  فرض کن یک جعبه‌ی لگو داری. بعضی چیزها **تک‌آجر** هستند: یک آجر قرمز، یک آجر آبی؛ ساده، تجزیه‌ناپذیر و همان‌طور که هستند. بعضی چیزها **سازه** هستند: یک ماشین که از چند آجر ساخته شده، هر قسمتش اسمی دارد (چرخ، سقف، در) و می‌توانی قسمت‌هایش را عوض کنی. داده‌ها در JavaScript هم همین‌طورند:

  - **primitive** (مقدار پایه یا اولیه): یک مقدار ساده و تکی، مثل عدد `42` یا رشته‌ی `"Ali"`.
  - **object** (شیء): مجموعه‌ای از مقدارها که هر کدام یک نام (کلید) دارند، مثل یک کارت دانشجویی که نام، سن و درس‌ها را با هم نگه می‌دارد.

  ### داده‌ها در JavaScript (اسلاید ۱۵)

  - داده دو گروه اصلی دارد: **هر چیزی یا primitive است یا object.**
  - JavaScript **۷ نوع داده‌ی primitive** دارد: `number`، `string`، `boolean`، `undefined`، `null`، `Symbol` و `BigInt`. (با object، روی هم ۸ نوع داده می‌شود.)
  - متغیرها می‌توانند **هر نوعی** را نگه دارند و نوعشان در زمان اجرا عوض شود؛ به این **dynamic typing** (نوع‌دهی پویا) می‌گویند.
  - آرایه‌ها (arrays)، توابع (functions) و حتی تاریخ‌ها (dates) در واقع **objectهای خاص** هستند.
  - تبدیل نوع‌ها یا **خودکار** انجام می‌شود که به آن **coercion** (تبدیل ضمنی) می‌گویند، یا **صریح** و به دستور ما که به آن **casting** (تبدیل صریح) می‌گویند؛ مثلاً `"5" * 2` خودکار به `10` می‌رسد، ولی `Number("5")` صریحاً رشته را عدد می‌کند. جزئیات این دو را در درس‌های Casting و Type coercion می‌بینیم.

  ```js
  let value = 7;     // number
  value = "seven";   // now a string
  value = true;      // now a boolean (dynamic typing)
  ```

  ### هفت primitive (اسلاید ۱۶)

  | نوع | توضیح اسلاید ۱۶ | مثال | نتیجه‌ی `typeof` |
  |---|---|---|---|
  | `number` | اعداد صحیح و اعشاری (floating-point) | `42`، `3.14`، `-7` | `"number"` |
  | `string` | دنباله‌ای از کاراکترها داخل علامت نقل‌قول | `"Ali"`، `'Ali'`، `` `Ali` `` | `"string"` |
  | `boolean` | فقط `true` یا `false` | `true` | `"boolean"` |
  | `undefined` | متغیری که تعریف شده ولی مقدار نگرفته | `let x;` | `"undefined"` |
  | `null` | نبودِ **عمدیِ** مقدار | `let car = null;` | `"object"` (اشتباه تاریخی) |
  | `Symbol` | شناسه‌ی یکتا و تغییرناپذیر | `Symbol("id")` | `"symbol"` |
  | `BigInt` | اعداد صحیح بزرگ‌تر از `Number.MAX_SAFE_INTEGER` | `10n` | `"bigint"` |

  #### `number`
  JavaScript برخلاف Java یا C نوع جداگانه‌ای برای اعداد صحیح (`int`) و اعشاری (`float`/`double`) ندارد؛ **همه‌ی اعداد از یک نوع `number` هستند**. برای همین `5 === 5.0` برابر `true` است. سه مقدار ویژه هم از نوع `number` هستند: `Infinity`، `-Infinity` و `NaN` (مخفف Not a Number، یعنی «عدد نیست»؛ نتیجه‌ی محاسبه‌های بی‌معنی مثل `0 / 0` یا `"abc" * 2`). جالب است که `typeof NaN` برابر `"number"` است!

  #### `string`
  متن داخل علامت نقل‌قول: تک‌کوتیشن `'...'`، دابل‌کوتیشن `"..."` یا backtick (بک‌تیک) `` `...` ``. هر سه یک نوع `string` می‌سازند. JavaScript نوع جداگانه‌ای برای یک کاراکتر (مثل `char` در Java) ندارد؛ `'a'` یک رشته به طول ۱ است. رشته‌های backtick را در درس «رشته‌ها و Template literals» کامل می‌بینیم.

  #### `boolean`
  فقط دو مقدار دارد: `true` و `false`. نتیجه‌ی مقایسه‌ها از این نوع است: `5 > 3` برابر `true` است.

  #### `undefined` و `null`
  هر دو یعنی «مقداری نیست»، ولی فرقشان در **این است که چه کسی** آن را گذاشته:

  | | `undefined` | `null` |
  |---|---|---|
  | معنی | هنوز مقداری داده نشده | عمداً «خالی» گذاشته شده |
  | چه کسی می‌گذارد؟ | خود JavaScript (متغیر بی‌مقدار، کلید ناموجود در شیء) | برنامه‌نویس |
  | `typeof` | `"undefined"` | `"object"` |
  | در محاسبه (پیش‌نمایش) | `undefined + 1` برابر `NaN` | `null + 1` برابر `1` |

  ```js
  let a;               // JavaScript puts undefined here
  let car = null;      // we say: "no car selected yet"
  console.log(a, car); // undefined null
  ```

  ::: analogy
  `undefined` مثل کشوی میزی است که هیچ‌کس هنوز سراغش نرفته؛ `null` مثل کشویی است که رویش یادداشت گذاشته‌ای: «عمداً خالی است».
  :::

  #### `Symbol`
  `Symbol("id")` هر بار یک مقدار **کاملاً جدید و یکتا** می‌سازد. متن `"id"` فقط یک برچسب توضیحی برای خودمان است؛ پس دو Symbol با یک برچسب، با هم برابر نیستند. Symbolها تغییرناپذیرند (immutable) و معمولاً به‌عنوان **کلید ویژگی‌های شیء** به کار می‌روند تا با هیچ کلید دیگری تداخل نکنند:

  ```js
  const id = Symbol("id");
  const user = { name: "Ali", [id]: 123 }; // [id] means: use the symbol as the key
  console.log(user[id]);     // 123
  console.log(user["id"]);   // undefined (the string "id" is a different key)
  console.log(Symbol("id") === Symbol("id")); // false
  ```

  #### `BigInt`
  نوع `number` اعداد صحیح را فقط تا `Number.MAX_SAFE_INTEGER` یعنی `9007199254740991` (برابر 2<sup>53</sup> منهای ۱) **دقیق** نگه می‌دارد. بالاتر از آن، دقت از دست می‌رود و دو عدد متفاوت یکی دیده می‌شوند:

  ```js
  console.log(Number.MAX_SAFE_INTEGER);               // 9007199254740991
  console.log(Number.MAX_SAFE_INTEGER + 2);           // 9007199254740992 (wrong!)
  console.log(9007199254740992 === 9007199254740993); // true (precision lost)
  ```

  برای اعداد صحیحِ بزرگ از **BigInt** استفاده می‌کنیم: کافی است آخر عدد یک `n` بگذاریم (یا از `BigInt("...")` استفاده کنیم):

  ```js
  const big = 9007199254740993n;
  console.log(big + 2n);    // 9007199254740995n (exact)
  console.log(typeof big);  // bigint
  console.log(7n / 2n);     // 3n (BigInt has no decimals)
  console.log(10n + 5);     // TypeError: Cannot mix BigInt and other types, use explicit conversions
  console.log(10n + BigInt(5)); // 15n
  console.log(Number(10n) + 5); // 15
  ```

  پس BigInt و number را **نمی‌شود مستقیم با هم قاطی کرد**؛ باید اول یکی را صریحاً به نوع دیگر تبدیل کنی.

  ### عملگر `typeof`
  `typeof` (عملگر «نوعِ این مقدار چیست؟») نام نوع یک مقدار را به‌صورت یک **رشته‌ی حروف کوچک** برمی‌گرداند. این جدول را خوب حفظ کن؛ تست‌های زیادی از آن طرح می‌شود:

  | عبارت | نتیجه | نکته |
  |---|---|---|
  | `typeof 42` و `typeof 3.14` | `"number"` | صحیح و اعشاری یک نوع‌اند |
  | `typeof NaN` | `"number"` | NaN هم عدد حساب می‌شود! |
  | `typeof "hi"` | `"string"` | |
  | `typeof true` | `"boolean"` | |
  | `typeof undefined` | `"undefined"` | |
  | `typeof notDeclaredYet` | `"undefined"` | متغیر تعریف‌نشده؛ **خطا نمی‌دهد** |
  | `typeof null` | `"object"` | اشتباه تاریخی |
  | `typeof Symbol("id")` | `"symbol"` | با حرف کوچک |
  | `typeof 10n` | `"bigint"` | با حرف کوچک |
  | `typeof {}` | `"object"` | |
  | `typeof []` | `"object"` | آرایه هم object است |
  | `typeof new Date()` | `"object"` | تاریخ هم object است |
  | `typeof function () {}` | `"function"` | تابع object است، ولی typeof می‌گوید `"function"` |
  | `typeof typeof 42` | `"string"` | خروجی typeof همیشه رشته است |

  - `typeof null` برابر `"object"` است؛ این یک اشتباه قدیمی از نسخه‌ی اول JavaScript است که برای این‌که کدهای قدیمی خراب نشوند، هیچ‌وقت اصلاح نشد. برای تشخیص `null` بنویس `value === null`.
  - چون `typeof []` هم `"object"` است، برای تشخیص آرایه از `Array.isArray(value)` استفاده کن: `Array.isArray([1, 2])` برابر `true` و `Array.isArray({})` برابر `false` است.
  - `typeof` روی متغیری که اصلاً تعریف نشده خطا نمی‌دهد و `"undefined"` برمی‌گرداند، ولی **استفاده‌ی مستقیم** از همان متغیر (مثلاً `console.log(price)`) خطای `ReferenceError` می‌دهد.

  ### Objectها، آرایه‌ها و توابع (اسلاید ۱۷)

  - **Objectها** داده‌ها و رفتارهای مرتبط را به شکل **جفت‌های کلید-مقدار (key-value pairs)** کنار هم نگه می‌دارند.
  - Objectها می‌توانند objectهای دیگر، آرایه‌ها یا توابع را **درون خود** داشته باشند (تودرتو یا nested).
  - **آرایه‌ها** مجموعه‌هایی **مرتب** هستند که با **اندیس عددی** (index، شماره‌ی خانه که از ۰ شروع می‌شود) به خانه‌هایشان دسترسی داریم.
  - آرایه‌ها **متدهای آماده (built-in methods)** دارند، «مثل Java»؛ مثلاً `push` برای اضافه کردن به انتها. (درس‌های «آرایه‌ها» و «متدهای آرایه» را ببین.)
  - **توابع first-class object هستند** (شهروند درجه‌یک): می‌شود آن‌ها را در متغیر **ذخیره** کرد، به تابع دیگر **پاس داد** و از یک تابع **برگرداند**.
  - توابع می‌توانند **متد یک object** باشند یا به‌صورت **مستقل** (standalone) نوشته شوند.

  ```js
  const student = {
    name: "Sara",                 // key: name, value: a string
    age: 20,                      // number
    courses: ["Web", "AI"],       // nested array
    address: { city: "Tehran" },  // nested object
    greet: function () {          // a function stored in an object = a method
      console.log("Hello!");
    },
  };

  console.log(student.name);         // Sara
  console.log(student.courses[1]);   // AI (indices start at 0)
  console.log(student.address.city); // Tehran
  student.greet();                   // Hello!
  console.log(student.phone);        // undefined (no such key)
  ```

  و این هم سه کاری که «first-class» بودن توابع ممکن می‌کند:

  ```js
  function double(n) {          // a standalone function
    return n * 2;
  }
  const f = double;             // 1) stored in a variable
  function applyTwice(fn, x) {  // 2) passed as an argument
    return fn(fn(x));
  }
  console.log(applyTwice(f, 3)); // 12
  function makeGreeter() {       // 3) returned from a function
    return function () {
      return "Hi!";
    };
  }
  console.log(makeGreeter()());  // Hi!
  ```

  ### primitive در برابر object: کپی و مقایسه (پیش‌نمایش)

  **primitiveها تغییرناپذیرند (immutable).** نمی‌شود یک حرف از یک رشته را عوض کرد؛ متدهایی مثل `toUpperCase()` یک رشته‌ی **جدید** می‌سازند:

  ```js
  let s = "cat";
  s[0] = "b";                      // silently ignored (TypeError in strict mode)
  console.log(s);                  // cat
  console.log(s.toUpperCase(), s); // CAT cat
  ```

  (البته خود متغیر `let` را می‌توانی به رشته‌ی دیگری وصل کنی: `s = "bat"`؛ تغییرناپذیر بودن یعنی خود مقدار عوض نمی‌شود.)

  **کپی:** وقتی یک primitive را در متغیر دیگری می‌ریزی، **خود مقدار** کپی می‌شود؛ ولی وقتی یک object را می‌ریزی، فقط **نشانی (reference)** آن کپی می‌شود و هر دو متغیر به **همان یک شیء** اشاره می‌کنند:

  ```js
  let a = 10;
  let b = a;     // b gets a copy of the value
  b = 20;
  console.log(a); // 10

  const obj1 = { score: 10 };
  const obj2 = obj1;  // both names point to the SAME object
  obj2.score = 20;
  console.log(obj1.score); // 20
  ```

  **مقایسه:** primitiveها با **مقدار** مقایسه می‌شوند و objectها با **نشانی**. دو آرایه یا دو شیء جداگانه، حتی با محتوای یکسان، برابر نیستند:

  ```js
  console.log("web" === "web");   // true  (same value)
  console.log([1, 2] === [1, 2]); // false (two different arrays)
  console.log({} === {});         // false (two different objects)
  ```

  ::: tip
  - خروجی `typeof` همیشه رشته‌ای با **حروف کوچک** است: `"bigint"` (نه `"BigInt"`) و `"symbol"` (نه `"Symbol"`).
  - برای آرایه از `Array.isArray` و برای `null` از `=== null` استفاده کن؛ `typeof` برای هر دو `"object"` می‌گوید.
  - برای اعداد صحیح بزرگ‌تر از `9007199254740991` از BigInt (پسوند `n`) استفاده کن و BigInt را با number قاطی نکن.
  :::

  ::: trap
  - `typeof null` برابر `"object"`، `typeof []` برابر `"object"`، `typeof NaN` برابر `"number"` و `typeof function () {}` برابر `"function"` است.
  - `typeof x` برای متغیر تعریف‌نشده `"undefined"` می‌دهد و **خطا نمی‌دهد**، ولی خواندن مستقیم `x` خطای `ReferenceError` می‌دهد.
  - `Symbol("id") === Symbol("id")` برابر `false` است؛ هر Symbol یکتاست، حتی با برچسب یکسان.
  - `9007199254740992 === 9007199254740993` برابر `true` است (از دست رفتن دقت) و `10n + 5` خطای `TypeError` می‌دهد.
  - `[1, 2] === [1, 2]` و `{} === {}` هر دو `false` هستند؛ objectها با نشانی مقایسه می‌شوند، نه محتوا.
  :::

  ::: summary
  - هر چیزی یا primitive است یا object. ۷ primitive: `number`، `string`، `boolean`، `undefined`، `null`، `Symbol`، `BigInt`.
  - آرایه، تابع و تاریخ objectهای خاص‌اند. objectها جفت‌های کلید-مقدارند و می‌توانند تودرتو باشند. توابع first-class هستند.
  - `undefined` را JavaScript می‌گذارد و `null` را برنامه‌نویس. Symbol یکتاست. BigInt برای اعداد صحیح خیلی بزرگ است.
  - primitiveها تغییرناپذیرند و با مقدار کپی و مقایسه می‌شوند؛ objectها با نشانی (reference).
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۱۵، JavaScript چند نوع داده‌ی **primitive** دارد؟
    options:
      - '۵'
      - '۶'
      - '۷'
      - '۸'
    answer: 3
    explain: |
      هفت primitive داریم: `number`، `string`، `boolean`، `undefined`، `null`، `Symbol` و `BigInt`. عدد ۸ تعداد کل انواع داده است، یعنی ۷ primitive به‌علاوه‌ی object. عدد ۶ مربوط به قبل از اضافه شدن BigInt (ES2020) و عدد ۵ مربوط به قبل از Symbol (ES6) است.

  - level: easy
    stem: |
      کدام مورد از انواع **primitive** در JavaScript **نیست**؟
    options:
      - '`Symbol`'
      - '`BigInt`'
      - '`null`'
      - 'آرایه (Array)'
    answer: 4
    explain: |
      طبق اسلاید ۱۵، آرایه‌ها (و توابع و تاریخ‌ها) objectهای خاص هستند، نه primitive؛ برای همین `typeof [1, 2]` برابر `"object"` است. `Symbol`، `BigInt` و `null` هر سه جزو ۷ primitive اسلاید ۱۶ هستند؛ این‌که `typeof null` برابر `"object"` است فقط یک اشتباه تاریخی است و `null` را object نمی‌کند.

  - level: easy
    stem: |
      به تبدیل نوعی که JavaScript **خودش و بدون درخواست ما** انجام می‌دهد (مثل `"5" * 2` که `10` می‌شود) چه می‌گویند؟
    options:
      - 'casting'
      - 'coercion'
      - 'hoisting'
      - 'parsing'
    answer: 2
    explain: |
      اسلاید ۱۵: تبدیل نوع یا خودکار است (**coercion**) یا صریح (**casting**). در `"5" * 2` ما چیزی نخواسته‌ایم و خود موتور رشته را به عدد تبدیل کرده، پس coercion است. casting یعنی تبدیل صریح مثل `Number("5")`. hoisting مربوط به بالا بردن اعلان‌ها است و parsing یعنی خواندن و تجزیه‌ی کد؛ هیچ‌کدام تبدیل نوع نیستند.

  - level: easy
    stem: |
      کدام مقدار را **برنامه‌نویس عمداً** در متغیر می‌گذارد تا نشان دهد «این‌جا مقداری وجود ندارد»؟
    options:
      - '`undefined`'
      - '`NaN`'
      - '`0`'
      - '`null`'
    answer: 4
    explain: |
      اسلاید ۱۶: `null` یعنی «نبودِ **عمدیِ** مقدار» و آن را برنامه‌نویس می‌گذارد. `undefined` را خود JavaScript برای متغیری که تعریف شده ولی مقدار نگرفته قرار می‌دهد. `NaN` نتیجه‌ی محاسبه‌ی عددیِ بی‌معنی است و `0` یک عدد واقعی است، نه «نبودِ مقدار».

  - level: easy
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      console.log(typeof "42");
      console.log(typeof 42);
      console.log(typeof true);
    options:
      - out: ["string", "number", "boolean"]
      - out: ["number", "number", "boolean"]
      - out: ["string", "number", "string"]
      - out: ["string", "int", "boolean"]
    answer: 1
    explain: |
      `"42"` داخل علامت نقل‌قول است، پس یک **رشته** است، نه عدد (گزینه‌ی ۲ همین را اشتباه گرفته). `42` از نوع `number` است؛ JavaScript نوعی به نام `int` ندارد (رد گزینه‌ی ۴). `true` یک مقدار `boolean` است، نه رشته (رد گزینه‌ی ۳).

  - level: easy
    stem: |
      حاصل `typeof 10n` چیست؟
    check: value
    expr: 'typeof 10n'
    options:
      - '`"number"`'
      - '`"BigInt"`'
      - '`"bigint"`'
      - '`"integer"`'
    answer: 3
    explain: |
