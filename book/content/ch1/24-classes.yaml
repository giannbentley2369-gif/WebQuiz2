id: ch1-classes
title: "کلاس‌ها (Classes) در JavaScript"
slides: "Introduction to JS، اسلاید ۳۹"
lesson: |
  فرض کن یک شرکت ساختمانی **نقشه‌ی** (blueprint) یک خانه را کشیده است. خود نقشه خانه نیست و نمی‌شود در آن زندگی کرد؛ ولی با همین یک نقشه می‌شود ده خانه ساخت. همه‌ی خانه‌ها یک شکل‌اند (همان اتاق‌ها، همان درها)، ولی هر کدام صاحب، رنگ و وسایل **خودش** را دارد. در JavaScript، **class** (کلاس) همین نقشه است و هر شیئی که از روی آن ساخته می‌شود یک **instance** (نمونه) نام دارد.

  ### چرا کلاس؟

  فرض کن می‌خواهی چند کاربر بسازی. با object literal (که در درس اشیاء دیدیم) باید ساختار و متد هر کاربر را **تکرار** کنی:

  ```js
  const kermit = { name: "Kermit", age: 22, greet() { console.log("Hello, " + this.name); } };
  const piggy = { name: "Piggy", age: 30, greet() { console.log("Hello, " + this.name); } };
  // ...and the same code again for every new user
  ```

  اگر روزی بخواهی پیام `greet` را عوض کنی، باید همه‌جا را تغییر دهی. کلاس این مشکل را حل می‌کند: ساختار را **یک بار** تعریف می‌کنی و هر چند نمونه که بخواهی می‌سازی.

  اسلاید ۳۹ درباره‌ی کلاس‌ها سه نکته می‌گوید:

  - در **ES6** به‌عنوان راهی **تمیزتر** (cleaner) برای ساختن اشیاء معرفی شدند.
  - با کلمه‌ی کلیدی **`class`** تعریف می‌شوند.
  - کلاس‌ها یک **blueprint** (نقشه یا الگو) برای ساختن اشیاء تعریف می‌کنند.

  ### کد اسلاید ۳۹

  ```js title=classes.js
  class User {
    constructor(name, age) {
      this.name = name;
      this.age = age;
    }
    greet() {
      console.log("Hello, " + this.name);
    }
  }

  const kermit = new User("Kermit", 22);
  kermit.greet(); // Hello, Kermit
  ```

  بیا خط‌به‌خط بخوانیم:

  - `class User { ... }`: کلاسی به نام `User` تعریف می‌کند. طبق قرارداد، نام کلاس با حرف **بزرگ** شروع می‌شود (PascalCase).
  - `constructor(name, age) { ... }`: **constructor** (سازنده) متد ویژه‌ای است که هر بار با `new` یک نمونه‌ی جدید ساخته شود، **خودکار** اجرا می‌شود. کارش مقداردهی اولیه به خاصیت‌های شیء تازه است.
  - `this.name = name;`: این‌جا `this` همان **شیء تازه‌ای است که در حال ساخته شدن است**. این خط روی آن شیء خاصیتی (property) به نام `name` می‌سازد و پارامتر `name` را در آن می‌ریزد.
  - `greet() { ... }`: یک **method** (متد؛ تابعی که متعلق به شیء است). در بدنه‌ی کلاس کلمه‌ی `function` نمی‌نویسیم و بین متدها **کاما نمی‌گذاریم**.
  - `new User("Kermit", 22)`: یک نمونه‌ی جدید می‌سازد؛ آرگومان‌ها به `constructor` می‌روند.
  - `kermit.greet()`: متد را روی `kermit` صدا می‌زند. چون `kermit` قبل از نقطه آمده، داخل `greet` مقدار `this` برابر `kermit` است و `Hello, Kermit` چاپ می‌شود.

  | اصطلاح | یعنی | در مثال |
  |---|---|---|
  | class | نقشه یا الگوی ساخت اشیاء | `User` |
  | instance (نمونه) | شیئی که از روی کلاس ساخته شده | `kermit` |
  | constructor (سازنده) | متدی که موقع `new` خودکار اجرا می‌شود | `constructor(name, age)` |
  | property (خاصیت) | داده‌ی هر نمونه | `name` و `age` |
  | method (متد) | رفتار مشترک نمونه‌ها | `greet` |

  ### `new` دقیقاً چه کار می‌کند؟

  وقتی می‌نویسی `new User("Kermit", 22)`، این چهار قدم انجام می‌شود:

  1. یک شیء خالی جدید `{}` ساخته می‌شود.
  2. این شیء به `User.prototype` وصل می‌شود؛ جایی که متدهای کلاس (مثل `greet`) نگه‌داری می‌شوند.
  3. `constructor` با `this` برابر همان شیء جدید اجرا می‌شود و خاصیت‌ها را پر می‌کند.
  4. شیء ساخته‌شده **خودکار** برگردانده می‌شود (لازم نیست در `constructor` دستور `return` بنویسی).

  ```js
  class User {
    constructor(name, age) {
      this.name = name;
      this.age = age;
    }
    greet() {
      console.log("Hello, " + this.name);
    }
  }
  const kermit = new User("Kermit", 22);
  console.log(kermit);                 // User { name: 'Kermit', age: 22 }
  console.log(typeof kermit);          // object
  console.log(kermit instanceof User); // true
  ```

  عملگر **`instanceof`** می‌پرسد: «آیا این شیء از روی این کلاس (یا یکی از کلاس‌های فرزندش) ساخته شده است؟».

  ### داده‌ها جدا، متدها مشترک

  هر نمونه خاصیت‌های **خودش** را دارد و تغییر یکی روی بقیه اثر نمی‌گذارد. اما متدها برای هر نمونه کپی **نمی‌شوند**: فقط یک نسخه از `greet` در `User.prototype` هست و همه‌ی نمونه‌ها از همان استفاده می‌کنند.

  ```js
  // (User is the class of slide 39)
  const kermit = new User("Kermit", 22);
  const piggy = new User("Piggy", 30);
  piggy.name = "Miss Piggy";                 // changes only piggy
  console.log(kermit.name);                  // Kermit
  console.log(kermit.greet === piggy.greet); // true: one shared method
  console.log(Object.keys(kermit));          // [ 'name', 'age' ] (greet is not an own property)
  ```

  این همان **Prototype-based OO** (شیءگرایی مبتنی بر prototype) است که در درس «Transpile و ویژگی‌های زبان JavaScript» دیدیم: اگر شیء خاصیتی را خودش نداشته باشد، JavaScript آن را در **prototype** (الگوی والدِ شیء) جست‌وجو می‌کند. کلاس‌های ES6 در واقع **syntactic sugar** (ظاهر شیرین‌تر و تمیزتر) برای همین سازوکار قدیمی‌اند؛ برای همین `typeof User` برابر `"function"` است، نه `"class"`. به همین دلیل `Object.keys` و `JSON.stringify` فقط داده‌های خودِ نمونه (`name` و `age`) را نشان می‌دهند، نه متدها را.

  ### چند قانون مهم

  **۱. بدون `new` نمی‌شود کلاس را صدا زد.**

  ```js
  // (User is the class of slide 39)
  const piggy = User("Piggy", 30);
  // TypeError: Class constructor User cannot be invoked without 'new'
  ```

  **۲. کلاس قبل از خط تعریفش قابل استفاده نیست.** اعلان کلاس **hoist** (بالا برده) می‌شود ولی مقداردهی نمی‌شود و تا خط تعریفش در **TDZ** (Temporal Dead Zone، منطقه‌ی مرده‌ی زمانی) می‌ماند؛ درست مثل `let` و `const`. این همان hoisting «جزئی» (partially) است که اسلاید ۳۸ درباره‌ی `class` گفته بود:

  ```js
  const a = new Animal("Rex"); // ReferenceError: Cannot access 'Animal' before initialization
  class Animal {
    constructor(name) {
      this.name = name;
    }
  }
  ```

  در مقابل، یک **function declaration** (تابعی که با کلمه‌ی `function` اعلان شده) را می‌شود قبل از خط تعریفش صدا زد. دقت کن که TDZ به **زمان اجرا** بستگی دارد، نه به جای نوشتن: اگر نام کلاس داخل تابعی بالاتر از کلاس نوشته شده باشد ولی آن تابع **بعد از** اجرای خط `class` صدا زده شود، مشکلی پیش نمی‌آید (جزئیات بیشتر در درس «Hoisting و Temporal Dead Zone (TDZ)»):

  ```js
  function makeAnimal(name) {
    return new Animal(name); // Animal is used here, above its class line...
  }
  class Animal {
    constructor(name) {
      this.name = name;
    }
  }
  console.log(makeAnimal("Rex").name); // Rex (...but it RUNS after the class line)
  ```

  **۳. آرگومانی که داده نشود، `undefined` است.** `new User("Kermit")` نمونه‌ای می‌سازد که `age` آن `undefined` است؛ خطایی رخ نمی‌دهد.

  **۴. نوشتن `constructor` اختیاری است.** اگر ننویسی، یک constructor خالی به‌طور پیش‌فرض در نظر گرفته می‌شود.

  **۵. بین متدها کاما نگذار.** در object literal بین اعضا کاما لازم است، ولی در بدنه‌ی کلاس کاما خطای `SyntaxError` (خطای نحوی) است:

  ```js
  class Bad {
    a() { return 1; },  // SyntaxError: Unexpected token ','
    b() { return 2; }
  }
  ```

  **۶. بدنه‌ی کلاس همیشه در strict mode (حالت سخت‌گیرانه) است.** اگر متدی را از نمونه جدا کنی و تنها صدا بزنی، `this` آن `undefined` می‌شود و خواندن `this.name` خطای `TypeError` (خطای نوع) می‌دهد. جزئیاتش را در درس «کلمه‌ی کلیدی this» می‌بینیم.

  ### class field و static (آشنایی کوتاه)

  - **class field** (فیلد کلاس): خاصیتی که مستقیم در بدنه‌ی کلاس (بیرون از `constructor`) تعریف می‌شود. هر نمونه نسخه‌ی **خودش** را می‌گیرد.
  - **static** (ایستا): متد یا فیلدی که به **خود کلاس** تعلق دارد، نه به نمونه‌ها. با `ClassName.member` استفاده می‌شود و روی نمونه‌ها وجود ندارد.

  ```js
  class Cart {
    items = [];       // class field: every instance gets its OWN array
    static count = 0; // static field: belongs to the class itself
    constructor(owner) {
      this.owner = owner;
      Cart.count++;
    }
    add(item) {
      this.items.push(item);
      return this;    // returning this allows chaining: cart.add(a).add(b)
    }
    static describe() {
      return "A shopping cart";
    }
  }
  const c1 = new Cart("Ali");
  const c2 = new Cart("Sara");
  c1.add("pen").add("book");
  console.log(c1.items.length, c2.items.length); // 2 0
  console.log(Cart.count, Cart.describe());       // 2 A shopping cart
  console.log(typeof c1.describe);                // undefined (static is not on instances)
  ```

  ### ارث‌بری: `extends` و `super`

  گاهی یک کلاس نسخه‌ی خاص‌ترِ کلاس دیگری است: هر «سگ» یک «حیوان» است. با **`extends`** کلاس فرزند (child) همه‌ی متدهای کلاس والد (parent) را **ارث** می‌برد (inheritance):

  ```js
  class Animal {
    constructor(name) {
      this.name = name;
    }
    speak() {
      return this.name + " makes a sound";
    }
  }

  class Dog extends Animal {
    constructor(name, breed) {
      super(name);        // run the parent constructor FIRST
      this.breed = breed; // only now "this" can be used
    }
    speak() {             // overriding: replaces the parent's speak for dogs
      return super.speak() + " (woof)"; // super.speak() calls the parent's version
    }
  }

  const rex = new Dog("Rex", "Husky");
  console.log(rex.speak());           // Rex makes a sound (woof)
  console.log(rex.breed);             // Husky
  console.log(rex instanceof Dog);    // true
  console.log(rex instanceof Animal); // true (a Dog is also an Animal)
  ```

  - **`super(...)`** در constructor فرزند، constructor والد را اجرا می‌کند. در کلاس فرزند، تا وقتی `super(...)` صدا زده نشده، **نمی‌شود از `this` استفاده کرد**؛ نوشتن `this.breed = breed;` قبل از `super(name);` خطای `ReferenceError: Must call super constructor in derived class before accessing 'this' ...` می‌دهد.
  - اگر کلاس فرزند `constructor` نداشته باشد، constructor پیش‌فرضش همه‌ی آرگومان‌ها را به والد می‌دهد: با `class Cat extends Animal {}`، عبارت `new Cat("Tom").name` برابر `"Tom"` است.
  - **override** (بازنویسی متد): اگر فرزند متدی هم‌نام با والد تعریف کند، برای نمونه‌های فرزند نسخه‌ی فرزند اجرا می‌شود. با **`super.method()`** می‌توان نسخه‌ی والد را هم صدا زد.
  - `instanceof` کل زنجیره را بررسی می‌کند: `rex instanceof Animal` برابر `true` است، ولی `new Animal("x") instanceof Dog` برابر `false`.

  ::: info بیشتر بدانیم
  در فصل سوم (TypeScript) دوباره به کلاس‌ها برمی‌گردیم؛ آنجا نوع‌ها و access modifierهایی مثل `public` و `private` هم اضافه می‌شوند. این‌جا فقط کلاس‌های خودِ JavaScript را دیدیم.
  :::

  ::: tip نکته
  - کلاس = نقشه؛ نمونه = شیئی که با `new` ساخته می‌شود. `typeof` کلاس `"function"` و `typeof` نمونه `"object"` است.
  - `constructor` با هر `new` یک بار و خودکار اجرا می‌شود و `this` داخل آن، نمونه‌ی تازه است.
  - داده‌ها (خاصیت‌ها و class fieldها) برای هر نمونه جداست؛ متدها در prototype هستند و بین همه‌ی نمونه‌ها مشترک‌اند.
  - با `extends` متدها ارث می‌رسند و با `super` به constructor و متدهای والد دسترسی داری.
  :::

  ::: trap دام تستی
  - صدا زدن کلاس بدون `new` خطای `TypeError` می‌دهد.
  - استفاده از کلاس قبل از خط تعریفش `ReferenceError` (TDZ) است، در حالی که function declaration قبل از تعریف هم کار می‌کند.
  - در constructor کلاس فرزند، استفاده از `this` قبل از `super(...)` خطای `ReferenceError` می‌دهد.
  - کاما بین متدهای کلاس `SyntaxError` است.
  - متد `static` روی نمونه وجود ندارد: `instance.staticMethod()` خطای `TypeError: ... is not a function` می‌دهد.
  - متد جداشده از نمونه (`const g = kermit.greet; g();`) `this` را از دست می‌دهد و چون کلاس همیشه strict است، `TypeError` می‌دهد.
  :::

  ::: summary
  - `class` (از ES6) راهی تمیزتر برای ساختن اشیای هم‌شکل است: نقشه یک بار تعریف می‌شود و با `new` هر تعداد نمونه ساخته می‌شود.
  - `new` یک شیء خالی می‌سازد، آن را به prototype وصل می‌کند، `constructor` را با `this` برابر آن شیء اجرا می‌کند و شیء را برمی‌گرداند.
  - کلاس روی prototypeها ساخته شده (`typeof` آن `"function"` است) و hoist می‌شود، ولی تا خط تعریفش در TDZ است.
  - `extends` و `super` برای ارث‌بری، `static` برای اعضای خودِ کلاس و class field برای خاصیت‌های هر نمونه.
  :::
questions:
  - level: easy
    stem: |
      خروجی کد زیر (کد اسلاید ۳۹) چیست؟
    check: output
    code: |
      class User {
        constructor(name, age) {
          this.name = name;
          this.age = age;
        }
        greet() {
          console.log("Hello, " + this.name);
        }
      }

      const kermit = new User("Kermit", 22);
      kermit.greet();
    options:
      - out: "Hello, undefined"
      - out: "Hello, Kermit"
      - out: "Hello, name"
      - out: "!! TypeError"
    answer: 2
    explain: |
      `new User("Kermit", 22)` یک نمونه می‌سازد و constructor با `this` برابر همان نمونه اجرا می‌شود، پس `kermit.name` برابر `"Kermit"` است. در `kermit.greet()` شیء قبل از نقطه `kermit` است، پس `this.name` همان `"Kermit"` است. گزینه‌ی ۱ فکر کرده خاصیت‌ها در شیء ذخیره نمی‌شوند، گزینه‌ی ۳ رشته‌ی `"name"` را با مقدار خاصیت اشتباه گرفته و گزینه‌ی ۴ تصور کرده متدِ بدون کلمه‌ی `function` خطا می‌دهد.

  - level: easy
    stem: |
      طبق اسلاید ۳۹، کدام جمله درباره‌ی کلاس‌ها در JavaScript **درست** است؟
    options:
      - 'کلاس‌ها در ES5 معرفی شدند و با کلمه‌ی کلیدی `object` تعریف می‌شوند.'
      - 'از هر کلاس فقط یک شیء می‌توان ساخت.'
      - 'کلاس‌ها در ES6 به‌عنوان راهی تمیزتر برای ساختن اشیاء معرفی شدند و یک blueprint (نقشه) برای ساختن اشیاء تعریف می‌کنند.'
      - 'خود کلاس یک نمونه (instance) است که با `new` ساخته شده است.'
    answer: 3
    explain: |
      اسلاید ۳۹ دقیقاً همین را می‌گوید: «Introduced in ES6 as a cleaner way to create objects» و «Classes define a blueprint for creating objects». کلاس‌ها در ES6 (نه ES5) آمدند و کلمه‌ی کلیدی آن‌ها `class` است (رد گزینه‌ی ۱). نقشه برای ساختن **هر تعداد** شیء است (رد گزینه‌ی ۲). نمونه‌ها با `new` از روی کلاس ساخته می‌شوند و خود کلاس نمونه نیست (رد گزینه‌ی ۴).

  - level: easy
    stem: |
      در کد اسلاید ۳۹، شیء `kermit` که با `const kermit = new User("Kermit", 22);` ساخته شده، نسبت به `User` چیست؟
    options:
      - 'یک نمونه (instance) از کلاس `User`'
      - 'یک کلاس فرزند (subclass) از `User`'
      - 'constructor کلاس `User`'
      - 'یک متد (method) از کلاس `User`'
    answer: 1
    explain: |
      هر شیئی که با `new` از روی یک کلاس ساخته شود، یک **instance** (نمونه) از آن کلاس است؛ مثل خانه‌ای که از روی نقشه ساخته شده. کلاس فرزند با `class X extends User` تعریف می‌شود (رد گزینه‌ی ۲)، constructor متد سازنده‌ی داخل کلاس است (رد گزینه‌ی ۳) و متد، تابعی مثل `greet` است (رد گزینه‌ی ۴).

  - level: easy
    stem: |
      در جای خالی کدام کلمه قرار بگیرد تا کد زیر یک نمونه از کلاس `User` بسازد و `Hello, Kermit` را چاپ کند؟
    check: option-output
    expect: "Hello, Kermit"
    code: |
      class User {
        constructor(name) {
          this.name = name;
        }
        greet() {
          console.log("Hello, " + this.name);
        }
      }
      const kermit = ____ User("Kermit");
      kermit.greet();
    prelude: |
      class User {
        constructor(name) {
          this.name = name;
        }
        greet() {
          console.log("Hello, " + this.name);
        }
      }
    options:
      - text: '`this`'
        code: 'const kermit = this User("Kermit"); kermit.greet();'
      - text: '`create`'
        code: 'const kermit = create User("Kermit"); kermit.greet();'
      - text: '`class`'
        code: 'const kermit = class User("Kermit"); kermit.greet();'
      - text: '`new`'
        code: 'const kermit = new User("Kermit"); kermit.greet();'
