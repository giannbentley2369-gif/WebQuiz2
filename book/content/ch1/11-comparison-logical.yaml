id: ch1-comparison
title: "عملگرهای مقایسه و منطقی"
slides: "Introduction to JS، اسلاید ۳۱"
lesson: |
  برنامه‌ها مدام سؤال‌های «بله یا نه» می‌پرسند: «کاربر ۱۸ سالش شده؟»، «رمز درست است؟»، «سبد خرید خالی است؟». جواب هر کدام یک مقدار **boolean** است: `true` یا `false`. **عملگرهای مقایسه** (comparison operators؛ عملگرهایی که دو مقدار را با هم می‌سنجند) این سؤال‌ها را می‌سازند و **عملگرهای منطقی** (logical operators؛ عملگرهایی که چند شرط را با هم ترکیب یا برعکس می‌کنند) چند سؤال را به هم وصل می‌کنند. همه‌ی شرط‌های `if` و حلقه‌ها روی همین‌ها سوارند.

  ### عملگرهای تساوی: `==`، `===`، `!=` و `!==`
  طبق اسلاید ۳۱:

  | عملگر | نام | کارش |
  |---|---|---|
  | `==` | Equal (تساوی) | **مقدار**ها را مقایسه می‌کند و اجازه‌ی type coercion (تبدیل نوع خودکار) می‌دهد |
  | `===` | Strict Equal (تساوی سخت‌گیر) | **مقدار و نوع** را مقایسه می‌کند؛ هیچ تبدیلی انجام نمی‌دهد |
  | `!=` | Not Equal (نابرابری) | نقیضِ `==` (با تبدیل نوع) |
  | `!==` | Strict Not Equal (نابرابری سخت‌گیر) | نقیضِ `===` (بدون تبدیل نوع) |

  ```js
  console.log(5 == "5");  // true  ("5" is converted to 5)
  console.log(5 === "5"); // false (number vs string)
  console.log(5 != "5");  // false (they ARE loosely equal)
  console.log(5 !== "5"); // true  (the types differ)
  ```

  قاعده‌های کامل تبدیل در `==` را در درس «تبدیل نوع ضمنی» دیدیم (مثلاً `null == undefined` برابر `true` و `null == 0` برابر `false` است). قاعده‌ی عملی: همیشه `===` و `!==` را ترجیح بده، مگر اینکه دلیل خاصی داشته باشی.

  ### مقایسه با مقدار (by value) یا با مرجع (by reference)
  یادداشت اسلاید ۳۱: **primitiveها با مقدارشان مقایسه می‌شوند، نه با مرجعشان.**

  ::: analogy
  primitiveها (عدد، رشته، boolean و …) مثل عددی هستند که روی کاغذ نوشته شده: دو کاغذ که رویشان `5` نوشته شده با هم برابرند. اما آرایه‌ها و شیءها مثل **خانه** هستند و متغیر فقط **آدرس** خانه را نگه می‌دارد؛ به این آدرس **reference** (مرجع) می‌گوییم. دو خانه با دکوراسیون کاملاً یکسان هنوز دو خانه‌ی جدا هستند. `==` و `===` برای آرایه‌ها و شیءها فقط می‌پرسند: «آیا هر دو آدرس به **همان یک** خانه اشاره می‌کنند؟»
  :::

  ```js
  console.log("hi" === "hi"); // true  (primitives: compared by value)

  const a = [1, 2];
  const b = [1, 2];
  const c = a;            // c points to the SAME array as a
  console.log(a === b);   // false (two different arrays with equal content)
  console.log(a == b);    // false (== does not help: both sides are objects)
  console.log(a === c);   // true  (same reference)
  console.log({} === {}); // false
  console.log([] == []);  // false
  ```

  ::: tip
  `[1] == 1` برابر `true` است (یک طرف primitive است، پس آرایه اول رشته‌ی `"1"` و بعد عدد `1` می‌شود)، اما `[1] == [1]` برابر `false` است: وقتی **هر دو** طرف آرایه یا شیء باشند هیچ تبدیلی رخ نمی‌دهد و فقط مرجع‌ها مقایسه می‌شوند.
  :::

  ### عملگرهای بزرگ‌تر و کوچک‌تر: `>`، `<`، `>=` و `<=`
  برای عددها دقیقاً مثل ریاضی کار می‌کنند: `5 > 3` برابر `true`، `5 >= 5` برابر `true` و `5 > 5` برابر `false` است. اما دو حالت خاص داریم.

  **حالت ۱: هر دو طرف رشته باشند؛ مقایسه‌ی لغت‌نامه‌ای (lexicographic)**

  رشته‌ها حرف‌به‌حرف از چپ مقایسه می‌شوند و **اولین حرفِ متفاوت** تکلیف را روشن می‌کند. هر کاراکتر یک کد عددی (Unicode) دارد و مقایسه بر اساس همین کد است. اگر یک رشته ابتدای رشته‌ی دیگر باشد (مثل `"app"` و `"apple"`)، رشته‌ی کوتاه‌تر کوچک‌تر است.

  | کاراکترها | کدها | ترتیب |
  |---|---|---|
  | رقم‌ها `"0"` تا `"9"` | ۴۸ تا ۵۷ | کوچک‌ترین |
  | حروف بزرگ `"A"` تا `"Z"` | ۶۵ تا ۹۰ | وسط |
  | حروف کوچک `"a"` تا `"z"` | ۹۷ تا ۱۲۲ | بزرگ‌ترین |

  ```js
  console.log("apple" < "banana"); // true  ("a" < "b")
  console.log("Z" < "a");          // true  (uppercase codes are smaller: 90 < 97)
  console.log("10" < "9");         // true  (compares "1" with "9" first!)
  console.log("app" < "apple");    // true  (a prefix is smaller)
  ```

  **حالت ۲: نوع دو طرف فرق کند؛ هر دو به عدد تبدیل می‌شوند**

  اگر حداقل یکی از دو طرف رشته نباشد، هر دو طرف با قاعده‌های `Number` به **عدد** تبدیل می‌شوند:

  ```js
  console.log("10" < 9); // false (numeric: 10 < 9)
  console.log("5" > 3);  // true  (5 > 3)
  console.log(true > 0); // true  (1 > 0)
  console.log("a" > 1);  // false ("a" becomes NaN)
  ```

  #### `null`، `undefined` و `NaN` در مقایسه
  - عملگرهای `>`، `<`، `>=` و `<=` مقدار `null` را به `0` تبدیل می‌کنند، ولی `==` برای `null` قانون ویژه دارد (فقط با `undefined` برابر است). نتیجه‌ی عجیب: `null >= 0` برابر `true` است، ولی `null == 0` و `null > 0` هر دو `false` هستند!
  - `undefined` به `NaN` تبدیل می‌شود، پس `undefined >= 0`، `undefined <= 0` و `undefined == 0` همگی `false` هستند.
  - **هر** مقایسه‌ای با `NaN` (`==`، `===`، `<`، `>`، `<=`، `>=`) نتیجه‌اش `false` است؛ حتی `NaN === NaN`. فقط `!=` و `!==` با `NaN` جواب `true` می‌دهند. برای تشخیص `NaN` از `Number.isNaN(x)` استفاده کن.

  ```js
  console.log(null >= 0, null == 0, null > 0); // true false false
  console.log(undefined == 0, undefined >= 0); // false false
  console.log(NaN === NaN, NaN !== NaN);       // false true
  console.log(Number.isNaN(NaN));              // true
  ```

  #### دام مقایسه‌ی زنجیره‌ای
  در ریاضی `3 > 2 > 1` درست است، اما JavaScript آن را **دوبه‌دو از چپ** حساب می‌کند و نتیجه‌ی مرحله‌ی اول (یک boolean) در مرحله‌ی دوم به عدد تبدیل می‌شود:

  ```js
  console.log(1 < 2 < 3); // true  -> (1 < 2) is true, then true < 3 -> 1 < 3 -> true
  console.log(3 > 2 > 1); // false -> (3 > 2) is true, then true > 1 -> 1 > 1 -> false
  ```

  اولی فقط «از شانس» درست درآمده. برای بررسی اینکه `b` بین `a` و `c` است بنویس: `a < b && b < c`.

  ### عملگرهای منطقی: `&&`، `||` و `!`
  اسلاید ۳۱: عملگرهای منطقی **درست مثل زبان C** هستند: `&&` (AND؛ «و»)، `||` (OR؛ «یا») و `!` (NOT؛ «نقیض»). با آن‌ها می‌توانی مقدارهای boolean را **ترکیب** یا **برعکس** کنی.

  | `a` | `b` | `a && b` | `a \|\| b` |
  |---|---|---|---|
  | `true` | `true` | `true` | `true` |
  | `true` | `false` | `false` | `true` |
  | `false` | `true` | `false` | `true` |
  | `false` | `false` | `false` | `false` |

  - `a && b` فقط وقتی `true` است که **هر دو** `true` باشند.
  - `a || b` وقتی `true` است که **حداقل یکی** `true` باشد.
  - `!a` مقدار را برعکس می‌کند: `!true` برابر `false` است.

  ```js
  const age = 20;
  const hasTicket = true;
  console.log(age >= 18 && hasTicket); // true  (both conditions hold)
  console.log(age < 12 || age > 65);   // false (neither condition holds)
  console.log(!(age >= 18));           // false (inverts the result)
  ```

  **اولویت (precedence):** اول `!`، بعد `&&` و در آخر `||`؛ درست مثل ریاضی که ضرب قبل از جمع انجام می‌شود. پس `true || false && false` یعنی `true || (false && false)` که `true` است. هر جا شک داری، پرانتز بگذار.

  **برعکس کردن یک ترکیب (قوانین دمورگان):** `!(a && b)` همان `!a || !b` است و `!(a || b)` همان `!a && !b`. یعنی وقتی `!` را به داخل پرانتز می‌بری، `&&` و `||` جایشان را با هم عوض می‌کنند.

  ### اتصال کوتاه (short-circuit evaluation)
  JavaScript (مثل C) طرف راست را فقط وقتی حساب می‌کند که لازم باشد:

  - در `a && b` اگر `a` falsy باشد، جواب از قبل معلوم است، پس `b` **اصلاً اجرا نمی‌شود**.
  - در `a || b` اگر `a` truthy باشد، `b` **اصلاً اجرا نمی‌شود**.

  ```js
  false && console.log("A"); // nothing is printed: the right side is skipped
  true && console.log("B");  // prints B
  true || console.log("C");  // nothing is printed
  false || console.log("D"); // prints D
  ```

  کاربرد مهمش «نگهبان» (guard) است: در `user && user.name` اگر `user` برابر `null` باشد، JavaScript اصلاً به `user.name` نمی‌رسد و خطا نمی‌دهد؛ در حالی که `null.name` خطای `TypeError` می‌دهد.

  ### `&&` و `||` یکی از عملوندها را برمی‌گردانند، نه لزوماً boolean
  اینجا JavaScript با C فرق دارد: حاصل `&&` و `||` لزوماً `true` یا `false` نیست، بلکه **یکی از خود عملوندها**ست:

  - `a || b`: اگر `a` truthy باشد **خودِ `a`** را برمی‌گرداند، وگرنه **خودِ `b`** را. (اولین مقدار truthy، یا اگر نبود آخرین عملوند)
  - `a && b`: اگر `a` falsy باشد **خودِ `a`** را برمی‌گرداند، وگرنه **خودِ `b`** را. (اولین مقدار falsy، یا اگر نبود آخرین عملوند)

  ```js
  console.log("a" && "b");          // "b"  ("a" is truthy, so the result is the second operand)
  console.log(0 || "x");            // "x"
  console.log(null && "yes");       // null (the first falsy operand)
  console.log(1 && 2 && 3);         // 3    (no falsy operand: the last one)
  console.log(null || 0 || "last"); // "last"
  ```

  اما `!` **همیشه** یک boolean واقعی برمی‌گرداند: `!"hello"` برابر `false` و `!0` برابر `true` است. برای همین `!!x` (دو بار نقیض) همان `Boolean(x)` است.

  ### مقدار پیش‌فرض با `||` و جایگزین بهترش `??`
  چون `||` اولین مقدار truthy را برمی‌گرداند، برای دادن مقدار پیش‌فرض (default value) زیاد استفاده می‌شود:

  ```js
  const input = "";
  const name = input || "Guest";
  console.log(name); // "Guest" (empty input, so the default is used)
  ```

  اما دام بزرگی دارد: `0` و `""` هم falsy هستند؛ پس اگر `0` یک مقدار **معتبر** باشد، به اشتباه جایگزین می‌شود. عملگر **`??`** (nullish coalescing؛ از ES2020) این مشکل را ندارد: طرف راست را **فقط** وقتی برمی‌گرداند که طرف چپ `null` یا `undefined` باشد.

  ```js
  const volume = 0;               // 0 is a valid volume!
  console.log(volume || 50);      // 50 (bug: 0 is falsy, so it was replaced)
  console.log(volume ?? 50);      // 0  (?? only replaces null/undefined)
  console.log(null ?? "default"); // "default"
  ```

  ::: note
  `??` را نمی‌توان بدون پرانتز کنار `||` یا `&&` نوشت: `a || b ?? c` خطای نحوی (SyntaxError) می‌دهد و باید نوشت `(a || b) ?? c`.
  :::

  ::: tip
  - همیشه `===` و `!==` را ترجیح بده.
  - برای `NaN` از `Number.isNaN` استفاده کن، نه از `x === NaN`.
  - برای مقدار پیش‌فرضی که `0` یا `""` هم می‌تواند معتبر باشد، `??` را به جای `||` به کار ببر.
  - در ترکیب‌های طولانی پرانتز بگذار تا مجبور نشوی اولویت‌ها را حدس بزنی.
  :::

  ::: trap
  - `"10" < "9"` برابر `true` است (دو رشته، حرف‌به‌حرف)، ولی `"10" < 9` برابر `false` (یک طرف عدد است، پس مقایسه‌ی عددی).
  - `"Z" < "a"` برابر `true` است: حروف بزرگ کد کوچک‌تری دارند.
  - `null >= 0` برابر `true` است، ولی `null == 0` برابر `false`.
  - `NaN === NaN` برابر `false` است.
  - `3 > 2 > 1` برابر `false` است.
  - `[1, 2] === [1, 2]` برابر `false` است (دو آرایه‌ی جدا).
  - `"a" && "b"` برابر `"b"` است، نه `true`؛ و `0 || 10` برابر `10` است، حتی اگر `0` را عمداً گذاشته باشی.
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۳۱، عملگر `===` (Strict Equal) چه چیزی را مقایسه می‌کند؟
    options:
      - فقط مقدار را، و در صورت نیاز نوع‌ها را به هم تبدیل می‌کند
      - مقدار و نوع را، بدون هیچ تبدیل نوعی
      - فقط نوع دو طرف را، بدون توجه به مقدار
      - آدرس حافظه‌ی دو طرف را، حتی برای عددها و رشته‌ها
    answer: 2
    explain: |
      `===` مقدار **و** نوع را مقایسه می‌کند و هیچ type coercion انجام نمی‌دهد؛ برای همین `5 === "5"` برابر `false` است. گزینه‌ی ۱ تعریف `==` است؛ گزینه‌ی ۳ غلط است چون `5 === 6` با وجود نوع یکسان `false` است؛ و گزینه‌ی ۴ هم غلط است، چون طبق اسلاید ۳۱ primitiveها با مقدارشان مقایسه می‌شوند، نه با مرجع.

  - level: easy
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      console.log(5 == "5", 5 === "5", 5 != "5", 5 !== "5");
    options:
      - out: "true true false false"
      - out: "true false true false"
      - out: "true false false true"
      - out: "false false true true"
    answer: 3
    explain: |
      `5 == "5"` رشته را به عدد تبدیل می‌کند، پس `true`؛ `5 === "5"` نوع‌ها را هم می‌سنجد، پس `false`. `!=` نقیضِ `==` است، پس `false`؛ و `!==` نقیضِ `===` است، پس `true`. گزینه‌ی ۱ فرق `==` و `===` را ندیده، گزینه‌ی ۲ نقیض‌ها را برعکس جفت کرده و گزینه‌ی ۴ فکر کرده `==` هم تبدیل نوع انجام نمی‌دهد.

  - level: easy
    stem: |
      کدام گزینه **نادرست** است؟
    check: claims
    want: false
    options:
      - text: '`"hi" === "hi"` برابر `true` است.'
        expr: '"hi" === "hi"'
        equals: 'true'
      - text: '`10 >= 10` برابر `true` است.'
        expr: '10 >= 10'
        equals: 'true'
      - text: '`3 < 5` برابر `true` است.'
        expr: '3 < 5'
        equals: 'true'
      - text: '`7 !== 7` برابر `true` است.'
        expr: '7 !== 7'
        equals: 'true'
    answer: 4
    explain: |
      `7 !== 7` می‌پرسد «آیا `7` و `7` (از نظر مقدار یا نوع) متفاوت‌اند؟» و جوابش `false` است؛ پس گزینه‌ی ۴ نادرست است. گزینه‌ی ۱ درست است، چون primitiveها (از جمله رشته‌ها) با مقدارشان مقایسه می‌شوند؛ `>=` در حالت تساوی هم `true` می‌دهد (گزینه‌ی ۲)؛ و `3 < 5` هم بدیهی است.

  - level: medium
    stem: |
      کدام گزینه **درست** است؟
    check: claims
    options:
      - text: '`null != undefined` برابر `true` است.'
        expr: 'null != undefined'
        equals: 'true'
      - text: '`"1" !== 1` برابر `true` است.'
        expr: '"1" !== 1'
        equals: 'true'
      - text: '`NaN != NaN` برابر `false` است.'
        expr: 'NaN != NaN'
        equals: 'false'
      - text: '`"1" != 1` برابر `true` است.'
        expr: '"1" != 1'
        equals: 'true'
    answer: 2
    explain: |
      `!==` بدون تبدیل مقایسه می‌کند و چون نوع رشته و عدد فرق دارد، `"1" !== 1` برابر `true` است. `null == undefined` درست است، پس نقیضش `null != undefined` برابر `false` است (گزینه‌ی ۱). `NaN` با خودش برابر نیست، پس `NaN != NaN` برابر `true` است (گزینه‌ی ۳). و `"1" == 1` با تبدیل نوع `true` است، پس `"1" != 1` برابر `false` است (گزینه‌ی ۴).

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const a = [1, 2];
      const b = [1, 2];
      const c = a;
      console.log(a == b, a === c);
      console.log([1] == 1, [1] == [1]);
    options:
      - out: ["false true", "true false"]
      - out: ["true true", "true true"]
      - out: ["false true", "false false"]
      - out: ["true false", "true true"]
    answer: 1
    explain: |
      `a` و `b` دو آرایه‌ی **جدا** با محتوای یکسان‌اند و `==` بین دو آرایه فقط مرجع را مقایسه می‌کند، پس `false`؛ اما `c` به **همان** آرایه‌ی `a` اشاره می‌کند، پس `true`. در خط بعد، `[1] == 1` یک طرف primitive دارد، پس آرایه به `"1"` و بعد به `1` تبدیل می‌شود و نتیجه `true` است؛ ولی `[1] == [1]` دو آرایه‌ی جداست، پس `false`. گزینه‌های ۲ و ۴ آرایه‌ها را با محتوا مقایسه کرده‌اند و گزینه‌ی ۳ نمی‌داند که آرایه در برابر عدد به primitive تبدیل می‌شود.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const p1 = { name: "Ali" };
      const p2 = { name: "Ali" };
      const p3 = p1;
