  - level: medium
    stem: |
      کدام گزینه درباره‌ی عملگرهای منطقی در JavaScript **نادرست** است؟
    options:
      - '`&&` و `||` مثل زبان C اتصال کوتاه (short-circuit) دارند.'
      - '`!` همیشه یک مقدار boolean برمی‌گرداند.'
      - 'اولویت `&&` از `||` بیشتر است.'
      - '`&&` و `||` همیشه `true` یا `false` برمی‌گردانند.'
    answer: 4
    explain: |
      `&&` و `||` در JavaScript یکی از **خود عملوندها** را برمی‌گردانند؛ مثلاً `"a" && "b"` برابر `"b"` و `0 || "x"` برابر `"x"` است؛ پس گزینه‌ی ۴ نادرست است. سه گزینه‌ی دیگر درست‌اند: اتصال کوتاه دقیقاً مثل C است، `!` همیشه boolean واقعی می‌دهد (برای همین `!!x` همان `Boolean(x)` است) و `&&` قبل از `||` انجام می‌شود.

  - level: easy
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      console.log(!"hello", !!"hello", !0);
    options:
      - out: "false true true"
      - out: "true false false"
      - out: "false false true"
      - out: "false true false"
    answer: 1
    explain: |
      `"hello"` رشته‌ای غیرخالی و truthy است، پس `!"hello"` برابر `false` و `!!"hello"` (دو بار نقیض) برابر `true` است. `0` falsy است، پس `!0` برابر `true` است. گزینه‌ی ۲ truthy و falsy را برعکس گرفته (`"hello"` را falsy و `0` را truthy فرض کرده)، گزینه‌ی ۳ نقیض دوم را نادیده گرفته و گزینه‌ی ۴ فقط صفر را truthy حساب کرده است.

  - level: hard
    stem: |
      حاصل `[] == ![]` کدام است؟
    check: value
    expr: '[] == ![]'
    options:
      - value: 'false'
      - value: 'true'
      - text: 'خطای `TypeError`'
        value: '!! TypeError'
      - value: 'undefined'
    answer: 2
    explain: |
      اول `![]` حساب می‌شود: آرایه‌ی خالی truthy است، پس `![]` برابر `false` است. عبارت تبدیل می‌شود به `[] == false` که همان دام اسلاید ۲۱ است: `false -> 0` و `[] -> "" -> 0`، پس `0 == 0` یعنی `true`. به نظر می‌رسد «یک چیز با نقیض خودش برابر است»، اما در واقع دو تبدیل متفاوت (truthy بودن برای `!` و تبدیل عددی برای `==`) رخ داده است. JavaScript اینجا خطا نمی‌دهد و `==` همیشه boolean برمی‌گرداند، نه `undefined`.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const volume = 0;
      const a = volume || 50;
      const b = volume ?? 50;
      console.log(a, b);
    options:
      - out: "0 0"
      - out: "50 50"
      - out: "0 50"
      - out: "50 0"
    answer: 4
    explain: |
      `0` falsy است، پس `volume || 50` عملوند دوم یعنی `50` را برمی‌گرداند؛ این همان دام «مقدار پیش‌فرض با `||`» است که مقدار معتبرِ `0` را دور می‌ریزد. اما `??` فقط وقتی طرف راست را برمی‌گرداند که طرف چپ `null` یا `undefined` باشد؛ `0` هیچ‌کدام نیست، پس `b` برابر `0` می‌ماند. گزینه‌ی ۱ فکر کرده `||` صفر را نگه می‌دارد، گزینه‌ی ۲ فکر کرده `??` هم مثل `||` با falsyها رفتار می‌کند و گزینه‌ی ۳ رفتار دو عملگر را جابه‌جا کرده است.

  - level: medium
    stem: |
      حاصل کدام عبارت `"x"` است؟
    check: claims
    options:
      - text: '`undefined ?? "x"`'
        expr: 'undefined ?? "x"'
        equals: '"x"'
      - text: '`0 ?? "x"`'
        expr: '0 ?? "x"'
        equals: '"x"'
      - text: '`"" ?? "x"`'
        expr: '"" ?? "x"'
        equals: '"x"'
      - text: '`false ?? "x"`'
        expr: 'false ?? "x"'
        equals: '"x"'
    answer: 1
    explain: |
      `??` (nullish coalescing) طرف راست را **فقط** وقتی برمی‌گرداند که طرف چپ `null` یا `undefined` باشد؛ پس `undefined ?? "x"` برابر `"x"` است. `0`، `""` و `false` با اینکه falsy هستند، nullish (یعنی `null` یا `undefined`) نیستند؛ پس `??` خودِ آن‌ها را برمی‌گرداند و حاصل گزینه‌های ۲ تا ۴ به ترتیب `0`، `""` و `false` است. اگر به جای `??` از `||` استفاده می‌شد، هر چهار عبارت `"x"` می‌دادند.
