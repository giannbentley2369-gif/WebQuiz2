id: ch1-review
review: true
title: "آزمون جامع فصل اول"
intro: |
  این آزمون ۳۰ پرسش «ترکیبی» دارد؛ یعنی هر پرسش دست‌کم دو درس از فصل اول را با هم می‌سنجد (مثلاً closure و `var` و `setTimeout`، یا تبدیل نوع و متدهای آرایه). بیشتر پرسش‌ها سخت‌اند و شبیه سؤال‌های دشوار کوییز طراحی شده‌اند.

  پیشنهاد ما: برای هر ۳۰ پرسش روی هم حدود **۵۰ دقیقه** وقت بگذار، کدها را اجرا نکن و خروجی را خط به خط روی کاغذ ردیابی کن. بعد پاسخ‌هایت را با پاسخ‌نامه مقایسه کن و برای هر اشتباه، درس مربوط را دوباره مرور کن. همه‌ی خروجی‌ها در Node.js بررسی شده‌اند.
questions:
  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const a = "5";
      const b = 2;
      console.log(`${a + b}|${a - b}|${a * b + "1"}|${[1, 2] + b}`);
    options:
      - out: "7|3|101|1,22"
      - out: "52|3|11|1,22"
      - out: "52|3|101|1,22"
      - out: "52|3|101|NaN"
    answer: 3
    explain: |
      درون `${}` همان قواعد معمول عملگرها اجرا می‌شود و template literal فقط نتیجه را به رشته تبدیل می‌کند. `"5" + 2` چسباندن رشته است (`"52"`)، اما `-` و `*` عددی‌اند: `"5" - 2` برابر `3` و `"5" * 2` برابر `10` است و سپس `10 + "1"` رشته‌ی `"101"` می‌شود. آرایه در کنار `+` به رشته‌ی `"1,2"` تبدیل می‌شود و `"1,2" + 2` می‌شود `"1,22"`. گزینه‌ی ۱ فکر کرده template literal جمع را عددی می‌کند، گزینه‌ی ۲ `10 + "1"` را `11` دانسته و گزینه‌ی ۴ جمع آرایه با عدد را `NaN` فرض کرده است.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const values = [0, "0", "", null, undefined, NaN, [], "false"];
      const looseZero = values.filter(v => v == 0);
      const truthy = values.filter(v => !!v);
      console.log(looseZero.length, truthy.length);
    options:
      - out: "5 3"
      - out: "3 3"
      - out: "4 3"
      - out: "4 2"
    answer: 3
    explain: |
      در `v == 0` فقط `0`، `"0"`، `""` و `[]` برابر صفر می‌شوند: رشته‌ها به عدد تبدیل می‌شوند (`""` به `0`) و آرایه‌ی خالی اول به رشته‌ی `""` و سپس به `0` تبدیل می‌شود. `null == 0` و `undefined == 0` طبق قاعده‌ی ویژه‌ی `==` نادرست‌اند (`null` و `undefined` فقط با هم برابرند)، `NaN` با هیچ چیز برابر نیست و `"false"` به `NaN` تبدیل می‌شود. برای `!!v` فقط سه مقدار truthy داریم: `"0"` (رشته‌ی غیرخالی)، `[]` (هر شیء truthy است) و `"false"`. گزینه‌ی ۱ `null == 0` را درست فرض کرده، گزینه‌ی ۲ `[] == 0` را نادرست دانسته و گزینه‌ی ۴ آرایه‌ی خالی را falsy پنداشته است.

  - level: hard
    stem: |
      کدام گزینه درست است؟
    check: claims
    options:
      - text: '`null == 0` برابر `true` است.'
        expr: 'null == 0'
        equals: 'true'
      - text: '`"" || 0 || null` برابر `null` است.'
        expr: '"" || 0 || null'
        equals: 'null'
      - text: '`[] == ![]` برابر `false` است.'
        expr: '[] == ![]'
        equals: 'false'
      - text: '`0 ?? "default"` برابر `"default"` است.'
        expr: '0 ?? "default"'
        equals: '"default"'
    answer: 2
    explain: |
      عملگر `||` اولین مقدار truthy را برمی‌گرداند و اگر هیچ‌کدام truthy نباشد، **آخرین** مقدار را؛ `""` و `0` هر دو falsy‌اند، پس حاصل `null` است. گزینه‌ی ۱ نادرست است: `null` در `==` فقط با `undefined` (و خودش) برابر است و `null == 0` برابر `false` است. گزینه‌ی ۳ نادرست است: `![]` برابر `false` است (هر شیء truthy است) و `[] == false` با تبدیل هر دو طرف به عدد (`0 == 0`) برابر `true` می‌شود. گزینه‌ی ۴ نادرست است: `??` فقط به جای `null` و `undefined` مقدار پیش‌فرض می‌گذارد، پس `0 ?? "default"` همان `0` است (برخلاف `||`).

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function grade(x) {
        let out = "";
        switch (x) {
          case 1:
            out += "a";
          case "2":
            out += "b";
            break;
          case 2:
            out += "c";
          default:
            out += "d";
        }
        return out;
      }
      console.log(grade(1), grade(2), grade("1"));
    options:
      - out: "a cd d"
      - out: "ab b d"
      - out: "ab cd ab"
      - out: "ab cd d"
    answer: 4
    explain: |
      `switch` با مقایسه‌ی سخت‌گیرانه (`===`) کار می‌کند و بعد از ورود به یک `case`، تا رسیدن به `break` به caseهای بعدی هم ادامه می‌دهد (fall-through). `grade(1)`: وارد `case 1` می‌شود (`a`) و چون `break` ندارد، `case "2"` هم اجرا می‌شود (`b`) و آنجا `break` است؛ پس `ab`. `grade(2)`: با `"2"` برابر نیست (`2 === "2"` نادرست است)، وارد `case 2` می‌شود (`c`) و تا `default` ادامه می‌دهد؛ پس `cd`. `grade("1")` با هیچ caseی برابر نیست و فقط `default` اجرا می‌شود: `d`. گزینه‌ی ۱ fall-through را فراموش کرده، گزینه‌ی ۲ فرض کرده `switch` با `==` مقایسه می‌کند و گزینه‌ی ۳ `"1"` را با `1` برابر دانسته است.

  - level: medium
    stem: |
      کدام خط کد زیر خطا می‌دهد؟
    check: error-line
    errorName: TypeError
    code: |
      const items = ["a", "b"];
      for (const item of items) {
        console.log(item);
      }
      for (const i = 0; i < items.length; i++) {
        console.log(items[i]);
      }
    options:
      - line: 2
      - line: 5
      - line: 6
      - line: 0
    answer: 2
    explain: |
      در `for...of` در هر دور یک ثابت **تازه** ساخته می‌شود و هیچ‌وقت به آن انتساب دوباره نمی‌شود، پس `const` در خط ۲ مجاز است و `a` و `b` چاپ می‌شوند. در حلقه‌ی کلاسیک `for` اما فقط یک متغیر داریم که بخش سوم (`i++`) باید آن را تغییر دهد؛ دور اول بدون مشکل `a` را چاپ می‌کند (خط ۶)، ولی سپس `i++` در خط ۵ به ثابت مقدار تازه می‌دهد و `TypeError: Assignment to constant variable` رخ می‌دهد. پس خط ۶ مشکلی ندارد و گزینه‌ی «بدون خطا» هم نادرست است.

  - level: hard
    stem: |
      کدام خط کد زیر خطا می‌دهد؟
    check: error-line
    errorName: TypeError
    code: |
      const user = { name: "Ali" };
      user.name = "Sara";
      let score = 10;
      if (score > 5) {
        const user = { name: "Reza" };
        score += user.name.length;
      }
      console.log(user.name, score);
      user = { name: "Mina" };
    options:
      - line: 2
      - line: 5
      - line: 0
      - line: 9
    answer: 4
    explain: |
      `const` فقط **انتساب دوباره** به متغیر را ممنوع می‌کند، نه تغییر محتوای شیء؛ پس خط ۲ مجاز است. در خط ۵، `const user` درون بلوک `if` یک متغیر **جدید** با محدوده‌ی بلوکی است که `user` بیرونی را می‌پوشاند (shadowing)، پس خطا نیست؛ `score` برابر `10 + 4 = 14` می‌شود و خط ۸ عبارت `Sara 14` را چاپ می‌کند. خط ۹ به خود ثابت `user` مقدار تازه می‌دهد و `TypeError: Assignment to constant variable` رخ می‌دهد؛ پس گزینه‌ی «بدون خطا» هم نادرست است.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      var name = "global";
      function show() {
        console.log(name);
        var name = "local";
        console.log(name);
      }
      show();
      console.log(name);
    options:
      - out: ["global", "local", "global"]
      - out: ["undefined", "local", "global"]
      - out: ["!! ReferenceError"]
      - out: ["undefined", "local", "local"]
    answer: 2
    explain: |
      اعلان `var name` درون تابع به ابتدای همان تابع hoist می‌شود (فقط اعلان، با مقدار `undefined`) و `name` سراسری را درون تابع می‌پوشاند. پس اولین `console.log` همان `name` محلی را می‌بیند که هنوز مقدار نگرفته (`undefined`)، دومی `local` را چاپ می‌کند و خط آخر، بیرون از تابع، `name` سراسری یعنی `global` را. گزینه‌ی ۱ hoisting را نادیده گرفته، گزینه‌ی ۳ رفتار TDZ مخصوص `let`/`const` را به `var` نسبت داده و گزینه‌ی ۴ فکر کرده `var` درون تابع متغیر سراسری را عوض می‌کند.

  - level: hard
    stem: |
      کدام خط کد زیر خطا می‌دهد؟
    check: error-line
    errorName: ReferenceError
    code: |
      console.log(sum(2, 3));
      console.log(typeof mult, typeof notDeclared);
      function sum(a, b) { return a + b; }
      var mult = (a, b) => a * b;
      console.log(mult(2, 3));
      console.log(typeof div);
      const div = (a, b) => a / b;
      console.log(div(6, 3));
    options:
      - line: 2
      - line: 6
      - line: 1
      - line: 0
    answer: 2
    explain: |
      خط ۱ مشکلی ندارد، چون function declaration به‌طور کامل hoist می‌شود و `5` چاپ می‌شود. در خط ۲، `mult` با `var` تعریف شده و فقط اعلانش (با مقدار `undefined`) بالا رفته است؛ `typeof` روی متغیری که اصلاً تعریف نشده (`notDeclared`) هم بدون خطا `"undefined"` می‌دهد. خط ۵ هم `6` را چاپ می‌کند. اما در خط ۶، `div` با `const` تعریف شده و هنوز در TDZ است و در TDZ حتی `typeof` هم `ReferenceError` می‌دهد. کسی که گزینه‌ی «بدون خطا» را بزند، `typeof` را همیشه بی‌خطر پنداشته است.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function makeCounters() {
        var fns = [];
        for (var i = 0; i < 3; i++) {
          fns.push(() => i * 10);
        }
        i = 7;
        return fns;
      }
      const counters = makeCounters();
      console.log(counters.map(f => f()).join(" "));
    options:
      - out: "0 10 20"
      - out: "30 30 30"
      - out: "70 70 70"
      - out: ["!! ReferenceError"]
    answer: 3
    explain: |
      `var` محدوده‌ی تابعی دارد، پس در کل `makeCounters` فقط **یک** متغیر `i` وجود دارد و هر سه arrow function به همان متغیر (نه به مقدار لحظه‌ی ساخت) closure دارند. حلقه با `i = 3` تمام می‌شود و سپس خط `i = 7` همان متغیر را عوض می‌کند؛ توابع بعداً درون `map` صدا زده می‌شوند و همه `7 * 10` را حساب می‌کنند. گزینه‌ی ۱ رفتار `let` را فرض کرده، گزینه‌ی ۲ تغییر بعد از حلقه را نادیده گرفته و گزینه‌ی ۴ فکر کرده `i` بیرون از حلقه در دسترس نیست (که برای `var` درست نیست).

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log("var:", i), 0);
      }
      for (let j = 0; j < 3; j++) {
        setTimeout(() => console.log("let:", j), 0);
      }
      console.log("done");
    options:
      - out: ["done", "var: 3", "var: 3", "var: 3", "let: 0", "let: 1", "let: 2"]
      - out: ["var: 0", "var: 1", "var: 2", "let: 0", "let: 1", "let: 2", "done"]
      - out: ["done", "var: 0", "var: 1", "var: 2", "let: 0", "let: 1", "let: 2"]
      - out: ["done", "var: 3", "var: 3", "var: 3", "let: 3", "let: 3", "let: 3"]
    answer: 1
    explain: |
      حلقه‌ها فقط زمان‌سنج‌ها را ثبت می‌کنند و callbackها بعد از تمام شدن کد همگام اجرا می‌شوند؛ پس `done` اول چاپ می‌شود. `var` تابع‌محور (یا سراسری) است و هر سه arrow function به همان یک `i` مشترک closure دارند که در پایان حلقه `3` شده است؛ اما `let` در هر دور حلقه یک `j` تازه می‌سازد و هر callback مقدار دور خودش (`0`، `1`، `2`) را نگه می‌دارد. گزینه‌ی ۲ فرض کرده `setTimeout` با تأخیر `0` همان لحظه اجرا می‌شود، گزینه‌ی ۳ فرق `var` و `let` را نادیده گرفته و گزینه‌ی ۴ فکر کرده `let` هم یک متغیر مشترک دارد.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function createWallet(start) {
        let balance = start;
        return {
          add(x) {
            balance += x;
            return this;
          },
          get: () => balance,
        };
      }
      const w1 = createWallet(10);
      const w2 = createWallet(10);
      w1.add(5).add("5");
      console.log(w1.get(), w2.get(), w1.balance);
    options:
      - out: "20 10 undefined"
      - out: "155 155 undefined"
      - out: "155 10 155"
      - out: "155 10 undefined"
    answer: 4
    explain: |
      هر بار صدا زدن `createWallet` یک closure **جدید** با `balance` جداگانه می‌سازد، پس `w2` همان `10` می‌ماند. `add` با `w1.add(...)` صدا زده می‌شود، پس `this` آن خود `w1` است و `return this` اجازه‌ی زنجیره کردن را می‌دهد. `balance` ابتدا `10 + 5 = 15` می‌شود و سپس `15 + "5"` چسباندن رشته‌ای است: `"155"` (که `console.log` بدون نقل‌قول چاپ می‌کند). `balance` یک متغیر محلی و خصوصی است، نه خاصیت شیء، پس `w1.balance` برابر `undefined` است. گزینه‌ی ۱ جمع با رشته را عددی دانسته، گزینه‌ی ۲ فکر کرده دو کیف‌پول یک `balance` مشترک دارند و گزینه‌ی ۳ متغیر closure را خاصیت شیء فرض کرده است.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function update(obj, num, arr) {
        obj.count++;
        num++;
        arr = [...arr, 4];
        arr.push(5);
        return arr.length;
      }
      const state = { count: 1 };
      let n = 1;
      const list = [1, 2, 3];
      const len = update(state, n, list);
      console.log(state.count, n, list.length, len);
    options:
      - out: "2 2 5 5"
      - out: "1 1 3 5"
      - out: "2 1 5 5"
      - out: "2 1 3 5"
    answer: 4
    explain: |
      شیء‌ها با **ارجاع** (reference) به تابع داده می‌شوند، پس `obj.count++` همان `state` را تغییر می‌دهد (`2`). اعداد primitive‌اند و کپی می‌شوند، پس `num++` روی `n` بیرونی اثری ندارد (`1`). `arr = [...arr, 4]` پارامتر `arr` را به یک آرایه‌ی **جدید** وصل می‌کند و `push(5)` فقط همین آرایه‌ی جدید را تغییر می‌دهد؛ پس `list` با طول `3` می‌ماند و تابع طول آرایه‌ی جدید یعنی `5` را برمی‌گرداند. گزینه‌ی ۱ عدد را هم ارجاعی و spread را بی‌اثر فرض کرده، گزینه‌ی ۲ فکر کرده تغییر شیء بیرون از تابع دیده نمی‌شود و گزینه‌ی ۳ فکر کرده `push` روی `list` اصلی اثر دارد.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      let a = 1;
      let b = 2;
      [a, b] = [b, a];
      const [x, , y = a * 10, ...rest] = [5, 6, undefined, 8, 9];
      const { length } = rest;
      console.log(a, b, x, y, rest, length);
    options:
      - out: "2 1 5 10 [ 8, 9 ] 2"
      - out: "2 1 5 20 [ 8, 9 ] 2"
      - out: "2 1 5 undefined [ 8, 9 ] 2"
      - out: "2 1 5 20 [ 8, 9 ] undefined"
    answer: 2
    explain: |
      `[a, b] = [b, a]` بدون متغیر کمکی مقدارها را جابه‌جا می‌کند: `a = 2` و `b = 1`. در خط ۴، جای خالی بین دو ویرگول عنصر `6` را رد می‌کند و چون عنصر سوم صریحاً `undefined` است، مقدار پیش‌فرض `y` به کار می‌رود؛ این پیش‌فرض **در همان لحظه** و با `a` جدید (`2`) حساب می‌شود: `20`. `...rest` بقیه‌ی عناصر را در آرایه‌ی `[8, 9]` جمع می‌کند و چون آرایه خاصیت `length` دارد، `const { length } = rest` عدد `2` را می‌گیرد. گزینه‌ی ۱ پیش‌فرض را با `a` قدیمی حساب کرده، گزینه‌ی ۳ فکر کرده `undefined` صریح جلوی پیش‌فرض را می‌گیرد و گزینه‌ی ۴ object destructuring روی آرایه را بی‌اثر دانسته است.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const settings = { theme: "dark", size: null, tags: ["a"] };
      const { theme = "light", size = 12, font = "Arial", tags } = settings;
      const copy = { ...settings, theme: "blue" };
      copy.tags.push("b");
      tags.push("c");
      console.log(theme, size, font);
      console.log(settings.theme, settings.tags.length, copy.tags === settings.tags);
    options:
      - out: ["dark 12 Arial", "dark 3 true"]
      - out: ["dark null Arial", "dark 2 false"]
      - out: ["dark null Arial", "blue 3 true"]
      - out: ["dark null Arial", "dark 3 true"]
    answer: 4
    explain: |
