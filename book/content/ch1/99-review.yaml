  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const wait = (ms, v) =>
        new Promise((resolve) =>
          setTimeout(() => {
            console.log("done", v);
            resolve(v);
          }, ms)
        );
      async function run() {
        const first = wait(300, "A");
        const second = await wait(100, "B");
        console.log("after B");
        const all = await Promise.all([first, wait(50, "C"), second]);
        console.log(all.join(","));
      }
      run();
    options:
      - out: ["done B", "after B", "done C", "done A", "A,C,B"]
      - out: ["done B", "after B", "done A", "done C", "A,C,B"]
      - out: ["done B", "after B", "done C", "done A", "C,A,B"]
      - out: ["after B", "done B", "done C", "done A", "A,C,B"]
    answer: 1
    explain: |
      `wait(300, "A")` بدون `await` صدا زده شده، پس timer آن همان لحظه شروع می‌شود؛ بعد `run` منتظر B می‌ماند که در لحظه‌ی ۱۰۰ میلی‌ثانیه تمام می‌شود (`done B` و سپس `after B`). حالا timer مربوط به C (۵۰ میلی‌ثانیه) شروع می‌شود و در لحظه‌ی ۱۵۰ تمام می‌شود، در حالی که A در لحظه‌ی ۳۰۰ تمام می‌شود؛ پس `done C` پیش از `done A` است. `Promise.all` نتیجه‌ها را به ترتیب **آرایه‌ی ورودی** برمی‌گرداند، نه به ترتیب تمام شدن، و مقدار معمولی `second` (یعنی `"B"`) را هم همان‌طور می‌پذیرد: `A,C,B`. گزینه‌ی ۲ فکر کرده `Promise.all` کارها را یکی‌یکی و به ترتیب آرایه اجرا می‌کند، گزینه‌ی ۳ نتیجه را به ترتیب پایان کار دانسته و گزینه‌ی ۴ فکر کرده کد بعد از `await` منتظر نمی‌ماند.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      async function fail() {
        throw new Error("boom");
      }
      async function a() {
        try {
          return await fail();
        } catch (e) {
          return "caught-a";
        }
      }
      async function b() {
        try {
          return fail();
        } catch (e) {
          return "caught-b";
        }
      }
      async function main() {
        console.log(await a());
        try {
          console.log(await b());
        } catch (e) {
          console.log("main caught:", e.message);
        }
      }
      main();
    options:
      - out: ["caught-a", "main caught: boom"]
      - out: ["caught-a", "caught-b"]
      - out: ["caught-a", "!! Error"]
      - out: ["!! Error"]
    answer: 1
    explain: |
      در `a`، `await fail()` منتظر Promise ردشده می‌ماند و رد شدن آن را به شکل یک خطای معمولی **درون** `try` پرتاب می‌کند؛ پس `catch` آن را می‌گیرد و `a` با `"caught-a"` کامل می‌شود. در `b`، `return fail()` بدون `await` فقط Promise را برمی‌گرداند و تابع از `try` خارج می‌شود؛ رد شدن Promise بیرون از `try` اتفاق می‌افتد و `catch` درون `b` آن را نمی‌بیند، پس Promise برگشتی `b` رد می‌شود. این رد شدن در `main` با `await b()` درون `try` گرفته می‌شود: `main caught: boom`. گزینه‌ی ۲ فرق `return await` با `return` را نادیده گرفته، گزینه‌ی ۳ فکر کرده این خطا هیچ‌جا گرفته نمی‌شود و برنامه crash می‌کند و گزینه‌ی ۴ فکر کرده `try...catch` اصلاً خطای async را نمی‌گیرد.
