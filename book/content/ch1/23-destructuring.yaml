      فراخوانی اول `Book` را چاپ می‌کند. در فراخوانی دوم شیء خالی است؛ باز کردن آن مشکلی ندارد و فقط `title` برابر `undefined` می‌شود (رد گزینه‌ی ۲). در فراخوانی سوم پارامتر `undefined` است و باز کردن `undefined` ممکن نیست: `TypeError: Cannot destructure property 'title' of 'undefined'`. گزینه‌ی ۱ این خطا را ندیده (برای جلوگیری از آن باید می‌نوشتیم `{ title } = {}`) و گزینه‌ی ۴ نوع خطا را اشتباه گفته است.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const settings = { theme: null };
      const { theme = "light" } = settings;
      console.log(theme);
      const { color } = settings.theme;
      console.log(color);
    options:
      - out: ["light", "undefined"]
      - out: ["null", "!! TypeError"]
      - out: ["light", "!! TypeError"]
      - out: ["null", "undefined"]
    answer: 2
    explain: |
      `theme` وجود دارد و مقدارش `null` است؛ پیش‌فرض فقط برای `undefined` به کار می‌رود، پس `null` چاپ می‌شود (رد گزینه‌های ۱ و ۳). در خط چهارم می‌خواهیم `null` را باز کنیم؛ `null` هیچ خاصیتی ندارد و این کار خطای `TypeError: Cannot destructure property 'color' of 'settings.theme' as it is null` می‌دهد. گزینه‌ی ۴ فکر کرده باز کردن `null` هم مثل یک شیء خالی، فقط `undefined` می‌دهد.

  - level: easy
    stem: |
      در کدام گزینه `...` نقش **rest** (جمع کردن باقی‌مانده) را دارد، نه spread (پخش کردن)؟
    options:
      - '`const copy = [...list];`'
      - '`const [first, ...others] = list;`'
      - '`Math.max(...list)`'
      - '`const user2 = { ...user, age: 30 };`'
    answer: 2
    explain: |
      rest در **الگوی destructuring** (سمت چپ `=`) یا در پارامترهای تابع می‌آید و باقی‌مانده را جمع می‌کند؛ در گزینه‌ی ۲، `others` همه‌ی اعضا به‌جز اولی را در یک آرایه جمع می‌کند. در گزینه‌های ۱ و ۴، `...` داخل یک آرایه یا شیء جدید (سمت راست `=`) آمده و اعضا را پخش می‌کند و در گزینه‌ی ۳ اعضای آرایه را به شکل آرگومان‌های جدا به تابع می‌دهد؛ هر سه spread هستند.

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const nums = [5, 1, 9];
      console.log(Math.max(...nums));
      console.log(Math.max(nums));
    options:
      - out: ["9", "NaN"]
      - out: ["9", "9"]
      - out: ["NaN", "9"]
      - out: ["9", "!! TypeError"]
    answer: 1
    explain: |
      `Math.max(...nums)` با spread همان `Math.max(5, 1, 9)` است و `9` می‌دهد. اما `Math.max(nums)` فقط **یک** آرگومان دارد که خودِ آرایه است؛ `Math.max` آن را به عدد تبدیل می‌کند و آرایه‌ی سه‌عضوی عدد معتبری نمی‌شود، پس حاصل `NaN` است. گزینه‌ی ۲ فکر کرده `Math.max` خودش آرایه را باز می‌کند، گزینه‌ی ۳ نقش spread را برعکس فهمیده و گزینه‌ی ۴ تصور کرده دادن آرایه خطا می‌دهد.

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const base = { a: 1, b: 2 };
      const x = { ...base, b: 3 };
      const y = { b: 3, ...base };
      console.log(x.b, y.b);
    options:
      - out: "3 3"
      - out: "2 2"
      - out: "2 3"
      - out: "3 2"
    answer: 4
    explain: |
      در object literal اگر یک کلید دو بار مقدار بگیرد، **آخرین** مقدار برنده است. در `x` اول `b: 2` از `base` کپی می‌شود و بعد `b: 3` آن را بازنویسی می‌کند، پس `3`. در `y` اول `b: 3` نوشته می‌شود و بعد spread، مقدار `2` را از `base` روی آن می‌ریزد، پس `2`. گزینه‌ی ۱ فکر کرده مقدار صریح همیشه برنده است، گزینه‌ی ۲ تصور کرده مقدار `base` همیشه برنده است و گزینه‌ی ۳ ترتیب را برعکس خوانده است.

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const a = [1, 2];
      const b = a;
      const c = [...a];
      a.push(3);
      console.log(b.length, c.length);
    options:
      - out: "2 2"
      - out: "3 3"
      - out: "3 2"
      - out: "2 3"
    answer: 3
    explain: |
      `const b = a;` آرایه‌ی جدیدی نمی‌سازد؛ `b` فقط نام دیگری برای **همان** آرایه است، پس `push` روی `a` در `b` هم دیده می‌شود و طولش `3` است. `[...a]` با spread یک آرایه‌ی **جدید** با اعضای آن لحظه (`1` و `2`) می‌سازد که به `a` وابسته نیست، پس طولش `2` می‌ماند. گزینه‌ی ۱ فکر کرده `b` هم کپی است، گزینه‌ی ۲ فکر کرده spread هم فقط ارجاع را کپی می‌کند و گزینه‌ی ۴ این دو را برعکس کرده است.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const original = { name: "Ali", tags: ["x"] };
      const clone = { ...original };
      clone.name = "Sara";
      clone.tags.push("y");
      console.log(original.name, original.tags.length);
    options:
      - out: "Ali 1"
      - out: "Sara 2"
      - out: "Sara 1"
      - out: "Ali 2"
    answer: 4
    explain: |
      spread یک کپی **سطحی** (shallow) می‌سازد: `clone` شیء جدیدی است، پس تغییر `clone.name` روی `original` اثری ندارد و نام همان `Ali` می‌ماند. اما خاصیت `tags` در هر دو شیء به **همان** آرایه اشاره می‌کند؛ `push` روی آرایه‌ی مشترک انجام می‌شود و طول آن در `original` هم `2` است. گزینه‌ی ۱ کپی را عمیق فرض کرده و گزینه‌های ۲ و ۳ فکر کرده‌اند `clone` اصلاً شیء جدیدی نیست.

  - level: hard
    stem: |
      کد زیر نسخه‌ی تغییریافته‌ی مثال اسلاید ۴۸ است. خروجی آن چیست؟
    check: output
    code: |
      const students = [
        { name: "Alice", score: 85 },
        { name: "Bob", score: 62 },
      ];
      const results = students.map((s) => ({ ...s, passed: s.score >= 70 }));
      console.log(results[1].passed, students[1].passed);
      console.log(results[0] === students[0]);
    options:
      - out: ["false false", "true"]
      - out: ["false undefined", "false"]
      - out: ["true undefined", "false"]
      - out: ["false false", "false"]
    answer: 2
    explain: |
      `{ ...s, passed: ... }` برای هر دانشجو یک شیء **جدید** می‌سازد که خاصیت‌های `s` به‌علاوه‌ی `passed` را دارد. نمره‌ی Bob برابر `62` است، پس `passed` برابر `false` است؛ ولی شیء اصلی Bob تغییری نکرده و خاصیت `passed` ندارد، پس `undefined`. چون شیء‌ها جدیدند، `results[0] === students[0]` برابر `false` است. گزینه‌های ۱ و ۴ فکر کرده‌اند spread شیء اصلی را تغییر می‌دهد و گزینه‌ی ۳ نتیجه‌ی مقایسه‌ی `62 >= 70` را اشتباه حساب کرده است.
