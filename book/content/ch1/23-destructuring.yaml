      - out: ["Sara (user)", "Guest (user)", "Guest (user)"]
      - out: ["Sara (user)", "!! TypeError"]
      - out: ["Sara (undefined)", "Guest (user)", "Guest (null)"]
    answer: 1
    explain: |
      در فراخوانی اول `name` داده شده و `role` پیش‌فرض `"user"` را می‌گیرد. فراخوانی دوم آرگومانی ندارد، پس کل پارامتر پیش‌فرض `{}` را می‌گیرد و هر دو خاصیت پیش‌فرض می‌شوند؛ به همین دلیل `TypeError` رخ نمی‌دهد (رد گزینه‌ی ۳). در فراخوانی سوم `role` برابر `null` است که پیش‌فرض را فعال نمی‌کند (رد گزینه‌ی ۲). گزینه‌ی ۴ فکر کرده پیش‌فرض خاصیت‌ها فقط وقتی کار می‌کند که اصلاً آرگومانی داده نشود.

  - level: hard
