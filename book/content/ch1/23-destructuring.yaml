      function show({ title }) {
        console.log(title);
      }
      show({ title: "Book" });
      show({});
      show();
    options:
      - out: ["Book", "undefined", "undefined"]
      - out: ["Book", "!! TypeError"]
      - out: ["Book", "undefined", "!! TypeError"]
      - out: ["Book", "!! ReferenceError"]
