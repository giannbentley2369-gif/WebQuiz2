id: ch1-what-is-js
title: "JavaScript چیست؟ سه لایه‌ی وب، تاریخچه و ECMAScript"
slides: "Introduction to JS، اسلایدهای ۱ تا ۷"
lesson: |
  عنوان این جلسه از درس **«Make 'em Interactive!»** است؛ یعنی «تعاملی‌شان کن!». تا اینجا با HTML و CSS صفحه‌هایی ساختیم که فقط «نمایش» می‌دهند. از این فصل یاد می‌گیریم با **JavaScript** کاری کنیم که صفحه‌ها به کارهای کاربر **واکنش** نشان دهند. خیالت راحت باشد: از صفر شروع می‌کنیم و هیچ پیش‌نیازی لازم نیست.

  ### اهداف این جلسه (اسلاید ۲)

  این جلسه (و این فصل) سه هدف دارد:

  - **(الف)** یاد بگیریم **JavaScript چیست**.
  - **(ب)** **ویژگی‌ها (features) و محدودیت‌های (limitations)** آن را بفهمیم.
  - **(ج)** یاد بگیریم **برنامه‌نویسی ناهمگام** (asynchronous یا async؛ یعنی کارهایی که نتیجه‌شان «بعداً» می‌رسد، مثل گرفتن داده از اینترنت) در JavaScript چطور کار می‌کند.

  ### یادآوری: سه لایه‌ی یک وب‌سایت (اسلاید ۳)

  ::: analogy
  یک خانه را تصور کن. **اسکلت و دیوارها** مشخص می‌کنند خانه چند اتاق دارد و در و پنجره‌ها کجا هستند. **رنگ و دکوراسیون** ظاهر خانه را زیبا می‌کند. اما **سیم‌کشی برق** است که وقتی کلید را می‌زنی، لامپ روشن می‌شود؛ یعنی خانه به کار تو **واکنش** نشان می‌دهد. یک وب‌سایت هم دقیقاً همین سه لایه را دارد.
  :::

  | لایه | به چه سؤالی جواب می‌دهد؟ | زبان | در مثال خانه |
  |---|---|---|---|
  | **Structure** (ساختار) | محتوا چیست؟ (What the **content** is) | HTML | دیوارها، اتاق‌ها، در و پنجره |
  | **Style** (ظاهر) | چه شکلی است؟ (How it **looks**) | CSS | رنگ دیوار و دکوراسیون |
  | **Behaviour** (رفتار) | چطور واکنش نشان می‌دهد؟ (How it **reacts**) | JavaScript | سیم‌کشی برق: کلید را بزنی، لامپ روشن می‌شود |

  خود اسلاید اسم زبان‌ها را نیاورده، ولی در این درس همیشه Structure یعنی HTML، Style یعنی CSS و Behaviour یعنی JavaScript.

  بیا هر سه لایه را در یک صفحه‌ی کوچک ببینیم. HTML یک تیتر و یک دکمه می‌سازد، CSS دکمه را طلایی می‌کند و JavaScript تعداد کلیک‌ها را می‌شمارد:

  ```html title=index.html
  <!DOCTYPE html>
  <html>
    <head>
      <style>
        /* Style layer (CSS): how it looks */
        button { background: gold; padding: 8px 16px; }
      </style>
    </head>
    <body>
      <!-- Structure layer (HTML): what the content is -->
      <h1 id="title">Hello!</h1>
      <button id="btn">Click me</button>

      <script>
        // Behaviour layer (JavaScript): how it reacts
        const button = document.getElementById("btn");
        const title = document.getElementById("title");
        let clicks = 0;
        button.addEventListener("click", () => {
          clicks = clicks + 1;
          title.textContent = "Clicked " + clicks + " times";
        });
      </script>
    </body>
  </html>
  ```

  بعد از دو بار کلیک، متن تیتر می‌شود `Clicked 2 times`. اگر بخش `<script>` را حذف کنی، دکمه هنوز دیده می‌شود و طلایی است، ولی کلیک روی آن **هیچ اتفاقی** نمی‌اندازد و تیتر همان `Hello!` می‌ماند. لازم نیست الان تک‌تک خط‌های این کد را بفهمی؛ کار با صفحه (DOM) را در فصل ۲ کامل یاد می‌گیریم.

  ### تا اینجا چه کارهایی بلدیم؟ (اسلاید ۴)

  - یاد گرفتیم **ساختار** (structure) صفحه‌های وب را مشخص کنیم.
  - یاد گرفتیم **محتوا** را به **بخش‌های معنادار** تقسیم کنیم (مثلاً با تگ‌های `<header>`، `<nav>`، `<main>`، `<section>` و `<footer>`).
  - یاد گرفتیم صفحه‌ها را **استایل** بدهیم (رنگ، فونت، چیدمان).
  - **توانایی‌ها و محدودیت‌های CSS** را شناختیم.
  - اما هنوز **نمی‌توانیم** صفحه‌ها را **interactive** (تعاملی؛ یعنی واکنش‌دهنده به کارهای کاربر) کنیم...

  CSS فقط می‌تواند ظاهر را در چند حالتِ از پیش تعیین‌شده عوض کند (مثلاً با `:hover` رنگ دکمه را وقتی ماوس رویش می‌رود تغییر دهد)، اما **منطق** ندارد: نمی‌تواند تعداد کلیک‌ها را بشمارد، تصمیم بگیرد (مثلاً «اگر رمز کوتاه بود، پیام خطا بده»)، داده‌ای از سرور بگیرد یا متن صفحه را بر اساس ورودی کاربر بسازد. برای این کارها به یک **زبان برنامه‌نویسی** نیاز داریم.

  ### JavaScript چیست؟ (اسلاید ۵)

  - **JavaScript** (به اختصار **JS**) یک **زبان برنامه‌نویسی واقعی** (an actual programming language) است: متغیر، شرط، حلقه و تابع دارد. در مقابل، HTML یک زبان نشانه‌گذاری (markup) و CSS یک زبان استایل‌دهی است و هیچ‌کدام زبان برنامه‌نویسی نیستند.
  - JavaScript هم **در مرورگر** اجرا می‌شود و هم **روی کامپیوتر خودت** (بیرون از مرورگر) به کمک **Node.js** (یک محیط اجرای JavaScript که در فصل ۳ مفصل می‌بینیم).
  - **Brendan Eich** (برندن آیک) اولین **نمونه‌ی اولیه** (prototype) JavaScript را ساخت.
  - او این کار را فقط در **۱۰ روز**، در ماه **مه (May) سال ۱۹۹۵**، وقتی در شرکت **Netscape** (سازنده‌ی مرورگر معروف آن زمان، Netscape Navigator) کار می‌کرد، انجام داد.

  اولین برنامه‌ی JavaScript ما فقط یک پیام چاپ می‌کند (`console.log` را در درس «Console API و محل نوشتن کد JavaScript» کامل می‌بینیم):

  ```js
  console.log("Hello, JavaScript!"); // Hello, JavaScript!
  ```

  ### تاریخچه‌ی JavaScript (اسلاید ۶)

  - **۱۹۹۵:** Brendan Eich اولین نسخه‌ی JavaScript را فقط در ۱۰ روز ساخت. اسم آن نسخه **Mocha** بود.
  - **۱۹۹۶:** اسم Mocha اول به **LiveScript** و بعد به **JavaScript** تغییر کرد. چرا؟ برای اینکه **برنامه‌نویس‌های Java جذب شوند** (Java آن روزها خیلی محبوب بود و این اسم یک تصمیم تبلیغاتی بود). اما اسلاید با تأکید می‌گوید: **JavaScript تقریباً هیچ ربطی به Java ندارد** (JavaScript has almost nothing to do with Java).
  - **۱۹۹۶:** شرکت **Microsoft** در مرورگر **Internet Explorer**، JavaScript را از Netscape **کپی** کرد و اسمش را **JScript** گذاشت.
  - **۱۹۹۷:** حالا هر شرکت نسخه‌ی خودش را داشت و زبان باید **استاندارد** می‌شد. سازمان **ECMA** استاندارد **ECMAScript 1** (به اختصار **ES1**) را منتشر کرد: **اولین استاندارد رسمی JavaScript**.

  ::: analogy
  Java و JavaScript مثل «کار» و «کارتن» هستند: فقط اسمشان شبیه است! شباهت اسم یک تصمیم تبلیغاتی بود، نه نشانه‌ی خویشاوندی دو زبان.
  :::

  #### ECMAScript در برابر JavaScript

  - **ECMAScript** «استاندارد» است: سندی که قواعد زبان را دقیق روی کاغذ می‌نویسد.
  - **JavaScript** «زبان در عمل» است: همان زبانی که در مرورگرها و Node.js با آن کد می‌نویسیم و اجرا می‌کنیم و بر اساس این استاندارد ساخته شده است.
  - **ES** مخفف ECMAScript است؛ پس ES1 یعنی ECMAScript نسخه‌ی ۱.

  ::: analogy
  ECMAScript مثل **کتاب قوانین شطرنج** است و JavaScript خودِ **بازی شطرنجی** که روی صفحه انجام می‌دهی. سازنده‌های مرورگرها کتاب قانون را می‌خوانند و زبان را طبق آن در مرورگرشان پیاده می‌کنند.
  :::

  ### JavaScript مدرن (اسلاید ۷)

  - **۲۰۰۹:** نسخه‌ی **ES5** (ECMAScript 5) با کلی امکان جدید منتشر شد؛ مثلاً حالت strict، شیء `JSON` و متدهای آرایه مثل `forEach`، `map` و `filter`.
  - **۲۰۱۵:** نسخه‌ی **ES6** که اسم دیگرش **ES2015** (ECMAScript 2015) است منتشر شد: **بزرگ‌ترین به‌روزرسانی تاریخ زبان** (the biggest update to the language ever). بیشتر چیزهایی که در این فصل می‌خوانی از همین نسخه آمده‌اند: `let` و `const`، arrow function، `class`، template literal، destructuring، Promise و ماژول‌ها (`import`/`export`).
  - **۲۰۱۵:** ECMAScript به **چرخه‌ی انتشار سالانه** (annual release cycle) تغییر کرد تا در هر به‌روزرسانی **ویژگی‌های کمتری** منتشر شود؛ یعنی به جای یک بسته‌ی خیلی بزرگ هر چند سال یک بار، هر سال یک بسته‌ی کوچک.
  - **۲۰۱۶ تا امروز:** هر سال یک نسخه: ES2016، ES2017، ES2018، ES2019، ES2020، ES2021 و ...

  تصویر اسلاید ۷ (با عنوان «JAVASCRIPT EVOLUTION») شوخی معروف «تکامل انسان» است: از یک میمون خمیده تا مردی کت‌وشلواری با کیف و گوشی هوشمند. پیامش ساده است: JavaScript از ۱۹۹۵ تا امروز **خیلی** تکامل پیدا کرده است.

  #### اسم نسخه‌ها: عددی یا سالی؟

  از ES6 به بعد هر نسخه دو اسم دارد: یک اسم عددی و یک اسم سالی. قاعده‌اش ساده است: **سال = عدد نسخه + ۲۰۰۹**.

  | اسم عددی | اسم سالی | یک نمونه از ویژگی‌های جدید |
  |---|---|---|
  | ES6 | ES2015 | `let`، `const`، arrow function، `class`، Promise |
  | ES7 | ES2016 | عملگر توان `**` و متد `includes` آرایه |
  | ES8 | ES2017 | `async`/`await` |
  | ES11 | ES2020 | `BigInt`، عملگرهای `?.` و `??` |

  #### کل تاریخچه در یک جدول

  | سال | چه اتفاقی افتاد؟ |
  |---|---|
  | ۱۹۹۵ | Brendan Eich در ۱۰ روز (مه ۱۹۹۵، در Netscape) نسخه‌ی اول را ساخت؛ اسمش Mocha بود |
  | ۱۹۹۶ | Mocha به LiveScript و بعد به JavaScript تغییر نام داد (برای جذب برنامه‌نویس‌های Java) |
  | ۱۹۹۶ | Microsoft در Internet Explorer از JavaScript کپی کرد و اسمش را JScript گذاشت |
  | ۱۹۹۷ | ECMA اولین استاندارد رسمی را منتشر کرد: ECMAScript 1 (ES1) |
  | ۲۰۰۹ | ES5 با کلی امکان جدید |
  | ۲۰۱۵ | ES6/ES2015: بزرگ‌ترین به‌روزرسانی تاریخ زبان |
  | ۲۰۱۵ | شروع چرخه‌ی انتشار سالانه (ویژگی‌های کمتر در هر نسخه) |
  | ۲۰۱۶ تا امروز | ES2016، ES2017، ES2018، ... |

  ::: info
  خارج از اسلاید، برای اینکه جای خالی‌ها گیجت نکند: بعد از ES1، نسخه‌های ES2 (۱۹۹۸) و ES3 (۱۹۹۹) آمدند. ES4 هیچ‌وقت منتشر نشد و کنار گذاشته شد؛ برای همین بعد از ES3 مستقیم به ES5 (۲۰۰۹) می‌رسیم. اگر دقیق‌تر بخواهی، تغییر نام به LiveScript و JavaScript در اواخر ۱۹۹۵ انجام شد و JavaScript در سال ۱۹۹۶ همراه با Netscape Navigator 2 به دست کاربران رسید؛ JScript هم در سال ۱۹۹۶ در Internet Explorer 3 عرضه شد. در تست‌های کوییز، همان سال‌های اسلاید را ملاک بگذار.
  :::

  ::: tip
  ES6 و ES2015 **دو اسم برای یک نسخه‌اند**. برای تبدیل اسم عددی به سالی، عدد را با ۲۰۰۹ جمع کن: ES6 یعنی ES2015، ES7 یعنی ES2016 و ES8 یعنی ES2017.
  :::

  ::: trap
  - **ES7 یعنی ES2016، نه ES2017!** این تله در تست‌ها زیاد دیده می‌شود.
  - **ECMAScript** زبان جداگانه یا «نسخه‌ی جدید» JavaScript نیست؛ **استاندارد** JavaScript است. JScript هم نسخه‌ی کپی‌شده‌ی Microsoft بود، نه استاندارد.
  - Java و JavaScript **دو زبان متفاوت‌اند**؛ شباهت اسم فقط برای جذب برنامه‌نویس‌های Java بود.
  - ترتیب اسم‌ها: اول **Mocha**، بعد **LiveScript** و در آخر **JavaScript**.
  :::

  ::: summary
  - وب‌سایت سه لایه دارد: Structure (HTML، محتوا)، Style (CSS، ظاهر) و Behaviour (JavaScript، واکنش).
  - با HTML و CSS تنها، صفحه interactive نمی‌شود؛ برای منطق و واکنش به JavaScript نیاز داریم.
  - JavaScript یک زبان برنامه‌نویسی واقعی است که هم در مرورگر و هم با Node.js روی کامپیوتر اجرا می‌شود.
  - سازنده: Brendan Eich، در ۱۰ روز، مه ۱۹۹۵، در Netscape.
  - اسم‌ها به ترتیب: Mocha، LiveScript، JavaScript. نسخه‌ی کپی‌شده‌ی Microsoft: JScript.
  - ۱۹۹۷: ES1، اولین استاندارد (ECMAScript استاندارد است و JavaScript زبان در عمل). ۲۰۰۹: ES5. ۲۰۱۵: ES6/ES2015، بزرگ‌ترین به‌روزرسانی و شروع انتشار سالانه.
  :::
questions:
  - level: easy
    stem: |
      کدام مورد جزو اهداف این جلسه (اسلاید ۲) **نیست**؟
    options:
      - یاد گرفتن اینکه JavaScript چیست
      - شناخت ویژگی‌ها و محدودیت‌های JavaScript
      - یاد گرفتن نحوه‌ی استایل‌دهی به صفحه با CSS
      - یاد گرفتن نحوه‌ی کار برنامه‌نویسی ناهمگام (async) در JavaScript
    answer: 3
    explain: |
      اسلاید ۲ سه هدف دارد: JavaScript چیست، ویژگی‌ها و محدودیت‌هایش کدام‌اند و برنامه‌نویسی async در آن چطور کار می‌کند؛ یعنی گزینه‌های ۱، ۲ و ۴ دقیقاً همین سه هدف‌اند. استایل‌دهی با CSS موضوع جلسه‌های قبل بود (اسلاید ۴ آن را جزو «کارهایی که تا الان بلدیم» آورده)، نه هدف این جلسه.

  - level: easy
    stem: |
      در مدل «سه لایه‌ی یک وب‌سایت»، لایه‌ی **Behaviour** به کدام سؤال جواب می‌دهد و با کدام زبان ساخته می‌شود؟
    options:
      - «محتوا چیست؟» با HTML
      - «چه شکلی است؟» با CSS
      - «چطور واکنش نشان می‌دهد؟» با JavaScript
      - «چطور واکنش نشان می‌دهد؟» با CSS
    answer: 3
    explain: |
      Behaviour یعنی «How it reacts»: صفحه چطور به کار کاربر واکنش نشان می‌دهد، و این کار JavaScript است. گزینه‌ی ۱ تعریف لایه‌ی Structure (HTML) و گزینه‌ی ۲ تعریف لایه‌ی Style (CSS) است. گزینه‌ی ۴ سؤال را درست گفته ولی زبان را اشتباه؛ CSS فقط ظاهر را تعیین می‌کند و نمی‌تواند منطق و واکنش واقعی بسازد.

  - level: medium
    stem: |
      فرض کن فقط HTML و CSS بلدی. کدام کار را **بدون JavaScript** نمی‌توانی انجام دهی؟
    options:
      - تقسیم محتوای صفحه به بخش‌های معنادار مثل header و footer
      - نمایش عددی که با هر کلیک روی یک دکمه، یکی زیاد شود
      - تعیین رنگ، فونت و چیدمان عناصر صفحه
      - مشخص کردن تیترها، پاراگراف‌ها و تصاویر صفحه
    answer: 2
    explain: |
      شمردن کلیک‌ها یعنی «به خاطر سپردن یک عدد و تغییر صفحه در واکنش به کار کاربر»؛ این منطق و interactivity است و فقط با JavaScript ممکن است (همان مثال دکمه‌ی درسنامه). گزینه‌های ۱ و ۴ کار HTML (لایه‌ی Structure) و گزینه‌ی ۳ کار CSS (لایه‌ی Style) هستند که طبق اسلاید ۴ قبلاً یاد گرفته‌ایم.

  - level: easy
    stem: |
      طبق اسلاید ۵، اولین نمونه‌ی اولیه‌ی JavaScript را چه کسی، کجا و در چه مدتی ساخت؟
    options:
      - Brendan Eich، در شرکت Netscape، در ۱۰ روز
      - Brendan Eich، در شرکت Microsoft، در ۱۰ ماه
      - James Gosling، در شرکت Sun، در ۱۰ روز
      - Tim Berners-Lee، در CERN، در یک سال
    answer: 1
    explain: |
      Brendan Eich در مه ۱۹۹۵ و در شرکت Netscape، فقط در ۱۰ روز اولین نسخه را ساخت. Microsoft بعداً فقط از آن کپی کرد (JScript)، پس گزینه‌ی ۲ غلط است. James Gosling سازنده‌ی زبان Java در شرکت Sun است (دام شباهت اسم) و Tim Berners-Lee مخترع وب (WWW) در CERN است، نه سازنده‌ی JavaScript.

  - level: medium
    stem: |
      ترتیب درست نام‌های این زبان، از اولین نام تا نام امروزی، کدام است؟
    options:
      - اول LiveScript، بعد Mocha، در آخر JavaScript
      - اول Mocha، بعد LiveScript، در آخر JavaScript
      - اول Mocha، بعد JavaScript، در آخر LiveScript
      - اول JScript، بعد LiveScript، در آخر JavaScript
    answer: 2
    explain: |
      طبق اسلاید ۶، نسخه‌ی اول (۱۹۹۵) Mocha نام داشت، سپس به LiveScript و در نهایت به JavaScript تغییر نام داد. گزینه‌های ۱ و ۳ ترتیب را جابه‌جا کرده‌اند. JScript هم هیچ‌وقت نام قبلی JavaScript نبود؛ نسخه‌ی کپی‌شده‌ی Microsoft برای Internet Explorer بود.

  - level: easy
    stem: |
      طبق اسلاید ۶، چرا نام این زبان در نهایت JavaScript شد؟
    options:
      - چون JavaScript نسخه‌ی ساده‌شده‌ی زبان Java است.
      - چون کد JavaScript قبل از اجرا به Java ترجمه می‌شود.
      - چون شرکت Sun (سازنده‌ی Java) آن را ساخته بود.
      - برای جذب برنامه‌نویس‌های Java؛ در حالی که دو زبان تقریباً هیچ ربطی به هم ندارند.
    answer: 4
    explain: |
      اسم JavaScript یک تصمیم تبلیغاتی برای جذب برنامه‌نویس‌های Java بود و اسلاید با خط تأکید می‌گوید «JavaScript has almost nothing to do with Java». پس گزینه‌های ۱ و ۲ (نسخه‌ی ساده‌ی Java بودن یا ترجمه شدن به Java) غلط‌اند. سازنده هم Netscape (Brendan Eich) بود، نه Sun؛ پس گزینه‌ی ۳ هم نادرست است.

  - level: easy
    stem: |
      JScript چه بود؟
    options:
      - اولین استاندارد رسمی JavaScript که ECMA منتشر کرد
      - نسخه‌ای که Microsoft از روی JavaScript کپی کرد و در Internet Explorer به کار برد
      - نام اولیه‌ی JavaScript، پیش از LiveScript
      - ابزاری برای تبدیل کد JavaScript جدید به نسخه‌ی قدیمی‌تر
    answer: 2
    explain: |
      طبق اسلاید ۶، در سال ۱۹۹۶ Microsoft در Internet Explorer از JavaScript شرکت Netscape کپی کرد و اسمش را JScript گذاشت. اولین استاندارد رسمی ES1 بود (گزینه‌ی ۱)، نام اولیه Mocha بود (گزینه‌ی ۳) و ابزار تبدیل کد جدید به قدیمی، transpiler‌هایی مثل Babel هستند (گزینه‌ی ۴).

  - level: medium
    stem: |
      کدام جمله رابطه‌ی **ECMAScript** و **JavaScript** را درست بیان می‌کند؟
    options:
      - ECMAScript استاندارد زبان است و JavaScript زبانی است که در عمل و بر اساس این استاندارد استفاده می‌شود.
      - ECMAScript زبان جدیدی است که در سال ۲۰۱۵ جای JavaScript را گرفت.
      - ECMAScript نسخه‌ی مخصوص Microsoft از JavaScript است.
      - ECMAScript کتابخانه‌ای است که روی JavaScript نصب می‌شود تا امکانات جدید اضافه کند.
    answer: 1
    explain: |
      اسلاید ۶ صریحاً می‌گوید: «ECMAScript is the standard, JavaScript the language in practice». ECMAScript جای JavaScript را نگرفت (گزینه‌ی ۲)؛ ES2015 فقط یک نسخه از همین استاندارد است. نسخه‌ی Microsoft اسمش JScript بود (گزینه‌ی ۳) و ECMAScript سند قواعد زبان است، نه کتابخانه‌ای که نصب شود (گزینه‌ی ۴).

  - level: medium
    stem: |
      اولین استاندارد رسمی JavaScript چه نام داشت، در چه سالی و توسط کدام سازمان منتشر شد؟
    options:
      - ES1 (ECMAScript 1)، سال ۱۹۹۵، Netscape
      - ES5، سال ۲۰۰۹، ECMA
      - JScript، سال ۱۹۹۶، Microsoft
      - ES1 (ECMAScript 1)، سال ۱۹۹۷، ECMA
    answer: 4
    explain: |
      در سال ۱۹۹۷، به خاطر نیاز به استاندارد شدن زبان، سازمان ECMA استاندارد ECMAScript 1 (ES1) را منتشر کرد. سال ۱۹۹۵ سال ساخت Mocha در Netscape بود، نه انتشار استاندارد (گزینه‌ی ۱). ES5 (۲۰۰۹) اولین استاندارد نبود (گزینه‌ی ۲) و JScript اصلاً استاندارد نبود، بلکه کپی Microsoft بود (گزینه‌ی ۳).

  - level: medium
    stem: |
      در جای خالی کدام گزینه قرار می‌گیرد؟

      «در سال ۲۰۰۹ نسخه‌ی ...... منتشر شد و در سال ۲۰۱۵ نسخه‌ی ...... که بزرگ‌ترین به‌روزرسانی تاریخ زبان بود.»
    options:
      - ES5 و ES6/ES2015
      - ES6 و ES2015
      - ES1 و ES5
      - ES5 و ES2016
    answer: 1
    explain: |
      طبق اسلاید ۷، ES5 در ۲۰۰۹ و ES6 (همان ES2015) در ۲۰۱۵ منتشر شد و بزرگ‌ترین به‌روزرسانی تاریخ زبان بود. گزینه‌ی ۲ غلط است چون ES6 و ES2015 دو اسم یک نسخه‌اند و ES6 مال ۲۰۰۹ نیست. ES1 مال ۱۹۹۷ است (گزینه‌ی ۳) و ES2016 نسخه‌ی سال ۲۰۱۶ است، نه ۲۰۱۵ (گزینه‌ی ۴).

  - level: medium
    stem: |
      طبق اسلاید ۷، چرا ECMAScript از سال ۲۰۱۵ به چرخه‌ی انتشار سالانه (annual release cycle) تغییر کرد؟
    options:
      - تا هر سال ویژگی‌های قدیمی زبان حذف شوند.
      - چون ES2015 ایراد داشت و باید هر سال اصلاح می‌شد.
      - تا در هر به‌روزرسانی ویژگی‌های کمتری منتشر شود و تغییرات کوچک‌تر و منظم‌تر باشند.
      - تا مرورگرهای قدیمی دیگر نتوانند هیچ کد JavaScript را اجرا کنند.
    answer: 3
    explain: |
      اسلاید ۷ دلیل را صریحاً می‌گوید: «in order to ship less features per update»؛ یعنی به جای یک بسته‌ی بزرگ هر چند سال، هر سال یک بسته‌ی کوچک‌تر. انتشار سالانه برای حذف ویژگی‌های قدیمی نیست (گزینه‌ی ۱)، ربطی به ایراد داشتن ES2015 ندارد (گزینه‌ی ۲) و هدفش از کار انداختن مرورگرهای قدیمی هم نیست (گزینه‌ی ۴).

  - level: hard
    stem: |
      کدام جمله **نادرست** است؟
    options:
      - ES6 و ES2015 دو نام برای یک نسخه‌اند.
      - ES7 همان ES2017 است.
      - از سال ۲۰۱۵ هر سال یک نسخه‌ی جدید با ویژگی‌های کمتر منتشر می‌شود.
      - ES5 در سال ۲۰۰۹ منتشر شد.
    answer: 2
    explain: |
      از ES6 به بعد، سال = عدد نسخه + ۲۰۰۹؛ پس ES7 یعنی ES2016 (و ES2017 همان ES8 است). بنابراین گزینه‌ی ۲ نادرست است. گزینه‌ی ۱ درست است (ES6 = ES2015)، گزینه‌ی ۳ همان چرخه‌ی انتشار سالانه‌ی اسلاید ۷ است و گزینه‌ی ۴ هم طبق اسلاید ۷ درست است.

  - level: hard
    stem: |
      رویدادهای زیر را از قدیمی به جدید مرتب کن:

      (الف) انتشار ES5 ــ (ب) عرضه‌ی JScript در Internet Explorer ــ (ج) انتشار ES1 توسط ECMA ــ (د) انتشار ES2015
    options:
      - ج، ب، الف، د
      - ب، الف، ج، د
      - ج، الف، ب، د
      - ب، ج، الف، د
    answer: 4
    explain: |
      سال‌ها: JScript در ۱۹۹۶ (ب)، ES1 در ۱۹۹۷ (ج)، ES5 در ۲۰۰۹ (الف) و ES2015 در ۲۰۱۵ (د)؛ پس ترتیب «ب، ج، الف، د» است. گزینه‌ی ۱ فکر کرده استاندارد قبل از JScript آمده؛ در حالی که دقیقاً به خاطر وجود نسخه‌های مختلف (مثل JScript) بود که در ۱۹۹۷ به استاندارد نیاز شد. گزینه‌های ۲ و ۳ هم ES5 را قبل از ES1 گذاشته‌اند.

  - level: hard
    stem: |
      `async`/`await` در نسخه‌ی **ES2017** به زبان اضافه شد. نام عددی (ESn) این نسخه کدام است؟
    options:
      - ES7
      - ES17
      - ES6
      - ES8
    answer: 4
    explain: |
      قاعده: سال = عدد نسخه + ۲۰۰۹؛ پس ۲۰۱۷ − ۲۰۰۹ = ۸ و ES2017 همان ES8 است. ES7 دام معروف است و در واقع ES2016 است. ES6 همان ES2015 است و اسمی مثل ES17 اصلاً وجود ندارد؛ دو رقم آخر سال، عدد نسخه نیست.

  - level: hard
    stem: |
      کدام جمله **درست** است؟
    options:
      - JavaScript در سال ۱۹۹۵ در Microsoft ساخته شد و Netscape آن را با نام JScript کپی کرد.
      - ES5 بزرگ‌ترین به‌روزرسانی تاریخ JavaScript بود.
      - JavaScript یک زبان برنامه‌نویسی واقعی است که هم در مرورگر و هم به کمک Node.js روی کامپیوتر خودمان اجرا می‌شود.
      - ECMAScript نام زبان جدیدی است که از سال ۲۰۱۵ جای JavaScript را گرفت.
    answer: 3
    explain: |
      اسلاید ۵ می‌گوید JavaScript «an actual programming language» است و «in your browser AND your machine (via Node.js)» اجرا می‌شود. گزینه‌ی ۱ نقش‌ها را جابه‌جا کرده: Netscape سازنده بود و Microsoft کپی‌کننده (JScript). بزرگ‌ترین به‌روزرسانی ES6/ES2015 بود نه ES5 (گزینه‌ی ۲) و ECMAScript استاندارد JavaScript است، نه زبانی که جایش را گرفته باشد (گزینه‌ی ۴).
