title: "Closure (بستار)"
slides: "Introduction to JS، اسلاید ۲۸"
lesson: |
  ### تابعی با کوله‌پشتی
  فرض کن تابعی داخل تابع دیگری «متولد» می‌شود. موقع تولد، یک **کوله‌پشتی** به او می‌دهند که داخلش متغیرهای اطرافش (متغیرهای تابع والد) قرار دارد. حالا این تابع هر جا برود (از تابع والد بیرون فرستاده شود، به `setTimeout` داده شود یا در یک آرایه ذخیره شود)، کوله‌پشتی‌اش را هم با خودش می‌برد و هر وقت لازم داشت از متغیرهای داخلش استفاده می‌کند؛ حتی اگر کار تابع والد مدت‌ها پیش تمام شده باشد. به این «تابع به‌همراه کوله‌پشتی‌اش» **closure** (بستار؛ تابعی که متغیرهای محیطِ تعریفش را به خاطر می‌سپارد) می‌گوییم.

  ### پیش‌نیاز: lexical scope (محدوده‌ی واژگانی)
  در درس‌های قبل دیدیم که هر متغیر فقط داخل scope (محدوده‌ی) خودش در دسترس است. وقتی تابع‌ها داخل هم نوشته می‌شوند، یک قاعده‌ی ساده حاکم است: **هر تابع به متغیرهای خودش، متغیرهای تابع‌هایی که داخلشان نوشته شده و متغیرهای سراسری (global) دسترسی دارد**؛ ولی برعکسش ممکن نیست و تابع بیرونی متغیرهای تابع درونی را نمی‌بیند.

  ```js
  const greeting = "Hello";             // global

  function outer() {
    const name = "Sara";                // local to outer
    function inner() {
      const mark = "!";                 // local to inner
      console.log(greeting + ", " + name + mark); // inner sees all three
    }
    inner();
    console.log(typeof mark);           // "undefined": outer cannot see inside inner
  }

  outer();
  // Hello, Sara!
  // undefined
  ```

  وقتی `inner` به نام `name` می‌رسد، اول بین متغیرهای خودش می‌گردد؛ پیدا نمی‌کند، پس یک لایه بیرون‌تر (`outer`) را نگاه می‌کند و پیدا می‌کند. برای `greeting` تا لایه‌ی سراسری بالا می‌رود. به این زنجیره‌ی جست‌وجو **scope chain** (زنجیره‌ی scopeها) می‌گویند.

  کلمه‌ی **lexical** (واژگانی؛ یعنی مربوط به متن کد) نکته‌ی اصلی را می‌گوید: **جایی که تابع نوشته شده** تعیین می‌کند چه چیزهایی را می‌بیند، نه جایی که صدا زده می‌شود:

  ```js
  const x = "global";

  function printX() {
    console.log(x);
  }

  function run() {
    const x = "local";
    printX(); // global (printX was WRITTEN at the top level, so it sees the global x)
  }

  run();
  ```

  `printX` در سطح بالای فایل نوشته شده، پس فقط `x` سراسری را می‌شناسد؛ اینکه داخل `run` صدا زده شده، هیچ اهمیتی ندارد.

  ### Closure چیست؟ (اسلاید ۲۸)
  اسلاید ۲۸ این‌طور تعریف می‌کند:

  - **A closure is when a function keeps access to its parent's variables** (A function that remembers variables from its outer scope): closure یعنی تابعی که دسترسی به متغیرهای تابع والدش را **نگه می‌دارد**؛ تابعی که متغیرهای scope بیرونی‌اش را «به خاطر می‌سپارد».
  - **Keeps access even after the outer function ends**: این دسترسی **حتی بعد از تمام شدن تابع بیرونی** باقی می‌ماند.
  - **Used for encapsulation, state, and callbacks**: برای کپسوله‌سازی (پنهان کردن داده)، نگه‌داری وضعیت (state) و callbackها استفاده می‌شود.
  - **Common in JS and other functional languages**: در JavaScript و دیگر زبان‌های تابعی (functional) رایج است.
  - **BEWARE OF PITFALL**: closureها وقتی با `var` ترکیب شوند، می‌توانند مشکل‌ساز شوند (آخر همین درس).

  بند دوم مهم‌ترین بخش است. معمولاً وقتی اجرای یک تابع تمام می‌شود، متغیرهای محلی‌اش از بین می‌روند. ولی اگر تابعی که داخل آن ساخته شده هنوز زنده باشد و به آن متغیرها نیاز داشته باشد، JavaScript آن‌ها را نگه می‌دارد.

  ### کد اسلاید ۲۸: شمارنده

  ```js title=sample.js
  function counter() {
    let count = 0;
    return function() {
      count++;
      return count;
    };
  }

  const c = counter();
  console.log(c()); // 1
  console.log(c()); // 2
  ```

  قدم‌به‌قدم:

  1. `const c = counter();`: تابع `counter` اجرا می‌شود، متغیر `count` را با مقدار `0` می‌سازد، یک تابع بی‌نام (anonymous) می‌سازد و **همان تابع** را برمی‌گرداند. حالا کار `counter` تمام شده است.
  2. `c` حالا **تابع درونی** است، نه یک عدد! تابعی که در کوله‌پشتی‌اش متغیر `count` را دارد (`typeof c` برابر `"function"` است).
  3. اولین `c()`: `count` از `0` به `1` می‌رسد و `1` برگردانده می‌شود.
  4. دومین `c()`: **همان** `count` از `1` به `2` می‌رسد و `2` برگردانده می‌شود. شمارنده یادش مانده است!

  `count` نه سراسری است و نه با هر `c()` از نو ساخته می‌شود؛ فقط در کوله‌پشتی `c` زندگی می‌کند و هیچ کد دیگری مستقیم به آن دسترسی ندارد. اگر بیرون از `counter` بنویسی `console.log(count)`، خطای `ReferenceError: count is not defined` می‌گیری.

  ### هر بار صدا زدن، یک closure تازه و مستقل
  هر بار که `counter()` را صدا بزنی، یک `count` **جدید** ساخته می‌شود و تابع جدیدی با کوله‌پشتی جدید برمی‌گردد. دو شمارنده هیچ وضعیتی را با هم شریک نیستند (با همان تابع `counter` اسلاید):

  ```js
  const c1 = counter();
  const c2 = counter();
  console.log(c1()); // 1
  console.log(c1()); // 2
  console.log(c2()); // 1 (c2 has its own count)
  console.log(c1()); // 3
  ```

  ::: analogy
  `counter` مثل دستگاهی است که «شمارنده‌ی دستی» تولید می‌کند. هر بار دکمه‌ی دستگاه را بزنی (`counter()`)، یک شمارنده‌ی نو با عدد صفر تحویل می‌گیری. اگر روی شمارنده‌ی اول ده بار کلیک کنی، عدد شمارنده‌ی دوم تکان نمی‌خورد.
  :::

  ### closure خودِ متغیر را نگه می‌دارد، نه عکسی از مقدارش
  کوله‌پشتی یک **عکس (snapshot)** از مقدارها نیست؛ خودِ متغیرها داخلش هستند. پس اگر متغیر بعداً تغییر کند، closure **مقدار جدید** را می‌بیند:

  ```js
  let color = "red";
  const showColor = () => console.log(color);
  color = "blue";
  showColor(); // blue (the closure reads the CURRENT value of color)
  ```

  همین‌طور تابع درونی می‌تواند متغیر بیرونی را **تغییر** دهد (مثل `count++` در شمارنده) و این تغییر را همه‌ی توابعی که آن متغیر را در کوله‌پشتی دارند می‌بینند.

  ::: note پارامترها هم متغیرند
  پارامترهای یک تابع، متغیرهای محلی همان تابع‌اند. وقتی تابع را صدا می‌زنی، **مقدار فعلی** آرگومان در پارامتر ریخته می‌شود و closure به همان پارامتر وصل است، نه به متغیری که بیرون از تابع داشتی:

  ```js
  function remember(value) {
    return () => value; // captures the PARAMETER variable "value"
  }

  let n = 1;
  const getN = remember(n); // the current value of n (1) is copied into the parameter
  n = 99;
  console.log(getN()); // 1
  ```
  :::

  ### کاربرد ۱: encapsulation (کپسوله‌سازی؛ پنهان کردن داده)
  با closure می‌توانیم متغیری بسازیم که **فقط** از طریق چند تابع مشخص قابل خواندن و تغییر باشد؛ یعنی یک **متغیر خصوصی (private)**. در مثال زیر، `createCounter` یک شیء (object؛ مجموعه‌ای از جفت‌های «کلید: مقدار» که در درس «اشیاء» کامل می‌خوانیم) با دو تابع برمی‌گرداند:

  ```js
  function createCounter() {
    let count = 0; // private: only the two functions below can reach it

    return {
      increment: () => {
        count++;
      },
      getValue: () => count,
    };
  }

  const counter = createCounter();
  counter.increment();
  counter.increment();
  console.log(counter.getValue()); // 2
  console.log(counter.count);      // undefined (no direct access to count)
  ```

  هیچ کدی بیرون از `createCounter` نمی‌تواند `count` را مستقیم بخواند یا خراب کند (مثلاً منفی‌اش کند)؛ فقط `increment` و `getValue` کلید کوله‌پشتی را دارند. دقت کن که هر دو تابع در **یک** اجرای `createCounter` ساخته شده‌اند، پس **یک `count` مشترک** دارند.

  ### کاربرد ۲: state (نگه‌داری وضعیت) و function factory
  closure به تابع «حافظه» می‌دهد. یک الگوی رایج، **function factory** (کارخانه‌ی تابع؛ تابعی که تابع می‌سازد و برمی‌گرداند) است:

  ```js
  function makeMultiplier(factor) {
    return (n) => n * factor; // remembers its own factor
  }

  const double = makeMultiplier(2);
  const triple = makeMultiplier(3);
  console.log(double(5)); // 10
  console.log(triple(5)); // 15
  ```

  `double` و `triple` از یک کارخانه آمده‌اند، ولی چون هر صدا زدن `makeMultiplier` یک closure جدید می‌سازد، هر کدام `factor` مخصوص خودش را دارد.

  ### کاربرد ۳: callbackها
  **callback** (تابعی که به تابع دیگری داده می‌شود تا بعداً صدا زده شود) تقریباً همیشه یک closure است. تابع `setTimeout(fn, ms)` تابع `fn` را **بعداً** اجرا می‌کند (حداقل `ms` میلی‌ثانیه بعد؛ جزئیاتش را در درس‌های بخش ناهمگام همین فصل می‌خوانیم). فعلاً همین یک نکته را بدان: callback حتی با تأخیر `0` هم فقط **بعد از تمام شدن کل کد همگام (synchronous) فعلی** اجرا می‌شود:

  ```js
  setTimeout(() => console.log("timer"), 0);
  console.log("sync");
  // sync
  // timer
  ```

  وقتی callback بالاخره اجرا می‌شود، تابعی که آن را ساخته مدت‌هاست تمام شده؛ ولی callback به لطف closure هنوز متغیرهای آن را دارد:

  ```js
  function greetLater(name) {
    setTimeout(() => {
      console.log("Hello, " + name); // the callback still remembers name
    }, 1000);
    console.log("greetLater finished");
  }

  greetLater("Ali");
  // greetLater finished
  // (one second later) Hello, Ali
  ```

  ### «رایج در JS و زبان‌های تابعی»
  closure در JavaScript کاملاً طبیعی است، چون توابع **first-class** هستند (یکی از ویژگی‌های JavaScript در اسلاید ۹): می‌شود آن‌ها را در متغیر ریخت، به تابع دیگر داد و از تابع برگرداند. زبان‌های **functional** (تابعی) مثل Haskell و Lisp و بیشتر زبان‌های مدرن (مثل Python، Kotlin و Swift) هم closure دارند.

  ::: info بیشتر بدانیم: closure و حافظه
  JavaScript حافظه را خودکار مدیریت می‌کند (garbage collection؛ یکی دیگر از ویژگی‌های اسلاید ۹). متغیری که در کوله‌پشتی یک closure زنده است، پاک نمی‌شود؛ وقتی دیگر هیچ ارجاعی به آن closure نماند، متغیرهایش هم قابل پاک شدن می‌شوند.
  :::

  ### BEWARE OF PITFALL: closure و `var` در حلقه
  این معروف‌ترین تست closure است:

  ```js
  for (var i = 0; i < 3; i++) {
    setTimeout(() => console.log(i), 0);
  }
  // 3
  // 3
  // 3
  ```

  انتظار داشتی `0`، `1`، `2` ببینی؟ دو دلیل دست به دست هم می‌دهند:

  1. **`var` فقط یک متغیر می‌سازد.** `var` بلوک حلقه را نمی‌شناسد (function-scoped است)، پس در کل اجرای حلقه فقط **یک** `i` وجود دارد و هر سه callback **همان یک** `i` را در کوله‌پشتی دارند (یادت باشد: closure خودِ متغیر را نگه می‌دارد، نه عکسی از مقدارش).
  2. **callbackها بعد از تمام شدن حلقه اجرا می‌شوند.** `setTimeout` فقط زمان‌بندی می‌کند؛ اجرای واقعی بعد از تمام شدن کد همگام است.

  | لحظه | مقدار `i` | چه اتفاقی می‌افتد؟ |
  |---|---|---|
  | تکرار اول | `0` | callback اول زمان‌بندی می‌شود (اجرا نمی‌شود) |
  | تکرار دوم | `1` | callback دوم زمان‌بندی می‌شود |
  | تکرار سوم | `2` | callback سوم زمان‌بندی می‌شود |
  | بعد از آخرین `i++` | `3` | شرط `3 < 3` نادرست است و حلقه تمام می‌شود |
  | بعد از پایان کد همگام | `3` | هر سه callback اجرا می‌شوند و همان `i` مشترک را می‌خوانند: `3`، `3`، `3` |

  #### راه‌حل ۱: `let`

  ```js
  for (let i = 0; i < 3; i++) {
    setTimeout(() => console.log(i), 0);
  }
  // 0
  // 1
  // 2
  ```

  وقتی `let` در **سرآیند (header)** حلقه‌ی `for` باشد، JavaScript برای **هر تکرار یک binding (نسخه‌ی) جدید** از `i` می‌سازد که با مقدار همان تکرار شروع می‌شود. پس هر callback، `i` مخصوص تکرار خودش را در کوله‌پشتی دارد. این ساده‌ترین و توصیه‌شده‌ترین راه‌حل است.

  #### راه‌حل ۲: IIFE (روش قدیمی، پیش از `let`)
  **IIFE** (Immediately Invoked Function Expression؛ تابعی که همان لحظه‌ی تعریف صدا زده می‌شود، مثل پنل سوم میم اسلاید ۳۶) برای هر تکرار یک scope تازه می‌سازد:

  ```js
  for (var i = 0; i < 3; i++) {
    (function (j) {
      setTimeout(() => console.log(j), 0); // j belongs to this IIFE call only
    })(i);
  }
  // 0
  // 1
  // 2
  ```

  در هر تکرار، IIFE با مقدار فعلی `i` صدا زده می‌شود و آن مقدار در پارامتر `j` ریخته می‌شود. چون هر بار صدا زدن تابع، متغیرهای محلی جدید خودش را دارد، سه `j` جداگانه با مقدارهای `0`، `1` و `2` ساخته می‌شود.

  #### همین دام، بدون `setTimeout`: آرایه‌ای از توابع
  مشکل از خود `setTimeout` نیست؛ از «یک متغیر مشترک + اجرای دیرتر» است. اینجا توابع در یک آرایه ذخیره می‌شوند (`push` یک عنصر به انتهای آرایه اضافه می‌کند؛ درس «آرایه‌ها») و بعد از تمام شدن حلقه صدا زده می‌شوند:

  ```js
  var fns = [];
  for (var i = 0; i < 3; i++) {
    fns.push(function () {
      return i;
    });
  }
  console.log(fns[0](), fns[1](), fns[2]()); // 3 3 3
  ```

  با `for (let i = 0; ...)` همین کد `0 1 2` چاپ می‌کند.

  #### چه چیزهایی مشکل را حل **نمی‌کنند**؟
  کپی کردن `i` در یک `var` دیگر فایده‌ای ندارد، چون `var j` هم فقط **یک** متغیر مشترک است:

  ```js
  for (var i = 0; i < 3; i++) {
    var j = i; // still ONE shared j (var is function-scoped)
    setTimeout(() => console.log(j), 0);
  }
  // 2
  // 2
  // 2
  ```

  `let` هم فقط وقتی binding جدید می‌سازد که **در سرآیند حلقه** تعریف شود؛ `let` بیرون از حلقه یعنی باز هم یک متغیر مشترک:

  ```js
  let i; // ONE binding, declared outside the loop header
  for (i = 0; i < 3; i++) {
    setTimeout(() => console.log(i), 0);
  }
  // 3
  // 3
  // 3
  ```

  اما `let copy = i;` **داخل** بدنه‌ی حلقه مشکل را حل می‌کند، چون `let` در هر تکرار یک متغیر جدید در بلوک بدنه می‌سازد:

  ```js
  for (var i = 0; i < 3; i++) {
    let copy = i; // a NEW copy in every iteration (block-scoped)
    setTimeout(() => console.log(copy), 0);
  }
  // 0
  // 1
  // 2
  ```

  ::: tip
  - closure = تابع + متغیرهای محیطی که در آن **نوشته** شده (lexical scope)؛ حتی بعد از تمام شدن تابع بیرونی.
  - closure به **متغیر** وصل است، نه به مقدار لحظه‌ی ساخته شدن؛ تغییرات بعدی دیده می‌شوند.
  - هر بار صدا زدن تابع بیرونی، متغیرهای جدید و closure مستقل می‌سازد؛ ولی توابعی که در **یک** اجرا ساخته شده‌اند، متغیرها را با هم شریک‌اند.
  - برای ساختن متغیر خصوصی، آن را داخل یک تابع تعریف کن و فقط توابعی را که به آن نیاز دارند برگردان.
  - در حلقه‌ها همیشه از `let` استفاده کن.
  :::

  ::: trap
  - حلقه‌ی `for (var i ...)` با `setTimeout` یا آرایه‌ای از توابع: همه مقدار نهایی `i` را چاپ می‌کنند. با `let` در سرآیند حلقه: `0`، `1`، `2`.
  - مقدار نهایی را دقیق حساب کن: در `for (var i = 1; i <= 3; i++)` حلقه وقتی `i` برابر `4` شود تمام می‌شود، پس همه `4` می‌بینند، نه `3`.
  - `var j = i;` داخل بدنه و `let k;` بیرون از سرآیند حلقه مشکل را حل نمی‌کنند؛ `let copy = i;` داخل بدنه حل می‌کند.
  - IIFE فقط وقتی کمک می‌کند که مقدار را به‌عنوان **پارامتر** بگیرد؛ IIFE بدون پارامتر که داخلش `i` را بخواند، باز همان `i` مشترک را می‌بیند.
  - `const c = counter();` یعنی `c` یک **تابع** است، نه عدد. و `counter()()` همیشه `1` می‌دهد، چون هر بار شمارنده‌ی تازه‌ای ساخته می‌شود.
  - متغیر خصوصی closure با ویژگی هم‌نام شیء فرق دارد: `obj.count = 100` یک ویژگی جدید می‌سازد و به `count` داخل closure دست نمی‌زند.
  :::

  ::: summary
  - closure یعنی تابعی که متغیرهای scope بیرونی (والد) را به خاطر می‌سپارد و حتی بعد از پایان تابع بیرونی به آن‌ها دسترسی دارد (اسلاید ۲۸).
  - کاربردها: encapsulation (متغیر خصوصی)، state (شمارنده، function factory) و callbackها.
  - کد اسلاید ۲۸: `c()` اول `1` و بعد `2` برمی‌گرداند.
  - دام `var`: یک متغیر مشترک + اجرای دیرتر = همه مقدار آخر را می‌بینند. راه‌حل: `let` در سرآیند حلقه یا IIFE با پارامتر.
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۲۸، **closure** چیست؟
    options:
      - 'تابعی که برنامه را می‌بندد و اجرای آن را متوقف می‌کند.'
      - 'تابعی که هنگام ساخته شدن، یک کپی ثابت (snapshot) از مقدار متغیرهای بیرونی برمی‌دارد و تغییرات بعدی آن‌ها را نمی‌بیند.'
      - 'تابعی که به متغیرهای scope بیرونی (والد) خود دسترسی دارد و این دسترسی را حتی بعد از تمام شدن تابع بیرونی هم حفظ می‌کند.'
      - 'تابعی که هیچ دسترسی‌ای به متغیرهای بیرون از خودش ندارد.'
    answer: 3
    explain: |
      طبق اسلاید ۲۸، closure یعنی تابعی که دسترسی به متغیرهای تابع والدش (scope بیرونی) را **نگه می‌دارد**، حتی بعد از اینکه اجرای تابع بیرونی تمام شده باشد. گزینه‌ی ۲ تصور غلط رایجی است: closure از مقدارها عکس (snapshot) نمی‌گیرد، بلکه به خودِ متغیرها وصل است و تغییرات بعدی را می‌بیند. گزینه‌ی ۱ از معنی لغوی close (بستن) گمراه شده و گزینه‌ی ۴ دقیقاً برعکس تعریف است.

  - level: easy
    stem: |
      در JavaScript، اینکه یک تابع به کدام متغیرها دسترسی دارد (**lexical scope**)، با چه چیزی تعیین می‌شود؟
    options:
      - 'جایی که تابع **صدا زده** می‌شود.'
      - 'ترتیب زمانی صدا زدن توابع هنگام اجرا.'
      - 'نوع داده‌ی متغیرها.'
      - 'جایی که تابع در متن کد **نوشته (تعریف)** شده است.'
    answer: 4
    explain: |
      کلمه‌ی lexical (واژگانی) یعنی «مربوط به متن کد»: اینکه یک تابع کدام متغیرها را می‌بیند، با **جایی که در کد نوشته شده** تعیین می‌شود. جایی که صدا زده می‌شود (گزینه‌ی ۱) یا ترتیب صدا زدن‌ها در زمان اجرا (گزینه‌ی ۲) تأثیری در scope آن ندارد، و نوع داده‌ی متغیرها (گزینه‌ی ۳) هم ربطی به دسترسی ندارد.

  - level: easy
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const site = "Sharif";
      function outer() {
        const course = "Web";
        function inner() {
          console.log(course + " @ " + site);
        }
        inner();
      }
      outer();
    options:
      - out: "undefined @ Sharif"
      - out: "Web @ Sharif"
      - out: ["!! ReferenceError"]
      - out: "Web @ undefined"
    answer: 2
    explain: |
      `inner` داخل `outer` نوشته شده، پس به متغیرهای خودش، متغیرهای `outer` (یعنی `course`) و متغیرهای سراسری (`site`) دسترسی دارد؛ جست‌وجوی هر نام از درونی‌ترین scope شروع می‌شود و لایه‌به‌لایه بیرون می‌رود (scope chain). پس `Web @ Sharif` چاپ می‌شود. گزینه‌های ۱ و ۴ فکر کرده‌اند تابع درونی فقط یکی از این دو لایه را می‌بیند و گزینه‌ی ۳ فکر کرده تابع درونی اصلاً به متغیرهای بیرونی دسترسی ندارد.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const label = "global";
      function makePrinter() {
        const label = "maker";
        return function () {
          console.log(label);
        };
      }
      function run() {
        const label = "runner";
        const print = makePrinter();
        print();
      }
      run();
    options:
      - out: "global"
      - out: "maker"
      - out: "runner"
      - out: "undefined"
    answer: 2
    explain: |
      تابع بی‌نامی که `makePrinter` برمی‌گرداند، داخل `makePrinter` **نوشته شده**، پس `label` را در scope همان تابع پیدا می‌کند: `"maker"`. اینکه بعداً داخل `run` صدا زده شده (جایی که `label` برابر `"runner"` است) اهمیتی ندارد، چون scope با محل نوشتن تعیین می‌شود (lexical scope؛ رد گزینه‌ی ۳). `label` سراسری هم با `label` نزدیک‌تر (داخل `makePrinter`) پنهان شده است (رد گزینه‌ی ۱). `undefined` هم غلط است، چون نام در زنجیره‌ی scope پیدا می‌شود.

  - level: easy
    stem: |
      خروجی کد اسلاید ۲۸ کدام است؟
    check: output
    code: |
      function counter() {
        let count = 0;
        return function() {
          count++;
          return count;
        };
      }

      const c = counter();
      console.log(c());
      console.log(c());
    options:
      - out: ["1", "1"]
      - out: ["0", "1"]
      - out: ["!! ReferenceError"]
      - out: ["1", "2"]
    answer: 4
    explain: |
      `counter()` متغیر `count` را با `0` می‌سازد و تابع درونی را برمی‌گرداند. اولین `c()` همان `count` را `1` می‌کند و برمی‌گرداند؛ دومین `c()` **همان** متغیر را `2` می‌کند. گزینه‌ی ۱ فکر کرده `count` با هر `c()` از نو ساخته می‌شود (در حالی که فقط یک بار، هنگام اجرای `counter()`، ساخته شده است). گزینه‌ی ۲ فکر کرده مقدار قبل از افزایش برگردانده می‌شود، ولی `return count` بعد از `count++` اجرا می‌شود. گزینه‌ی ۳ فکر کرده `count` با تمام شدن `counter` از بین رفته است.

  - level: easy
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function counter() {
        let count = 0;
        return function() {
          count++;
          return count;
        };
      }

      const c = counter();
      console.log(typeof c);
    options:
      - out: "number"
      - out: "function"
      - out: "undefined"
      - out: "object"
    answer: 2
    explain: |
      `counter()` یک **تابع** برمی‌گرداند (همان `function() { count++; return count; }`)، نه عدد. پس `c` تابعی است که `count` را در کوله‌پشتی‌اش دارد و `typeof c` برابر `"function"` است. گزینه‌ی ۱ فکر کرده `c` همان مقدار `count` است؛ ولی `count` فقط با صدا زدن `c()` برگردانده می‌شود. `undefined` و `object` هم غلط‌اند: `counter` واقعاً چیزی برگردانده و `typeof` برای توابع `"function"` می‌دهد.

  - level: easy
    stem: |
      در کد اسلاید ۲۸، بعد از اجرای `const c = counter();` کار تابع `counter` تمام شده است. سرنوشت متغیر `count` چیست؟
    options:
      - 'زنده می‌ماند، چون تابع برگردانده‌شده (`c`) هنوز به آن ارجاع دارد.'
      - 'حذف می‌شود و `c()` بعدی خطای `ReferenceError` می‌دهد.'
      - 'با هر بار صدا زدن `c()` دوباره از `0` شروع می‌شود.'
      - 'به یک متغیر سراسری (global) تبدیل می‌شود که همه‌جا در دسترس است.'
    answer: 1
    explain: |
      اسلاید ۲۸: «Keeps access even after the outer function ends». وقتی `counter` تمام می‌شود، معمولاً متغیرهای محلی‌اش پاک می‌شوند؛ ولی چون تابع برگردانده‌شده (`c`) هنوز به `count` نیاز دارد، JavaScript آن را زنده نگه می‌دارد. برای همین `c()` بار دوم `2` می‌دهد، نه خطا (رد گزینه‌ی ۲) و نه دوباره `1` (رد گزینه‌ی ۳). `count` سراسری هم نمی‌شود (رد گزینه‌ی ۴): بیرون از `counter` با نام `count` قابل دسترسی نیست و فقط از راه `c` به آن می‌رسیم.

  - level: easy
    stem: |
      کدام خط کد زیر خطا می‌دهد؟
    check: error-line
    errorName: ReferenceError
    code: |
      function counter() {
        let count = 0;
        return function () {
          count++;
          return count;
        };
      }
      const c = counter();
      c();
      console.log(c());
      console.log(count);
    options:
      - line: 0
      - line: 4
      - line: 10
      - line: 11
    answer: 4
    explain: |
      `count` متغیر محلی `counter` است و فقط تابع درونی (از طریق closure) به آن دسترسی دارد. در scope سراسری هیچ متغیری به نام `count` وجود ندارد، پس خط ۱۱ خطای `ReferenceError: count is not defined` می‌دهد. خط‌های ۴ و ۱۰ مشکلی ندارند: تابع درونی `count` را از کوله‌پشتی‌اش می‌خواند و خط ۱۰ عدد `2` را چاپ می‌کند. این همان encapsulation است: داده فقط از راه تابع در دسترس است.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function counter() {
        let count = 0;
        return function () {
          count++;
          return count;
        };
      }
      const a = counter();
      const b = counter();
      a();
      a();
      console.log(a(), b(), counter()());
    options:
      - out: "3 4 5"
      - out: "1 1 1"
      - out: "3 1 2"
      - out: "3 1 1"
    answer: 4
    explain: |
      هر بار صدا زدن `counter()` یک `count` **جدید** و یک closure مستقل می‌سازد. `a` سه بار صدا زده شده (دو بار بیرون و یک بار داخل `console.log`)، پس `3` برمی‌گرداند. `b` شمارنده‌ی خودش را دارد و اولین صدا زدنش `1` است. `counter()()` یک شمارنده‌ی کاملاً تازه می‌سازد و همان لحظه یک بار صدایش می‌زند: `1`. گزینه‌ی ۱ فکر کرده همه یک `count` مشترک دارند، گزینه‌ی ۲ صدا زدن‌های `a()` بیرون از `console.log` را نادیده گرفته، و گزینه‌ی ۳ فکر کرده `counter()()` شمارنده‌ی `b` را ادامه می‌دهد.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function setup() {
        let msg = "first";
        const say = () => console.log(msg);
        msg = "second";
        return say;
      }
      const fn = setup();
      fn();
    options:
      - out: "first"
      - out: "undefined"
      - out: "second"
      - out: ["!! ReferenceError"]
    answer: 3
    explain: |
      closure از مقدار متغیر عکس نمی‌گیرد؛ به **خودِ متغیر** `msg` وصل است. `say` وقتی ساخته شد که `msg` برابر `"first"` بود، ولی قبل از اینکه صدا زده شود، `msg` به `"second"` تغییر کرد. وقتی `fn()` اجرا می‌شود، مقدار **فعلی** `msg` را می‌خواند: `second`. گزینه‌ی ۱ همان تصور غلط «snapshot» است و گزینه‌های ۲ و ۴ فکر کرده‌اند بعد از تمام شدن `setup` متغیرهایش از بین رفته‌اند.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function makeGreeter(greeting) {
        return (name) => greeting + ", " + name;
      }
      let g = "Hi";
      const greeter = makeGreeter(g);
      g = "Bye";
      console.log(greeter("Ali"));
    options:
      - out: "Hi, Ali"
      - out: "Bye, Ali"
      - out: "undefined, Ali"
      - out: ["!! ReferenceError"]
    answer: 1
    explain: |
      `greeting` پارامتر `makeGreeter` است؛ یعنی یک متغیر محلی جداگانه که هنگام صدا زدن، **مقدار فعلی** `g` (یعنی `"Hi"`) در آن ریخته شده است. closure به همین پارامتر وصل است، نه به `g`؛ پس تغییر بعدی `g` به `"Bye"` روی `greeting` اثری ندارد و `Hi, Ali` چاپ می‌شود. گزینه‌ی ۲ فکر کرده closure به `g` وصل است (closure به متغیرِ داخل scope خودش، یعنی `greeting`، وصل است). گزینه‌های ۳ و ۴ هم فکر کرده‌اند پارامتر بعد از تمام شدن `makeGreeter` از بین رفته است.

  - level: medium
    stem: |
      کدام عبارت درباره‌ی closureها **نادرست** است؟
    options:
      - 'هر بار صدا زدن تابع بیرونی، مجموعه‌ی جدید و مستقلی از متغیرهای محلی (و در نتیجه closure جدیدی) می‌سازد.'
      - 'closure حتی بعد از تمام شدن تابع بیرونی، به متغیرهای آن دسترسی دارد.'
      - 'تابع درونی می‌تواند متغیر بیرونی را هم بخواند و هم تغییر دهد.'
      - 'closure هنگام ساخته شدن، یک کپی ثابت از مقدار متغیرهای بیرونی برمی‌دارد و تغییرات بعدی آن‌ها را نمی‌بیند.'
    answer: 4
    explain: |
      عبارت ۴ نادرست است: closure از مقدارها کپی ثابت (snapshot) نمی‌گیرد؛ به خودِ متغیرها وصل است و اگر متغیر بعداً تغییر کند، closure مقدار جدید را می‌بیند. بقیه درست‌اند: هر بار صدا زدن تابع بیرونی متغیرهای جدیدی می‌سازد (مثل دو شمارنده‌ی مستقل)، دسترسی بعد از تمام شدن تابع بیرونی باقی می‌ماند (اسلاید ۲۸)، و تابع درونی می‌تواند متغیر بیرونی را تغییر دهد (مثل `count++` در کد اسلاید).

  - level: easy
    stem: |
      طبق اسلاید ۲۸، closureها برای کدام کارها استفاده می‌شوند؟
    options:
      - 'encapsulation (کپسوله‌سازی)، نگه‌داری state (وضعیت) و callbackها'
      - 'تبدیل نوع داده‌ها و مقایسه با `==`'
      - 'hoisting متغیرها و جلوگیری از TDZ'
      - 'اجرای هم‌زمان چند thread و سریع‌تر کردن حلقه‌ها'
    answer: 1
    explain: |
      اسلاید ۲۸: «Used for encapsulation, state, and callbacks»؛ یعنی پنهان کردن داده (متغیر خصوصی)، نگه‌داری وضعیت (مثل شمارنده) و callbackها (مثل تابعی که به `setTimeout` داده می‌شود). تبدیل نوع و `==` (گزینه‌ی ۲) موضوع coercion است، hoisting و TDZ (گزینه‌ی ۳) موضوع درس دیگری است، و JavaScript تک‌نخی (single threaded) است و closure هیچ thread جدیدی نمی‌سازد (گزینه‌ی ۴).

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function createWallet() {
        let balance = 0;
        return {
          deposit: (amount) => {
            balance += amount;
          },
          getBalance: () => balance,
        };
      }
      const w = createWallet();
      w.deposit(50);
      w.deposit(20);
      w.balance = 1000;
      console.log(w.getBalance(), w.balance);
    options:
      - out: "1000 1000"
      - out: "70 undefined"
      - out: "1070 1000"
      - out: "70 1000"
    answer: 4
    explain: |
      `balance` متغیر محلی `createWallet` است و فقط `deposit` و `getBalance` از طریق closure به آن دسترسی دارند: بعد از دو واریز، `70`. خط `w.balance = 1000` یک **ویژگی (property) جدید** به نام `balance` روی شیء `w` می‌سازد که هیچ ارتباطی با متغیر خصوصی ندارد؛ پس `w.balance` برابر `1000` است و `getBalance()` همچنان `70` برمی‌گرداند. گزینه‌ی ۱ فکر کرده این خط متغیر خصوصی را عوض می‌کند (دقیقاً همان چیزی که encapsulation جلویش را می‌گیرد)، گزینه‌ی ۲ خط ساختن ویژگی را نادیده گرفته، و گزینه‌ی ۳ این دو مقدار را با هم جمع کرده است.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function createCounter() {
        let count = 0;
        return {
          inc: () => {
            count++;
            return count;
          },
          reset: () => {
            count = 0;
          },
        };
      }
      const c = createCounter();
      c.inc();
      c.inc();
      c.reset();
      console.log(c.inc());
    options:
      - out: "3"
      - out: "0"
      - out: "1"
      - out: ["!! TypeError"]
    answer: 3
    explain: |
      `inc` و `reset` در **یک** اجرای `createCounter` ساخته شده‌اند، پس هر دو به **یک** `count` مشترک دسترسی دارند. دو بار `inc` آن را `2` می‌کند، `reset` همان متغیر را `0` می‌کند و `inc` بعدی آن را `1` می‌کند و برمی‌گرداند. گزینه‌ی ۱ فکر کرده هر تابع کپی جداگانه‌ای از `count` دارد و `reset` روی شمارنده‌ی `inc` اثری ندارد؛ گزینه‌ی ۲ فکر کرده `inc` مقدار قبل از افزایش را برمی‌گرداند؛ گزینه‌ی ۴ هم غلط است، چون هر دو ویژگی واقعاً تابع‌اند و صدا زدنشان مشکلی ندارد.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function makeMultiplier(factor) {
        return function (n) {
          return n * factor;
        };
      }
      const double = makeMultiplier(2);
      const triple = makeMultiplier(3);
      console.log(double(5), triple(5), double(triple(2)));
    options:
