      هر لایه یک closure است: درونی‌ترین تابع به `x` (از `a`)، `y` (از تابع وسط) و `z` (پارامتر خودش) دسترسی دارد، حتی بعد از اینکه دو تابع بیرونی تمام شده‌اند. `a(1)(2)(3)` یعنی `1 + 2 + 3 = 6`. در `a("1")(2)(3)` جمع از چپ به راست انجام می‌شود: `"1" + 2` رشته‌ی `"12"` و بعد `"12" + 3` رشته‌ی `"123"` می‌شود (type coercion). گزینه‌ی ۲ coercion را نادیده گرفته، گزینه‌ی ۳ فرض کرده `2 + 3` اول حساب می‌شود، و گزینه‌ی ۴ فکر کرده جمع رشته و عدد `NaN` می‌دهد.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function makeCounter() {
        return increment;
        var count = 0;
        function increment() {
          count++;
          return count;
        }
      }
      const inc = makeCounter();
      console.log(inc());
      console.log(inc());
    options:
      - out: ["1", "2"]
      - out: ["NaN", "NaN"]
      - out: ["!! ReferenceError"]
      - out: ["undefined", "undefined"]
    answer: 2
    explain: |
      ترکیب hoisting و closure: داخل `makeCounter`، تابع `increment` (function declaration) کامل hoist می‌شود و `count` (`var`) با مقدار `undefined`. خط `return increment` تابع را برمی‌گرداند و خط `var count = 0` **هرگز** اجرا نمی‌شود. `increment` از طریق closure به همان `count` دسترسی دارد که `undefined` است؛ `count++` آن را به عدد تبدیل می‌کند و حاصل `NaN` است. بار بعد هم `NaN + 1` همان `NaN` است. گزینه‌ی ۱ فرض کرده `count = 0` اجرا شده، گزینه‌ی ۳ فکر کرده `count` یا `increment` به خاطر قرار گرفتن بعد از `return` وجود ندارند، و گزینه‌ی ۴ فراموش کرده که `++` مقدار را به عدد تبدیل می‌کند.
