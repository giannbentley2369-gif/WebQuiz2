id: ch1-arrow-functions
title: "Function declaration در برابر Arrow function"
slides: "Introduction to JS، اسلایدهای ۳۴ تا ۳۶"
lesson: |
  در درس قبل تابع را با کلمه‌ی کلیدی `function` تعریف کردیم. اسلایدهای ۳۴ تا ۳۶ دو روش اصلی تعریف تابع را کنار هم می‌گذارند: **روش اول: function declaration** (اعلان تابع) و **روش دوم: arrow function** (تابع پیکانی، با علامت `=>`). مثل نوشتن یک پیام به دو شکل است: یک نامه‌ی رسمی کامل و یک پیامک کوتاه. هر دو پیام را می‌رسانند، ولی قواعدشان کمی فرق دارد و همین فرق‌ها سؤال‌های امتحانی را می‌سازند.

  ### روش اول: Function declaration (اسلاید ۳۴)

  - روش **کلاسیک** تعریف تابع است.
  - با کلمه‌ی کلیدی **`function`** شروع می‌شود.
  - می‌توان آن را **قبل یا بعد از** خط تعریفش صدا زد، چون **hoisted** است.
  - زیرنویس اسلاید: «Remember, this can be hoisted!» (یادت باشد این یکی hoist می‌شود!)

  ```js title=fn.js
  function add(a, b) {
    return a + b;
  }

  console.log(add(2, 3)); // 5
  ```

  صدا زدن **قبل از** خط تعریف هم بی‌دردسر کار می‌کند:

  ```js
  console.log(add(2, 3)); // 5 (works: function declarations are hoisted)

  function add(a, b) {
    return a + b;
  }
  ```

  **hoisting** (بالا بردن اعلان‌ها به ابتدای محدوده) یعنی موتور JavaScript قبل از اجرای خط‌به‌خط، کل کد را یک دور مرور می‌کند و هر function declaration را **کامل** (نام و بدنه) از همان ابتدای محدوده‌اش آماده می‌کند. نتیجه این است که کد طوری اجرا می‌شود که انگار تابع بالای فایل نوشته شده است. قوانین کامل hoisting برای `var`، `let`، `const` و `class` را در درس «Hoisting و TDZ» می‌بینیم؛ اینجا فقط تفاوت دو روش تعریف تابع مهم است.

  ### روش دوم: Arrow function در ES6 (اسلاید ۳۵)

  - در **ES6** (یعنی JavaScript مدرن؛ نام دیگرش ES2015) معرفی شد.
  - نحو (syntax) **کوتاه‌تری** دارد و اغلب برای **توابع کوچک و سریع** به کار می‌رود.
  - **hoist نمی‌شود**: باید **قبل از استفاده** تعریف شود.
  - زیرنویس اسلاید: «Remember, this **cannot** be hoisted!» (یادت باشد این یکی hoist **نمی‌شود**!)

  ```js title=fn.js
  const multiply = (a, b) => {
    return a * b;
  };

  console.log(multiply(4, 5)); // 20
  ```

  اینجا خبری از کلمه‌ی `function` نیست: اول فهرست پارامترها `(a, b)`، بعد علامت **`=>`** (پیکان، که به آن «fat arrow» هم می‌گویند) و بعد بدنه می‌آید. خودِ تابع اسمی ندارد و در متغیر `multiply` ذخیره شده است؛ یعنی arrow function نوعی function expression است (درس قبل) و با نام متغیرش صدا زده می‌شود.

  حالا اگر arrow function را **قبل از** تعریفش صدا بزنیم چه می‌شود؟

  ```js
  console.log(multiply(4, 5)); // ReferenceError: Cannot access 'multiply' before initialization

  const multiply = (a, b) => {
    return a * b;
  };
  ```

  و اگر همان arrow function را در یک `var` ریخته باشیم:

  ```js
  console.log(multiply(4, 5)); // TypeError: multiply is not a function

  var multiply = (a, b) => a * b;
  ```

  چرا دو خطای متفاوت؟ در هر دو حالت **خودِ تابع** فقط وقتی ساخته می‌شود که اجرا به خط `=>` برسد؛ قبل از آن فقط **نام متغیر** وجود دارد:

  - متغیر `const` (و `let`) تا رسیدن به خط تعریفش «مقداردهی‌نشده» است و هر دسترسی به آن `ReferenceError` (خطای ارجاع) می‌دهد. به این بازه **TDZ** (Temporal Dead Zone، یعنی «منطقه‌ی مرده‌ی زمانی») می‌گویند.
  - متغیر `var` از همان ابتدا با مقدار `undefined` وجود دارد؛ پس `multiply(4, 5)` یعنی صدا زدن `undefined` که `TypeError: multiply is not a function` (خطای نوع) می‌دهد.

  همین قاعده برای function expressionِ معمولی (`const f = function () {};`) هم برقرار است؛ hoisting کامل فقط مال **function declaration** است. جزئیات بیشتر در درس «Hoisting و TDZ».

  ### شکل‌های مختلف نوشتن arrow function

  | حالت | مثال | قاعده |
  |---|---|---|
  | بدنه‌ی بلوکی (block body) | `(a, b) => { return a * b; }` | `return` صریح لازم است. |
  | بدنه‌ی مختصر (concise body) | `(a, b) => a * b` | **return ضمنی** (implicit return): مقدار عبارت خودکار برمی‌گردد. |
  | یک پارامتر | `x => x * 2` | پرانتز اختیاری است. |
  | بدون پارامتر | `() => "Hi!"` | پرانتز خالی اجباری است. |
  | برگرداندن object | `() => ({ a: 1 })` | object باید داخل پرانتز باشد. |

  ```js
  const square = x => x * x;             // one parameter: parentheses are optional
  const sayHi = () => "Hi!";             // no parameters: empty () is required
  const add = (a, b) => a + b;           // concise body: the value is returned automatically
  const addBlock = (a, b) => { a + b; }; // block body without return: returns undefined

  console.log(square(4));      // 16
  console.log(sayHi());        // Hi!
  console.log(add(2, 3));      // 5
  console.log(addBlock(2, 3)); // undefined
  ```

  دو یا چند پارامتر **همیشه** پرانتز می‌خواهند: `const f = a, b => a + b;` خطای `SyntaxError` (خطای نحوی) می‌دهد و شکل درست `const f = (a, b) => a + b;` است.

  #### دام برگرداندن object

  ```js
  const makeUser = () => { name: "Ali" };    // { } is read as a block, not as an object!
  const makeUser2 = () => ({ name: "Ali" }); // ( ) makes it an object literal

  console.log(makeUser());  // undefined
  console.log(makeUser2()); // { name: 'Ali' }
  ```

  در اولی، JavaScript آکولاد `{` بعد از `=>` را شروع **بدنه‌ی بلوکی** می‌داند، نه object. داخل این بلوک، `name:` یک «برچسب» (label، یک ویژگی کم‌کاربرد زبان) حساب می‌شود و `"Ali"` یک عبارت بی‌اثر است. چون `return`ی در کار نیست، نتیجه `undefined` است. پرانتز دور object به JavaScript می‌فهماند که این یک **مقدار** است.

  #### arrow function برای callbackهای کوتاه

  جای درخشش arrow function، callbackهای کوتاه است (callback یعنی تابعی که به تابع دیگر پاس داده می‌شود):

  ```js
  function applyToFive(fn) {
    return fn(5);
  }

  console.log(applyToFive(x => x * 10));                     // 50
  console.log(applyToFive(function (x) { return x * 10; })); // 50 (same thing, longer)
  ```

  ### مقایسه‌ی روش اول و دوم (اسلاید ۳۶)

  - Function: با کلمه‌ی کلیدی `function` تعریف می‌شود.
  - Arrow: نحو **کوتاه‌تر** با `=>`.
  - Functionها **hoist می‌شوند** (قبل از تعریف قابل‌استفاده‌اند).
  - Arrowها **hoist نمی‌شوند**.
  - Functionها **`this` مخصوص خودشان** را دارند؛ arrowها `this` را **به ارث می‌برند** (بعداً بیشتر می‌گوییم!).

  | ویژگی | Function declaration | Arrow function |
  |---|---|---|
  | نحو | `function add(a, b) { ... }` | `const add = (a, b) => ...` |
  | از چه زمانی؟ | از اولین نسخه‌ی زبان | ES6 (ES2015) |
  | صدا زدن قبل از خط تعریف | مجاز (hoisted) | خطا (hoist نمی‌شود) |
  | return ضمنی | ندارد؛ همیشه `return` لازم است | در بدنه‌ی مختصر دارد |
  | `this` | مخصوص خودش؛ به نحوه‌ی صدا زدن بستگی دارد | از کد بیرونی به ارث می‌برد |
  | شیء `arguments` | دارد | ندارد |
  | استفاده با `new` | مجاز | `TypeError` |

  #### `this` در یک نگاه

  `this` (به معنی «این») کلمه‌ی ویژه‌ای است که داخل یک تابع به «objectی که تابع برایش کار می‌کند» اشاره می‌کند. در یک تابع معمولی که به شکل `user.regular()` صدا زده شود، `this` همان objectِ قبل از نقطه یعنی `user` است. arrow function اما `this` مخصوص خودش را ندارد و آن را از کدِ اطرافش (جایی که نوشته شده) قرض می‌گیرد:

  ```js
  const user = {
    username: "Sara",
    regular: function () {
      return this.username;     // own this: the object before the dot (user)
    },
    arrow: () => this.username, // inherited this: from the code around the object
  };

  console.log(user.regular()); // Sara
  console.log(user.arrow());   // undefined
  ```

  arrow در سطح بالای فایل نوشته شده است (آکولادهای object محدوده‌ی جدیدی برای `this` نمی‌سازند)، پس `this` آن همان `this` سطح بالاست، نه `user`: در یک فایل Node.js یک object خالی (`{}`) و در اسکریپت معمولی مرورگر شیء `window`. هیچ‌کدام `username` ندارند و نتیجه `undefined` است. قاعده‌ی عملی: **برای متدی که با `this` کار می‌کند از arrow function استفاده نکن.** همه‌ی قوانین `this` را در درس «کلمه‌ی کلیدی this» می‌خوانیم.

  #### شیء `arguments`

  هر تابع معمولی یک شیء پنهان به نام `arguments` دارد که **همه‌ی** آرگومان‌های فرستاده‌شده (حتی آرگومان‌های اضافه) را مثل یک آرایه نگه می‌دارد. arrow function این شیء را ندارد:

  ```js
  function countArgs() {
    return arguments.length; // how many arguments were passed?
  }
  console.log(countArgs(1, 2, 3)); // 3

  const arrowCount = () => arguments.length;
  // In a browser: arrowCount(1, 2, 3) -> ReferenceError: arguments is not defined
  ```

  arrow function، درست مثل `this`، `arguments` تابع معمولیِ دربرگیرنده‌اش را می‌بیند:

  ```js
  function outer() {
    const inner = () => arguments[0]; // the arguments of outer, not of inner
    return inner("x");
  }
  console.log(outer("a")); // a
  ```

  ::: info
  Node.js هر فایل CommonJS (فایل `.js` معمولی) را پشت پرده داخل یک تابع می‌پیچد. برای همین اگر در سطح بالای یک فایل Node.js داخل arrow function از `arguments` استفاده کنی، خطا نمی‌گیری و به آرگومان‌های همان تابعِ پنهان می‌رسی. در مرورگر همین کد `ReferenceError` می‌دهد.
  :::

  #### arrow function و `new`

  قبل از آمدن `class` در ES6، با یک تابع معمولی و کلمه‌ی `new` object می‌ساختند (به چنین تابعی constructor یا «سازنده» می‌گویند؛ کلاس‌ها را در درس «کلاس‌ها» می‌بینیم). arrow function نمی‌تواند constructor باشد:

  ```js
  function Car(model) {
    this.model = model;
  }
  const Bike = (model) => {
    this.model = model;
  };

  const c = new Car("Pride");
  console.log(c.model);        // Pride
  const b = new Bike("Honda"); // TypeError: Bike is not a constructor
  ```

  ### میم اسلاید ۳۶: سه درجه‌ی «شیک بودن»

  میم پوی کت‌وشلواری این بار سه روش ساختن و صدا زدن یک تابع (خالی) را رتبه‌بندی می‌کند.

  **۱. پوی معمولی با پیراهن قرمز:** function declaration و بعد صدا زدنش.

  ```js
  function foo() {
    //
  }
  foo();
  ```

  **۲. پوی کت‌وشلواری:** arrow function در یک `const` و بعد صدا زدنش.

  ```js
  const foo = () => {
    //
  }
  foo();
  ```

  **۳. شیک‌ترین پو (با کلاه، عینک تک‌چشمی و سبیل):** تابعی که همان لحظه‌ی تعریف صدا زده می‌شود.

  ```js
  (() => {
    //
  })();
  ```

  هر سه کد بدون خطا اجرا می‌شوند و چون بدنه‌ها خالی‌اند، خروجی‌ای ندارند. شوخی میم: هر چه کوتاه‌تر و «مدرن‌تر»، شیک‌تر!

  ### IIFE چیست؟

  **IIFE** (Immediately Invoked Function Expression، یعنی «عبارت تابعی که بلافاصله صدا زده می‌شود») تابعی است که **تعریف می‌شود و همان لحظه اجرا می‌شود**:

  ```js
  (() => {
    console.log("I run immediately!");
  })();

  (function () {
    console.log("Classic IIFE");
  })();
  // I run immediately!
  // Classic IIFE
  ```

  - پرانتز اول `( ... )` تابع را در بر می‌گیرد و آن را به یک **عبارت** (expression، تکه‌کدی که مقدار دارد) تبدیل می‌کند.
  - `()` آخر همان تابع را **فوراً صدا می‌زند**.

  چرا پرانتز دور تابع لازم است؟ اگر خطی با کلمه‌ی `function` شروع شود، JavaScript آن را function declaration می‌داند که **نام** می‌خواهد و نمی‌شود همان‌جا صدایش زد؛ `function () { ... }();` خطای `SyntaxError` می‌دهد. پرانتز این ابهام را برطرف می‌کند. (شکل `(function () { ... }());` که `()` داخل پرانتز بیرونی آمده هم درست است.)

  چرا از IIFE استفاده می‌کنند؟

  1. **ساختن محدوده‌ی (scope) خصوصی**: متغیرهای داخل IIFE بیرون آن وجود ندارند؛ پس محدوده‌ی سراسری (global) را شلوغ نمی‌کنند و با نام‌های کدهای دیگر تداخل پیدا نمی‌کنند. این کاربرد قبل از ES6 که فقط `var` داشتیم حیاتی بود (درس «مشکلات var»).
  2. اجرای یک کد راه‌اندازی (setup) **فقط یک بار**، بدون اینکه نام تازه‌ای به محدوده اضافه شود.
  3. حساب کردن یک مقدار در همان‌جا.

  ```js
  const result = ((a, b) => a * b)(3, 4);
  console.log(result); // 12

  (() => {
    const secret = 42;              // exists only inside the IIFE
    console.log("inside:", secret); // inside: 42
  })();
  console.log(typeof secret);       // undefined (secret does not exist out here)
  ```

  ### کِی کدام را استفاده کنیم؟

  - **function declaration**: برای توابع اصلی و نام‌دار برنامه؛ وقتی می‌خواهی تابع را هر جای فایل (حتی قبل از تعریفش) صدا بزنی؛ وقتی `this` مخصوص تابع، `arguments` یا `new` لازم داری.
  - **arrow function**: برای توابع کوتاه و callbackها (مثل `applyToFive(x => x * 10)`)؛ وقتی می‌خواهی `this` از بیرون به ارث برسد.
  - arrow function **نه**: برای متد objectی که با `this` کار می‌کند، برای constructor (با `new`) و وقتی به `arguments` نیاز داری.

  ::: tip
  - پرانتز دور پارامتر arrow فقط وقتی **دقیقاً یک** پارامتر ساده داری اختیاری است؛ بدون پارامتر `()` و با دو پارامتر یا بیشتر `(a, b)` لازم است.
  - بدنه‌ی مختصر (بدون آکولاد) مقدارش را خودکار برمی‌گرداند؛ بدنه‌ی بلوکی (با آکولاد) `return` صریح می‌خواهد.
  - برای برگرداندن object از بدنه‌ی مختصر، آن را داخل پرانتز بگذار: `() => ({ a: 1 })`.
  - IIFE یعنی `(() => { ... })();` یا `(function () { ... })();`: تعریف و اجرا در یک قدم، همراه با یک محدوده‌ی خصوصی.
  :::

  ::: trap
  - صدا زدن arrow functionی که در `const` (یا `let`) ذخیره شده، قبل از خط تعریفش `ReferenceError: Cannot access ... before initialization` می‌دهد، نه `undefined`. اگر در `var` ذخیره شده باشد، `TypeError: ... is not a function` می‌گیری.
  - `typeof` روی یک function declaration قبل از خط تعریفش `"function"` است، ولی روی arrow functionِ ذخیره‌شده در `var` برابر `"undefined"`.
  - `() => { a: 1 }` مقدار `undefined` برمی‌گرداند، نه object!
  - `(a, b) => { a + b }` هم `undefined` برمی‌گرداند؛ آکولاد یعنی بدنه‌ی بلوکی و `return` لازم است.
  - arrow function به‌عنوان متد object: `this` داخل آن، آن object نیست.
  - `new` روی arrow function خطای `TypeError: ... is not a constructor` می‌دهد و arrow function شیء `arguments` مخصوص خودش را ندارد.
  - `function () { ... }();` بدون پرانتز دور تابع، `SyntaxError` می‌دهد.
  :::

  ::: summary
  - روش اول (function declaration): کلاسیک، با `function`؛ hoist می‌شود و قبل و بعد از تعریف قابل صدا زدن است: «Remember, this can be hoisted!»
  - روش دوم (arrow function): از ES6، کوتاه‌تر با `=>`، برای توابع سریع؛ hoist نمی‌شود و باید قبل از استفاده تعریف شود: «Remember, this cannot be hoisted!»
  - تابع معمولی `this` و `arguments` مخصوص خودش را دارد و با `new` کار می‌کند؛ arrow function `this` (و `arguments`) را از بیرون به ارث می‌برد و constructor نیست.
  - IIFE یعنی `(() => { })();`: تابعی که همان لحظه اجرا می‌شود و محدوده‌ی خصوصی می‌سازد.
  :::
