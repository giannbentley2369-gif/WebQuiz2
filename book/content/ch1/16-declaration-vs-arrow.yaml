    check: error-line
    errorName: TypeError
    code: |
      function Car(model) {
        this.model = model;
      }
      const Bike = (model) => {
        this.model = model;
      };
      const c = new Car("Pride");
      console.log(c.model);
      const b = new Bike("Honda");
      console.log(b.model);
