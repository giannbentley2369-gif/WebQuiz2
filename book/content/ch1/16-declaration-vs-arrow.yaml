      - line: 5
      - line: 7
      - line: 9
      - line: 0
    answer: 3
    explain: |
      تابع معمولی `Car` می‌تواند با `new` به‌عنوان constructor استفاده شود؛ پس خط ۷ درست است و خط ۸ `Pride` را چاپ می‌کند. arrow function نمی‌تواند constructor باشد و خط ۹ خطای `TypeError: Bike is not a constructor` می‌دهد. خط ۵ هیچ‌وقت اجرا نمی‌شود، چون بدنه‌ی `Bike` اصلاً صدا زده نمی‌شود (رد گزینه‌ی ۱).
