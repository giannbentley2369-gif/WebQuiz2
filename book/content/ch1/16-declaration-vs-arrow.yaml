      - out: ["{ name: 'Ali' }", "{ name: 'Ali' }"]
      - out: ["undefined", "{ name: 'Ali' }"]
      - out: ["!! SyntaxError"]
      - out: ["Ali", "{ name: 'Ali' }"]
    answer: 2
    explain: |
      در `makeUser`، آکولاد بعد از `=>` شروع **بدنه‌ی بلوکی** است، نه object؛ `name:` یک label (برچسب) و `"Ali"` یک عبارت بی‌اثر است و بدون `return` نتیجه `undefined` می‌شود. این کد از نظر نحوی مجاز است (رد گزینه‌ی ۳). در `makeUser2` پرانتز دور آکولاد آن را به یک object تبدیل می‌کند که با return ضمنی برمی‌گردد. گزینه‌ی ۱ آکولاد را object فرض کرده و گزینه‌ی ۴ فکر کرده مقدار برچسب برمی‌گردد.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      console.log(typeof greet);
      console.log(typeof welcome);
      function greet() {}
      var welcome = () => {};
    options:
      - out: ["function", "function"]
      - out: ["undefined", "undefined"]
      - out: ["function", "!! ReferenceError"]
      - out: ["function", "undefined"]
    answer: 4
    explain: |
      `greet` یک function declaration است و کامل hoist می‌شود، پس از همان خط ۱ نوعش `"function"` است. `welcome` یک `var` است که hoist می‌شود ولی تا خط ۴ مقدارش `undefined` است؛ تابع arrow هنوز ساخته نشده، پس `typeof` برابر `"undefined"` است (رد گزینه‌ی ۱). گزینه‌ی ۳ فکر کرده `var` هم مثل `let`/`const` در TDZ است و گزینه‌ی ۲ hoisting کامل function declaration را نادیده گرفته است.

  - level: hard
    stem: |
      کدام یک از کدهای زیر خطای نحوی (`SyntaxError`) می‌دهد؟
    check: option-throws
    errorName: SyntaxError
    options:
      - code: '(function () { console.log("hi"); })();'
      - code: 'function () { console.log("hi"); }();'
      - code: '(() => { console.log("hi"); })();'
      - code: '(function () { console.log("hi"); }());'
    answer: 2
    explain: |
      خطی که با کلمه‌ی `function` شروع شود، function declaration حساب می‌شود؛ declaration نام می‌خواهد و نمی‌شود همان‌جا با `()` صدایش زد، پس گزینه‌ی ۲ خطای `SyntaxError: Function statements require a function name` می‌دهد. در گزینه‌های ۱، ۳ و ۴ تابع داخل پرانتز آمده و به یک عبارت تبدیل شده است؛ هر سه IIFEهای درستی هستند و `hi` را چاپ می‌کنند (در گزینه‌ی ۴ فقط جای `()` داخل پرانتز بیرونی است).

  - level: hard
    stem: |
      در جای خالی کدام گزینه قرار بگیرد تا خروجی `Ali` باشد؟
    check: option-output
    expect: "Ali"
    code: |
      const toObj = (name) => ______;
      console.log(toObj("Ali").name);
    options:
      - text: '`{ name: name }`'
        code: 'const toObj = (name) => { name: name }; console.log(toObj("Ali").name);'
      - text: '`return { name: name }`'
        code: 'const toObj = (name) => return { name: name }; console.log(toObj("Ali").name);'
      - text: '`({ name: name })`'
        code: 'const toObj = (name) => ({ name: name }); console.log(toObj("Ali").name);'
      - text: '`{ return name; }`'
        code: 'const toObj = (name) => { return name; }; console.log(toObj("Ali").name);'
    answer: 3
    explain: |
      برای برگرداندن object از بدنه‌ی مختصر باید آن را داخل پرانتز گذاشت (گزینه‌ی ۳). در گزینه‌ی ۱ آکولاد بدنه‌ی بلوکی است و تابع `undefined` برمی‌گرداند؛ خواندن `.name` از `undefined` خطای `TypeError` می‌دهد. در گزینه‌ی ۲، `return` بدون آکولاد بعد از `=>` مجاز نیست و `SyntaxError` می‌گیریم. گزینه‌ی ۴ رشته‌ی `"Ali"` را برمی‌گرداند و رشته ویژگی `name` ندارد، پس `undefined` چاپ می‌شود.

  - level: hard
    stem: |
      خروجی کد زیر **در مرورگر** (یک اسکریپت معمولی `<script>`) چیست؟
    check: dom-output
    code: |
      function regular() {
        return arguments.length;
      }
      const arrow = () => arguments.length;
      console.log(regular(1, 2, 3));
      console.log(arrow(1, 2, 3));
    options:
      - out: ["3", "!! ReferenceError"]
      - out: ["3", "3"]
      - out: ["3", "0"]
      - out: ["!! ReferenceError"]
    answer: 1
    explain: |
      تابع معمولی شیء `arguments` مخصوص خودش را دارد و `3` را برمی‌گرداند. arrow function چنین شیئی ندارد و در سطح بالای اسکریپت مرورگر هم تابع معمولیِ دربرگیرنده‌ای نیست که `arguments` را از آن به ارث ببرد؛ پس `ReferenceError: arguments is not defined` می‌گیریم. گزینه‌های ۲ و ۳ فکر کرده‌اند arrow هم `arguments` دارد و گزینه‌ی ۴ مشکل را به تابع معمولی هم نسبت داده است. (در سطح بالای یک فایل Node.js نتیجه فرق می‌کند، چون Node.js فایل را داخل یک تابع پنهان می‌پیچد.)

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      function outer() {
        const inner = () => arguments[0];
        return inner("x", "y");
      }
      console.log(outer("a", "b"));
    options:
      - out: "x"
      - out: "a"
      - out: "undefined"
      - out: "!! ReferenceError"
    answer: 2
    explain: |
      arrow function شیء `arguments` مخصوص خودش را ندارد و، مثل `this`، آن را از تابع معمولیِ دربرگیرنده یعنی `outer` به ارث می‌برد. پس `arguments[0]` اولین آرگومان `outer` یعنی `"a"` است، نه `"x"` (رد گزینه‌ی ۱). چون `outer` یک تابع معمولی است، `arguments` وجود دارد و خطایی رخ نمی‌دهد (رد گزینه‌های ۳ و ۴).

  - level: hard
    stem: |
