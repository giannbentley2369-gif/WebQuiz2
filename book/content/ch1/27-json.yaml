  - level: easy
    stem: |
      کدام متن یک JSON **معتبر** است؛ یعنی `JSON.parse` روی آن خطا نمی‌دهد؟
    check: option-throws
    want: ok
    options:
      - text: '`{name: "Ali"}`'
        code: |
          JSON.parse('{name: "Ali"}');
      - text: '`{''name'': ''Ali''}`'
        code: |
          JSON.parse("{'name': 'Ali'}");
      - text: '`{"name": "Ali",}`'
        code: |
          JSON.parse('{"name": "Ali",}');
      - text: '`{"name": "Ali"}`'
        code: |
          JSON.parse('{"name": "Ali"}');
    answer: 4
    explain: |
      فقط گزینه‌ی ۴ همه‌ی قواعد را رعایت کرده است: کلید و رشته داخل دابل‌کوتیشن و بدون ویرگول اضافه. گزینه‌ی ۱ کلید بدون کوتیشن دارد، گزینه‌ی ۲ از single quote استفاده کرده و گزینه‌ی ۳ ویرگول اضافه‌ی آخر (trailing comma) دارد؛ هر سه در شیء JavaScript مجازند، اما در JSON نه، و `JSON.parse` برایشان `SyntaxError` می‌دهد.

