    explain: |
      JSON یک رشته را همراه دابل‌کوتیشن‌هایش می‌نویسد؛ پس `JSON.stringify("hi")` رشته‌ی چهارحرفی `"hi"` است و کوتیشن‌ها هم چاپ می‌شوند (رد گزینه‌های ۲ و ۴). داخل آرایه، `null` یک مقدار مجاز JSON است و حذف نمی‌شود و رشته‌ها با دابل‌کوتیشن نوشته می‌شوند (رد گزینه‌های ۳ و ۴). شیء `Date` هم به رشته‌ی استاندارد تاریخ (ISO) تبدیل می‌شود؛ `new Date(0)` یعنی لحظه‌ی صفر: `1970-01-01T00:00:00.000Z`.
