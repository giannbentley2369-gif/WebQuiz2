      - out: ["true", "!! SyntaxError"]
      - out: ["true", "SyntaxError", "null", "SyntaxError", "null"]
    answer: 4
    explain: |
      متن اول JSON معتبر است و `.ok` مقدار `true` را می‌دهد. `{ok: true}` کلید بدون کوتیشن دارد، پس `JSON.parse` خطا می‌دهد؛ `catch` نام خطا (`SyntaxError`) را چاپ می‌کند و `null` برمی‌گرداند که چاپ می‌شود. رشته‌ی خالی هم JSON معتبر نیست (`Unexpected end of JSON input`)، پس دوباره `SyntaxError` و `null`. گزینه‌ی ۱ کلید بدون کوتیشن را مجاز دانسته، گزینه‌ی ۲ فکر کرده `JSON.parse("")` بدون خطا `undefined` می‌دهد و گزینه‌ی ۳ فراموش کرده خطا داخل `try` رخ داده و گرفته می‌شود.

