    answer: 2
    explain: |
      متن `5` در JSON یعنی **عدد** ۵؛ پس `JSON.parse("5") + 1` جمع عددی و برابر `6` است. اما متن `"5"` (با دابل‌کوتیشن) در JSON یعنی **رشته‌ی** `"5"` و رشته به‌علاوه‌ی عدد یعنی چسباندن: `"51"` (رد گزینه‌ی ۱). `JSON.parse("true")` مقدار boolean یعنی `true` را می‌دهد، نه رشته (رد گزینه‌ی ۳)، و آرایه در JavaScript از نوع `"object"` است؛ `typeof` هیچ‌وقت `"array"` نمی‌دهد (رد گزینه‌ی ۴).

