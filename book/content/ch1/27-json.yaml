  - level: medium
    stem: |
      در کد اسلاید ۵۲ نوشته شده `JSON.stringify(order, null, 2)`. نقش آرگومان‌های `null` و `2` چیست؟
    options:
      - '`null` یعنی فیلتری (replacer) برای انتخاب ویژگی‌ها نداریم و `2` یعنی خروجی با تورفتگی ۲ فاصله‌ای و خوانا (pretty-print) ساخته شود.'
      - '`null` یعنی ویژگی‌هایی که مقدارشان `null` است حذف شوند و `2` یعنی فقط ۲ سطح اول شیء تبدیل شود.'
      - '`null` یعنی خروجی هیچ کوتیشنی نداشته باشد و `2` یعنی عددها با ۲ رقم اعشار نوشته شوند.'
      - '`null` یعنی شیء اصلی بعد از تبدیل پاک شود و `2` یعنی دو نسخه از رشته ساخته شود.'
    answer: 1
    explain: |
      آرگومان دوم `JSON.stringify` همان replacer است (تابع یا فهرستی که تعیین می‌کند کدام ویژگی‌ها وارد خروجی شوند)؛ `null` یعنی همه‌ی ویژگی‌ها، بدون فیلتر. آرگومان سوم مقدار تورفتگی است؛ `2` یعنی هر سطح با ۲ فاصله جلو برود و خروجی چندخطی و خوانا شود، همان‌طور که در خروجی اسلاید می‌بینیم. معناهای گزینه‌های ۲ تا ۴ وجود ندارند: در خروجی اسلاید همه‌ی سطح‌ها (حتی شیءهای داخل آرایه‌ی `items`) کامل آمده‌اند، کلیدها کوتیشن دارند، عددی مثل `1200` بدون اعشار نوشته شده و `order` هم دست نخورده باقی می‌ماند.

