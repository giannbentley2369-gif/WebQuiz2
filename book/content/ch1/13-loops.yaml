    # The setup runs the same loop with a step limit, so "never ends" becomes the result "STUCK".
    setup: |
      function run() {
        const out = [];
        let steps = 0;
        let k = 0;
        while (k < 5) {
          if (++steps > 1000) { out.push("STUCK"); return out.join(" "); }
          if (k === 2) continue;
          out.push(k);
          k++;
        }
        out.push("end");
        return out.join(" ");
      }
      function parses(src) { try { new Function(src); return "ok"; } catch (e) { return e.name; } }
    options:
      - text: 'عددهای `0`، `1`، `3` و `4` و سپس `end` را چاپ می‌کند.'
        expr: 'run()'
        equals: '"0 1 3 4 end"'
      - text: 'عددهای `0` و `1` را چاپ می‌کند و بعد برای همیشه در حلقه می‌ماند (حلقه‌ی بی‌نهایت)؛ `end` هرگز چاپ نمی‌شود.'
        expr: 'run()'
        equals: '"0 1 STUCK"'
      - text: 'عددهای `0` تا `4` و سپس `end` را چاپ می‌کند.'
        expr: 'run()'
        equals: '"0 1 2 3 4 end"'
      - text: 'خطای `SyntaxError` می‌دهد، چون `continue` فقط داخل حلقه‌ی `for` مجاز است.'
        expr: 'parses("let k = 0; while (k < 5) { if (k === 2) continue; k++; }")'
        equals: '"SyntaxError"'
    answer: 2
    explain: |
      `0` و `1` چاپ می‌شوند. وقتی `k` برابر ۲ می‌شود، `continue` اجرا را مستقیم به بررسی شرط برمی‌گرداند و `k++` **هیچ‌وقت** اجرا نمی‌شود؛ پس `k` برای همیشه ۲ می‌ماند و شرط `k < 5` همیشه درست است. گزینه‌ی ۱ رفتار `continue` در حلقه‌ی `for` را فرض کرده که در آن بخش update (مثل `k++`) حتی بعد از `continue` هم اجرا می‌شود. گزینه‌ی ۳ اثر `continue` را ندیده و گزینه‌ی ۴ غلط است، چون `continue` در هر حلقه‌ای (از جمله `while`) مجاز است.

