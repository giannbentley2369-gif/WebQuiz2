id: ch1-loops
title: "حلقه‌ها (Loops)"
slides: "Introduction to JS، اسلاید ۳۲"
lesson: |
  فرض کن معلم گفته صد بار بنویسی «سر کلاس حرف نمی‌زنم». با دست باید صد خط بنویسی؛ اما یک برنامه‌نویس می‌گوید: «این جمله را بنویس و صد بار تکرارش کن». این همان **حلقه (loop)** است: ساختاری که یک تکه کد را **تکرار** می‌کند، بدون این‌که مجبور باشیم آن را چند بار بنویسیم.

  ### اسلاید ۳۲ در یک نگاه

  - حلقه‌ها به ما اجازه می‌دهند کد را **بدون نوشتنِ چندباره‌اش** تکرار کنیم.
  - یک بلوک را **تا وقتی یک شرط درست است** اجرا می‌کنند.
  - انواع اصلی حلقه:

  | حلقه | کاربرد (طبق اسلاید ۳۲) |
  |---|---|
  | `for` | تکرار به **تعداد مشخص** |
  | `while` | تکرار **تا وقتی شرط درست است** |
  | `do...while` | **حداقل یک بار** اجرا، بعد بررسی شرط |
  | `for...of` | پیمایش **مقدارها (items)**ی یک آرایه |
  | `for...in` | پیمایش **کلیدها (keys)**ی یک شیء |

  به هر بار اجرای بدنه‌ی حلقه یک **iteration** (دور یا تکرار) می‌گوییم.

  ### حلقه‌ی `for`: تکرار به تعداد مشخص

  ```js
  for (let i = 1; i <= 3; i++) {
    console.log("Count:", i);
  }
  // Count: 1
  // Count: 2
  // Count: 3
  ```

  (این همان حلقه‌ی اسلاید ۲۹ است.) سرِ حلقه‌ی `for` سه بخش دارد که با `;` از هم جدا می‌شوند:

  | بخش | در مثال | کِی اجرا می‌شود؟ |
  |---|---|---|
  | **مقداردهی اولیه (initialization)** | `let i = 1` | **فقط یک بار**، قبل از شروع حلقه |
  | **شرط (condition)** | `i <= 3` | **قبل از هر دور**؛ اگر نادرست (falsy) باشد، حلقه تمام می‌شود |
  | **به‌روزرسانی (update)** | `i++` | **بعد از هر دور** (بعد از اجرای بدنه) |

  ترتیب دقیق اجرا: init، شرط، بدنه، update، شرط، بدنه، update، ... و در آخر شرطی که نادرست است و حلقه را تمام می‌کند.

  ردیابی (trace) مثال بالا:

  | مقدار `i` | `i <= 3`؟ | چه می‌شود؟ |
  |---|---|---|
  | ۱ | true | چاپ `Count: 1` و بعد `i++` |
  | ۲ | true | چاپ `Count: 2` و بعد `i++` |
  | ۳ | true | چاپ `Count: 3` و بعد `i++` |
  | ۴ | false | پایان حلقه |

  دقت کن: بدنه ۳ بار اجرا شد ولی شرط **۴ بار** بررسی شد و `i` در پایان به ۴ رسید.

  #### چند بار تکرار می‌شود؟ (دام off-by-one)

  اشتباهِ «یکی کم یا یکی زیاد» (**off-by-one**) رایج‌ترین خطای حلقه‌هاست. این جدول را خوب ببین:

  | سرِ حلقه | مقدارهای `i` در بدنه | تعداد دور |
  |---|---|---|
  | `for (let i = 0; i < 5; i++)` | ۰ تا ۴ | ۵ |
  | `for (let i = 0; i <= 5; i++)` | ۰ تا ۵ | ۶ |
  | `for (let i = 1; i <= 5; i++)` | ۱ تا ۵ | ۵ |
  | `for (let i = 1; i < 5; i++)` | ۱ تا ۴ | ۴ |

  قاعده‌ی کلی: «از `a` شروع کن و تا وقتی `i < b` است یکی‌یکی جلو برو» یعنی `b - a` دور؛ با `<=` یک دور بیشتر.

  گام حلقه لازم نیست ۱ باشد و حلقه می‌تواند رو به پایین هم بشمارد:

  ```js
  for (let i = 10; i > 0; i -= 3) {
    console.log(i);
  }
  // 10
  // 7
  // 4
  // 1
  ```

  مقدار بعدی `-2` است که شرط `i > 0` را نادرست می‌کند، پس چاپ نمی‌شود.

  #### متغیر حلقه بعد از حلقه کجاست؟

  متغیری که با `let` در سرِ حلقه تعریف می‌شود فقط **داخل حلقه** وجود دارد (دلیلش را در درس بعد، «Block، Scope و Global scope»، می‌بینیم). اما `var` به بلوک‌ها اهمیت نمی‌دهد و بعد از حلقه هم باقی می‌ماند، با همان مقداری که شرط را نادرست کرد (پیش‌نمایش درس «مشکلات var»):

  ```js
  for (var a = 0; a < 3; a++) {}
  console.log(a); // 3 (var leaks out of the loop)

  for (let b = 0; b < 3; b++) {}
  console.log(b); // ReferenceError: b is not defined
  ```

  ### حلقه‌ی `while`: تا وقتی شرط درست است

  ```js
  let countdown = 3;
  while (countdown > 0) {
    console.log(countdown);
    countdown--;
  }
  console.log("Go!");
  // 3
  // 2
  // 1
  // Go!
  ```

  `while` فقط یک شرط دارد. **قبل از هر دور** شرط بررسی می‌شود؛ اگر درست بود بدنه اجرا می‌شود و دوباره سراغ شرط می‌رود. پس:

  - اگر شرط **از همان اول** نادرست باشد، بدنه **حتی یک بار** هم اجرا نمی‌شود.
  - مقداردهی اولیه را باید **قبل از** حلقه و به‌روزرسانی را **داخل** بدنه بنویسی. اگر به‌روزرسانی را فراموش کنی، شرط هیچ‌وقت نادرست نمی‌شود (حلقه‌ی بی‌نهایت؛ پایین‌تر می‌بینیم).

  `while` وقتی مناسب است که **تعداد دورها را از قبل نمی‌دانی**؛ مثلاً «تا وقتی عدد از ۱۰۰ کمتر است، دو برابرش کن»:

  ```js
  let n = 1;
  while (n < 100) {
    n = n * 2;
  }
  console.log(n); // 128
  ```

  ### حلقه‌ی `do...while`: اول اجرا، بعد بررسی

  ```js
  let tries = 10;
  do {
    console.log("Attempt", tries);
    tries++;
  } while (tries < 5);
  // Attempt 10
  ```

  در `do...while` بدنه **اول** اجرا می‌شود و شرط **بعد از** هر دور بررسی می‌شود. پس بدنه **حداقل یک بار** اجرا می‌شود؛ حتی اگر شرط از اول نادرست باشد (مثل همین‌جا: `10 < 5` نادرست است، ولی یک بار چاپ شد). کاربرد معمولش: «یک بار بپرس؛ اگر جواب نامعتبر بود، دوباره بپرس». به `;` در انتهای `while (...)` دقت کن.

  مقایسه‌ی `while` و `do...while` با یک شرطِ نادرست:

  ```js
  let a = 5;
  while (a < 5) {
    console.log("while body");   // never runs
  }

  let b = 5;
  do {
    console.log("do body");      // runs once
  } while (b < 5);
  // do body
  ```

  ### حلقه‌ی `for...of`: مقدارهای یک آرایه

  آرایه (array) فهرستی مرتب از مقدارهاست (درس «آرایه‌ها» آن را کامل می‌گوید). `colors.length` تعداد عضوهای آرایه است و `colors[i]` عضوِ شماره‌ی `i` را می‌دهد (شماره‌گذاری یا **index** از صفر شروع می‌شود). با `for` معمولی می‌شود آرایه را این‌طور پیمود:

  ```js
  const colors = ["red", "green", "blue"];

  for (let i = 0; i < colors.length; i++) {
    console.log(i, colors[i]);
  }
  // 0 red
  // 1 green
  // 2 blue
  ```

  اما `for...of` خیلی ساده‌تر است: خانه‌به‌خانه **مقدارها** را به ترتیب می‌دهد و دیگر لازم نیست با شمارنده و index کار کنی:

  ```js
  for (const color of colors) {
    console.log(color);
  }
  // red
  // green
  // blue
  ```

  (متغیر حلقه در هر دور از نو ساخته می‌شود؛ برای همین `const` هم مجاز است.)

  `for...of` روی هر چیز **iterable** (پیمایش‌پذیر؛ یعنی چیزی که بشود عضوهایش را یکی‌یکی گرفت) کار می‌کند؛ مثلاً **رشته‌ها** که حرف‌به‌حرف پیمایش می‌شوند:

  ```js
  for (const ch of "Hi!") {
    console.log(ch);
  }
  // H
  // i
  // !
  ```

  اما یک **شیء معمولی (plain object)** iterable نیست و `for...of` روی آن خطا می‌دهد:

  ```js
  const user = { name: "Ali", age: 20 };
  for (const v of user) {}   // TypeError: user is not iterable
  ```

  ### حلقه‌ی `for...in`: کلیدهای یک شیء

  شیء (object) مجموعه‌ای از جفت‌های «کلید: مقدار» است (درس «اشیاء» آن را کامل می‌گوید). `for...in` **نام کلیدها** را به‌صورت **رشته** می‌دهد و با `obj[key]` می‌توان به مقدار هر کلید رسید:

  ```js
  const user = { name: "Ali", age: 20 };

  for (const key in user) {
    console.log(key, user[key]);
  }
  // name Ali
  // age 20
  ```

  اگر `for...in` را روی یک **آرایه** بزنی، کلیدهای آرایه یعنی **indexها** را می‌دهد، آن هم به‌صورت **رشته** (`"0"`، `"1"`، ...)، نه مقدارها را:

  ```js
  const nums = [10, 20, 30];

  for (const i in nums) {
    console.log(i, typeof i);
  }
  // 0 string
  // 1 string
  // 2 string

  for (const i in nums) {
    console.log(i + 1);   // string concatenation, not addition!
  }
  // 01
  // 11
  // 21

  for (const n of nums) {
    console.log(n);
  }
  // 10
  // 20
  // 30
  ```

  به همین دلیل برای آرایه‌ها **`for...of`** (یا `for` معمولی) را ترجیح می‌دهیم: معمولاً مقدارها را لازم داریم، indexهای رشته‌ای در محاسبه دردسر می‌سازند (`"0" + 1` می‌شود `"01"`) و `for...in` هر property (ویژگی) دیگری را هم که به آرایه اضافه شده باشد پیمایش می‌کند:

  ```js
  const list = [10, 20];
  list.note = "extra";
  for (const k in list) {
    console.log(k);
  }
  // 0
  // 1
  // note
  ```

  ::: analogy
  برای به خاطر سپردن: **in** را با **in**dex (کلید) جفت کن و **of** را با «مقدارهایِ» (values **of**) عضوها. `for...in` می‌پرسد «چه کلیدهایی **در** این شیء هست؟» و `for...of` می‌گوید «مقدارهای این مجموعه را یکی‌یکی بده».
  :::

  ### `break` و `continue`

  - **`break`**: حلقه را **همین الان کامل تمام می‌کند** و اجرا از خطِ بعد از حلقه ادامه پیدا می‌کند.
  - **`continue`**: **فقط بقیه‌ی همین دور** را رد می‌کند و سراغ دور بعد می‌رود (در `for`، بخش update اجرا می‌شود و بعد شرط بررسی می‌شود).

  ```js
  for (let i = 1; i <= 10; i++) {
    if (i === 4) break;        // stop the whole loop at 4
    console.log(i);
  }
  // 1
  // 2
  // 3

  for (let i = 1; i <= 5; i++) {
    if (i % 2 === 0) continue; // skip even numbers
    console.log(i);
  }
  // 1
  // 3
  // 5
  ```

  ### حلقه‌ی بی‌نهایت (Infinite loop)

  اگر شرط حلقه **هیچ‌وقت** نادرست نشود، حلقه تا ابد ادامه پیدا می‌کند. چون JavaScript **تک‌نخی (single-threaded)** است (یعنی در هر لحظه فقط یک کار انجام می‌دهد)، یک حلقه‌ی بی‌نهایت در مرورگر کل صفحه را **قفل** می‌کند: دکمه‌ها کار نمی‌کنند و مرورگر بعد از مدتی پیغام «صفحه پاسخ نمی‌دهد» نشان می‌دهد. سه علت رایج (این کدها را اجرا نکن!):

  ```js
  // 1) forgetting the update
  let i = 0;
  while (i < 3) {
    console.log(i);   // i never changes, so this prints 0 forever
  }

  // 2) updating in the wrong direction
  for (let j = 0; j < 3; j--) {}   // j: 0, -1, -2, ... is always < 3

  // 3) continue before the update in a while loop
  let k = 0;
  while (k < 5) {
    if (k === 2) continue;   // k stays 2 forever: k++ below is never reached
    k++;
  }
  ```

  `while (true)` عمداً بی‌نهایت است و فقط وقتی امن است که داخلش با `break` از حلقه خارج شوی:

  ```js
  let total = 0;
  while (true) {
    total += 5;
    if (total >= 20) break;
  }
  console.log(total); // 20
  ```

  ### حلقه‌های تودرتو (Nested loops)

  حلقه داخل حلقه: به ازای **هر** دورِ حلقه‌ی بیرونی، حلقه‌ی درونی **از اول تا آخر** اجرا می‌شود. پس تعداد کل اجراهای بدنه‌ی درونی برابر است با (تعداد دورهای بیرونی) × (تعداد دورهای درونی):

  ```js
  for (let row = 1; row <= 2; row++) {
    for (let col = 1; col <= 3; col++) {
      console.log(row, col);
    }
  }
  // 1 1
  // 1 2
  // 1 3
  // 2 1
  // 2 2
  // 2 3   (2 x 3 = 6 lines)
  ```

  `break` و `continue` فقط روی **نزدیک‌ترین** حلقه‌ای که داخلش هستند اثر دارند: `break` در حلقه‌ی درونی فقط حلقه‌ی درونی را تمام می‌کند و حلقه‌ی بیرونی دور بعدی‌اش را شروع می‌کند.

  ### کدام حلقه برای کدام کار؟

  | موقعیت | حلقه‌ی مناسب |
  |---|---|
  | تعداد دورها مشخص است (مثلاً ۱۰ بار) | `for` |
  | تعداد دورها از قبل معلوم نیست؛ «تا وقتی ...» | `while` |
  | بدنه باید حداقل یک بار اجرا شود | `do...while` |
  | مقدارهای یک آرایه یا حرف‌های یک رشته | `for...of` |
  | کلیدهای یک شیء | `for...in` |

  ::: tip
  - `for (init; condition; update)`: init یک بار، شرط قبل از هر دور و update بعد از هر دور اجرا می‌شود.
  - شروع از ۰ با `i < n` یعنی **n** دور؛ با `i <= n` یعنی **n + ۱** دور.
  - `while` ممکن است **صفر** بار اجرا شود؛ `do...while` **حداقل یک** بار.
  - `for...of`: مقدارها (آرایه، رشته). `for...in`: کلیدها به‌صورت رشته (شیء؛ روی آرایه، indexهای رشته‌ای).
  - `break` کل حلقه (فقط نزدیک‌ترین حلقه) را تمام می‌کند؛ `continue` فقط دور فعلی را رد می‌کند.
  :::

  ::: trap
  - `for...in` روی آرایه **indexها را به‌صورت رشته** می‌دهد، نه مقدارها را: `i + 1` می‌شود `"01"`، نه `1`.
  - `for...of` روی یک شیء معمولی خطای `TypeError: ... is not iterable` می‌دهد.
  - `do...while` با شرط نادرست هم **یک بار** اجرا می‌شود.
  - متغیر حلقه‌ای که با `let` تعریف شده بعد از حلقه وجود ندارد (`ReferenceError`)؛ اما `var` بیرون می‌ماند و مقدار پایانی‌اش (اولین مقداری که شرط را نادرست کرد) را دارد.
  - در `while`، اگر `continue` قبل از به‌روزرسانی شمارنده بیاید، حلقه بی‌نهایت می‌شود.
  - اگر داخل بدنه‌ی `for` هم شمارنده را تغییر دهی (مثلاً `i++` اضافه)، هر دور دو بار جلو می‌روی.
  :::

  ::: summary
  - حلقه یعنی تکرار یک بلوک تا وقتی شرط درست است؛ بدون نوشتنِ چندباره‌ی کد.
  - `for` (تعداد مشخص)، `while` (تا وقتی شرط درست است؛ شاید صفر بار)، `do...while` (حداقل یک بار)، `for...of` (مقدارها)، `for...in` (کلیدها).
  - مراقب off-by-one (`<` در برابر `<=`)، حلقه‌ی بی‌نهایت و تفاوت `for...in` و `for...of` باش.
  - `break` خروج از حلقه، `continue` رفتن به دور بعد؛ هر دو فقط روی نزدیک‌ترین حلقه.
  :::
questions:
  - level: easy
    stem: |
      کدام حلقه بدنه‌اش را **حداقل یک بار** اجرا می‌کند، حتی اگر شرطش از همان اول نادرست باشد؟
    options:
      - '`for`'
      - '`while`'
      - '`do...while`'
      - '`for...in`'
    answer: 3
    explain: |
      طبق اسلاید ۳۲، `do...while` «اول یک بار اجرا می‌کند و بعد شرط را بررسی می‌کند» (run at least once, then check condition). در `for` و `while` شرط **قبل از** هر دور بررسی می‌شود، پس با شرطِ نادرست بدنه هیچ‌وقت اجرا نمی‌شود. `for...in` هم برای پیمایش کلیدهای یک شیء است و اگر شیء کلیدی نداشته باشد، بدنه‌اش اصلاً اجرا نمی‌شود.

  - level: easy
    stem: |
      طبق اسلاید ۳۲، برای پیمایش **کلیدهای** (keys) یک شیء از کدام حلقه استفاده می‌شود؟
    options:
      - '`for...of`'
      - '`for...in`'
      - '`do...while`'
      - '`while`'
    answer: 2
    explain: |
      اسلاید ۳۲: `for...in` حلقه روی **کلیدهای** یک شیء است و `for...of` حلقه روی **مقدارهای** (items) یک آرایه. `for...of` روی یک شیء معمولی حتی خطای `TypeError` می‌دهد، چون شیء معمولی iterable نیست. `while` و `do...while` حلقه‌های شرطی عمومی‌اند و به‌تنهایی کلیدها را به ما نمی‌دهند.

  - level: easy
    stem: |
      کدام جمله درباره‌ی حلقه‌ی `while` درست است؟
    options:
      - 'شرط بعد از هر دور بررسی می‌شود، پس بدنه حداقل یک بار اجرا می‌شود.'
      - 'همیشه دقیقاً ۱۰ بار تکرار می‌شود، مگر این‌که از `break` استفاده کنیم.'
      - 'فقط برای پیمایش آرایه‌ها کاربرد دارد.'
      - 'شرط قبل از هر دور بررسی می‌شود؛ اگر از همان اول نادرست باشد، بدنه حتی یک بار هم اجرا نمی‌شود.'
