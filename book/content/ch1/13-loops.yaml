  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      for (let i = 1; i <= 3; i++) {
        for (let j = 1; j <= 3; j++) {
          if (j === 2) break;
          console.log(i, j);
        }
      }
    options:
      - out: ["1 1", "2 1", "3 1"]
      - out: "1 1"
      - out: ["1 1", "1 3", "2 1", "2 3", "3 1", "3 3"]
      - out: ["1 1", "1 2", "2 1", "2 2", "3 1", "3 2"]
    answer: 1
    explain: |
      `break` فقط **نزدیک‌ترین** حلقه، یعنی حلقه‌ی درونی، را تمام می‌کند. در هر دورِ بیرونی، حلقه‌ی درونی `j = 1` را چاپ می‌کند و با رسیدن به `j = 2` تمام می‌شود؛ بعد حلقه‌ی بیرونی دور بعدی‌اش را شروع می‌کند. گزینه‌ی ۲ فکر کرده `break` هر دو حلقه را تمام می‌کند، گزینه‌ی ۳ رفتار `continue` را فرض کرده و گزینه‌ی ۴ فکر کرده `j = 2` قبل از `break` چاپ می‌شود.

  - level: hard
    stem: |
      کدام گزینه **نادرست** است؟
    options:
      - '`for...of` روی یک رشته، حرف‌های آن را یکی‌یکی می‌دهد.'
      - '`for...in` روی یک آرایه، indexها را به‌صورت رشته (`"0"`، `"1"`، ...) می‌دهد.'
      - 'در `do...while` شرط قبل از اولین اجرای بدنه بررسی می‌شود.'
      - '`break` داخل یک حلقه، اجرای همان حلقه را کامل متوقف می‌کند.'
    answer: 3
    explain: |
      در `do...while` بدنه **اول** اجرا می‌شود و شرط **بعد از** هر دور بررسی می‌شود؛ برای همین حداقل یک بار اجرا تضمین شده است. پس گزینه‌ی ۳ نادرست است. سه جمله‌ی دیگر درست‌اند: رشته iterable است و `for...of` حرف‌به‌حرف آن را می‌دهد، `for...in` روی آرایه indexهای رشته‌ای می‌دهد و `break` حلقه‌ای را که داخلش هست کامل تمام می‌کند.
