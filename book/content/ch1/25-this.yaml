id: ch1-this
title: "کلمه‌ی کلیدی this"
slides: "Introduction to JS، اسلایدهای ۳۶، ۴۳ و ۴۴"
lesson: |
  به جمله‌ی «**من** گرسنه‌ام» فکر کن. اگر علی این را بگوید، یعنی علی گرسنه است؛ اگر سارا بگوید، یعنی سارا. خودِ جمله عوض نشده، ولی معنی «من» به **گوینده** بستگی دارد. کلمه‌ی کلیدی **`this`** (به معنای «این»؛ ارجاعی به شیئی که تابع را صدا زده) در JavaScript همین «من» است: داخل کدِ تابع نوشته می‌شود، ولی این‌که به چه شیئی اشاره کند به این بستگی دارد که **چه کسی و چطور** آن تابع را صدا زده است.

  ### اسلایدها چه می‌گویند؟

  اسلاید ۴۳:

  - `this` به شیئی اشاره می‌کند که تابع را **صدا می‌زند** (Refers to the object that is calling the function).
  - در اشیاء، `this` به **خود شیء** اشاره می‌کند.
  - در کلاس‌ها، `this` به **نمونه‌ی (instance) ساخته‌شده** اشاره می‌کند.
  - در arrow functionها، `this` از **محدوده‌ی بیرونی** (outer scope) به ارث می‌رسد.
  - مقدار `this` به **نحوه‌ی صدا زدن** تابع بستگی دارد، **نه محل تعریف** آن.

  اسلاید ۴۴ (ادامه):

  - به شیئی اشاره می‌کند که تابع را صدا می‌زند؛ مقدارش به **بافتِ فراخوانی** (call context) بستگی دارد، نه به محل اعلان.
  - در **محدوده‌ی سراسری** (global scope): `window` (در مرورگر) یا `undefined` (در strict mode).
  - در **متدها** (method؛ تابعی که خاصیتِ یک شیء است): شیئی که **قبل از نقطه** آمده است.
  - در **arrow functionها**: `this` را از محدوده‌ی بیرونی به ارث می‌برد (**lexical this**؛ یعنی `this`ی که از محل نوشته شدن کد تعیین می‌شود، نه از محل صدا زدن).
  - می‌توان آن را به‌صورت دستی با **`call`**، **`apply`** یا **`bind`** تعیین کرد.

  اسلاید ۳۶ هم در مقایسه‌ی دو روش تعریف تابع گفته بود: «Functions have their own `this`; arrows inherit `this`»؛ یعنی تابع‌های معمولی `this` مخصوص خودشان را دارند ولی arrow functionها آن را از بیرون به ارث می‌برند. در این درس همه‌ی این جمله‌ها را باز می‌کنیم.

  ### کد اسلاید ۴۴

  ```js title=sample.js
  const obj = {
    name: "Robert",
    say() {
      console.log(this.name);
    }
  };
  obj.say(); // "Robert"
  const f = obj.say;
  f(); // undefined (or global)
  ```

  - `obj.say()`: قبل از نقطه `obj` آمده، پس `this` برابر `obj` است و `Robert` چاپ می‌شود.
  - `const f = obj.say;`: فقط **خود تابع** در `f` ریخته می‌شود. تابع هیچ اتصال دائمی به `obj` ندارد.
  - `f()`: این بار هیچ شیئی قبل از نقطه نیست؛ یک **صدا زدن ساده** (plain call) است و `this` دیگر `obj` نیست. نتیجه به محیط اجرا بستگی دارد:

  | محیط اجرا | `this` داخل `f()` | خروجی `f()` |
  |---|---|---|
  | Node.js، فایل معمولی `.js` (CommonJS، بدون strict) | شیء سراسری (`globalThis`) | `undefined` (شیء سراسری Node.js خاصیت `name` ندارد) |
  | مرورگر، تگ `<script>` معمولی (بدون strict) | `window` | یک خط **خالی** (چون `window.name` یک رشته‌ی واقعی و معمولاً `""` است) |
  | strict mode (`"use strict"`) یا ES module | `undefined` | `TypeError: Cannot read properties of undefined (reading 'name')` |

  منظور اسلاید از «(or global)» همین است: در حالت عادی `this` برابر **شیء سراسری** (global object) می‌شود؛ شیئی که متغیرها و توابع سراسری روی آن قرار دارند. نام استاندارد آن در همه‌ی محیط‌ها **`globalThis`** است (در مرورگر همان `window`). **strict mode** (حالت سخت‌گیرانه) با نوشتن `"use strict";` در ابتدای فایل یا تابع فعال می‌شود و بعضی رفتارهای خطرناک قدیمی را ممنوع می‌کند. **ES moduleها** (فایل‌هایی که با `import`/`export` کار می‌کنند) و بدنه‌ی کلاس‌ها **همیشه** strict هستند.

  ### چهار قانون پیدا کردن `this`

  برای یک تابع معمولی (غیر arrow)، به **محل صدا زدن** (call site) نگاه کن و این سؤال‌ها را **به همین ترتیب** بپرس؛ اولین جواب «بله» تعیین‌کننده است:

  | اولویت | شکل فراخوانی | `this` برابر است با | مثال |
  |---|---|---|---|
  | ۱ | با `new` | شیء تازه‌ای که ساخته می‌شود | `new User("Ali")` |
  | ۲ | با `call` / `apply` / `bind` | شیئی که صریحاً داده شده | `f.call(obj)` |
  | ۳ | به شکل متد: `obj.f()` | شیء قبل از نقطه | `obj.say()` |
  | ۴ | صدا زدن ساده: `f()` | شیء سراسری (`window` یا `globalThis`)؛ در strict mode: `undefined` | `f()` |

  و **arrow function** از هیچ‌کدام از این قانون‌ها پیروی نمی‌کند: `this` آن همان `this`ِ جایی است که arrow در آن **نوشته شده** است.

  ### قانون ۳: متد؛ شیءِ قبل از نقطه

  فقط شیئی مهم است که **دقیقاً قبل از آخرین نقطه** آمده است:

  ```js
  const user = {
    name: "outer",
    profile: {
      name: "inner",
      show() {
        console.log(this.name);
      },
    },
  };
  user.profile.show(); // inner (the object right before the dot is user.profile)
  ```

  و چون `this` به **فراخوانی** بستگی دارد نه به تعریف، یک تابع می‌تواند در اشیای مختلف `this`های مختلفی داشته باشد:

  ```js
  const robert = {
    name: "Robert",
    say() {
      return "I am " + this.name;
    },
  };
  const anna = { name: "Anna" };
  anna.say = robert.say;   // the SAME function is now stored in anna too
  console.log(anna.say()); // I am Anna (called on anna)
  ```

  ### قانون ۴: صدا زدن ساده و محدوده‌ی سراسری

  وقتی تابعی بدون هیچ شیئی صدا زده شود (مثل `f()` در اسلاید ۴۴)، در حالت عادی `this` برابر شیء سراسری است و در strict mode برابر `undefined`. جمله‌ی اسلاید ۴۴ («In global scope: window (browser) or undefined (strict mode)») را دقیق‌تر این‌طور بخوان:

  - در مرورگر، `this` در **بالاترین سطح** یک تگ `<script>` معمولی همیشه `window` است (حتی در strict mode).
  - تابع معمولی‌ای که به‌صورت **ساده** صدا زده شود: بدون strict، `this` برابر `window` است و در strict mode برابر `undefined`. «undefined (strict mode)»ِ اسلاید همین حالت است.
  - در بالاترین سطح یک ES module، `this` برابر `undefined` است.
  - در Node.js، در بالاترین سطح یک فایل CommonJS، `this` برابر `module.exports` است که در ابتدا یک شیء خالی است:

  ```js
  // Node.js, a normal CommonJS file (app.js)
  console.log(this);                    // {}
  console.log(this === module.exports); // true
  ```

  یک تفاوت مرورگر و Node.js: در مرورگر، `var` سراسری (و function declaration سراسری) خاصیتِ `window` می‌شود، ولی `let` و `const` نمی‌شوند:

  ```js
  // Browser, a classic <script> (not strict)
  var city = "Tabriz";
  function show() {
    console.log(this.city);
  }
  show();     // Tabriz (this = window, and var created window.city)
  const obj = { city: "Shiraz", show };
  obj.show(); // Shiraz (the same function, called as a method)
  ```

  ### قانون ۲: `call`، `apply` و `bind`

  هر تابع سه متد دارد که با آن‌ها می‌توانی `this` را **دستی** تعیین کنی. اولین آرگومانِ هر سه، همان شیئی است که می‌خواهی `this` شود:

  ```js
  function introduce(greeting, punctuation) {
    return greeting + ", " + this.name + punctuation;
  }
  const robert = { name: "Robert" };

  console.log(introduce.call(robert, "Hi", "!"));       // Hi, Robert!
  console.log(introduce.apply(robert, ["Hello", "?"])); // Hello, Robert?
  const bound = introduce.bind(robert); // nothing runs yet: a NEW function is returned
  console.log(bound("Hey", "."));       // Hey, Robert.
  ```

  | متد | تابع را همان لحظه اجرا می‌کند؟ | آرگومان‌ها | چه برمی‌گرداند؟ |
  |---|---|---|---|
  | `call(thisArg, a, b)` | بله | جدا‌جدا، با کاما | نتیجه‌ی تابع |
  | `apply(thisArg, [a, b])` | بله | داخل **یک آرایه** | نتیجه‌ی تابع |
  | `bind(thisArg)` | **خیر** | هنگام صدا زدن تابع جدید | یک **تابع جدید** با `this` دائمی |

  برای حفظ کردن: **C**all با **C**omma (کاما)، **A**pply با **A**rray (آرایه).

  با همین ابزار، مشکل خط آخر اسلاید ۴۴ حل می‌شود (هر سه را اجرا کرده‌ایم):

  ```js
  const obj = {
    name: "Robert",
    say() {
      console.log(this.name);
    }
  };
  const f = obj.say;
  f.call(obj);   // Robert
  f.apply(obj);  // Robert
  f.bind(obj)(); // Robert
  ```

  تابعی که با `bind` ساخته شده، `this`ش **برای همیشه** قفل است: نه `call` و `apply` و نه یک `bind` دوباره نمی‌توانند آن را عوض کنند:

  ```js
  function show() {
    console.log(this.name);
  }
  const a = { name: "A" };
  const b = { name: "B" };
  const f = show.bind(a);
  f();         // A
  f.call(b);   // A (a bound function ignores call/apply)
  f.bind(b)(); // A (binding again has no effect)
  ```

  ### قانون ۱: `new`

  وقتی تابعی با `new` صدا زده شود، یک شیء تازه ساخته می‌شود و `this` به آن اشاره می‌کند. کلاس‌ها (درس «کلاس‌ها (Classes) در JavaScript») همین کار را می‌کنند و قبل از ES6 همین کار با تابع‌های معمولی انجام می‌شد:

  ```js
  function Car(model) {
    this.model = model; // "this" is the brand-new object
  }
  const c = new Car("Pride");
  console.log(c.model); // Pride
  ```

  اگر چنین تابعی را **بدون** `new` صدا بزنی، یک صدا زدن ساده است: در حالت عادی `this` شیء سراسری می‌شود و `model` به‌اشتباه روی شیء سراسری ساخته می‌شود! کلاس‌ها برای جلوگیری از همین اشتباه، بدون `new` خطای `TypeError` می‌دهند.

  ### arrow function و lexical this

  arrow function **`this` مخصوص خودش را ندارد**؛ وقتی داخلش از `this` استفاده کنی، JavaScript آن را مثل یک متغیر معمولی از محدوده‌ی بیرونی (جایی که arrow **نوشته شده**) برمی‌دارد. نتیجه‌ها:

  **۱. arrow به‌عنوان متد شیء، شیء را نمی‌شناسد (دام معروف):**

  ```js
  const counter = {
    count: 10,
    regular() {
      return this.count; // this = counter
    },
    arrow: () => this.count, // this = the OUTER this, not counter
  };
  console.log(counter.regular()); // 10
  console.log(counter.arrow());   // undefined (Node.js: the outer this is module.exports = {})
  ```

  آکولادهای object literal محدوده‌ی جدیدی برای `this` نمی‌سازند؛ پس `this` در `arrow` همان `this` بیرون از شیء است: در Node.js شیء `module.exports` و در یک `<script>` مرورگر، `window`.

  **۲. arrow داخل متد، `this` متد را نگه می‌دارد (کاربرد درست):**

  ```js
  const team = {
    name: "Blue",
    members: ["Ali", "Sara"],
    list() {
      return this.members.map((m) => m + " of " + this.name); // the arrow uses list's this
    },
  };
  console.log(team.list()); // [ 'Ali of Blue', 'Sara of Blue' ]
  ```

  در مقابل، یک تابع **معمولی** تودرتو `this` را گم می‌کند، چون به‌صورت ساده صدا زده می‌شود:

  ```js
  const team2 = {
    name: "Blue",
    show() {
      function inner() {
        return this.name; // inner() is a plain call: this is NOT team2
      }
      return inner();
    },
  };
  console.log(team2.show()); // undefined in Node.js (TypeError in strict mode)
  ```

  **۳. `call`، `apply` و `bind` روی `this`ِ arrow اثری ندارند:**

  ```js
  const arrow = () => this;
  const obj = { name: "obj" };
  console.log(arrow.call(obj) === obj); // false
  ```

  **۴.** arrow function را نمی‌شود با `new` صدا زد (`TypeError: ... is not a constructor`).

  ### callbackها و گم شدن `this`

  **callback** (تابعی که به تابع دیگری داده می‌شود تا بعداً صدایش بزند) یکی از رایج‌ترین جاهای گم شدن `this` است:

  ```js
  const timer = {
    label: "T1",
    report() {
      console.log("label:", this.label);
    },
  };
  setTimeout(timer.report, 0);             // label: undefined (only the function is passed)
  setTimeout(() => timer.report(), 0);     // label: T1 (fix 1: an arrow wrapper makes a real method call)
  setTimeout(timer.report.bind(timer), 0); // label: T1 (fix 2: bind)
  ```

  `setTimeout(timer.report, 0)` فقط **خود تابع** را تحویل می‌دهد، نه `timer` را. بعداً تابع بدون `timer.` اجرا می‌شود و `this` دیگر `timer` نیست (در مرورگر `window` و در Node.js یک شیء داخلی به نام Timeout؛ در هر دو خاصیت `label` وجود ندارد). اشتباه رایج دیگر نوشتن `setTimeout(timer.report(), 0)` است: این‌جا تابع **همان لحظه** اجرا می‌شود و به‌جای تابع، مقدار برگشتی‌اش (`undefined`) به `setTimeout` می‌رسد؛ Node.js در این حالت خطای `TypeError` می‌دهد.

  همین داستان داخل یک متد:

  ```js
  const user = {
    name: "Sara",
    later() {
      setTimeout(() => console.log("arrow:", this.name), 0); // arrow: Sara
      setTimeout(function () {
        console.log("function:", this.name);                 // function: undefined
      }, 0);
    },
  };
  user.later();
  ```

  ### `this` در کلاس‌ها

  در `constructor` و در متدهایی که به شکل `instance.method()` صدا زده می‌شوند، `this` همان **نمونه** است (اسلاید ۴۳). اما بدنه‌ی کلاس همیشه strict است؛ پس متدی که از نمونه جدا شود، `this` برابر `undefined` می‌گیرد:

  ```js
  class User {
    constructor(name) {
      this.name = name;
    }
    greet() {
      return "Hello, " + this.name;
    }
  }
  const kermit = new User("Kermit");
  console.log(kermit.greet()); // Hello, Kermit
  const greet = kermit.greet;
  greet(); // TypeError: Cannot read properties of undefined (reading 'name')
  ```

  دو راه‌حل رایج: در `constructor` بنویسی `this.greet = this.greet.bind(this);`، یا متد را به شکل یک class field با arrow function تعریف کنی: `greet = () => "Hello, " + this.name;` (این arrow، `this` را از نمونه‌ی در حال ساخت می‌گیرد).

  ### پیش‌نمایش فصل دوم: `this` در event handlerها

  در فصل دوم با **event handler** (تابعی که هنگام رخ دادن یک رویداد، مثل کلیک، اجرا می‌شود) کار می‌کنیم. اگر handler یک تابع معمولی باشد، `this` همان عنصری است که listener روی آن نصب شده؛ اگر arrow باشد، `this` بیرونی (در یک `<script>` معمولی، `window`) را نگه می‌دارد:

  ```js
  const btn = document.querySelector("#btn"); // <button id="btn">Save</button>
  btn.addEventListener("click", function () {
    console.log(this.id);         // btn (this = the element)
  });
  btn.addEventListener("click", () => {
    console.log(this === window); // true (an arrow keeps the outer this)
  });
  ```

  ::: tip نکته
  - برای تابع معمولی فقط به **خط صدا زدن** نگاه کن، نه به جایی که تابع تعریف شده؛ به ترتیب: `new` ← `call`/`apply`/`bind` ← `obj.f()` ← `f()`.
  - برای arrow function فقط به **جای نوشته شدن** نگاه کن: `this` آن همان `this` بیرونی است و با هیچ روشی عوض نمی‌شود.
  - `call` و `apply` همان لحظه اجرا می‌کنند (Comma / Array)؛ `bind` اجرا نمی‌کند و تابع جدیدی با `this` دائمی برمی‌گرداند.
  - برای متدهای شیء شکل کوتاه `say() {}` (یا `function`) بنویس، نه arrow؛ برای callbackهای داخل متد، arrow بهترین انتخاب است.
  :::

  ::: trap دام تستی
  - `const f = obj.say; f();` شیء را گم می‌کند: Node.js (CommonJS، بدون strict) ← `undefined`؛ مرورگر ← خط خالی (`window.name` برابر `""`)؛ strict mode یا ES module ← `TypeError`. **همیشه محیط اجرا را در صورت سؤال پیدا کن.**
  - arrow function به‌عنوان متد شیء، `this` را از بیرون می‌گیرد، نه از خود شیء.
  - `setTimeout(obj.say, 1000)` شیء را گم می‌کند و `setTimeout(obj.say(), 1000)` تابع را **همان لحظه** اجرا می‌کند. درستش: `setTimeout(() => obj.say(), 1000)` یا `setTimeout(obj.say.bind(obj), 1000)`.
  - تابع معمولی تودرتو داخل متد، `this` متد را به ارث نمی‌برد؛ arrow تودرتو می‌برد.
  - متد جداشده از نمونه‌ی کلاس، حتی در فایلِ بدون `"use strict"`، خطای `TypeError` می‌دهد، چون بدنه‌ی کلاس همیشه strict است.
  - در بالاترین سطح یک فایل CommonJS در Node.js، `this` برابر `{}` (یعنی `module.exports`) است، نه `window` یا `undefined`.
  :::

  ::: summary
  | فراخوانی | `this` |
  |---|---|
  | `new F()` | شیء تازه |
  | `f.call(o)` / `f.apply(o)` / `f.bind(o)()` | `o` |
  | `o.f()` | `o` (شیء قبل از نقطه) |
  | `f()` | `window` یا `globalThis` (بدون strict)؛ `undefined` (strict) |
  | arrow function | `this` محدوده‌ی بیرونی (lexical)؛ غیرقابل تغییر |
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۴۳، کلمه‌ی کلیدی `this` (در حالت کلی) به چه چیزی اشاره می‌کند؟
    options:
      - 'به خودِ تابعی که `this` داخل آن نوشته شده است.'
