    expect: "24"
    options:
      - text: '`.key`'
        code: 'console.log(user.key);'
      - text: '`["key"]`'
        code: 'console.log(user["key"]);'
      - text: '`.[key]`'
        code: 'console.log(user.[key]);'
      - text: '`[key]`'
        code: 'console.log(user[key]);'
    answer: 4
    explain: |
      نام کلید (`"age"`) داخل متغیر `key` است، پس باید از براکت بدون کوتیشن استفاده کنیم تا مقدارِ متغیر حساب شود: `user[key]` همان `user["age"]` است. گزینه‌های ۱ و ۲ هر دو دنبال کلیدی به نام `"key"` می‌گردند و `undefined` چاپ می‌کنند. گزینه‌ی ۳ اصلاً نوشتار درستی ندارد و `SyntaxError` می‌دهد (`?.[key]` درست است، ولی `.[key]` نه).

  - level: medium
    stem: |
      اجرای کد زیر در کدام خط با خطا متوقف می‌شود؟
    check: error-line
    errorName: TypeError
    code: |
      const user = { name: "Barry" };
      user.name = "Wally";
      user["age"] = 25;
      delete user.age;
      user = { name: "Iris" };
      console.log(user.name);
    options:
      - line: 0
      - line: 2
      - line: 4
      - line: 5
    answer: 4
    explain: |
      خط‌های ۲ تا ۴ فقط **محتوای** شیء را تغییر می‌دهند (عوض کردن، اضافه کردن و حذف کردن property)، که برای شیءِ `const` کاملاً مجاز است. اما خط ۵ می‌خواهد خودِ متغیر `user` را به یک شیء **دیگر** وصل کند؛ این انتساب دوباره است و خطای `TypeError: Assignment to constant variable.` می‌دهد. پس گزینه‌ی «بدون خطا» هم نادرست است.

  - level: medium
    stem: |
      کدام تعریفِ شیء **خطا** می‌دهد؟
    check: option-throws
    options:
      - code: 'const o = { function greet() { return "hi"; } };'
      - code: 'const o = { greet() { return "hi"; } };'
      - code: 'const o = { greet: function () { return "hi"; } };'
      - code: 'const o = { greet: () => "hi" };'
    answer: 1
    explain: |
      داخل object literal هر عضو باید شکل `key: value` (یا shorthand) داشته باشد. گزینه‌ی ۲ شکل کوتاهِ متد است (مثل `greet()` در اسلاید ۴۱)، گزینه‌ی ۳ شکل کامل آن و گزینه‌ی ۴ یک arrow function را به‌عنوان مقدار نگه می‌دارد؛ هر سه مجازند. اما نوشتن کلمه‌ی `function` قبل از نام متد (گزینه‌ی ۱) در object literal معتبر نیست و `SyntaxError` می‌دهد.

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      function birthday(person) {
        person.age = person.age + 1;
      }
      const sara = { name: "Sara", age: 20 };
      birthday(sara);
      birthday(sara);
      console.log(sara.age);
    options:
      - out: "20"
      - out: "21"
      - out: "22"
      - out: "!! TypeError"
    answer: 3
    explain: |
      وقتی یک شیء را به تابع می‌دهیم، تابع **همان شیء** را می‌گیرد (reference کپی می‌شود، نه خود شیء). پس هر بار `person.age` یکی زیاد می‌شود و بعد از دو فراخوانی، `sara.age` برابر `22` است. گزینه‌ی ۱ فرض کرده تابع روی یک کپی کار می‌کند، گزینه‌ی ۲ اثر فراخوانی دوم را جا انداخته و گزینه‌ی ۴ تغییر محتوای شیءِ `const` را ممنوع پنداشته است.

  - level: hard
    stem: |
      خروجی کد زیر در حالت عادی (غیر strict) چیست؟
    check: output
    code: |
      const word = "hi";
      word.extra = 42;
      console.log(word.extra);
      console.log(word.length, word.toUpperCase());
    options:
      - out: ["42", "2 HI"]
      - out: ["!! TypeError"]
      - out: ["undefined", "2 HI"]
      - out: ["undefined", "undefined undefined"]
    answer: 3
    explain: |
      رشته primitive است، نه شیء. وقتی روی آن نقطه می‌گذاریم، JavaScript برای یک لحظه یک شیء پوشاننده (wrapper) می‌سازد؛ `extra` روی همان شیء موقت نوشته می‌شود که بلافاصله دور انداخته می‌شود، پس خواندن بعدی `undefined` می‌دهد (رد گزینه‌ی ۱). خواندن `length` و صدا زدن `toUpperCase` از همین مکانیزم استفاده می‌کنند و کار می‌کنند: `2 HI` (رد گزینه‌ی ۴). خطای `TypeError` (گزینه‌ی ۲) فقط در حالت strict رخ می‌داد: `Cannot create property 'extra' on string 'hi'`.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const settings = { theme: "dark", font: undefined };
      console.log(settings.font === settings.size);
      console.log("font" in settings, "size" in settings);
      console.log(settings.hasOwnProperty("toString"), "toString" in settings);
    options:
      - out: ["false", "true false", "false false"]
      - out: ["true", "false false", "false true"]
      - out: ["true", "true false", "true true"]
      - out: ["true", "true false", "false true"]
    answer: 4
    explain: |
      `settings.font` مقدارش `undefined` است و `settings.size` اصلاً وجود ندارد و آن هم `undefined` می‌دهد؛ پس خط اول `true` است و مقایسه با `undefined` فرق این دو حالت را نمی‌فهمد (رد گزینه‌ی ۱). `in` فقط می‌پرسد «کلید هست؟»: `font` هست (هرچند مقدارش `undefined` است) و `size` نیست (رد گزینه‌ی ۲). `toString` از `Object.prototype` به ارث رسیده: `in` آن را می‌بیند، ولی `hasOwnProperty` فقط کلیدهای **خودِ** شیء را حساب می‌کند و `false` می‌دهد (رد گزینه‌ی ۳).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const user = { name: "Ali", address: { city: "Tehran" } };
      const copy = { ...user };
      copy.name = "Reza";
      copy.address.city = "Shiraz";
      console.log(user.name, user.address.city);
      console.log(copy.address === user.address);
    options:
      - out: ["Ali Tehran", "false"]
      - out: ["Ali Shiraz", "true"]
      - out: ["Reza Shiraz", "true"]
      - out: ["Ali Tehran", "true"]
    answer: 2
    explain: |
      spread یک کپی **سطحی** (shallow) می‌سازد: `copy` شیء جدیدی است، پس عوض کردن `copy.name` روی `user.name` اثری ندارد (رد گزینه‌ی ۳). اما مقدار `address` یک شیء است و فقط **reference** آن کپی شده؛ هر دو به **همان** شیء آدرس اشاره می‌کنند (`true` در خط آخر)، پس تغییر `copy.address.city` در `user` هم دیده می‌شود. گزینه‌های ۱ و ۴ spread را کپی کامل (deep) فرض کرده‌اند.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const a = { id: 1 };
      const b = { id: 2 };
      const labels = {};
      labels[a] = "first";
      labels[b] = "second";
      console.log(labels[a]);
      console.log(Object.keys(labels));
    options:
      - out: ["second", "['[object Object]']"]
      - out: ["first", "['[object Object]', '[object Object]']"]
      - out: ["first", "['a', 'b']"]
      - out: ["undefined", "[]"]
    answer: 1
    explain: |
      کلیدهای شیء فقط رشته (یا Symbol) هستند؛ پس شیءهای `a` و `b` موقع کلید شدن به رشته تبدیل می‌شوند و رشته‌ی هر دو `"[object Object]"` است. یعنی `labels[a]` و `labels[b]` **یک** خانه‌اند: اول `"first"` در آن نوشته می‌شود و بعد `"second"` جایش را می‌گیرد. برای همین `labels[a]` مقدار `second` را می‌دهد و فقط یک کلید وجود دارد. گزینه‌ی ۲ دو کلید جدا فرض کرده و گزینه‌ی ۳ فکر کرده نام متغیرها کلید می‌شوند.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const settings = { theme: "dark", size: 12, theme: "light" };
      const updated = { ...settings, size: settings.size + 2 };
      console.log(settings.theme, updated.size);
      console.log(Object.keys(updated));
    options:
      - out: ["dark 14", "['theme', 'size', 'theme']"]
      - out: ["!! SyntaxError"]
      - out: ["light 14", "['theme', 'size']"]
      - out: ["light 12", "['size', 'theme']"]
    answer: 3
    explain: |
      کلید تکراری در object literal خطا نیست (رد گزینه‌ی ۲) و **آخرین مقدار برنده است**، پس `theme` برابر `"light"` می‌شود و شیء فقط دو کلید دارد (رد گزینه‌ی ۱). در `updated`، اول همه‌ی propertyهای `settings` ریخته می‌شوند و بعد `size` با `12 + 2` یعنی `14` بازنویسی می‌شود؛ بازنویسی جای کلید را عوض نمی‌کند، پس ترتیب کلیدها `['theme', 'size']` است. گزینه‌ی ۴ بازنویسی را نادیده گرفته است.

  - level: hard
    stem: |
      کدام گزینه **نادرست** است؟
    check: claims
    want: false
    options:
      - text: 'حاصل `"hello".length` برابر `5` است، چون رشته برای یک لحظه در یک شیء پوشاننده (wrapper) قرار می‌گیرد.'
        expr: '"hello".length'
        equals: '5'
      - text: 'حاصل `typeof new Date()` برابر `"object"` است.'
        expr: 'typeof new Date()'
        equals: '"object"'
      - text: 'حاصل `typeof function () {}` برابر `"function"` است، هرچند توابع هم نوعی شیء‌اند.'
        expr: 'typeof function () {}'
        equals: '"function"'
      - text: 'حاصل `typeof "hello"` برابر `"object"` است، چون در JavaScript همه چیز شیء است.'
        expr: 'typeof "hello"'
        equals: '"object"'
    answer: 4
    explain: |
      زیرنویس اسلاید ۴۰ می‌گوید «**تقریباً** همه چیز شیء است»، نه همه چیز: رشته یک primitive است و `typeof "hello"` برابر `"string"` است. گزینه‌ی ۱ درست است، چون primitiveها از طریق شیء پوشاننده‌ی موقت property و method دارند. تاریخ‌ها شیء‌اند (گزینه‌ی ۲) و توابع شیءهای خاصی هستند که `typeof` برایشان `"function"` می‌دهد (گزینه‌ی ۳).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const user = {
        name: "Barry Allen",
        greet() {
          return `Hello, I'm ${this.name}`;
        },
      };
      const action = "greet";
      console.log(user[action]());
      console.log(typeof user.greet, typeof user.greet());
    options:
      - out: ["!! TypeError"]
      - out: ["Hello, I'm Barry Allen", "function string"]
      - out: ["Hello, I'm undefined", "function string"]
      - out: ["Hello, I'm Barry Allen", "object string"]
    answer: 2
    explain: |
      `user[action]` همان `user["greet"]` یعنی متد `greet` است و با `()` بلافاصله صدا زده می‌شود؛ این هنوز «صدا زدن روی شیء» است، پس `this` همان `user` است و نام درست چاپ می‌شود (رد گزینه‌های ۱ و ۳). در خط آخر، `user.greet` **خودِ تابع** است و `typeof` آن `"function"` است (نه `"object"`؛ رد گزینه‌ی ۴)، ولی `user.greet()` تابع را **اجرا** می‌کند و رشته‌ی برگشتی را می‌دهد، پس `"string"`.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const id = Symbol("id");
      const field = "score";
      const item = { name: "Pen", [id]: 7, [field]: 20 };
      console.log(Object.keys(item));
      console.log(item[id], item.field, item.score);
    options:
      - out: ["['name', 'score']", "7 undefined 20"]
      - out: ["['name', 'Symbol(id)', 'score']", "7 undefined 20"]
      - out: ["['name', 'score']", "undefined undefined 20"]
      - out: ["['name', 'id', 'field']", "7 20 20"]
    answer: 1
    explain: |
      براکت داخل literal یعنی «**مقدارِ** این عبارت را کلید کن»: `[field]` کلید `"score"` می‌سازد (نه `"field"`) و `[id]` خودِ Symbol را کلید می‌کند. `Object.keys` فقط کلیدهای رشته‌ای را برمی‌گرداند و Symbolها را نشان نمی‌دهد: `['name', 'score']` (رد گزینه‌های ۲ و ۴). `item[id]` با همان Symbol مقدار `7` را پیدا می‌کند (رد گزینه‌ی ۳)، `item.field` دنبال کلیدی به نام `"field"` می‌گردد که نیست (`undefined`) و `item.score` برابر `20` است.
