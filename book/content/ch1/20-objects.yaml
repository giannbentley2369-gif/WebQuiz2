id: ch1-objects
title: "اشیاء (Objects) و Object literal"
slides: "Introduction to JS، اسلایدهای ۴۰ و ۴۱"
lesson: |
  تا این‌جا بیشتر با مقدارهای ساده (primitive) مثل عدد و رشته کار کردیم. اما داده‌های دنیای واقعی تنها نیستند: یک «کاربر» نام دارد، سن دارد، شهر دارد و کارهایی هم انجام می‌دهد (مثلاً سلام می‌کند). اگر برای هر کدام یک متغیر جدا بسازیم (`userName`، `userAge`، `userCity`، …) خیلی زود گم می‌شویم. **object** (شیء) راه JavaScript برای کنار هم نگه داشتن همه‌ی این‌هاست.

  ::: analogy
  یک شیء را مثل یک **کمد با کشوهای برچسب‌دار** تصور کن. روی هر کشو یک برچسب نوشته شده (مثل `name` یا `age`) که به آن **کلید** (key) می‌گوییم، و داخل کشو یک چیز هست (مثل `"Barry Allen"` یا `24`) که به آن **مقدار** (value) می‌گوییم. برای برداشتن چیزی فقط کافی است برچسب کشو را بدانی.
  :::

  ### شیء چیست؟ (اسلاید ۴۰)
  اسلاید ۴۰ چهار جمله‌ی کلیدی دارد:

  1. شیءها **داده** (data) و **رفتار** (behavior) مرتبط را کنار هم گروه‌بندی می‌کنند.
  2. هر شیء از **جفت‌های کلید-مقدار** (key-value pairs) ساخته شده است.
  3. مقدارها می‌توانند **داده** باشند که به آن‌ها **property** (ویژگی) می‌گوییم، یا **تابع** باشند که به آن‌ها **method** (متد؛ تابعی که متعلق به یک شیء است) می‌گوییم.
  4. **JSON** (مخفف JavaScript Object Notation؛ یک قالب متنی برای نوشتن داده‌ها) رایج‌ترین راه برای **ذخیره** و **به اشتراک گذاشتن** داده‌های یک شیء است؛ مثلاً وقتی سرور اطلاعات یک کاربر را برای مرورگر می‌فرستد. جزئیات JSON را در درس JSON می‌خوانیم.

  ```js
  const user = {
    name: "Barry Allen", // property: key "name", value "Barry Allen"
    age: 24,             // property: key "age", value 24
    greet() {            // method: a function stored in the object
      console.log("Hi!");
    }
  };
  ```

  | اصطلاح | یعنی | در مثال بالا |
  |---|---|---|
  | key (کلید) | نام یک خانه از شیء | `name`، `age` و `greet` |
  | value (مقدار) | چیزی که در آن خانه است | `"Barry Allen"`، `24` و یک تابع |
  | property | جفتی که مقدارش **داده** است | `name: "Barry Allen"` |
  | method | جفتی که مقدارش **تابع** است | `greet() { ... }` |

  #### «تقریباً همه چیز شیء است» (میم اسلاید ۴۰)
  در میم اسلاید ۴۰، کره‌ی زمین با لوگوی JS دیده می‌شود. فضانورد اول با تعجب می‌گوید: «صبر کن… همه‌اش **شیء** است؟!» و فضانورد دوم که از پشت سر به او اسلحه گرفته جواب می‌دهد: «همیشه همین‌طور بوده (Always has been)». زیرنویس اسلاید هم می‌گوید: «از نظر فنی، در JavaScript **تقریباً** همه چیز یک شیء است.»

  منظور این است که آرایه‌ها، توابع، تاریخ‌ها (`Date`) و خیلی چیزهای دیگر در اصل شیء هستند. اما کلمه‌ی «**تقریباً**» مهم است: هفت نوع **primitive** (عدد، رشته، boolean، `undefined`، `null`، Symbol و BigInt) شیء **نیستند**.

  ```js
  console.log(typeof { a: 1 });       // "object"
  console.log(typeof [1, 2]);         // "object"   (arrays are objects)
  console.log(typeof new Date());     // "object"
  console.log(typeof function () {}); // "function" (functions are special objects)
  console.log(typeof "hello");        // "string"   (a primitive, NOT an object)
  ```

  پس چرا می‌توانیم بنویسیم `"hello".length` یا `"hello".toUpperCase()`، انگار رشته یک شیء با property و method است؟ چون وقتی بعد از یک primitive نقطه می‌گذاری، JavaScript **برای یک لحظه** آن را داخل یک **شیء پوشاننده** (wrapper object؛ مثلاً `String` برای رشته‌ها و `Number` برای عددها) می‌گذارد، property یا method را از آن شیء موقت می‌خواند و بلافاصله آن را دور می‌اندازد. برای همین primitiveها «مثل شیء رفتار می‌کنند» ولی شیء نیستند:

  ```js
  const word = "hello";
  console.log(word.length);        // 5
  console.log(word.toUpperCase()); // "HELLO"
  word.extra = 42;                 // stored on a temporary wrapper (in strict mode: TypeError)
  console.log(word.extra);         // undefined -> that wrapper is already gone
  ```

  `null` و `undefined` هیچ شیء پوشاننده‌ای ندارند؛ برای همین `null.length` یا `undefined.x` خطای `TypeError` می‌دهند.

  ### ساختن شیء با object literal (اسلاید ۴۱)
  ساده‌ترین راه ساختن شیء، **object literal** است؛ یعنی نوشتن مستقیم خود شیء با آکولاد: داخل `{ }` جفت‌های `key: value` را می‌نویسیم و آن‌ها را با ویرگول از هم جدا می‌کنیم. اسلاید ۴۱ می‌گوید:

  - شیءها با جفت‌های `{ key: value }` تعریف می‌شوند.
  - داده و رفتار مرتبط را کنار هم نگه می‌دارند.
  - **کلیدها رشته (string) هستند (یا Symbol)** و **مقدارها از هر نوعی** می‌توانند باشند.
  - از **متد** و **شیء تودرتو** (nested object؛ شیئی که مقدارِ یک کلیدِ شیء دیگر است) پشتیبانی می‌کنند.
  - **پایه‌ی ساختار JSON** در JavaScript هستند.

  کد اسلاید ۴۱:

  ```js title=ol.js
  const user = {
    name: "Barry Allen",
    age: 24,
    isTheFlash: true,
    greet() {
      console.log(`Hello, I'm ${this.name}`);
    }
  };

  user.greet(); // Hello, I'm Barry Allen
  ```

  بیا خط‌به‌خط ببینیم:

  - `user` یک شیء با چهار کلید است: سه property (`name` از نوع رشته، `age` عدد و `isTheFlash` boolean) و یک method (`greet`).
  - `greet() { ... }` شکل کوتاه‌شده‌ی (shorthand) نوشتن متد است و دقیقاً یعنی `greet: function () { ... }`.
  - داخل متد کلمه‌ی **`this`** آمده است: وقتی متدی را به شکل `user.greet()` صدا می‌زنیم، `this` همان شیءِ **قبل از نقطه**، یعنی `user` است؛ پس `this.name` می‌شود `"Barry Allen"`. (قاعده‌های کامل `this` را در درس `this` می‌خوانیم.)
  - رشته‌ی داخل backtick یک template literal است و `${this.name}` مقدار را وسط رشته می‌گذارد؛ پس خروجی `Hello, I'm Barry Allen` است.

  اگر کل یک شیء را چاپ کنیم، Node.js متدش را به شکل `[Function: greet]` نشان می‌دهد:

  ```js
  const hero = {
    name: "Barry Allen",
    age: 24,
    greet() {
      console.log(`Hello, I'm ${this.name}`);
    }
  };
  console.log(hero); // { name: 'Barry Allen', age: 24, greet: [Function: greet] }
  ```

  #### مقدار می‌تواند هر چیزی باشد؛ حتی آرایه و شیء دیگر
  ```js
  const student = {
    name: "Sara",
    scores: [18, 20, 17],      // an array as a value
    address: {                 // a nested object
      city: "Tehran",
      zip: "12345"
    },
    "favorite color": "blue",  // a key with a space must be quoted
    isActive: true
  };

  console.log(student.address.city); // "Tehran"
  console.log(student.scores[1]);    // 20
  ```

  برای رسیدن به داده‌های تودرتو، نقطه‌ها (و براکت‌ها) را پشت سر هم می‌نویسیم: `student.address.city` یعنی «از `student` برو داخل `address` و از آن‌جا `city` را بردار».

  ### خواندن propertyها: نقطه یا براکت؟
  دو راه برای خواندن (و نوشتن) یک property داریم:

  | روش | مثال | کی؟ |
  |---|---|---|
  | dot notation (نقطه) | `user.name` | نام کلید را موقع نوشتن کد می‌دانی و یک نام معمولی است |
  | bracket notation (براکت) | `user["name"]` | کلید داخل یک **متغیر** است، یا فاصله یا خط تیره دارد، یا با رقم شروع می‌شود |

  ```js
  const user = { name: "Barry", age: 24, "first-name": "Bartholomew" };

  console.log(user.name);          // "Barry"
  console.log(user["name"]);       // "Barry" (exactly the same thing)

  const key = "age";
  console.log(user[key]);          // 24        -> uses the VALUE of the variable key
  console.log(user.key);           // undefined -> looks for a key literally named "key"

  console.log(user["first-name"]); // "Bartholomew"
  // user.first-name would mean (user.first) - name: a subtraction, not a key!
  ```

  ::: trap دام تستی: `obj.key` با `obj[key]` فرق دارد
  بعد از نقطه، JavaScript **خودِ کلمه** را نام کلید می‌گیرد؛ پس `user.key` یعنی «کلیدی به نام `"key"`». اما داخل براکت یک **عبارت** نوشته می‌شود و اول مقدارش حساب می‌شود؛ پس `user[key]` یعنی «کلیدی که نامش داخل متغیر `key` است». `user["key"]` (با کوتیشن) هم دوباره همان `user.key` است. اگر داخل براکت نام یک متغیرِ **تعریف‌نشده** را بی‌کوتیشن بنویسی (مثلاً `user[age]` وقتی متغیری به نام `age` نداری)، خطای `ReferenceError` می‌گیری.
  :::

  #### کلیدها همیشه رشته‌اند (یا Symbol)
  هر کلیدی که بنویسی، اگر Symbol نباشد، به **رشته** تبدیل می‌شود. پس کلید عددی `1` در واقع رشته‌ی `"1"` است و `obj[1]` و `obj["1"]` به **یک** خانه اشاره می‌کنند:

  ```js
  const obj = { 1: "one" };
  console.log(obj[1]);           // "one"
  console.log(obj["1"]);         // "one" (the same property)
  console.log(Object.keys(obj)); // [ '1' ] -> the key is the string "1"
  ```

  حتی اگر یک شیء را کلید کنی، به رشته‌ی `"[object Object]"` تبدیل می‌شود (پس دو شیءِ متفاوت به‌عنوان کلید، **یک** کلید می‌شوند!). تنها کلیدهای غیررشته‌ای، **Symbol**ها هستند: هر `Symbol()` یکتاست (اسلاید ۱۶) و برای کلیدهایی به کار می‌رود که نباید تصادفاً با کلید دیگری یکی شوند.

  اگر داخل خودِ literal کلید را در براکت بنویسی (computed property name؛ کلید محاسبه‌شده)، **مقدارِ** عبارت داخل براکت کلید می‌شود:

  ```js
  const id = Symbol("id");
  const field = "score";
  const item = { name: "Pen", [id]: 123, [field]: 95 };

  console.log(item.score);        // 95  -> [field] became the key "score"
  console.log(item[id]);          // 123
  console.log(Object.keys(item)); // [ 'name', 'score' ] -> symbol keys are not listed
  ```

  ### اگر property وجود نداشته باشد؟
  خواندن کلیدی که وجود ندارد **خطا نمی‌دهد** و فقط `undefined` برمی‌گرداند. اما اگر روی همان `undefined` دوباره نقطه بگذاری، خطای `TypeError` می‌گیری:

  ```js
  const user = { name: "Barry", address: { city: "Central City" } };
  console.log(user.phone);        // undefined (no error)
  console.log(user.address.city); // "Central City"
  console.log(user.job?.title);   // undefined (optional chaining stops safely)
  console.log(user.job.title);    // TypeError: Cannot read properties of undefined (reading 'title')
  ```

  عملگر **optional chaining** یعنی `?.` (زنجیره‌ی اختیاری) می‌گوید: «اگر سمت چپ `undefined` یا `null` بود، همان‌جا بایست و `undefined` بده؛ وگرنه مثل نقطه‌ی معمولی ادامه بده.»

  ### اضافه کردن، تغییر دادن و حذف کردن
  شیءها **تغییرپذیر** (mutable) هستند؛ یعنی بعد از ساختن هم می‌توانی propertyهایشان را عوض کنی:

  ```js
  const user = { name: "Barry", age: 24 };

  user.city = "Central City"; // add: the key did not exist, so it is created
  user.age = 25;              // update: the key exists, so its value is replaced
  delete user.name;           // remove the whole property (key and value)

  console.log(user);          // { age: 25, city: 'Central City' }
  console.log(user.name);     // undefined
  ```

  - انتساب به کلیدی که **نیست** آن را **می‌سازد**؛ انتساب به کلیدی که **هست** مقدارش را **عوض می‌کند**.
  - عملگر `delete` خودِ کلید را حذف می‌کند، نه فقط مقدارش را.
  - اگر در یک literal یک کلید دو بار بیاید، **آخرین مقدار برنده است**: `{ a: 1, a: 2 }` همان `{ a: 2 }` است.

  #### `const` شیء را قفل نمی‌کند
  همان‌طور که در درس متغیرها دیدیم، `const` فقط **انتساب دوباره‌ی خود متغیر** را منع می‌کند، نه تغییر **محتوای** شیء:

  ```js
  const user = { name: "Barry" };
  user.name = "Wally";     // OK: changing a property
  user.age = 25;           // OK: adding a property
  user = { name: "Iris" }; // TypeError: Assignment to constant variable.
  ```

  ### آیا این کلید وجود دارد؟ `in` و `hasOwnProperty`
  ```js
  const user = { name: "Barry", nickname: undefined };

  console.log("name" in user);                  // true
  console.log("email" in user);                 // false
  console.log(user.hasOwnProperty("name"));     // true
  console.log("nickname" in user);              // true  (the key exists; its value is undefined)
  console.log(user.nickname === user.email);    // true  (both undefined: cannot tell them apart)
  console.log("toString" in user);              // true  (inherited from Object.prototype)
  console.log(user.hasOwnProperty("toString")); // false (not the object's OWN key)
  ```

  - `"key" in obj` نام کلید را به‌صورت **رشته** می‌گیرد (کوتیشن را فراموش نکن) و می‌گوید آیا این کلید در شیء هست یا نه. این عملگر کلیدهای **ارث‌برده** را هم حساب می‌کند؛ هر شیء معمولی چند متد مثل `toString` را از یک شیء پایه به نام `Object.prototype` به ارث می‌برد.
  - `obj.hasOwnProperty("key")` فقط کلیدهای **خودِ** شیء را حساب می‌کند. (شکل جدیدترش `Object.hasOwn(obj, "key")` است.)
  - مقایسه با `undefined` فرقِ «کلید نیست» و «کلید هست ولی مقدارش `undefined` است» را نمی‌فهمد؛ `in` می‌فهمد.

  ### گرفتن همه‌ی کلیدها و مقدارها
  ```js
  const prices = { tea: 2, coffee: 3, cake: 5 };

  console.log(Object.keys(prices));    // [ 'tea', 'coffee', 'cake' ]
  console.log(Object.values(prices));  // [ 2, 3, 5 ]
  console.log(Object.entries(prices)); // [ [ 'tea', 2 ], [ 'coffee', 3 ], [ 'cake', 5 ] ]

  for (const key in prices) {          // for...in walks over the keys
    console.log(key, prices[key]);     // tea 2, then coffee 3, then cake 5
  }
  ```

  این سه تابع همیشه **آرایه** برمی‌گردانند (کلیدها در آن‌ها رشته‌اند)، پس بعداً می‌توانی متدهای آرایه مثل `map` و `filter` را رویشان صدا بزنی. `Object.entries` برای هر کلید یک آرایه‌ی دوتایی `[key, value]` می‌سازد. در حلقه‌ی `for...in` (درس حلقه‌ها) حتماً بنویس `prices[key]`، نه `prices.key`؛ چون `key` یک متغیر است.

  ### نوشتن کوتاه: shorthand property
  وقتی نام متغیر و نام کلید یکی است، لازم نیست دو بار بنویسی:

  ```js
  const name = "Sara";
  const age = 21;

  const student1 = { name: name, age: age }; // long form
  const student2 = { name, age };            // shorthand: exactly the same object
  console.log(student2);                     // { name: 'Sara', age: 21 }
  ```

  ### شیءها با reference کپی و مقایسه می‌شوند
  متغیری که یک شیء در آن است، خودِ شیء را نگه نمی‌دارد؛ فقط **نشانیِ** آن را نگه می‌دارد که به آن **reference** (مرجع) می‌گوییم. پس `const b = a` شیء جدیدی **نمی‌سازد**؛ فقط نشانی را کپی می‌کند و حالا دو نام به **یک** شیء اشاره می‌کنند:

  ```js
  const a = { score: 10 };
  const b = a;          // copies the reference, not the object
  b.score = 99;         // changes the ONE shared object
  console.log(a.score); // 99
  console.log(a === b); // true (the same object)
  ```

  ::: analogy
  reference مثل **آدرس یک خانه** است که روی کاغذ نوشته شده. `const b = a` یعنی همان آدرس را روی یک کاغذ دیگر هم بنویسی؛ هنوز فقط **یک** خانه داریم. اگر با کاغذ دوم بروی و دیوار را رنگ کنی، کسی که با کاغذ اول بیاید هم دیوار رنگ‌شده را می‌بیند.
  :::

  همین اتفاق وقتی شیء را به یک تابع می‌دهیم هم می‌افتد: تابع همان شیء را می‌گیرد، نه یک کپی را. مقایسه‌ی شیءها با `==` یا `===` هم فقط می‌پرسد «آیا هر دو **همان یک** شیء‌اند؟»، نه «آیا محتوایشان یکی است؟»:

  ```js
  console.log({} === {});             // false (two different objects)
  console.log({ x: 1 } === { x: 1 }); // false (same content, different objects)
  const p = { x: 1 };
  const q = p;
  console.log(p === q);               // true  (same reference)
  ```

  ### کپی سطحی با spread: `{ ...obj }`
  برای ساختن یک شیء **واقعاً جدید** با همان propertyها، از **spread** (عملگر پخش؛ سه نقطه‌ی `...`) استفاده می‌کنیم. `{ ...obj }` یعنی «همه‌ی propertyهای `obj` را در این شیء تازه بریز». اسلاید ۴۸ (درس متدهای آرایه) دقیقاً از همین روش استفاده می‌کند.

  ```js
  const original = { name: "Ali", age: 20 };
  const copy = { ...original };   // a NEW object with the same properties
  copy.age = 30;
  console.log(original.age);      // 20 (unchanged)
  console.log(copy === original); // false
  ```

  **ترتیب مهم است:** propertyها از چپ به راست در شیء جدید ریخته می‌شوند و اگر کلیدی تکراری باشد، **آخری برنده است**:

  ```js
  const base = { name: "Ali", role: "user" };
  console.log({ ...base, role: "admin" }); // { name: 'Ali', role: 'admin' } -> role overridden
  console.log({ role: "admin", ...base }); // { role: 'user', name: 'Ali' } -> base wins
  ```

  **«سطحی» (shallow) یعنی چه؟** spread فقط **سطح اول** را کپی می‌کند. اگر مقدار یک property خودش یک شیء باشد، فقط **reference** آن کپی می‌شود و آن شیء داخلی بین نسخه‌ی اصلی و کپی **مشترک** می‌ماند:

  ```js
  const user = { name: "Ali", address: { city: "Tehran" } };
  const copy = { ...user };
  copy.name = "Reza";             // top level: only the copy changes
  copy.address.city = "Shiraz";   // nested object: SHARED by both
  console.log(user.name);         // "Ali"
  console.log(user.address.city); // "Shiraz"
  ```

  ### شیءها و JSON
  اسلاید ۴۱ می‌گوید object literal «پایه‌ی ساختار JSON» است. JSON شبیه object literal است ولی سخت‌گیرتر: کلیدها و رشته‌ها **حتماً** داخل دابل‌کوتیشن‌اند و تابع (متد) در آن جایی ندارد. با `JSON.stringify` یک شیء را به متن JSON تبدیل می‌کنیم:

  ```js
  const user = { name: "Barry Allen", age: 24, greet() {} };
  console.log(JSON.stringify(user)); // {"name":"Barry Allen","age":24} -> the method is dropped
  ```

  ::: tip نکته
  - property یعنی مقدارِ داده‌ای و method یعنی مقدارِ تابعی. `greet() {}` کوتاه‌شده‌ی `greet: function () {}` است.
  - کلیدی که فاصله یا خط تیره دارد یا با رقم شروع می‌شود، فقط با براکت و کوتیشن خوانده می‌شود: `obj["first-name"]`.
  - خواندن کلیدِ ناموجود `undefined` می‌دهد، ولی خواندن property از `undefined` یا `null` خطای `TypeError` می‌دهد؛ `?.` جلوی این خطا را می‌گیرد.
  - `Object.keys`، `Object.values` و `Object.entries` همیشه آرایه برمی‌گردانند.
  - `in` کلیدهای ارث‌برده (مثل `toString`) را هم می‌بیند؛ `hasOwnProperty` فقط کلیدهای خودِ شیء را.
  :::

  ::: trap دام‌های تستی شیءها
  - `obj.key` دنبال کلیدی به نام `"key"` می‌گردد؛ برای کلیدی که نامش در متغیر `key` است بنویس `obj[key]`.
  - `obj[1]` و `obj["1"]` یک خانه‌اند، چون کلیدها رشته‌اند.
  - `{} === {}` و `{ a: 1 } === { a: 1 }` هر دو `false` هستند؛ شیءها با reference مقایسه می‌شوند.
  - `const b = a` کپی نمی‌سازد؛ تغییر `b.x` همان `a.x` را عوض می‌کند. کپی با `{ ...a }` ساخته می‌شود، ولی شیءهای تودرتو در آن هنوز مشترک‌اند.
  - شیءِ `const` را می‌توان تغییر داد (`user.age = 25`)، ولی نمی‌توان متغیر را به شیء دیگری وصل کرد (`user = {}` خطای `TypeError` می‌دهد).
  - در `{ ...base, role: "admin" }` نتیجه `"admin"` است، ولی در `{ role: "admin", ...base }` مقدار `base.role` برنده است.
  - رشته‌ها property دارند (`"hi".length`) ولی شیء نیستند: `typeof "hi"` برابر `"string"` است.
  :::

  ::: summary
  - شیء = مجموعه‌ای از جفت‌های کلید-مقدار که داده (property) و رفتار (method) را کنار هم نگه می‌دارد.
  - object literal: `{ key: value, method() { ... } }`؛ کلیدها رشته یا Symbol، مقدارها هر نوعی (حتی شیء و آرایه‌ی تودرتو).
  - دسترسی: `obj.key` برای نام‌های ثابت و معمولی، `obj[expr]` برای کلیدهای پویا یا عجیب.
  - شیءها تغییرپذیرند و با reference کپی و مقایسه می‌شوند؛ کپی سطحی با `{ ...obj }`.
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۴۰، در یک شیء به مقدارهایی که **تابع** هستند و به مقدارهایی که **داده** هستند، به ترتیب چه می‌گوییم؟
    options:
      - key و value
      - property و method
      - method و property
      - literal و JSON
    answer: 3
    explain: |
      اسلاید ۴۰: «Values can be data (properties) or functions (methods)»؛ پس مقدار تابعی **method** و مقدار داده‌ای **property** نام دارد. گزینه‌ی ۲ همین دو را برعکس گفته است. key و value (گزینه‌ی ۱) دو بخشِ **هر** جفت‌اند (نام خانه و محتوای آن)، نه دو نوع مقدار. literal یعنی «نوشتن مستقیم شیء با آکولاد» و JSON یک قالب متنی برای ذخیره‌ی داده است (گزینه‌ی ۴).

