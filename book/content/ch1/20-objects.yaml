      کلیدی که خط تیره دارد فقط با براکت و کوتیشن خوانده می‌شود: `person["first-name"]`. در گزینه‌ی ۱، JavaScript عبارت را `person.first - name` می‌فهمد (یک تفریق!)؛ چون متغیری به نام `name` نداریم، در Node.js خطای `ReferenceError` می‌گیریم. گزینه‌ی ۲ دنبال کلید دیگری (`first_name`) می‌گردد و `undefined` می‌دهد. در گزینه‌ی ۴ کوتیشن نیست، پس داخل براکت عبارتِ `first - name` حساب می‌شود و چون متغیر `first` وجود ندارد، `ReferenceError` رخ می‌دهد.

