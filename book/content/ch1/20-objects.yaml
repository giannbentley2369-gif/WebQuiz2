      `greet` با `user.greet()` صدا زده شده، پس داخل آن `this` همان شیءِ قبل از نقطه یعنی `user` است و `this.name` برابر `"Barry Allen"` می‌شود. گزینه‌ی ۱ فرض کرده `this` به شیء اشاره نمی‌کند، که فقط وقتی متد **بدون** شیءِ قبل از نقطه صدا زده شود پیش می‌آید. گزینه‌ی ۲ فراموش کرده رشته با backtick نوشته شده و `${...}` در آن جایگزین می‌شود. `ReferenceError` هم رخ نمی‌دهد چون `name` با `this.name` خوانده شده، نه به‌عنوان یک متغیر.

