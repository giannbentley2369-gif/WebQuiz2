      - کلیدها می‌توانند از هر نوعی (مثلاً عدد یا شیء) باشند و نوعشان حفظ می‌شود، ولی مقدارها فقط عدد یا رشته‌اند.
      - یک شیء نمی‌تواند شیء، آرایه یا تابع دیگری را به‌عنوان مقدار نگه دارد.
      - JSON یک نوع داده‌ی primitive است که در JavaScript جای شیء را گرفته است.
    answer: 1
    explain: |
      اسلاید ۴۱: «Keys are strings (or symbols), values any type» و «Support methods and nested objects». گزینه‌ی ۲ برعکس است: مقدارها هر نوعی می‌توانند باشند و کلیدِ عددی یا شیء به **رشته** تبدیل می‌شود (نوعش حفظ نمی‌شود). گزینه‌ی ۳ با «nested objects» و متدها در تضاد است. JSON هم نوع داده نیست؛ یک قالب **متنی** برای ذخیره و تبادل داده‌های شیء است (اسلاید ۴۰).

