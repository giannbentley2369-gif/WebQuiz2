      `const b = a` شیء تازه‌ای نمی‌سازد و فقط **reference** (نشانی) همان شیء را کپی می‌کند؛ پس `b.x = 5` همان شیئی را عوض می‌کند که `a` به آن اشاره دارد و `a.x` می‌شود `5`. اما `c` یک شیء **جداگانه** است (هرچند محتوای اولیه‌اش یکی بود) و `1` می‌ماند. `===` برای شیءها فقط می‌پرسد «همان یک شیء‌اند؟»: `a === b` درست و `a === c` نادرست است. گزینه‌ی ۱ کپی را مستقل فرض کرده و گزینه‌ی ۲ شیءها را با محتوا مقایسه کرده است.

