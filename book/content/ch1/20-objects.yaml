      const user = { name: "Barry", address: { city: "Central City" } };
      console.log(user.address.city);
      console.log(user.phone);
      console.log(user.address.zip);
      console.log(user.job.title);
      console.log(user.job?.title);
    options:
      - line: 3
      - line: 4
      - line: 5
      - line: 0
    answer: 3
    explain: |
      خواندن کلیدِ ناموجود خطا نمی‌دهد: `user.phone` (خط ۳) و `user.address.zip` (خط ۴) فقط `undefined` می‌دهند. اما در خط ۵، `user.job` برابر `undefined` است و خواندن `title` از `undefined` خطای `TypeError: Cannot read properties of undefined (reading 'title')` می‌دهد و برنامه همان‌جا می‌ایستد. خط ۶ با `?.` امن نوشته شده و به‌تنهایی `undefined` می‌داد، ولی اصلاً به آن نمی‌رسیم.

  - level: medium
