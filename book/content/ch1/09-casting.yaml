id: ch1-casting
title: "تبدیل نوع صریح (Casting)"
slides: "Introduction to JS، اسلاید ۲۰"
lesson: |
  فرض کن از سفر برگشته‌ای و چند اسکناس دلار در جیبت داری، اما مغازه‌ی سر کوچه فقط ریال قبول می‌کند. چه می‌کنی؟ به صرافی می‌روی و **خودت صریحاً** می‌گویی: «لطفاً این را به ریال تبدیل کن». در برنامه‌نویسی هم همین اتفاق زیاد می‌افتد: مقداری داریم که از یک نوع است (مثلاً رشته‌ی `"42"` که کاربر در یک فرم تایپ کرده)، ولی برای کارمان نوع دیگری لازم داریم (عدد `42` تا بتوانیم با آن حساب کنیم).

  ### Casting چیست؟
  طبق اسلاید ۲۰، **casting** (تبدیل نوع؛ یعنی تبدیل یک مقدار از یک نوع داده به نوعی دیگر) در JavaScript دو شکل دارد:

  1. **Explicit casting** (تبدیل صریح): خودمان با صدا زدن توابع `Number()`، `String()` و `Boolean()` درخواست تبدیل می‌کنیم؛ درست مثل رفتن به صرافی.
  2. **Implicit casting** یا **type coercion** (تبدیل ضمنی یا خودکار): خود JavaScript وسط یک عملیات، بدون اینکه ما چیزی بخواهیم، نوع را عوض می‌کند. این موضوعِ درس بعد است و اینجا فقط پیش‌نمایشش را می‌بینیم.

  کد اسلاید ۲۰:

  ```js
  // Explicit casting: we ask for the conversion ourselves
  console.log(Number("42")); // 42   (string -> number)
  console.log(String(99));   // "99" (number -> string)
  console.log(Boolean(1));   // true (number -> boolean)

  // Implicit casting (type coercion): JavaScript converts on its own
  console.log("5" + 1);      // "51"
  console.log(2 * "3");      // 6
  ```

  ::: note قرارداد این کتاب درباره‌ی گیومه‌ها
  `console.log` رشته‌ها را **بدون** گیومه چاپ می‌کند؛ یعنی `console.log(String(99))` در کنسول فقط `99` نشان می‌دهد. ما در توضیحِ کنار کد (comment) رشته‌ها را داخل گیومه می‌نویسیم (`"99"`) تا معلوم باشد نتیجه رشته است، نه عدد. در گزینه‌های تست‌های «خروجی کد» دقیقاً همان چیزی آمده که کنسول چاپ می‌کند.
  :::

  #### فعالیت کلاسی اسلاید ۲۰: حاصل `"5" - 1` چیست؟
  جواب: عدد `4`. عملگر `-` برای رشته‌ها هیچ معنایی ندارد (چیزی به اسم «تفریق رشته» نداریم)، پس JavaScript رشته‌ی `"5"` را به عدد `5` تبدیل می‌کند و `5 - 1` می‌شود `4`. در مقابل، `+` برای رشته‌ها معنا دارد (چسباندن یا concatenation)، برای همین `"5" + 1` می‌شود `"51"`. جزئیات این رفتار را در درس بعد (Type coercion) می‌خوانیم.

  ```js
  console.log("5" - 1);          // 4 (a number)
  console.log(typeof ("5" - 1)); // "number"
  console.log("5" + 1);          // "51" (a string)
  ```

  ### تبدیل به عدد: `Number(x)`
  `Number` تبدیل‌کننده‌ای **سخت‌گیر** است: یا **کل** رشته یک عدد معتبر است، یا نتیجه `NaN` (Not a Number؛ یعنی «عدد معتبری نیست») می‌شود. جدول زیر را با دقت بخوان؛ بیشتر تست‌ها از همین‌جا طرح می‌شوند:

  | مقدار ورودی | `Number(...)` | چرا؟ |
  |---|---|---|
  | `"42"` | `42` | رشته‌ی عددی معتبر |
  | `"3.14"` | `3.14` | عدد اعشاری هم قبول است |
  | `"  12  "` | `12` | فاصله‌های ابتدا و انتها نادیده گرفته می‌شوند |
  | `""` و `" "` | `0` | رشته‌ی خالی (یا فقط فاصله) صفر حساب می‌شود |
  | `"12px"` | `NaN` | حتی یک کاراکتر غیرعددی کل تبدیل را خراب می‌کند |
  | `"abc"` | `NaN` | اصلاً عدد نیست |
  | `true` / `false` | `1` / `0` | |
  | `null` | `0` | «هیچ» به صفر تبدیل می‌شود |
  | `undefined` | `NaN` | «تعریف‌نشده» عدد معتبری ندارد |
  | `[]` | `0` | آرایه‌ی خالی ← رشته‌ی `""` ← `0` |
  | `[5]` | `5` | ← رشته‌ی `"5"` ← `5` |
  | `[1, 2]` | `NaN` | ← رشته‌ی `"1,2"` ← `NaN` (ویرگول جزو عدد نیست) |
  | `{}` | `NaN` | ← رشته‌ی `"[object Object]"` ← `NaN` |

  آرایه‌ها و شیءها (object) مستقیم به عدد تبدیل نمی‌شوند: **اول به رشته** تبدیل می‌شوند و بعد آن رشته به عدد. آرایه به رشته‌ای تبدیل می‌شود که عناصرش با ویرگول به هم چسبیده‌اند و هر شیء ساده به `"[object Object]"`.

  ```js
  console.log(Number(""));        // 0
  console.log(Number("  12  "));  // 12
  console.log(Number("12px"));    // NaN
  console.log(Number(null));      // 0
  console.log(Number(undefined)); // NaN
  console.log(Number(true));      // 1
  console.log(Number([]));        // 0
  console.log(Number([5]));       // 5
  console.log(Number([1, 2]));    // NaN
  console.log(Number({}));        // NaN
  ```

  ### `parseInt` و `parseFloat`: خواندن از ابتدای رشته
  این دو تابع **آسان‌گیر**ند: رشته را از سمت چپ کاراکتربه‌کاراکتر می‌خوانند، به **اولین کاراکتر نامعتبر** که برسند می‌ایستند و هر چه تا آنجا خوانده‌اند را برمی‌گردانند. اگر همان کاراکتر اول نامعتبر باشد، نتیجه `NaN` است.

  - `parseInt` (parse integer؛ یعنی «عدد صحیح را بخوان») فقط رقم می‌خواند و به نقطه‌ی اعشار که برسد می‌ایستد؛ پس بخش اعشاری را **دور می‌ریزد** و گرد نمی‌کند!
  - `parseFloat` (یعنی «عدد اعشاری را بخوان») اولین نقطه‌ی اعشار را هم می‌پذیرد.

  ```js
  console.log(parseInt("12px"));    // 12   (stops at "p")
  console.log(parseInt("3.9"));     // 3    (stops at "."; no rounding!)
  console.log(parseFloat("3.9kg")); // 3.9  (stops at "k")
  console.log(parseInt("abc"));     // NaN  (the first character is already invalid)
  console.log(parseInt("px12"));    // NaN  (it must START with a number)
  console.log(parseInt("  42  "));  // 42   (leading spaces are skipped)
  console.log(parseInt(""));        // NaN  (but Number("") is 0!)
  ```

  مقایسه‌ی سه تابع (این جدول را حفظ کن):

  | ورودی | `Number` | `parseInt` | `parseFloat` |
  |---|---|---|---|
  | `"42"` | `42` | `42` | `42` |
  | `"3.9"` | `3.9` | `3` | `3.9` |
  | `"12px"` | `NaN` | `12` | `12` |
  | `"3.9kg"` | `NaN` | `3` | `3.9` |
  | `""` | `0` | `NaN` | `NaN` |
  | `"abc"` | `NaN` | `NaN` | `NaN` |

  ::: info بیشتر بدانیم
  `parseInt` یک ورودی دوم اختیاری هم دارد به نام **radix** (مبنای عدد): `parseInt("ff", 16)` برابر `255` و `parseInt("101", 2)` برابر `5` است. در کدهای واقعی معمولاً برای اطمینان می‌نویسند `parseInt(text, 10)`.
  :::

  ### تبدیل به رشته: `String(x)` و `toString()`
  تبدیل به رشته ساده‌ترین تبدیل است: تقریباً هر مقدار همان‌طور که «دیده می‌شود» به متن تبدیل می‌شود.

  ```js
  console.log(String(99));        // "99"
  console.log(String(true));      // "true"
  console.log(String(null));      // "null"
  console.log(String(undefined)); // "undefined"
  console.log(String([1, 2]));    // "1,2"  (elements joined with commas)
  console.log(String([]));        // ""     (an empty string)
  console.log(String({}));        // "[object Object]"
  console.log((123).toString());  // "123"
  ```

  راه دوم، متد `toString()` است که روی خود مقدار صدا زده می‌شود: `(123).toString()` یا `n.toString()`. دو نکته درباره‌اش:

  - روی `null` و `undefined` **کار نمی‌کند** و خطای `TypeError` می‌دهد (مثلاً `null.toString()`)؛ اما `String(null)` بی‌خطر است و `"null"` می‌دهد.
  - برای عددی که مستقیم در کد نوشته شده، پرانتز لازم است: `(123).toString()`. اگر بنویسی `123.toString()`، JavaScript نقطه را نقطه‌ی اعشارِ عدد فرض می‌کند و خطای نحوی (SyntaxError) می‌دهد. روی یک متغیر مشکلی نیست: `n.toString()`.

  ### تبدیل به boolean: `Boolean(x)`، مقدارهای truthy و falsy
  در JavaScript فقط **۸ مقدار** هنگام تبدیل به boolean، `false` می‌شوند. به این‌ها **falsy** (شبه‌نادرست) می‌گوییم:

  `false`، `0`، `-0`، `0n` (صفرِ BigInt)، `""` (رشته‌ی خالی)، `null`، `undefined`، `NaN`

  **هر** مقدار دیگری **truthy** (شبه‌درست) است و `true` می‌شود؛ حتی این‌ها که ظاهرشان گول‌زننده است: `"0"`، `"false"`، `" "` (رشته‌ای که فقط یک فاصله دارد)، `[]` (آرایه‌ی خالی)، `{}` (شیء خالی)، `-1` و `Infinity`.

  ::: analogy
  falsyها را مثل یک «لیست سیاه» ۸ نفره دمِ در یک مهمانی تصور کن: نگهبان فقط همین ۸ نفر را راه نمی‌دهد و بقیه، با هر ظاهری، وارد می‌شوند. رشته‌ی `"0"` شبیه عدد `0` است، ولی اسمش در لیست سیاه نیست؛ یک رشته‌ی غیرخالی است، پس truthy است.
  :::

  ```js
  console.log(Boolean(1));       // true  (slide 20)
  console.log(Boolean(0));       // false
  console.log(Boolean(""));      // false (empty string)
  console.log(Boolean(" "));     // true  (a space is a character!)
  console.log(Boolean("0"));     // true  (non-empty string)
  console.log(Boolean("false")); // true  (non-empty string)
  console.log(Boolean([]));      // true  (every array/object is truthy)
  console.log(Boolean({}));      // true
  console.log(Boolean(null));    // false
  console.log(Boolean(NaN));     // false
  ```

  این همان تبدیلی است که شرط `if` پشت پرده انجام می‌دهد: `if (x)` یعنی «اگر `x` truthy است». (درباره‌ی `if` در درس «دستورهای شرطی» مفصل می‌خوانیم.)

  ### میان‌برها: `+x`، `!!x` و `x + ""`
  برنامه‌نویس‌های JavaScript اغلب به جای نوشتن نام تابع از این میان‌برها استفاده می‌کنند و تو باید بتوانی آن‌ها را بخوانی:

  | میان‌بر | معادل | مثال |
  |---|---|---|
  | `+x` (unary plus؛ علامت مثبتِ تک‌عملوندی) | `Number(x)` | `+"42"` ← `42`، `+""` ← `0`، `+true` ← `1`، `+"3.5px"` ← `NaN` |
  | `!!x` (دو بار نقیض) | `Boolean(x)` | `!!"hello"` ← `true`، `!!0` ← `false` |
  | `x + ""` | `String(x)` | `5 + ""` ← `"5"` |

  `!!x` چطور کار می‌کند؟ عملگر `!` (NOT) مقدار را به boolean تبدیل و برعکس می‌کند؛ `!` دوم دوباره برعکسش می‌کند. پس `!!"hello"` یعنی `!false`، یعنی `true`.

  ```js
  console.log(+"42", +"", +true, +"3.5px"); // 42 0 1 NaN
  console.log(!!"hello", !!0, !!"0");       // true false true
  console.log(5 + "", typeof (5 + ""));     // "5" "string"
  ```

  ### `NaN`: «عدد نیست»ی که نوعش number است!
  `NaN` (کوتاه‌شده‌ی Not a Number) نتیجه‌ی یک تبدیل یا محاسبه‌ی عددیِ **شکست‌خورده** است: `Number("abc")`، `0 / 0`، `"abc" * 2` یا `undefined + 1`. سه ویژگی عجیب دارد:

  1. `typeof NaN` برابر `"number"` است! `NaN` یک مقدار خاص از نوع number است که معنایش «عدد نامعتبر» است.
  2. **مسری** است: هر محاسبه‌ی ریاضی با `NaN` نتیجه‌اش `NaN` است (`NaN + 1` ← `NaN`).
  3. با **هیچ** چیز، حتی خودش، برابر نیست: `NaN === NaN` برابر `false` است (در درس «عملگرهای مقایسه و منطقی» بیشتر می‌بینیم). پس برای تشخیصش نمی‌توان از `===` کمک گرفت.

  برای تشخیص `NaN` دو تابع داریم که فرق مهمی با هم دارند:

  - `isNaN(x)` (تابع قدیمی و سراسری): **اول** `x` را با `Number` به عدد تبدیل می‌کند و **بعد** می‌پرسد «نتیجه `NaN` است؟». پس `isNaN("abc")` برابر `true` است، چون `"abc"` به `NaN` تبدیل می‌شود.
  - `Number.isNaN(x)` (از ES6): **هیچ تبدیلی** انجام نمی‌دهد و فقط وقتی `true` می‌دهد که `x` واقعاً خودِ مقدار `NaN` باشد. پس `Number.isNaN("abc")` برابر `false` است؛ `"abc"` یک رشته است، نه `NaN`.

  ```js
  console.log(typeof NaN);          // "number"
  console.log(isNaN("abc"));        // true  ("abc" -> NaN)
  console.log(Number.isNaN("abc")); // false (a string is not the NaN value)
  console.log(isNaN(""));           // false ("" -> 0)
  console.log(isNaN(undefined));    // true  (undefined -> NaN)
  console.log(Number.isNaN(NaN));   // true
  console.log(Number.isNaN(0 / 0)); // true
  ```

  ::: tip
  هر چیزی که از ورودی کاربر می‌آید (مقدار یک فیلد فرم یا جواب `prompt`) **رشته** است. قبل از محاسبه صریحاً تبدیلش کن: اگر کل ورودی باید عدد باشد `Number(input)`، و اگر عدد در ابتدای متن آمده (مثل `"12px"`) `parseInt`/`parseFloat`. برای تشخیص `NaN` هم همیشه `Number.isNaN` را ترجیح بده.
  :::

  ::: trap
  - `Number("")` برابر `0` است، ولی `parseInt("")` برابر `NaN`.
  - `parseInt("3.9")` برابر `3` است، نه `4` (گرد نمی‌کند، فقط می‌بُرد).
  - `Boolean("0")` و `Boolean("false")` هر دو `true` هستند (رشته‌ی غیرخالی)، ولی `Boolean("")` برابر `false` است.
  - `Number(" ")` برابر `0` است، ولی `Boolean(" ")` برابر `true`.
  - `typeof NaN` برابر `"number"` است، نه `"NaN"`.
  - `isNaN("abc")` برابر `true` است، ولی `Number.isNaN("abc")` برابر `false`.
  - `String(null)` می‌شود `"null"`، اما `null.toString()` خطای `TypeError` می‌دهد.
  :::

  ::: info بیشتر بدانیم
  `Number`، `String` و `Boolean` را برای تبدیل همیشه **بدون** `new` صدا بزن. `new Number(5)` یک شیء «پوشاننده» (wrapper object) می‌سازد که `typeof` آن `"object"` است، نه `"number"`.
  :::

  ::: summary
  | تبدیل | تابع صریح | میان‌بر | نکته‌ی کلیدی |
  |---|---|---|---|
  | به عدد | `Number(x)` | `+x` | سخت‌گیر: `"12px"` ← `NaN`؛ `""`، `null` و `[]` ← `0`؛ `undefined` ← `NaN` |
  | به عدد (از ابتدای متن) | `parseInt` / `parseFloat` | — | تا اولین کاراکتر نامعتبر می‌خواند؛ `""` ← `NaN` |
  | به رشته | `String(x)` | `x + ""` | `[1, 2]` ← `"1,2"`؛ `{}` ← `"[object Object]"` |
  | به boolean | `Boolean(x)` | `!!x` | فقط ۸ مقدار falsy داریم؛ بقیه truthy‌اند |
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۲۰، **casting** در JavaScript به چه معناست؟
    options:
      - ذخیره کردن یک مقدار در یک متغیر تازه
      - تبدیل یک مقدار از یک نوع داده به نوعی دیگر
      - بررسی نوع یک مقدار با عملگر `typeof`
      - چاپ یک مقدار در کنسول با `console.log`
    answer: 2
    explain: |
      Casting یعنی تبدیل نوع یک مقدار، مثل `Number("42")` که رشته را به عدد `42` تبدیل می‌کند. ذخیره در متغیر (گزینه‌ی ۱) فقط انتساب است و نوع را عوض نمی‌کند؛ `typeof` (گزینه‌ی ۳) فقط نوع را **گزارش** می‌کند و چیزی را تبدیل نمی‌کند؛ `console.log` (گزینه‌ی ۴) هم فقط مقدار را نمایش می‌دهد.

  - level: easy
    stem: |
      کدام عبارت یک تبدیل نوع **صریح** (explicit casting) است؟
    options:
      - '`"5" + 1`'
      - '`2 * "3"`'
      - '`"5" - 1`'
      - '`String(99)`'
    answer: 4
    explain: |
      در تبدیل صریح، خود برنامه‌نویس با صدا زدن `Number()`، `String()` یا `Boolean()` تبدیل را درخواست می‌کند؛ `String(99)` عدد را صریحاً به رشته‌ی `"99"` تبدیل می‌کند. سه گزینه‌ی دیگر نمونه‌ی **تبدیل ضمنی** (type coercion) هستند: در آن‌ها JavaScript خودش وسط عملیات نوع را عوض می‌کند و به ترتیب `"51"`، `6` و `4` به دست می‌آید.

  - level: easy
    stem: |
      حاصل `Number("42")` کدام است؟
    check: value
    expr: 'Number("42")'
    options:
      - value: '"42"'
      - value: 'NaN'
      - value: '42'
      - value: 'undefined'
    answer: 3
    explain: |
      `Number` رشته‌ی عددیِ معتبر `"42"` را به **عدد** `42` تبدیل می‌کند (مثال اسلاید ۲۰). گزینه‌ی ۱ همان رشته‌ی ورودی است و تبدیلی در آن رخ نداده؛ `NaN` (گزینه‌ی ۲) فقط وقتی به دست می‌آید که رشته عدد معتبری نباشد، مثل `"42px"`؛ و `undefined` (گزینه‌ی ۴) هیچ ربطی به این تبدیل ندارد.

  - level: easy
    stem: |
      فعالیت کلاسی اسلاید ۲۰: حاصل `"5" - 1` کدام است؟
    check: value
    expr: '"5" - 1'
    options:
      - value: '4'
      - value: '"51"'
      - value: '"4"'
      - value: 'NaN'
    answer: 1
