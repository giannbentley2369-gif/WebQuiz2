    answer: 3
    explain: |
      خط اول از چپ به راست حساب می‌شود: `"Sum: " + 2` رشته‌ی `"Sum: 2"` می‌شود و بعد `+ 3` آن را به `"Sum: 23"` می‌رساند. در خط دوم `a + b` داخل `${}` اول به‌صورت **عددی** حساب می‌شود (`5`) و بعد در متن قرار می‌گیرد. در خط سوم پرانتز باعث می‌شود جمع عددی اول انجام شود: `"Sum: 5"`. گزینه‌ی ۱ دام خط اول را ندیده و گزینه‌های ۲ و ۴ جاسازی یا پرانتز را بی‌اثر فرض کرده‌اند.

  - level: hard
