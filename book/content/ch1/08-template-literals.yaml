      - out: "!! ReferenceError"
    answer: 2
    explain: |
      `city` تعریف شده ولی مقدار ندارد، پس `undefined` است؛ `${}` آن را به رشته‌ی `"undefined"` تبدیل می‌کند و `null` و `false` هم به `"null"` و `"false"`. template literal مقدارهای «خالی» را حذف نمی‌کند (رد گزینه‌ی ۱) و `null` را با `undefined` یکی نمی‌کند (رد گزینه‌ی ۳). `ReferenceError` فقط برای متغیر تعریف‌نشده است، در حالی که `city` با `let` تعریف شده است.

