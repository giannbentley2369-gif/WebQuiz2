    explain: |
      `` \` `` یک backtick معمولی داخل template literal می‌گذارد و رشته را نمی‌بندد (رد گزینه‌ی ۳). `\${` جاسازی را غیرفعال می‌کند و `${price}` عیناً چاپ می‌شود؛ چون `price` اصلاً خوانده نمی‌شود، `ReferenceError` هم رخ نمی‌دهد (رد گزینه‌ی ۲). `\"` هم یک دابل‌کوتیشن معمولی است. خود بک‌اسلش‌ها فقط علامت گریز هستند و چاپ نمی‌شوند (رد گزینه‌ی ۴).

