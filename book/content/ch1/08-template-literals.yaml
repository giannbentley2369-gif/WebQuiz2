id: ch1-template-literals
title: "رشته‌ها و Template literals"
slides: "Introduction to JS، اسلاید ۵۱"
lesson: |
  یک فرم کاغذی را تصور کن که جاهای خالی دارد: «سلام ____، شما ____ عدد ____ سفارش داده‌اید». کافی است جاهای خالی را پر کنی تا متن کامل شود. **template literal** (رشته‌ی الگو) در JavaScript دقیقاً همین فرم است: متن را می‌نویسی، جاهای خالی را با `${...}` مشخص می‌کنی و JavaScript خودش آن‌ها را با مقدار درست پر می‌کند. ولی قبل از آن، چند نکته‌ی پایه درباره‌ی رشته‌ها را مرور کنیم.

  ### رشته‌ها: مرور پایه

  **رشته (string)** یعنی متن؛ دنباله‌ای از کاراکترها داخل علامت نقل‌قول. سه راه برای نوشتنش داریم:

  - تک‌کوتیشن: `'Hello'`
  - دابل‌کوتیشن: `"Hello"`
  - backtick (بک‌تیک؛ کلید بالای Tab و سمت چپ عدد ۱ در حالت انگلیسی کیبورد): `` `Hello` ``

  تک‌کوتیشن و دابل‌کوتیشن هیچ فرقی با هم ندارند؛ فقط آن را انتخاب کن که با متنت تداخل نکند: `"It's fine"` یا `'He said "hi"'`. اگر همان علامتی که رشته را باز کرده داخل متن بیاید، رشته زودتر از موعد بسته می‌شود و `SyntaxError` می‌گیری؛ مثلاً `'It's broken'`.

  **کاراکترهای گریز (escape sequences):** با بک‌اسلش `\` می‌توانی کاراکترهای خاص را داخل رشته بنویسی:

  | دنباله | معنی |
  |---|---|
  | `\n` | رفتن به خط جدید (new line) |
  | `\t` | فاصله‌ی تب (tab) |
  | `\"` | دابل‌کوتیشن داخل رشته‌ی دابل‌کوتیشنی |
  | `\'` | تک‌کوتیشن داخل رشته‌ی تک‌کوتیشنی |
  | `\\` | خود بک‌اسلش |

  ```js
  const a = 'It\'s fine';     // escaped single quote
  const b = "She said \"hi\""; // escaped double quotes
  const c = "Line 1\nLine 2";  // \n starts a new line
  console.log(b);              // She said "hi"
  console.log(c);              // Line 1
                               // Line 2
  ```

  **طول و اندیس:** ویژگی `length` تعداد کاراکترها را می‌دهد و با `[i]` به کاراکتر شماره‌ی `i` (از ۰) می‌رسی. دقت کن که `\n` **یک** کاراکتر حساب می‌شود:

  ```js
  console.log("hello".length);        // 5
  console.log("".length);             // 0 (empty string)
  console.log("JavaScript"[4]);       // S (indices start at 0)
  console.log("Hello\nWorld".length); // 11 (5 + 1 + 5)
  ```

  **چسباندن با `+`:** اگر یک طرف `+` رشته باشد، دو طرف به هم چسبانده می‌شوند (concatenation یا الحاق): `"Hello, " + "Sara"` می‌شود `"Hello, Sara"`.

  **رشته‌ی معمولی چندخطی نمی‌شود:** اگر وسط `"..."` یا `'...'` کلید Enter بزنی، `SyntaxError` می‌گیری؛ برای خط جدید باید `\n` بنویسی.

  ### دردسرهای چسباندن با `+`

  ```js
  const name = "Sara";
  const age = 20;
  const text = "Name: " + name + ", next year: " + (age + 1) + "\n" + "Done!";
  ```

  این همه `+` و علامت نقل‌قول هم خواندن را سخت می‌کند و هم راه را برای اشتباه باز می‌گذارد: فاصله‌ها را فراموش می‌کنی، و اگر پرانتز `(age + 1)` را ننویسی، به‌جای جمع، چسباندن رخ می‌دهد:

  ```js
  console.log("Sum: " + 2 + 3);   // Sum: 23 (left to right: "Sum: 2" + 3)
  console.log("Sum: " + (2 + 3)); // Sum: 5
  ```

  ### Template literals (اسلاید ۵۱)

  - در **ES6** معرفی شدند و با **backtick** (`` ` ``) نوشته می‌شوند.
  - اجازه می‌دهند رشته‌ی **چندخطی** بنویسی، **بدون** نیاز به `\n`.
  - از **string interpolation** (جاسازی مقدار در رشته) با `${expression}` پشتیبانی می‌کنند؛ هر چیزی داخل `${ }` حساب می‌شود و نتیجه‌اش در متن قرار می‌گیرد.

  همان مثال بالا با template literal:

  ```js
  const text2 = `Name: ${name}, next year: ${age + 1}
  Done!`;
  console.log(text2); // Name: Sara, next year: 21
                      // Done!
  ```

  #### کد اسلاید ۵۱

  ```js title=templateliterals.js
  const product = "Laptop";
  const price = 1200;
  const quantity = 2;

  const message = `
  You ordered: ${quantity} × ${product}
  Total price: $${price * quantity}
  Thank you for shopping with us!
  `;

  console.log(message);
  ```

  خروجی این کد **پنج خط** است:

  | خط خروجی | متن چاپ‌شده |
  |---|---|
  | ۱ | (خالی) |
  | ۲ | `You ordered: 2 × Laptop` |
  | ۳ | `Total price: $2400` |
  | ۴ | `Thank you for shopping with us!` |
  | ۵ | (خالی) |

  بیا خط‌به‌خط ببینیم چرا:

  - **خط خالی اول:** بلافاصله بعد از backtick بازکننده Enter زده شده، پس رشته با یک `\n` **شروع** می‌شود.
  - **`${quantity}`** با `2` و **`${product}`** با `Laptop` جایگزین می‌شود. علامت `×` بین آن‌ها فقط یک **کاراکتر معمولی متن** (علامت ضرب) است، نه عملگر؛ عیناً چاپ می‌شود.
  - **`$${price * quantity}`:** `$` اول چون بعدش `{` نیامده، یک علامت دلار معمولی است. بعد از آن `${price * quantity}` می‌آید که حاصل `1200 * 2` یعنی `2400` را می‌گذارد؛ نتیجه: `$2400`.
  - **خط خالی آخر:** قبل از backtick بسته‌کننده هم Enter زده شده، پس رشته با یک `\n` **تمام** می‌شود.

  برای این‌که این خط‌های خالیِ اول و آخر را با چشم ببینی، پیام را بین دو علامت `|` چاپ کن:

  ```js
  console.log("|" + message + "|");
  ```

  ```text
  |
  You ordered: 2 × Laptop
  Total price: $2400
  Thank you for shopping with us!
  |
  ```

  ### هر «عبارتی» داخل `${}` مجاز است

  داخل `${}` می‌توانی هر **عبارت (expression)** بنویسی؛ یعنی هر تکه‌کدی که یک **مقدار** تولید می‌کند: محاسبه، صدا زدن تابع یا متد، مقایسه، یا عملگر سه‌تایی `شرط ? الف : ب` (اگر شرط درست بود «الف»، وگرنه «ب»):

  ```js
  const nm = "sara";
  function double(n) {
    return n * 2;
  }
  console.log(`Next year: ${age + 1}`);                    // Next year: 21
  console.log(`Status: ${age >= 18 ? "adult" : "minor"}`); // Status: adult
  console.log(`Name: ${nm.toUpperCase()}`);                // Name: SARA
  console.log(`Double: ${double(21)}`);                    // Double: 42
  ```

  ولی **دستورها (statements)** مثل `if`، `for` یا `let` مقدار تولید نمی‌کنند و داخل `${}` مجاز نیستند: `` `${if (x) { "yes" }}` `` خطای `SyntaxError` می‌دهد. به‌جای `if` از عملگر سه‌تایی استفاده کن.

  ### مقدارها چطور به متن تبدیل می‌شوند؟

  نتیجه‌ی هر `${}` به رشته تبدیل می‌شود و خود template literal همیشه یک **رشته‌ی معمولی** است (`typeof` آن `"string"` است):

  | مقدار داخل `${}` | چیزی که در متن قرار می‌گیرد |
  |---|---|
  | `2400` | `2400` |
  | `true` | `true` |
  | `null` | `null` |
  | `undefined` | `undefined` |
  | `[1, 2, 3]` | `1,2,3` (عضوها با کاما، بدون کروشه و فاصله) |
  | `[]` | هیچ (رشته‌ی خالی) |
  | `{ a: 1 }` | `[object Object]` |

  برای دیدن محتوای یک شیء داخل متن، از `JSON.stringify` استفاده کن (درس JSON): `` `${JSON.stringify({ a: 1 })}` `` می‌شود `{"a":1}`.

  ### فقط backtick، جاسازی می‌کند

  `${}` فقط داخل backtick معنا دارد. داخل تک‌کوتیشن یا دابل‌کوتیشن، همان حروف عیناً چاپ می‌شوند:

  ```js
  console.log(`Hello ${name}`); // Hello Sara
  console.log("Hello ${name}"); // Hello ${name}
  ```

  ### template literal تودرتو (nested)

  داخل `${}` می‌شود یک template literal دیگر نوشت:

  ```js
  const isOnline = true;
  const user = "Reza";
  console.log(`${user} is ${isOnline ? `online (${2 + 3} friends)` : "offline"}`);
  // Reza is online (5 friends)
  ```

  ### گریز (escape) داخل template literal

  ```js
  console.log(`Use \` to write a template`); // Use ` to write a template
  console.log(`Price: \${price}`);           // Price: ${price} (no interpolation)
  console.log(`a\nb`);                       // a and b on two lines (\n still works)
  ```

  ### فاصله‌ها و Enterها جزو رشته‌اند

  در template literal چندخطی، **هر** Enter و **هر** فاصله‌ی ابتدای خط جزو رشته است:

  ```js
  const text3 = `A
    B`;
  console.log(text3.length); // 5 ("A" + new line + 2 spaces + "B")
  ```

  ### مقایسه‌ی دو روش

  | | چسباندن با `+` | template literal |
  |---|---|---|
  | علامت | `'...'` یا `"..."` | `` `...` `` |
  | جاسازی مقدار | `"Hi " + name` | `` `Hi ${name}` `` |
  | چندخطی | فقط با `\n` | مستقیم با Enter |
  | محاسبه داخل متن | نیاز به پرانتز: `"Sum: " + (a + b)` | `` `Sum: ${a + b}` `` |

  ::: tip
  - هر وقت متغیر یا محاسبه‌ای داخل متن داری، template literal خواناتر و کم‌خطاتر از `+` است.
  - `$` معمولی (بدون `{` بعدش) فقط یک کاراکتر است؛ برای همین `$${price}` می‌شود علامت دلار و بعد قیمت.
  - برای نوشتن خود backtick یا `${` به‌صورت متن، از `` \` `` و `\${` استفاده کن.
  :::

  ::: trap
  - `"Hello ${name}"` (با دابل‌کوتیشن) جاسازی **نمی‌کند** و عیناً `Hello ${name}` چاپ می‌کند.
  - `"Sum: " + 2 + 3` برابر `"Sum: 23"` است، ولی `` `Sum: ${2 + 3}` `` برابر `"Sum: 5"`.
  - آرایه داخل `${}` به شکل `1,2,3` و شیء به شکل `[object Object]` درمی‌آید.
  - خروجی کد اسلاید ۵۱ یک خط خالی در **ابتدا** و یک خط خالی در **انتها** دارد، چون رشته با Enter شروع و تمام شده است.
  - `\n` یک کاراکتر است: `"Hello\nWorld".length` برابر `11` است، نه `12`.
  - داخل `${}` فقط **عبارت** مجاز است؛ `if` و `for` خطای `SyntaxError` می‌دهند.
  :::

  ::: summary
  - رشته‌ها با `'...'`، `"..."` یا backtick نوشته می‌شوند؛ کاراکترهای خاص با `\` (مثل `\n`، `\"`، `` \` ``).
  - template literal (ES6، با backtick): چندخطی بدون `\n` و جاسازی با `${expression}`.
  - داخل `${}` هر عبارتی مجاز است (محاسبه، تابع، سه‌تایی، حتی template دیگر)، ولی دستور نه. نتیجه همیشه به رشته تبدیل می‌شود.
  - در کد اسلاید ۵۱، `$${price * quantity}` می‌شود `$2400` و خروجی با یک خط خالی شروع و تمام می‌شود.
  :::
questions:
  - level: easy
    stem: |
      template literal با کدام علامت نوشته می‌شود؟
    options:
      - '`''`'
      - '`"`'
      - '`` ` ``'
      - '`$`'
    answer: 3
    explain: |
      طبق اسلاید ۵۱، template literalها با **backtick** نوشته می‌شوند. تک‌کوتیشن و دابل‌کوتیشن رشته‌ی معمولی می‌سازند که نه جاسازی `${}` دارد و نه چندخطی مستقیم. علامت `$` فقط بخشی از `${...}` داخل template literal است و رشته را باز یا بسته نمی‌کند.

  - level: easy
    stem: |
      template literalها در کدام نسخه‌ی ECMAScript به JavaScript اضافه شدند؟
    options:
      - 'ES5 (سال ۲۰۰۹)'
      - 'ES6 یا همان ES2015'
      - 'ES1 (سال ۱۹۹۷)'
      - 'ES2020'
    answer: 2
    explain: |
      اسلاید ۵۱ می‌گوید template literalها در **ES6** (که نام دیگرش ES2015 است) معرفی شدند؛ همان نسخه‌ای که بزرگ‌ترین به‌روزرسانی زبان بود و `let`، `const` و توابع arrow را هم آورد. ES1 اولین استاندارد بود، ES5 هنوز template literal نداشت و ES2020 خیلی بعدتر آمد (مثلاً BigInt را اضافه کرد).

  - level: easy
    stem: |
      کدام مورد از ویژگی‌های template literal که در اسلاید ۵۱ آمده **نیست**؟
    options:
      - 'نوشتن رشته‌ی چندخطی بدون نیاز به `\n`'
      - 'جاسازی (interpolation) مقدار عبارت‌ها با `${expression}`'
      - 'نوشته شدن بین دو backtick'
      - 'تبدیل خودکار رشته به عدد'
    answer: 4
    explain: |
      اسلاید ۵۱ سه ویژگی را می‌گوید: با backtick نوشته می‌شود (ES6)، رشته‌ی چندخطی بدون `\n` را ممکن می‌کند و از جاسازی با `${expression}` پشتیبانی می‌کند. template literal همیشه یک **رشته** می‌سازد و کاری با تبدیل رشته به عدد ندارد؛ برعکس، مقدار داخل `${}` را به رشته تبدیل می‌کند.

  - level: easy
    stem: |
      حاصل ``typeof `Hello ${1 + 1}` `` چیست؟
    check: value
    expr: 'typeof `Hello ${1 + 1}`'
    options:
      - '`"template"`'
      - '`"object"`'
      - '`"number"`'
      - '`"string"`'
    answer: 4
    explain: |
      template literal فقط **روش دیگری برای نوشتن رشته** است و نتیجه‌اش یک رشته‌ی معمولی (`"Hello 2"`) است؛ پس `typeof` آن `"string"` است. نوع جداگانه‌ای به نام `"template"` وجود ندارد، template literal یک object نیست و با این‌که داخلش محاسبه‌ی عددی انجام شده، نتیجه‌ی نهایی رشته است، نه عدد.

  - level: easy
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const name = "Sara";
      console.log(`Hello, ${name}!`);
      console.log("Hello, ${name}!");
    options:
      - out: ["Hello, Sara!", "Hello, ${name}!"]
      - out: ["Hello, Sara!", "Hello, Sara!"]
      - out: ["Hello, ${name}!", "Hello, Sara!"]
      - out: ["Hello, Sara!", "!! SyntaxError"]
    answer: 1
    explain: |
      جاسازی با `${}` فقط داخل **backtick** انجام می‌شود؛ پس خط اول `Hello, Sara!` چاپ می‌کند. در خط دوم رشته با دابل‌کوتیشن نوشته شده و `${name}` فقط چند کاراکتر معمولی است که عیناً چاپ می‌شود. این خط خطا هم نمی‌دهد (رد گزینه‌ی ۴)؛ یک رشته‌ی کاملاً معتبر است.

  - level: easy
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const a = 5;
      const b = 10;
      console.log(`${a} + ${b} = ${a + b}`);
    options:
      - out: "5 + 10 = 15"
      - out: "${a} + ${b} = ${a + b}"
      - out: "5 + 10 = 510"
      - out: "a + b = 15"
    answer: 1
    explain: |
      هر `${}` جداگانه حساب می‌شود: `${a}` می‌شود `5`، `${b}` می‌شود `10` و `${a + b}` جمع **عددی** دو عدد یعنی `15` است. علامت `+` و `=` که بیرون از `${}` نوشته شده‌اند فقط متن هستند. گزینه‌ی ۳ فکر کرده جمع داخل `${}` به‌صورت رشته‌ای انجام می‌شود، در حالی که `a` و `b` عددند و تبدیل به رشته فقط **بعد از** محاسبه رخ می‌دهد.

  - level: medium
    stem: |
      حاصل `"Hello\nWorld".length` چیست؟
    check: value
    expr: '"Hello\nWorld".length'
    options:
      - '`12`'
      - '`10`'
      - '`13`'
      - '`11`'
    answer: 4
    explain: |
      `\n` با این‌که با دو علامت نوشته می‌شود، **یک** کاراکتر (خط جدید) است: ۵ حرف `Hello` + ۱ کاراکتر خط جدید + ۵ حرف `World` = ۱۱. گزینه‌ی ۱ بک‌اسلش و `n` را دو کاراکتر شمرده و گزینه‌ی ۲ خط جدید را اصلاً نشمرده است.

  - level: medium
    stem: |
      اجرای کدام قطعه‌کد **خطا** می‌دهد؟
    check: option-throws
    errorName: SyntaxError
    options:
      - code: 'const c = ''It''s broken'';'
      - code: 'const a = "It''s fine";'
      - code: 'const b = ''He said "hi"'';'
      - code: 'const d = `It''s "fine"`;'
    answer: 1
    explain: |
      در گزینه‌ی ۱ رشته با تک‌کوتیشن باز شده و تک‌کوتیشنِ داخل `It's` رشته را زودتر می‌بندد؛ بقیه‌ی متن (`s broken'`) برای JavaScript بی‌معنی است و `SyntaxError` می‌دهد. راه درست `'It\'s broken'` یا `"It's broken"` است. در گزینه‌های ۲ و ۳ علامت داخل متن با علامت دور رشته فرق دارد و در گزینه‌ی ۴ با backtick، هر دو نوع کوتیشن داخل متن آزادند.

  - level: medium
    stem: |
      اجرای کدام قطعه‌کد **خطا** می‌دهد؟
    check: option-throws
    errorName: SyntaxError
    options:
      - code: |
          const a = `line 1
          line 2`;
      - code: |
          const c = "line 1
          line 2";
      - code: 'const b = "line 1\nline 2";'
      - code: 'const d = `line 1` + "\n" + `line 2`;'
    answer: 2
    explain: |
      رشته‌ی معمولی (تک‌کوتیشن یا دابل‌کوتیشن) نمی‌تواند Enter خام داشته باشد؛ پس گزینه‌ی ۲ خطای `SyntaxError: Invalid or unexpected token` می‌دهد. template literal (گزینه‌ی ۱) دقیقاً برای همین ساخته شده: رشته‌ی چندخطی بدون `\n`. گزینه‌ی ۳ خط جدید را با `\n` نوشته و گزینه‌ی ۴ سه رشته را با `+` چسبانده که هر دو درست‌اند.

  - level: medium
    stem: |
      خروجی کد اسلاید ۵۱ (کد زیر) کدام است؟
    check: output
    code: |
      const product = "Laptop";
      const price = 1200;
      const quantity = 2;

      const message = `
      You ordered: ${quantity} × ${product}
      Total price: $${price * quantity}
      Thank you for shopping with us!
      `;

      console.log(message);
    options:
      - out: ["", "You ordered: ${quantity} × ${product}", "Total price: $${price * quantity}", "Thank you for shopping with us!", ""]
      - out: ["", "You ordered: 2 × Laptop", "Total price: $2400", "Thank you for shopping with us!", ""]
      - out: ["", "You ordered: 2 × Laptop", "Total price: $1200 * 2", "Thank you for shopping with us!", ""]
      - out: ["", "You ordered: 2 × Laptop", "Total price: 2400", "Thank you for shopping with us!", ""]
    answer: 2
    explain: |
      داخل backtick هر `${...}` حساب و جایگزین می‌شود: `2`، `Laptop` و حاصل **ضرب** `price * quantity` یعنی `2400` (رد گزینه‌ی ۱ که جاسازی را ندیده و گزینه‌ی ۳ که عبارت را حساب نکرده). در `$${...}` علامت `$` اول یک دلار معمولی است که چاپ می‌شود، پس `$2400` درست است و گزینه‌ی ۴ آن را جا انداخته. چون رشته با Enter شروع و تمام شده، خروجی یک خط خالی در ابتدا و یک خط خالی در انتها دارد.

