  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const age = 20;
      console.log(`Status: ${age >= 18 ? "adult" : "minor"}`);
      console.log(`Next year: ${age + 1}`);
      console.log(`Name: ${"sara".toUpperCase()}`);
    options:
      - out: ["Status: adult", "Next year: 201", "Name: SARA"]
      - out: ["Status: adult", "Next year: 21", "Name: SARA"]
      - out: ["Status: adult", "Next year: 21", "Name: sara.toUpperCase()"]
      - out: ["!! SyntaxError"]
    answer: 2
    explain: |
      داخل `${}` هر **عبارتی** مجاز است: عملگر سه‌تایی (`20 >= 18` درست است، پس `adult`)، محاسبه (`age + 1` جمع عددی است و `21` می‌دهد) و صدا زدن متد (`toUpperCase()` حروف را بزرگ می‌کند). گزینه‌ی ۱ فکر کرده `age` قبل از جمع به رشته تبدیل می‌شود، گزینه‌ی ۳ صدا زدن متد را متن فرض کرده و گزینه‌ی ۴ استفاده از `? :` یا متد را داخل `${}` غیرمجاز پنداشته است.

  - level: hard
    stem: |
      اجرای کدام قطعه‌کد **خطا** می‌دهد؟
    check: option-throws
    errorName: SyntaxError
    options:
      - code: 'const s = `${1 > 0 ? "yes" : "no"}`;'
      - code: 'const s = `${Math.max(1, 2)}`;'
      - code: 'const s = `${if (true) { "yes" }}`;'
      - code: 'const s = `${(2 + 3) * 4}`;'
    answer: 3
    explain: |
      داخل `${}` فقط **عبارت (expression)** مجاز است، یعنی چیزی که مقدار تولید می‌کند. `if` یک **دستور (statement)** است و مقداری تولید نمی‌کند، پس گزینه‌ی ۳ خطای `SyntaxError` می‌دهد. عملگر سه‌تایی (گزینه‌ی ۱)، صدا زدن تابع (گزینه‌ی ۲) و محاسبه‌ی پرانتزدار (گزینه‌ی ۴) همه عبارت‌اند و مجازند؛ برای شرط داخل template literal باید از `? :` استفاده کرد.

  - level: medium
    stem: |
      حاصل عبارت ``  `${[1, 2, 3]}`  `` چیست؟
    check: value
    expr: '`${[1, 2, 3]}`'
    options:
      - '`"1,2,3"`'
      - '`"[1, 2, 3]"`'
      - '`"1 2 3"`'
      - '`"[object Array]"`'
    answer: 1
    explain: |
      وقتی آرایه به رشته تبدیل می‌شود، عضوهایش با **کاما و بدون فاصله** به هم چسبانده می‌شوند و کروشه‌ها حذف می‌شوند: `"1,2,3"`. گزینه‌ی ۲ شکل نمایش آرایه در کنسول است، نه تبدیلش به رشته. گزینه‌ی ۳ جداکننده را فاصله فرض کرده و `"[object Array]"` هم شکل تبدیل آرایه نیست (چیزی شبیه آن، یعنی `"[object Object]"`، برای شیء‌های معمولی است).

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const user = { name: "Ali" };
      const tags = ["js", "web"];
      console.log(`User: ${user}`);
      console.log(`Tags: ${tags}`);
    options:
      - out: ["User: { name: 'Ali' }", "Tags: ['js', 'web']"]
      - out: ["User: Ali", "Tags: js web"]
      - out: ["User: [object Object]", "Tags: [js,web]"]
      - out: ["User: [object Object]", "Tags: js,web"]
    answer: 4
    explain: |
      `${}` هر مقداری را به **رشته** تبدیل می‌کند. یک شیء معمولی به رشته‌ی `[object Object]` تبدیل می‌شود (محتوایش نمایش داده نمی‌شود) و آرایه به عضوهایش با کاما و بدون کروشه: `js,web`. گزینه‌ی ۱ شکل نمایش `console.log(user)` است که با تبدیل به رشته فرق دارد. گزینه‌ی ۳ کروشه‌ها را نگه داشته و گزینه‌ی ۲ فرض کرده JavaScript خودش مقدار `name` را پیدا می‌کند. برای دیدن محتوای شیء باید از `JSON.stringify(user)` استفاده کرد.

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      let city;
      const phone = null;
      const active = false;
      console.log(`City: ${city}, Phone: ${phone}, Active: ${active}`);
    options:
      - out: "City: , Phone: , Active: false"
      - out: "City: undefined, Phone: null, Active: false"
