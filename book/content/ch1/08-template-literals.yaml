      داخل `${}` بیرونی یک عملگر سه‌تایی است؛ چون `isOnline` برابر `true` است، شاخه‌ی اول انتخاب می‌شود که خودش یک template literal **تودرتو** است و `${2 + 3}` داخلش به `5` تبدیل می‌شود. backtickهای تودرتو داخل `${}` کاملاً مجازند (رد گزینه‌ی ۳)، template داخلی هم جاسازی می‌کند (رد گزینه‌ی ۲) و شرط درست است (رد گزینه‌ی ۱).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟ (متغیری به نام `price` تعریف نشده است.)
    check: output
    code: |
      console.log(`Use \` to write a template`);
