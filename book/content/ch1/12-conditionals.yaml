      `default` می‌تواند هر جای `switch` بیاید و این خطا نیست؛ فقط اگر وسط باشد و `break` نداشته باشد، اجرا از آن به caseهای پایینی سقوط می‌کند. سه گزینه‌ی دیگر درست‌اند: مقایسه مثل `===` است (پس `"1"` با `1` جور نمی‌شود)، نبودن `break` باعث fall-through می‌شود و گروه‌بندی caseها (مثل `case "Thursday": case "Friday":`) کاملاً رایج است.

  - level: easy
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const balance = 0;
      const message = balance > 0 ? "You have money" : "Your wallet is empty";
      console.log(message);
    options:
      - out: "You have money"
      - out: "Your wallet is empty"
      - out: "false"
      - out: "!! SyntaxError"
    answer: 2
    explain: |
      عملگر سه‌تایی (ternary) این‌طور خوانده می‌شود: «شرط ؟ مقدارِ حالت درست : مقدارِ حالت نادرست». `0 > 0` نادرست است، پس مقدار بعد از `:` یعنی `"Your wallet is empty"` در `message` ریخته می‌شود. گزینه‌ی ۱ فقط وقتی درست بود که `balance` از صفر بزرگ‌تر بود، گزینه‌ی ۳ فکر کرده خودِ نتیجه‌ی شرط برگردانده می‌شود و گزینه‌ی ۴ این نحو (syntax) کاملاً مجاز را خطا دانسته است.

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const n = -3;
      const sign = n > 0 ? "positive" : n < 0 ? "negative" : "zero";
      console.log(sign);
    options:
      - out: "negative"
      - out: "positive"
      - out: "zero"
      - out: "!! SyntaxError"
    answer: 1
    explain: |
      زنجیره‌ی ternary مثل یک زنجیره‌ی `else if` خوانده می‌شود: «اگر `n > 0` پس `positive`، وگرنه اگر `n < 0` پس `negative`، وگرنه `zero`». `-3 > 0` نادرست است، پس سراغ ternary دوم می‌رویم و چون `-3 < 0` درست است، `negative` انتخاب می‌شود. زنجیر کردن ternaryها مجاز است (رد گزینه‌ی ۴)، هرچند زیاده‌روی در آن خوانایی را کم می‌کند. گزینه‌ی ۳ فقط برای `n = 0` درست بود.

  - level: medium
    stem: |
      در جای خالی کدام گزینه قرار بگیرد تا خروجی کد زیر `odd` باشد؟
    check: option-output
    expect: "odd"
    code: |
      const n = 7;
      const label = ___;
      console.log(label);
    options:
      - text: '`n % 2 === 0 : "even" ? "odd"`'
        code: 'const n = 7; const label = n % 2 === 0 : "even" ? "odd"; console.log(label);'
      - text: '`n % 2 ? "even" : "odd"`'
        code: 'const n = 7; const label = n % 2 ? "even" : "odd"; console.log(label);'
      - text: '`if (n % 2 === 0) "even" else "odd"`'
        code: 'const n = 7; const label = if (n % 2 === 0) "even" else "odd"; console.log(label);'
      - text: '`n % 2 === 0 ? "even" : "odd"`'
        code: 'const n = 7; const label = n % 2 === 0 ? "even" : "odd"; console.log(label);'
    answer: 4
    explain: |
      نحو درست ternary «شرط ? مقدار درست : مقدار نادرست» است. `7 % 2 === 0` نادرست است، پس `"odd"` انتخاب می‌شود. در گزینه‌ی ۱ جای `?` و `:` عوض شده و `SyntaxError` می‌گیریم. گزینه‌ی ۳ هم `SyntaxError` می‌دهد، چون `if` یک **دستور** است و نمی‌تواند سمت راست `=` بنشیند؛ فقط **عبارت‌ها** (مثل ternary) مقدار تولید می‌کنند. گزینه‌ی ۲ بدون خطا اجرا می‌شود ولی `even` چاپ می‌کند: `7 % 2` برابر `1` و truthy است، پس مقدار قبل از `:` انتخاب می‌شود.

  - level: medium
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const isAdmin = false;
      if (isAdmin)
        console.log("Delete button visible");
        console.log("Edit button visible");
      console.log("Page loaded");
    options:
      - out: "Page loaded"
      - out: ["Delete button visible", "Edit button visible", "Page loaded"]
      - out: ["Edit button visible", "Page loaded"]
      - out: "!! SyntaxError"
    answer: 3
    explain: |
      بدون آکولاد، فقط **یک** دستورِ بعد از `if` (خط ۳) به آن تعلق دارد. تورفتگی خط ۴ در JavaScript هیچ معنایی ندارد (برخلاف Python)، پس خط ۴ بیرون از `if` است و همیشه اجرا می‌شود. چون `isAdmin` نادرست است، فقط خط ۳ رد می‌شود. گزینه‌ی ۱ تورفتگی را مثل Python معنادار فرض کرده، گزینه‌ی ۲ شرط را نادیده گرفته و گزینه‌ی ۴ غلط است، چون `if` بدون آکولاد مجاز است.

  - level: hard
    stem: |
      کدام خط کد زیر خطا می‌دهد؟
    check: error-line
    errorName: SyntaxError
    code: |
      const x = 5;
      if (x > 0)
        console.log("positive");
        console.log("checked");
      else
        console.log("not positive");
    options:
      - line: 2
      - line: 5
      - line: 4
      - line: 0
    answer: 2
    explain: |
      `if` بدون آکولاد فقط دستور خط ۳ را در بر می‌گیرد؛ خط ۴ (با وجود تورفتگی) یک دستور مستقل است و ساختار `if` قبل از آن تمام شده است. پس `else` در خط ۵ به هیچ `if`ی نمی‌چسبد و `SyntaxError: Unexpected token 'else'` رخ می‌دهد. چون این خطای نحوی است، قبل از اجرای هر خطی کشف می‌شود و هیچ چیزی (حتی `positive`) چاپ نمی‌شود. خط‌های ۲ و ۴ به‌تنهایی کاملاً مجازند و گزینه‌ی «بدون خطا» (خط ۰) هم غلط است.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      let count = 3;
      if (count = 0) {
        console.log("empty");
      } else {
        console.log("not empty");
      }
      console.log(count);
    options:
      - out: ["not empty", "0"]
      - out: ["not empty", "3"]
      - out: ["empty", "0"]
      - out: "!! SyntaxError"
    answer: 1
    explain: |
      داخل شرط `=` آمده، نه `===`. پس `count = 0` اول صفر را **در `count` می‌ریزد** و مقدار کل عبارتِ انتساب هم `0` است که falsy است؛ بنابراین شاخه‌ی `else` اجرا می‌شود و بعد از آن `count` واقعاً `0` شده است. گزینه‌ی ۲ فکر کرده این یک مقایسه بوده و مقدار متغیر عوض نشده، گزینه‌ی ۳ فکر کرده «انتسابِ انجام‌شده» یعنی شرط درست، و گزینه‌ی ۴ غلط است، چون انتساب داخل شرط از نظر نحوی مجاز است (و همین آن را به یک باگ پنهان تبدیل می‌کند).

  - level: medium
    stem: |
      کد زیر در Node.js اجرا می‌شود. کدام خط خطا می‌دهد؟
    check: error-line
    errorName: TypeError
    code: |
      const limit = 5;
      let used = 3;
      if (used < limit) console.log("ok");
      if (limit = 10) console.log("limit changed");
      console.log(limit);
    options:
      - line: 1
      - line: 3
      - line: 5
      - line: 4
    answer: 4
    explain: |
      در خط ۴ به جای مقایسه (`===`)، انتساب (`=`) نوشته شده و چون `limit` با `const` تعریف شده، انتساب دوباره به آن `TypeError: Assignment to constant variable.` می‌دهد. خط ۳ یک مقایسه‌ی معمولی است و `ok` را چاپ می‌کند. خط ۱ یک تعریف عادی است و خط ۵ هرگز اجرا نمی‌شود، چون برنامه روی خط ۴ متوقف شده است.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const score = 40;
      if (score > 100); {
        console.log("Score too high!");
      }
      console.log("Checked");
    options:
      - out: "Checked"
      - out: "!! SyntaxError"
      - out: ["Score too high!", "Checked"]
      - out: "Score too high!"
    answer: 3
    explain: |
      سمی‌کالنِ بلافاصله بعد از `if (score > 100)` یک **دستور خالی** است و همان، بدنه‌ی `if` حساب می‌شود؛ یعنی `if` همان‌جا تمام شده است. بلوک `{ ... }` بعدی یک بلوک مستقل و معمولی است که همیشه اجرا می‌شود؛ پس با وجود این‌که `40 > 100` نادرست است، `Score too high!` و بعد `Checked` چاپ می‌شوند. گزینه‌ی ۱ این سمی‌کالن را ندیده، گزینه‌ی ۲ غلط است چون این کد از نظر نحوی مجاز است و گزینه‌ی ۴ خط آخر را جا انداخته است.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const color = "green";
      if (color === "red" || "blue") {
        console.log("red or blue");
      } else {
        console.log("another color");
      }
    options:
      - out: "another color"
      - out: "!! SyntaxError"
      - out: ["red or blue", "another color"]
      - out: "red or blue"
    answer: 4
    explain: |
      عملگر `||` مقایسه را تکرار نمی‌کند؛ شرط یعنی `(color === "red") || "blue"`. بخش اول `false` است، پس `||` مقدار دوم یعنی رشته‌ی `"blue"` را برمی‌گرداند که truthy است؛ در نتیجه شرط **همیشه** درست است. گزینه‌ی ۱ همان نتیجه‌ای است که برنامه‌نویس می‌خواست و با شکل درست `color === "red" || color === "blue"` به دست می‌آید. گزینه‌ی ۲ غلط است چون این کد مجاز است و گزینه‌ی ۳ هم غلط است، چون از `if / else` فقط یک شاخه اجرا می‌شود.
