id: ch1-conditionals
title: "کنترل جریان و دستورهای شرطی (if و switch)"
slides: "Introduction to JS، اسلایدهای ۲۹ و ۳۰"
lesson: |
  فرض کن با یک مسیریاب (GPS) رانندگی می‌کنی. بیشترِ راه را مستقیم جلو می‌روی، ولی سر هر تقاطع باید **تصمیم** بگیری: «اگر ترافیک است، از خیابان فرعی برو؛ وگرنه مستقیم برو». گاهی هم باید کاری را **تکرار** کنی: «دور میدان بچرخ تا به خروجی سوم برسی». برنامه‌ها هم دقیقاً همین‌طورند. به ترتیبی که دستورهای یک برنامه اجرا می‌شوند **control flow** (کنترل جریان؛ یعنی «کدام دستور، کِی و به چه ترتیبی اجرا شود») می‌گوییم.

  ### کنترل جریان (Control flow): اسلاید ۲۹

  اسلاید ۲۹ این پنج نکته را می‌گوید:

  - control flow تعیین می‌کند **کدام کد** و **چه زمانی** اجرا شود.
  - به‌طور پیش‌فرض، JavaScript کد را **از بالا به پایین** و خط‌به‌خط اجرا می‌کند.
  - **دستورهای شرطی (conditionals)** به ما اجازه می‌دهند مسیر برنامه را **دوشاخه کنیم (branch)**؛ مثل `if` و `else`.
  - **حلقه‌ها (loops)** به ما اجازه می‌دهند کدی را **تکرار** کنیم؛ مثل `for` و `while`.
  - این دو با هم به برنامه **منطق و ساختار** می‌دهند.

  کد اسلاید ۲۹ هر دو ابزار را کنار هم نشان می‌دهد:

  ```js title=cf.js
  let age = 18;

  if (age >= 18) {
    console.log("You can vote!");
  } else {
    console.log("Too young to vote.");
  }

  for (let i = 1; i <= 3; i++) {
    console.log("Count:", i);
  }
  ```

  خروجی:

  ```text
  You can vote!
  Count: 1
  Count: 2
  Count: 3
  ```

  بیا ببینیم چه شد:

  - شرط `age >= 18` یعنی «آیا `age` بزرگ‌تر **یا مساوی** ۱۸ است؟». چون `18 >= 18` درست (`true`) است، فقط بلوک `if` اجرا شد و بلوک `else` کاملاً **رد شد**. اگر خط اول `let age = 16;` بود، فقط `Too young to vote.` چاپ می‌شد.
  - حلقه‌ی `for` بدنه‌اش را برای `i` برابر ۱، ۲ و ۳ اجرا کرد. وقتی `i` به ۴ رسید، شرط `i <= 3` نادرست شد و حلقه تمام شد. (`console.log` وقتی چند ورودی بگیرد، آن‌ها را با یک فاصله کنار هم چاپ می‌کند؛ برای همین `Count: 1` چاپ شد.) جزئیات حلقه‌ها را در درس بعد، «حلقه‌ها (Loops)»، کامل می‌خوانیم.

  در این درس روی **دستورهای شرطی** تمرکز می‌کنیم.

  ### دستورهای شرطی (Conditionals): اسلاید ۳۰

  طبق اسلاید ۳۰، دستورهای شرطی:

  - به کد اجازه می‌دهند **تصمیم بگیرد** (make decisions)؛
  - بلوک‌هایی از کد را **فقط وقتی یک شرط درست است** اجرا می‌کنند؛

  و چهار شکل اصلی دارند:

  | شکل | کاربرد (طبق اسلاید ۳۰) |
  |---|---|
  | `if` | اگر شرط درست است، کدی را اجرا کن |
  | `if / else` | بین **دو مسیر** یکی را انتخاب کن |
  | `else if` | چند شرط را **پشت سر هم زنجیر کن** |
  | `switch` | **چند حالت مشخص** (چند مقدار معین) را مدیریت کن |

  ### `if`: «اگر ... آن‌گاه ...»

  ```js
  const temperature = 35;

  if (temperature > 30) {
    console.log("It's hot! Drink water.");
  }
  console.log("Have a nice day.");
  // It's hot! Drink water.
  // Have a nice day.
  ```

  - شرط همیشه داخل **پرانتز** `( )` می‌آید.
  - کدی که باید در صورت درست بودن شرط اجرا شود داخل **آکولاد** `{ }` می‌آید؛ به این بخش **بلوک (block)** می‌گوییم.
  - خط آخر بیرون از `if` است، پس **همیشه** اجرا می‌شود. اگر `temperature` برابر ۲۰ بود، فقط `Have a nice day.` چاپ می‌شد.

  ### شرط چطور سنجیده می‌شود؟ truthy و falsy

  داخل پرانتز `if` لازم نیست حتماً `true` یا `false` بنویسی؛ هر مقداری مجاز است. JavaScript آن مقدار را پشت پرده با همان قانون `Boolean(x)` (درس «تبدیل نوع صریح (Casting)») به boolean تبدیل می‌کند. یادآوری:

  - فقط ۸ مقدار **falsy** (شبه‌نادرست؛ یعنی در شرط مثل `false` رفتار می‌کنند) داریم: `false`، `0`، `-0`، `0n`، `""` (رشته‌ی خالی)، `null`، `undefined` و `NaN`.
  - **هر** مقدار دیگری **truthy** (شبه‌درست) است؛ حتی `"0"`، `"false"`، `" "`، `[]`، `{}` و `-1`.

  ```js
  if ("0") console.log("A");       // runs: "0" is a non-empty string
  if ([]) console.log("B");        // runs: every array (even an empty one) is truthy
  if ({}) console.log("C");        // runs: every object is truthy
  if (0) console.log("D");         // skipped: 0 is falsy
  if ("") console.log("E");        // skipped: the empty string is falsy
  if (null) console.log("F");      // skipped
  if (undefined) console.log("G"); // skipped
  if (NaN) console.log("H");       // skipped
  // Output: A, B, C (each on its own line)
  ```

  (این‌جا بدنه‌ی هر `if` فقط یک دستور است و آکولاد نگذاشته‌ایم. چند بخش پایین‌تر می‌بینیم این کار چه دامی دارد.)

  کاربرد رایج: بررسی «خالی نبودن» یک مقدار.

  ```js
  const username = "";
  if (username) {
    console.log("Hello, " + username);
  } else {
    console.log("Please enter your name.");
  }
  // Please enter your name.
  ```

  ### `if / else`: انتخاب بین دو مسیر

  `else` یعنی «وگرنه». در ساختار `if / else` **دقیقاً یکی** از دو بلوک اجرا می‌شود: اگر شرط truthy باشد بلوک `if`، وگرنه بلوک `else`. هیچ‌وقت هر دو با هم اجرا نمی‌شوند و هیچ‌وقت هر دو جا نمی‌مانند.

  ```js
  const num = 7;
  if (num % 2 === 0) {
    console.log("even");
  } else {
    console.log("odd");
  }
  // odd
  ```

  ### `else if`: زنجیره‌ی چند شرط

  وقتی بیش از دو حالت داریم، شرط‌ها را با `else if` پشت سر هم می‌چینیم:

  ```js
  const score = 85;
  if (score >= 90) {
    console.log("A");
  } else if (score >= 75) {
    console.log("B");
  } else if (score >= 50) {
    console.log("C");
  } else {
    console.log("F");
  }
  // B
  ```

  قانون طلایی زنجیره: شرط‌ها **به ترتیب از بالا** بررسی می‌شوند و **فقط اولین شاخه‌ای که شرطش درست باشد** اجرا می‌شود. بعد از آن، بقیه‌ی زنجیره (حتی اگر شرطشان درست باشد) **اصلاً بررسی نمی‌شود**. این‌جا `85 >= 50` هم درست است، ولی چون `85 >= 75` زودتر درست شد، فقط `B` چاپ شد.

  `else` آخر اختیاری است و نقش «در هر حالت دیگر» را دارد. اگر نباشد و هیچ شرطی درست نباشد، **هیچ** شاخه‌ای اجرا نمی‌شود.

  ::: warning ترتیب شرط‌ها مهم است
  اگر شرط کلی‌تر را اول بگذاری، شرط‌های خاص‌تر هیچ‌وقت به نوبت نمی‌رسند:

  ```js
  const score = 95;
  if (score >= 50) {
    console.log("C");   // 95 >= 50 is true, so this runs
  } else if (score >= 90) {
    console.log("A");   // never reached for any score >= 50
  }
  // C
  ```

  قاعده: در زنجیره، شرط‌های **سخت‌گیرانه‌تر** را بالاتر بگذار.
  :::

  دقت کن **چند `if` جدا** با **یک زنجیره‌ی `else if`** فرق دارد. `if`های جدا مستقل‌اند و هر کدام که شرطش درست باشد اجرا می‌شود:

  ```js
  const n = 15;
  if (n > 10) console.log("greater than 10");
  if (n > 5) console.log("greater than 5");   // a separate if: checked as well
  // greater than 10
  // greater than 5
  ```

  ### `if` تودرتو (Nested if)

  داخل بلوک یک `if` می‌توان `if` دیگری نوشت. شرط درونی فقط وقتی بررسی می‌شود که شرط بیرونی درست باشد:

  ```js
  const age = 20;
  const hasTicket = false;

  if (age >= 18) {
    if (hasTicket) {
      console.log("Enjoy the movie!");
    } else {
      console.log("Please buy a ticket.");
    }
  } else {
    console.log("Too young for this movie.");
  }
  // Please buy a ticket.
  ```

  ### `switch`: مدیریت چند حالت مشخص

  وقتی یک مقدار را با **چند مقدار معین** مقایسه می‌کنی (مثل شماره‌ی روز هفته یا نام یک دستور)، `switch` از یک زنجیره‌ی بلند `else if` خواناتر است:

  ```js
  const day = 3;

  switch (day) {
    case 1:
      console.log("Saturday");
      break;
    case 2:
      console.log("Sunday");
      break;
    case 3:
      console.log("Monday");
      break;
    default:
      console.log("Another day");
  }
  // Monday
  ```

  طرز کار `switch`:

  1. عبارتِ داخل پرانتز (این‌جا `day`) **یک بار** حساب می‌شود.
  2. مقدارش به ترتیب با مقدار هر `case` مقایسه می‌شود. این مقایسه **سخت‌گیرانه** است؛ یعنی دقیقاً مثل `===` (هم مقدار و هم نوع باید یکی باشند).
  3. اجرا از **اولین `case`ِ مطابق** شروع می‌شود.
  4. `break` یعنی «همین الان از `switch` بیرون برو».
  5. اگر هیچ `case`ی مطابق نباشد، اجرا از بخش `default` (حالت پیش‌فرض) شروع می‌شود. `default` اختیاری است؛ اگر نباشد و هیچ `case`ی مطابق نباشد، هیچ اتفاقی نمی‌افتد.

  #### مقایسه با `===`: رشته‌ی `"1"` با عدد `1` جور نمی‌شود

  ```js
  const choice = "1";   // e.g. a value typed by the user is always a string

  switch (choice) {
    case 1:
      console.log("You chose one");
      break;
    default:
      console.log("Unknown choice");
  }
  // Unknown choice   ("1" === 1 is false)
  ```

  برخلاف `==`، این‌جا هیچ تبدیل نوعی (coercion) رخ نمی‌دهد. راه درست: یا بنویس `case "1":` یا ورودی را اول با `Number(choice)` به عدد تبدیل کن.

  #### فراموش کردن `break`: سقوط به caseهای بعدی (Fall-through)

  `case`ها فقط **نقطه‌ی شروع** اجرا هستند، نه دیوار. وقتی اجرا از یک `case` شروع شد، تا رسیدن به `break` (یا پایان `switch`) ادامه پیدا می‌کند و **کد caseهای بعدی را هم بدون بررسی مقدارشان اجرا می‌کند**. به این پدیده **fall-through** (سقوط به caseهای پایینی) می‌گویند:

  ```js
  const fruit = "apple";

  switch (fruit) {
    case "apple":
      console.log("red");      // execution starts here
    case "banana":
      console.log("yellow");   // no break above, so it falls through
      break;                   // and stops here
    case "grape":
      console.log("purple");
  }
  // red
  // yellow
  ```

  #### چند case با یک کد مشترک (گروه‌بندی)

  از همین رفتار می‌شود آگاهانه استفاده کرد تا چند مقدار یک کد مشترک داشته باشند:

  ```js
  const today = "Friday";

  switch (today) {
    case "Thursday":
    case "Friday":
      console.log("Weekend!");
      break;
    default:
      console.log("Work day");
  }
  // Weekend!
  ```

  #### `default` لازم نیست آخر باشد

  `default` می‌تواند هر جای `switch` بیاید و در هر حال فقط وقتی **نقطه‌ی شروع** اجرا می‌شود که هیچ `case`ی مطابق نباشد. ولی اگر وسط باشد و `break` نداشته باشد، اجرا از آن‌جا به caseهای پایینی سقوط می‌کند:

  ```js
  const level = 9;

  switch (level) {
    default:
      console.log("unknown level");   // chosen: no case matches 9
    case 1:
      console.log("beginner");        // falls through (no break above)
      break;
    case 2:
      console.log("expert");
  }
  // unknown level
  // beginner
  ```

  ### عملگر سه‌تایی (Ternary operator): `condition ? a : b`

  گاهی فقط می‌خواهی بر اساس یک شرط، **یکی از دو مقدار** را انتخاب کنی. عملگر سه‌تایی (**ternary**؛ تنها عملگر JavaScript که سه بخش دارد) یک `if / else` کوتاه است که **مقدار برمی‌گرداند**:

  ```js
  const age = 15;
  const status = age >= 18 ? "adult" : "minor";
  console.log(status); // minor

  // the same logic with if / else:
  let status2;
  if (age >= 18) {
    status2 = "adult";
  } else {
    status2 = "minor";
  }
  console.log(status2); // minor
  ```

  این‌طور بخوانش: «شرط **؟** مقدارِ حالت درست **:** مقدارِ حالت نادرست». چون ternary یک **عبارت** (expression؛ تکه‌کدی که یک مقدار تولید می‌کند) است، می‌شود آن را مستقیم داخل `console.log` یا یک template literal گذاشت. `if` یک **دستور** (statement) است و چنین کاری از آن برنمی‌آید:

  ```js
  const items = 1;
  console.log(`You have ${items} item${items === 1 ? "" : "s"}`); // You have 1 item
  ```

  ternaryها را می‌شود زنجیر هم کرد و مثل یک زنجیره‌ی `else if` خواند («اگر ... وگرنه اگر ... وگرنه ...»)، ولی زیاده‌روی در آن خوانایی را از بین می‌برد:

  ```js
  const n = 0;
  const sign = n > 0 ? "positive" : n < 0 ? "negative" : "zero";
  console.log(sign); // zero
  ```

  ::: tip
  - شرط `if` هر مقداری می‌تواند باشد و با قانون truthy/falsy سنجیده می‌شود: `if ("0")`، `if ("false")`، `if ([])` و `if ({})` اجرا **می‌شوند**؛ `if (0)`، `if ("")`، `if (null)`، `if (undefined)` و `if (NaN)` اجرا **نمی‌شوند**.
  - در زنجیره‌ی `if / else if / ...` حداکثر **یک** شاخه اجرا می‌شود: اولین شاخه‌ای که شرطش درست است. اگر `else` پایانی داشته باشد، **دقیقاً** یک شاخه اجرا می‌شود.
  - `switch` با `===` مقایسه می‌کند؛ `break` از `switch` بیرون می‌برد؛ بدون `break` اجرا به caseهای بعدی سقوط می‌کند؛ `default` (هر جای `switch` که باشد) وقتی نقطه‌ی شروع است که هیچ caseی مطابق نباشد.
  - برای انتخاب یک **مقدار** از بین دو مقدار، ternary (`cond ? a : b`) کوتاه‌ترین راه است.
  :::

  ::: trap
  **۱. بدون آکولاد، فقط دستورِ بعدی مال `if` است.** تورفتگی (indentation) در JavaScript برخلاف Python هیچ معنایی ندارد:

  ```js
  const isLoggedIn = false;
  if (isLoggedIn)
    console.log("Welcome back!");
    console.log("Loading your profile..."); // NOT part of the if: always runs
  // Loading your profile...
  ```

  اگر بعد از چنین `if`ِ بی‌آکولادی دو دستور بیاید و بعد `else`، آن `else` دیگر به `if` نمی‌چسبد و کل فایل `SyntaxError: Unexpected token 'else'` می‌دهد. **همیشه آکولاد بگذار.**

  **۲. `=` به جای `===` داخل شرط.** `=` انتساب است، نه مقایسه! `if (x = 5)` اول عدد ۵ را **در `x` می‌ریزد** و بعد مقدار همان انتساب (یعنی `5` که truthy است) شرط می‌شود؛ پس شرط همیشه درست است و `x` هم عوض شده است. `if (x = 0)` برعکس هیچ‌وقت اجرا نمی‌شود. اگر `x` با `const` تعریف شده باشد، همین خط `TypeError` می‌دهد.

  ```js
  let x = 10;
  if (x = 5) {              // assignment, not comparison!
    console.log("x is 5");  // runs
  }
  console.log(x);           // 5 (x has been changed)
  ```

  **۳. سمی‌کالن بعد از پرانتز `if`.** در `if (score > 100); { ... }` آن `;` یک «دستور خالی» است که بدنه‌ی `if` حساب می‌شود، و بلوک `{ ... }` بعدی یک بلوک مستقل است که **همیشه** اجرا می‌شود.

  **۴. `||` مقایسه را تکرار نمی‌کند.** `if (color === "red" || "blue")` یعنی «`color === "red"` یا مقدار `"blue"`»؛ و چون رشته‌ی غیرخالی `"blue"` truthy است، این شرط **همیشه** درست است. شکل درست: `if (color === "red" || color === "blue")`.

  **۵. ورودی کاربر رشته است.** `switch ("1")` با `case 1:` جور نمی‌شود، چون مقایسه با `===` است.
  :::

  ::: summary
  - control flow تعیین می‌کند کدام کد و کِی اجرا شود؛ پیش‌فرض: از بالا به پایین. شرط‌ها مسیر را دوشاخه می‌کنند (`if`، `else`) و حلقه‌ها تکرار می‌کنند (`for`، `while`).
  - چهار شکل شرط (اسلاید ۳۰): `if`، `if / else` (دو مسیر)، `else if` (زنجیره‌ی شرط‌ها) و `switch` (چند حالت مشخص).
  - شرط با truthy/falsy سنجیده می‌شود؛ در زنجیره فقط اولین شاخه‌ی درست اجرا می‌شود و ترتیب شرط‌ها مهم است.
  - `switch`: مقایسه با `===`، `break` برای خروج، fall-through بدون `break`، گروه‌بندی caseها و `default` در هر جای `switch`.
  - ternary (`cond ? a : b`) یک عبارت است و یکی از دو مقدار را برمی‌گرداند.
  :::
