id: ch1-operators
title: "عملگرهای حسابی و انتساب"
slides: "Introduction to JS، اسلایدهای ۱۸ و ۱۹"
lesson: |
  یک ماشین‌حساب را تصور کن: عددها را وارد می‌کنی و با دکمه‌های `+`، `-`، `×` و `÷` رویشان کاری انجام می‌دهی. در برنامه‌نویسی به این دکمه‌ها **عملگر (operator)** می‌گوییم و به مقدارهایی که عملگر رویشان کار می‌کند **عملوند (operand)**. در `7 + 2`، علامت `+` عملگر است و `7` و `2` عملوند.

  ### عملگرهای حسابی (اسلاید ۱۸)

  | عملگر | نام | مثال | نتیجه |
  |---|---|---|---|
  | `+` | جمع (addition) | `7 + 2` | `9` |
  | `-` | تفریق (subtraction) | `7 - 2` | `5` |
  | `*` | ضرب (multiplication) | `7 * 2` | `14` |
  | `/` | تقسیم (division) | `7 / 2` | `3.5` |
  | `%` | باقی‌مانده (remainder یا modulo) | `7 % 2` | `1` |
  | `**` | توان (exponentiation) | `7 ** 2` | `49` |

  ### میم اسلاید ۱۸: «1 + 1 چند می‌شود؟»

  در میم اسلاید ۱۸ رئیس جلسه می‌پرسد «1 + 1 چند می‌شود؟». کارمندِ Python می‌گوید `2`، کارمندِ C++ هم `2`، ولی کارمندِ JavaScript با خونسردی می‌گوید `"11"` و رئیس او را از پنجره بیرون می‌اندازد! واقعیت این است که در JavaScript هم `1 + 1` برابر `2` است. جواب `"11"` فقط وقتی پیش می‌آید که **یکی از دو طرف رشته باشد**؛ چون عملگر `+` دو شغل دارد:

  - اگر هر دو طرف عدد باشند، **جمع** می‌کند.
  - اگر حتی یک طرف **رشته (string)** باشد، دو طرف را به هم **می‌چسباند** که به آن **concatenation** (الحاق) می‌گویند.

  بقیه‌ی عملگرهای حسابی (`-`، `*`، `/`، `%`، `**`) فقط معنای ریاضی دارند و رشته‌ها را به عدد تبدیل می‌کنند:

  ```js
  console.log(1 + 1);       // 2
  console.log("1" + 1);     // 11 (a string: concatenation)
  console.log("5" - 1);     // 4  (minus only does math)
  console.log(1 + 2 + "3"); // 33 (left to right: 1 + 2 = 3, then 3 + "3")
  ```

  (قانون‌های کامل این تبدیل‌های خودکار را در درس Type coercion می‌بینیم.)

  ### تقسیم `/` همیشه اعشاری است

  در Java یا C، تقسیم دو عدد صحیح، نتیجه‌ی صحیح می‌دهد (`7 / 2` می‌شود `3`). در JavaScript فقط یک نوع عدد داریم و تقسیم **همیشه نتیجه‌ی واقعی** می‌دهد: `7 / 2` برابر `3.5` است. اگر **تقسیم صحیح** می‌خواهی، باید خودت قسمت اعشاری را حذف کنی:

  ```js
  console.log(7 / 2);              // 3.5
  console.log(Math.floor(7 / 2));  // 3  (round down)
  console.log(Math.trunc(7 / 2));  // 3  (cut off the decimals)
  console.log(Math.floor(-7 / 2)); // -4 (down means toward minus infinity)
  console.log(Math.trunc(-7 / 2)); // -3
  console.log(Math.round(7 / 2));  // 4  (nearest integer, NOT integer division)
  ```

  **تقسیم بر صفر خطا نمی‌دهد!** نتیجه یکی از مقدارهای ویژه‌ی نوع `number` است:

  ```js
  console.log(1 / 0);  // Infinity
  console.log(-1 / 0); // -Infinity
  console.log(0 / 0);  // NaN (Not a Number)
  console.log(5 % 0);  // NaN
  ```

  ### باقی‌مانده `%`

  فرض کن ۱۷ شکلات را بین ۵ نفر تقسیم می‌کنی: به هر نفر ۳ شکلات می‌رسد و ۲ شکلات **باقی می‌ماند**؛ پس `17 % 5` برابر `2` است.

  - کاربرد معروف: تشخیص زوج بودن با `n % 2 === 0` (مثلاً `10 % 2` برابر `0` است).
  - **علامت نتیجه از عدد سمت چپ (مقسوم) می‌آید**: `-7 % 3` برابر `-1` است (نه `2`) و `7 % -3` برابر `1`. برای همین دقیق‌تر است بگوییم «باقی‌مانده» تا «modulo» ریاضی.
  - به همین دلیل برای تشخیص **فرد** بودن بنویس `n % 2 !== 0`؛ چون `-3 % 2` برابر `-1` است و شرط `n % 2 === 1` برای اعداد منفی جواب غلط می‌دهد.
  - روی اعداد اعشاری هم کار می‌کند: `5.5 % 2` برابر `1.5` است.

  ### توان `**`

  - `2 ** 3` برابر `8`، `2 ** 0.5` برابر جذر ۲ (`1.4142135623730951`) و `2 ** -1` برابر `0.5` است. روش قدیمی‌تر همین کار `Math.pow(2, 3)` است.
  - علامت `^` در JavaScript توان **نیست** (یک عملگر بیتی به نام XOR است): `2 ^ 3` برابر `1` است، نه `8`!
  - `**` **از راست به چپ** حساب می‌شود: `2 ** 3 ** 2` یعنی `2 ** (3 ** 2)` که می‌شود `2 ** 9` یعنی `512` (نه `64`).
  - منفیِ یک‌طرفه (unary minus) درست قبل از `**` مبهم است و **`SyntaxError`** می‌دهد: `-2 ** 2` خطاست. باید با پرانتز منظورت را روشن کنی: `(-2) ** 2` برابر `4` و `-(2 ** 2)` برابر `-4`.

  ### اعداد اعشاری و ماجرای `0.1 + 0.2`

  ```js
  console.log(0.1 + 0.2);         // 0.30000000000000004
  console.log(0.1 + 0.2 === 0.3); // false
  ```

  کامپیوتر اعداد را در مبنای ۲ ذخیره می‌کند و عددی مثل `0.1` در مبنای ۲ دقیق نوشته نمی‌شود (مثل `1/3` که در مبنای ۱۰ می‌شود `0.333...`). این باگ JavaScript نیست؛ Python و Java هم همین رفتار را دارند (استاندارد IEEE 754). راه‌حل: برای نمایش گرد کن (`(0.1 + 0.2).toFixed(2)` که رشته‌ی `"0.30"` می‌دهد) یا با یک خطای مجاز مقایسه کن: `Math.abs((0.1 + 0.2) - 0.3) < Number.EPSILON` که `true` است.

  ### اولویت عملگرها (precedence)

  وقتی چند عملگر در یک عبارت هستند، به این ترتیب حساب می‌شوند:

  1. پرانتز `( )`
  2. توان `**` (از **راست به چپ**)
  3. `*`، `/` و `%` (هم‌سطح؛ از **چپ به راست**)
  4. `+` و `-` (هم‌سطح؛ از **چپ به راست**)

  ```js
  console.log(2 + 3 * 4);      // 14  (multiplication first)
  console.log((2 + 3) * 4);    // 20  (parentheses first)
  console.log(2 * 3 ** 2);     // 18  (power first: 2 * 9)
  console.log(20 / 4 * 2);     // 10  (left to right: 5 * 2)
  console.log(10 - 4 - 3);     // 3   (left to right: 6 - 3)
  console.log(2 + 3 * 4 ** 2); // 50  (2 + 3 * 16)
  ```

  ### عملگرهای انتساب (اسلاید ۱۹)

  عملگر `=` مقدار سمت راست را در متغیر سمت چپ می‌ریزد. عملگرهای ترکیبی (compound) یک محاسبه و یک انتساب را با هم انجام می‌دهند. در این جدول فرض کن هر بار از `x = 10` شروع می‌کنیم:

  | عملگر | معنی | مثال | معادلِ | مقدار جدید `x` |
  |---|---|---|---|---|
  | `=` | انتساب (assign) | `x = 5` | | `5` |
  | `+=` | جمع و انتساب | `x += 3` | `x = x + 3` | `13` |
  | `-=` | تفریق و انتساب | `x -= 3` | `x = x - 3` | `7` |
  | `*=` | ضرب و انتساب | `x *= 3` | `x = x * 3` | `30` |
  | `/=` | تقسیم و انتساب | `x /= 4` | `x = x / 4` | `2.5` |
  | `%=` | باقی‌مانده و انتساب | `x %= 3` | `x = x % 3` | `1` |

  (عملگر `**=` هم وجود دارد که روی اسلاید نیامده: `x **= 2` یعنی `x = x ** 2` که می‌شود `100`.)

  ### میم اسلاید ۱۹: `x = x + 1`

  در میم اسلاید ۱۹، برنامه‌نویس‌ها با لبخند `X = X+1` می‌نویسند و ریاضی‌دان‌ها با وحشت نگاه می‌کنند؛ چون در ریاضی هیچ عددی با «خودش به‌علاوه‌ی ۱» برابر نیست! نکته این است که در برنامه‌نویسی `=` یعنی **انتساب (assignment)**، نه **برابری**. `x = x + 1` یعنی: «سمت راست را حساب کن، بعد نتیجه را در سمت چپ بریز».

  ```js
  let y = 5;
  y = y + 1;      // read y (5), compute 5 + 1, store 6 back into y
  console.log(y); // 6
  ```

  همین کار را کوتاه‌تر می‌شود با `y += 1` یا `y++` نوشت. برای **مقایسه‌ی برابری** در JavaScript از `===` استفاده می‌کنیم (درس «عملگرهای مقایسه و منطقی»).

  ### دام‌های عملگرهای ترکیبی

  - **اول کل سمت راست حساب می‌شود:** `x *= 2 + 3` یعنی `x = x * (2 + 3)`، نه `x * 2 + 3`.
  - **`+=` روی رشته الحاق می‌کند**، ولی `-=` همیشه عددی است:

    ```js
    let z = 4;
    z *= 2 + 3;
    console.log(z);   // 20

    let msg = "Hello";
    msg += " World";
    console.log(msg); // Hello World

    let s1 = "8";
    s1 += 2;          // "82" (string concatenation)
    let s2 = "8";
    s2 -= 2;          // 6 (minus converts "8" to a number)
    console.log(s1, s2); // 82 6
    ```

  - همه‌ی عملگرهای انتساب، **انتساب دوباره** هستند؛ پس روی `const` خطای `TypeError` می‌دهند: `const total = 10; total += 5;` خطاست.

  ### افزایش و کاهش: `++` و `--`

  `x++` یعنی «یکی به `x` اضافه کن» و `x--` یعنی «یکی کم کن». ولی **جای** علامت مهم است:

  - **postfix** (پسوندی، `a++`): اول مقدار **فعلی** استفاده می‌شود، **بعد** یکی اضافه می‌شود.
  - **prefix** (پیشوندی، `++a`): اول یکی اضافه می‌شود، **بعد** مقدار **جدید** استفاده می‌شود.

  ```js
  let a = 5;
  let b = a++;       // b gets the OLD value (5), then a becomes 6
  console.log(a, b); // 6 5

  let c = 5;
  let d = ++c;       // c becomes 6 first, then d gets the NEW value (6)
  console.log(c, d); // 6 6
  ```

  ::: analogy
  `a++` مثل این است که بگویی «اول عکس بگیر، بعد مدل موهایت را عوض کن»؛ عکس، مدل قبلی را نشان می‌دهد. `++a` یعنی «اول مدل موها را عوض کن، بعد عکس بگیر».
  :::

  ### خود انتساب هم مقدار دارد

  هر انتساب یک عبارت (expression) است و مقدارش، **مقدار جدید متغیر** است. برای همین کنسول اسلاید ۲۳ بعد از `a = "Hello!"` مقدار `"Hello!"` را نشان داد:

  ```js
  let w = 1;
  console.log(w += 2); // 3
  console.log(w = 10); // 10
  let p, q;
  p = q = 5;           // right to left: q = 5, then p = 5
  console.log(p, q);   // 5 5
  ```

  ::: tip
  - برای تقسیم صحیح از `Math.floor` (یا برای اعداد منفی، بسته به نیاز، `Math.trunc`) استفاده کن، نه `Math.round`.
  - برای زوج/فرد از `n % 2 === 0` و `n % 2 !== 0` استفاده کن.
  - برای توان از `**` (یا `Math.pow`) استفاده کن؛ `^` توان نیست.
  - اگر در اولویت عملگرها شک داری، پرانتز بگذار؛ هم درست‌تر است و هم خواناتر.
  :::

  ::: trap
  - `"1" + 1` برابر `"11"` است (الحاق)، ولی `"5" - 1` برابر `4` است (تفریق عددی).
  - `7 / 2` برابر `3.5` است، نه `3`. و `1 / 0` خطا نمی‌دهد: `Infinity` است؛ `0 / 0` هم `NaN` است.
  - `-7 % 3` برابر `-1` است (علامت از عدد سمت چپ).
  - `2 ** 3 ** 2` برابر `512` است (راست به چپ) و `-2 ** 2` خطای `SyntaxError` می‌دهد.
  - `0.1 + 0.2 === 0.3` برابر `false` است.
  - `let x = 4; x *= 2 + 3;` مقدار `20` می‌دهد، نه `11`.
  - `let b = a++` مقدار **قدیمی** `a` را در `b` می‌ریزد.
  :::

  ::: summary
  - عملگرهای حسابی: `+` (جمع یا الحاق)، `-`، `*`، `/` (همیشه اعشاری)، `%` (باقی‌مانده با علامت سمت چپ)، `**` (توان، راست به چپ).
  - اولویت: پرانتز، بعد `**`، بعد `* / %`، بعد `+ -`؛ هم‌سطح‌ها از چپ به راست.
  - عملگرهای انتساب: `=`، `+=`، `-=`، `*=`، `/=`، `%=`؛ `x op= y` یعنی `x = x op (y)`.
  - `=` انتساب است، نه برابری. `a++` مقدار قدیمی و `++a` مقدار جدید را برمی‌گرداند.
  :::
questions:
  - level: easy
    stem: |
      حاصل `7 / 2` در JavaScript چیست؟
    check: value
    expr: '7 / 2'
    options:
      - '`3`'
      - '`3.5`'
      - '`4`'
      - '`"3.5"`'
    answer: 2
    explain: |
      در JavaScript فقط یک نوع عدد (`number`) داریم و تقسیم همیشه نتیجه‌ی واقعی می‌دهد: `3.5`. گزینه‌ی ۱ رفتار تقسیم صحیح در Java و C است و گزینه‌ی ۳ نتیجه را گرد کرده است. نتیجه یک عدد است، نه رشته، پس گزینه‌ی ۴ هم غلط است.

  - level: easy
    stem: |
      حاصل `17 % 5` چیست؟
    check: value
    expr: '17 % 5'
    options:
      - '`3`'
      - '`3.4`'
      - '`2`'
      - '`12`'
    answer: 3
    explain: |
      `%` **باقی‌مانده‌ی** تقسیم را می‌دهد: ۱۷ تقسیم بر ۵ می‌شود ۳ و ۲ باقی می‌ماند (`5 * 3 + 2 = 17`). گزینه‌ی ۱ خارج‌قسمت است، گزینه‌ی ۲ حاصل تقسیم `17 / 5` و گزینه‌ی ۴ حاصل تفریق `17 - 5`.

  - level: easy
    stem: |
      حاصل `2 ** 4` چیست؟
    check: value
    expr: '2 ** 4'
    options:
      - '`16`'
      - '`8`'
      - '`6`'
      - '`32`'
    answer: 1
    explain: |
      `**` عملگر توان است: `2 ** 4` یعنی ۲ به توان ۴، یعنی `2 * 2 * 2 * 2` که می‌شود `16`. گزینه‌ی ۲ حاصل `2 * 4` است، گزینه‌ی ۳ حاصل `2 + 4` و گزینه‌ی ۴ حاصل `2 ** 5`.

  - level: easy
    stem: |
      در میم اسلاید ۱۸، کارمندِ JavaScript جواب «1 + 1» را `"11"` داد. حاصل `"1" + 1` در JavaScript چیست؟
    check: value
    expr: '"1" + 1'
    options:
      - '`2`'
      - '`11`'
      - '`"2"`'
      - '`"11"`'
    answer: 4
    explain: |
      وقتی یک طرف `+` رشته باشد، طرف دیگر هم به رشته تبدیل و دو رشته به هم **چسبانده** می‌شوند (concatenation): `"1" + "1"` یعنی رشته‌ی `"11"`. گزینه‌ی ۲ عدد یازده است، نه رشته، و گزینه‌های ۱ و ۳ جمع ریاضی را فرض کرده‌اند. یادت باشد `1 + 1` (بدون رشته) در JavaScript هم همان `2` است.

  - level: easy
    stem: |
      در میم اسلاید ۱۹، ریاضی‌دان‌ها از دیدن `x = x + 1` تعجب می‌کنند. این دستور در JavaScript چه می‌کند؟
    options:
      - 'مقدار فعلی `x` را با ۱ جمع می‌کند و حاصل را دوباره در `x` می‌ریزد.'
      - 'بررسی می‌کند که `x` با `x + 1` برابر است یا نه، و `false` برمی‌گرداند.'
      - 'خطای `SyntaxError` می‌دهد، چون چنین معادله‌ای جواب ندارد.'
      - 'مقدار `x` را برابر `1` می‌کند.'
    answer: 1
    explain: |
      در برنامه‌نویسی `=` عملگر **انتساب** است، نه برابری: اول سمت راست (`x + 1`) حساب می‌شود و بعد نتیجه در `x` ریخته می‌شود؛ یعنی همان `x += 1`. گزینه‌ی ۲ معنای مقایسه را فرض کرده که در JavaScript با `===` انجام می‌شود. این دستور کاملاً مجاز است (رد گزینه‌ی ۳) و `x` را یکی زیاد می‌کند، نه برابر ۱ (رد گزینه‌ی ۴).

  - level: easy
    stem: |
      کدام کد عدد `8` (یعنی ۲ به توان ۳) را چاپ می‌کند؟
    check: option-output
    expect: "8"
    options:
      - code: 'console.log(2 ^ 3);'
      - code: 'console.log(2 ** 3);'
      - code: 'console.log(2 * 3);'
      - code: 'console.log(3 ** 2);'
    answer: 2
    explain: |
      عملگر توان در JavaScript `**` است و `2 ** 3` برابر `8` است. گزینه‌ی ۱ دام معروف است: `^` در JavaScript توان نیست بلکه عملگر بیتی XOR است و `2 ^ 3` برابر `1` می‌شود. گزینه‌ی ۳ ضرب است (`6`) و در گزینه‌ی ۴ پایه و توان جابه‌جا شده‌اند (`9`).

  - level: easy
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      console.log(1 / 0);
      console.log(-1 / 0);
      console.log(0 / 0);
    options:
      - out: ["Infinity", "Infinity", "0"]
      - out: ["!! RangeError"]
      - out: ["NaN", "NaN", "NaN"]
      - out: ["Infinity", "-Infinity", "NaN"]
    answer: 4
    explain: |
