      خروجی کد زیر چیست؟ (یادآوری: `parseInt(str, radix)` رشته‌ی `str` را در مبنای `radix` به عدد صحیح تبدیل می‌کند؛ مبنای `0` یعنی «پیش‌فرض» (ده‌دهی) و مبنای `1` نامعتبر است.)
    check: output
    code: |
      const result = ["1", "2", "3"].map(parseInt);
      console.log(result);
    options:
      - out: "[1, 2, 3]"
      - out: "[1, NaN, NaN]"
      - out: "[NaN, NaN, NaN]"
      - out: "['1', '2', '3']"
    answer: 2
    explain: |
      `map` به callback **سه** ورودی می‌دهد: `(element, index, array)`؛ پس `parseInt` به ترتیب با `("1", 0)`، `("2", 1)` و `("3", 2)` صدا زده می‌شود. مبنای `0` یعنی پیش‌فرض، پس `1`؛ مبنای `1` نامعتبر است، پس `NaN`؛ و در مبنای ۲ رقم `3` وجود ندارد، پس باز `NaN`. گزینه‌ی ۱ فرض کرده فقط خودِ عضو به callback داده می‌شود؛ راه درست `.map(s => parseInt(s))` یا `.map(Number)` است.

  - level: hard
    stem: |
      اجرای کد زیر در کدام خط با خطا مواجه می‌شود؟
    check: error-line
    errorName: SyntaxError
    code: |
      const nums = [1, 2, 3];
      for (const n of nums) {
        if (n === 2) break;
      }
      nums.forEach(n => {
        if (n === 2) break;
      });
    options:
      - line: 3
      - line: 5
      - line: 6
      - line: 0
    answer: 3
    explain: |
      `break` داخل حلقه‌ی `for...of` (خط ۳) کاملاً مجاز است. اما در خط ۶، `break` داخل یک **تابع** (callback) است که خودش حلقه‌ای ندارد؛ پس `SyntaxError: Illegal break statement` رخ می‌دهد. این خطا هنگام خواندن کل فایل کشف می‌شود و هیچ خطی اجرا نمی‌شود. `forEach` را نمی‌توان با `break` متوقف کرد؛ برای توقف زودهنگام از `for...of` یا `find`/`some` استفاده کن.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const empty = [];
      console.log(empty.reduce((a, b) => a + b, 0));
      console.log(empty.reduce((a, b) => a + b));
    options:
      - out: ["0", "0"]
      - out: ["0", "undefined"]
      - out: "!! TypeError"
      - out: ["0", "!! TypeError"]
    answer: 4
    explain: |
      با مقدار اولیه، `reduce` روی آرایه‌ی خالی callback را اصلاً صدا نمی‌زند و همان مقدار اولیه (`0`) را برمی‌گرداند. بدون مقدار اولیه، عضو اولی وجود ندارد که `acc` از آن شروع شود؛ پس `TypeError: Reduce of empty array with no initial value` رخ می‌دهد (رد گزینه‌های ۱ و ۲). خط اول قبل از خطا اجرا شده و `0` چاپ شده است (رد گزینه‌ی ۳).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const items = [{ qty: 1 }, { qty: 2 }];
      const updated = items.map(item => {
        item.qty = item.qty * 10;
        return item;
      });
      console.log(items[0].qty, updated === items, updated[0] === items[0]);
    options:
      - out: "1 false false"
      - out: "10 true true"
      - out: "10 false true"
      - out: "1 false true"
    answer: 3
    explain: |
      `map` یک آرایه‌ی **جدید** می‌سازد (`updated !== items`؛ رد گزینه‌ی ۲)، ولی عضوهای آن **همان شیءهای قبلی** هستند، چون callback خودِ `item` (یک reference) را برگردانده است. callback هم همان شیءها را تغییر داده، پس `items[0].qty` برابر `10` است (رد گزینه‌های ۱ و ۴). «`map` آرایه را تغییر نمی‌دهد» درباره‌ی خودِ آرایه است؛ برای دست نزدن به شیءها باید مثل اسلاید ۴۸ شیء جدید ساخت: `({ ...item, qty: item.qty * 10 })`.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const students = [{ name: "Alice", score: 85 }, { name: "Bob", score: 62 }];
      const results = students.map(s => ({ ...s, passed: s.score >= 70 }));
      console.log(results[1].passed, students[1].passed, results.length);
    options:
      - out: "false false 2"
      - out: "false undefined 2"
      - out: "true undefined 2"
      - out: "false undefined 1"
    answer: 2
    explain: |
      نمره‌ی Bob برابر `62` است و `62 >= 70` نادرست است، پس `passed` او `false` است (رد گزینه‌ی ۳). spread برای هر دانشجو یک شیء **جدید** می‌سازد و `passed` فقط به آن شیء جدید اضافه می‌شود؛ شیءهای `students` این کلید را ندارند و `undefined` می‌دهند (رد گزینه‌ی ۱). `map` هیچ عضوی را حذف نمی‌کند و `results` هم دو عضو دارد (رد گزینه‌ی ۴).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const nums = [1, 2, 3];
      console.log(nums.reduce((acc, n) => acc + n, ""));
      console.log(nums.reduce((acc, n) => acc + n, 10));
    options:
      - out: ["6", "16"]
      - out: ["123", "10123"]
      - out: ["6", "106"]
      - out: ["123", "16"]
    answer: 4
    explain: |
      در خط اول `acc` از رشته‌ی خالی شروع می‌شود و «رشته + عدد» یعنی چسباندن: `"1"`، `"12"` و `"123"` (رد گزینه‌های ۱ و ۳). در خط دوم `acc` از عدد `10` شروع می‌شود و جمع عددی است: `10 + 1 + 2 + 3 = 16`. گزینه‌ی ۲ فرض کرده رفتار خط اول در خط دوم هم تکرار می‌شود؛ نوع `acc` را **مقدار اولیه** تعیین می‌کند.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const products = [{ id: 1, stock: 5 }, { id: 2, stock: 0 }];
      const p = products.find(x => x.id === 2);
      p.stock = 10;
      console.log(products[1].stock);
      console.log(products.find(x => x.id === 3));
    options:
      - out: ["0", "undefined"]
      - out: ["10", "undefined"]
      - out: ["10", "-1"]
      - out: ["0", "null"]
    answer: 2
    explain: |
      `find` **خودِ** عضو (reference همان شیء) را برمی‌گرداند، نه یک کپی؛ پس تغییر `p.stock` همان شیءِ داخل آرایه را عوض می‌کند و `10` چاپ می‌شود (رد گزینه‌های ۱ و ۴). وقتی هیچ عضوی جور نباشد، `find` مقدار `undefined` برمی‌گرداند؛ `-1` جواب `findIndex` است (رد گزینه‌ی ۳) و `null` را هیچ‌کدام برنمی‌گردانند.

  - level: hard
    stem: |
      در کدام گزینه دستور آخر `3,1,2` را چاپ می‌کند (یعنی آرایه‌ی `arr` دست‌نخورده می‌ماند)؟
    check: option-output
    code: |
      const arr = [3, 1, 2];
    prelude: |
      const arr = [3, 1, 2];
    expect: "3,1,2"
    options:
      - code: 'arr.sort(); console.log(arr.join());'
      - code: 'arr.reverse(); console.log(arr.join());'
      - code: 'const sorted = arr.slice().sort(); console.log(arr.join());'
      - code: 'arr.splice(0, 1); console.log(arr.join());'
    answer: 3
    explain: |
      `arr.slice()` یک **کپی** می‌سازد و `sort` فقط همان کپی را مرتب می‌کند؛ پس `arr` همان `3,1,2` می‌ماند. سه گزینه‌ی دیگر متدهای **mutating** را مستقیم روی `arr` صدا می‌زنند: `sort` آن را `1,2,3` می‌کند، `reverse` آن را `2,1,3` و `splice(0, 1)` عضو اول را حذف می‌کند و `1,2` می‌ماند.

  - level: hard
    stem: |
      کدام دستور `[ 1, 4, 21, 30, 100000 ]` را چاپ می‌کند؟
    check: option-output
    code: |
      const nums = [1, 100000, 21, 30, 4];
    prelude: |
      const nums = [1, 100000, 21, 30, 4];
    expect: "[1, 4, 21, 30, 100000]"
    options:
      - code: 'console.log(nums.sort());'
      - code: 'console.log(nums.sort((a, b) => b - a));'
      - code: 'console.log(nums.reverse());'
      - code: 'console.log(nums.sort((a, b) => a - b));'
    answer: 4
    explain: |
      فقط تابع مقایسه‌ی `(a, b) => a - b` مقایسه‌ی **عددی صعودی** انجام می‌دهد. `sort()` بدون تابع مقایسه رشته‌ای مقایسه می‌کند و همان ترتیب میم اسلاید ۲۱ یعنی `[1, 100000, 21, 30, 4]` را نگه می‌دارد. `b - a` نزولی مرتب می‌کند و `reverse` اصلاً مرتب نمی‌کند، فقط ترتیب فعلی را برعکس می‌کند: `[4, 30, 21, 100000, 1]`.

  - level: hard
