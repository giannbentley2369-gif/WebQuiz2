      خروجی کد زیر چیست؟
    check: output
    code: |
      const nums = [1, 2, 3, 4];
      const result = nums.map(n => {
        if (n % 2 === 0) return n * 10;
      });
      console.log(result);
    options:
      - out: "[undefined, 20, undefined, 40]"
      - out: "[20, 40]"
      - out: "[1, 20, 3, 40]"
      - out: "[false, 20, false, 40]"
    answer: 1
    explain: |
      `map` همیشه آرایه‌ای **هم‌طول** می‌سازد و برای هر عضو، **هر چه callback برگرداند** را می‌گذارد. برای عددهای فرد شرط برقرار نیست و callback به انتها می‌رسد بدون این‌که چیزی برگرداند، پس `undefined`. گزینه‌ی ۲ کار ترکیب `filter` و `map` است؛ `map` نمی‌تواند عضو حذف کند. گزینه‌ی ۳ فرض کرده عضوهای بی‌جواب دست‌نخورده می‌مانند و گزینه‌ی ۴ فکر کرده جوابِ شرط برگردانده می‌شود.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const arr = [1, 2, 3];
      const r = arr.forEach((n, i, a) => {
        a[i] = n * n;
      });
      console.log(arr, r);
    options:
      - out: "[1, 2, 3] undefined"
      - out: "[1, 4, 9] [1, 4, 9]"
      - out: "[1, 2, 3] [1, 4, 9]"
      - out: "[1, 4, 9] undefined"
    answer: 4
    explain: |
      پارامتر سوم callback (`a`) **همان آرایه‌ی** `arr` است (reference)، پس `a[i] = n * n` خانه‌های خودِ `arr` را درجا عوض می‌کند و `arr` می‌شود `[1, 4, 9]` (رد گزینه‌های ۱ و ۳). `forEach` خودش آرایه را تغییر نمی‌دهد، ولی callback ما می‌تواند. خروجی `forEach` هم همیشه `undefined` است (رد گزینه‌ی ۲).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const found = [];
      [5, 8, 12, 3].forEach(n => {
        if (n > 10) return;
        found.push(n);
      });
      console.log(found);
    options:
      - out: "[5, 8, 3]"
      - out: "[5, 8]"
      - out: "[12]"
      - out: "[5, 8, 12, 3]"
    answer: 1
    explain: |
      `return` داخل callback فقط **همان یک فراخوانی** را تمام می‌کند (مثل `continue`)؛ پس `12` رد می‌شود ولی `forEach` به عضو بعدی یعنی `3` می‌رود و آن را هم اضافه می‌کند. گزینه‌ی ۲ فرض کرده `return` کل `forEach` را متوقف می‌کند (مثل `break`)، گزینه‌ی ۳ شرط را برعکس خوانده و گزینه‌ی ۴ اثر `return` را نادیده گرفته است.

  - level: hard
    stem: |
      اجرای کد زیر در کدام خط با خطا متوقف می‌شود؟
    check: error-line
    errorName: TypeError
    code: |
      const words = ["a", "b", "a"];
      const count = words.reduce((acc, w) => {
        acc[w] = (acc[w] || 0) + 1;
      }, {});
      console.log(count);
    options:
      - line: 2
      - line: 3
      - line: 5
      - line: 0
    answer: 2
    explain: |
      دور اول درست اجرا می‌شود (`acc` همان `{}` است)، ولی callback چیزی **برنمی‌گرداند**؛ پس `acc` در دور دوم `undefined` است و خواندن `acc[w]` در خط ۳ خطای `TypeError: Cannot read properties of undefined (reading 'b')` می‌دهد. به خط ۵ نمی‌رسیم و «بدون خطا» هم درست نیست. راه درست: بعد از خط ۳ بنویس `return acc;`.
