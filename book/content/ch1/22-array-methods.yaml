id: ch1-array-methods
title: "متدهای forEach، map، filter، find، findIndex و reduce"
slides: "Introduction to JS، اسلایدهای ۲۱ و ۴۶ تا ۴۹"
lesson: |
  در درس قبل با `push`، `pop`، `shift` و `unshift` عضو اضافه و کم کردیم. حالا به ابزارهایی می‌رسیم که احتمالاً بیشترین تست‌های کوییز از آن‌ها طرح می‌شود: متدهایی که روی **همه‌ی عضوهای** آرایه راه می‌روند و با هر عضو کاری انجام می‌دهند: `forEach`، `map`، `filter`، `find`، `findIndex` و `reduce` (اسلایدهای ۴۶ و ۴۷). بعد مثال اسلاید ۴۸ و فعالیت کلاسی اسلاید ۴۹ را کامل حل می‌کنیم و در آخر سراغ `sort` و میم معروف اسلاید ۲۱ می‌رویم.

  ### پیش‌نیاز: callback یعنی چه؟
  همه‌ی این متدها یک **تابع** را به‌عنوان ورودی می‌گیرند. به تابعی که به یک تابع (یا متد) دیگر می‌دهیم تا **خودش** آن را صدا بزند، **callback** (تابعِ فراخوانی‌شونده) می‌گوییم. متد، callback ما را **برای هر عضو یک بار** و به ترتیب صدا می‌زند و هر بار سه چیز به آن می‌دهد:

  1. **element**: خودِ عضو؛
  2. **index**: اندیس آن عضو؛
  3. **array**: کل آرایه.

  ```js
  const fruits = ["apple", "kiwi"];
  fruits.forEach((fruit, index, arr) => {
    console.log(index, fruit, arr.length); // 0 apple 2, then 1 kiwi 2
  });
  ```

  بیشتر وقت‌ها فقط پارامتر اول را لازم داریم و بقیه را نمی‌نویسیم. ترتیب پارامترها مهم است، نه نامشان. callbackها را معمولاً با **arrow function** (تابع پیکانی؛ جزئیاتش در درس arrow functionها) می‌نویسیم:

  | نوشتار | یعنی |
  |---|---|
  | `n => n * 2` | تابعی که `n` را می‌گیرد و `n * 2` را **برمی‌گرداند** (بدون آکولاد، `return` خودکار است) |
  | `(acc, n) => acc + n` | وقتی دو پارامتر یا بیشتر داریم، پرانتز لازم است |
  | `n => { return n * 2; }` | با آکولاد (بدنه‌ی بلوکی)، `return` را **باید** خودت بنویسی |

  ::: analogy کارخانه‌ی آرایه‌ها
  آرایه را مثل یک **نوار نقاله** پر از جعبه تصور کن:

  - `forEach` یک **بازرس** است که سراغ تک‌تک جعبه‌ها می‌رود و کاری انجام می‌دهد (مثلاً چیزی یادداشت می‌کند)، ولی هیچ محصول تازه‌ای تحویل نمی‌دهد.
  - `map` یک **دستگاه تبدیل** است: هر جعبه وارد می‌شود و یک جعبه‌ی **تازه** روی نوار نقاله‌ی دیگری بیرون می‌آید؛ تعداد جعبه‌ها همان است.
  - `filter` یک **الک** است: فقط جعبه‌هایی که از آزمون رد می‌شوند روی نوار جدید می‌روند.
  - `find` یک **کارآگاه** است: به اولین جعبه‌ای که با مشخصات جور است برسد، همان را برمی‌دارد و بقیه را نگاه نمی‌کند.
  - `reduce` یک **مخلوط‌کن** است: همه‌ی جعبه‌ها را یکی‌یکی داخلش می‌ریزی و در آخر **یک** چیز تحویل می‌گیری (مثلاً یک عدد یا یک شیء).
  :::

  ### `forEach`: برای هر عضو یک کار انجام بده (اسلاید ۴۶)
  اسلاید ۴۶: `forEach` تابع داده‌شده را **برای هر عضو** اجرا می‌کند.

  ```js
  const nums = [1, 2, 3];
  const result = nums.forEach(n => console.log(n * 10)); // prints 10, 20, 30
  console.log(result); // undefined -> forEach always returns undefined
  ```

  - `forEach` همیشه `undefined` برمی‌گرداند و هر چه callback برگرداند نادیده گرفته می‌شود؛ پس برای «ساختن» چیزی از خروجی‌اش استفاده نکن.
  - `forEach` را **نمی‌توان** با `break` متوقف کرد: `break` فقط داخل حلقه معنا دارد و نوشتنش داخل callback خطای `SyntaxError` می‌دهد. `return` داخل callback هم فقط **همان یک فراخوانی** را تمام می‌کند و `forEach` سراغ عضو بعدی می‌رود؛ یعنی مثل `continue` عمل می‌کند:

  ```js
  [1, 2, 3, 4].forEach(n => {
    if (n === 2) return; // ends ONLY this call, like "continue"
    console.log(n);      // 1, then 3, then 4
  });
  ```

  اسلاید ۴۶ کنار این متدها `for...of` را هم آورده (درس قبل)؛ اگر لازم است وسط کار متوقف شوی، `for...of` با `break` بهترین انتخاب است (یا `find` و `some` که خودشان زود متوقف می‌شوند).

  ### `map`: هر عضو را به یک عضو جدید تبدیل کن (اسلاید ۴۷)
  اسلاید ۴۷ درباره‌ی `map` سه نکته می‌گوید:

  - هر عضو را به یک عضو تازه **تبدیل** می‌کند و نتیجه را در یک آرایه‌ی **جدید** برمی‌گرداند؛
  - آرایه‌ی **اصلی را تغییر نمی‌دهد**؛
  - اغلب برای **قالب‌بندی** (formatting) یا **محاسبه** به کار می‌رود.

  ```js
  const prices = [100, 250, 40];
  const doubled = prices.map(p => p * 2);   // calculation
  const labels = prices.map(p => p + " $"); // formatting
  console.log(doubled); // [ 200, 500, 80 ]
  console.log(labels);  // [ '100 $', '250 $', '40 $' ]
  console.log(prices);  // [ 100, 250, 40 ] (unchanged)
  ```

  قانون طلایی `map`: **هر چه callback برگرداند، عضوِ آرایه‌ی جدید می‌شود** و طول آرایه‌ی جدید **همیشه برابر** طول آرایه‌ی اصلی است (یک خروجی به ازای هر ورودی). پس اگر callback چیزی برنگرداند، آن خانه `undefined` می‌شود:

  ```js
  const nums = [1, 2, 3];
  console.log(nums.map(n => n * 2));                    // [ 2, 4, 6 ] (no braces: automatic return)
  console.log(nums.map(n => { return n * 2; }));        // [ 2, 4, 6 ] (braces + return)
  console.log(nums.map(n => { n * 2; }));               // [ undefined, undefined, undefined ] (forgot return!)
  console.log(nums.map(n => { if (n > 1) return n; })); // [ undefined, 2, 3 ] (map cannot skip elements)
  ```

  `map` نمی‌تواند عضوی را «جا بیندازد»؛ برای حذف عضوها `filter` لازم است.

  #### برگرداندن یک شیء از arrow function: پرانتز لازم است
  اگر بلافاصله بعد از `=>` آکولاد بیاید، JavaScript آن را **بدنه‌ی تابع** می‌فهمد، نه یک object literal. برای برگرداندن شیء، آن را در **پرانتز** بگذار:

  ```js
  const ids = [1, 2];
  console.log(ids.map(id => ({ id }))); // [ { id: 1 }, { id: 2 } ]
  console.log(ids.map(id => { id }));   // [ undefined, undefined ] -> { } was a function body!
  ```

  در خط دوم، `{ id }` یک بدنه‌ی تابع است که فقط عبارت `id` را حساب می‌کند و چیزی برنمی‌گرداند. همین نکته دلیل پرانتزهای `({ ...s, passed: ... })` در اسلاید ۴۸ است.

  ### `filter`: فقط عضوهایی که شرط را دارند (اسلاید ۴۶)
  اسلاید ۴۶: `filter` فقط عضوهایی را **نگه می‌دارد** که با یک شرط جور باشند. callback برای هر عضو یک جواب «درست یا نادرست» برمی‌گرداند؛ اگر جواب truthy باشد (یعنی در شرط مثل `true` رفتار کند)، عضو در آرایه‌ی جدید می‌ماند.

  ```js
  const nums = [1, 2, 3, 4, 5, 6];
  console.log(nums.filter(n => n % 2 === 0));         // [ 2, 4, 6 ]
  console.log(nums.filter(n => n > 10));              // [] (no match: an EMPTY array, not undefined)
  console.log([0, 1, "", "hi", null].filter(v => v)); // [ 1, 'hi' ] (keeps truthy values)
  console.log(nums);                                  // [ 1, 2, 3, 4, 5, 6 ] (unchanged)
  ```

  - خروجی `filter` همیشه یک آرایه‌ی **جدید** است، با طول **کمتر یا مساوی** آرایه‌ی اصلی؛ اگر هیچ عضوی جور نباشد، `[]`.
  - خودِ عضوها عوض نمی‌شوند، فقط انتخاب می‌شوند. خروجی callback فقط تعیین می‌کند «بماند یا نماند»؛ برای همین `[0, 1, 2].filter(n => n * 2)` حاصل `[1, 2]` را می‌دهد، نه عددهای دوبرابرشده را!

  ### `find` و `findIndex`: اولین عضوی که شرط را دارد (اسلاید ۴۶)
  اسلاید ۴۶: `find` / `findIndex` **اولین عضوی** را که با شرط جور است (یا **اندیس** آن را) می‌دهند.

  ```js
  const users = [
    { name: "Ali", age: 17 },
    { name: "Sara", age: 22 },
    { name: "Reza", age: 30 },
  ];
  console.log(users.find(u => u.age > 18));          // { name: 'Sara', age: 22 } (only the FIRST match)
  console.log(users.findIndex(u => u.age > 18));     // 1
  console.log(users.filter(u => u.age > 18).length); // 2 (filter returns ALL matches)
  console.log(users.find(u => u.age > 50));          // undefined (no match)
  console.log(users.findIndex(u => u.age > 50));     // -1 (no match)
  ```

  | | `find` | `findIndex` | `filter` |
  |---|---|---|---|
  | خروجی | **خودِ** اولین عضوِ جور | **اندیسِ** اولین عضوِ جور | **آرایه‌ی** همه‌ی عضوهای جور |
  | اگر پیدا نشود | `undefined` | `-1` | `[]` |
  | بعد از اولین پیدا شدن | متوقف می‌شود | متوقف می‌شود | تا آخر می‌رود |

  `find` خودِ عضو را برمی‌گرداند، نه کپی آن را؛ پس اگر عضو یک شیء باشد و آن را تغییر دهی، شیءِ داخل آرایه هم تغییر می‌کند (یادت هست؟ شیءها با reference دست‌به‌دست می‌شوند).

  ### `reduce`: همه را به یک مقدار تبدیل کن (اسلاید ۴۷)
  اسلاید ۴۷ درباره‌ی `reduce` می‌گوید:

  - همه‌ی عضوها را **با هم ترکیب** می‌کند و **یک مقدار** تحویل می‌دهد؛
  - از یک **accumulator** (انباشتگر؛ «نتیجه‌ی تا این لحظه») به‌همراه **مقدار فعلی** (current value) استفاده می‌کند؛
  - برای **جمع**، **میانگین**، ساختن **شیء** و … مفید است.

  شکل کلی:

  ```js
  array.reduce((acc, current) => newAcc, initialValue);
  ```

  callback برای هر عضو یک بار اجرا می‌شود. `acc` نتیجه‌ی قبلی است و **هر چه callback برگرداند، `acc` دور بعد می‌شود**. `initialValue` مقدار `acc` در دور اول است و آخرین `acc` خروجیِ `reduce` است.

  ```js
  const total = [5, 10, 20].reduce((acc, n) => acc + n, 0);
  console.log(total); // 35
  ```

  | دور | `acc` | `n` | خروجی callback (یعنی `acc` دور بعد) |
  |---|---|---|---|
  | ۱ | `0` (مقدار اولیه) | `5` | `5` |
  | ۲ | `5` | `10` | `15` |
  | ۳ | `15` | `20` | `35` (خروجی نهایی) |

  #### با مقدار اولیه یا بدون آن؟
  اگر `initialValue` را ندهی، **اولین عضو** مقدار اولیه‌ی `acc` می‌شود و پیمایش از **عضو دوم** شروع می‌شود؛ یعنی callback یک بار کمتر اجرا می‌شود:

  ```js
  const sum = [5, 10, 20].reduce((acc, n) => {
    console.log(acc, n); // 5 10, then 15 20 (only two calls)
    return acc + n;
  });
  console.log(sum);      // 35
  ```

  اما روی آرایه‌ی **خالی** بدون مقدار اولیه، `reduce` چیزی برای شروع ندارد و خطا می‌دهد:

  ```js
  console.log([].reduce((acc, n) => acc + n, 0)); // 0 (just the initial value)
  console.log([].reduce((acc, n) => acc + n));    // TypeError: Reduce of empty array with no initial value
  ```

  **نوع مقدار اولیه هم مهم است**، چون نوع `acc` را تعیین می‌کند:

  ```js
  console.log([1, 2, 3, 4].reduce((acc, n) => acc + n, 0));  // 10
  console.log([1, 2, 3, 4].reduce((acc, n) => acc + n, "")); // "1234" (string + number = concatenation)
  ```

  قاعده‌ی عملی: همیشه مقدار اولیه بده؛ `0` برای جمع، `""` برای ساختن رشته، `{}` برای ساختن شیء و `[]` برای ساختن آرایه.

  #### میانگین و بیشینه
  ```js
  const scores = [18, 15, 20, 11];
  const sum = scores.reduce((acc, s) => acc + s, 0);
  console.log(sum / scores.length);                            // 16 (average = sum / count)
  console.log(scores.reduce((max, s) => (s > max ? s : max))); // 20 (the maximum)
  ```

  #### ساختن شیء با `reduce`: شمردن تکرارها
  ```js
  const votes = ["yes", "no", "yes", "yes"];
  const count = votes.reduce((acc, v) => {
    acc[v] = (acc[v] || 0) + 1; // first time: acc[v] is undefined, and (undefined || 0) is 0
    return acc;                 // never forget to return the accumulator!
  }, {});
  console.log(count); // { yes: 3, no: 1 }
  ```

  این‌جا `acc` یک شیء است که کلیدهایش رأی‌ها و مقدارهایش تعداد آن‌هاست (`acc[v]` با براکت، چون کلید داخل متغیر `v` است). اگر `return acc` را فراموش کنی، در دور دوم `acc` برابر `undefined` است و خواندن `acc[v]` خطای `TypeError` می‌دهد.

  ### مثال اسلاید ۴۸: `map` و `reduce` با هم
  ```js title=mapred.js
  const students = [{ name: "Alice", score: 85 }, { name: "Bob", score: 72 }];

  const scores = students.map(s => s.score);
  console.log("Scores:", scores);

  const total = scores.reduce((acc, s) => acc + s, 0);
  const average = total / scores.length;

  console.log("Total:", total);
  console.log("Average:", average);

  const results = students.map(s => ({
    ...s,
    passed: s.score >= 70
  }));

  console.log("Results:", results);
  ```

  خروجی در Node.js:

  ```text
  Scores: [ 85, 72 ]
  Total: 157
  Average: 78.5
  Results: [
    { name: 'Alice', score: 85, passed: true },
    { name: 'Bob', score: 72, passed: true }
  ]
  ```

  گام‌به‌گام:

  1. **استخراج یک فیلد با `map`**: `s => s.score` از هر شیءِ دانشجو فقط نمره‌اش را برمی‌گرداند؛ پس `scores` آرایه‌ی `[85, 72]` است.
  2. **جمع با `reduce`**: با مقدار اولیه‌ی `0`: اول `0 + 85 = 85` و بعد `85 + 72 = 157`.
  3. **میانگین**: `157 / 2 = 78.5` (`scores.length` برابر `2` است و تقسیم در JavaScript اعشاری است).
  4. **ساختن شیءهای جدید با `map` و spread**: برای هر دانشجو یک شیء **تازه** ساخته می‌شود؛ `...s` (spread؛ درس شیءها) همه‌ی propertyهای `s` (یعنی `name` و `score`) را در شیء جدید کپی می‌کند و بعد `passed` به آن اضافه می‌شود. `s.score >= 70` یک boolean است: `85 >= 70` و `72 >= 70` هر دو `true` هستند، پس هر دو دانشجو قبول‌اند.
  5. **پرانتز دور شیء**: بدون پرانتز (`s => { ...s, passed: ... }`) آکولاد بدنه‌ی تابع حساب می‌شد و این کد اصلاً اجرا نمی‌شد (`SyntaxError`).
  6. آرایه‌ی `students` دست‌نخورده است و عضوهایش `passed` ندارند؛ `results` شیءهای **جدید** دارد. Node.js آرایه‌ی `results` را چون طولانی است در چند خط چاپ می‌کند.

  ### فعالیت کلاسی اسلاید ۴۹
  سؤال اسلاید: «خروجی این کد را پیش‌بینی کن. وضعیت عضوهای `nums` را در هر مرحله دنبال کن و صریحاً بگو چه اتفاقی برایشان می‌افتد.»

  ```js lines title=arraymethods.js
  const nums = [1, 2, 3, 4];

  nums.push(5);
  nums.pop();

  nums.unshift(0);
  nums.shift();

  const doubled = nums.map(n => n * 2);

  const evens = nums.filter(n => n % 2 === 0);

  nums.forEach(n => console.log(n));

  console.log(nums.find(n => n > 2));
  console.log(nums.findIndex(n => n > 2));
  ```

  | خط | دستور | مقدار برگشتی | `nums` بعد از این خط |
  |---|---|---|---|
  | ۱ | `const nums = [1, 2, 3, 4]` | — | `[1, 2, 3, 4]` |
  | ۳ | `nums.push(5)` | `5` (طول جدید) | `[1, 2, 3, 4, 5]` |
  | ۴ | `nums.pop()` | `5` (عضو حذف‌شده) | `[1, 2, 3, 4]` |
  | ۶ | `nums.unshift(0)` | `5` (طول جدید) | `[0, 1, 2, 3, 4]` |
  | ۷ | `nums.shift()` | `0` (عضو حذف‌شده) | `[1, 2, 3, 4]` |
  | ۹ | `nums.map(n => n * 2)` | آرایه‌ی جدید `[2, 4, 6, 8]` در `doubled` | `[1, 2, 3, 4]` (بدون تغییر) |
  | ۱۱ | `nums.filter(n => n % 2 === 0)` | آرایه‌ی جدید `[2, 4]` در `evens` | `[1, 2, 3, 4]` (بدون تغییر) |
  | ۱۳ | `nums.forEach(n => console.log(n))` | `undefined` (و چاپ `1`، `2`، `3`، `4`) | `[1, 2, 3, 4]` |
  | ۱۵ | `nums.find(n => n > 2)` | `3` (چاپ می‌شود) | `[1, 2, 3, 4]` |
  | ۱۶ | `nums.findIndex(n => n > 2)` | `2` (چاپ می‌شود) | `[1, 2, 3, 4]` |

  **خروجی نهایی** (هر عدد در یک خط): `1`، `2`، `3`، `4`، `3`، `2`.

  نکته‌های این فعالیت:

  - چهار متد اول `nums` را **درجا تغییر می‌دهند**، ولی اثرشان همدیگر را خنثی می‌کند (`push` با `pop`، و `unshift` با `shift`) و `nums` به `[1, 2, 3, 4]` برمی‌گردد.
  - `map` و `filter` آرایه‌ی **جدید** می‌سازند و `nums` را تغییر نمی‌دهند. `doubled` و `evens` ساخته می‌شوند ولی هیچ‌جا چاپ نمی‌شوند؛ پس در خروجی اثری ندارند.
  - `forEach` هر عضو را در یک خط چاپ می‌کند و خودش `undefined` برمی‌گرداند.
  - `find` **اولین عضوِ** بزرگ‌تر از ۲ یعنی `3` را می‌دهد و `findIndex` **اندیسِ** همان عضو یعنی `2` را. اگر کسی فکر کند `map` آرایه‌ی `nums` را دوبرابر کرده، به اشتباه `2`، `4`، `6`، `8` و بعد `4` و `1` را جواب می‌دهد.

  ### زنجیر کردن متدها (chaining)
  چون `map` و `filter` آرایه برمی‌گردانند، می‌شود متد بعدی را مستقیم روی نتیجه‌شان صدا زد:

  ```js
  const orders = [120, 40, 300, 80];
  const total = orders
    .filter(p => p >= 100)           // [ 120, 300 ]
    .map(p => p - 20)                // [ 100, 280 ] (a discount of 20)
    .reduce((sum, p) => sum + p, 0); // 380
  console.log(total);                // 380
  ```

  هر متد روی **خروجیِ متد قبلی** کار می‌کند، نه روی آرایه‌ی اصلی. `forEach` چون `undefined` برمی‌گرداند، فقط می‌تواند **آخرِ** زنجیر بیاید.

  ### مقایسه‌ی `map`، `forEach` و `reduce` (و بقیه)
  | متد | callback چه برمی‌گرداند؟ | خروجی متد | کاربرد |
  |---|---|---|---|
  | `forEach` | مهم نیست (نادیده گرفته می‌شود) | همیشه `undefined` | یک کار برای هر عضو (چاپ، ارسال، …) |
  | `map` | عضو جدید | آرایه‌ی **جدید** با **همان طول** | تبدیل هر عضو (قالب‌بندی، محاسبه) |
  | `filter` | شرط (truthy یا falsy) | آرایه‌ی **جدید** با طول کمتر یا مساوی | نگه داشتن عضوهای جور |
  | `find` | شرط | **اولین** عضو جور یا `undefined` | پیدا کردن یک عضو |
  | `findIndex` | شرط | اندیس اولین عضو جور یا `-1` | پیدا کردن جای یک عضو |
  | `reduce` | `acc` جدید | **یک** مقدار از هر نوعی | جمع، میانگین، ساختن شیء |
  | `some` / `every` | شرط | `true` یا `false` | «آیا حداقل یکی / همه جورند؟» |

  ::: tip سه سؤال برای انتخاب متد
  - فقط می‌خواهی برای هر عضو کاری انجام دهی و نتیجه‌ای لازم نداری؟ `forEach`.
  - آرایه‌ای **هم‌اندازه** با عضوهای تبدیل‌شده می‌خواهی؟ `map`. آرایه‌ای با **بعضی** از عضوها؟ `filter`.
  - **یک** مقدار می‌خواهی (عدد، رشته یا شیء)؟ `reduce`. فقط یک عضو را می‌خواهی؟ `find`.
  :::

  ### جدول بزرگ: کدام متدها آرایه‌ی اصلی را تغییر می‌دهند؟
  | تغییر **می‌دهند** (mutating) | چه برمی‌گردانند؟ |
  |---|---|
  | `push`، `unshift` | طول جدید |
  | `pop`، `shift` | عضو حذف‌شده |
  | `splice` | آرایه‌ای از عضوهای حذف‌شده |
  | `sort`، `reverse` | **همان** آرایه (مرتب‌شده / برعکس‌شده) |

  | تغییر **نمی‌دهند** (non-mutating) | چه برمی‌گردانند؟ |
  |---|---|
  | `map`، `filter`، `slice`، `concat` | آرایه‌ی **جدید** |
  | `find` / `findIndex` | عضو / اندیس (یا `undefined` / `-1`) |
  | `reduce` | یک مقدار |
  | `join` | رشته |
  | `includes`، `some`، `every` | `true` یا `false` |
  | `forEach` | `undefined` |

  متدهای non-mutating **خودشان** آرایه را عوض نمی‌کنند، ولی **callbackِ تو** می‌تواند: اگر عضوها شیء باشند و داخل `map` یا `forEach` بنویسی `item.qty = 10`، همان شیءهای داخل آرایه‌ی اصلی تغییر می‌کنند (چون شیءها با reference دست‌به‌دست می‌شوند). برای همین در اسلاید ۴۸ با `{ ...s }` شیء **جدید** ساخته شد.

  ### `sort`: هم آرایه را تغییر می‌دهد، هم به‌طور پیش‌فرض رشته‌ای مقایسه می‌کند (اسلاید ۲۱)
  میم اسلاید ۲۱ را یادت هست؟ کسی که تازه JavaScript یاد می‌گیرد می‌گوید: «با `array.sort()` این لیست عددها را مرتب می‌کنم!» و JavaScript با خنده جواب می‌دهد: `[1, 100000, 21, 30, 4]`.

  دلیلش را در درس تبدیل نوع ضمنی دیدیم: `sort()` بدون **تابع مقایسه** (compare function) عضوها را به **رشته** تبدیل می‌کند و حرف‌به‌حرف، مثل کلمه‌های لغت‌نامه، مقایسه می‌کند؛ `"100000"` قبل از `"21"` می‌آید چون `"1"` از `"2"` کوچک‌تر است. دو نکته‌ی مهم دیگر: `sort` آرایه‌ی **اصلی** را تغییر می‌دهد و **همان آرایه** را برمی‌گرداند.

  ```js
  const nums = [4, 30, 1, 100000, 21];
  const sorted = nums.sort();
  console.log(sorted);          // [ 1, 100000, 21, 30, 4 ] (compared as strings!)
  console.log(sorted === nums); // true (sort changed nums itself and returned it)

  nums.sort((a, b) => a - b);   // numeric, ascending
  console.log(nums);            // [ 1, 4, 21, 30, 100000 ]

  const desc = [...nums].sort((a, b) => b - a); // sort a copy, so nums stays as it is
  console.log(desc);            // [ 100000, 30, 21, 4, 1 ]
  console.log(nums);            // [ 1, 4, 21, 30, 100000 ]
  ```

  تابع مقایسه دو عضو `a` و `b` را می‌گیرد: اگر حاصلش **منفی** باشد `a` جلوتر می‌آید، اگر **مثبت** باشد `b` جلوتر می‌آید و اگر **صفر** باشد ترتیبشان عوض نمی‌شود. پس `(a, b) => a - b` صعودی و `(a, b) => b - a` نزولی مرتب می‌کند. برای شیءها با یک فیلد مقایسه می‌کنیم: `students.sort((a, b) => b.score - a.score)` دانشجوها را از نمره‌ی بیشتر به کمتر مرتب می‌کند.

  ::: info بیشتر بدانیم: نسخه‌های بدون تغییر
  نسخه‌های جدیدتر JavaScript (ES2023) متدهای `toSorted()` و `toReversed()` را دارند که مثل `sort` و `reverse` کار می‌کنند، ولی آرایه‌ی **جدید** برمی‌گردانند و به آرایه‌ی اصلی دست نمی‌زنند. در کدهای قدیمی‌تر همین کار را با کپی کردن انجام می‌دهند: `[...arr].sort(...)` یا `arr.slice().sort(...)`.
  :::

  ### `some` و `every` (به‌طور خلاصه)
  ```js
  const ages = [16, 21, 30];
  console.log(ages.some(a => a < 18));  // true  -> at least ONE element matches (16)
  console.log(ages.every(a => a < 18)); // false -> NOT every element matches (21 fails)
  console.log(ages.every(a => a > 10)); // true  -> every element matches
  ```

  `some` به اولین جواب `true` که برسد متوقف می‌شود و `every` به اولین جواب `false`. روی آرایه‌ی خالی، `some` همیشه `false` و `every` همیشه `true` است.

  ::: tip نکته
  - callbackها سه ورودی می‌گیرند: `(element, index, array)`؛ ترتیبشان مهم است، نه نامشان.
  - `map` همیشه آرایه‌ای **هم‌طول** برمی‌گرداند، `filter` آرایه‌ای کوتاه‌تر یا مساوی، `find` یک عضو و `reduce` یک مقدار.
  - `find`، `findIndex`، `some` و `every` زود متوقف می‌شوند؛ `forEach`، `map` و `filter` تا آخر می‌روند.
  - برای مرتب‌سازی عددی همیشه تابع مقایسه بده: `(a, b) => a - b`.
  :::

  ::: trap دام‌های تستی متدهای آرایه
  - `forEach` همیشه `undefined` برمی‌گرداند؛ در `const r = arr.forEach(...)` مقدار `r` برابر `undefined` است.
  - `break` داخل callbackِ `forEach` خطای `SyntaxError` می‌دهد و `return` فقط همان دور را رد می‌کند.
  - `map` با بدنه‌ی آکولاددار و بدون `return`، آرایه‌ای پر از `undefined` می‌سازد؛ و `map` هیچ‌وقت عضوی را حذف نمی‌کند.
  - برای برگرداندن شیء از arrow function پرانتز لازم است: `x => ({ ... })`.
  - `find` اگر پیدا نکند `undefined` می‌دهد و `findIndex` عدد `-1`. `find` خودِ عضو را می‌دهد، `filter` یک آرایه.
  - `reduce` بدون مقدار اولیه از عضو اول شروع می‌کند و روی آرایه‌ی خالی `TypeError` می‌دهد. مقدار اولیه‌ی `""` جمع را به چسباندن رشته‌ای تبدیل می‌کند.
  - در `reduce` فراموش کردن `return acc` یعنی `acc` در دور بعد `undefined` است.
  - `sort()` بدون تابع مقایسه عددها را رشته‌ای مرتب می‌کند (`[1, 100000, 21, 30, 4]`) و آرایه‌ی اصلی را هم تغییر می‌دهد.
  - `map`، `filter`، `slice` و `reduce` آرایه را تغییر نمی‌دهند؛ `push`، `pop`، `shift`، `unshift`، `splice`، `sort` و `reverse` تغییر می‌دهند.
  :::

  ::: summary
  - `forEach`: یک کار برای هر عضو؛ خروجی `undefined`.
  - `map`: تبدیل؛ آرایه‌ی جدیدِ هم‌طول. `filter`: انتخاب؛ آرایه‌ی جدیدِ کوتاه‌تر یا مساوی.
  - `find` / `findIndex`: اولین عضو جور / اندیسش (`undefined` / `-1` اگر نباشد).
  - `reduce`: ترکیب همه در یک مقدار با `acc` و مقدار فعلی؛ همیشه مقدار اولیه بده.
  - `sort`، `reverse` و `splice` و چهار متد درس قبل آرایه را تغییر می‌دهند؛ بقیه نه.
  :::
