    explain: |
      `[]` به `""` و `{}` به `"[object Object]"` تبدیل می‌شوند و `+` آن‌ها را می‌چسباند: `"[object Object]"`. `[] + []` برابر رشته‌ی **خالی** `""` است، نه `"[]"` (گزینه‌ی ۱). در `[] + 1` یک طرف (بعد از تبدیل) رشته‌ی `""` است، پس حاصل رشته‌ی `"1"` است، نه عدد `1` (گزینه‌ی ۲). و `-` همیشه عددی است: `0 - 0 = 0`، نه رشته‌ی خالی (گزینه‌ی ۴).

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
