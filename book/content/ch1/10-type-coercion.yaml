    explain: |
      طبق قانون ویژه، `null` در `==` فقط با `undefined` (و خودش) برابر است؛ نه با `0` و نه با `false`. پس `null == false` برابر `false` است و گزینه‌ی ۴ نادرست است، هرچند `null` falsy است. سه گزینه‌ی دیگر درست‌اند: `null == 0` و `undefined == 0` هر دو به خاطر همین قانون ویژه `false` هستند و `NaN` با هیچ چیز، حتی خودش، برابر نیست.

