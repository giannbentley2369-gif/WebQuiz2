    explain: |
      `"0"` رشته‌ای غیرخالی است، پس truthy است (`true`)؛ اما در `"0" == false` اول `false -> 0` و بعد `"0" -> 0`، پس `true`. `null` falsy است (`false`)، ولی `==` برای `null` قانون ویژه دارد و `null` فقط با `undefined` برابر است، پس `null == false` برابر `false` است. گزینه‌های ۲ و ۴ رشته‌ی `"0"` را falsy گرفته‌اند و گزینه‌های ۲ و ۳ فکر کرده‌اند هر مقدار falsy با `false` برابر است.

