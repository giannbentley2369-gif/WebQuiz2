id: ch1-coercion
title: "تبدیل نوع ضمنی (Type coercion) و دام‌هایش"
slides: "Introduction to JS، اسلایدهای ۲۰ تا ۲۲"
lesson: |
  ### از میم «`1 + 1`» (اسلاید ۱۸) تا type coercion
  میم اسلاید ۱۸ را در درس «عملگرهای حسابی و انتساب» دیدیم: رئیس می‌پرسد «`1 + 1` چند می‌شود؟»؛ Python و C++ می‌گویند `2`، JavaScript می‌گوید `11` و از پنجره بیرون انداخته می‌شود! در واقع در JavaScript هم `1 + 1` برابر `2` است. جوابِ `"11"` فقط وقتی پیدا می‌شود که یکی از دو طرف **رشته** باشد (`"1" + 1`): JavaScript به جای خطا دادن، بی‌صدا عدد را به رشته تبدیل می‌کند و دو رشته را به هم می‌چسباند. در این درس می‌فهمیم این «تبدیل بی‌صدا»، یعنی **type coercion**، دقیقاً با چه قاعده‌هایی کار می‌کند.

  ```js
  console.log(1 + 1);   // 2
  console.log("1" + 1); // "11"  (the joke in the meme)
  ```

  ### Type coercion چیست؟
  طبق اسلاید ۲۲، **type coercion** (تبدیل نوع ضمنی؛ یعنی تبدیلی که خود JavaScript بدون درخواست ما انجام می‌دهد) یعنی تبدیل **خودکار** یک نوع داده به نوعی دیگر، وقتی در یک عملیات مقدارهایی از **نوع‌های مختلف** شرکت دارند. این رفتار یکی از ویژگی‌های کلیدی **dynamic typing system** (سیستم نوع‌دهی پویا) در JavaScript است: متغیرها نوع ثابتی ندارند و موتور JavaScript سعی می‌کند حتی وقتی نوع دو طرف عملیات یکی نیست، «یک معنایی» برای آن پیدا کند.

  ::: analogy
  JavaScript مثل گارسونی است که هیچ‌وقت نمی‌گوید «نداریم»: اگر چیزی سفارش بدهی که دقیقاً در منو نیست، نزدیک‌ترین چیزی را که به ذهنش می‌رسد می‌آورد. Python در همین موقعیت می‌گوید «این سفارش معنا ندارد» (برای `"1" + 1` خطای `TypeError` می‌دهد). برای همین باید قاعده‌های «حدس زدنِ» JavaScript را دقیق بلد باشی.
  :::

  در درس قبل (Casting) دیدیم که خودمان می‌توانیم صریحاً با `Number()`، `String()` و `Boolean()` نوع را عوض کنیم. type coercion همان تبدیل‌هاست، با این فرق که JavaScript **خودش** و بی‌صدا انجامشان می‌دهد. شش قاعده‌ی زیر تقریباً همه‌ی تست‌ها را پوشش می‌دهند.

  ### قاعده‌ی ۱: `+` با یک رشته یعنی چسباندن
  اسلاید ۲۲: `String + Anything -> String`؛ یعنی اگر **حداقل یکی** از دو طرف `+` رشته باشد، طرف دیگر هم به رشته تبدیل می‌شود و دو رشته به هم چسبانده می‌شوند (concatenation):

  ```js
  console.log("5" + 1);         // "51"  (slide 21: concatenation instead of math)
  console.log('10' + 5);        // "105" (slide 22)
  console.log("5" + true);      // "5true"
  console.log("x" + null);      // "xnull"
  console.log("x" + undefined); // "xundefined"
  ```

  اگر **هیچ‌کدام** از دو طرف رشته نباشد، `+` جمع ریاضی است و boolean، `null` و `undefined` به عدد تبدیل می‌شوند (`true -> 1`، `false -> 0`، `null -> 0`، `undefined -> NaN`):

  ```js
  console.log(true + true);   // 2   (slide 21: booleans become numbers)
  console.log(true + 1);      // 2
  console.log(null + 1);      // 1   (slide 21: null -> 0)
  console.log(undefined + 1); // NaN (slide 21: undefined -> NaN)
  ```

  ### قاعده‌ی ۲: `-`، `*`، `/` و `%` همیشه عددی‌اند
  طبق اسلاید ۲۲، عملگرهای `-`، `*` و `/` در **Numeric Context** (بافت عددی) کار می‌کنند. این عملگرها برای رشته‌ها معنایی ندارند، پس JavaScript **همیشه** هر دو طرف را به عدد تبدیل می‌کند (همین‌طور `%` و `**`):

  ```js
  console.log("5" - 1);   // 4   (slide 20 question)
  console.log(2 * "3");   // 6   (slide 20)
  console.log('10' - 5);  // 5   (slide 22)
  console.log('10' * 2);  // 20  (slide 22)
  console.log("6" / "2"); // 3   (both strings become numbers)
  console.log("7" % 2);   // 1
  console.log("abc" - 1); // NaN ("abc" is not a valid number)
  ```

  تبدیل به عدد با همان قاعده‌های `Number()` درس قبل انجام می‌شود: `"" -> 0`، `"12px" -> NaN`، `null -> 0`، `undefined -> NaN`، `true -> 1`.

  | عبارت | نتیجه | چرا؟ |
  |---|---|---|
  | `"5" + 1` | `"51"` | یک طرف رشته است، پس چسباندن |
  | `"5" - 1` | `4` | `-` همیشه عددی است |
  | `2 * "3"` | `6` | `*` همیشه عددی است |
  | `true + true` | `2` | رشته‌ای در کار نیست، پس `1 + 1` |
  | `null + 1` | `1` | `null -> 0` |
  | `undefined + 1` | `NaN` | `undefined -> NaN` |
  | `"5" + null` | `"5null"` | یک طرف رشته است، پس چسباندن |

  ### قاعده‌ی ۳: از چپ به راست، دوبه‌دو
  `+` و `-` از چپ به راست و **دوبه‌دو** حساب می‌شوند و نوعِ نتیجه‌ی هر مرحله، قاعده‌ی مرحله‌ی بعد را تعیین می‌کند. (مثل ریاضی، `*` و `/` زودتر از `+` و `-` انجام می‌شوند و پرانتز از همه زودتر.)

  ```js
  console.log(1 + 2 + "3");   // "33"  -> 1 + 2 = 3, then 3 + "3" = "33"
  console.log("1" + 2 + 3);   // "123" -> "1" + 2 = "12", then "12" + 3 = "123"
  console.log("1" + (2 + 3)); // "15"  -> parentheses first: 2 + 3 = 5
  console.log(1 + "2" - 1);   // 11    -> 1 + "2" = "12", then "12" - 1 = 11
  console.log("3" + 4 * 5);   // "320" -> 4 * 5 = 20 first, then "3" + 20
  ```

  ### قاعده‌ی ۴: آرایه و شیء اول به مقدار ساده (primitive) تبدیل می‌شوند
  وقتی یک آرایه یا شیء در `+`، `-` یا `==` شرکت می‌کند، JavaScript اول آن را به یک **primitive** (مقدار ساده مثل رشته یا عدد) تبدیل می‌کند. برای آرایه‌ها و شیءهای معمولی این یعنی **رشته‌شان** (همان `String(x)` درس قبل). بعد قاعده‌های ۱ و ۲ اعمال می‌شوند:

  | مقدار | تبدیل به primitive |
  |---|---|
  | `[]` | `""` |
  | `[5]` | `"5"` |
  | `[1, 2]` | `"1,2"` |
  | `{}` | `"[object Object]"` |

  ```js
  console.log([] + []);   // ""   ("" + "") -> an empty line is printed
  console.log([] + {});   // "[object Object]" ("" + "[object Object]")
  console.log(1 + [2]);   // "12" (1 + "2")
  console.log([] - 1);    // -1   ("" -> 0, then 0 - 1)
  console.log([2] * [3]); // 6    ("2" * "3")
  ```

  ::: info بیشتر بدانیم: ماجرای `{} + []`
  اگر یک **دستور** با `{` شروع شود، JavaScript آن `{}` را یک «بلوک کد» خالی می‌فهمد، نه یک شیء؛ پس دستورِ تنهای `{} + []` در واقع همان `+[]` است و `0` می‌دهد. اما وقتی همین عبارت داخل یک عبارت دیگر بیاید، مثل `console.log({} + [])` یا `const r = {} + [];`، آن `{}` یک شیء است و نتیجه `"[object Object]"` می‌شود. در این کتاب، مگر خلافش گفته شود، هر عبارت «داخل یک عبارت» حساب می‌شود.
  :::

  ### قاعده‌ی ۵: الگوریتم `==` (تساوی سهل‌گیر)
  اسلاید ۲۲ سه مثال از coercion در مقایسه می‌آورد (خط آخر را ما اضافه کرده‌ایم):

  ```js
  console.log('5' == 5);           // true  (string -> number)
  console.log(false == 0);         // true  (boolean -> number)
  console.log(null == undefined);  // true  (special rule)
  console.log(null === undefined); // false (=== never converts)
  ```

  الگوریتم ساده‌شده‌ی `a == b` (به ترتیب بررسی کن):

  1. اگر نوع دو طرف **یکی** است، مثل `===` مقایسه کن (بدون تبدیل). `NaN` با هیچ چیز، حتی خودش، برابر نیست.
  2. **`null` و `undefined`** فقط با هم (و با خودشان) برابرند و با هیچ چیز دیگری، حتی `0`، `""` یا `false`، برابر نیستند (قانون ویژه).
  3. **عدد در برابر رشته:** رشته به عدد تبدیل می‌شود: `'5' == 5` یعنی `5 == 5`.
  4. اگر یک طرف **boolean** است، اول آن boolean به عدد تبدیل می‌شود (`true -> 1`، `false -> 0`) و مقایسه از نو بررسی می‌شود.
  5. **آرایه/شیء در برابر primitive:** آرایه/شیء به primitive تبدیل می‌شود (قاعده‌ی ۴) و مقایسه از نو بررسی می‌شود.
  6. **دو آرایه/شیء:** هیچ تبدیلی رخ نمی‌دهد؛ فقط وقتی برابرند که هر دو دقیقاً **همان یک** شیء باشند (`[] == []` برابر `false` است؛ در درس «عملگرهای مقایسه و منطقی» مفصل می‌بینیم).

  حالا دام‌های اسلاید ۲۱ و چند دام مشابه را قدم‌به‌قدم حل کنیم:

  | عبارت | مراحل | نتیجه |
  |---|---|---|
  | `[] == false` | `false -> 0`؛ سپس `[] -> "" -> 0`؛ پس `0 == 0` | `true` |
  | `[] == 0` | `[] -> "" -> 0`؛ پس `0 == 0` | `true` |
  | `"0" == false` | `false -> 0`؛ سپس `"0" -> 0`؛ پس `0 == 0` | `true` |
  | `true == "1"` | `true -> 1`؛ سپس `"1" -> 1`؛ پس `1 == 1` | `true` |
  | `true == "true"` | `true -> 1`؛ سپس `"true" -> NaN`؛ پس `1 == NaN` | `false` |
  | `"2" == true` | `true -> 1`؛ سپس `"2" -> 2`؛ پس `2 == 1` | `false` |
  | `null == 0` | قانون ویژه: `null` فقط با `undefined` برابر است | `false` |
  | `NaN == NaN` | `NaN` با هیچ چیز برابر نیست | `false` |

  عملگر `===` (تساوی سخت‌گیر) هیچ‌کدام از این مراحل را ندارد: اگر نوع دو طرف فرق کند، **بلافاصله** `false` می‌دهد. برای همین `[] === false`، `'5' === 5` و `null === undefined` همگی `false` هستند. توصیه‌ی اسلاید ۲۱: **`==` می‌تواند تبدیل‌های غیرمنتظره ایجاد کند، پس `===` را ترجیح بده.**

  ### قاعده‌ی ۶: `if` فقط truthy/falsy را می‌پرسد؛ `[] == false` ولی `if ([])` اجرا می‌شود!
  این تناقض ظاهری محبوب طراحان تست است. `if (x)` فقط می‌پرسد «`x` truthy است یا falsy؟» (همان `Boolean(x)` درس قبل) و آرایه‌ی خالی truthy است. اما `==` اصلاً سراغ truthy/falsy نمی‌رود؛ الگوریتم بالا را اجرا می‌کند که مقدارها را به سمت **عدد** می‌برد. دو سؤال متفاوت، دو جواب متفاوت:

  ```js
  const list = [];
  if (list) {
    console.log("list is truthy"); // this runs!
  }
  console.log(list == false);  // true
  console.log(list === false); // false
  ```

  | مقدار `x` | `Boolean(x)` (همان که `if` می‌پرسد) | `x == false` |
  |---|---|---|
  | `[]` | `true` | `true` |
  | `"0"` | `true` | `true` |
  | `" "` | `true` | `true` |
  | `""` | `false` | `true` |
  | `0` | `false` | `true` |
  | `null` | `false` | `false` |
  | `undefined` | `false` | `false` |
  | `NaN` | `false` | `false` |

  نتیجه‌ی عملی: هیچ‌وقت ننویس `if (x == false)`؛ اگر منظورت falsy بودن است بنویس `if (!x)`.

  ### میم اسلاید ۲۱: `sort()` روی عددها
  در میم اسلاید ۲۱، کسی که تازه JavaScript یاد می‌گیرد می‌گوید: «از `array.sort()` استفاده می‌کنم تا این لیست عددها را مرتب کنم!» و JavaScript (با تصویر خنده‌ی لئوناردو دی‌کاپریو) جواب می‌دهد: `[1, 100000, 21, 30, 4]`. سؤال اسلاید این است: «می‌توانی بگویی وقتی این اتفاق می‌افتد چه خبر است؟»

  **جواب:** `sort()` اگر **تابع مقایسه** نگیرد، عناصر را به **رشته** تبدیل می‌کند و مثل کلمه‌های یک لغت‌نامه، **حرف‌به‌حرف** مقایسه می‌کند (lexicographic order؛ ترتیب لغت‌نامه‌ای). `"100000"` قبل از `"21"` می‌آید، چون حرف اولش (`"1"`) از `"2"` کوچک‌تر است؛ و `"4"` آخر از همه است، چون از `"1"`، `"2"` و `"3"` بزرگ‌تر است. طول عدد اصلاً مهم نیست؛ درست مثل لغت‌نامه که «آبشار» را قبل از «ب» می‌آورد.

  ```js
  const nums = [4, 30, 1, 100000, 21];
  console.log(nums.sort());                // [ 1, 100000, 21, 30, 4 ]  (compared as strings)
  console.log(nums.sort((a, b) => a - b)); // [ 1, 4, 21, 30, 100000 ]  (numeric, ascending)
  console.log(nums.sort((a, b) => b - a)); // [ 100000, 30, 21, 4, 1 ]  (numeric, descending)
  ```

  راه درست، دادن یک **تابع مقایسه** (compare function) به `sort` است. `(a, b) => a - b` یک تابع کوتاه است (arrow function؛ در درس توابع می‌خوانیم) که دو عنصر را می‌گیرد: اگر حاصلش **منفی** باشد یعنی `a` باید جلوتر بیاید، اگر **مثبت** باشد `b` جلوتر می‌آید و اگر **صفر** باشد ترتیبشان مهم نیست. چون `-` همیشه عددی است (قاعده‌ی ۲)، این بار مقایسه‌ی عددی واقعی انجام می‌شود. برای ترتیب نزولی از `(a, b) => b - a` استفاده می‌کنیم. بقیه‌ی جزئیات `sort` را در درس «متدهای آرایه» می‌خوانیم.

  ### unary plus و معمای «baNaNa»
  `+` اگر فقط **یک** عملوند داشته باشد (unary plus)، کارش تبدیل به عدد است: `+"3"` می‌شود `3` و `+"a"` می‌شود `NaN`. اولویت این عملگر از `+` دوعملوندی بالاتر است. حالا معمای معروف:

  ```js
  console.log("b" + "a" + +"a" + "a"); // "baNaNa"
  // +"a"          -> NaN      (unary plus: "a" is not a number)
  // "b" + "a"     -> "ba"
  // "ba" + NaN    -> "baNaN"
  // "baNaN" + "a" -> "baNaNa"
  ```

  ::: info بیشتر بدانیم: BigInt استثناست
  `BigInt` (عددهای صحیح خیلی بزرگ مثل `10n`) با عددهای معمولی coercion نمی‌شود: `10n + 1` خطای `TypeError: Cannot mix BigInt and other types` می‌دهد. باید صریحاً تبدیل کنی: `10n + 1n` (حاصل `11n`) یا `Number(10n) + 1` (حاصل `11`).
  :::

  ::: tip قانون طلایی
  - `+` با حداقل یک رشته: چسباندن (نتیجه رشته است)؛ وگرنه جمع عددی.
  - `-`، `*`، `/` و `%`: همیشه عددی.
  - آرایه/شیء: اول به رشته تبدیل می‌شود (`[] -> ""` و `{} -> "[object Object]"`).
  - `==`: معمولاً همه‌چیز به سمت عدد می‌رود، به جز `null`/`undefined` که فقط با هم برابرند.
  - `if`: فقط truthy یا falsy بودن را می‌پرسد.
  - در کد واقعی همیشه `===` را ترجیح بده و قبل از محاسبه صریحاً تبدیل کن (`Number(input)`).
  :::

  ::: trap
  - `null + 1` برابر `1` است، ولی `undefined + 1` برابر `NaN`.
  - `null` در جمع مثل `0` رفتار می‌کند، ولی `null == 0` برابر `false` است، چون `==` برای `null` قانون ویژه دارد.
  - `true == "true"` برابر `false` است (`1 == NaN`) و `"2" == true` هم `false` است (`2 == 1`).
  - `"" == 0` و `"0" == 0` هر دو `true` هستند، اما `"0" == ""` برابر `false` است؛ دو رشته بدون هیچ تبدیلی با هم مقایسه می‌شوند.
  - `[] == false` برابر `true` است، ولی آرایه‌ی خالی truthy است و `if ([])` اجرا می‌شود.
  - `1 + 2 + "3"` برابر `"33"` است، نه `"123"`.
  - `[1, 100000, 21, 30, 4]` حاصل `sort()` بدون تابع مقایسه است؛ برای مرتب‌سازی عددی `(a, b) => a - b` لازم است.
  :::
questions:
  - level: easy
    stem: |
      طبق اسلاید ۲۲، **type coercion** یعنی:
    options:
      - تبدیل خودکار نوع داده توسط خود JavaScript، وقتی در یک عملیات مقدارهایی از نوع‌های مختلف شرکت دارند
      - تبدیل نوعی که برنامه‌نویس خودش با `Number()` یا `String()` انجام می‌دهد
      - خطایی که JavaScript هنگام جمع کردن یک رشته با یک عدد می‌دهد
      - اینکه نوع هر متغیر بعد از تعریف ثابت می‌ماند و دیگر عوض نمی‌شود
    answer: 1
    explain: |
      اسلاید ۲۲ coercion را «تبدیل خودکار یک نوع داده به نوعی دیگر وقتی عملیات شامل مقدارهایی از نوع‌های مختلف است» تعریف می‌کند. گزینه‌ی ۲ تعریف casting **صریح** (explicit) است؛ گزینه‌ی ۳ غلط است، چون JavaScript برای `"5" + 1` خطا نمی‌دهد و `"51"` می‌سازد؛ گزینه‌ی ۴ هم برعکسِ dynamic typing است: در JavaScript متغیرها نوع ثابتی ندارند.

  - level: easy
    stem: |
      طبق اسلاید ۲۲، در مقایسه‌ی `'5' == 5` چه تبدیلی رخ می‌دهد؟
    options:
      - عدد `5` به رشته‌ی `"5"` تبدیل می‌شود
