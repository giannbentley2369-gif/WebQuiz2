    answer: 4
    explain: |
      `window` شیء سراسریِ **مرورگر** است و در Node.js وجود ندارد. `typeof` روی نامی که پیدا نمی‌شود خطا نمی‌دهد و `"undefined"` برمی‌گرداند. در مرورگر جواب `"object"` بود (گزینه‌ی ۱). شیء سراسری Node.js با نام `globalThis` (یا `global`) در دسترس است، ولی `typeof` هیچ‌وقت نام یک متغیر را برنمی‌گرداند (رد گزینه‌ی ۲) و `"function"` (گزینه‌ی ۳) هم مخصوص توابع است.

  - level: hard
    stem: |
      در یک صفحه‌ی وب، دو اسکریپت (`menu.js` و `cart.js`) پشت سر هم بارگذاری شده‌اند و بعد از آن‌ها کدِ پایین اجرا می‌شود. خروجی در مرورگر کدام است؟
    check: dom-output
    html: |
      <script>
        // menu.js
        var count = 0;
        function init() { console.log("menu init"); }
      </script>
      <script>
        // cart.js
        var count = 5;
        function init() { console.log("cart init"); }
      </script>
    code: |
      init();
      console.log(count);
    options:
      - out: ["cart init", "5"]
      - out: ["menu init", "0"]
      - out: ["menu init", "cart init", "5"]
      - out: ["cart init", "0"]
    answer: 1
    explain: |
      همه‌ی اسکریپت‌های معمولیِ یک صفحه **یک global scope مشترک** دارند. `var count` و `function init` در `cart.js` بی‌صدا (و بدون هیچ خطایی) همان نام‌های `menu.js` را بازنویسی می‌کنند؛ پس `init()` نسخه‌ی `cart` را اجرا می‌کند و `count` برابر ۵ است. این دقیقاً همان «تداخل نام‌ها» است که اسلاید ۲۶ درباره‌اش هشدار می‌دهد. گزینه‌ی ۲ فکر کرده اولین تعریف می‌ماند، گزینه‌ی ۳ فکر کرده هر دو تابع اجرا می‌شوند و گزینه‌ی ۴ فقط تابع را بازنویسی‌شده دانسته است.

  - level: hard
    stem: |
      دو اسکریپت زیر پشت سر هم در یک صفحه اجرا می‌شوند و بعد از آن‌ها کدِ پایین (اسکریپت سوم) اجرا می‌شود. خروجی کنسول مرورگر کدام است؟ (سطر `Uncaught ...` یعنی خطایی که در کنسول نمایش داده می‌شود.)
    check: dom-output
    html: |
      <script>
        let count = 0;
        console.log("menu loaded");
      </script>
      <script>
        console.log("cart loading");
        let count = 5;
        console.log("cart loaded");
      </script>
    code: |
      console.log(count);
    options:
      - out: ["menu loaded", "cart loading", "cart loaded", "5"]
      - out: ["menu loaded", "cart loading", "!! SyntaxError", "0"]
      - out: ["menu loaded", "!! SyntaxError", "0"]
      - out: ["menu loaded", "cart loading", "cart loaded", "0"]
    answer: 3
    explain: |
      `let`ِ سطح بالا هم سراسری است، پس اسکریپت دوم می‌خواهد `count` را در **همان** global scope دوباره تعریف کند. نتیجه `SyntaxError: Identifier 'count' has already been declared` است و این خطا **قبل از اجرای اولین خطِ** اسکریپت دوم رخ می‌دهد؛ پس هیچ خطی از آن (حتی `cart loading`) اجرا نمی‌شود (رد گزینه‌ی ۲). اسکریپت‌ها مستقل‌اند و اسکریپت سوم اجرا می‌شود و `count`ِ اسکریپت اول یعنی `0` را چاپ می‌کند. گزینه‌های ۱ و ۴ فکر کرده‌اند `let` هم مثل `var` تعریف دوباره را بی‌صدا قبول می‌کند.

  - level: medium
    stem: |
      خروجی کد زیر در Node.js (حالت عادی، بدون `"use strict"`) چیست؟
    check: output
    code: |
      function setup() {
        counter = 5;
        let local = 10;
      }
      setup();
      console.log(counter);
      console.log(typeof local);
    options:
      - out: ["5", "number"]
      - out: ["5", "undefined"]
      - out: "!! ReferenceError"
      - out: ["undefined", "undefined"]
    answer: 2
    explain: |
      `counter` هیچ‌جا با `let`، `const` یا `var` تعریف نشده؛ در حالت عادی (sloppy) انتساب به چنین نامی بی‌صدا یک متغیر **سراسری** می‌سازد، حتی از داخل تابع. پس بیرون از تابع `5` چاپ می‌شود. اما `local` با `let` تعریف شده و فقط داخل تابع وجود دارد؛ `typeof` روی آن بیرون از تابع `"undefined"` می‌دهد (بدون خطا). گزینه‌ی ۱ فکر کرده `local` هم بیرون می‌آید، گزینه‌ی ۳ رفتار حالت strict را در نظر گرفته و گزینه‌ی ۴ فکر کرده متغیری که داخل تابع ساخته شده بیرون دیده نمی‌شود.

  - level: hard
    stem: |
      کدام خط کد زیر خطا می‌دهد؟
    check: error-line
    errorName: ReferenceError
    code: |
      "use strict";
      function init() {
        total = 100;
      }
      init();
      console.log(total);
    options:
      - line: 3
      - line: 6
      - line: 5
      - line: 0
    answer: 1
    explain: |
      در حالت strict، انتساب به نامی که تعریف نشده دیگر متغیر سراسری نمی‌سازد و همان لحظه `ReferenceError: total is not defined` می‌دهد؛ دستورِ خطادار خط ۳ (داخل تابع) است. خط ۵ فقط تابع را صدا می‌زند (رد گزینه‌ی ۳) و خط ۶ هرگز اجرا نمی‌شود، چون برنامه روی خط ۳ متوقف شده است (رد گزینه‌ی ۲). گزینه‌ی ۴ («هیچ خطایی رخ نمی‌دهد») رفتار حالت عادی (sloppy) است که بی‌صدا یک global می‌سازد.

  - level: medium
    stem: |
      کدام گزینه **نادرست** است؟
    options:
      - 'کد داخل یک تابع می‌تواند متغیرهای محدوده‌های بیرونی (مثلاً متغیرهای سراسری) را بخواند.'
      - 'متغیری که با `let` داخل یک بلوک تعریف شده، بیرون از آن بلوک در دسترس نیست.'
      - 'کد بیرون از یک تابع می‌تواند متغیرهای `let` تعریف‌شده داخل آن تابع را بخواند، به شرط این‌که تابع قبلاً صدا زده شده باشد.'
      - 'اگر بیرون از یک بلوک `let x` داشته باشیم، تعریف `let x` دیگری داخل آن بلوک خطا نمی‌دهد و فقط روی متغیر بیرونی سایه می‌اندازد.'
    answer: 3
    explain: |
      جست‌وجوی نام‌ها (scope chain) فقط از داخل به بیرون است و محدوده‌ی بیرونی هیچ‌وقت متغیرهای داخل یک تابع را نمی‌بیند. صدا زدن تابع هم چیزی را عوض نمی‌کند؛ متغیرهای محلیِ هر فراخوانی فقط برای کدِ داخل همان تابع قابل دسترسی‌اند. پس گزینه‌ی ۳ نادرست است. گزینه‌ی ۱ همان دسترسی رو به بیرون است، گزینه‌ی ۲ تعریف block scope است و گزینه‌ی ۴ همان shadowing است که تعریف دوباره حساب نمی‌شود.
