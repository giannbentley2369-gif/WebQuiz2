id: ch1-scope
title: "Block، Scope و Global scope"
slides: "Introduction to JS، اسلایدهای ۲۵ و ۲۶"
lesson: |
  یک ساختمان با شیشه‌های **دودی یک‌طرفه** را تصور کن: از داخل هر اتاق می‌توانی بیرون را ببینی، ولی از بیرون نمی‌شود داخل اتاق را دید. متغیرها در JavaScript دقیقاً همین‌طور «دیده می‌شوند»: کدی که داخل یک بلوک است متغیرهای بیرون را می‌بیند، ولی کد بیرونی متغیرهای داخل بلوک را نمی‌بیند.

  به محدوده‌ای از کد که یک متغیر در آن **قابل دسترسی** است، **scope** (محدوده یا حوزه‌ی دیدِ متغیر) می‌گوییم.

  ### بلوک (Block): اسلاید ۲۵

  - **بلوک** یعنی کدی که داخل آکولاد `{ ... }` است.
  - متغیرهایی که با `let` یا `const` داخل یک بلوک تعریف شوند **فقط داخل همان بلوک** وجود دارند.
  - **بیرون از بلوک** به آن‌ها **دسترسی نداریم**.

  کد اسلاید ۲۵:

  ```js title=scopes.js
  {
    let x = 10;
    console.log(x); // works
  }
  console.log(x);   // error: x is not defined
  ```

  خروجی در Node.js:

  ```text
  10
  ReferenceError: x is not defined
  ```

  خط سوم داخل بلوک است و `10` را چاپ می‌کند. بلوک که تمام شد، `x` هم از بین رفت؛ پس خط آخر خطای **`ReferenceError`** (خطای ارجاع؛ یعنی «چنین نامی پیدا نشد») می‌دهد. این خطا در **زمان اجرا** رخ می‌دهد؛ برای همین `10` قبل از آن چاپ شده است.

  به این رفتار **block scope** (محدوده‌ی بلوکی) می‌گوییم و `let` و `const` را **block-scoped** می‌نامیم. بلوک‌ها همه‌جا هستند: بدنه‌ی `if` و `else`، بدنه‌ی حلقه‌ها، بدنه‌ی `switch`، بدنه‌ی توابع یا حتی یک جفت آکولادِ تنها مثل همین مثال. (آکولادهای یک شیء مثل `{ name: "Ali" }` بلوک نیستند؛ آن‌ها یک شیء می‌سازند که در درس «اشیاء» با آن آشنا می‌شویم.)

  ```js
  const age = 20;
  if (age >= 18) {
    const message = "Adult";   // lives only inside this if-block
    console.log(message);      // Adult
  }
  console.log(typeof message); // undefined (message does not exist out here)

  for (let i = 0; i < 2; i++) {
    const square = i * i;      // a fresh `square` in every iteration
  }
  console.log(typeof i, typeof square); // undefined undefined
  ```

  (عملگر `typeof` نوع یک مقدار را به‌صورت رشته برمی‌گرداند و روی نامی که پیدا نشود، به جای خطا `"undefined"` می‌دهد؛ پایین‌تر دوباره به آن می‌رسیم.)

  جمله‌ی پایانی اسلاید ۲۵ می‌گوید: «بلوک‌ها فقط یک قاعده‌ی نوشتاری (syntax) نیستند؛ ابزاری برای **سازمان‌دهی** و **محافظت** از متغیرها هستند.» یعنی:

  - **سازمان‌دهی**: متغیرهای موقت (مثل `square` بالا) فقط همان‌جایی هستند که لازم‌اند و بقیه‌ی کد شلوغ نمی‌شود.
  - **محافظت**: کدِ بیرون از بلوک نمی‌تواند به‌اشتباه متغیرهای داخل آن را بخواند یا خراب کند، و نام‌های داخل بلوک با نام‌های بیرون **تداخل** پیدا نمی‌کنند.

  ### Global scope (محدوده‌ی سراسری): اسلاید ۲۶

  - متغیری که **بیرون از هر بلوکی** (و بیرون از هر تابعی) تعریف شود **global** (سراسری) است.
  - به متغیرهای سراسری **از هر جای کد** می‌شود دسترسی داشت.
  - تا وقتی برنامه اجرا می‌شود **زنده می‌مانند** (برخلاف متغیرهای یک بلوک که با تمام شدن بلوک از بین می‌روند).
  - در مرورگرها، متغیرهای سراسری به property (ویژگی)های شیء `window` تبدیل می‌شوند (جزئیات دقیقش را پایین‌تر می‌بینیم).

  کد اسلاید ۲۶:

  ```js title=global.js
  let message = "Hello";  // global

  function greet() {
    console.log(message); // accessible here
  }

  greet();
  console.log(message);   // accessible here too
  // Hello
  // Hello
  ```

  `function greet() { ... }` یک **تابع (function)** تعریف می‌کند: یک تکه کدِ نام‌دار که هر بار `greet()` را بنویسیم اجرا می‌شود (توابع را در درس «توابع» کامل می‌خوانیم). `message` بیرون از همه‌ی بلوک‌ها تعریف شده، پس هم داخل تابع و هم بیرون از آن در دسترس است.

  ### Function scope (محدوده‌ی تابع)

  بدنه‌ی هر تابع هم یک محدوده است: هر متغیری که داخل تابع تعریف شود (با `let`، `const` و حتی `var`) فقط داخل همان تابع وجود دارد. این محدوده با **هر بار صدا زدنِ** تابع از نو ساخته می‌شود.

  ```js
  function makeTea() {
    const sugar = 2;            // local to makeTea
    console.log("Sugar:", sugar);
  }
  makeTea();                    // Sugar: 2
  console.log(typeof sugar);    // undefined (sugar does not exist out here)
  ```

  تفاوت مهم `var`: `var` فقط به **تابع** اهمیت می‌دهد، نه به بلوک (**function-scoped**). `var`ی که داخل یک `if` یا حلقه تعریف شود، در کل تابعِ دربرگیرنده (یا اگر داخل هیچ تابعی نباشد، در کل برنامه) دیده می‌شود. جزئیات بیشتر در درس «مشکلات var».

  ```js
  function test() {
    if (true) {
      var a = "var";   // function-scoped: visible in the whole function
      let b = "let";   // block-scoped: visible only in this if-block
    }
    console.log(a);    // var
    console.log(b);    // ReferenceError: b is not defined
  }
  test();
  ```

  | | `let` | `const` | `var` |
  |---|---|---|---|
  | محدوده | بلوک `{ }` | بلوک `{ }` | کل تابع |
  | دیده شدن بعد از بلوکِ `if`/حلقه | خیر | خیر | بله |
  | دیده شدن بیرون از تابع | خیر | خیر | خیر |

  ### محدوده‌های تودرتو و زنجیره‌ی scope (Scope chain)

  محدوده‌ها مثل عروسک‌های روسی داخل هم قرار می‌گیرند. وقتی کد از یک نام استفاده می‌کند، JavaScript آن را این‌طور جست‌وجو می‌کند:

  1. اول در **همان محدوده‌ی فعلی**؛
  2. اگر نبود، در **محدوده‌ی بیرونیِ** آن؛
  3. و همین‌طور بیرون‌تر، تا **global scope**؛
  4. اگر آن‌جا هم نبود: `ReferenceError`.

  به این مسیر جست‌وجو **scope chain** (زنجیره‌ی محدوده‌ها) می‌گوییم. جست‌وجو **فقط رو به بیرون** است: محدوده‌ی درونی محدوده‌های بیرونی را می‌بیند، ولی محدوده‌ی بیرونی هیچ‌وقت داخل محدوده‌های درونی را نمی‌بیند.

  ```js
  const city = "Tehran";                 // global scope

  function outer() {
    const street = "Azadi";              // outer's scope
    function inner() {
      const house = 12;                  // inner's scope
      console.log(city, street, house);  // inner sees all three
    }
    inner();
    console.log(typeof house);           // outer cannot see inside inner
  }

  outer();
  // Tehran Azadi 12
  // undefined
  ```

  ### Shadowing (سایه انداختن)

  اگر در یک محدوده‌ی درونی متغیری با **همان نامِ** یک متغیر بیرونی تعریف کنی، متغیر درونی **روی** بیرونی سایه می‌اندازد (**shadowing**): داخل آن محدوده هر جا آن نام را بنویسی به متغیر درونی می‌رسی و متغیر بیرونی **دست‌نخورده** می‌ماند. دلیلش این است که جست‌وجو از محدوده‌ی فعلی شروع می‌شود و با **اولین** پیدا شدن متوقف می‌شود.

  ```js
  let color = "blue";

  {
    let color = "red";     // a NEW variable that shadows the outer one
    console.log(color);    // red
  }

  console.log(color);      // blue (the outer variable was never touched)
  ```

  این **تعریف دوباره** حساب نمی‌شود (چون دو متغیر در دو محدوده‌ی جدا هستند) و خطا نمی‌دهد. اما مراقب باش: اگر داخل بلوک `let` را **ننویسی**، متغیر جدیدی نساخته‌ای و داری **همان متغیر بیرونی** را تغییر می‌دهی:

  ```js
  let count = 1;
  {
    count = 2;             // no let: this changes the OUTER count
  }
  console.log(count);      // 2
  ```

  پارامترهای تابع (ورودی‌هایی که داخل پرانتزِ تعریف تابع می‌آیند) هم متغیرهای محلیِ همان تابع‌اند و می‌توانند روی یک متغیر بیرونیِ هم‌نام سایه بیندازند (`return` مقدار را به جایی که تابع صدا زده شده برمی‌گرداند):

  ```js
  let x = 10;
  function double(x) {     // this x is a parameter, local to double
    x = x * 2;
    return x;
  }
  console.log(double(3));  // 6
  console.log(x);          // 10
  ```

  (اما داخل **خودِ** بدنه‌ی تابع نمی‌توانی با `let` متغیری هم‌نامِ یکی از پارامترها تعریف کنی: `function f(x) { let x = 1; }` تعریف دوباره است و `SyntaxError` می‌دهد، چون پارامتر و آن `let` در یک محدوده‌اند.)

  ### متغیرهای سراسری و شیء `window` (در مرورگر)

  اسلاید ۲۶ می‌گوید در مرورگر، متغیرهای سراسری property شیء `window` (شیء سراسری مرورگر که پنجره‌ی فعلی را نشان می‌دهد) می‌شوند. دقیق‌ترش این است:

  | تعریف در سطح بالای یک اسکریپت مرورگر | سراسری است؟ | property شیء `window` می‌شود؟ |
  |---|---|---|
  | `var a = 1;` | بله | **بله** (`window.a` برابر `1`) |
  | `function f() {}` | بله | **بله** (`typeof window.f` برابر `"function"`) |
  | `let b = 2;` | بله | **خیر** (`window.b` برابر `undefined`) |
  | `const c = 3;` | بله | **خیر** (`window.c` برابر `undefined`) |

  ```js
  // in a browser (a classic <script>)
  var version = "1.0";
  let appName = "Quiz";
  console.log(window.version); // 1.0
  console.log(window.appName); // undefined
  console.log(appName);        // Quiz (still global and usable everywhere)
  ```

  پس `let` و `const`ِ سطح بالا هم **سراسری‌اند** (از همه‌جا در دسترس‌اند)، فقط روی `window` نمی‌نشینند. این‌که `var` روی `window` می‌نشیند یکی از مشکلات `var` است (آلوده کردن محدوده‌ی سراسری) که در درس «مشکلات var» می‌بینیم.

  در **Node.js** اصلاً `window` نداریم (`typeof window` برابر `"undefined"` است) و شیء سراسری با نام `globalThis` (یا `global`) در دسترس است. سطح بالای یک فایل Node.js هم محدوده‌ی **همان فایل** (module) است، نه محدوده‌ی سراسری واقعی؛ پس آن‌جا حتی `var`ِ سطح بالا هم property شیء سراسری نمی‌شود.

  ### چرا متغیرهای سراسریِ زیاد بد است؟

  جمله‌ی پایانی اسلاید ۲۶: «متغیرهای سراسریِ زیاد می‌توانند باعث **تداخل نام‌ها (naming conflicts)** و **باگ** شوند و **نگه‌داری و دیباگِ** کد را سخت‌تر می‌کنند.» چرا؟

  - همه‌ی اسکریپت‌های معمولیِ یک صفحه **یک global scope مشترک** دارند. اگر دو فایل (مثلاً کد خودت و یک کتابخانه) هر دو `var count` یا `function init()` داشته باشند، دومی **بی‌صدا** اولی را بازنویسی می‌کند:

    ```html
    <script>
      // menu.js
      var count = 0;
      function init() { console.log("menu init"); }
    </script>
    <script>
      // cart.js (written by someone else)
      var count = 5;
      function init() { console.log("cart init"); }
    </script>
    <script>
      init();             // cart init (menu's init was silently replaced!)
      console.log(count); // 5
    </script>
    ```

  - اگر همان نام‌ها در هر دو فایل با `let` تعریف شده باشند، اسکریپت دوم با `SyntaxError: Identifier 'count' has already been declared` **اصلاً اجرا نمی‌شود**.
  - هر تابعی در هر جای برنامه می‌تواند یک متغیر سراسری را عوض کند؛ وقتی مقدارش غلط شد، پیدا کردن مقصر سخت است.
  - متغیرهای سراسری تا آخر برنامه در حافظه می‌مانند.

  **بهترین روش:** هر متغیر را در **کوچک‌ترین محدوده‌ای** که لازم دارد تعریف کن (داخل همان تابع یا بلوک).

  ### دام: متغیر سراسریِ ناخواسته (Implicit global)

  اگر به نامی که **هیچ‌جا تعریف نشده** مقدار بدهی (بدون `let`، `const` یا `var`):

  - در **حالت عادی (sloppy mode)** (حالت پیش‌فرض و سهل‌گیر JavaScript) بی‌صدا یک متغیر **سراسری** ساخته می‌شود (در مرورگر، `window.total`)، حتی اگر این کار داخل یک تابع باشد!
  - در **حالت strict** (با نوشتن `"use strict";` در ابتدای فایل یا تابع؛ حالتی سخت‌گیرتر که جلوی خطاهای بی‌صدا را می‌گیرد) همان خط خطای `ReferenceError` می‌دهد.

  ```js
  function init() {
    total = 100;          // no let/const/var: an accidental global!
  }
  init();
  console.log(total);     // 100 (sloppy mode)
  ```

  ```js
  "use strict";
  function init() {
    total = 100;          // ReferenceError: total is not defined
  }
  init();
  ```

  ### `typeof` روی متغیری که در دسترس نیست

  خواندن مستقیمِ متغیری که در محدوده‌ی فعلی وجود ندارد `ReferenceError` می‌دهد، ولی `typeof` روی نامی که اصلاً پیدا نمی‌شود **خطا نمی‌دهد** و رشته‌ی `"undefined"` برمی‌گرداند:

  ```js
  {
    const secret = 42;
  }
  console.log(typeof secret); // undefined (no error)
  console.log(secret);        // ReferenceError: secret is not defined
  ```

  (یک استثنا هست: `typeof` روی یک `let`/`const` **در همان محدوده ولی قبل از خطِ تعریفش** خطا می‌دهد. این را در درس «Hoisting و TDZ» می‌بینیم.)

  ::: tip
  - بلوک یعنی `{ ... }`. `let` و `const` block-scoped هستند و `var` function-scoped است.
  - جست‌وجوی نام‌ها از داخل به بیرون است (scope chain): محدوده‌ی درونی بیرونی را می‌بیند، نه برعکس.
  - shadowing: متغیر درونیِ هم‌نام، بیرونی را **می‌پوشاند** ولی **تغییر نمی‌دهد**. بدون `let` داخل بلوک، همان متغیر بیرونی (نزدیک‌ترین متغیر هم‌نام) تغییر می‌کند.
  - در مرورگر فقط `var` و اعلان تابعِ سطح بالا property شیء `window` می‌شوند؛ `let` و `const` سراسری‌اند ولی روی `window` نیستند. در Node.js اصلاً `window` نداریم.
  - متغیر را در کوچک‌ترین محدوده‌ی لازم تعریف کن تا تداخل نام و باگ کمتر شود.
  :::

  ::: trap
  - خطای «استفاده بیرون از بلوک» از نوع `ReferenceError` است و در زمان اجرا رخ می‌دهد؛ پس خروجی خط‌های قبل از آن چاپ شده است.
  - `typeof` روی متغیری که بیرون از بلوکش است `"undefined"` می‌دهد، نه خطا؛ ولی خواندن مستقیمش خطا می‌دهد.
  - انتساب به نامِ تعریف‌نشده در حالت sloppy یک global ناخواسته می‌سازد و در حالت strict خطای `ReferenceError` می‌دهد.
  - جمله‌ی «همه‌ی متغیرهای سراسری property شیء `window` می‌شوند» دقیق نیست: `let` و `const` نمی‌شوند.
  - `let x` داخل یک بلوک تازه، تعریف دوباره نیست و خطا نمی‌دهد (shadowing است). اما اگر `var x` را داخل یک بلوک بنویسی و یکی از محدوده‌های **دربرگیرنده‌ی** آن بلوک (داخل همان تابع، یا سطح بالای برنامه) `let x` داشته باشد، این تعریف دوباره است و `SyntaxError` می‌دهد؛ چون `var` از بلوک بیرون می‌زند.
  :::

  ::: summary
  - scope یعنی محدوده‌ای که یک متغیر در آن قابل دسترسی است. بلوک = `{ ... }`؛ `let`/`const` فقط داخل بلوک خودشان وجود دارند (اسلاید ۲۵).
  - global: بیرون از هر بلوک تعریف می‌شود، از همه‌جا در دسترس است و تا پایان برنامه زنده است (اسلاید ۲۶). globalهای زیاد یعنی تداخل نام، باگ و دیباگ سخت.
  - توابع محدوده‌ی خودشان را دارند؛ `var` function-scoped است.
  - scope chain: جست‌وجو از داخل به بیرون؛ shadowing: نام درونی، بیرونی را می‌پوشاند.
  - در مرورگر فقط `var` و تابع‌های سطح بالا روی `window` می‌نشینند؛ انتساب به نام تعریف‌نشده: global ناخواسته (sloppy) یا `ReferenceError` (strict).
  :::
