    options:
      - 'همه می‌خواهند `var` کنار گذاشته شود، ولی برنامه‌نویس‌های قدیمی JavaScript حاضر نیستند دست از آن بکشند.'
      - 'برنامه‌نویس‌های قدیمی می‌خواهند `var` حذف شود، ولی بقیه مخالف‌اند.'
      - '`var` جدیدترین ویژگی زبان است و برنامه‌نویس‌های قدیمی هنوز آن را یاد نگرفته‌اند.'
      - '`var` سریع‌ترین روش تعریف متغیر است و برای همین همه آن را نگه می‌دارند.'
    answer: 1
    explain: |
      «بقیه» (EVERYONE ELSE) می‌خواهند `var` نابود شود و «برنامه‌نویس‌های قدیمی» (OLD JS DEVS) مثل ایسیلدور که حلقه را نگه داشت، می‌گویند «نه». گزینه‌ی ۲ نقش‌ها را برعکس کرده است. `var` قدیمی‌ترین روش تعریف متغیر است، نه جدیدترین (رد گزینه‌ی ۳) و میم هیچ ادعایی درباره‌ی سرعت ندارد (رد گزینه‌ی ۴).

