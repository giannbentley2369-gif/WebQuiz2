id: ch1-var-problems
title: "مشکلات var"
slides: "Introduction to JS، اسلاید ۲۷"
lesson: |
  قبل از ES6 (سال ۲۰۱۵) تنها راه تعریف متغیر در JavaScript کلمه‌ی `var` بود. `let` و `const` دقیقاً به این خاطر به زبان اضافه شدند که `var` چند رفتار دردسرساز دارد. امروز در کد جدید از `var` استفاده نمی‌کنیم، ولی در کدهای قدیمی، آموزش‌های اینترنتی و البته **سؤال‌های امتحان** زیاد می‌بینیمش؛ پس باید مشکلاتش را خوب بشناسیم. اسلاید ۲۷ این مشکلات را در پنج جمله خلاصه کرده است:

  - **Function-scoped است، نه block-scoped**: می‌تواند از بلوک‌های `{}` بیرون بزند (leak کند، یعنی «نشت کند»).
  - **Variable hoisting**: اعلان‌ها به بالا منتقل می‌شوند و `undefined`های غیرمنتظره می‌سازند.
  - **اجازه‌ی تعریف دوباره (redeclaration)**: یک متغیر را می‌شود چند بار بدون خطا تعریف کرد.
  - **آلوده کردن محدوده‌ی سراسری (global scope pollution)**: `var` در محدوده‌ی سراسری به `window` می‌چسبد.
  - **رفتار ناسازگار (inconsistent behavior)**: دیباگ کردن و فهمیدن منطق کد را سخت‌تر می‌کند.

  ### میم اسلاید ۲۷: حلقه‌ی قدرت

  کنار اسلاید یک میم سه‌قسمتی از فیلم «ارباب حلقه‌ها» هست:

  1. دستی که «حلقه‌ی یگانه» را گرفته و روی حلقه نوشته شده **VAR**.
  2. اِلروند با برچسب **EVERYONE ELSE** (بقیه‌ی برنامه‌نویس‌ها) می‌گوید: «بیندازش توی آتش! نابودش کن!» (Cast it into the fire! Destroy it!)
  3. ایسیلدور با برچسب **OLD JS DEVS** (برنامه‌نویس‌های قدیمی JavaScript) جواب می‌دهد: «نه.» (No.)

  در فیلم، ایسیلدور فرصت داشت حلقه‌ی شیطانی را نابود کند، ولی دلش نیامد. شوخی میم: همه می‌دانند `var` باید کنار گذاشته شود، ولی برنامه‌نویس‌های قدیمی که به آن عادت کرده‌اند حاضر نیستند رهایش کنند. بیا ببینیم این «حلقه» چه بلاهایی سر کد می‌آورد.

  ### مشکل ۱: function-scoped است، نه block-scoped

  **scope** (محدوده) یعنی بخشی از کد که یک متغیر در آن شناخته می‌شود.

  - متغیر **block-scoped** (مثل `let` و `const`) فقط داخل همان `{ ... }`ی وجود دارد که در آن تعریف شده است.
  - متغیر **function-scoped** (یعنی `var`) در **کل تابعی** که در آن تعریف شده وجود دارد و آکولادهای `if`، `for` و `while` جلویش را نمی‌گیرند. اگر بیرون از هر تابعی تعریف شود، سراسری (global) است.

  ::: analogy
  `let` مثل کلید یک اتاق است که فقط درِ همان اتاق (بلوک) را باز می‌کند. `var` مثل شاه‌کلید خانه است که درِ همه‌ی اتاق‌های خانه (کل تابع) را باز می‌کند؛ ولی درِ خانه‌ی همسایه (یک تابع دیگر) را باز نمی‌کند.
  :::

  ```js
  if (true) {
    var a = 1; // var: belongs to the surrounding function (or the global scope)
    let b = 2; // let: belongs only to this block
  }
  console.log(a); // 1 (var leaked out of the if block)
  console.log(b); // ReferenceError: b is not defined
  ```

  شمارنده‌ی حلقه هم بیرون می‌ریزد:

  ```js
  for (var i = 0; i < 3; i++) {
    // loop body
  }
  console.log(i); // 3 (the counter leaked out of the loop)
  ```

  چرا `3` و نه `2`؟ بدنه برای `i` برابر `0`، `1` و `2` اجرا می‌شود؛ بعد `i++` آن را `3` می‌کند، شرط `i < 3` نادرست می‌شود و حلقه تمام می‌شود. `i` با همان مقدار `3` بیرون حلقه باقی می‌ماند. اگر به‌جای `var` از `let` استفاده کنی، `i` بعد از حلقه وجود ندارد و `console.log(i)` خطای `ReferenceError` (خطای ارجاع) می‌دهد.

  اما `var` از **تابع** بیرون نمی‌زند؛ متغیر `var` داخل یک تابع، محلیِ همان تابع است:

  ```js
  function setup() {
    if (true) {
      var token = "abc";
    }
    console.log(token); // abc (visible everywhere inside setup)
  }
  setup();
  console.log(token);   // ReferenceError: token is not defined
  ```

  خطرناک‌ترین نتیجه‌ی این رفتار، **بازنویسی ناخواسته** است. ممکن است فکر کنی داخل بلوک یک متغیر تازه ساخته‌ای، در حالی که متغیر بیرونی را عوض کرده‌ای:

  ```js
  var total = 10;
  if (true) {
    var total = 99; // NOT a new variable: the same total is overwritten
  }
  console.log(total); // 99

  let count = 10;
  if (true) {
    let count = 99; // a new, separate variable that lives only in this block
  }
  console.log(count); // 10
  ```

  ### مشکل ۲: hoisting و `undefined`های غیرمنتظره

  **hoisting** (بالا بردن اعلان‌ها به ابتدای محدوده) یعنی موتور JavaScript قبل از اجرا، **اعلان** (declaration) هر `var` را به بالای محدوده‌اش (تابع یا محدوده‌ی سراسری) منتقل می‌کند و مقدار اولیه‌ی `undefined` به آن می‌دهد؛ ولی **مقداردهی** (assignment) سر جای خودش می‌ماند. پس `var` را می‌شود قبل از خط تعریفش خواند، **بدون خطا**:

  ```js
  console.log(score); // undefined (no error!)
  var score = 50;
  console.log(score); // 50
  ```

  موتور این کد را عملاً این‌طور اجرا می‌کند:

  ```js
  var score;          // the declaration is hoisted and starts as undefined
  console.log(score); // undefined
  score = 50;         // the assignment stays where it was
  console.log(score); // 50
  ```

  با `let` (و `const`) همین کار خطا می‌دهد، که در واقع **بهتر** است:

  ```js
  console.log(level); // ReferenceError: Cannot access 'level' before initialization
  let level = 1;
  ```

  چرا `undefined` از خطا بدتر است؟ خطا همان لحظه و همان خط، محل اشکال را نشانت می‌دهد. اما `undefined` بی‌صدا در برنامه جلو می‌رود و جای دیگری دردسر می‌سازد (مثلاً `NaN` در محاسبه یا کلمه‌ی `undefined` وسط یک متن)؛ پیدا کردن ریشه‌ی چنین باگی سخت است.

  غافلگیری معروف hoisting داخل تابع:

  ```js
  var msg = "global";
  function show() {
    console.log(msg); // undefined (not "global"!)
    var msg = "local";
    console.log(msg); // local
  }
  show();
  ```

  داخل `show`، اعلان `var msg` به **بالای تابع** منتقل می‌شود؛ پس از همان خط اول تابع، یک `msg` محلی (با مقدار `undefined`) وجود دارد که `msg` سراسری را پنهان می‌کند. قوانین کامل hoisting (برای `let`، `const`، `class` و توابع) را در درس «Hoisting و TDZ» می‌خوانیم.

  ### مشکل ۳: تعریف دوباره بدون خطا

  ```js
  var x = 1;
  var x = 2;      // no error: it is the same variable, now 2
  console.log(x); // 2
  ```

  ```js
  let y = 1;
  let y = 2; // SyntaxError: Identifier 'y' has already been declared
  ```

  فرض کن در یک فایل هزارخطی، دو بخش مختلف کد هر کدام یک `var data` تعریف کنند. با `var` هیچ هشداری نمی‌گیری و دومی بی‌صدا مقدار اولی را بازنویسی می‌کند. با `let` موتور **قبل از اجرای حتی یک خط** جلویت را می‌گیرد: `SyntaxError` (خطای نحوی) در مرحله‌ی خواندن (parse) کل فایل کشف می‌شود، پس هیچ خطی از آن فایل اجرا نمی‌شود. ترکیب `var` و `let` با یک نام در یک محدوده (مثل `var z = 1; let z = 2;`) هم `SyntaxError` است.

  یک نکته‌ی ظریف: تعریف دوباره‌ی `var` **بدون مقدار**، مقدار قبلی را پاک نمی‌کند:

  ```js
  var count = 5;
  var count;          // a redeclaration without a value is ignored
  console.log(count); // 5 (not undefined!)
  ```

  ### مشکل ۴: آلوده کردن محدوده‌ی سراسری (Global scope pollution)

  در مرورگر، **شیء سراسری** (global object) اسمش **`window`** است؛ objectی که همه‌ی چیزهای سراسری مثل `alert`، `document` و `console` روی آن قرار دارند. `var`ی که در سطح بالای یک اسکریپت معمولی تعریف شود، **به یک ویژگی (property) از `window` تبدیل می‌شود**. `let` و `const` هم سراسری‌اند، ولی ویژگی `window` نمی‌شوند:

  ```js
  // In a browser (a classic <script>)
  var city = "Tehran";
  let country = "Iran";
  console.log(window.city);    // Tehran
  console.log(window.country); // undefined
  ```

  (function declarationهای سطح بالا هم به همین شکل ویژگی `window` می‌شوند.)

  چرا «آلودگی»؟ همه‌ی اسکریپت‌های یک صفحه (کد خودت، کتابخانه‌ها، تبلیغات و ...) **یک `window` مشترک** دارند. اگر دو اسکریپت با `var` نام یکسانی بسازند، دومی بی‌صدا اولی را بازنویسی می‌کند:

  ```html
  <script>
    // library.js
    var counter = 100;
    function getCounter() {
      return counter;
    }
  </script>
  <script>
    // app.js
    var counter = 0;           // overwrites the library's counter!
    console.log(getCounter()); // 0 (the library is now broken)
  </script>
  ```

  ::: note
  **در Node.js** شیء `window` وجود ندارد (`typeof window` برابر `"undefined"` است) و شیء سراسری `globalThis` (یا `global`) نام دارد. علاوه بر این، Node.js هر فایل `.js` معمولی (CommonJS) را یک ماژول با محدوده‌ی جداگانه اجرا می‌کند؛ پس `var` سطح بالای یک فایل Node.js ویژگی `globalThis` نمی‌شود:

  ```js
  // In Node.js (a normal .js file)
  var city = "Tehran";
  console.log(globalThis.city); // undefined
  console.log(typeof window);   // undefined
  ```
  :::

  ### مشکل ۵: رفتار ناسازگار؛ دیباگ سخت‌تر

  همه‌ی موارد بالا با هم یعنی رفتار `var` به **جای** تعریفش بستگی دارد: داخل تابع محلی است ولی داخل بلوک نه؛ قبل از تعریفش قابل خواندن است ولی مقدار ندارد؛ ممکن است بی‌صدا متغیر دیگری را بازنویسی کند یا خودش بازنویسی شود. نتیجه اینکه با نگاه به چند خط اطراف یک متغیر نمی‌شود با اطمینان گفت مقدارش چیست؛ یعنی دیباگ (پیدا کردن و رفع باگ) سخت‌تر می‌شود.

  معروف‌ترین نمونه (پیش‌نمایش): `var` در حلقه همراه با `setTimeout`. تابع `setTimeout(fn, 0)` تابع `fn` را **کمی بعد**، یعنی بعد از تمام شدن کدهای فعلی، اجرا می‌کند:

  ```js
  for (var i = 0; i < 3; i++) {
    setTimeout(() => console.log(i), 0);
  }
  // 3
  // 3
  // 3
  ```

  ```js
  for (let j = 0; j < 3; j++) {
    setTimeout(() => console.log(j), 0);
  }
  // 0
  // 1
  // 2
  ```

  با `var` کل حلقه فقط **یک** `i` دارد؛ وقتی callbackها بالاخره اجرا می‌شوند، حلقه تمام شده و `i` برابر `3` است. با `let` هر دور حلقه `j` **تازه‌ی خودش** را دارد. توضیح کامل این رفتار را در درس‌های «Closure» و «Event loop» می‌بینیم.

  ### جدول مقایسه‌ی `var`، `let` و `const`

  | ویژگی | `var` | `let` | `const` |
  |---|---|---|---|
  | محدوده (scope) | تابع (function-scoped) | بلوک (block-scoped) | بلوک (block-scoped) |
  | استفاده قبل از خط تعریف | hoist می‌شود؛ مقدارش `undefined` است | hoist می‌شود ولی مقداردهی نمی‌شود: `ReferenceError` (TDZ) | مثل `let`: `ReferenceError` |
  | تعریف دوباره در همان محدوده | مجاز (بی‌صدا) | `SyntaxError` | `SyntaxError` |
  | انتساب دوباره (`x = ...`) | مجاز | مجاز | `TypeError` |
  | ویژگی `window` در سطح بالای اسکریپت مرورگر | می‌شود | نمی‌شود | نمی‌شود |
  | مقداردهی هنگام تعریف | اختیاری | اختیاری | اجباری |

  (TDZ یا Temporal Dead Zone یعنی «منطقه‌ی مرده‌ی زمانی»: بازه‌ی بین شروع محدوده تا خط تعریف `let`/`const` که دسترسی به متغیر در آن خطا می‌دهد.)

  **بهترین روش:** در کد جدید هرگز از `var` استفاده نکن؛ به‌طور پیش‌فرض `const` و هر وقت انتساب دوباره لازم شد `let`. برای «تعمیر» کد قدیمی هم معمولاً کافی است `var`ها را با `let`/`const` عوض کنی.

  ::: tip
  - `var` تابع‌محور است: در کل تابع دیده می‌شود و بلوک‌های `if`/`for` نگهش نمی‌دارند؛ ولی از خودِ تابع بیرون نمی‌رود.
  - شمارنده‌ی `for (var i = ...)` بعد از حلقه با مقدار نهایی‌اش (اولین مقداری که شرط را نادرست کرد) باقی می‌ماند.
  - خواندن `var` قبل از تعریف: `undefined`؛ خواندن `let`/`const` قبل از تعریف: `ReferenceError`.
  - `var` سطح بالای اسکریپت معمولی مرورگر ویژگی `window` می‌شود؛ `let` و `const` نه. در Node.js اصلاً `window` نداریم.
  :::

  ::: trap
  - `var total = 99` داخل یک بلوک `if` متغیر جدید نمی‌سازد؛ همان `total` بیرونی را بازنویسی می‌کند. (با `let` یک متغیر جدید و جدا ساخته می‌شود.)
  - داخل تابع، یک `var msg` در خط‌های پایین‌ترِ همان تابع باعث می‌شود `msg` در خط‌های بالاتر `undefined` باشد، نه مقدار سراسری.
  - `var count;` (تعریف دوباره بدون مقدار) مقدار قبلی را پاک نمی‌کند.
  - تعریف دوباره‌ی `let` در همان محدوده `SyntaxError` است و قبل از اجرای **هر** خطی رخ می‌دهد؛ پس هیچ خروجی‌ای چاپ نمی‌شود.
  - در یک فایل Node.js، `var` سطح بالا ویژگی `globalThis` نمی‌شود؛ رفتار `window` فقط مخصوص اسکریپت معمولی مرورگر است.
  - `typeof` روی نامی که تعریف نشده، `"undefined"` می‌دهد و خطا ندارد؛ ولی استفاده‌ی مستقیم از همان نام `ReferenceError` می‌دهد.
  :::

  ::: summary
  - پنج مشکل `var` (اسلاید ۲۷): function-scoped بودن و نشت از بلوک‌ها، hoisting و `undefined` غیرمنتظره، تعریف دوباره بدون خطا، چسبیدن به `window` (آلودگی سراسری) و رفتار ناسازگار که دیباگ را سخت می‌کند.
  - میم: همه می‌خواهند `var` نابود شود، ولی برنامه‌نویس‌های قدیمی JavaScript می‌گویند «نه».
  - راه‌حل: `const` به‌طور پیش‌فرض، `let` برای انتساب دوباره و هرگز `var`.
  :::
questions:
  - level: easy
    stem: |
      کدام مورد جزو «مشکلات `var`» در اسلاید ۲۷ **نیست**؟
    options:
      - 'function-scoped است، نه block-scoped و می‌تواند از بلوک `{}` بیرون بزند.'
      - 'اجازه می‌دهد یک متغیر چند بار بدون خطا تعریف شود.'
      - '`var` در محدوده‌ی سراسری به `window` می‌چسبد.'
      - 'نمی‌توان به متغیر `var` مقدار تازه داد.'
    answer: 4
    explain: |
      `var` انتساب دوباره را کاملاً اجازه می‌دهد (`var x = 1; x = 2;` مشکلی ندارد)؛ ممنوعیت انتساب دوباره ویژگی `const` است. پس گزینه‌ی ۴ جزو مشکلات `var` نیست. گزینه‌های ۱، ۲ و ۳ سه مورد از پنج مشکلی هستند که اسلاید ۲۷ نام می‌برد (دو مورد دیگر hoisting و رفتار ناسازگارند).

