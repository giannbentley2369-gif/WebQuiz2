      کلاس `AppError` چیزی به `Error` اضافه نکرده است؛ پس `message` را سازنده‌ی `Error` تنظیم می‌کند، اما `name` از `Error` به ارث می‌رسد و همان `Error` می‌ماند. با این حال شیء واقعاً با `new AppError` ساخته شده و `instanceof AppError` برابر `true` است. گزینه‌های ۱ و ۴ فکر کرده‌اند `name` خودکار اسم کلاس می‌شود (برای همین در کلاس‌های خطای سفارشی `this.name` را دستی تنظیم می‌کنیم) و گزینه‌های ۲ و ۴ ارث‌بری را در `instanceof` نادیده گرفته‌اند.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function c() {
        const settings = null;
        return settings.theme;
      }
      function b() {
        const theme = c();
        console.log("b got", theme);
      }
      function a() {
        try {
          b();
          console.log("a done");
        } catch (err) {
          console.log("a caught", err.name);
        }
      }
      a();
      console.log("end");
    options:
      - out: ["b got undefined", "a done", "end"]
      - out: ["!! TypeError"]
      - out: ["a caught TypeError", "a done", "end"]
      - out: ["a caught TypeError", "end"]
    answer: 4
    explain: |
      در `c`، `settings` برابر `null` است و `settings.theme` خطای `TypeError` می‌دهد. نه `c` و نه `b` این خطا را نمی‌گیرند، پس خطا در زنجیره‌ی فراخوانی بالا می‌رود تا به `try`ِ تابع `a` برسد؛ در این مسیر `b got ...` و `a done` رد می‌شوند. `catch` تابع `a` خطا را می‌گیرد و بعد برنامه ادامه پیدا می‌کند و `end` چاپ می‌شود. گزینه‌ی ۱ فکر کرده خواندن ویژگی از `null` فقط `undefined` می‌دهد، گزینه‌ی ۲ فکر کرده خطا فقط در همان تابعی که رخ داده قابل گرفتن است و گزینه‌ی ۳ فکر کرده بعد از `catch` به ادامه‌ی `try` برمی‌گردیم.
