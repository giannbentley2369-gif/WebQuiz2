    check: output
    code: |
      class AppError extends Error {}

      try {
        throw new AppError("Server down");
      } catch (err) {
        console.log(err.name, err instanceof AppError, err.message);
      }
    options:
      - out: "AppError true Server down"
      - out: "Error false Server down"
      - out: "Error true Server down"
      - out: "AppError false Server down"
    answer: 3
