      `setTimeout` فقط تابع را برای بعد ثبت می‌کند و بلافاصله برمی‌گردد؛ پس `try` بدون خطا تمام می‌شود و `timer scheduled` و بعد `after try` چاپ می‌شوند. وقتی تایمر اجرا می‌شود، `try...catch` مدت‌ها تمام شده است؛ پس `TypeError`ِ `user.name` گرفته نمی‌شود و برنامه با خطای Uncaught متوقف می‌شود. گزینه‌های ۲، ۳ و ۴ همه فرض کرده‌اند `catch` بیرونی خطای callback را می‌گیرد. راه درست، گذاشتن `try...catch` داخل خودِ callback است.

