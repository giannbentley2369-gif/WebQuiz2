  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const line = [];
      line.push("Ali");
      line.push("Sara");
      line.unshift("VIP");
      const first = line.shift();
      line.push(first);
      console.log(line.join(", "));
      console.log(line.indexOf("Ali"));
    options:
      - out: ["Ali, Sara, VIP", "0"]
      - out: ["VIP, Ali, Sara", "1"]
      - out: ["Sara, VIP, Ali", "2"]
      - out: ["Ali, Sara, VIP", "1"]
    answer: 1
    explain: |
      گام‌به‌گام: بعد از دو `push` داریم `["Ali", "Sara"]`؛ `unshift("VIP")` آن را `["VIP", "Ali", "Sara"]` می‌کند. `shift()` عضو اول یعنی `"VIP"` را حذف می‌کند و برمی‌گرداند، پس `first` برابر `"VIP"` و آرایه `["Ali", "Sara"]` است؛ سپس `push(first)` آن را به انتها می‌برد: `["Ali", "Sara", "VIP"]`. `"Ali"` حالا در اندیس `0` است (رد گزینه‌ی ۴). گزینه‌ی ۲ اثر `shift` و `push` آخر را نادیده گرفته و گزینه‌ی ۳ فرض کرده `shift` عضو آخر را برمی‌دارد.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const mixed = [1, "two", { three: 3 }, [4, 5], null];
      console.log(mixed.length);
      console.log(typeof mixed[2], typeof mixed[3], typeof mixed[4]);
      console.log(mixed[3][1] + mixed[2].three);
    options:
      - out: ["5", "object array null", "8"]
      - out: ["6", "object object object", "8"]
      - out: ["5", "object object object", "8"]
      - out: ["5", "object object object", "53"]
    answer: 3
    explain: |
      آرایه پنج عضو دارد؛ آرایه‌ی تودرتوی `[4, 5]` فقط **یک** عضو حساب می‌شود (رد گزینه‌ی ۲). `typeof` برای شیء، آرایه و حتی `null` (یک اشکال تاریخی JavaScript) `"object"` می‌دهد؛ نوعی به نام `"array"` یا `"null"` وجود ندارد (رد گزینه‌ی ۱). `mixed[3][1]` عدد `5` و `mixed[2].three` عدد `3` است و جمع دو عدد `8` می‌شود، نه چسباندن رشته‌ای (رد گزینه‌ی ۴).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const word = "JS!";
      let result = "";
      for (const ch of word) {
        if (ch === "!") break;
        result = ch + result;
      }
      console.log(result, word.length);
    options:
      - out: "JS 3"
      - out: "!SJ 3"
      - out: "SJ 2"
      - out: "SJ 3"
    answer: 4
    explain: |
      `for...of` روی رشته هم کار می‌کند و حرف‌ها را یکی‌یکی می‌دهد (اسلاید ۴۶: «arrays, strings, etc.»). چون هر حرف **جلوی** `result` چسبانده می‌شود، `"J"` و بعد `"S"` نتیجه را `"SJ"` می‌کنند (رد گزینه‌ی ۱). با رسیدن به `"!"`، `break` از حلقه خارج می‌شود و `"!"` اضافه نمی‌شود (رد گزینه‌ی ۲). حلقه رشته‌ی اصلی را تغییر نمی‌دهد و طولش `3` است (رد گزینه‌ی ۳).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const months = ["Jan", "Mar", "Apr"];
      const removed = months.splice(1, 0, "Feb");
      console.log(months);
      console.log(removed);
    options:
      - out: ["['Jan', 'Feb', 'Mar', 'Apr']", "[]"]
      - out: ["['Jan', 'Feb', 'Apr']", "['Mar']"]
      - out: ["['Jan', 'Mar', 'Apr']", "['Feb']"]
      - out: ["['Jan', 'Feb', 'Mar', 'Apr']", "4"]
    answer: 1
    explain: |
      `splice(1, 0, "Feb")` یعنی «از اندیس ۱، **صفر** عضو حذف کن و `"Feb"` را همان‌جا بگذار»؛ پس `"Feb"` قبل از `"Mar"` درج می‌شود و چیزی حذف نمی‌شود (رد گزینه‌ی ۲ که یک عضو را جایگزین کرده). `splice` آرایه‌ی اصلی را تغییر می‌دهد (رد گزینه‌ی ۳) و همیشه **آرایه‌ای از عضوهای حذف‌شده** را برمی‌گرداند که این‌جا خالی است؛ طول جدید را برنمی‌گرداند (رد گزینه‌ی ۴).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const users = [{ id: 1 }, { id: 2 }];
      const target = users[0];
      console.log(users.includes({ id: 1 }));
      console.log(users.includes(target));
      console.log(users.indexOf(target));
    options:
      - out: ["true", "true", "0"]
      - out: ["false", "true", "1"]
      - out: ["false", "false", "-1"]
      - out: ["false", "true", "0"]
    answer: 4
    explain: |
      `includes` و `indexOf` مثل `===` مقایسه می‌کنند و شیءها با **reference** مقایسه می‌شوند. `{ id: 1 }` در خط سوم یک شیء **تازه** است که فقط محتوایش شبیه عضو اول است، پس `false` (رد گزینه‌ی ۱). اما `target` **همان** شیء اندیس `0` است: `includes` برایش `true` می‌دهد (رد گزینه‌ی ۳) و `indexOf` اندیس `0` را (رد گزینه‌ی ۲ که از ۱ شمرده).

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const admins = ["root", "ali"];
      if (admins.indexOf("root")) {
        console.log("root is admin");
      } else {
        console.log("root is not admin");
      }
      if (admins.indexOf("guest")) {
        console.log("guest is admin");
      }
    options:
      - out: "root is admin"
      - out: ["root is admin", "guest is admin"]
      - out: ["root is not admin", "guest is admin"]
      - out: "root is not admin"
    answer: 3
    explain: |
      `indexOf` اندیس را برمی‌گرداند، نه `true`/`false`. `"root"` در اندیس `0` است و `0` **falsy** است، پس شرط اول برقرار نیست و `root is not admin` چاپ می‌شود (رد گزینه‌های ۱ و ۲). `"guest"` پیدا نمی‌شود و `indexOf` عدد `-1` را می‌دهد که **truthy** است، پس شرط دوم برقرار است و `guest is admin` هم چاپ می‌شود (رد گزینه‌ی ۴). راه درست: `admins.includes("root")` یا `admins.indexOf("root") !== -1`.

  - level: hard
    stem: |
      خروجی کد زیر چیست؟
    check: output
    code: |
      const nums = [3, 4];
      nums.unshift(1, 2);
      nums.push(5, 6);
      console.log(nums.join(""));
      console.log(nums.shift() + nums.pop());
    options:
      - out: ["213456", "7"]
      - out: ["123456", "7"]
      - out: ["123456", "16"]
      - out: ["123465", "7"]
    answer: 2
    explain: |
      `unshift(1, 2)` و `push(5, 6)` مقدارها را **با همان ترتیبی که نوشته شده‌اند** اضافه می‌کنند، پس آرایه `[1, 2, 3, 4, 5, 6]` می‌شود و `join("")` حاصل `123456` را می‌دهد (رد گزینه‌های ۱ و ۴ که ترتیب را برعکس کرده‌اند). `shift()` عدد `1` و `pop()` عدد `6` را برمی‌گرداند و جمع دو **عدد** `7` است؛ گزینه‌ی ۳ آن‌ها را مثل رشته به هم چسبانده است.
