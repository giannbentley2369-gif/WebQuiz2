id: ch1-arrays
title: "آرایه‌ها و متدهای push، pop، shift و unshift"
slides: "Introduction to JS، اسلایدهای ۴۵ و ۴۶"
lesson: |
  فرض کن می‌خواهی نمره‌های ۳۰ دانشجو را نگه داری. ساختن ۳۰ متغیر (`score1`، `score2`، …) کار عاقلانه‌ای نیست. **array** (آرایه؛ فهرستی **مرتب** از مقدارها) همه را زیر یک نام جمع می‌کند و به هر کدام با یک شماره دسترسی می‌دهد.

  ::: analogy
  آرایه مثل یک **قطار** است که واگن‌هایش پشت سر هم شماره خورده‌اند؛ فقط شماره‌گذاری از **صفر** شروع می‌شود. واگن شماره‌ی `0` اولین واگن است، واگن `1` دومی و… . هر واگن یک بار (مقدار) دارد و ترتیب واگن‌ها مهم است. به شماره‌ی هر واگن **index** (اندیس) می‌گوییم.
  :::

  ### آرایه چیست؟ (اسلاید ۴۵)
  اسلاید ۴۵ این پنج نکته را می‌گوید:

  - آرایه‌ها مجموعه‌های **مرتبی** (ordered) از مقدارها را نگه می‌دارند.
  - به عضوها (element) با **اندیس** (index) دسترسی داریم و اندیس **از ۰ شروع می‌شود**.
  - یک آرایه می‌تواند **نوع‌های مختلف** را کنار هم نگه دارد (عدد، رشته، شیء و …).
  - آرایه‌ها متدهای **آماده** (built-in) برای **اضافه کردن**، **حذف کردن** و **تبدیل کردن** داده‌ها دارند.
  - متدهای رایج: `push`، `pop`، `map`، `filter` و `forEach`. (در این درس `push` و `pop` و دوستانشان را می‌بینیم و `map`، `filter` و `forEach` را در درس بعد.)

  آرایه را با براکت `[ ]` می‌سازیم و عضوها را با ویرگول جدا می‌کنیم:

  ```js
  const empty = [];                                          // an empty array
  const scores = [18, 20, 17];                               // three numbers
  const mixed = [1, "two", true, null, { name: "Ali" }, [5, 6]]; // mixed types

  console.log(scores[0]);     // 18  (the FIRST element has index 0)
  console.log(scores[2]);     // 17  (the third element)
  console.log(mixed[4].name); // "Ali" (an object inside the array)
  console.log(mixed[5][1]);   // 6   (an array inside the array)
  ```

  | | عضو اول | عضو دوم | عضو سوم |
  |---|---|---|---|
  | اندیس (index) | `0` | `1` | `2` |
  | مقدار در `scores` | `18` | `20` | `17` |

  ### طول آرایه و دسترسی به عضوها
  property به نام **`length`** تعداد عضوهای آرایه را می‌دهد. چون اندیس از ۰ شروع می‌شود، **اندیس آخرین عضو همیشه `length - 1` است**:

  ```js
  const colors = ["red", "green", "blue"];
  console.log(colors.length);             // 3
  console.log(colors[colors.length - 1]); // "blue"    (the last element)
  console.log(colors[3]);                 // undefined (no element there, but NO error)
  console.log(colors[-1]);                // undefined (negative indexes do NOT count from the end)
  console.log(colors.at(-1));             // "blue"    (at() does accept negative indexes)
  ```

  - خواندن اندیسی که عضو ندارد **خطا نمی‌دهد** و فقط `undefined` برمی‌گرداند.
  - برخلاف Python، `arr[-1]` آخرین عضو **نیست**؛ برای آخرین عضو بنویس `arr[arr.length - 1]` یا از متد جدیدتر `arr.at(-1)` استفاده کن.

  #### عوض کردن عضوها با اندیس
  ```js
  const colors = ["red", "green", "blue"];
  colors[1] = "yellow";       // replace an element
  colors[3] = "black";        // index 3 === length: adds at the end
  console.log(colors);        // [ 'red', 'yellow', 'blue', 'black' ]

  colors[6] = "white";        // jumping past the end leaves EMPTY slots
  console.log(colors.length); // 7
  console.log(colors);        // [ 'red', 'yellow', 'blue', 'black', <2 empty items>, 'white' ]
  console.log(colors[5]);     // undefined
  ```

  اگر به اندیسی جلوتر از انتهای آرایه مقدار بدهی، خانه‌های بین راه **خالی** (empty) می‌مانند و `length` برابر «بزرگ‌ترین اندیس + ۱» می‌شود. خود `length` را هم می‌توان عوض کرد: `arr.length = 2` آرایه را کوتاه می‌کند و `arr.length = 0` آن را کاملاً خالی می‌کند.

  ```js
  const nums = [1, 2, 3, 4];
  nums.length = 2;
  console.log(nums); // [ 1, 2 ]
  nums.length = 0;
  console.log(nums); // []
  ```

  ### سؤال اسلاید ۴۵: خروجی این کد چیست؟
  ```js title=array.js
  const numbers = [1, 2, 3];
  numbers.push(4);
  console.log(numbers[0]);
  ```

  **جواب: `1`.** `push(4)` عدد ۴ را به **انتهای** آرایه اضافه می‌کند و آرایه `[1, 2, 3, 4]` می‌شود؛ عضوِ اندیس `0` هنوز همان `1` است. دو دام در این سؤال هست:

  1. اگر فکر کنی `push` به **ابتدای** آرایه اضافه می‌کند، جواب را `4` می‌دهی (کار ابتدای آرایه با `unshift` است).
  2. اگر فکر کنی آرایه‌ی `const` قابل تغییر نیست، جواب را «خطا» می‌دهی. اما `const` فقط **انتساب دوباره** (`numbers = [...]`) را منع می‌کند؛ تغییر **محتوای** آرایه با `push` کاملاً مجاز است.

  ### `push` و `pop`: کار با انتهای آرایه (اسلاید ۴۶)
  اسلاید ۴۶ می‌گوید: `push` / `pop` به **انتها** اضافه می‌کنند / از **انتها** حذف می‌کنند.

  ```js
  const fruits = ["apple", "banana"];

  console.log(fruits.push("cherry")); // 3 -> push returns the NEW LENGTH
  console.log(fruits);                // [ 'apple', 'banana', 'cherry' ]

  console.log(fruits.pop());          // "cherry" -> pop returns the REMOVED element
  console.log(fruits);                // [ 'apple', 'banana' ]
  ```

  ### `shift` و `unshift`: کار با ابتدای آرایه (اسلاید ۴۶)
  اسلاید ۴۶ می‌گوید: `shift` / `unshift` از **ابتدا** حذف می‌کنند / به **ابتدا** اضافه می‌کنند. (ترتیب کلمه‌ها با ترتیب متدها جور است: `shift` حذف می‌کند و `unshift` اضافه.)

  ```js
  const fruits = ["apple", "banana"];

  console.log(fruits.unshift("kiwi")); // 3 -> unshift also returns the NEW LENGTH
  console.log(fruits);                 // [ 'kiwi', 'apple', 'banana' ]

  console.log(fruits.shift());         // "kiwi" -> shift returns the REMOVED element
  console.log(fruits);                 // [ 'apple', 'banana' ]
  ```

  وقتی از ابتدا اضافه یا حذف می‌کنیم، اندیس همه‌ی عضوهای دیگر یکی جابه‌جا می‌شود: بعد از `unshift("kiwi")`، `"apple"` که در اندیس `0` بود به اندیس `1` می‌رود.

  | متد | کجا؟ | چه می‌کند؟ | چه برمی‌گرداند؟ | آرایه‌ی اصلی را تغییر می‌دهد؟ |
  |---|---|---|---|---|
  | `push(x, ...)` | انتها | یک یا چند عضو **اضافه** می‌کند | طول **جدید** آرایه | بله |
  | `pop()` | انتها | آخرین عضو را **حذف** می‌کند | عضو **حذف‌شده** | بله |
  | `unshift(x, ...)` | ابتدا | یک یا چند عضو **اضافه** می‌کند | طول **جدید** آرایه | بله |
  | `shift()` | ابتدا | اولین عضو را **حذف** می‌کند | عضو **حذف‌شده** | بله |

  ::: tip راه حفظ کردن
  - `push` و `pop` جفتِ **انتهای** آرایه‌اند و `shift` و `unshift` جفتِ **ابتدای** آن.
  - در هر جفت، کلمه‌ی **بلندتر** آرایه را **بلندتر** می‌کند: `push` در برابر `pop`، و `unshift` در برابر `shift`.
  - متدهای «اضافه‌کن» (`push` و `unshift`) **طول جدید** را برمی‌گردانند و متدهای «حذف‌کن» (`pop` و `shift`) **عضو حذف‌شده** را.
  :::

  چند جزئیات مهم دیگر:

  ```js
  const nums = [3, 4];
  nums.unshift(1, 2);           // several values keep their order: [ 1, 2, 3, 4 ]
  nums.push(5, 6);              // [ 1, 2, 3, 4, 5, 6 ]
  console.log(nums.join(", ")); // "1, 2, 3, 4, 5, 6"

  const box = [1, 2];
  box.push([3, 4]);             // pushes ONE element (a nested array)
  console.log(box.length);      // 3
  console.log(box[2]);          // [ 3, 4 ]

  const empty = [];
  console.log(empty.pop());     // undefined (nothing to remove, no error)
  console.log(empty.shift());   // undefined
  console.log(empty.length);    // 0
  ```

  - `push` و `unshift` می‌توانند **چند** مقدار بگیرند و آن‌ها را **با همان ترتیب** اضافه می‌کنند؛ `unshift(1, 2)` حاصل `[1, 2, 3, 4]` را می‌دهد، نه `[2, 1, 3, 4]`.
  - اگر به `push` یک **آرایه** بدهی، کل آن آرایه **یک عضو** می‌شود (آرایه‌ی تودرتو)، نه این‌که عضوهایش تک‌تک اضافه شوند.
  - `pop` و `shift` روی آرایه‌ی خالی خطا نمی‌دهند و `undefined` برمی‌گردانند.
  - هر چهار متد آرایه‌ی **اصلی** را تغییر می‌دهند (mutate؛ «جهش» یا تغییر درجا) و `const` جلویشان را نمی‌گیرد.

  ::: analogy پشته و صف
  - `push` + `pop` یعنی **پشته** (stack)، مثل بشقاب‌های روی هم: آخرین بشقابی که گذاشتی، اولین بشقابی است که برمی‌داری (LIFO: Last In, First Out).
  - `push` + `shift` یعنی **صف** (queue)، مثل صف نانوایی: هر کس اول آمده، اول می‌رود (FIFO: First In, First Out).
  :::

  ### `for...of`: پیمایش مستقیم مقدارها (اسلاید ۴۶)
  اسلاید ۴۶ می‌گوید `for...of` روی **مقدارهای** هر iterable (چیزی که می‌شود عضوهایش را یکی‌یکی پیمود؛ مثل آرایه و رشته) **مستقیم** حلقه می‌زند؛ یعنی دیگر لازم نیست با اندیس کار کنی:

  ```js
  const scores = [18, 20, 17];

  for (let i = 0; i < scores.length; i++) { // classic for: works with indexes
    console.log(scores[i]);                  // 18, then 20, then 17
  }

  for (const score of scores) {              // for...of: gives the values directly
    console.log(score);                      // 18, then 20, then 17
  }

  for (const ch of "Hi!") {                  // strings are iterable too
    console.log(ch);                         // "H", then "i", then "!"
  }
  ```

  داخل `for...of` می‌توانی از `break` (خروج از حلقه) و `continue` (رفتن به دور بعد) استفاده کنی. حواست باشد با `for...in` اشتباهش نگیری: `for...in` برای **کلیدهای شیء** است و روی آرایه، **اندیس‌ها** را آن هم به‌صورت **رشته** می‌دهد:

  ```js
  const letters = ["x", "y"];
  for (const i in letters) {
    console.log(i, typeof i); // 0 string, then 1 string
  }
  for (const v of letters) {
    console.log(v);           // x, then y
  }
  ```

  ### جست‌وجو در آرایه: `includes` و `indexOf`
  ```js
  const ids = [10, 20, 30, 20];
  console.log(ids.includes(20));   // true
  console.log(ids.includes("20")); // false (strict comparison like ===, no coercion)
  console.log(ids.indexOf(20));    // 1  (index of the FIRST match)
  console.log(ids.indexOf(99));    // -1 (not found)
  ```

  - `includes(x)` فقط جواب «هست / نیست» می‌دهد (`true` یا `false`).
  - `indexOf(x)` **اندیسِ اولین** عضو برابر با `x` را می‌دهد و اگر پیدا نکند **`-1`**.
  - هر دو مثل `===` مقایسه می‌کنند؛ پس رشته‌ی `"20"` با عدد `20` برابر نیست و دو شیء با محتوای یکسان هم برابر نیستند (مگر همان یک شیء باشند).

  ### آرایه هم شیء است: `typeof` و `Array.isArray`
  آرایه در واقع نوع خاصی از **شیء** است که کلیدهایش اندیس‌ها هستند؛ برای همین `typeof` نمی‌تواند آرایه را از شیء معمولی تشخیص دهد:

  ```js
  console.log(typeof [1, 2]);                        // "object" (not "array"!)
  console.log(Array.isArray([1, 2]));                // true
  console.log(Array.isArray({ 0: "a", length: 1 })); // false (looks like an array, but is not)
  console.log(Array.isArray("abc"));                 // false
  ```

  ### چند متد مفید دیگر: `slice`، `splice`، `join`، `concat` و `reverse`
  - `slice(start, end)`: یک **تکه** از آرایه را در آرایه‌ی **جدید** کپی می‌کند؛ از اندیس `start` تا قبل از `end` (خودِ `end` شامل نمی‌شود). آرایه‌ی اصلی **تغییر نمی‌کند**. اندیس منفی از انتها می‌شمارد و `slice()` بدون ورودی کل آرایه را کپی می‌کند.
  - `splice(start, deleteCount, ...items)`: **درجا** از اندیس `start` به تعداد `deleteCount` عضو حذف می‌کند و (اگر بدهی) عضوهای تازه را همان‌جا می‌گذارد. آرایه‌ی اصلی **تغییر می‌کند** و خروجی‌اش آرایه‌ای از عضوهای **حذف‌شده** است.

  ```js
  const letters = ["a", "b", "c", "d", "e"];

  console.log(letters.slice(1, 3));     // [ 'b', 'c' ] (index 3 is NOT included)
  console.log(letters.slice(-2));       // [ 'd', 'e' ] (the last two)
  console.log(letters);                 // [ 'a', 'b', 'c', 'd', 'e' ] (unchanged)

  const removed = letters.splice(1, 2); // remove 2 elements starting at index 1
  console.log(removed);                 // [ 'b', 'c' ]
  console.log(letters);                 // [ 'a', 'd', 'e' ] (changed!)

  letters.splice(1, 0, "x");            // remove nothing, insert "x" at index 1
  console.log(letters);                 // [ 'a', 'x', 'd', 'e' ]
  ```

  - `join(separator)`: عضوها را با جداکننده‌ی دلخواه به یک **رشته** می‌چسباند (جداکننده‌ی پیش‌فرض `","` است). آرایه را تغییر نمی‌دهد.
  - `concat(...)`: آرایه‌ی **جدیدی** از عضوهای آرایه و ورودی‌ها می‌سازد. آرایه را تغییر نمی‌دهد.
  - `reverse()`: ترتیب عضوها را **درجا** برعکس می‌کند و **همان آرایه** را برمی‌گرداند (نه یک کپی).

  ```js
  const nums = [1, 2, 3];
  console.log(nums.join());          // "1,2,3"
  console.log(nums.join(" - "));     // "1 - 2 - 3"
  const more = nums.concat([4, 5]);
  console.log(more);                 // [ 1, 2, 3, 4, 5 ]
  console.log(nums);                 // [ 1, 2, 3 ] (unchanged)
  const back = nums.reverse();
  console.log(nums);                 // [ 3, 2, 1 ] (changed in place!)
  console.log(back === nums);        // true (the same array)
  ```

  | آرایه‌ی اصلی را تغییر می‌دهند (mutating) | آرایه‌ی اصلی را تغییر نمی‌دهند (non-mutating) |
  |---|---|
  | `push`، `pop`، `shift`، `unshift`، `splice`، `reverse`، `sort` | `slice`، `concat`، `join`، `includes`، `indexOf`، `at` |

  (جدول کامل‌تر، همراه با `map`، `filter`، `reduce` و `sort` را در درس بعد می‌بینیم.)

  ### آرایه‌ها هم با reference کپی می‌شوند
  آرایه شیء است، پس مثل هر شیء دیگری متغیر فقط **reference** (نشانی) آن را نگه می‌دارد. `const b = a` آرایه‌ی تازه‌ای نمی‌سازد:

  ```js
  const a = [1, 2, 3];
  const b = a;                     // the same array, two names
  b.push(4);
  console.log(a);                  // [ 1, 2, 3, 4 ]
  console.log(a === b);            // true

  const c = [...a];                // a real (shallow) copy with spread
  const d = a.slice();             // another way to copy
  c.push(5);
  console.log(a.length, c.length); // 4 5
  console.log([1, 2] === [1, 2]);  // false (two different arrays)
  ```

  `[...a]` با spread (سه نقطه) یک آرایه‌ی **جدید** با همان عضوها می‌سازد؛ مثل `{ ...obj }` برای شیءها، این کپی هم **سطحی** است.

  ::: tip نکته
  - آخرین عضو: `arr[arr.length - 1]` (یا `arr.at(-1)`).
  - اندیسِ بدون عضو `undefined` می‌دهد و خطا نمی‌دهد.
  - برای فهمیدن «آرایه است یا نه» از `Array.isArray(x)` استفاده کن، نه `typeof`.
  - برای کپی آرایه: `[...arr]` یا `arr.slice()`.
  :::

  ::: trap دام‌های تستی آرایه‌ها
  - `arr[-1]` آخرین عضو **نیست** و `undefined` می‌دهد.
  - `push` و `unshift` **طول جدید** را برمی‌گردانند، نه آرایه را؛ `list = list.push(x)` آرایه‌ات را با یک **عدد** عوض می‌کند!
  - `pop` و `shift` عضو حذف‌شده را برمی‌گردانند و روی آرایه‌ی خالی `undefined` می‌دهند (نه خطا).
  - `arr.push([4, 5])` فقط **یک** عضو (یک آرایه‌ی تودرتو) اضافه می‌کند.
  - `if (arr.indexOf(x))` غلط است: اگر `x` در اندیس `0` باشد، `0` falsy است و شرط اجرا نمی‌شود؛ و اگر نباشد، `-1` truthy است و شرط اجرا می‌شود! بنویس `arr.includes(x)` یا `arr.indexOf(x) !== -1`.
  - `typeof []` برابر `"object"` است.
  - `slice` آرایه را تغییر نمی‌دهد، ولی `splice` تغییر می‌دهد.
  - آرایه‌ی `const` را می‌توان با `push`، `pop` و… تغییر داد؛ فقط `arr = [...]` ممنوع است.
  :::

  ::: summary
  - آرایه = فهرست مرتب، با اندیس از ۰؛ `length` تعداد عضوهاست و نوع عضوها می‌تواند مختلف باشد.
  - انتها: `push` (اضافه، طول جدید را برمی‌گرداند) و `pop` (حذف، عضو را برمی‌گرداند)؛ ابتدا: `unshift` (اضافه) و `shift` (حذف). هر چهار آرایه را تغییر می‌دهند.
  - `for...of` مقدارها را مستقیم می‌دهد؛ `includes` و `indexOf` برای جست‌وجو هستند (`-1` یعنی پیدا نشد).
  - `slice` و `concat` و `join` کپی/خروجی تازه می‌سازند؛ `splice` و `reverse` درجا تغییر می‌دهند.
  :::
