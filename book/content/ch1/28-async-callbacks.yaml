    stem: |
      طبق اسلاید ۵۳، JavaScript به‌طور پیش‌فرض **single-threaded** است. این یعنی:
    options:
      - در هر لحظه فقط یک کار (یک تکه کد) را اجرا می‌کند.
      - هر تابع را روی یک thread جداگانه و هم‌زمان با بقیه اجرا می‌کند.
      - هر برنامه فقط می‌تواند یک تابع داشته باشد.
      - هر خط کد فقط یک بار در کل عمر برنامه اجرا می‌شود.
    answer: 1
    explain: |
      اسلاید ۵۳: «single-threaded → runs one task at a time». thread یعنی یک مسیر اجرای دستورها و JavaScript فقط یکی از آن دارد. گزینه‌ی ۲ تعریف چندنخی (multi-threaded) است که برعکس این ویژگی است. گزینه‌های ۳ و ۴ هیچ ربطی به thread ندارند؛ یک برنامه می‌تواند هر تعداد تابع داشته باشد و یک خط (مثلاً داخل حلقه) بارها اجرا شود.

  - level: easy
    stem: |
      چرا JavaScript برای کارهای زمان‌بر از کد ناهمگام (asynchronous) استفاده می‌کند؟
    options:
      - چون کد ناهمگام همیشه سریع‌تر از کد همگام محاسبه می‌شود.
      - چون مرورگرها اجرای کد همگام را ممنوع کرده‌اند.
      - چون JavaScript فقط یک thread دارد و اگر برای کار زمان‌بر صبر کند، همه‌چیز (مثلاً کل صفحه) قفل می‌شود.
      - چون کد ناهمگام، JavaScript را چندنخی (multi-threaded) می‌کند.
    answer: 3
    explain: |
      طبق اسلاید ۵۳، JavaScript تک‌نخی است و «به جای مسدود کردن همه‌چیز» از کد ناهمگام استفاده می‌کند تا در زمان انتظار کارهای دیگر اجرا شوند. کد ناهمگام محاسبه را سریع‌تر نمی‌کند؛ فقط زمان انتظار را هدر نمی‌دهد (رد گزینه‌ی ۱). بیشتر کدهای JavaScript همگام‌اند و ممنوعیتی در کار نیست (رد گزینه‌ی ۲). کد ناهمگام هم برای کد ما thread جدیدی نمی‌سازد؛ انتظار را محیط اجرا می‌کشد و callback بعداً روی همان یک thread اجرا می‌شود (رد گزینه‌ی ۴).

  - level: easy
    stem: |
      طبق اسلاید ۵۳، کدام گزینه نمونه‌ای از «عملیات زمان‌بر» است که JavaScript نباید برایش همه‌چیز را مسدود کند؟
    options:
      - جمع دو عدد و تعریف یک متغیر
      - گرفتن داده از سرور (fetching data) و منتظر ماندن برای یک تایمر
      - نوشتن یک کامنت و تعریف یک تابع
      - 'خواندن طول یک رشته با `length`'
    answer: 2
    explain: |
      اسلاید ۵۳ دو مثال می‌زند: «fetching data, waiting for timers». این کارها به چیزی بیرون از کد ما (شبکه یا گذر زمان) وابسته‌اند و ممکن است ثانیه‌ها طول بکشند. کارهای گزینه‌های ۱، ۳ و ۴ تقریباً فوری و همگام انجام می‌شوند؛ کامنت هم اصلاً اجرا نمی‌شود.

  - level: easy
    stem: |
      در نمودار «Asynchronous» اسلاید ۵۳، Process A بعد از فرستادن درخواست به Process B چه می‌کند؟
    options:
      - منتظر پاسخ می‌ماند و تا رسیدن پاسخ هیچ کاری نمی‌کند (Wait for response).
      - درخواست را آن‌قدر تکرار می‌کند تا B جواب بدهد.
      - کارش تمام می‌شود و پاسخ B دیگر دریافت نمی‌شود.
      - به کار خودش ادامه می‌دهد (Continue working) و هر وقت پاسخ رسید، آن را دریافت می‌کند (Get response).
    answer: 4
    explain: |
      در نمودار ناهمگام، نوار سبز A بعد از فرستادن درخواست بدون وقفه ادامه دارد (Continue working) و پاسخ B وقتی می‌رسد که A هنوز مشغول کار است (Get response). گزینه‌ی ۱ دقیقاً نمودار «Synchronous» است که برچسب Wait for response دارد. گزینه‌های ۲ و ۳ در هیچ‌کدام از دو نمودار نیستند؛ پاسخ B حتماً به A برمی‌گردد.

  - level: easy
    stem: |
      طبق اسلاید ۵۴، **callback** چیست؟
    options:
      - تابعی که خودش را صدا می‌زند (تابع بازگشتی).
      - تابعی که به‌عنوان یک مقدار به تابع دیگری داده می‌شود و فقط وقتی رویداد مربوط رخ داد اجرا می‌شود.
      - اولین تابعی که هنگام بارگذاری برنامه اجرا می‌شود.
      - 'تابعی که حتماً باید اسمش `callback` باشد.'
    answer: 2
    explain: |
      اسلاید ۵۴: «a simple function that's passed as a value to another function, and will only be executed when the event happens». این کار ممکن است چون در JavaScript تابع‌ها first-class هستند و مثل هر مقدار دیگری جابه‌جا می‌شوند. تابع بازگشتی (گزینه‌ی ۱) مفهوم دیگری است و ترتیب بارگذاری (گزینه‌ی ۳) ربطی به callback ندارد. اسم پارامتر هم دلخواه است (گزینه‌ی ۴)؛ در کد اسلاید اسمش `callback` است، ولی می‌توانست `done` یا `onReady` باشد.

  - level: easy
    stem: |
      کادر BEST PRACTICE اسلاید ۵۴ چه توصیه‌ای درباره‌ی callbackها می‌کند؟
    options:
      - همیشه و برای هر کاری از callback استفاده کن، حتی برای کارهای همگام.
      - برای منطق پیچیده، callbackها را تا جای ممکن در هم تودرتو کن.
      - callbackها برای حالت‌های ساده عالی‌اند؛ منطق را به تابع‌های کوچک‌تر بشکن، به جای اینکه بیش از حد تودرتو کنی.
      - هرگز از callback استفاده نکن، چون JavaScript از آن پشتیبانی نمی‌کند.
    answer: 3
    explain: |
      متن کادر: «Callbacks are great for simple cases! Break logic into smaller functions instead of nesting too deep». گزینه‌ی ۲ دقیقاً همان کاری است که به callback hell می‌رسد. گزینه‌ی ۱ اغراق است و گزینه‌ی ۴ غلط؛ callback یکی از پایه‌های JavaScript است و `setTimeout` و `forEach` هر دو callback می‌گیرند.

  - level: easy
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      console.log("order placed");
      setTimeout(() => {
        console.log("pizza delivered");
      }, 1000);
      console.log("watching a movie");
    options:
      - out: ["order placed", "pizza delivered", "watching a movie"]
      - out: ["pizza delivered", "order placed", "watching a movie"]
      - out: ["order placed", "watching a movie"]
      - out: ["order placed", "watching a movie", "pizza delivered"]
    answer: 4
    explain: |
      `setTimeout` فقط تابع را برای ۱ ثانیه‌ی بعد ثبت می‌کند و **بلافاصله** برمی‌گردد؛ پس خط بعدی (`watching a movie`) بی‌معطلی اجرا می‌شود و `pizza delivered` حدود ۱ ثانیه بعد چاپ می‌شود. گزینه‌ی ۱ فکر کرده `setTimeout` برنامه را ۱ ثانیه متوقف می‌کند، گزینه‌ی ۲ ترتیب کد را نادیده گرفته و گزینه‌ی ۳ فکر کرده برنامه قبل از اجرای تایمر تمام می‌شود؛ اما مرورگر و Node.js تایمرهای ثبت‌شده را اجرا می‌کنند.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      setTimeout(() => console.log("A"), 0);
      console.log("B");
      console.log("C");
    options:
      - out: ["A", "B", "C"]
      - out: ["B", "A", "C"]
      - out: ["B", "C", "A"]
      - out: ["B", "C"]
    answer: 3
    explain: |
      تأخیر `0` یعنی «هر چه زودتر، **بعد از** تمام شدن کد فعلی»، نه «همین حالا». callback تایمر فقط وقتی اجرا می‌شود که thread بیکار شود؛ پس اول `B` و `C` (کد همگام) و بعد `A`. گزینه‌ی ۱ تأخیر صفر را اجرای فوری فرض کرده، گزینه‌ی ۲ فکر کرده تایمر وسط کد همگام اجرا می‌شود و گزینه‌ی ۴ فکر کرده تایمرِ صفر اصلاً اجرا نمی‌شود.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      setTimeout(() => console.log("slow"), 300);
      setTimeout(() => console.log("fast"), 100);
      setTimeout(() => console.log("medium"), 200);
      console.log("sync");
    options:
      - out: ["sync", "fast", "medium", "slow"]
      - out: ["slow", "fast", "medium", "sync"]
      - out: ["sync", "slow", "fast", "medium"]
      - out: ["fast", "medium", "slow", "sync"]
    answer: 1
    explain: |
      اول کد همگام اجرا می‌شود (`sync`). سه تایمر تقریباً هم‌زمان ثبت شده‌اند، پس به ترتیب **زمان موعدشان** اجرا می‌شوند، نه به ترتیب نوشتنشان: ۱۰۰، ۲۰۰ و بعد ۳۰۰ میلی‌ثانیه. گزینه‌ی ۲ تایمرها را همگام فرض کرده، گزینه‌ی ۳ ترتیب نوشتن را معیار گرفته و گزینه‌ی ۴ فکر کرده تایمرها قبل از کد همگام اجرا می‌شوند.

  - level: medium
    stem: |
      کد اسلاید ۵۴ را با دو خط اضافه اجرا می‌کنیم. خروجی کدام است؟
    check: output
    code: |
      function fetchData(callback) {
        setTimeout(() => {
          callback("Data received!");
        }, 1000);
      }

      fetchData(result => {
        console.log(result);
      });
      console.log("Waiting...");
      setTimeout(() => console.log("half a second later"), 500);
    options:
      - out: ["Data received!", "Waiting...", "half a second later"]
      - out: ["Waiting...", "Data received!", "half a second later"]
      - out: ["Waiting...", "half a second later"]
      - out: ["Waiting...", "half a second later", "Data received!"]
    answer: 4
    explain: |
      `fetchData` فقط یک تایمر ۱۰۰۰ میلی‌ثانیه‌ای ثبت می‌کند و بلافاصله برمی‌گردد؛ پس `Waiting...` اول چاپ می‌شود. بعد تایمر ۵۰۰ میلی‌ثانیه‌ای زودتر به موعدش می‌رسد و `half a second later` چاپ می‌شود، و سر ۱ ثانیه تایمر `fetchData` callback ما را با `"Data received!"` صدا می‌زند. گزینه‌ی ۱ فکر کرده `fetchData` منتظر می‌ماند، گزینه‌ی ۲ ترتیب زمانی دو تایمر را رعایت نکرده و گزینه‌ی ۳ فکر کرده چون `fetchData` چیزی `return` نمی‌کند، callback هرگز اجرا نمی‌شود.

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      console.log("start");
      [10, 20].forEach((n) => console.log(n));
      setTimeout(() => console.log("timer"), 0);
      console.log("end");
    options:
      - out: ["start", "end", "10", "20", "timer"]
      - out: ["start", "10", "20", "end", "timer"]
      - out: ["start", "end", "timer", "10", "20"]
      - out: ["start", "10", "20", "timer", "end"]
    answer: 2
    explain: |
      callbackِ `forEach` **همگام** است: همان لحظه‌ی صدا زدن `forEach` برای هر عضو اجرا می‌شود؛ پس `10` و `20` بلافاصله بعد از `start` می‌آیند. callbackِ `setTimeout` **ناهمگام** است و حتی با تأخیر `0`، بعد از تمام شدن کد همگام (`end`) اجرا می‌شود. گزینه‌های ۱ و ۳ فکر کرده‌اند هر callbackی ناهمگام است و گزینه‌ی ۴ تأخیر صفر را فوری فرض کرده است.

  - level: medium
    stem: |
      کدام callback **همگام** است؛ یعنی همان لحظه‌ی صدا زدن تابعِ گیرنده و قبل از رفتن به خط بعدی اجرا می‌شود؟
    options:
      - 'callbackِ `[1, 2, 3].forEach(cb)`'
      - 'callbackِ `setTimeout(cb, 0)`'
      - 'callbackِ `setInterval(cb, 1000)`'
      - 'callbackِ `button.addEventListener("click", cb)`'
    answer: 1
    explain: |
      `forEach` همان لحظه روی همه‌ی عضوها می‌چرخد و callback را برای هر کدام صدا می‌زند؛ وقتی `forEach` تمام شد، همه‌ی callbackها هم اجرا شده‌اند. سه گزینه‌ی دیگر ناهمگام‌اند: callbackِ `setTimeout` حتی با تأخیر صفر بعد از کد فعلی اجرا می‌شود، callbackِ `setInterval` هر ۱ ثانیه یک بار، و listener کلیک هر وقت کاربر کلیک کند (فصل ۲)؛ خودِ `addEventListener` فقط تابع را ثبت می‌کند و صدایش نمی‌زند.

  - level: medium
    stem: |
      کدام جمله درباره‌ی `setTimeout(fn, 1000)` **درست** است؟
    options:
      - برنامه را ۱ ثانیه متوقف (pause) می‌کند و بعد خط بعدی را اجرا می‌کند.
      - 'دقیقاً سر ۱۰۰۰ میلی‌ثانیه، حتی اگر کد دیگری در حال اجرا باشد، آن را قطع می‌کند و `fn` را اجرا می‌کند.'
      - '`fn` زودتر از ۱ ثانیه اجرا نمی‌شود، اما اگر thread جاوااسکریپت مشغول کار دیگری باشد، ممکن است دیرتر اجرا شود.'
      - 'اگر بلافاصله بعد از آن یک `setTimeout` دیگر با همین تأخیر ثبت کنیم، ترتیب اجرای این دو تصادفی است.'
    answer: 3
    explain: |
      عدد دوم `setTimeout` **حداقل** زمان انتظار است: callback فقط وقتی اجرا می‌شود که هم زمانش رسیده باشد و هم thread بیکار باشد. `setTimeout` برنامه را متوقف نمی‌کند و بلافاصله برمی‌گردد (رد گزینه‌ی ۱) و چون JavaScript تک‌نخی است، هیچ callbackی وسط کدی که در حال اجراست اجرا نمی‌شود (رد گزینه‌ی ۲). دو تایمر با تأخیر یکسان هم به ترتیب ثبت شدنشان اجرا می‌شوند، نه تصادفی (رد گزینه‌ی ۴).

  - level: medium
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      let count = 0;
      const id = setInterval(() => {
        count++;
        console.log("tick", count);
        if (count === 3) {
          clearInterval(id);
          console.log("stopped");
        }
      }, 100);
      console.log("interval started");
    options:
      - out: ["tick 1", "tick 2", "tick 3", "stopped", "interval started"]
      - out: ["interval started", "tick 1", "tick 2", "tick 3", "stopped"]
      - out: ["interval started", "tick 1", "tick 2", "stopped"]
      - out: ["interval started", "tick 1", "stopped"]
    answer: 2
    explain: |
      `setInterval` هم مثل `setTimeout` بلافاصله برمی‌گردد، پس `interval started` اول چاپ می‌شود. بعد callback هر ۱۰۰ میلی‌ثانیه یک بار اجرا می‌شود: چون `count++` قبل از چاپ است، شمارش از ۱ شروع می‌شود و در بار سوم `clearInterval(id)` تکرار را متوقف می‌کند و `stopped` چاپ می‌شود. گزینه‌ی ۱ تایمر را همگام فرض کرده و گزینه‌های ۳ و ۴ شرط `count === 3` را درست دنبال نکرده‌اند.

  - level: medium
    stem: |
      در جای خالی کدام گزینه قرار بگیرد تا یادآوری لغو شود و خروجی کد **فقط** `set` و `cancelled` باشد؟
    check: option-output
    expect: |
      set
      cancelled
    code: |
      let timer = setTimeout(() => {
        console.log("Reminder!");
      }, 1000);
      console.log("set");
      ___;
      console.log("cancelled");
    options:
      - text: '`timer = null`'
        code: |
          let timer = setTimeout(() => {
            console.log("Reminder!");
          }, 1000);
          console.log("set");
          timer = null;
          console.log("cancelled");
      - text: '`clearTimeout()`'
        code: |
          let timer = setTimeout(() => {
            console.log("Reminder!");
          }, 1000);
          console.log("set");
          clearTimeout();
          console.log("cancelled");
      - text: '`delete timer`'
        code: |
          let timer = setTimeout(() => {
            console.log("Reminder!");
          }, 1000);
          console.log("set");
          delete timer;
          console.log("cancelled");
      - text: '`clearTimeout(timer)`'
        code: |
          let timer = setTimeout(() => {
            console.log("Reminder!");
          }, 1000);
          console.log("set");
          clearTimeout(timer);
          console.log("cancelled");
    answer: 4
    explain: |
      `setTimeout` یک شناسه (id) برمی‌گرداند که باید آن را به `clearTimeout` بدهیم تا تایمر قبل از اجرا لغو شود. `timer = null` فقط متغیر را عوض می‌کند و تایمرِ ثبت‌شده در محیط اجرا سر جایش می‌ماند؛ `clearTimeout()` بدون شناسه نمی‌داند کدام تایمر را لغو کند؛ `delete timer` هم روی متغیرها کار نمی‌کند. در هر سه حالت `Reminder!` بعد از ۱ ثانیه چاپ می‌شود.

  - level: medium
    stem: |
      کدام جمله «callback hell» را درست توصیف می‌کند؟
    options:
      - هر callback یک سطح تودرتویی (nesting) اضافه می‌کند و وقتی callbackها زیاد شوند، کد خیلی زود پیچیده و ناخوانا می‌شود.
      - خطایی است که مرورگر وقتی بیش از ۱۰ callback در برنامه باشد نشان می‌دهد.
      - یعنی callbackها همیشه کندتر از کد همگام اجرا می‌شوند.
      - فقط در Node.js رخ می‌دهد و در مرورگر وجود ندارد.
    answer: 1
    explain: |
      اسلاید ۵۴: «Every callback adds a level of nesting, and when you have lots of callbacks, the code starts to be complicated very quickly». callback hell مشکلِ **خوانایی و نگهداری** کد است، نه خطای مرورگر (گزینه‌ی ۲) یا کندی اجرا (گزینه‌ی ۳)، و در هر محیطی که callbackهای تودرتو بنویسیم رخ می‌دهد (گزینه‌ی ۴). راه‌حل‌هایش شکستن منطق به تابع‌های کوچک‌تر، Promise و `async/await` است.

  - level: medium
    stem: |
      در الگوی **error-first callback** (مثل `callback(err, data)`)، روش درست رسیدگی به خطای یک عملیات ناهمگام کدام است؟
    options:
      - 'صدا زدن تابع ناهمگام را داخل `try...catch` بگذاریم؛ خطای callback هم همان‌جا گرفته می‌شود.'
      - نیازی به رسیدگی نیست؛ JavaScript خطاهای callback را خودکار نادیده می‌گیرد.
      - 'داخل callback اول پارامتر `err` را بررسی کنیم؛ اگر خطا بود به آن رسیدگی کنیم و ادامه ندهیم، وگرنه از `data` استفاده کنیم.'
      - پارامتر اول همیشه نتیجه است و خطا در آخرین پارامتر می‌آید.
    answer: 3
    explain: |
      در این الگو پارامتر اول خطاست (`null` یعنی خطایی نبوده) و پارامتر دوم نتیجه؛ پس رسیدگی به خطا «دستی» (manual) و داخل خودِ callback انجام می‌شود، همان‌طور که اسلاید ۵۷ می‌گوید: «callbacks → manual». `try...catch` دورِ فراخوانی، خطایی را که بعداً رخ می‌دهد نمی‌گیرد (رد گزینه‌ی ۱)، خطاها خودکار نادیده گرفته نمی‌شوند (رد گزینه‌ی ۲) و ترتیب پارامترها در این الگو دقیقاً «اول خطا» است (رد گزینه‌ی ۴).

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function getUser() {
        let user = "unknown";
        setTimeout(() => {
          user = "Sara";
        }, 100);
        return user;
      }
      console.log(getUser());
    options:
      - out: ["Sara"]
      - out: ["unknown"]
      - out: ["undefined"]
      - out: ["unknown", "Sara"]
    answer: 2
    explain: |
      `setTimeout` تابع را برای ۱۰۰ میلی‌ثانیه‌ی بعد ثبت می‌کند و بلافاصله برمی‌گردد؛ پس `return user` همان لحظه، وقتی `user` هنوز `"unknown"` است، اجرا می‌شود. تغییر به `"Sara"` بعداً رخ می‌دهد، وقتی `getUser` مدت‌هاست تمام شده و مقدارش چاپ شده است. گزینه‌ی ۱ فکر کرده `return` منتظر تایمر می‌ماند، گزینه‌ی ۳ فکر کرده مقدار متغیر هنوز تعیین نشده و گزینه‌ی ۴ فکر کرده تغییر بعدی دوباره چاپ می‌شود؛ اما فقط یک `console.log` داریم. این همان دامِ «Mixing sync & async code» در اسلاید ۵۸ است: نتیجه‌ی ناهمگام را باید به یک callback داد، نه `return` کرد.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function greet() {
        console.log("Hello");
        return () => console.log("Bye");
      }
      setTimeout(greet(), 100);
      console.log("Start");
    options:
      - out: ["Start", "Hello", "Bye"]
      - out: ["Start", "Hello"]
      - out: ["Hello", "Bye", "Start"]
      - out: ["Hello", "Start", "Bye"]
    answer: 4
    explain: |
      `setTimeout(greet(), 100)` تابع `greet` را به‌خاطر پرانتزها **همین حالا** صدا می‌زند، پس `Hello` اول چاپ می‌شود؛ مقدار برگشتیِ `greet`، یعنی تابع `() => console.log("Bye")`، به‌عنوان callback به تایمر داده می‌شود. بعد `Start` چاپ می‌شود و ۱۰۰ میلی‌ثانیه بعد `Bye`. گزینه‌ی ۱ فرض کرده `greet` بعد از تأخیر اجرا می‌شود (که برای `setTimeout(greet, 100)` بدون پرانتز درست بود)، گزینه‌ی ۲ تابع برگشتی را نادیده گرفته و گزینه‌ی ۳ فکر کرده تابع برگشتی هم بلافاصله اجرا می‌شود.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function step(name, ms, next) {
        setTimeout(() => {
          console.log(name);
          next();
        }, ms);
      }

      step("login", 300, () => {
        step("load profile", 100, () => {
          step("show page", 200, () => {
