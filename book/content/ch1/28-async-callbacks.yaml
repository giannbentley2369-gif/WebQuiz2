id: ch1-async-callbacks
title: "JavaScript ناهمگام (Asynchronous) و Callback"
slides: "Introduction to JS، اسلایدهای ۵۳ و ۵۴"
lesson: |
  ### یک آشپزخانه، یک آشپز: single-threaded یعنی چه؟
  فرض کن رستورانی فقط **یک آشپز** دارد. این آشپز در هر لحظه فقط یک کار می‌تواند بکند: یا پیاز خرد می‌کند، یا سس را هم می‌زند. JavaScript دقیقاً همین‌طور است. طبق اسلاید ۵۳، JavaScript به‌طور پیش‌فرض **single-threaded** است؛ یعنی فقط یک **thread** دارد (thread یا «رشته‌ی اجرا» یعنی یک مسیر که دستورها پشت سر هم روی آن اجرا می‌شوند) و **در هر لحظه فقط یک کار** انجام می‌دهد.

  حالا مشکل این است که طبق همین اسلاید، **بعضی کارها زمان‌بر هستند**؛ مثل گرفتن داده از سرور (fetching data) یا منتظر ماندن برای یک تایمر. اگر آشپزِ ما برنج را بار بگذارد و بیست دقیقه بالای قابلمه بایستد و فقط نگاهش کند، هیچ سفارش دیگری آماده نمی‌شود. به این وضع **blocking** (مسدود کردن) می‌گویند. آشپز باهوش برنج را بار می‌گذارد، یک **زنگ (تایمر)** تنظیم می‌کند و سراغ کارهای دیگر می‌رود؛ هر وقت زنگ زد، به برنج برمی‌گردد.

  اسلاید ۵۳ همین را می‌گوید: **JavaScript به جای اینکه همه‌چیز را مسدود کند، از کد ناهمگام (asynchronous code) استفاده می‌کند** و **کد ناهمگام اجازه می‌دهد در زمان انتظار، کارهای دیگر اجرا شوند**.

  - **همگام (synchronous)**: هر دستور صبر می‌کند تا دستور قبلی **کاملاً** تمام شود.
  - **ناهمگام (asynchronous)**: کار زمان‌بر را **شروع می‌کنیم**، منتظرش نمی‌مانیم و به کارهای دیگر می‌رسیم؛ نتیجه را **بعداً**، هر وقت آماده شد، رسیدگی می‌کنیم.

  ::: analogy
  باجه‌ی بانک را در نظر بگیر. در حالت همگام، پشت باجه می‌ایستی و تا کارت تمام نشود تکان نمی‌خوری و نفر بعدی هم پشت سرت منتظر می‌ماند. در حالت ناهمگام، شماره‌ی نوبت می‌گیری، می‌نشینی و کار دیگری می‌کنی؛ هر وقت شماره‌ات را صدا زدند، سراغ باجه می‌روی. «صدا زدن شماره‌ات» همان **callback** است که پایین‌تر می‌بینیم.
  :::

  پس انتظار را چه کسی می‌کشد؟ JavaScript همیشه داخل یک **محیط اجرا** کار می‌کند: مرورگر با Web APIها و Node.js با System APIها. کارهای زمان‌بر، مثل شمردن زمان یک تایمر یا انتظار برای جواب شبکه، را **خود محیط** و بیرون از تنها thread جاوااسکریپت انجام می‌دهد. وقتی کار تمام شد، تابعی که برایش سپرده بودیم در صف قرار می‌گیرد و هر وقت thread بیکار شد اجرا می‌شود. این همان ویژگی **non-blocking event loop** (حلقه‌ی رویدادِ غیرمسدودکننده) است که در فهرست ویژگی‌های JavaScript (اسلاید ۹) دیدیم. جزئیات این صف‌ها و ترتیب دقیقشان را در درس event loop در آخر همین فصل می‌بینیم.

  ### نمودار اسلاید ۵۳: همگام در برابر ناهمگام
  اسلاید ۵۳ دو نمودار کنار هم دارد. در هر دو، **Process A** (مثلاً کد ما) یک درخواست برای **Process B** (مثلاً سرور) می‌فرستد و B مدتی مشغول کار است:

  - **Synchronous**: نوار فعالیت A بعد از فرستادن درخواست **قطع می‌شود** و برچسب **Wait for response** دارد؛ یعنی A بیکار منتظر می‌ماند و فقط وقتی پاسخ B برگشت، کارش را از سر می‌گیرد.
  - **Asynchronous**: نوار فعالیت A **بدون وقفه ادامه دارد** و برچسب **Continue working** دارد؛ B هم‌زمان کار می‌کند و پاسخ وقتی می‌رسد که A هنوز مشغول است (**Get response**).

  | | Synchronous (همگام) | Asynchronous (ناهمگام) |
  |---|---|---|
  | بعد از فرستادن درخواست | A منتظر می‌ماند (Wait for response) | A به کارش ادامه می‌دهد (Continue working) |
  | وقتی پاسخ B می‌رسد | A تازه کارش را از سر می‌گیرد | A پاسخ را دریافت و رسیدگی می‌کند (Get response) |
  | نتیجه | زمان A در انتظار هدر می‌رود | A و B هم‌زمان مشغول‌اند |

  ### blocking را با چشم خودت ببین
  این حلقه، تنها thread جاوااسکریپت را ۳ ثانیه مشغول نگه می‌دارد (به این کار **busy waiting** یا «انتظار مشغول» می‌گویند):

  ```js
  console.log("start");
  const start = Date.now();
  while (Date.now() - start < 3000) {
    // busy waiting for 3 seconds: the only thread is stuck here
  }
  console.log("end (3 seconds later)");
  ```

  اگر این کد در مرورگر اجرا شود، در این ۳ ثانیه صفحه **یخ می‌زند**: دکمه‌ها به کلیک جواب نمی‌دهند، اسکرول کار نمی‌کند و هیچ تایمری اجرا نمی‌شود. برای همین کارهای طولانی را هرگز این‌طور منتظر نمی‌مانیم.

  ### تابع callback چیست؟
  طبق اسلاید ۵۴، **callback** یک تابع ساده است که **به‌عنوان یک مقدار به تابع دیگری داده می‌شود** و **فقط وقتی رویداد مربوط رخ داد اجرا می‌شود**. این کار ممکن است چون در JavaScript تابع‌ها first-class هستند (مثل هر مقدار دیگری می‌توان آن‌ها را در متغیر گذاشت یا به تابع دیگر داد). اسمش هم از همین‌جا آمده: «بعداً با من تماس بگیر» (call me back).

  اول یک callback ساده و **همگام** را ببین:

  ```js
  function greetUser(name, callback) {
    const message = "Hello, " + name;
    callback(message); // we call the function we were given
  }

  greetUser("Sara", (msg) => {
    console.log(msg); // Hello, Sara
  });
  ```

  دقت کن که **خودِ تابع** را می‌دهیم (`showMessage`)، نه نتیجه‌ی صدا زدنش را (`showMessage()`). پرانتز یعنی «همین حالا اجرا کن».

  ### تایمرها: setTimeout و دوستانش
  اسلاید ۵۴: «یک مثال رایج، استفاده از **تایمرها** است». `setTimeout(callback, delay)` به محیط اجرا می‌گوید «این تابع را دست‌کم بعد از `delay` میلی‌ثانیه اجرا کن» (۱۰۰۰ میلی‌ثانیه = ۱ ثانیه). نکته‌ی کلیدی: خودِ `setTimeout` **بلافاصله برمی‌گردد** و منتظر نمی‌ماند:

  ```js
  console.log("1: order placed");
  setTimeout(() => {
    console.log("3: pizza delivered");
  }, 2000);
  console.log("2: watching a movie");
  // 1: order placed
  // 2: watching a movie
  // 3: pizza delivered   (about 2 seconds later)
  ```

  قاعده‌های تایمر:

  1. `setTimeout` فقط تابع را **ثبت** می‌کند و بلافاصله برمی‌گردد؛ پس کدِ بعد از آن زودتر اجرا می‌شود.
  2. تأخیر، **حداقلِ** زمان انتظار است، نه زمان دقیق: callback وقتی اجرا می‌شود که هم زمانش رسیده باشد و هم thread بیکار باشد (کد فعلی تمام شده باشد).
  3. `setTimeout(fn, 0)` یعنی «هر چه زودتر، **بعد از** تمام شدن کد فعلی»؛ نه «همین حالا».
  4. تایمرهایی که با هم ثبت شده‌اند به ترتیب **زمان موعدشان** اجرا می‌شوند؛ تایمرهایی با تأخیر برابر، به ترتیب **ثبت شدنشان**.

  ```js
  setTimeout(() => console.log("A (300 ms)"), 300);
  setTimeout(() => console.log("B (0 ms)"), 0);
  setTimeout(() => console.log("C (100 ms)"), 100);
  console.log("D (sync)");
  // D (sync)
  // B (0 ms)
  // C (100 ms)
  // A (300 ms)
  ```

  و یک حلقه‌ی طولانی همگام، تایمرها را عقب می‌اندازد؛ حتی تایمری را که موعدش رسیده است:

  ```js
  const start = Date.now();
  setTimeout(() => {
    console.log("timer waited at least 200 ms:", Date.now() - start >= 200);
  }, 50);
  while (Date.now() - start < 200) {
    // the thread is busy for 200 ms
  }
  console.log("loop finished");
  // loop finished
  // timer waited at least 200 ms: true
  ```

  تایمرهای دیگر:

  | تابع | کار |
  |---|---|
  | `setTimeout(fn, ms)` | `fn` را **یک بار**، دست‌کم بعد از `ms` میلی‌ثانیه اجرا می‌کند و یک شناسه (id) برمی‌گرداند. |
  | `setInterval(fn, ms)` | `fn` را **هر** `ms` میلی‌ثانیه **تکرار** می‌کند تا متوقفش کنیم؛ این هم شناسه برمی‌گرداند. |
  | `clearTimeout(id)` | یک `setTimeout` را **قبل از اجرا** لغو می‌کند. |
  | `clearInterval(id)` | تکرار یک `setInterval` را متوقف می‌کند. |

  ```js
  let count = 0;
  const id = setInterval(() => {
    count++;
    console.log("tick", count);
    if (count === 3) {
      clearInterval(id); // stop repeating
    }
  }, 1000);
  // tick 1, tick 2, tick 3 (one per second), then it stops

  const reminder = setTimeout(() => console.log("Reminder!"), 5000);
  clearTimeout(reminder); // cancelled: "Reminder!" is never printed
  ```

  شناسه‌ای که برمی‌گردد در مرورگر یک عدد است و در Node.js یک شیء `Timeout`؛ لازم نیست نوعش را بدانی، فقط آن را نگه دار و به `clearTimeout` یا `clearInterval` بده.

  ### کد اسلاید ۵۴ قدم‌به‌قدم
  ```js title=callback.js
  function fetchData(callback) {
    setTimeout(() => {
      callback("Data received!");
    }, 1000);
  }

  fetchData(result => {
    console.log(result); // "Data received!" (after 1 sec)
  });
  ```

  (روی اسلاید کنار این کامنت یک تیک سبز هم هست.) `fetchData` رفتار «گرفتن داده از سرور» را شبیه‌سازی می‌کند که حدود ۱ ثانیه طول می‌کشد:

  1. `fetchData` صدا زده می‌شود و تابع `result => { ... }` با نام `callback` به آن داده می‌شود.
  2. `fetchData` تابع دیگری (`() => { ... }`) را با تأخیر ۱۰۰۰ به `setTimeout` می‌دهد. `setTimeout` بلافاصله برمی‌گردد و `fetchData` تمام می‌شود؛ برنامه فعلاً کار دیگری ندارد و منتظر می‌ماند.
  3. حدود ۱ ثانیه بعد، محیط اجرا تابعِ تایمر را اجرا می‌کند و این تابع `callback("Data received!")` را صدا می‌زند.
  4. callbackِ ما با `result = "Data received!"` اجرا می‌شود و آن را چاپ می‌کند.

  پس در این کد **دو callback** داریم: تابعی که به `setTimeout` دادیم (محیط اجرا صدایش می‌زند) و تابعی که به `fetchData` دادیم (تابعِ تایمر صدایش می‌زند).

  چرا `fetchData` نتیجه را `return` نمی‌کند؟ چون وقتی داده آماده می‌شود، تابع مدت‌هاست تمام شده است. `return` داخل callback تایمر، مقدار را به محیط اجرا برمی‌گرداند، نه به کسی که `getData` را صدا زده بود:

  ```js
  function getData() {
    setTimeout(() => {
      return "Data received!"; // returns to the timer, not to getData's caller
    }, 1000);
  }
  console.log(getData()); // undefined: getData has already finished
  ```

  راه درست همان کاری است که اسلاید کرده: نتیجه را **به یک callback تحویل بده**.

  ### callback همگام و callback ناهمگام
  هر callbackی ناهمگام نیست!

  - **callbackهای همگام**: callbackهای `forEach`، `map`، `filter` و تابع مقایسه‌ی `sort` (درس متدهای آرایه) **همان لحظه**، در حین صدا زدن آن متد، اجرا می‌شوند.
  - **callbackهای ناهمگام**: callbackهای `setTimeout` و `setInterval`، تابعی که با `addEventListener("click", fn)` به یک دکمه می‌دهیم (فصل ۲) و توابع خواندن فایل در Node.js (فصل ۳)؛ این‌ها **بعداً**، وقتی رویداد رخ داد، اجرا می‌شوند.

  ```js
  console.log("start");
  [10, 20].forEach((n) => console.log(n));   // runs right now
  setTimeout(() => console.log("timer"), 0); // runs later
  console.log("end");
  // start
  // 10
  // 20
  // end
  // timer
  ```

  ### Callback hell (جهنم callbackها)
  اسلاید ۵۴: **هر callback یک سطح تودرتویی (nesting) اضافه می‌کند و وقتی callbackها زیاد شوند، کد خیلی زود پیچیده می‌شود.** به این وضع **callback hell** (جهنم callbackها) یا «هرم نابودی» (pyramid of doom) می‌گویند. فرض کن سه کار ناهمگام داریم که هر کدام به نتیجه‌ی قبلی نیاز دارد:

  ```js
  function getUser(id, callback) {
    setTimeout(() => callback({ id: id, name: "Sara" }), 100);
  }
  function getOrders(user, callback) {
    setTimeout(() => callback(["book", "pen"]), 100);
  }
  function getDetails(order, callback) {
    setTimeout(() => callback({ item: order, price: 50 }), 100);
  }

  getUser(1, (user) => {
    getOrders(user, (orders) => {
      getDetails(orders[0], (details) => {
        console.log("Nested:", user.name, details.item, details.price);
        // ...and every next step would go one level deeper
      });
    });
  });
  // Nested: Sara book 50 (after about 300 ms)
  ```

  تودرتو کردن یعنی **اجرای پشت سر هم**: هر مرحله فقط بعد از تمام شدن مرحله‌ی قبل شروع می‌شود. اما با هر مرحله‌ی جدید، کد یک پله به راست می‌رود و خواندن، تغییر دادن و رسیدگی به خطاها سخت‌تر می‌شود.

  **BEST PRACTICE** اسلاید ۵۴: **callbackها برای حالت‌های ساده عالی‌اند! منطق را به تابع‌های کوچک‌تر بشکن، به جای اینکه بیش از حد تودرتو کنی.** همان منطق با تابع‌های کوچکِ اسم‌دار (با همان سه تابع `getUser`، `getOrders` و `getDetails` بالا):

  ```js
  function showDetails(details) {
    console.log("Named:", details.item, details.price);
  }
  function handleOrders(orders) {
    getDetails(orders[0], showDetails);
  }
  function handleUser(user) {
    getOrders(user, handleOrders);
  }

  getUser(1, handleUser); // Named: book 50
  ```

  راه‌حل اساسی‌تر، Promise و `async/await` است (روش‌های دوم و سوم) که در درس‌های بعدی می‌بینیم.

  ### خطا در callbackها: الگوی error-first
  در درس «مدیریت خطا: try، catch، finally و throw» دیدیم که `try...catch` دورِ یک کار ناهمگام، خطایی را که **بعداً** داخل callback رخ می‌دهد نمی‌گیرد. پس در روش callback، رسیدگی به خطا **دستی (manual)** است (اسلاید ۵۷: «callbacks → manual»). قرارداد رایج (به‌خصوص در Node.js) **error-first callback** است: پارامتر اول callback **خطا** است (اگر خطایی نباشد `null`) و پارامتر دوم **نتیجه**:

  ```js
  function readConfig(name, callback) {
    setTimeout(() => {
      if (!name) {
        callback(new Error("No file name given")); // failure: the error comes first
        return;
      }
      callback(null, { file: name, debug: true });   // success: null error, then the result
    }, 50);
  }

  function handleConfig(err, config) {
    if (err) {
      console.log("Failed:", err.message);
      return; // stop here
    }
    console.log("Config:", config.file);
  }

  readConfig("app.json", handleConfig); // Config: app.json
  readConfig("", handleConfig);         // Failed: No file name given
  ```

  ::: tip
  - `setTimeout` و `setInterval` بلافاصله برمی‌گردند؛ کدِ بعد از آن‌ها اول اجرا می‌شود.
  - عدد تأخیر، حداقل زمان انتظار است.
  - تایمرهایی که با هم ثبت شده‌اند: تأخیر کمتر زودتر؛ تأخیر برابر، به ترتیب ثبت.
  - callbackهای تودرتو یعنی اجرای پشت سر هم؛ تایمرهای کنار هم یعنی انتظارِ هم‌زمان.
  - به تایمر خودِ تابع را بده (`fn`)، نه نتیجه‌ی صدا زدنش را (`fn()`).
  :::

  ::: trap دام‌های تستی
  - `setTimeout(fn, 0)` فوری نیست؛ `fn` بعد از تمام شدن کد همگامِ فعلی اجرا می‌شود.
  - `return` داخل callback تایمر، از تابع بیرونی `return` نمی‌کند؛ نتیجه‌ی ناهمگام را باید به یک callback داد.
  - `try...catch` دورِ `setTimeout` خطای داخل callback را نمی‌گیرد؛ در error-first باید `err` را دستی بررسی کرد.
  - callbackهای `forEach` و `map` همگام‌اند؛ «callback» همیشه به معنای «ناهمگام» نیست.
  - `setTimeout(greet(), 1000)` تابع `greet` را **همین حالا** صدا می‌زند و مقدار برگشتی‌اش را به تایمر می‌دهد.
  - یک حلقه‌ی طولانی همگام همه‌چیز را مسدود می‌کند؛ تایمری که موعدش رسیده هم تا آخر حلقه صبر می‌کند.
  :::

  ::: note
  ترتیب دقیق اجرا وقتی Promise هم در کار باشد (microtask و macrotask) موضوع درس event loop است. در این درس فقط تایمرها و callbackها را دیدیم.
  :::

  ::: summary
  - JavaScript تک‌نخی (single-threaded) است و در هر لحظه یک کار انجام می‌دهد؛ برای کارهای زمان‌بر (شبکه، تایمر) از کد ناهمگام استفاده می‌کند تا همه‌چیز مسدود نشود.
  - callback تابعی است که به تابع دیگری داده می‌شود و وقتی رویداد رخ داد اجرا می‌شود؛ تایمرها مثال رایجش هستند.
  - تودرتویی زیاد callbackها به callback hell می‌رسد؛ منطق را به تابع‌های کوچک‌تر بشکن.
  - خطاها در روش callback دستی رسیدگی می‌شوند (الگوی error-first).
  :::
