          });
        });
      });
      console.log("started");
    options:
      - out: ["started", "login", "load profile", "show page", "all done"]
      - out: ["started", "load profile", "show page", "login", "all done"]
      - out: ["login", "load profile", "show page", "all done", "started"]
      - out: ["started", "all done", "login", "load profile", "show page"]
    answer: 1
    explain: |
      همان اول فقط تایمر `login` ثبت می‌شود و `started` (کد همگام) اول چاپ می‌شود. هر مرحله‌ی بعدی **داخل callbackِ مرحله‌ی قبل** ثبت می‌شود؛ پس شمارش `load profile` تازه بعد از اجرای `login` (۳۰۰ میلی‌ثانیه) شروع می‌شود و همین‌طور تا آخر. تودرتویی یعنی اجرای پشت سر هم و تأخیرهای کوچک‌ترِ مرحله‌های بعد هم این ترتیب را عوض نمی‌کنند. گزینه‌ی ۲ فکر کرده همه‌ی تایمرها از اول ثبت شده‌اند و بر اساس تأخیر مرتب می‌شوند، گزینه‌ی ۳ کد همگام را آخر گذاشته و گزینه‌ی ۴ فکر کرده درونی‌ترین callback زودتر از همه اجرا می‌شود.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      const start = Date.now();
      setTimeout(() => {
        console.log("timer waited at least 200 ms:", Date.now() - start >= 200);
      }, 50);
      while (Date.now() - start < 200) {
        // busy waiting: blocks the only thread
      }
      console.log("loop finished");
    options:
      - out: ["timer waited at least 200 ms: false", "loop finished"]
      - out: ["loop finished", "timer waited at least 200 ms: false"]
      - out: ["loop finished", "timer waited at least 200 ms: true"]
      - out: ["loop finished"]
    answer: 3
    explain: |
      تایمر ۵۰ میلی‌ثانیه‌ای ثبت می‌شود، اما حلقه‌ی `while` تنها thread جاوااسکریپت را ۲۰۰ میلی‌ثانیه مشغول نگه می‌دارد (busy waiting). در این مدت هیچ callbackی نمی‌تواند اجرا شود، حتی اگر موعدش رسیده باشد؛ پس اول `loop finished` و بعد callback تایمر چاپ می‌شود و تا آن موقع دست‌کم ۲۰۰ میلی‌ثانیه گذشته است (`true`). گزینه‌ی ۱ فکر کرده تایمر وسط حلقه آن را قطع می‌کند، گزینه‌ی ۲ فکر کرده تایمر سر ۵۰ میلی‌ثانیه «در پس‌زمینه» اجرا شده و فقط چاپش عقب افتاده، و گزینه‌ی ۴ فکر کرده تایمری که موعدش گذشته لغو می‌شود.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      function divide(a, b, callback) {
        setTimeout(() => {
          if (b === 0) {
            callback(new Error("Cannot divide by zero"));
          } else {
            callback(null, a / b);
          }
        }, 100);
      }

      function report(err, result) {
        if (err) {
          console.log("Error:", err.message);
          return;
        }
        console.log("Result:", result);
      }

      divide(10, 2, report);
      divide(1, 0, report);
      console.log("Calculating...");
    options:
      - out: ["Result: 5", "Error: Cannot divide by zero", "Calculating..."]
      - out: ["Calculating...", "Result: 5", "Error: Cannot divide by zero"]
      - out: ["Calculating...", "Error: Cannot divide by zero", "Result: 5"]
      - out: ["Calculating...", "Result: 5", "Result: Infinity"]
    answer: 2
    explain: |
      هر دو `divide` فقط تایمر ثبت می‌کنند، پس اول `Calculating...` چاپ می‌شود. دو تایمر با تأخیر یکسان (۱۰۰) به ترتیب ثبت شدنشان اجرا می‌شوند: اول `divide(10, 2)` که `callback(null, 5)` را صدا می‌زند و `Result: 5` چاپ می‌شود؛ بعد `divide(1, 0)` که خطا را در **پارامتر اول** می‌فرستد و `report` آن را دستی بررسی می‌کند. گزینه‌ی ۱ تایمرها را همگام فرض کرده، گزینه‌ی ۳ فکر کرده خطاها زودتر می‌رسند و گزینه‌ی ۴ رفتار خودِ `1 / 0` (یعنی `Infinity`) را در نظر گرفته، در حالی که شرط `b === 0` پیش از تقسیم، مسیر خطا را انتخاب می‌کند.

  - level: hard
    stem: |
      خروجی کد زیر کدام است؟
    check: output
    code: |
      let total = 0;
      setTimeout(() => {
        total += 10;
      }, 0);
      total += 1;
      console.log("now:", total);
      setTimeout(() => {
        console.log("later:", total);
      }, 0);
    options:
      - out: ["now: 11", "later: 11"]
      - out: ["now: 1", "later: 1"]
      - out: ["now: 10", "later: 11"]
      - out: ["now: 1", "later: 11"]
    answer: 4
    explain: |
      callbackِ تایمر اول حتی با تأخیر `0` بعد از کد همگام اجرا می‌شود؛ پس در لحظه‌ی چاپ `now:` فقط `total += 1` اجرا شده و مقدار `1` است (رد گزینه‌های ۱ و ۳). بعد از تمام شدن کد همگام، دو تایمر با تأخیر یکسان به ترتیب ثبتشان اجرا می‌شوند: اول `total += 10` (یعنی ۱۱) و بعد `later: 11` چاپ می‌شود. گزینه‌ی ۲ فراموش کرده تایمر اول قبل از تایمر دوم اجرا می‌شود.

  - level: hard
    stem: |
      در کد اسلاید ۵۴، کدام جمله **درست** است؟
    manual: "Concept question about which function calls which callback; the code itself was run in Node.js (it prints Data received! after about 1 s)."
    code: |
      function fetchData(callback) {
        setTimeout(() => {
          callback("Data received!");
        }, 1000);
      }

      fetchData(result => {
        console.log(result);
      });
    options:
      - 'دو callback داریم: تابع `() => { ... }` که به `setTimeout` داده شده و محیط اجرا بعد از ۱ ثانیه صدایش می‌زند، و تابع `result => { ... }` که با نام `callback` به `fetchData` داده شده و تابعِ تایمر صدایش می‌زند.'
      - 'فقط یک callback داریم: `result => { ... }` که خودِ `setTimeout` آن را مستقیم بعد از ۱ ثانیه صدا می‌زند.'
      - '`fetchData` بعد از ۱ ثانیه مقدار `"Data received!"` را `return` می‌کند و `console.log` همان مقدار را چاپ می‌کند.'
      - 'تابع `result => { ... }` یک بار بلافاصله هنگام صدا زدن `fetchData` و یک بار دیگر بعد از ۱ ثانیه اجرا می‌شود.'
    answer: 1
    explain: |
      به `setTimeout` تابع بی‌نام `() => { callback("Data received!"); }` داده شده؛ این تابع callbackِ تایمر است و محیط اجرا بعد از ۱ ثانیه صدایش می‌زند. خودِ این تابع، callbackِ ما (`result => { ... }` که داخل `fetchData` اسمش `callback` است) را با مقدار `"Data received!"` صدا می‌زند. پس `setTimeout` مستقیماً با تابع ما کاری ندارد (رد گزینه‌ی ۲). `fetchData` هیچ `return`ی ندارد و نتیجه فقط از راه callback می‌رسد (رد گزینه‌ی ۳). callback ما هم فقط یک بار و فقط بعد از رخ دادن رویداد اجرا می‌شود (رد گزینه‌ی ۴).
