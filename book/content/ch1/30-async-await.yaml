    answer: 3
    explain: |
      اسلاید ۵۶: «Must be inside an async function». تنها استثنا top-level await در ES moduleهاست (مثلاً `<script type="module">` یا فایل `.mjs`). گزینه‌ی ۱ غلط است؛ `await` در تابع معمولی SyntaxError می‌دهد. گزینه‌ی ۲ غلط است؛ callbackِ `.then()` اگر async نباشد اجازه‌ی `await` ندارد. گزینه‌ی ۴ هم غلط است؛ `try...catch` فقط یک **توصیه** است (BEST PRACTICE)، نه شرطِ نوشتنِ `await`.

  - level: easy
    stem: |
      توصیه‌ی BEST PRACTICE اسلاید ۵۶ کدام است؟
    options:
      - 'بعد از هر `await` یک `setTimeout` بگذار تا برنامه قفل نشود'
