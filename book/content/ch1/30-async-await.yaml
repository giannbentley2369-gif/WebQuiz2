      }

      getData();
    options:
      - out: ["result: Error occurred!", "done"]
      - out: "Error: Error occurred!"
      - out: ["Error: Error occurred!", "done"]
      - out: "!! UnhandledPromiseRejection"
    answer: 3
    explain: |
      Promise rejected می‌شود، پس `await fetchData()` خطا را همان‌جا throw می‌کند؛ خطِ `result:` اجرا نمی‌شود و اجرا به `catch` می‌پرد: `Error: Error occurred!`. بعد از `try...catch`، اجرای تابع به‌طور عادی ادامه پیدا می‌کند و `done` هم چاپ می‌شود (گزینه‌ی ۲ این را فراموش کرده است). گزینه‌ی ۱ فکر کرده `await` دلیلِ rejection را مثل یک مقدار برمی‌گرداند؛ گزینه‌ی ۴ غلط است، چون خطا با `try...catch` مدیریت شده است.

