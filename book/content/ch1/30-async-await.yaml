    answer: 2
    explain: |
      اسلاید ۵۶: «Use async before a function to return a Promise». مقدارِ return‌شده داخل Promise قرار می‌گیرد (Promise با آن fulfilled می‌شود) و برای رسیدن به آن باید `await` یا `.then()` بنویسیم؛ پس گزینه‌ی ۱ غلط است. گزینه‌ی ۳ غلط است، چون تابع async حتی بدون `await` هم Promise برمی‌گرداند. گزینه‌ی ۴ هم ربطی به async ندارد.

  - level: easy
    stem: |
