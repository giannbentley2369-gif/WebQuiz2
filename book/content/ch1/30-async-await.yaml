id: ch1-async-await
title: "async/await و مقایسه‌ی روش‌های ناهمگام"
slides: "Introduction to JS، اسلایدهای ۵۶ تا ۵۸"
lesson: |
  ### async/await چیست؟
  Promiseها مشکل callback hell را حل کردند، اما زنجیره‌های طولانیِ `.then()` هنوز با کدِ «معمولی» فرق دارند: هر مرحله داخل یک تابعِ جداست و برای رساندن یک مقدار به مرحله‌ی بعد باید آن را `return` کنیم. استاندارد ES2017 (همان **ES8**) دو کلمه‌ی کلیدی **`async`** و **`await`** را اضافه کرد. اسلاید ۵۶ این‌ها را می‌گوید:

  - **Built on top of Promises (ES8+)**: async/await روی همان Promiseها ساخته شده است؛ چیزی جای Promise نمی‌نشیند، فقط **syntax** (نحوِ نوشتن) تمیزتر می‌شود.
  - **Lets you write async code that looks like sync code**: کدِ ناهمگام را طوری می‌نویسیم که **ظاهرش** شبیه کد همگام باشد (خط به خط، از بالا به پایین).
  - **Use `async` before a function to return a Promise**: با گذاشتن `async` قبل از یک تابع، آن تابع یک Promise برمی‌گرداند.
  - **Use `await` to pause until a Promise resolves**: با `await` اجرا را تا settled شدنِ یک Promise متوقف می‌کنیم.
  - **Must be inside an `async` function**: `await` باید داخل یک تابع `async` باشد.

  ::: analogy
  در یک کافه قهوه سفارش داده‌ای و می‌گویی: «همین‌جا می‌ایستم تا قهوه‌ام آماده شود». این یعنی `await`. اما کافه به خاطر تو تعطیل نمی‌شود: باریستا به بقیه‌ی مشتری‌ها می‌رسد و صف جلو می‌رود. وقتی قهوه آماده شد، تو دقیقاً از همان جایی که ایستاده بودی ادامه می‌دهی. `await` فقط **تابعِ خودش** را متوقف می‌کند، نه کل برنامه را.
  :::

  ### کلمه‌ی کلیدی `async`
  اگر قبل از تعریف یک تابع بنویسی `async`، صدا زدنِ آن تابع **همیشه یک Promise برمی‌گرداند**:
  - اگر تابع مقداری را `return` کند، Promise با همان مقدار **fulfilled** می‌شود.
  - اگر تابع خطا `throw` کند، Promise با همان خطا **rejected** می‌شود (برنامه crash نمی‌کند).
  - اگر تابع خودش یک Promise برگرداند، Promiseِ تابع از آن **پیروی** می‌کند (Promise داخل Promise نمی‌شود).

  ```js
  async function greet() {
    return "hi";
  }

  const result = greet();
  console.log(result);                // Promise { 'hi' }
  result.then((v) => console.log(v)); // hi
  ```

  Node.js یک Promiseِ fulfilled را به شکل `Promise { 'hi' }` چاپ می‌کند؛ کنسول مرورگر همین را به شکل `Promise {<fulfilled>: 'hi'}` نشان می‌دهد.

  ```js
  async function fail() {
    throw new Error("oops");
  }

  fail().catch((err) => console.log("caught:", err.message)); // caught: oops
  ```

  `async` را می‌توان روی همه‌ی شکل‌های تابع گذاشت؛ از جمله **async arrow function** (تابع پیکانیِ ناهمگام). دقت کن که در arrow function، کلمه‌ی `async` **قبل از پرانتزِ پارامترها** می‌آید:

  ```js
  async function a() {}            // function declaration
  const b = async function () {};  // function expression
  const c = async () => {};        // arrow function
  const d = async (x) => x * 2;    // arrow function with implicit return: d(4) gives a Promise of 8
  const obj = { async load() {} }; // object method
  class Api { async get() {} }     // class method
  ```

  ### کلمه‌ی کلیدی `await`
  `await` را قبل از یک Promise می‌نویسیم، یعنی «همین‌جا صبر کن تا این Promise settled شود»:
  - اگر Promise **fulfilled** شود، `await` **مقدارِ** آن را برمی‌گرداند (Promise را «باز» می‌کند).
  - اگر Promise **rejected** شود، `await` همان‌جا خطا را **throw** می‌کند؛ برای همین `try...catch` با آن کار می‌کند.
  - اگر بعد از `await` مقداری بیاید که Promise نیست (مثل `await 5`)، همان مقدار را برمی‌گرداند؛ ولی باز هم تابع لحظه‌ای مکث می‌کند و ادامه‌اش ناهمگام اجرا می‌شود.

  ```js
  function wait(ms, value) {
    return new Promise((resolve) => setTimeout(() => resolve(value), ms));
  }

  async function main() {
    console.log("start");
    const a = await wait(1000, 10); // main() pauses here for 1 second
    console.log("a =", a);          // a = 10
    const b = await 5;              // not a Promise: b is just 5
    console.log("b =", b);          // b = 5
    return a + b;
  }

  main().then((sum) => console.log("sum =", sum)); // sum = 15
  ```

  همین تابع را فقط با Promise و `then` هم می‌شد نوشت (خروجی دقیقاً همان است). async/await همین کار را تمیزتر و «خطی» می‌نویسد:

  ```js
  function main() {
    console.log("start");
    return wait(1000, 10).then((a) => {
      console.log("a =", a);
      const b = 5;
      console.log("b =", b);
      return a + b;
    });
  }
  ```

  ### `await` فقط داخل تابع `async`
  اگر `await` را داخل یک تابع **معمولی** بنویسی، خطای **SyntaxError** (خطای نحوی) می‌گیری:

  ```js
  function load() {
    const data = await fetchData();
    // SyntaxError: await is only valid in async functions and the top level bodies of modules
  }
  ```

  SyntaxError هنگام خواندنِ کد و **قبل از اجرای برنامه** پیدا می‌شود؛ پس در این حالت **هیچ خطی** از آن فایل اجرا نمی‌شود، حتی خط‌های قبل از این تابع. راه حل: `async function load() { ... }`.

  ::: info بیشتر بدانیم: top-level await
  همان‌طور که پیام خطا می‌گوید، `await` در **سطح بالای** (top level؛ یعنی بیرون از هر تابعی) یک **ES module** هم مجاز است: در مرورگر داخل `<script type="module">` و در Node.js در فایل‌های `.mjs` (یا پروژه‌ای که در `package.json` مقدار `"type": "module"` دارد). در یک `<script>` معمولیِ مرورگر، `await` بیرون از تابع async خطای SyntaxError می‌دهد. (نسخه‌های جدید Node.js فایل `.js`ی را که top-level await دارد، اگر نوعش در `package.json` مشخص نشده باشد، خودکار ES module فرض می‌کنند.)

  ```js title=main.mjs
  const value = await Promise.resolve(42); // allowed: top level of an ES module
  console.log(value); // 42
  ```
  :::

  ### `await` فقط همان تابع را متوقف می‌کند
  این مهم‌ترین نکته‌ی async/await است:

  ```js
  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function job() {
    console.log("2: job started");
    await wait(500);
    console.log("4: job finished");
  }

  console.log("1: before");
  job();
  console.log("3: after calling job()");
  // 1: before
  // 2: job started
  // 3: after calling job()
  // 4: job finished
  ```

  1. کدِ تابع async تا **اولین `await`** مثل یک تابع معمولی، همگام اجرا می‌شود (`2`).
  2. به `await` که رسید، `job` متوقف می‌شود و همان لحظه یک Promiseِ pending به صدازننده برمی‌گرداند.
  3. صدازننده (اینجا کد اصلی) **منتظر نمی‌ماند** و ادامه می‌دهد (`3`).
  4. نیم ثانیه بعد، `job` دقیقاً از همان خط ادامه پیدا می‌کند (`4`).

  اگر بخواهی صدازننده هم صبر کند، باید خودش بنویسد `await job()` (پس خودش هم باید async باشد) یا از `job().then(...)` استفاده کند.

  ### کد اسلاید ۵۶ و دو مشکلش
  ```js title=asyncawait.js
  async function getData() {
    try {
      const result = await fetchData();
      console.log(result);
    } catch (err) {
      console.error("Error:", err);
    }
  }
  ```

  این کد ساختارِ درستِ async/await را نشان می‌دهد: `await` داخل تابع `async` و داخل `try...catch`. ولی اگر همین را به‌تنهایی اجرا کنی، **هیچ خروجی‌ای ندارد**:
  1. `getData` فقط **تعریف** شده و هیچ‌جا صدا زده نشده است؛ تعریف کردنِ یک تابع، آن را اجرا نمی‌کند.
  2. `fetchData` در این تکه کد تعریف نشده است. اگر `getData()` را صدا بزنیم، `fetchData()` خطای `ReferenceError` می‌دهد که داخل `try` رخ داده و `catch` آن را می‌گیرد؛ پس چاپ می‌شود `Error: ReferenceError: fetchData is not defined`. اگر هم `fetchData` اسلاید ۵۵ را (که یک **شیء** Promise است، نه تابع) بالای آن بگذاریم، `fetchData()` خطای `TypeError: fetchData is not a function` می‌دهد که باز هم `catch` آن را چاپ می‌کند.

  نسخه‌ی درست و قابل اجرا: `fetchData` را **تابعی که Promise برمی‌گرداند** تعریف می‌کنیم و `getData()` را صدا می‌زنیم:

  ```js
  function fetchData() {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        resolve("Data received!");
        // reject("Error occurred!");
      }, 1000);
    });
  }

  async function getData() {
    try {
      const result = await fetchData();
      console.log(result);          // "Data received!" (after 1 sec)
    } catch (err) {
      console.error("Error:", err); // runs only if fetchData rejects
    }
  }

  getData();
  ```

  راه دیگر این است که `fetchData` اسلاید ۵۵ را نگه داریم و بنویسیم `await fetchData` (**بدون پرانتز**)؛ چون `await` را می‌توان مستقیم روی خودِ شیء Promise نوشت. اگر در `fetchData` به جای `resolve` خطِ `reject("Error occurred!")` اجرا شود، `await` خطا را throw می‌کند، اجرا به `catch` می‌پرد و چاپ می‌شود: `Error: Error occurred!`.

  ::: note `console.error` چیست؟
  `console.error` مثل `console.log` چاپ می‌کند، ولی در «جریان خطا» (stderr)؛ کنسول مرورگر آن را قرمز نشان می‌دهد. در تست‌های این کتاب، برای سادگی داخل `catch` از `console.log` استفاده می‌کنیم.
  :::

  ### BEST PRACTICE: `await` را داخل `try...catch` بگذار
  اسلاید ۵۶: «Always wrap `await` calls in `try...catch` to handle errors gracefully». چون Promiseِ rejected در خطِ `await` مثل یک `throw` عمل می‌کند، اگر `try...catch` نباشد خطا از تابع بیرون می‌رود، Promiseِ تابعِ async rejected می‌شود و اگر کسی آن را catch نکند، همان **unhandled rejection** درس Promise رخ می‌دهد. با `finally` هم می‌توان کارِ «جمع‌وجور کردن» را انجام داد:

  ```js
  function loadUser(ok) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        if (ok) resolve({ name: "Sara" });
        else reject(new Error("User not found"));
      }, 500);
    });
  }

  async function showUser() {
    console.log("Loading...");
    try {
      const user = await loadUser(false);  // this Promise rejects
      console.log("Hello,", user.name);    // skipped
    } catch (err) {
      console.log("Failed:", err.message); // Failed: User not found
    } finally {
      console.log("Hide spinner");         // always runs
    }
  }

  showUser();
  ```

  راه دیگر این است که خطا را بیرونِ تابع بگیریم: `showUser().catch(...)`؛ چون تابع async یک Promise برمی‌گرداند.

  ### `return` یا `return await`؟
  ```js
  function failLater() {
    return new Promise((resolve, reject) => {
      setTimeout(() => reject(new Error("late")), 100);
    });
  }

  async function a() {
    try {
      return failLater();       // returns the Promise: this try...catch never sees its rejection
    } catch (err) {
      return "caught in a";
    }
  }

  async function b() {
    try {
      return await failLater(); // waits here, so the rejection is thrown inside try
    } catch (err) {
      return "caught in b";
    }
  }

  a().then((v) => console.log("a:", v)).catch((err) => console.log("a rejected:", err.message));
  b().then((v) => console.log("b:", v)).catch((err) => console.log("b rejected:", err.message));
  // a rejected: late
  // b: caught in b
  ```

  در `a`، تابع **قبل از** rejected شدنِ Promise تمام شده و از بلوک `try` بیرون رفته است؛ پس `catch` آن هرگز اجرا نمی‌شود و Promiseِ `a()` همراه با Promiseِ برگردانده‌شده rejected می‌شود. در `b`، `await` تابع را داخل `try` نگه می‌دارد تا Promise تمام شود؛ rejection همان‌جا throw می‌شود و `catch` آن را می‌گیرد. خلاصه: اگر می‌خواهی خطای یک Promise را با `try...catch` همان تابع بگیری، باید آن را `await` کنی.

  ### مقایسه‌ی سه روش (اسلاید ۵۷)
  | | Callbacks | Promises | async/await |
  |---|---|---|---|
  | چیست؟ | تابعی را پاس می‌دهیم تا بعداً اجرا شود (Pass a function to run later) | نماینده‌ی یک مقدار آینده با وضعیت‌هایش (Represent a future value with states) | روی Promiseها ساخته شده، با syntax تمیزتر (Built on Promises, but cleaner syntax) |
  | شکل کد | تودرتو؛ خطر «callback hell» | زنجیره با `.then()` / `.catch()` | شبیه کد همگام؛ خواندنش آسان‌تر (looks synchronous, easier to read) |
  | مدیریت خطا | **دستی** (manual): در هر سطح خودمان خطا را بررسی می‌کنیم | `.catch()` | `try...catch` |

  یک کار (گرفتن کاربر و بعد سفارش‌هایش) به سه روش. در روش callback، قرارداد رایج Node.js این است که اولین پارامترِ callback خطا باشد (**error-first callback**) و خودمان در هر سطح آن را بررسی کنیم؛ این همان مدیریت خطای «دستی» است:

  ```js
  // 1) Callbacks: errors are checked by hand at every level
  function getUserCb(id, callback) {
    setTimeout(() => callback(null, { id: id, name: "Sara" }), 300);
  }
  function getOrdersCb(user, callback) {
    setTimeout(() => callback(null, ["book", "pen"]), 300);
  }

  getUserCb(1, (err, user) => {
    if (err) return console.log("Error:", err);
    getOrdersCb(user, (err, orders) => {
      if (err) return console.log("Error:", err);
      console.log(orders); // [ 'book', 'pen' ]
    });
  });
  ```

  در دو روش بعدی، `getUser` و `getOrders` همان توابعِ Promise‌برگردانِ درس «Promise» هستند:

  ```js
  // 2) Promises: a flat chain and a single .catch()
  getUser(1)
    .then((user) => getOrders(user))
    .then((orders) => console.log(orders)) // [ 'book', 'pen' ]
    .catch((err) => console.log("Error:", err));

  // 3) async/await: looks like synchronous code, errors with try...catch
  async function showOrders() {
    try {
      const user = await getUser(1);
      const orders = await getOrders(user);
      console.log(orders); // [ 'book', 'pen' ]
    } catch (err) {
      console.log("Error:", err);
    }
  }
  showOrders();
  ```

  ### مشکلات و دام‌های رایج (اسلاید ۵۸)

  #### ۱. Callback hell
  «Callback hell: deeply nested, hard-to-read code»؛ callbackهای تودرتوی عمیق که خواندن، تغییر دادن و مدیریت خطایشان سخت است (نمونه‌ی هرمی‌اش را در درس‌های قبل دیدیم). راه حل: Promise یا async/await، یا شکستن منطق به توابع کوچک‌تر.

  #### ۲. فراموش کردن `await`
  «Forgetting `await`: unexpected Promises instead of values»:

  ```js
  function getUser() {
    return new Promise((resolve) => setTimeout(() => resolve({ name: "Ali" }), 500));
  }

  async function main() {
    const user = getUser();        // forgot await!
    console.log(user);             // Promise { <pending> }
    console.log(user.name);        // undefined (a Promise has no "name" property)
    const realUser = await getUser();
    console.log(realUser.name);    // Ali
  }

  main();
  ```

  #### ۳. rejectionهای catch‌نشده (Uncaught rejections)
  «Uncaught rejections: crashes if `.catch()` or `try...catch` missing»:

  ```js
  async function load() {
    throw new Error("Network down");
  }

  load(); // no try...catch and no .catch(): Node.js crashes, the browser logs "Uncaught (in promise)"
  // fix: load().catch((err) => console.log("Failed:", err.message));
  ```

  #### ۴. Race condition (شرایط مسابقه)
  «Race conditions: multiple async tasks finish in the wrong order». وقتی چند کار async هم‌زمان در جریان‌اند، ترتیبِ **تمام شدنشان** به سرعتِ هر کدام بستگی دارد، نه به ترتیبِ شروعشان. اگر این کارها روی یک متغیرِ مشترک بنویسند، نتیجه به این بستگی پیدا می‌کند که «چه کسی آخر رسید»:

  ```js
  let shown = "";

  function search(query, ms) {
    return new Promise((resolve) => setTimeout(() => resolve("results for " + query), ms));
  }

  async function onType(query, ms) {
    const results = await search(query, ms);
    shown = results; // whoever finishes LAST wins
  }

  onType("ab", 300);  // older request, slow answer
  onType("abc", 100); // newer request, fast answer
  setTimeout(() => console.log(shown), 500); // results for ab  (a stale result!)
  ```

  کاربر «abc» را تایپ کرده، ولی نتیجه‌ی کهنه‌ی «ab» روی صفحه مانده است. نمونه‌ی دیگری را در فعالیت کلاسی اسلاید ۶۰ (درس بعد) می‌بینیم. راه‌حل‌های رایج: برای هر درخواست یک شماره نگه داریم و نتیجه‌ی درخواست‌های قدیمی را نادیده بگیریم، یا کارها را پشت سر هم `await` کنیم.

  #### ۵. `await`های پشت سر هم در حلقه (Blocking awaits in loops)
  «Blocking awaits in loops: slow performance vs running in parallel»:

  ```js
  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function sequential() {
    const start = Date.now();
    for (const ms of [300, 300, 300]) {
      await wait(ms); // each wait starts only after the previous one has finished
    }
    console.log("sequential:", Date.now() - start, "ms"); // about 900 ms
  }

  async function parallel() {
    const start = Date.now();
    await Promise.all([wait(300), wait(300), wait(300)]); // all three start together
    console.log("parallel:", Date.now() - start, "ms");   // about 300 ms
  }

  sequential().then(parallel);
  ```

  وقتی کارها **به هم وابسته‌اند** (هر مرحله به نتیجه‌ی مرحله‌ی قبل نیاز دارد)، `await` کردنِ پشت سر هم لازم است. ولی وقتی **مستقل‌اند**، همه را با هم شروع کن و با `await Promise.all([...])` منتظر همه بمان.

  ::: warning `forEach` منتظر نمی‌ماند
  ```js
  async function main() {
    [1, 2, 3].forEach(async (n) => {
      await wait(100);
      console.log(n);
    });
    console.log("done"); // printed FIRST: forEach does not wait for async callbacks
  }
  main();
  // done
  // 1
  // 2
  // 3
  ```
  `forEach` Promiseهایی را که callbackهای async برمی‌گردانند نادیده می‌گیرد. برای صبر کردنِ پشت سر هم از `for...of` و برای اجرای هم‌زمان از `Promise.all` همراه با `map` استفاده کن.
  :::

  #### ۶. قاطی کردن کد همگام و ناهمگام (Mixing sync & async code)
  «Mixing sync & async code: bugs from assumptions about timing»؛ یعنی باگ‌هایی که از فرضِ اشتباه درباره‌ی «زمان» می‌آیند:

  ```js
  let user;
  setTimeout(() => {
    user = { name: "Sara" };
  }, 100);

  console.log(user);      // undefined: the timer has not run yet
  console.log(user.name); // TypeError: Cannot read properties of undefined (reading 'name')
  ```

  کدِ همگام منتظر کارهای ناهمگام نمی‌ماند؛ هر چیزی که به نتیجه‌ی یک کار ناهمگام نیاز دارد باید **بعد از آن** اجرا شود: داخل `then`، داخل callback، یا بعد از `await`.

  ::: tip نکته
  - `async` یعنی «این تابع همیشه Promise برمی‌گرداند»؛ `await` یعنی «اینجا صبر کن تا Promise settled شود و مقدارش را بده».
  - کدِ قبل از اولین `await` در تابع async همگام اجرا می‌شود؛ از `await` به بعد، بقیه‌ی تابع بعداً ادامه می‌یابد.
  - چند کار مستقل داری؟ اول همه را شروع کن، بعد `await Promise.all([...])`.
  - هر جا `await` نوشتی، یا داخل `try...catch` باشد، یا Promiseِ تابع را بیرون با `.catch()` بگیر.
  :::

  ::: trap دام تستی
  - فراموش کردن `await`: به جای مقدار، `Promise { <pending> }` می‌گیری.
  - `await` در تابع معمولی (غیر async): `SyntaxError`؛ و چون این خطا قبل از اجرا پیدا می‌شود، **هیچ** خطی از فایل اجرا نمی‌شود.
  - `try...catch` فقط خطای Promiseهایی را می‌گیرد که داخل همان `try`، `await` شده‌اند. `return promise` (بدون `await`) و `Promise.reject(...)` بدون `await` از دستِ `catch` در می‌روند.
  - `await` کل برنامه را متوقف نمی‌کند، فقط همان تابع async را؛ کدِ بعد از صدا زدنِ تابع زودتر اجرا می‌شود.
  - تعریف کردنِ یک تابع async آن را اجرا نمی‌کند (کد اسلاید ۵۶ به‌تنهایی خروجی ندارد).
  - `forEach` با callbackِ async منتظر نمی‌ماند.
  :::

  ::: summary
  - async/await (ES2017 = ES8) روی Promiseها ساخته شده و کدِ ناهمگام را شبیه کد همگام می‌کند.
  - تابع `async` همیشه Promise برمی‌گرداند: `return` یعنی fulfilled و `throw` یعنی rejected.
  - `await` فقط داخل تابع `async` (یا سطح بالای ES module)؛ مقدارِ Promise را می‌دهد و اگر Promise rejected شود، throw می‌کند.
  - مقایسه‌ی اسلاید ۵۷: callbacks (تودرتو، خطای دستی)، Promises (زنجیره، `.catch()`)، async/await (خوانا، `try...catch`).
  - دام‌های اسلاید ۵۸: callback hell، فراموش کردن `await`، rejectionِ catch‌نشده، race condition، `await` پشت سر هم در حلقه (حدود ۹۰۰ میلی‌ثانیه در برابر ۳۰۰ با `Promise.all`)، و قاطی کردن کد همگام و ناهمگام.
  :::
questions:
  - level: easy
