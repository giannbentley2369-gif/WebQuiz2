    answer: 4
    explain: |
      اسلاید ۵۶: «Always wrap await calls in try...catch to handle errors gracefully»؛ چون اگر Promiseِ await‌شده rejected شود، `await` خطا را throw می‌کند و بدون `try...catch` تابع async با خطا تمام می‌شود. گزینه‌های ۱ تا ۳ پایه‌ای در اسلایدها ندارند: `setTimeout` ربطی به قفل شدن ندارد، استفاده‌ی هم‌زمان از `await` و `.then()` مجاز است و callback هم سریع‌تر از `await` نیست.

