      - 'کد را در یک thread جداگانه اجرا می‌کند تا برنامه‌ی اصلی متوقف نشود'
      - 'فقط در Node.js کار می‌کند و مرورگرها از آن پشتیبانی نمی‌کنند'
    answer: 1
    explain: |
      اسلاید ۵۶: «Built on top of Promises (ES8+)» و «Lets you write async code that looks like sync code». گزینه‌ی ۲ برعکس است: تابع async خودش Promise برمی‌گرداند و `await` روی Promise کار می‌کند. گزینه‌ی ۳ غلط است، چون JavaScript تک‌رشته‌ای است و async/await هیچ thread جدیدی نمی‌سازد. گزینه‌ی ۴ هم غلط است؛ async/await بخشی از خودِ زبان (ES2017) است و در همه‌ی مرورگرهای امروزی کار می‌کند.

  - level: easy
