      - line: 10
      - line: 0
      - line: 6
    answer: 4
    explain: |
      `await` فقط داخل تابع `async` مجاز است و `start` یک تابع معمولی است؛ پس خط ۶ خطای `SyntaxError: await is only valid in async functions and the top level bodies of modules` می‌دهد. این خطا هنگام خواندنِ (parse) فایل پیدا می‌شود، یعنی هیچ خطی اجرا نمی‌شود؛ نه خط ۱۰ (`start()`) به اجرا می‌رسد و نه خط ۲. برای رفع خطا کافی است بنویسیم `async function start()`.

